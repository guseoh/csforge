spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 20MB
  application:
    name: csforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/csforge}
    username: ${DB_USERNAME:csforge}
    password: ${DB_PASSWORD:csforge}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:2000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${CSFORGE_AI_MODEL:llama3.2}
        temperature: ${CSFORGE_AI_TEMPERATURE:0.2}
        keep-alive: ${CSFORGE_AI_KEEP_ALIVE:5m}
      init:
        pull-model-strategy: never
    retry:
      max-attempts: ${CSFORGE_AI_PROVIDER_MAX_ATTEMPTS:1}
      on-client-errors: false
  http:
    clients:
      connect-timeout: ${CSFORGE_AI_CONNECT_TIMEOUT:2s}
      read-timeout: ${CSFORGE_AI_READ_TIMEOUT:2m}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # The apply endpoint accepts up to 100 files plus the previewDigest form field.
    max-part-count: 101

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
      show-components: always
      show-details: when_authorized
csforge:
  time-zone: ${CSFORGE_TIME_ZONE:Asia/Seoul}
  ai:
    # AI is opt-in: enable CSFORGE_AI_ENABLED and SPRING_AI_MODEL_CHAT=ollama together.
    enabled: ${CSFORGE_AI_ENABLED:false}
    provider: ollama
    model: ${CSFORGE_AI_MODEL:llama3.2}
    prompt-version: v1
    schema-version: v1
    max-processing-attempts: ${CSFORGE_AI_MAX_PROCESSING_ATTEMPTS:3}
    retry-initial-delay: ${CSFORGE_AI_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${CSFORGE_AI_RETRY_MAX_DELAY:5m}
    processing-lease: ${CSFORGE_AI_PROCESSING_LEASE:5m}
    processor-delay-ms: ${CSFORGE_AI_PROCESSOR_DELAY_MS:1000}
    processor-batch-size: ${CSFORGE_AI_PROCESSOR_BATCH_SIZE:20}
