    scope: "shared memory, private/shared cache, coherence, false sharing과 hardware ordering을 다룬다."
    boundary: "hardware coherence와 ordering을 다루며 Java Memory Model happens-before는 별도 계약으로 구분한다."
    concepts:
      - key: computer-architecture.core.multicore-memory.multicore-shared-memory
        title: "Multicore Shared Memory"
        order: 10
        level: 1
        objective: "여러 core가 같은 memory를 읽고 쓰는 구조를 설명한다."
