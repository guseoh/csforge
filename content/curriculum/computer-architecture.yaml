      - key: computer-architecture.core.device-io.memory-mapped-io
        title: "Memory-Mapped I/O"
        order: 40
        level: 1
        objective: "device register를 주소 공간에 매핑하는 접근 경계를 설명한다."
        density: CORE
        visualization: TEXT
      - key: computer-architecture.core.device-io.dma
        title: "DMA"
        order: 50
        level: 2
        objective: "DMA controller가 CPU 대신 memory 전송을 수행하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: computer-architecture.core.device-io.device-cpu-memory-path
        title: "Device, CPU and Memory Path"
        order: 60
        level: 2
        objective: "device·memory·CPU의 data path와 완료 interrupt를 비교한다."
        density: CORE
        visualization: DIAGRAM
  - key: computer-architecture.core.performance
