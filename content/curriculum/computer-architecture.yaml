        visualization: DIAGRAM
      - key: computer-architecture.core.virtual-memory-hardware.page-size-huge-page
        title: "Page Size and Huge Page"
        order: 70
        level: 3
        objective: "page size가 TLB reach와 단편화에 미치는 trade-off를 추론한다."
        density: STANDARD
        visualization: DIAGRAM
  - key: computer-architecture.core.multicore-memory
    title: "Multicore and Memory Interaction"
