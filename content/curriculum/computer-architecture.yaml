      - key: computer-architecture.core.performance.microbenchmark-boundary
        title: "Microbenchmark Boundary"
        order: 70
        level: 3
        objective: "단일 benchmark 수치로 bottleneck을 단정할 수 없는 이유를 분석한다."
        density: CORE
        visualization: TEXT
