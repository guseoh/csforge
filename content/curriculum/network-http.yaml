schemaVersion: 2
area:
  key: network-http
  title: "네트워크와 HTTP"
  baseline: "네트워크 계층화, 로컬 전달, IP, 전송 계층, DNS, TLS와 HTTP 의미 체계"
  contentKeyPrefix: network-http.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: "각 계층의 보장·상태·실패 경계와 백엔드 연결을 섞지 않고 설명한다."
  question:
    hardRule: "패킷·메시지 상태와 제약, 실패 경로 또는 재시도 trade-off를 함께 추론한다."
  visualization:
    values: [NONE, TEXT, DIAGRAM]
topics:
  - key: network-http.core.layering
    title: "네트워크 계층화"
    order: 10
    scope: "링크·네트워크·전송·애플리케이션 계층과 캡슐화를 다룬다."
    boundary: "계층의 책임을 구분하며 특정 프로토콜 구현의 세부는 해당 주제에서 다룬다."
    concepts:
      - key: network-http.core.layering.why-layering
        title: "계층화가 필요한 이유"
        order: 10
        level: 1
        objective: "계층화가 변경 영향과 책임 범위를 줄이는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.layering.link-network-transport-application
        title: "링크·네트워크·전송·애플리케이션 계층"
        order: 20
        level: 1
        objective: "각 계층이 담당하는 주소 지정·전달·신뢰성의 차이를 비교한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.layering.encapsulation
        title: "캡슐화(Encapsulation)"
        order: 30
        level: 1
        objective: "상위 계층 메시지가 하위 계층의 헤더와 페이로드로 감싸지는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.layering.decapsulation
        title: "역캡슐화(Decapsulation)"
        order: 40
        level: 1
        objective: "수신 호스트가 각 계층 헤더를 해석하고 상위 페이로드를 넘기는 흐름을 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.layering.frame-packet-segment-message
        title: "프레임·패킷·세그먼트·메시지"
        order: 50
        level: 1
        objective: "계층별 데이터 단위와 각 헤더가 적용되는 경계를 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.layering.mtu
        title: "MTU와 패킷 크기"
        order: 60
        level: 2
        objective: "링크 MTU가 패킷 크기·단편화·전송 실패에 미치는 영향을 설명한다."
        density: STANDARD
        visualization: TEXT
  - key: network-http.core.local-delivery
    title: "로컬 네트워크 전달"
    order: 20
    scope: "MAC 주소, 스위치, 브로드캐스트 도메인, ARP, IPv6 NDP와 기본 게이트웨이를 다룬다."
    boundary: "같은 로컬 링크 안의 전달과 다음 홉 탐색을 다루며 전역 라우팅은 IP 주제에서 다룬다."
    concepts:
      - key: network-http.core.local-delivery.mac-address
        title: "MAC 주소"
        order: 10
        level: 1
        objective: "로컬 링크에서 인터페이스를 식별하는 MAC 주소의 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.local-delivery.switch-forwarding
        title: "스위치의 프레임 전달"
        order: 20
        level: 1
        objective: "MAC 주소 테이블 학습과 출력 포트 선택 과정을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.broadcast-domain
        title: "브로드캐스트 도메인"
        order: 30
        level: 1
        objective: "브로드캐스트가 도달하는 범위와 네트워크를 나누는 이유를 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.arp
        title: "ARP"
        order: 40
        level: 1
        objective: "IPv4 다음 홉 주소에 대응하는 MAC 주소를 요청·응답으로 찾는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.ipv6-ndp
        title: "IPv6 이웃 탐색(NDP)"
        order: 50
        level: 2
        objective: "IPv6 이웃 탐색과 라우터 광고(Router Advertisement)의 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.local-delivery.default-gateway
        title: "기본 게이트웨이"
        order: 60
        level: 1
        objective: "로컬 네트워크 밖의 목적지 패킷을 다음 홉 게이트웨이에 보내는 판단을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.ip-routing
    title: "IP 주소 지정과 라우팅"
    order: 30
    scope: "IPv4/IPv6 주소, 서브넷, 라우팅 테이블, 패킷 전달, TTL과 ICMP를 다룬다."
    boundary: "IP의 최선형(best-effort) 전달을 다루며 TCP 신뢰성은 전송 계층 주제에서 다룬다."
    concepts:
      - key: network-http.core.ip-routing.ipv4-address
        title: "IPv4 주소"
        order: 10
        level: 1
        objective: "IPv4 주소의 네트워크 부분과 호스트 부분을 설명한다."
        density: CORE
        visualization: NONE
      - key: network-http.core.ip-routing.prefix-subnet
        title: "CIDR prefix와 서브넷"
        order: 20
        level: 1
        objective: "CIDR prefix가 주소 범위와 같은 네트워크 여부를 결정하는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.private-public-ip
        title: "사설 IP와 공인 IP"
        order: 30
        level: 1
        objective: "공인 주소와 사설 주소의 인터넷 도달 가능성 경계를 설명한다."
        density: STANDARD
        visualization: NONE
      - key: network-http.core.ip-routing.routing-table
        title: "라우팅 테이블"
        order: 40
        level: 1
        objective: "목적지 prefix와 다음 홉·출력 인터페이스의 관계를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.longest-prefix-match
        title: "최장 접두사 일치(Longest-Prefix Match)"
        order: 50
        level: 2
        objective: "여러 경로 중 목적지와 가장 구체적으로 일치하는 prefix를 선택하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.ip-routing.router-forwarding
        title: "라우터의 패킷 전달"
        order: 60
        level: 2
        objective: "라우터가 IP 헤더를 확인하고 TTL을 감소시킨 뒤 다음 링크로 전달하는 과정을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.ttl-hop-limit
        title: "TTL과 Hop Limit"
        order: 70
        level: 2
        objective: "홉 수 제한이 라우팅 루프를 끝내고 만료 오류를 만드는 과정을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.ip-routing.icmp
        title: "ICMP 오류·진단 메시지"
        order: 80
        level: 1
        objective: "IP 전달 오류와 진단 정보를 전달하는 ICMP의 역할을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.ip-routing.ipv6-basics
        title: "IPv6 주소와 전달 기초"
        order: 90
        level: 1
        objective: "IPv6 주소 길이·표기와 이웃 탐색의 경계를 설명한다."
        density: STANDARD
        visualization: TEXT
  - key: network-http.core.port-nat
    title: "포트, 소켓 종단점과 NAT"
    order: 40
    scope: "전송 계층 포트, 소켓 종단점, 연결 식별 튜플, NAT/PAT와 외부 도달성을 다룬다."
    boundary: "주소·포트 변환을 다루며 방화벽의 접근 제어 정책 자체와는 구분한다."
    concepts:
      - key: network-http.core.port-nat.transport-port
        title: "전송 계층 포트"
        order: 10
        level: 1
        objective: "한 호스트의 여러 전송 계층 종단점을 포트가 구분하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.socket-endpoint
        title: "소켓 종단점"
        order: 20
        level: 1
        objective: "IP 주소·포트·전송 프로토콜 조합으로 통신 종단점을 표현한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.connection-tuple
        title: "연결 식별 튜플"
        order: 30
        level: 2
        objective: "양 끝의 IP 주소·포트와 전송 프로토콜 조합으로 연결 흐름을 구분하는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.nat
        title: "네트워크 주소 변환(NAT)"
        order: 40
        level: 1
        objective: "사설 주소와 공인 주소를 패킷 경계에서 변환하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.pat
        title: "주소·포트 변환(PAT)"
        order: 50
        level: 2
        objective: "포트까지 변환해 여러 내부 종단점이 하나의 공인 IP를 공유하는 원리를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.nat-mapping
        title: "NAT 매핑과 만료"
        order: 60
        level: 2
        objective: "외부로 나가는 연결 흐름의 NAT 매핑이 생성·유지·만료되는 상태를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.inbound-reachability
        title: "외부에서 내부로 연결하기"
        order: 70
        level: 2
        objective: "외부에서 먼저 들어온 패킷이 기존 NAT 매핑 없이 내부 종단점에 도달하기 어려운 이유를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.port-nat.nat-vs-firewall
        title: "NAT와 방화벽의 차이"
        order: 80
        level: 2
        objective: "주소 변환과 명시적인 트래픽 허용·차단 정책의 책임을 구분한다."
        density: CORE
        visualization: TEXT
  - key: network-http.core.dns
    title: "DNS"
    order: 50
    scope: "도메인 계층, 리졸버, 권한 서버, DNS 레코드, TTL과 조회 실패를 다룬다."
    boundary: "이름을 IP 주소로 해석하는 프로토콜을 다루며 연결 성공이나 HTTP 서비스 상태까지 보장하지 않는다."
    concepts:
      - key: network-http.core.dns.domain-hierarchy
        title: "도메인 계층 구조"
        order: 10
        level: 1
        objective: "루트·TLD·권한 zone으로 나뉘는 DNS 이름 공간을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.dns.stub-recursive-resolver
        title: "스텁 리졸버와 재귀 리졸버"
        order: 20
        level: 1
        objective: "애플리케이션 가까이의 스텁 리졸버와 재귀 리졸버의 역할을 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.authoritative-server
        title: "권한 있는 DNS 서버"
        order: 30
        level: 1
        objective: "zone의 원본 레코드에 답하는 권한 서버와 재귀 캐시의 차이를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.iterative-resolution
        title: "반복 조회 과정"
        order: 40
        level: 2
        objective: "리졸버가 루트·TLD·권한 서버의 위임 정보를 따라가는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.dns.a-aaaa
        title: "A·AAAA 레코드"
        order: 50
        level: 1
        objective: "A 레코드의 IPv4 주소와 AAAA 레코드의 IPv6 주소 의미를 구분한다."
        density: CORE
        visualization: NONE
      - key: network-http.core.dns.cname
        title: "CNAME 레코드"
        order: 60
        level: 1
        objective: "별칭이 정식 이름(canonical name)으로 이어지는 레코드 연결을 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.dns.ns-mx
        title: "NS·MX 레코드"
        order: 70
        level: 1
        objective: "zone 위임을 나타내는 NS와 메일 전달 대상을 나타내는 MX를 구분한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.dns.dns-ttl-cache
        title: "DNS TTL과 캐시"
        order: 80
        level: 2
        objective: "TTL이 재귀 리졸버의 캐시 유효 시간과 변경 전파 지연을 결정하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.negative-cache
        title: "부정 응답 캐시"
        order: 90
        level: 2
        objective: "존재하지 않는 이름·레코드의 실패도 일정 시간 캐시되는 이유와 영향을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.dns.dns-failure
        title: "DNS 조회 실패"
        order: 100
        level: 2
        objective: "NXDOMAIN·SERVFAIL·timeout을 원인별로 구분하고 재시도 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.tcp
    title: "TCP"
    order: 60
    scope: "바이트 스트림, 연결 수립, 시퀀스·ACK, 재전송, 윈도, 혼잡 제어와 연결 종료를 다룬다."
    boundary: "TCP가 제공하는 전송 보장을 다루며 애플리케이션 메시지 경계는 HTTP/API 계약과 구분한다."
    concepts:
      - key: network-http.core.tcp.tcp-byte-stream
        title: "TCP 바이트 스트림"
        order: 10
        level: 1
        objective: "메시지 경계를 보존하지 않는 순서 있는 바이트 스트림의 의미를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.three-way-handshake
        title: "TCP 3방향 핸드셰이크"
        order: 20
        level: 1
        objective: "SYN·SYN-ACK·ACK로 양 끝의 연결 상태와 초기 시퀀스 번호를 맞추는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.sequence-number
        title: "TCP 시퀀스 번호"
        order: 30
        level: 2
        objective: "바이트 단위 시퀀스 번호로 순서·중복·재조립을 추적하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.acknowledgement
        title: "확인 응답(ACK)"
        order: 40
        level: 2
        objective: "누적 ACK가 수신자가 다음에 기대하는 바이트 번호를 나타내는 이유를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.retransmission
        title: "재전송"
        order: 50
        level: 2
        objective: "손실로 판단한 뒤 확인되지 않은 데이터를 다시 보내는 조건을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.rto
        title: "재전송 타임아웃(RTO)"
        order: 60
        level: 2
        objective: "RTT 추정과 재전송 타임아웃이 늦은 ACK와 손실 판단에 미치는 영향을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.tcp.sliding-window
        title: "슬라이딩 윈도"
        order: 70
        level: 2
        objective: "ACK를 기다리는 동안 여러 바이트 범위를 전송할 수 있는 윈도 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.flow-control
        title: "TCP 흐름 제어"
        order: 80
        level: 2
        objective: "수신자가 광고한 윈도가 수신 버퍼를 넘는 전송을 제한하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.congestion-control
        title: "TCP 혼잡 제어"
        order: 90
        level: 2
        objective: "네트워크 혼잡 신호와 용량 추정에 따라 전송량을 조절하는 목적을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.connection-teardown
