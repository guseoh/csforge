    scope: "HTTP/1.x 연결, 지속 연결, HTTP/2 스트림과 HTTP/3·QUIC을 다룬다."
    boundary: "HTTP 전송 방식의 변화를 다루며 TLS·QUIC의 암호화 원리 자체는 TLS 주제에서 다룬다."
    concepts:
      - key: network-http.core.http-versions.http10-connection
        title: "HTTP/1.0 연결"
        order: 10
        level: 1
        objective: "요청마다 새 연결을 만들 때의 비용과 응답 경계 판단을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-versions.http11-persistent
        title: "HTTP/1.1 지속 연결"
        order: 20
        level: 1
        objective: "하나의 TCP 연결을 여러 HTTP 요청에 재사용하는 방식과 Host 요구를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-versions.keep-alive
        title: "지속 연결과 Keep-Alive"
        order: 30
        level: 1
        objective: "유휴 연결 유지가 핸드셰이크 비용과 소켓·NAT 자원 점유에 미치는 영향을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-versions.http11-pipelining
        title: "HTTP/1.1 파이프라이닝"
        order: 40
        level: 2
        objective: "응답 순서 제약이 HTTP/1.1 파이프라이닝의 HOL 문제를 만드는 이유를 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.http-versions.http2-stream
        title: "HTTP/2 스트림"
        order: 50
        level: 2
        objective: "하나의 연결 안에서 독립적으로 식별되는 HTTP/2 스트림과 프레임을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-versions.http2-multiplexing
        title: "HTTP/2 멀티플렉싱"
        order: 60
        level: 2
        objective: "여러 스트림의 프레임을 번갈아 전송해 HTTP/1.1 응답 순서 HOL을 줄이는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-versions.header-compression
        title: "HTTP 헤더 압축과 HPACK"
        order: 70
        level: 2
        objective: "반복되는 HTTP 헤더 전송량을 줄이는 압축 상태와 민감 정보 압축의 위험 경계를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-versions.quic
        title: "QUIC 전송 계층"
        order: 80
        level: 2
        objective: "UDP 위에서 암호화된 연결과 독립 스트림을 제공하는 QUIC의 역할을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-versions.http3
        title: "HTTP/3와 QUIC"
        order: 90
        level: 2
        objective: "HTTP/3가 QUIC 스트림 위에 HTTP 요청·응답 의미를 매핑하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-versions.transport-head-of-line
        title: "전송 계층의 HOL 차단"
        order: 100
        level: 2
        objective: "TCP 연결 수준 HOL과 HTTP 스트림 멀티플렉싱이 해결하는 범위를 비교한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.http-cache
    title: "HTTP 캐싱"
    order: 140
    scope: "응답 신선도, Cache-Control, 검증자, 조건부 요청과 개인·공유 캐시를 다룬다."
    boundary: "HTTP 캐시 의미를 다루며 Redis를 이용한 cache-aside 구조는 Cache 영역에서 다룬다."
    concepts:
      - key: network-http.core.http-cache.freshness
        title: "응답 신선도(Freshness)"
        order: 10
        level: 1
        objective: "저장된 HTTP 응답이 fresh인지 stale인지 판단하는 시간 모델을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-cache.cache-control
        title: "Cache-Control 지시어"
        order: 20
        level: 1
        objective: "max-age·no-cache·no-store 등 주요 캐시 지시어의 의미를 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-cache.expires
        title: "Expires와 만료 시각"
        order: 30
        level: 1
        objective: "절대 시각 기반 만료와 Cache-Control의 우선순위를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-cache.etag
        title: "ETag 검증자"
        order: 40
        level: 2
        objective: "선택된 표현 데이터의 버전을 비교하는 검증자로 ETag를 사용하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-cache.last-modified
        title: "Last-Modified 검증자"
        order: 50
        level: 1
        objective: "수정 시각 기반 검증자의 시간 정밀도와 시계 의존 한계를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-cache.if-none-match
        title: "If-None-Match 조건부 요청"
        order: 60
        level: 2
        objective: "ETag 조건부 요청이 304 또는 새로운 표현 데이터 전송으로 이어지는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-cache.if-modified-since
        title: "If-Modified-Since 조건부 요청"
        order: 70
        level: 2
        objective: "Last-Modified 기반 조건부 요청과 날짜 비교 방식의 한계를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-cache.304
        title: "304 Not Modified 응답"
        order: 80
        level: 1
        objective: "새 본문 없이 저장된 표현 데이터를 재사용하게 하는 304 응답 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-cache.private-shared-cache
        title: "개인 캐시와 공유 캐시"
        order: 90
        level: 2
        objective: "한 사용자만 사용하는 캐시와 여러 사용자가 공유하는 캐시의 개인정보 경계를 비교한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-cache.intermediary-cache
        title: "중간 캐시의 재사용 판단"
        order: 100
        level: 2
        objective: "프록시·CDN 캐시가 원본 서버와 클라이언트 사이에서 신선도와 재검증을 판단하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.http-state-intermediary
    title: "HTTP 상태와 중개자"
    order: 150
    scope: "쿠키, 정방향·역방향 프록시, 게이트웨이, 전달 헤더와 CDN을 다룬다."
    boundary: "HTTP 상태 전달과 중개자 동작을 다루며 CORS·CSRF·XSS 보안 정책 자체는 Security 영역에서 다룬다."
    concepts:
      - key: network-http.core.http-state-intermediary.cookie
        title: "Cookie로 상태 이어가기"
        order: 10
        level: 1
        objective: "클라이언트가 다음 요청에 상태 식별값을 다시 보내 서버 상태와 연결하는 쿠키 흐름을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-state-intermediary.set-cookie
        title: "Set-Cookie로 쿠키 저장하기"
        order: 20
        level: 1
        objective: "서버 응답의 Set-Cookie가 사용자 에이전트의 쿠키 저장소를 갱신하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-state-intermediary.cookie-scope
        title: "쿠키의 전송 범위와 SameSite"
        order: 30
        level: 2
        objective: "Domain·Path·Secure·SameSite가 쿠키 전송 범위를 서로 다른 축으로 제한하는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-state-intermediary.proxy
        title: "정방향 프록시"
        order: 40
        level: 1
        objective: "클라이언트를 대신해 외부 목적지로 요청을 전달하는 정방향 프록시의 위치와 역할을 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.http-state-intermediary.reverse-proxy
        title: "역방향 프록시"
        order: 50
        level: 1
        objective: "원본 서버 앞에서 들어오는 요청을 받아 백엔드로 전달하는 역방향 프록시의 역할을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-state-intermediary.gateway
        title: "게이트웨이의 중계 역할"
        order: 60
        level: 2
        objective: "프로토콜 변환·라우팅·정책 적용을 경계에서 수행하는 게이트웨이의 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-state-intermediary.forwarded-header
        title: "Forwarded 헤더"
        order: 70
        level: 2
        objective: "중개자가 원래 호스트·scheme·클라이언트 정보를 다음 홉에 전달하는 표준 Forwarded 헤더를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.http-state-intermediary.x-forwarded
        title: "X-Forwarded-* 헤더"
        order: 80
        level: 2
        objective: "관행적으로 사용하는 X-Forwarded-* 헤더 체인과 위조 위험을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.http-state-intermediary.trusted-proxy-boundary
        title: "신뢰하는 프록시 경계"
        order: 90
        level: 3
        objective: "어느 프록시가 기록한 전달 정보를 신뢰할지 네트워크 출처와 홉 정책으로 결정하는 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.http-state-intermediary.cdn-http-intermediary
        title: "CDN의 HTTP 중개와 캐시"
        order: 100
        level: 2
        objective: "CDN 엣지 캐시와 원본 서버 조회가 HTTP 요청·응답 경로와 신선도 판단을 바꾸는 지점을 설명한다."
        density: CORE
        visualization: DIAGRAM
