      - key: network-http.core.request-journey.url-components
        title: "URL Components"
        order: 10
        level: 1
        objective: "scheme·authority·path·query·fragment의 처리 주체를 구분한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.request-journey.origin
        title: "Origin"
        order: 20
        level: 1
        objective: "scheme·host·port tuple로 origin을 정의하고 비교한다."
