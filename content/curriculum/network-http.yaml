schemaVersion: 2
area:
  key: network-http
  title: "Network & HTTP"
  baseline: "layering, local delivery, IP, transport, DNS, TLS and HTTP semantics"
  contentKeyPrefix: network-http.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: "각 계층의 보장·상태·실패 경계와 backend 연결을 섞지 않고 설명한다."
  question:
    everyConcept:
      minimumByDifficulty: { EASY: 1, MEDIUM: 1, HARD: 1 }
      minimumTotal: 3
    hardRule: "packet/message 상태와 제약, 실패 경로 또는 재시도 trade-off를 함께 추론한다."
  visualization:
    values: [NONE, TEXT, DIAGRAM]
topics:
  - key: network-http.core.layering
    title: "Network Layering"
    order: 10
    scope: "link·network·transport·application 계층과 encapsulation을 다룬다."
    boundary: "계층의 책임을 구분하며 특정 protocol 구현의 모든 세부는 각 topic에 둔다."
    concepts:
      - key: network-http.core.layering.why-layering
        title: "Why Layering"
        order: 10
        level: 1
        objective: "계층화가 변경 영향과 책임을 줄이는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.layering.link-network-transport-application
        title: "Link, Network, Transport and Application"
        order: 20
        level: 1
        objective: "각 계층의 주소·전달·신뢰성 보장을 비교한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.layering.encapsulation
        title: "Encapsulation"
        order: 30
        level: 1
        objective: "상위 message가 하위 header와 payload로 감싸지는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.layering.decapsulation
        title: "Decapsulation"
        order: 40
        level: 1
        objective: "수신 host가 각 header를 소비해 상위 payload를 전달하는 흐름을 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.layering.frame-packet-segment-message
        title: "Frame, Packet, Segment and Message"
        order: 50
        level: 1
        objective: "계층별 데이터 단위와 header 경계를 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.layering.mtu
        title: "MTU"
        order: 60
        level: 2
        objective: "link MTU가 packet 크기·fragmentation·전송 실패에 미치는 영향을 설명한다."
        density: STANDARD
        visualization: TEXT
  - key: network-http.core.local-delivery
    title: "Local Network Delivery"
    order: 20
    scope: "MAC, switch, broadcast domain, ARP, IPv6 NDP와 gateway를 다룬다."
    boundary: "같은 local link 전달과 next hop discovery를 다루며 global routing은 IP topic에 둔다."
    concepts:
      - key: network-http.core.local-delivery.mac-address
        title: "MAC Address"
        order: 10
        level: 1
        objective: "link-local interface 식별자인 MAC의 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.local-delivery.switch-forwarding
        title: "Switch Forwarding"
        order: 20
        level: 1
        objective: "MAC table 학습과 port forwarding 상태를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.broadcast-domain
        title: "Broadcast Domain"
        order: 30
        level: 1
        objective: "broadcast가 도달하는 범위와 segment 분할의 이유를 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.arp
        title: "ARP"
        order: 40
        level: 1
        objective: "IPv4 next-hop address를 MAC으로 찾는 request/reply 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.local-delivery.ipv6-ndp
        title: "IPv6 NDP"
        order: 50
        level: 2
        objective: "IPv6 neighbor discovery와 router advertisement의 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.local-delivery.default-gateway
        title: "Default Gateway"
        order: 60
        level: 1
        objective: "외부 prefix packet을 next-hop gateway로 보내는 판단을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.ip-routing
    title: "IP Addressing and Routing"
    order: 30
    scope: "IPv4/IPv6 address, subnet, routing table, forwarding, TTL와 ICMP를 다룬다."
    boundary: "best-effort network forwarding을 다루며 TCP reliability는 transport topic에 둔다."
    concepts:
      - key: network-http.core.ip-routing.ipv4-address
        title: "IPv4 Address"
        order: 10
        level: 1
        objective: "IPv4 address와 network/host portion을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.ip-routing.prefix-subnet
        title: "Prefix and Subnet"
        order: 20
        level: 1
        objective: "CIDR prefix가 local 여부와 address block을 결정하는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.private-public-ip
        title: "Private and Public IP"
        order: 30
        level: 1
        objective: "routable address와 private address의 reachability 경계를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.ip-routing.routing-table
        title: "Routing Table"
        order: 40
        level: 1
        objective: "destination prefix와 next hop/interface의 관계를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.longest-prefix-match
        title: "Longest-Prefix Match"
        order: 50
        level: 2
        objective: "여러 route 중 가장 구체적인 prefix를 선택하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.ip-routing.router-forwarding
        title: "Router Forwarding"
        order: 60
        level: 2
        objective: "router가 header를 검사·감소·재전송하는 forwarding path를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.ip-routing.ttl-hop-limit
        title: "TTL and Hop Limit"
        order: 70
        level: 2
        objective: "hop count 수명이 loop를 제한하고 만료 오류를 만드는 과정을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.ip-routing.icmp
        title: "ICMP"
        order: 80
        level: 1
        objective: "IP delivery 오류와 진단 정보를 전달하는 ICMP의 역할을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.ip-routing.ipv6-basics
        title: "IPv6 Basics"
        order: 90
        level: 1
        objective: "IPv6 address 폭·표기와 neighbor discovery 경계를 설명한다."
        density: STANDARD
        visualization: TEXT
  - key: network-http.core.port-nat
    title: "Ports, Socket Endpoints and NAT"
    order: 40
    scope: "transport port, socket endpoint, connection tuple, NAT/PAT와 reachability를 다룬다."
    boundary: "주소·endpoint translation을 다루며 firewall policy 자체는 소유하지 않는다."
    concepts:
      - key: network-http.core.port-nat.transport-port
        title: "Transport Port"
        order: 10
        level: 1
        objective: "한 host의 여러 transport endpoint를 port가 구분하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.socket-endpoint
        title: "Socket Endpoint"
        order: 20
        level: 1
        objective: "IP·port·protocol 조합으로 통신 endpoint를 표현한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.connection-tuple
        title: "Connection Tuple"
        order: 30
        level: 2
        objective: "양 끝 address·port·protocol tuple로 flow를 식별하는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.nat
        title: "NAT"
        order: 40
        level: 1
        objective: "private address와 public address를 packet 경계에서 변환하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.pat
        title: "PAT"
        order: 50
        level: 2
        objective: "port까지 변환해 여러 내부 endpoint가 하나의 public IP를 공유하는 원리를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.port-nat.nat-mapping
        title: "NAT Mapping"
        order: 60
        level: 2
        objective: "outbound flow mapping의 생성·유지·timeout 상태를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.port-nat.inbound-reachability
        title: "Inbound Reachability"
        order: 70
        level: 2
        objective: "unsolicited inbound packet이 mapping 없이 도달하기 어려운 이유를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.port-nat.nat-vs-firewall
        title: "NAT versus Firewall"
        order: 80
        level: 2
        objective: "주소 변환과 명시적 traffic policy의 책임을 구분한다."
        density: CORE
        visualization: TEXT
  - key: network-http.core.dns
    title: "DNS"
    order: 50
    scope: "domain hierarchy, resolver, authoritative server, record, TTL과 failure를 다룬다."
    boundary: "이름을 address로 찾는 protocol을 다루며 connection·HTTP health는 보장하지 않는다."
    concepts:
      - key: network-http.core.dns.domain-hierarchy
        title: "Domain Hierarchy"
        order: 10
        level: 1
        objective: "root·TLD·authoritative zone으로 나뉜 namespace를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.dns.stub-recursive-resolver
        title: "Stub and Recursive Resolver"
        order: 20
        level: 1
        objective: "application stub과 recursive resolver의 역할을 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.authoritative-server
        title: "Authoritative Server"
        order: 30
        level: 1
        objective: "zone의 canonical record을 답하는 서버와 cache의 차이를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.iterative-resolution
        title: "Iterative Resolution"
        order: 40
        level: 2
        objective: "resolver가 root·TLD·authoritative referral을 따라가는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.dns.a-aaaa
        title: "A and AAAA Records"
        order: 50
        level: 1
        objective: "IPv4 A와 IPv6 AAAA answer의 의미를 구분한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.cname
        title: "CNAME"
        order: 60
        level: 1
        objective: "별칭이 canonical name으로 이어지는 record chain을 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: network-http.core.dns.ns-mx
        title: "NS and MX"
        order: 70
        level: 1
        objective: "zone delegation과 mail delivery destination을 NS/MX로 구분한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.dns.dns-ttl-cache
        title: "DNS TTL and Cache"
        order: 80
        level: 2
        objective: "TTL이 resolver cache freshness와 변경 전파 지연을 결정하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.dns.negative-cache
        title: "Negative Cache"
        order: 90
        level: 2
        objective: "없는 이름의 실패도 일정 시간 cache되는 이유와 위험을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.dns.dns-failure
        title: "DNS Failure"
        order: 100
        level: 2
        objective: "NXDOMAIN·SERVFAIL·timeout을 원인별로 구분하고 retry 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.tcp
    title: "TCP"
    order: 60
    scope: "byte stream, handshake, sequence/ACK, retransmission, window, congestion과 teardown을 다룬다."
    boundary: "TCP transport guarantee를 다루며 application message framing은 별도 HTTP/API 계약이다."
    concepts:
      - key: network-http.core.tcp.tcp-byte-stream
        title: "TCP Byte Stream"
        order: 10
        level: 1
        objective: "message 경계 없는 ordered byte stream의 의미를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.three-way-handshake
        title: "Three-Way Handshake"
        order: 20
        level: 1
        objective: "SYN·SYN-ACK·ACK로 양 끝 상태와 initial sequence를 합의하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.sequence-number
        title: "Sequence Number"
        order: 30
        level: 2
        objective: "byte sequence로 순서·중복·재조립을 추적하는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.acknowledgement
        title: "Acknowledgement"
        order: 40
        level: 2
        objective: "누적 ACK가 다음 기대 byte를 나타내는 이유를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.retransmission
        title: "Retransmission"
        order: 50
        level: 2
        objective: "loss 판단 후 unacknowledged data를 다시 보내는 조건을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.rto
        title: "Retransmission Timeout"
        order: 60
        level: 2
        objective: "RTT 추정과 timeout이 늦은 ACK·loss를 구분하는 방식을 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.tcp.sliding-window
        title: "Sliding Window"
        order: 70
        level: 2
        objective: "ACK 전 여러 byte를 전송하는 sequence window를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.flow-control
        title: "Flow Control"
        order: 80
        level: 2
        objective: "receiver advertised window가 수신 buffer overflow를 막는 방식을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tcp.congestion-control
        title: "Congestion Control"
        order: 90
        level: 2
        objective: "network capacity 추정에 따라 sending rate를 조절하는 목적을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.connection-teardown
        title: "Connection Teardown"
        order: 100
        level: 1
        objective: "FIN·ACK 교환과 half-close 상태를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.tcp.time-wait
        title: "TIME_WAIT"
        order: 110
        level: 2
        objective: "지연 segment와 마지막 ACK 재전송을 처리하기 위해 기다리는 이유를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: network-http.core.tcp.tcp-head-of-line
        title: "TCP Head-of-Line Blocking"
        order: 120
        level: 2
        objective: "앞선 loss가 뒤 byte 전달을 막는 stream-level HOL을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.udp
    title: "UDP"
