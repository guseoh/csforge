        visualization: TEXT
      - key: network-http.core.request-journey.dns-to-route
        title: "DNS to Route"
        order: 30
        level: 1
        objective: "hostname이 address와 next-hop route로 이어지는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: network-http.core.request-journey.transport-establishment
        title: "Transport Establishment"
        order: 40
        level: 1
        objective: "TCP/QUIC endpoint가 연결 상태를 만드는 시점을 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.request-journey.tls-before-http
        title: "TLS before HTTP"
