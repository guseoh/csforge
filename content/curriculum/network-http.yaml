        visualization: TEXT
      - key: network-http.core.tls.symmetric-session-key
        title: "Symmetric Session Key"
        order: 70
        level: 1
        objective: "handshake 후 symmetric key로 payload를 암호화하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: network-http.core.tls.tls-termination
        title: "TLS Termination"
        order: 80
        level: 2
        objective: "proxy에서 TLS를 종료할 때 client-backend trust boundary가 바뀌는 점을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.request-journey
    title: "URL to HTTP Request"
    order: 90
    scope: "URL, origin, DNS·route·transport·TLS와 HTTP request delivery를 한 흐름으로 다룬다."
    boundary: "요청 경로의 계층 연결을 다루며 각 계층의 상세 semantics는 해당 topic에 둔다."
