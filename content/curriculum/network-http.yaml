        visualization: TEXT
      - key: network-http.core.udp.application-reliability
        title: "Application Reliability over UDP"
        order: 50
        level: 2
        objective: "sequence·ACK·retry를 application이 직접 설계할 때의 비용을 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: network-http.core.tls
    title: "TLS"
    order: 80
    scope: "confidentiality, certificate, PKI, hostname verification, handshake와 termination을 다룬다."
    boundary: "channel authentication/encryption을 다루며 HTTP authorization 정책은 소유하지 않는다."
