schemaVersion: 2
area:
  key: backend-engineering
  title: "백엔드 엔지니어링(Backend Engineering)"
  baseline: Java/Spring 백엔드 실무
  contentKeyPrefix: backend.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: API 요청에서 시작해 애플리케이션·도메인·영속성·외부 시스템 경계와 상태 변화, 실패·복구, 운영 판단까지 이어지는 설명형 문단으로 작성한다.
  question:
    reviewRule: topicDifficultyCoverage와 areaTypeCoverage는 Topic과 LearningArea 전체를 검토하는 기준이며 Concept별 quota가 아니다.
    topicDifficultyCoverage: [EASY, MEDIUM, HARD]
    areaTypeCoverage: [MULTIPLE_CHOICE, SHORT_ANSWER, DESCRIPTIVE, SCENARIO]
    hardRule: 구체적인 요청, DB 상태, 동시 실행 순서, timeout/retry, batch checkpoint, migration 단계, 운영 지표 중 하나 이상을 제시한다.
    shortAnswerRule: 짧고 결정적으로 채점 가능한 값·API·상태를 묻고, 원인과 결과 설명이 필요하면 DESCRIPTIVE 또는 SCENARIO를 사용한다.
  architecture:
    dependency: api -> application -> domain
    rule: 인프라/JPA/프레임워크 세부가 도메인 정책을 대신하지 않도록 책임과 원본 데이터(source of truth)를 구분한다.
  visualization:
    values: [NONE, TEXT, DIAGRAM]
    rule: 요청 흐름, 트랜잭션 경계, 재시도·멱등성 경쟁, 배치 재시작, 마이그레이션 배포처럼 상태나 시간 순서가 중요한 곳에 사용한다.
topics:
- key: backend.core.layering
  title: 계층과 책임
  order: 10
  scope: 의존성 방향, 유스케이스 조정과 비즈니스 규칙, 인프라 경계를 다룬다.
  boundary: 계층 이름 자체보다 변경 책임과 의존성 방향을 기준으로 설명한다.
  concepts:
  - key: backend.core.layering.dependency-direction
    title: 의존성 방향(Dependency Direction)
    order: 10
    level: 1
    objective: API가 application에, application이 domain에 의존하되 domain이 HTTP/JPA 구현 세부를 몰라도 되는 이유를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.layering.orchestration-rule
    title: 유스케이스 조정과 비즈니스 규칙
    order: 20
    level: 1
    objective: 여러 협력자 호출과 트랜잭션 조정은 애플리케이션이, 엔티티·값 객체의 불변식과 상태 전이 규칙은 도메인이 소유하는 이유를 구분한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.layering.infrastructure-boundary
    title: 인프라 경계
    order: 30
    level: 1
    objective: DB·HTTP client·message broker 같은 외부 기술 표현을 내부 유스케이스·도메인 모델이 필요한 의미로 번역하는 경계를 설명한다.
    density: CORE
    visualization: TEXT
- key: backend.core.domain
  title: 도메인 모델링
  order: 20
  scope: 엔티티 식별자, 값 객체, 불변식과 생명주기를 다룬다.
  boundary: JPA annotation 편의가 도메인 모델의 생성·상태 전이 규칙을 결정하지 않도록 한다.
  concepts:
  - key: backend.core.domain.entity
    title: 엔티티와 식별자
    order: 10
    level: 1
    objective: 시간이 지나 속성이 변해도 같은 비즈니스 대상을 식별하는 객체와 DB row/JPA entity 표현을 구분한다.
    density: CORE
    visualization: NONE
  - key: backend.core.domain.value-object
    title: 값 객체(Value Object)
    order: 20
    level: 1
    objective: 식별자보다 값의 조합과 불변식으로 동등성을 판단하고, 반복되는 값 규칙을 불변 객체로 묶는 이유를 설명한다.
    density: CORE
    visualization: NONE
  - key: backend.core.domain.invariant-lifecycle
    title: 불변식과 생명주기
    order: 30
    level: 1
    objective: 유효한 생성, 허용된 상태 전이, 종료 상태 규칙을 의도가 드러나는 메서드로 보호하는 이유를 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.api
  title: API 계약 설계
  order: 30
  scope: 리소스·엔드포인트, HTTP 메서드·상태 코드, 계약 호환성을 다룬다.
  boundary: URI 모양보다 리소스 의미와 외부에서 관찰 가능한 계약을 우선한다.
  concepts:
  - key: backend.core.api.resource-endpoint
    title: 리소스와 엔드포인트
    order: 10
    level: 1
    objective: 클라이언트가 다루는 대상과 동작을 안정적인 URI와 요청·응답 계약으로 표현한다.
    density: CORE
    visualization: NONE
  - key: backend.core.api.methods-status
    title: HTTP 메서드와 상태 코드
    order: 20
    level: 1
    objective: safe/idempotent semantics와 생성·수정·삭제 결과, 검증 오류·충돌·미존재를 일관된 메서드와 상태 코드로 표현한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.api.compatibility
    title: API 계약 호환성
    order: 30
    level: 1
    objective: 기존 소비자가 의존하는 필드 의미·상태 코드·정렬을 깨지 않으며 호환 가능한 추가와 단계적 폐기를 설계한다.
    density: CORE
    visualization: TEXT
- key: backend.core.dto-validation-error
  title: DTO·검증·오류 처리
  order: 40
  scope: 요청·응답 DTO, 검증 계층, 오류 응답 계약을 다룬다.
  boundary: API DTO를 영속성 엔티티의 직렬화 화면으로 사용하지 않는다.
  concepts:
  - key: backend.core.dto-validation-error.dto-boundary
    title: 요청·응답 DTO
    order: 10
    level: 2
    objective: 외부 표현과 애플리케이션·도메인·영속성 모델을 분리해 과도한 입력 허용, 지연 로딩 직렬화, 우발적인 호환성 결합을 줄인다.
    density: CORE
    visualization: TEXT
  - key: backend.core.dto-validation-error.validation-layers
    title: 검증 계층과 책임
    order: 20
    level: 2
    objective: 요청 형식, 비즈니스 불변식, 권한, DB 제약이 서로 다른 실패를 막는 이유와 의도적인 중복의 의미를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.dto-validation-error.error-contract
    title: 오류 응답 계약
    order: 30
    level: 2
    objective: 안정적인 오류 코드·메시지·필드 오류·재시도 가능성·추적 정보를 클라이언트 계약으로 설계하면서 내부 예외와 민감 정보를 노출하지 않는다.
    density: CORE
    visualization: NONE
- key: backend.core.list
  title: 목록 API
  order: 50
  scope: 페이지네이션, 필터링·정렬, Cursor·Keyset을 API 관점에서 다룬다.
  boundary: DB index 선택은 Database 영역과 연결하되 API가 안정적인 정렬과 결과 크기 상한을 소유한다.
  concepts:
  - key: backend.core.list.pagination
    title: 페이지네이션과 목록 자원 상한
    order: 10
    level: 2
    objective: 무제한 목록 대신 페이지 크기 상한, 안정적인 정렬, 전체 건수 필요성을 제품·API 관점에서 설계한다.
    density: CORE
    visualization: NONE
  - key: backend.core.list.filter-sort
    title: 필터링과 정렬 계약
    order: 20
    level: 2
    objective: 허용 가능한 필터·정렬 필드와 연산을 명시하고 고유 보조 정렬 키를 포함한 결정적인 순서를 보장한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.list.cursor
    title: Cursor·Keyset 페이지네이션
    order: 30
    level: 2
    objective: 불투명한 cursor가 마지막 정렬 위치를 표현하고 데이터 변화 중 페이지 이동과 큰 OFFSET 비용을 줄이는 조건을 설명한다.
    density: CORE
    visualization: TEXT
- key: backend.core.idempotency
  title: 멱등성
  order: 60
  scope: 응답 유실과 반복 요청, 멱등성 키, 동시 경쟁과 만료를 다룬다.
  boundary: HTTP 메서드의 idempotent semantics와 애플리케이션 멱등성 키 프로토콜을 구분한다.
  concepts:
  - key: backend.core.idempotency.repeat-request
    title: 응답 유실과 반복 요청
    order: 10
    level: 2
    objective: 클라이언트 timeout 뒤 서버 처리 여부를 모르는 상황에서 무작정 재시도하면 중복 주문·결제가 생기는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.idempotency.idempotency-key
    title: 멱등성 키(Idempotency Key)와 결과 재사용
    order: 20
    level: 2
    objective: 같은 논리 작업의 식별자를 key·요청 fingerprint·처리 상태·결과에 연결해 중복 실행을 막는 상태 모델을 설계한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.idempotency.race-expiry
    title: 동일 키 경쟁과 만료 정책
    order: 30
    level: 3
    objective: 같은 key의 동시 요청, PROCESSING 상태, UNIQUE 제약, 동일 key의 다른 payload, 만료 뒤 재사용 정책을 트랜잭션 경계로 판단한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.concurrency-transaction
  title: 동시성과 트랜잭션
  order: 70
  scope: 갱신 손실, 낙관적 버전, 유스케이스 트랜잭션을 다룬다.
  boundary: DB isolation/lock 내부 구현은 Database 영역과 연결한다.
  concepts:
  - key: backend.core.concurrency-transaction.lost-update
    title: 갱신 손실(Lost Update)
    order: 10
    level: 2
    objective: 두 요청이 같은 값을 읽고 독립적으로 수정한 뒤 늦은 쓰기가 앞선 변경을 덮는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.concurrency-transaction.optimistic
    title: 낙관적 버전과 충돌 처리
    order: 20
    level: 2
    objective: 읽었던 version을 UPDATE 조건에 포함해 오래된 쓰기를 0-row update나 충돌로 감지하고 재시도·사용자 충돌 처리를 선택한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.concurrency-transaction.usecase-transaction
    title: 유스케이스와 트랜잭션 경계
    order: 30
    level: 2
    objective: 여러 repository 변경의 원자적 DB 경계를 애플리케이션 유스케이스에 두되 원격 API 호출을 긴 DB 트랜잭션 안에 무조건 포함하지 않는 이유를 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.external
  title: 외부 API 연동
  order: 80
  scope: 외부 호출 시간 제한, 원격 응답 검증, Circuit Breaker와 대체 처리를 다룬다.
  boundary: 장애 대응 패턴을 장애를 숨기는 만능 장치로 표현하지 않는다.
  concepts:
  - key: backend.core.external.timeouts
    title: 외부 호출 Timeout과 Deadline
    order: 10
    level: 2
    objective: 연결 수립과 응답 대기의 시간을 각각 제한하고, 제한 없는 대기가 스레드·연결 풀을 고갈시키는 흐름을 설명한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.external.remote-errors
    title: 원격 응답 검증과 오류 번역
    order: 20
    level: 2
    objective: HTTP 2xx만 믿지 않고 응답 구조·필수 필드·업무 상태를 검증하며 원격 실패를 내부 오류 모델로 번역한다.
    density: CORE
    visualization: NONE
  - key: backend.core.external.circuit-fallback
    title: Circuit Breaker와 대체 처리
    order: 30
    level: 3
    objective: 반복 실패를 감지해 잠시 호출을 차단하는 상태 전이와 사용자에게 허용 가능한 대체 결과·부분 결과를 구분한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.retry
  title: 재시도와 백오프
  order: 90
  scope: 일시적·영구 실패, 지수 백오프와 Jitter, Deadline과 멱등성을 다룬다.
  boundary: 재시도를 모든 예외의 기본 처리로 만들지 않는다.
  concepts:
  - key: backend.core.retry.transient-permanent
    title: 재시도 가능한 실패를 구분하는 기준
    order: 10
    level: 2
    objective: timeout·일시적 unavailable 같은 재시도 후보와 검증·인증·미존재처럼 반복해도 해결되지 않는 실패를 구분한다.
    density: CORE
    visualization: NONE
  - key: backend.core.retry.backoff-jitter
    title: Backoff와 Jitter로 재시도 부하 분산하기
    order: 20
    level: 2
    objective: 재시도 간격을 늘리고 무작위성을 섞어 동기화된 재시도 폭주를 완화하는 이유와 최대 지연·시도 횟수를 판단한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.retry.deadline
    title: Deadline과 재시도 예산
    order: 30
    level: 3
    objective: 개별 시도 timeout뿐 아니라 전체 작업 deadline과 시간 예산을 두고, 부수 효과가 있는 작업은 재실행 안전성을 확인한 뒤 재시도한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.bulk-batch
  title: 파일·대량·배치 처리
  order: 100
  scope: 파일 업로드, 대량 처리 단위, checkpoint와 재시작을 다룬다.
  boundary: 특정 batch framework API보다 입력 규모·원자성·복구 계약에 집중한다.
  concepts:
  - key: backend.core.bulk-batch.file-api
    title: 파일 업로드와 처리 경계
    order: 10
    level: 3
    objective: multipart 개수·크기 제한, streaming과 메모리 버퍼링, 내용·경로·접근 권한 검증을 자원 고갈과 신뢰 경계 관점에서 설계한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.bulk-batch.bulk-processing
    title: 대량 처리의 읽기·쓰기·트랜잭션 단위
    order: 20
    level: 3
    objective: 전체 원자성과 항목별 부분 성공을 구분하고 읽기 단위, DB batch write, 트랜잭션 commit, 항목 오류, 재시도·멱등성 계약을 설계한다.
    density: CORE
    visualization: DIAGRAM
  - key: backend.core.bulk-batch.batch-recovery
    title: 배치 실패 후 재시작과 복구
    order: 30
    level: 3
    objective: commit·checkpoint 이후 실패한 작업을 재시작할 때 이미 완료한 항목을 중복 반영하지 않는 상태와 운영자 복구 절차를 설계한다.
    density: CORE
    visualization: DIAGRAM
- key: backend.core.time-money
  title: 시간과 금액
  order: 110
  scope: Instant와 시간대, Clock 기반 만료 정책, BigDecimal과 반올림을 다룬다.
  boundary: 사용자 표시 형식과 canonical 저장·업무 정책을 구분한다.
  concepts:
  - key: backend.core.time-money.instant-zone
    title: 절대 시점과 시간대 계약
    order: 10
    level: 3
    objective: 절대 시점 저장과 지역 달력 규칙을 분리하고 DST·offset 변화가 예약·마감 계산에 미치는 영향을 설명한다.
    density: CORE
    visualization: TEXT
  - key: backend.core.time-money.clock-expiry
    title: Clock과 만료 정책
    order: 20
    level: 3
    objective: 현재 시간을 직접 호출하는 대신 Clock을 의존성으로 전달해 만료 경계를 테스트하고 경계 시각의 포함·제외 규칙을 명시한다.
    density: CORE
    visualization: NONE
  - key: backend.core.time-money.money-rounding
    title: 금액 표현과 반올림 정책
    order: 30
    level: 3
