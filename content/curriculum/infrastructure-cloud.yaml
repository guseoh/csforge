schemaVersion: 2
area:
  key: infrastructure-cloud
  title: Infrastructure & Cloud
  baseline: provider-neutral compute, networking, storage and automation
  contentKeyPrefix: infrastructure.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: 애플리케이션이 실행되는 infrastructure boundary에서 compute·network·storage 자원과 lifecycle·failure·cost를 연결한다.
  question:
    minimumPerConcept: 2
    topicDifficultyCoverage: [EASY, MEDIUM, HARD]
    areaTypeCoverage: [MULTIPLE_CHOICE, SHORT_ANSWER, DESCRIPTIVE, SCENARIO]
    hardRule: resource limit, traffic routing, certificate rotation, backup/restore, rollout·health state 또는 IaC drift를 실제 운영 상황으로 판단하게 한다.
    shortAnswerRule: cloud 서비스명이나 container 용어 이름만으로 정답을 인정하지 않는다.
  source:
    primary: [NIST Cloud Computing Definition, Kubernetes Documentation, OCI/Docker Documentation]
    rule: provider feature와 portable infrastructure principle, application·platform responsibility를 구분한다.
  visualization:
    values: [NONE, TEXT, DIAGRAM]
    rule: request ingress, container lifecycle, health probe, storage recovery와 deployment transition처럼 경계·상태가 핵심인 곳에 사용한다.
topics:
- key: infrastructure.core.compute
  title: Compute and runtime
  order: 10
  scope: VM/container/serverless 실행 모델, resource requests/limits와 configuration/secrets를 다룬다.
  boundary: application code와 runtime scheduler/host resource의 책임을 분리한다.
  concepts:
  - key: infrastructure.core.compute.execution-models
    title: VM·container·serverless execution models
    order: 10
    level: 1
    objective: process isolation, image/runtime와 managed execution의 차이 및 운영 책임 이동을 설명한다.
    density: CORE
    visualization: TEXT
  - key: infrastructure.core.compute.resource-boundaries
    title: resource requests와 limits
    order: 20
    level: 2
    objective: CPU/memory request·limit과 scheduling·throttling·OOM/eviction을 capacity 관점에서 판단한다.
    density: CORE
    visualization: DIAGRAM
  - key: infrastructure.core.compute.configuration-secrets
    title: configuration과 secrets
    order: 30
    level: 2
    objective: image와 runtime configuration을 분리하고 secret 노출·rotation·least privilege 경계를 설계한다.
    density: CORE
    visualization: NONE
- key: infrastructure.core.network
  title: Infrastructure networking
  order: 20
  scope: subnet/security boundary, load balancing/ingress와 DNS/TLS lifecycle을 다룬다.
  boundary: Network & HTTP가 protocol semantics를 소유하고 Infrastructure는 routing·isolation·certificate operation을 소유한다.
  concepts:
  - key: infrastructure.core.network.network-boundaries
    title: VPC·subnet·security boundary
    order: 10
    level: 1
    objective: public/private network, ingress/egress와 security group/network policy의 allow boundary를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: infrastructure.core.network.load-balancing-ingress
    title: load balancing과 ingress
    order: 20
    level: 2
    objective: client·load balancer·service·instance routing과 health-aware traffic distribution을 판단한다.
    density: CORE
    visualization: DIAGRAM
  - key: infrastructure.core.network.dns-tls
    title: DNS와 TLS certificate lifecycle
    order: 30
    level: 2
    objective: name resolution, certificate issuance·rotation·expiry와 connection failure를 운영 흐름으로 설명한다.
    density: CORE
    visualization: TEXT
- key: infrastructure.core.reliability
  title: Storage and delivery reliability
  order: 30
  scope: object/block storage, backup/restore와 IaC·immutable rollout을 다룬다.
  boundary: Database canonical state와 infrastructure backup/restore, application migration을 혼동하지 않는다.
  concepts:
  - key: infrastructure.core.reliability.storage-models
    title: object·block·file storage
    order: 10
    level: 1
    objective: access pattern·latency·durability·sharing 요구에 따라 storage model을 선택한다.
    density: CORE
    visualization: NONE
  - key: infrastructure.core.reliability.backup-restore
    title: backup·restore와 RPO/RTO
    order: 20
    level: 2
    objective: backup 존재와 실제 복구 가능성을 구분하고 RPO/RTO·복구 순서·정기 restore test를 설계한다.
    density: CORE
    visualization: DIAGRAM
  - key: infrastructure.core.reliability.iac-rollout
    title: IaC와 immutable rollout
    order: 30
    level: 3
    objective: 선언적 infrastructure state, drift·review·rollback과 blue/green·rolling rollout의 failure boundary를 판단한다.
    density: CORE
    visualization: DIAGRAM
boundaries:
- area: Operating Systems
  owns: process, virtual memory와 host OS semantics
  infrastructureBoundary: cloud/cluster가 제공하는 VM·container resource boundary와 scheduling을 application 운영 관점에서 다룬다.
- area: Network & HTTP
  owns: protocol, TCP/IP, HTTP semantics
  infrastructureBoundary: ingress, routing, DNS·TLS operation과 network isolation을 다룬다.
- area: Database
  owns: database data model, transaction과 canonical durability
  infrastructureBoundary: volume·backup·restore resource와 DB recovery operation을 연결한다.
