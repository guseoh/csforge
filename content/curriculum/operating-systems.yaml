schemaVersion: 2
area:
  key: operating-systems
  title: "운영체제"
  baseline: "커널 경계, 프로세스, 스케줄링, 메모리, 파일, 입출력, IPC와 격리를 다룬다."
  contentKeyPrefix: operating-systems.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: "애플리케이션·사용자 모드·커널·하드웨어의 경계와 상태 전이를 연결한다."
  question:
    hardRule: "실행 상태, 자원 제약, 실패 경로와 비용을 함께 추론한다."
  visualization:
    values: [NONE, TEXT, DIAGRAM]
topics:
  - key: operating-systems.core.kernel-boundary
    title: "커널 경계"
    order: 10
    scope: "자원 관리, 특권, 시스템 콜, 인터럽트와 예외의 경계를 다룬다."
    boundary: "커널과 하드웨어 경계를 다루며 특정 운영체제의 모든 하위 시스템 구현은 다루지 않는다."
    concepts:
      - key: operating-systems.core.kernel-boundary.os-resource-manager
        title: "운영체제와 자원 관리"
        order: 10
        level: 1
        objective: "CPU·메모리·장치 자원을 프로세스에 배분하는 운영체제 역할을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.kernel-boundary.user-kernel-mode
        title: "사용자 모드와 커널 모드(User and Kernel Modes)"
        order: 20
        level: 1
        objective: "권한 수준과 모드 전환이 보호를 만드는 이유를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.kernel-boundary.privilege-protection
        title: "특권과 보호(Privilege and Protection)"
        order: 30
        level: 1
        objective: "특권 명령과 보호된 주소 접근의 실패 경계를 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.kernel-boundary.system-call
        title: "시스템 콜(System Call)"
        order: 40
        level: 1
        objective: "애플리케이션이 커널 서비스에 요청을 보내는 명시적 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.kernel-boundary.system-call-flow
        title: "시스템 콜 흐름(System Call Flow)"
        order: 50
        level: 2
        objective: "트랩 진입·인자 검증·서비스 처리·복귀까지의 상태 변화를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.kernel-boundary.interrupt-exception-system-call
        title: "인터럽트·예외·시스템 콜(Interrupt, Exception, and System Call)"
        order: 60
        level: 2
        objective: "세 진입 원인의 동기성·발생 주체·복귀 경계를 비교한다."
        density: CORE
        visualization: TEXT
  - key: operating-systems.core.process
    title: "프로세스 모델"
    order: 20
    scope: "프로그램과 프로세스, 주소 공간, PCB, 상태, 생성·종료, 부모-자식 관계를 다룬다."
    boundary: "프로세스 생명주기를 다루며 스레드 내부 상태는 스레드 주제에 둔다."
    concepts:
      - key: operating-systems.core.process.program-vs-process
        title: "프로그램과 프로세스(Program and Process)"
        order: 10
        level: 1
        objective: "정적인 프로그램 코드와 실행 중인 자원 묶음인 프로세스를 구분한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.process.process-address-space
        title: "프로세스 주소 공간(Process Address Space)"
        order: 20
        level: 1
        objective: "코드·데이터·힙·스택으로 나뉜 프로세스의 가상 주소 공간을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.process.pcb
        title: "프로세스 제어 블록(PCB)"
        order: 30
        level: 2
        objective: "스케줄러가 프로세스를 재개하는 데 필요한 PCB 메타데이터를 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.process.process-state
        title: "프로세스 상태(Process State)"
        order: 40
        level: 1
        objective: "생성(new)·준비(ready)·실행(running)·대기(waiting)·종료(terminated) 상태의 전이 원인을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.process.process-create
        title: "프로세스 생성(Process Creation)"
        order: 50
        level: 2
        objective: "spawn/fork와 주소 공간·자원 초기화의 차이를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.process.process-terminate
        title: "프로세스 종료(Process Termination)"
        order: 60
        level: 2
        objective: "exit와 자원 회수, 종료 상태 전달의 순서를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.process.parent-child
        title: "부모와 자식 프로세스(Parent and Child Process)"
        order: 70
        level: 1
        objective: "부모-자식 관계와 파일 디스크립터·시그널 상속의 경계를 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: operating-systems.core.process.wait-reap
        title: "자식 프로세스 대기와 회수(Wait and Reap)"
        order: 80
        level: 2
        objective: "부모의 wait가 종료된 자식 프로세스의 상태를 회수하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
  - key: operating-systems.core.scheduling
    title: "문맥 전환과 스케줄링"
    order: 30
    scope: "문맥 전환, 선점, 스케줄러 목표와 FCFS/SJF/RR/우선순위 스케줄링을 다룬다."
    boundary: "운영체제의 CPU 스케줄링 정책을 다루며 하드웨어 파이프라인 스케줄링은 다루지 않는다."
    concepts:
      - key: operating-systems.core.scheduling.context-switch
        title: "문맥 전환(Context Switch)"
        order: 10
        level: 1
        objective: "현재 레지스터와 실행 문맥을 저장하고 다른 실행 가능 프로세스를 재개하는 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.scheduling.timer-interrupt-preemption
        title: "타이머 인터럽트와 선점(Timer Interrupt and Preemption)"
        order: 20
        level: 2
        objective: "타이머 인터럽트가 실행 중인 프로세스를 선점 가능한 상태로 바꾸는 과정을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.scheduling.scheduler-goals
        title: "스케줄러의 목표(Scheduler Goals)"
        order: 30
        level: 1
        objective: "응답 시간·처리량·공정성·사용률 사이의 절충을 비교한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.scheduling.fcfs
        title: "선착순 스케줄링(FCFS)"
        order: 40
        level: 1
        objective: "도착 순서 실행과 호송 효과(convoy effect)를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.scheduling.sjf
        title: "최단 작업 우선(SJF)"
        order: 50
        level: 2
        objective: "짧은 작업 우선 정책과 평균 대기시간 전제를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.scheduling.round-robin
        title: "라운드 로빈(Round Robin)"
        order: 60
        level: 1
        objective: "시간 할당량(time quantum)이 공정성과 문맥 전환 비용을 바꾸는 방식을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.scheduling.priority-scheduling
        title: "우선순위 스케줄링(Priority Scheduling)"
        order: 70
        level: 2
        objective: "우선순위 선택과 낮은 우선순위 작업의 지연 문제를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.scheduling.starvation-aging
        title: "기아와 에이징(Starvation and Aging)"
        order: 80
        level: 2
        objective: "기아 상태와 에이징(aging)으로 우선순위를 보정하는 이유를 설명한다."
        density: STANDARD
        visualization: DIAGRAM
      - key: operating-systems.core.scheduling.multicore-affinity
        title: "멀티코어 친화도(Multicore Affinity)"
        order: 90
        level: 3
        objective: "CPU 친화도(affinity)가 캐시 지역성과 부하 균형에 미치는 절충을 추론한다."
        density: CORE
        visualization: DIAGRAM
  - key: operating-systems.core.threads
    title: "스레드"
    order: 40
    scope: "프로세스 공유 상태, 스레드별 스택·레지스터, 커널/사용자 수준 스레드와 Java 경계를 다룬다."
    boundary: "운영체제 스레드 실행 단위와 Java 스레드/가상 스레드 경계를 다루며 JMM 전체는 다루지 않는다."
    concepts:
      - key: operating-systems.core.threads.process-vs-thread
        title: "프로세스와 스레드(Process and Thread)"
        order: 10
        level: 1
        objective: "독립 주소 공간을 가진 프로세스와 주소 공간을 공유하는 스레드를 비교한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.threads.thread-shared-state
        title: "스레드 간 공유 상태(Thread-Shared State)"
        order: 20
        level: 1
        objective: "코드·힙·파일 디스크립터를 공유할 때 통신과 경쟁 상태가 생기는 이유를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.threads.thread-private-state
        title: "스레드별 상태(Thread-Private State)"
        order: 30
        level: 1
        objective: "스택·레지스터·PC를 스레드별로 분리해야 하는 이유를 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.threads.kernel-thread
        title: "커널 스레드(Kernel Thread)"
        order: 40
        level: 2
        objective: "커널 스케줄러가 인식하는 스레드와 블로킹의 관계를 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.threads.user-level-thread
        title: "사용자 수준 스레드(User-Level Thread)"
        order: 50
        level: 2
        objective: "사용자 런타임이 스케줄링하는 스레드의 빠른 전환과 블로킹 한계를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.threads.thread-create-switch-cost
        title: "스레드 생성과 문맥 전환 비용(Thread Creation and Context-Switch Cost)"
        order: 60
        level: 2
        objective: "생성·스택·문맥 전환 비용이 스레드 수 선택에 미치는 영향을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.threads.concurrency-vs-parallelism
        title: "동시성과 병렬성(Concurrency and Parallelism)"
        order: 70
        level: 1
        objective: "겹친 진행과 실제 동시 실행을 구분한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.threads.thread-count-workload
        title: "작업 부하별 스레드 수(Thread Count by Workload)"
        order: 80
        level: 2
        objective: "CPU 중심·I/O 중심 작업 부하에 맞는 스레드 수의 절충을 추론한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.threads.thread-pool
        title: "스레드 풀(Thread Pool)"
        order: 90
        level: 1
        objective: "작업자 재사용·대기열·역압(backpressure)으로 스레드 풀의 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.threads.java-virtual-thread-boundary
        title: "Java 가상 스레드 경계(Java Virtual Thread Boundary)"
        order: 100
        level: 3
        objective: "가상 스레드와 캐리어 운영체제 스레드(carrier OS thread)의 관계 및 고정(pinning) 경계를 설명한다."
        density: CORE
        visualization: DIAGRAM
  - key: operating-systems.core.race-critical-section
    title: "경쟁 상태와 임계 구역"
    order: 50
    scope: "공유 가변 상태, 실행 교차, 경쟁 상태, 임계 구역, 원자성, 바쁜 대기/블로킹을 다룬다."
    boundary: "경쟁 상태의 실행 조건을 다루며 구체적인 잠금 원시 연산 선택은 동기화 주제에 둔다."
    concepts:
      - key: operating-systems.core.race-critical-section.shared-mutable-state
        title: "공유 가변 상태(Shared Mutable State)"
        order: 10
        level: 1
        objective: "여러 실행 흐름이 같은 변경 가능한 상태를 읽고 쓰는 위험을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.race-critical-section.interleaving
        title: "실행 교차(Interleaving)"
        order: 20
        level: 1
        objective: "두 스레드의 읽기-수정-쓰기 연산이 교차하는 실행 흐름을 추적한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.race-critical-section.race-condition
        title: "경쟁 상태(Race Condition)"
        order: 30
        level: 1
        objective: "결과가 실행 순서에 의존하는 경쟁 상태의 필요 조건을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.race-critical-section.critical-section
        title: "임계 구역(Critical Section)"
        order: 40
        level: 1
        objective: "공유 상태에 접근하는 구간의 상호 배제·진행·한정 대기 조건을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.race-critical-section.atomic-operation
        title: "원자적 연산(Atomic Operation)"
        order: 50
        level: 2
        objective: "관찰 가능한 중간 상태가 노출되지 않는 원자적 연산의 경계를 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.race-critical-section.spin-vs-block
        title: "바쁜 대기와 블로킹(Spin and Blocking)"
        order: 60
        level: 2
        objective: "짧은 대기에서 바쁜 대기(spin)와 긴 대기에서 블로킹(blocking)을 선택하는 비용을 비교한다."
        density: STANDARD
        visualization: TEXT
  - key: operating-systems.core.synchronization
    title: "동기화"
    order: 60
    scope: "뮤텍스, 세마포어, 조건 변수, 모니터, 읽기-쓰기 잠금과 경합을 다룬다."
    boundary: "동기화 원시 연산의 의미를 다루며 애플리케이션 트랜잭션 의미론은 다루지 않는다."
    concepts:
      - key: operating-systems.core.synchronization.mutex
        title: "뮤텍스(Mutex)"
        order: 10
        level: 1
        objective: "한 번에 하나의 소유자만 허용하는 상호 배제와 잠금 해제 책임을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.synchronization.semaphore
        title: "세마포어(Semaphore)"
        order: 20
        level: 1
        objective: "카운터와 허가(permit)로 동시에 사용할 수 있는 자원 수를 제한하는 동작을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.synchronization.condition-variable
        title: "조건 변수(Condition Variable)"
        order: 30
        level: 2
        objective: "조건이 거짓일 때 잠금을 놓고 대기한 뒤 조건을 다시 확인하는 wait/signal 흐름을 설명한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.synchronization.monitor
        title: "모니터(Monitor)"
        order: 40
        level: 2
        objective: "데이터·잠금·조건 대기 규약을 하나의 추상화로 묶는 이유를 설명한다."
        density: STANDARD
        visualization: TEXT
      - key: operating-systems.core.synchronization.read-write-lock
        title: "읽기-쓰기 잠금(Read-Write Lock)"
        order: 50
        level: 2
        objective: "여러 읽기 작업의 동시 허용과 쓰기 작업의 배타 조건, 쓰기 기아 가능성을 비교한다."
        density: CORE
        visualization: DIAGRAM
      - key: operating-systems.core.synchronization.lock-granularity
        title: "잠금 세분성(Lock Granularity)"
        order: 60
        level: 2
        objective: "거친 잠금과 세밀한 잠금이 경합·병렬성·복잡도에 미치는 영향을 설명한다."
        density: CORE
        visualization: TEXT
      - key: operating-systems.core.synchronization.contention
        title: "잠금 경합(Lock Contention)"
        order: 70
        level: 2
        objective: "같은 잠금을 기다리는 시간과 문맥 전환이 처리량을 떨어뜨리는 경로를 추론한다."
        density: STANDARD
        visualization: DIAGRAM
  - key: operating-systems.core.deadlock
    title: "교착과 진행성"
    order: 70
