schemaVersion: 2
area:
  key: security
  title: 보안
  baseline: Web security / Spring Security 7
  contentKeyPrefix: security.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: 공격자가 조작할 수 있는 입력, 신뢰 경계, 브라우저/서버/프레임워크에서 실제 검증이 실행되는 위치와 실패 결과를 연결해 설명한다.
  question:
    reviewRule: topicDifficultyCoverage와 areaTypeCoverage는 주제와 학습 영역 전체를 검토하는 기준이며 개념마다 적용하는 할당량이 아니다.
    topicDifficultyCoverage: [EASY, MEDIUM, HARD]
    areaTypeCoverage: [MULTIPLE_CHOICE, SHORT_ANSWER, DESCRIPTIVE, SCENARIO]
    hardRule: 구체적인 HTTP 요청·응답, 쿠키 속성, 필터 체인, 인증 상태, 취약한 코드, 공격자 능력 중 하나 이상을 제시한다.
    shortAnswerRule: 보안 용어 이름만 입력해도 맞는 문제를 만들지 않는다.
  source:
    primary: [Spring Security Reference, OWASP, MDN Web Security, RFC/IETF/OIDC specifications]
    rule: 브라우저·프로토콜·프레임워크·애플리케이션의 보장 범위를 구분하고 폐기되었거나 초안인 문서를 표준처럼 표현하지 않는다.
  visualization:
    values: [NONE, TEXT, DIAGRAM]
    rule: 자격 증명 이동, 쿠키 자동 전송, 필터 체인, OAuth/OIDC 리다이렉트, SSRF처럼 경계를 넘는 흐름에 사용한다.
topics:
- key: security.core.foundations
  title: 보안 기초
  order: 10
  scope: 자산·위협·취약점·신뢰 경계·기밀성·무결성·가용성·최소 권한을 다룬다.
  boundary: 보안을 체크리스트가 아니라 공격 조건과 보호 목표를 연결하는 설계 문제로 다룬다.
  concepts:
  - key: security.core.foundations.assets-threats
    title: 자산·위협·취약점
    order: 10
    level: 1
    objective: 보호할 자산, 공격자의 능력과 목표, 악용 가능한 취약점을 구분해 위험 시나리오를 작성한다.
    density: CORE
    visualization: TEXT
  - key: security.core.foundations.trust-boundary
    title: 신뢰 경계와 입력 검증
    order: 20
    level: 1
    objective: 브라우저, API, DB, 외부 서비스 사이 경계를 넘는 데이터를 기본적으로 신뢰하지 않는 이유와 검증 위치를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.foundations.cia-least
    title: 기밀성·무결성·가용성과 최소 권한
    order: 30
    level: 1
    objective: 기밀성·무결성·가용성과 최소 권한을 실제 API·DB 자격 증명 설계에 적용한다.
    density: CORE
    visualization: NONE
- key: security.core.authn-authz
  title: 인증과 인가
  order: 20
  scope: 사용자 신원·인증 주체·인증·인가를 구분한다.
  boundary: 로그인 성공을 모든 리소스에 대한 접근 권한으로 일반화하지 않는다.
  concepts:
  - key: security.core.authn-authz.identity-principal
    title: 사용자 신원(identity)과 인증 주체(principal)
    order: 10
    level: 1
    objective: 시스템이 표현하는 사용자·서비스 신원과 현재 보안 컨텍스트의 인증 주체 표현을 구분한다.
    density: STANDARD
    visualization: NONE
  - key: security.core.authn-authz.authentication
    title: 인증(authentication)
    order: 20
    level: 1
    objective: 자격 증명을 검증해 요청 주체에 대한 신뢰 수준을 세우는 과정과 실패 상태를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.authn-authz.authorization
    title: 인가(authorization)
    order: 30
    level: 1
    objective: 인증된 주체도 리소스와 작업마다 권한을 다시 판단해야 하는 이유를 소유권과 역할 사례로 설명한다.
    density: CORE
    visualization: TEXT
- key: security.core.password
  title: 비밀번호의 안전한 저장
  order: 30
  scope: 평문·복호화 가능한 저장, 솔트·비밀번호 해시, 검증 비용을 다룬다.
  boundary: 범용 암호학적 해시와 비밀번호 해시의 목적과 비용 모델을 구분한다.
  concepts:
  - key: security.core.password.plaintext
    title: 비밀번호 평문·복호화 저장 위험
    order: 10
    level: 1
    objective: DB 백업만 유출되면 평문 비밀번호가 즉시 노출되는 이유와, 별도 키로 암호화한 비밀번호는 키 유출 여부에 따라 위험이 달라지는 이유를 구분한다.
    density: CORE
    visualization: NONE
  - key: security.core.password.salt-hash
    title: 비밀번호 솔트와 해시
    order: 20
    level: 1
    objective: 사용자별 솔트가 같은 비밀번호의 저장 값을 다르게 만들고 사전 계산 공격의 재사용을 어렵게 하는 원리를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.password.work-factor
    title: 비밀번호 검증 비용과 work factor
    order: 30
    level: 2
    objective: Argon2id·bcrypt·PBKDF2의 검증 비용을 공격 비용과 로그인 지연 사이에서 조절하고 재해시 정책을 판단한다.
    density: CORE
    visualization: NONE
- key: security.core.session-cookie
  title: 세션과 쿠키
  order: 40
  scope: 세션 식별자, 쿠키 보안 속성, 세션 고정과 만료를 다룬다.
  boundary: 쿠키는 브라우저의 저장·전송 수단이며 서버에 저장된 세션 상태와 동일한 것이 아니다.
  concepts:
  - key: security.core.session-cookie.session-id
    title: 세션 ID와 서버 상태 연결
    order: 10
    level: 2
    objective: 브라우저가 보낸 세션 식별자로 서버가 인증 상태를 찾는 흐름과 ID 탈취 위험을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.session-cookie.cookie-flags
    title: 쿠키 보안 속성
    order: 20
    level: 2
    objective: 쿠키 속성이 HTTPS 전송, 스크립트 접근, 교차 사이트 전송에 미치는 효과와 한계를 구분한다.
    density: CORE
    visualization: TEXT
  - key: security.core.session-cookie.fixation-expiration
    title: 세션 고정과 ID 교체·만료
    order: 30
    level: 2
    objective: 로그인 전 세션 ID를 로그인 후에도 그대로 사용하는 위험, ID 교체, 로그아웃·유휴·절대 만료를 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.browser
  title: "브라우저 보안: SOP·CORS·CSRF·XSS"
  order: 50
  scope: 동일 출처 정책(SOP)·CORS·CSRF·XSS를 각각의 보안 메커니즘과 공격으로 구분한다.
  boundary: CORS를 서버 인증이나 CSRF/XSS 방어의 대체물로 설명하지 않는다.
  concepts:
  - key: security.core.browser.same-origin
    title: 동일 출처 정책(SOP)
    order: 10
    level: 2
    objective: 스킴·호스트·포트로 정하는 출처와 브라우저가 교차 출처 응답 읽기를 제한하는 이유를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.browser.cors-preflight
    title: 교차 출처 리소스 공유(CORS)와 사전 요청
    order: 20
    level: 2
    objective: Origin·Access-Control-Allow-* 헤더와 사전 요청으로 브라우저가 교차 출처 접근을 확인하는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.browser.csrf
    title: 사이트 간 요청 위조(CSRF)
    order: 30
    level: 2
    objective: 브라우저의 자격 증명·쿠키 자동 전송을 악용해 피해자 권한으로 상태 변경 요청을 보내는 흐름과 토큰·SameSite 방어를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.browser.xss
    title: 교차 사이트 스크립팅(XSS)
    order: 40
    level: 2
    objective: 신뢰할 수 없는 데이터가 HTML·JavaScript·URL 문맥에서 코드로 해석되는 경로와 문맥별 출력 인코딩·CSP의 역할을 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.injection
  title: 인젝션 방어
  order: 60
  scope: SQL 인젝션, JPQL·네이티브 쿼리의 동적 구조, 출력 인코딩을 다룬다.
  boundary: XSS를 브라우저 주제와 연결하되 인젝션의 공통 원리인 데이터와 코드의 경계를 강조한다.
  concepts:
  - key: security.core.injection.sql-injection
    title: SQL 인젝션과 값·쿼리 구조 분리
    order: 10
    level: 2
    objective: 사용자 입력을 SQL 문법에 직접 붙일 때 데이터가 쿼리 구조를 바꾸는 위험과 매개변수 바인딩을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.injection.jpql-native
    title: JPQL·네이티브 쿼리의 동적 구조
    order: 20
    level: 2
    objective: ORM을 사용해도 식별자·정렬식 등을 문자열로 직접 조합하면 인젝션 위험이 남는 이유와 허용 목록을 설명한다.
    density: CORE
    visualization: NONE
  - key: security.core.injection.output-encoding
    title: 출력 인코딩과 문맥별 방어
    order: 30
    level: 2
    objective: HTML 본문·속성·URL·JavaScript 문맥마다 필요한 인코딩이 다르고 입력 검증만으로 XSS를 막을 수 없는 이유를 설명한다.
    density: CORE
    visualization: TEXT
- key: security.core.access
  title: 접근 제어 취약점
  order: 70
  scope: 리소스 소유권, BOLA/IDOR, 수직 권한 상승을 다룬다.
  boundary: 클라이언트에서 버튼을 숨기는 것을 인가로 간주하지 않는다.
  concepts:
  - key: security.core.access.ownership
    title: 리소스 소유권 인가
    order: 10
    level: 2
    objective: 리소스 ID의 존재뿐 아니라 현재 인증 주체가 그 리소스에 접근할 권한이 있는지 서버에서 검사한다.
    density: CORE
    visualization: NONE
  - key: security.core.access.bola-idor
    title: 객체 수준 인가 실패(BOLA/IDOR)
    order: 20
    level: 2
    objective: URL·경로·본문의 객체 식별자를 바꿔 다른 사용자의 리소스에 접근하는 수평 권한 상승을 엔드포인트 흐름에서 진단한다.
    density: CORE
    visualization: TEXT
  - key: security.core.access.vertical
    title: 수직 권한 상승
    order: 30
    level: 2
    objective: 낮은 권한의 사용자가 관리자 작업을 직접 호출할 때 역할과 권한 정책이 이를 막아야 하는 이유를 설명한다.
    density: CORE
    visualization: NONE
- key: security.core.filter-chain
  title: Spring Security 필터 체인
  order: 80
  scope: Servlet Filter·FilterChainProxy·SecurityFilterChain·보안 예외 변환을 다룬다.
  boundary: MVC 컨트롤러 이후의 업무 인가와 필터 계층의 인증을 구분한다.
  concepts:
  - key: security.core.filter-chain.servlet-filter
    title: 서블릿 필터의 요청 처리 위치
    order: 10
    level: 2
    objective: 서블릿 필터가 DispatcherServlet 앞에서 요청·응답을 감쌀 수 있는 위치를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.filter-chain.security-filter-chain
    title: 보안 필터 체인 선택과 순서
    order: 20
    level: 2
    objective: DelegatingFilterProxy·FilterChainProxy가 요청에 맞는 SecurityFilterChain을 선택하고 그 안의 필터를 순서대로 실행하는 구조를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.filter-chain.exception-translation
    title: 보안 예외와 401·403 응답
    order: 30
    level: 2
    objective: AuthenticationException과 AccessDeniedException이 인증 시작점 또는 접근 거부 응답으로 바뀌는 흐름을 구분한다.
    density: CORE
    visualization: TEXT
- key: security.core.auth-architecture
  title: 인증 구조
  order: 90
  scope: Authentication 토큰, AuthenticationManager·AuthenticationProvider, UserDetailsService·PasswordEncoder를 다룬다.
  boundary: 모든 인증 방식에 사용자 이름·비밀번호와 UserDetailsService가 필수라고 일반화하지 않는다.
  concepts:
  - key: security.core.auth-architecture.authentication-token
    title: 인증 객체의 검증 전·후 상태
    order: 10
    level: 2
    objective: 인증 전 요청 토큰과 인증 성공 결과의 principal·credentials·authorities·authenticated 상태 차이를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.auth-architecture.manager-provider
    title: 인증 관리자와 제공자 위임
    order: 20
    level: 2
    objective: ProviderManager가 요청 유형을 지원하는 AuthenticationProvider에 검증을 위임하고 성공·실패를 반환하는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.auth-architecture.user-details
    title: 사용자 조회와 비밀번호 검증
    order: 30
    level: 2
    objective: 사용자 자격 증명 정보 조회와 비밀번호 해시 검증의 책임을 구분하고 비밀번호 원문 저장·비교를 피한다.
    density: CORE
    visualization: NONE
- key: security.core.context-authz
  title: 보안 컨텍스트와 인가
  order: 100
  scope: SecurityContextHolder, 메서드 보안, 비동기 작업의 스레드 경계를 다룬다.
  boundary: 스레드 로컬 저장 방식이 모든 비동기 실행으로 자동 전파된다고 설명하지 않는다.
  concepts:
  - key: security.core.context-authz.context-holder
    title: 요청 인증 상태와 SecurityContextHolder
    order: 10
    level: 3
    objective: 현재 요청 스레드에서 SecurityContext를 조회·설정·정리하는 수명과 자격 증명 누출 위험을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.context-authz.method-security
    title: 메서드 보안과 유스케이스 인가
    order: 20
    level: 3
    objective: URL 인가 규칙과 서비스 메서드의 인가·소유권 검사가 제공하는 경계와 프록시를 통한 호출 조건을 설명한다.
    density: CORE
    visualization: NONE
  - key: security.core.context-authz.async-context
    title: 비동기 작업에 인증 컨텍스트 전달
    order: 30
    level: 3
    objective: 새 스레드나 작업 실행기로 넘어갈 때 SecurityContext가 사라지거나 잘못 재사용되는 이유와 명시적 전달 전략을 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.tokens-oauth
  title: "JWT와 OAuth 2.0·OpenID Connect"
  order: 110
  scope: JWT 구조와 서명, 토큰 수명주기, OAuth 2.0과 OIDC를 다룬다.
  boundary: JWT를 OAuth 자체나 암호화 형식과 동일시하지 않는다.
  concepts:
  - key: security.core.tokens-oauth.jwt-structure
    title: JWT 구조와 서명·암호화 차이
    order: 10
    level: 3
    objective: JWS 서명이 무결성과 발급 주체 확인에 도움을 주지만 일반적인 서명 JWT는 페이로드를 숨기지 않는다는 점을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.tokens-oauth.jwt-lifecycle
    title: JWT 만료·발급자·대상·폐기
    order: 20
    level: 3
    objective: exp·iss·aud 등의 클레임 검증과 이미 발급한 토큰을 즉시 폐기하기 어려운 문제를 판단한다.
    density: CORE
    visualization: NONE
  - key: security.core.tokens-oauth.oauth-oidc
