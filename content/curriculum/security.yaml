schemaVersion: 2
area:
  key: security
  title: Security
  baseline: Web security / Spring Security 7
  contentKeyPrefix: security.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    explanationRule: 공격자가 조작할 수 있는 입력, 신뢰 경계, 브라우저/서버/프레임워크에서 실제 검증이 실행되는 위치와 실패 결과를 연결해 설명한다.
  question:
    minimumPerConcept: 2
    topicDifficultyCoverage: [EASY, MEDIUM, HARD]
    areaTypeCoverage: [MULTIPLE_CHOICE, SHORT_ANSWER, DESCRIPTIVE, SCENARIO]
    hardRule: 구체적인 HTTP request/response, cookie 속성, filter chain, authentication 상태, vulnerable code, attacker capability 중 하나 이상을 제시한다.
    shortAnswerRule: 보안 용어 이름만 입력해도 맞는 문제를 만들지 않는다.
  source:
    primary: [Spring Security Reference, OWASP, MDN Web Security, RFC/IETF/OIDC specifications]
    rule: browser, protocol, framework, application 보장을 구분하고 폐기되었거나 draft인 문서를 표준처럼 표현하지 않는다.
  visualization:
    values: [NONE, TEXT, DIAGRAM]
    rule: credential 이동, cookie 자동 전송, filter chain, OAuth/OIDC redirect, SSRF처럼 경계를 넘는 흐름에 사용한다.
topics:
- key: security.core.foundations
  title: Security foundations
  order: 10
  scope: asset, threat, vulnerability, trust boundary, CIA, least privilege를 다룬다.
  boundary: 보안을 체크리스트가 아니라 공격 조건과 보호 목표를 연결하는 설계 문제로 다룬다.
  concepts:
  - key: security.core.foundations.assets-threats
    title: 자산·위협·취약점
    order: 10
    level: 1
    objective: 보호할 자산, 공격자의 능력/목표, exploitable weakness를 분리해 위험 시나리오를 작성한다.
    density: CORE
    visualization: TEXT
  - key: security.core.foundations.trust-boundary
    title: trust boundary
    order: 20
    level: 1
    objective: 브라우저, API, DB, 외부 서비스 사이 경계를 넘는 데이터를 기본적으로 신뢰하지 않는 이유와 검증 위치를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.foundations.cia-least
    title: CIA와 least privilege
    order: 30
    level: 1
    objective: confidentiality/integrity/availability와 최소 권한을 실제 API·DB credential 설계에 적용한다.
    density: CORE
    visualization: NONE
- key: security.core.authn-authz
  title: Authentication vs authorization
  order: 20
  scope: identity/principal, authentication, authorization을 구분한다.
  boundary: 로그인 성공을 모든 resource 접근 권한으로 일반화하지 않는다.
  concepts:
  - key: security.core.authn-authz.identity-principal
    title: identity와 principal
    order: 10
    level: 1
    objective: 시스템이 표현하는 사용자/서비스 identity와 현재 security context의 principal 표현을 구분한다.
    density: STANDARD
    visualization: NONE
  - key: security.core.authn-authz.authentication
    title: authentication
    order: 20
    level: 1
    objective: credential을 검증해 요청 주체에 대한 신뢰 수준을 세우는 과정과 실패 상태를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.authn-authz.authorization
    title: authorization
    order: 30
    level: 1
    objective: 인증된 principal이라도 resource/action마다 권한을 다시 판단해야 하는 이유를 ownership/role 사례로 설명한다.
    density: CORE
    visualization: TEXT
- key: security.core.password
  title: Password storage
  order: 30
  scope: plaintext/reversible storage, salt/password hashing, work factor를 다룬다.
  boundary: 일반 cryptographic hash와 password hashing의 목적/비용 모델을 구분한다.
  concepts:
  - key: security.core.password.plaintext
    title: plaintext와 복호화 가능 저장의 위험
    order: 10
    level: 1
    objective: DB 유출 시 서버 비밀키 없이도 즉시 원문을 노출하는 저장 방식이 왜 위험한지 설명한다.
    density: CORE
    visualization: NONE
  - key: security.core.password.salt-hash
    title: salt와 password hash
    order: 20
    level: 1
    objective: 사용자별 salt가 같은 password의 같은 저장값을 막고 precomputed attack 비용을 높이는 원리를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.password.work-factor
    title: work factor와 검증
    order: 30
    level: 2
    objective: Argon2id/bcrypt/PBKDF2 같은 password hashing의 cost를 공격 비용과 로그인 latency 사이에서 조절하고 재해시 정책을 판단한다.
    density: CORE
    visualization: NONE
- key: security.core.session-cookie
  title: Session과 cookie
  order: 40
  scope: session identifier, cookie flags, fixation/expiration을 다룬다.
  boundary: cookie는 browser storage/transport mechanism이고 server-side session state와 동일한 것이 아니다.
  concepts:
  - key: security.core.session-cookie.session-id
    title: session ID와 서버 상태 연결
    order: 10
    level: 2
    objective: browser가 보낸 opaque session identifier로 서버가 authentication/session state를 찾는 흐름과 ID 탈취 위험을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.session-cookie.cookie-flags
    title: Secure·HttpOnly·SameSite
    order: 20
    level: 2
    objective: 각 cookie attribute가 HTTPS 전송, script access, cross-site 전송에 미치는 효과와 한계를 구분한다.
    density: CORE
    visualization: TEXT
  - key: security.core.session-cookie.fixation-expiration
    title: session fixation과 만료
    order: 30
    level: 2
    objective: 로그인 전 ID를 로그인 후 그대로 신뢰하는 fixation 위험, session ID rotation, logout/inactivity/absolute expiry를 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.browser
  title: SOP·CORS·CSRF·XSS
  order: 50
  scope: same-origin policy, CORS, CSRF, XSS를 각각 독립 공격/보안 메커니즘으로 다룬다.
  boundary: CORS를 서버 인증이나 CSRF/XSS 방어의 대체물로 설명하지 않는다.
  concepts:
  - key: security.core.browser.same-origin
    title: Same-Origin Policy
    order: 10
    level: 2
    objective: scheme/host/port로 정의되는 origin과 browser가 cross-origin read를 제한하는 이유를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.browser.cors-preflight
    title: CORS와 preflight
    order: 20
    level: 2
    objective: Origin, Access-Control-Allow-*와 preflight가 browser의 cross-origin 접근 허용을 협상하는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.browser.csrf
    title: CSRF
    order: 30
    level: 2
    objective: browser가 credential/cookie를 자동 첨부하는 성질을 공격자가 이용해 피해자 권한의 state-changing request를 보내는 흐름과 token/SameSite 방어를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.browser.xss
    title: XSS
    order: 40
    level: 2
    objective: untrusted data가 HTML/JS/URL 등 실행 가능한 context에 code로 해석되는 경로와 context-aware output encoding/CSP의 역할을 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.injection
  title: Injection defenses
  order: 60
  scope: SQL injection, JPQL/native dynamic query, output encoding을 다룬다.
  boundary: XSS는 browser topic과 연결하되 injection의 공통 원리인 data/code boundary를 강조한다.
  concepts:
  - key: security.core.injection.sql-injection
    title: SQL injection
    order: 10
    level: 2
    objective: user input을 SQL syntax와 문자열 결합할 때 data가 code 구조를 바꾸는 위험과 parameter binding을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.injection.jpql-native
    title: JPQL·native query의 동적 부분
    order: 20
    level: 2
    objective: ORM을 사용해도 dynamic string/identifier/order fragment를 직접 조합하면 injection 경계가 남는 이유와 allow-list를 판단한다.
    density: CORE
    visualization: NONE
  - key: security.core.injection.output-encoding
    title: output encoding과 context
    order: 30
    level: 2
    objective: HTML text/attribute/URL/JavaScript context마다 필요한 encoding이 다르고 입력 검증만으로 XSS를 막을 수 없는 이유를 설명한다.
    density: CORE
    visualization: TEXT
- key: security.core.access
  title: Access control vulnerabilities
  order: 70
  scope: ownership, BOLA/IDOR, vertical privilege escalation을 다룬다.
  boundary: client-side hidden button을 authorization으로 간주하지 않는다.
  concepts:
  - key: security.core.access.ownership
    title: resource ownership
    order: 10
    level: 2
    objective: resource ID가 존재하는지뿐 아니라 현재 principal이 그 resource에 허용된 관계인지 server-side에서 검사한다.
    density: CORE
    visualization: NONE
  - key: security.core.access.bola-idor
    title: BOLA/IDOR
    order: 20
    level: 2
    objective: URL/path/body의 object identifier를 바꿔 다른 사용자의 resource에 접근하는 수평 권한 상승을 endpoint 흐름으로 진단한다.
    density: CORE
    visualization: TEXT
  - key: security.core.access.vertical
    title: vertical privilege escalation
    order: 30
    level: 2
    objective: 낮은 권한 principal이 admin action을 직접 호출하는 시도를 role/authority 정책이 막아야 하는 이유를 설명한다.
    density: CORE
    visualization: NONE
- key: security.core.filter-chain
  title: Spring Security filter chain
  order: 80
  scope: Servlet Filter, FilterChainProxy/SecurityFilterChain, exception translation을 다룬다.
  boundary: MVC controller 이후의 business authorization과 filter-layer authentication을 구분한다.
  concepts:
  - key: security.core.filter-chain.servlet-filter
    title: Servlet Filter 위치
    order: 10
    level: 2
    objective: Servlet Filter가 DispatcherServlet 전후에서 request/response를 감쌀 수 있는 위치를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.filter-chain.security-filter-chain
    title: FilterChainProxy와 SecurityFilterChain
    order: 20
    level: 2
    objective: DelegatingFilterProxy/FilterChainProxy가 request에 맞는 SecurityFilterChain을 선택하고 여러 security filter를 순서대로 실행하는 구조를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.filter-chain.exception-translation
    title: ExceptionTranslationFilter
    order: 30
    level: 2
    objective: AuthenticationException/AccessDeniedException이 login entry point 또는 access denied response로 변환되는 흐름을 구분한다.
    density: CORE
    visualization: TEXT
- key: security.core.auth-architecture
  title: Authentication architecture
  order: 90
  scope: Authentication token, AuthenticationManager/Provider, UserDetailsService/PasswordEncoder를 다룬다.
  boundary: 모든 인증 방식이 username/password와 UserDetailsService를 필수로 사용한다고 일반화하지 않는다.
  concepts:
  - key: security.core.auth-architecture.authentication-token
    title: Authentication 객체의 검증 전후 상태
    order: 10
    level: 2
    objective: authentication request token과 인증 성공 결과의 principal/credentials/authorities/authenticated 상태 차이를 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.auth-architecture.manager-provider
    title: AuthenticationManager와 Provider
    order: 20
    level: 2
    objective: ProviderManager가 Authentication 타입을 지원하는 AuthenticationProvider에 검증을 위임하고 성공/실패를 반환하는 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.auth-architecture.user-details
    title: UserDetailsService와 PasswordEncoder
    order: 30
    level: 2
    objective: 사용자 credential material 조회와 password hash 검증의 협력 경계를 설명하고 raw password 저장/비교를 피한다.
    density: CORE
    visualization: NONE
- key: security.core.context-authz
  title: SecurityContext와 authorization
  order: 100
  scope: SecurityContextHolder, method security, async/thread boundary를 다룬다.
  boundary: thread-local 구현 선택을 모든 비동기 실행에 자동 전파되는 보장으로 설명하지 않는다.
  concepts:
  - key: security.core.context-authz.context-holder
    title: SecurityContextHolder
    order: 10
    level: 3
    objective: 현재 execution thread/request에서 SecurityContext를 조회·설정·정리하는 수명과 credential leakage 위험을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.context-authz.method-security
    title: method authorization
    order: 20
    level: 3
    objective: URL rule과 service method authorization/ownership rule이 서로 다른 방어 경계를 제공하는 이유와 proxy interception 조건을 설명한다.
    density: CORE
    visualization: NONE
  - key: security.core.context-authz.async-context
    title: async context 전파
    order: 30
    level: 3
    objective: 새 thread/executor로 작업을 넘길 때 현재 SecurityContext가 사라지거나 잘못 재사용될 수 있는 이유와 explicit delegation 전략을 설명한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.tokens-oauth
  title: JWT·OAuth·OIDC
  order: 110
  scope: JWT structure/signature, token lifecycle, OAuth 2/OIDC를 다룬다.
  boundary: JWT를 OAuth 자체나 암호화 format과 동일시하지 않는다.
  concepts:
  - key: security.core.tokens-oauth.jwt-structure
    title: JWT 구조와 서명
    order: 10
    level: 3
    objective: header.payload.signature와 JWS 서명이 integrity/authenticity를 제공하지만 payload confidentiality를 제공하지 않는다는 점을 설명한다.
    density: CORE
    visualization: TEXT
  - key: security.core.tokens-oauth.jwt-lifecycle
    title: expiry·issuer·audience·revocation
    order: 20
    level: 3
    objective: exp/iss/aud 등 claim validation과 이미 발급된 self-contained token을 즉시 폐기하기 어려운 trade-off를 판단한다.
    density: CORE
    visualization: NONE
  - key: security.core.tokens-oauth.oauth-oidc
    title: OAuth 2.0과 OpenID Connect
    order: 30
    level: 3
    objective: OAuth authorization과 OIDC authentication layer, authorization code flow, access token과 ID token의 대상/목적을 구분한다.
    density: CORE
    visualization: DIAGRAM
- key: security.core.abuse
  title: SSRF·file·abuse·secrets
  order: 120
  scope: SSRF, unsafe file handling, rate limiting, secret logging을 각각 다룬다.
  boundary: 서로 다른 공격면을 한 개의 generic 방어 문장으로 뭉치지 않는다.
  concepts:
  - key: security.core.abuse.ssrf
    title: SSRF
    order: 10
    level: 3
    objective: 공격자가 server-side HTTP destination을 조작해 내부 metadata/private service에 접근하게 만드는 흐름과 allow-list/redirect/DNS 경계를 설명한다.
    density: CORE
    visualization: DIAGRAM
  - key: security.core.abuse.file-path
    title: File upload와 path traversal
    order: 20
    level: 3
    objective: user filename/path/content-type을 신뢰하지 않고 저장 이름, 위치, 권한, 크기, content 검사와 download authorization을 분리한다.
    density: CORE
    visualization: TEXT
  - key: security.core.abuse.rate-limit
    title: Rate limiting과 abuse control
    order: 30
    level: 3
    objective: login/API abuse에서 identity/IP/device 등 key 선택, window/burst, distributed state와 false positive trade-off를 판단한다.
    density: CORE
    visualization: TEXT
  - key: security.core.abuse.secret-logging
    title: Secret과 token logging
    order: 40
    level: 3
    objective: password, authorization header, session/token, API key가 log/trace/error payload에 유출되는 경로와 redaction/allow-list logging을 설계한다.
    density: CORE
    visualization: NONE
