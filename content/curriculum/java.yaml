    title: "Iterable, Iterator와 순회 중 수정"
    order: 80
    level: 2
    objective: "`Iterable`·`Iterator`와 확장 `for` 문의 관계, 순회 중 안전한 수정 방법, fail-fast 동작의 계약 범위를 설명한다."
    density: CORE
    visualization: TEXT
    visualizationNote: "`Iterator`의 커서와 구조 변경 검사 방식을 단순화해 보여 준다."
  - key: java.core.collections.immutable-unmodifiable-collections
    title: "변경 불가 컬렉션과 수정 불가 뷰"
    order: 90
    level: 2
    objective: "`List.of`·`copyOf`처럼 변경할 수 없는 컬렉션과 원본을 감싼 수정 불가 뷰를 구분하고, 소유권과 변경 전파의 차이를 설명한다."
