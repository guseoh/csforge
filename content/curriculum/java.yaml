  order: 80
  scope: generic type/method, invariance, wildcard, erasure와 generic varargs를 통해 compile-time type safety를 다룬다.
  boundary: JVM runtime data area나 class loading 자체는 JVM Topic에서 다루며 여기서는 Java type system의 generic 의미와 제약에 집중한다.
  concepts:
  - key: java.core.generics.generic-types-methods
    title: Generic types and methods
    order: 10
    level: 1
    objective: generic class와 method를 사용해 재사용성과 compile-time type safety를 함께 표현한다.
