        objective: "Use Map and Set idioms for frequency counting, visited membership, and getOrDefault or merge."
        density: CORE
        visualization: false

  - key: java.core.concurrency
    title: "Concurrency & Async"
    order: 160
    scope: "Java threads, shared state, JMM visibility, synchronization, executors, futures, and liveness."
    boundary: "OS owns scheduling and process theory; Java owns the Thread/JMM/API boundary. Performance/Operations owns full production diagnosis."
    concepts:
      - key: java.core.concurrency.concurrency-vs-parallelism
        title: "Concurrency versus parallelism"
        level: 1
        objective: "Distinguish overlapping progress from simultaneous CPU execution."
        density: STANDARD
        visualization: true
        visualizationNote: "Compare interleaved progress on one worker with simultaneous progress on multiple workers."
      - key: java.core.concurrency.thread-lifecycle-interruption
        title: "Thread lifecycle and interruption"
        level: 2
        objective: "Understand Thread lifecycle, start, join, sleep, interruption, and cooperative cancellation fundamentals."
        density: CORE
        visualization: true
        visualizationNote: "Show the lifecycle states and an interruption signal observed by cooperative code."
      - key: java.core.concurrency.platform-virtual-thread
        title: "Platform and virtual threads"
        level: 2
        objective: "Distinguish Java, platform, and virtual threads and current Java 25 carrier behavior without outdated synchronized-pinning claims."
        density: CORE
        visualization: true
        visualizationNote: "Show virtual threads multiplexed over carrier platform threads and the Java/OS boundary."
      - key: java.core.concurrency.shared-mutable-state-race
        title: "Shared mutable state and race"
        level: 2
        objective: "Identify shared state, lost updates, race conditions, and the invariants that must be protected."
        density: CORE
        visualization: true
        visualizationNote: "Interleave two read-modify-write operations to expose a lost update."
      - key: java.core.concurrency.synchronized-monitor
        title: "Synchronized and monitor"
        level: 2
        objective: "Use intrinsic locking for mutual exclusion and understand monitor ownership and reentrancy."
        density: CORE
        visualization: true
        visualizationNote: "Show one monitor owner, waiting threads, and a reentrant lock acquisition."
      - key: java.core.concurrency.jmm-happens-before-visibility
        title: "JMM happens-before and visibility"
        level: 3
        objective: "Explain visibility and ordering through happens-before rather than CPU-cache folklore."
        density: CORE
        visualization: true
        visualizationNote: "Draw a synchronization edge that makes an earlier write visible to a later read."
      - key: java.core.concurrency.volatile
        title: "volatile"
        level: 3
        objective: "Understand volatile read and write visibility and ordering and why compound operations remain non-atomic."
        density: CORE
        visualization: false
      - key: java.core.concurrency.atomic-cas
        title: "Atomic variables and CAS"
        level: 3
        objective: "Understand compare-and-set, retry and contention, and when atomic variables fit or do not fit an invariant."
        density: CORE
        visualization: true
        visualizationNote: "Trace a successful and a failed CAS retry against one shared value."
      - key: java.core.concurrency.locks-reentrantlock-condition
        title: "Lock, ReentrantLock, and Condition"
        level: 3
        objective: "Compare explicit Lock and Condition control with synchronized where additional lock capabilities are actually needed."
        density: STANDARD
        visualization: false
      - key: java.core.concurrency.executor-task-thread-pools
        title: "Executor, tasks, and thread pools"
        level: 2
        objective: "Separate task submission from thread lifecycle and reason about pool, queue, and resource limits."
        density: CORE
        visualization: true
        visualizationNote: "Show tasks entering a bounded queue and workers consuming them."
      - key: java.core.concurrency.concurrent-collections
        title: "Concurrent collections"
        level: 2
        objective: "Use ConcurrentHashMap and concurrent queues with operation-level contracts rather than assuming arbitrary multi-step atomicity."
        density: CORE
        visualization: false
      - key: java.core.concurrency.threadlocal-context
        title: "ThreadLocal context"
        level: 3
        objective: "Understand thread-bound context, cleanup, thread pools, async boundaries, and virtual-thread considerations."
        density: CORE
        visualization: true
        visualizationNote: "Show context attached to a worker and why pooled-worker reuse requires cleanup."
      - key: java.core.concurrency.future-completablefuture
        title: "Future and CompletableFuture"
        level: 2
        objective: "Compose asynchronous results, propagate failures, and understand executor and thread behavior."
        density: CORE
        visualization: true
        visualizationNote: "Show dependent stages, completion, and exceptional completion paths."
      - key: java.core.concurrency.deadlock-starvation-livelock
        title: "Deadlock, starvation, and livelock"
        level: 3
        objective: "Diagnose liveness failures and reason about lock ordering, progress, and contention."
        density: CORE
        visualization: true
        visualizationNote: "Contrast circular lock wait, never-scheduled work, and endlessly reacting workers."

  - key: java.core.jvm-runtime
    title: "JVM Runtime, Diagnostics & Compatibility"
    order: 170
    scope: "JDK/JVM/class files, loading, runtime data areas, GC, JIT, diagnostics, reflection, annotations, and compatibility."
    boundary: "Performance/Operations owns complete operational diagnosis; Java owns the JVM fundamentals needed to interpret Java runtime behavior. OS owns process and virtual-memory theory."
    concepts:
      - key: java.core.jvm-runtime.jdk-jvm-classfile
        title: "JDK, JVM, and class files"
        level: 1
        objective: "Distinguish JDK, JVM, and class files and explain the source to javac to bytecode to runtime flow."
        density: CORE
        visualization: true
        visualizationNote: "Show source compilation and the runtime boundary without treating bytecode as native code."
      - key: java.core.jvm-runtime.bytecode-javap
        title: "Bytecode and javap"
        level: 2
        objective: "Read simple javap output to connect source constructs to bytecode without memorizing the instruction set."
        density: STANDARD
        visualization: false
      - key: java.core.jvm-runtime.class-loading-linking-initialization
        title: "Class loading, linking, and initialization"
        level: 3
        objective: "Explain loading, verification, preparation, resolution, and initialization with correct specification boundaries."
        density: CORE
        visualization: true
        visualizationNote: "Order the class lifecycle stages and separate preparation from initialization."
      - key: java.core.jvm-runtime.classloader-delegation-type-identity
        title: "ClassLoader delegation and type identity"
        level: 3
        objective: "Understand defining class loader and delegation and why identical binary names can represent different runtime types."
        density: CORE
        visualization: true
        visualizationNote: "Show two loader namespaces and the resulting type-identity boundary."
      - key: java.core.jvm-runtime.jvm-runtime-data-areas-frames
        title: "JVM runtime data areas and frames"
        level: 3
        objective: "Understand JVM stacks, frames, local variables, operand stacks, heap, method area, and runtime constant pool as specification abstractions."
        density: CORE
        visualization: true
        visualizationNote: "Map a method call to a frame and distinguish abstract data areas from physical layout."
      - key: java.core.jvm-runtime.gc-reachability-roots
        title: "GC reachability and roots"
        level: 2
        objective: "Explain object reachability and why source-level scope is not an immediate deallocation rule."
        density: CORE
        visualization: true
        visualizationNote: "Trace root-to-object reachability before and after removing a reference."
      - key: java.core.jvm-runtime.reference-strengths
        title: "Reference strengths"
        level: 3
        objective: "Understand strong, soft, weak, and phantom references and their limited appropriate use cases."
        density: STANDARD
        visualization: false
      - key: java.core.jvm-runtime.gc-fundamentals-collectors
        title: "GC fundamentals and collectors"
        level: 3
        objective: "Understand GC goals and trade-offs and a practical G1 or ZGC overview without treating collector implementation as language semantics."
        density: CORE
        visualization: false
      - key: java.core.jvm-runtime.java-memory-leaks
        title: "Java memory leaks"
        level: 2
        objective: "Explain how reachable but unneeded objects, caches, listeners, ThreadLocal, and other retention can leak memory despite GC."
        density: CORE
        visualization: true
        visualizationNote: "Show a retained object graph rooted by a cache, listener, or ThreadLocal."
      - key: java.core.jvm-runtime.heap-metaspace-native-thread-memory
        title: "Heap, metaspace, native, and thread memory"
        level: 3
        objective: "Distinguish heap from metaspace, native, and thread memory when diagnosing process memory."
        density: CORE
        visualization: true
        visualizationNote: "Partition process memory into JVM-managed and native or thread-related regions."
      - key: java.core.jvm-runtime.jit-hotspot-warmup
        title: "JIT, HotSpot, and warm-up"
        level: 3
        objective: "Scope JIT, profile, and warm-up claims to HotSpot or JVM implementation behavior and understand measurement consequences."
        density: CORE
        visualization: false
      - key: java.core.jvm-runtime.runtime-diagnostics-jcmd-jstack-jfr
        title: "Runtime diagnostics with jcmd, jstack, and JFR"
        level: 3
        objective: "Know what thread dumps, heap information, jcmd, and JFR can reveal and when to use them."
        density: CORE
        visualization: false
      - key: java.core.jvm-runtime.reflection-class-api
        title: "Reflection and Class API"
        level: 2
        objective: "Inspect classes, methods, fields, and constructors reflectively and understand access, type-safety, and runtime-cost boundaries."
        density: CORE
        visualization: false
      - key: java.core.jvm-runtime.annotations-retention-target
        title: "Annotations, Retention, and Target"
        level: 2
        objective: "Understand annotation metadata, Target, Retention, runtime visibility, and meta-annotation basics."
        density: CORE
        visualization: false
      - key: java.core.jvm-runtime.dynamic-proxy-invocationhandler
        title: "Dynamic proxy and InvocationHandler"
        level: 3
        objective: "Understand JDK interface proxies and InvocationHandler as Java groundwork for later Spring proxy and AOP learning."
        density: CORE
        visualization: true
        visualizationNote: "Show an interface call routed through a proxy to an InvocationHandler and target."
      - key: java.core.jvm-runtime.annotation-processing-vs-reflection
        title: "Annotation processing versus reflection"
        level: 3
        objective: "Distinguish compile-time annotation processing or code generation from runtime reflection."
        density: STANDARD
        visualization: true
        visualizationNote: "Separate the compile-time processor path from the runtime metadata inspection path."
      - key: java.core.jvm-runtime.serialization-contract-risk
        title: "Serialization contract risk"
        level: 3
        objective: "Understand Serializable, transient, and serialVersionUID at a high level and why native deserialization is a risky boundary."
        density: STANDARD
        visualization: false
      - key: java.core.jvm-runtime.binary-compatibility-api-evolution
        title: "Binary compatibility and API evolution"
        level: 3
        objective: "Understand that source, binary, and runtime compatibility are different when evolving Java libraries and APIs."
        density: STANDARD
        visualization: false

boundaries:
  - area: "Data Structures & Algorithms"
    owns: "Algorithm theory such as BFS, DFS, shortest path, binary search, and DP."
    javaBoundary: "Java covers collection APIs, comparators, queues, heaps, maps, sets, and coding-test implementation tools only."
  - area: "Operating Systems"
    owns: "Scheduling, processes, virtual memory, and system calls in depth."
    javaBoundary: "Java covers the Thread/JVM boundary and Java concurrency contracts needed to predict Java code."
  - area: "Spring"
    owns: "Container, Bean lifecycle, MVC, transaction, and AOP framework behavior."
    javaBoundary: "Java covers construction, reflection, annotations, proxies, and threading as framework foundations."
  - area: "Database"
    owns: "Database transactions, isolation, locking, and schema behavior."
    javaBoundary: "Java covers I/O and resource ownership around database clients, not database semantics."
  - area: "Performance / Observability / Operations"
    owns: "Full production diagnosis, capacity, and operational remediation."
    javaBoundary: "Java covers JVM, JFR, jcmd, heap, and thread fundamentals needed to interpret runtime evidence."
