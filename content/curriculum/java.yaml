    visualization: NONE
- key: java.core.design-patterns
  title: Java Design Patterns
  order: 60
  scope: 실제 variation, wrapping, boundary 보호, 상태 변화 문제를 해결하는 소규모 Java 디자인 패턴을 각각 독립적으로 다룬다.
  boundary: 패턴 자체가 목적이 아니며 Spring framework 구현을 중복하거나 단순 코드를 억지로 복잡하게 만들지 않는다.
  concepts:
  - key: java.core.design-patterns.strategy-pattern
    title: Strategy pattern
    order: 10
    level: 2
    objective: 정책·타입별 분기가 계속 늘어날 때 교체 가능한 behavior로 variation을 분리하는 Strategy의 적용 기준을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
    visualizationNote: 한 use case가 안정된 contract 뒤의 여러 strategy를 선택하는 구조를 그린다.
  - key: java.core.design-patterns.template-method-pattern
    title: Template Method pattern
    order: 20
    level: 2
    objective: 공통 algorithm skeleton을 상위 타입에 두고 일부 단계만 변경하는 Template Method와 상속 결합 trade-off를 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.design-patterns.factory-pattern
    title: Factory pattern
    order: 30
    level: 2
    objective: 구현 선택이나 복잡한 생성 정책을 한 경계에 모을 때 Factory가 필요한 이유와 불필요한 factory abstraction을 구분한다.
