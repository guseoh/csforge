  - key: java.core.concurrency.concurrent-collections
    title: "동시성 컬렉션"
    order: 150
    level: 2
    objective: "ConcurrentHashMap과 동시성 큐가 개별 연산에 제공하는 스레드 안전 계약을 이해하고 여러 단계의 업무 로직 전체가 원자적으로 실행된다고 가정하지 않는다."
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.concurrency.shared-mutable-state-race
  - key: java.core.concurrency.threadlocal-context
    title: "ThreadLocal과 실행 문맥"
    order: 160
    level: 3
    objective: "ThreadLocal이 스레드별로 값을 보관하는 방식과 정리, 스레드 풀 재사용, 비동기 경계, 가상 스레드 환경에서의 주의점을 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.executor-task-thread-pools
