    visualization: TEXT
    prerequisites:
    - java.core.generics.generic-types-methods
    visualizationNote: "컴파일 시점의 제네릭 타입 정보와 실행 시점에 남는 타입 정보를 구분한다."
  - key: java.core.generics.generic-varargs-heap-pollution
    title: "제네릭 가변 인자(varargs)와 힙 오염(heap pollution)"
    order: 60
    level: 3
    objective: generic varargs에서 heap pollution이 발생할 수 있는 이유와 @SafeVarargs를 사용할 수 있는 조건을 설명한다.
    density: STANDARD
    visualization: NONE
    prerequisites:
    - java.core.generics.type-erasure-reifiable-types
- key: java.core.exceptions-resources
  title: "예외와 자원 관리"
  order: 90
  scope: 예외의 종류와 전파·변환, 연산 실패 뒤의 객체 상태, 자원 소유권을 다룬다.
  boundary: DB 트랜잭션과 격리 수준은 Database 영역이 다루며 Java에서는 호출 경계의 예외·자원 계약에 집중한다.
  concepts:
  - key: java.core.exceptions-resources.throwable-checked-unchecked-error
    title: "`Throwable`, 검사 예외(checked exception)·비검사 예외(unchecked exception)·`Error`"
    order: 10
    level: 1
    objective: "`Throwable` 계층과 검사·비검사 예외(checked·unchecked exception), `Error`를 컴파일러 검사 관점에서 구분하고 단순히 좋고 나쁜 예외로 판단하지 않는다."
    density: CORE
    visualization: NONE
