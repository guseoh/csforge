    order: 80
    level: 2
    objective: 상태별 behavior와 transition이 커질 때 State object로 분리하는 방식과 단순 enum/state method가 더 나은 경우를 구분한다.
    density: STANDARD
    visualization: DIAGRAM
    visualizationNote: context가 현재 state object에 behavior를 위임하고 state가 전환되는 흐름을 보여 준다.
- key: java.core.collections
