  - key: java.core.collections.hashmap-hashing-collision
    title: "HashMap 조회와 해시 충돌"
    order: 30
    level: 2
    objective: "해시 계산부터 후보 버킷 탐색, 충돌 처리, `equals` 확인까지의 조회 흐름과 변경 가능한 키의 위험을 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.object-contracts.equals-contract
    - java.core.object-contracts.hashcode-contract
    visualizationNote: "해시 계산→후보 버킷 선택→충돌 비교→`equals` 확인의 흐름과 키 변경 문제를 그린다."
  - key: java.core.collections.hashset-set-semantics
    title: "HashSet과 중복 판단"
    order: 40
    level: 2
    objective: "Set의 중복 없음 규칙이 동등성과 hashCode 계약에 어떻게 연결되는지 이해하고 중복 판정 결과를 예측한다."
    density: STANDARD
    visualization: NONE
    prerequisites:
    - java.core.object-contracts.equals-contract
    - java.core.object-contracts.hashcode-contract
  - key: java.core.collections.sorted-collections-tree
    title: "TreeSet과 TreeMap의 정렬 기준"
    order: 50
    level: 2
    objective: "TreeMap·TreeSet의 정렬 요구와 Comparator·Comparable 계약이 동등성 규칙과 다를 때 생기는 문제를 이해한다."
