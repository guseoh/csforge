    prerequisites:
    - java.core.concurrency.executor-task-thread-pools
    visualizationNote: dependent stage가 정상 완료와 exceptional completion으로 이어지는 경로를 보여 준다.
  - key: java.core.concurrency.deadlock-starvation-livelock
    title: Deadlock, starvation, and livelock
    order: 190
    level: 3
    objective: circular lock wait, 작업 기회 부족, 서로 반응만 하며 진전하지 못하는 liveness 문제를 구분하고 lock ordering과 progress 관점에서 진단한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.synchronized-monitor
    visualizationNote: deadlock의 순환 wait, starvation, livelock의 서로 다른 진행 실패를 비교한다.
- key: java.core.jvm-runtime
  title: JVM Runtime & Diagnostics
  order: 170
  scope: JDK/JVM/class file, bytecode, class loading, runtime data area, GC, memory, JIT와 기본 JVM 진단 도구를 다룬다.
  boundary: Performance/Operations는 production diagnosis 전체를, OS는 process/virtual memory 이론을 소유하며 여기서는 Java runtime을 이해하는 JVM 기반에 집중한다.
  concepts:
  - key: java.core.jvm-runtime.jdk-jvm-classfile
    title: JDK, JVM, and class files
    order: 10
    level: 1
    objective: JDK, JVM, class file을 구분하고 source→javac→bytecode→JVM runtime 흐름을 설명한다.
    density: CORE
    visualization: DIAGRAM
    visualizationNote: source compile과 runtime 경계를 보여 주고 bytecode를 native code와 동일시하지 않는다.
  - key: java.core.jvm-runtime.bytecode-javap
    title: Bytecode and javap
    order: 20
    level: 2
    objective: 간단한 javap 출력과 bytecode를 읽어 source construct가 JVM instruction과 어떻게 연결되는지 이해하되 instruction set 암기를 목표로 하지 않는다.
    density: STANDARD
    visualization: NONE
  - key: java.core.jvm-runtime.class-loading-linking-initialization
    title: Class loading, linking, and initialization
    order: 30
    level: 3
    objective: loading, verification, preparation, resolution, initialization 단계를 구분하고 specification boundary에 맞게 class lifecycle을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jdk-jvm-classfile
    visualizationNote: class lifecycle 단계와 preparation·initialization의 차이를 순서대로 보여 준다.
  - key: java.core.jvm-runtime.classloader-delegation-type-identity
    title: ClassLoader delegation and type identity
    order: 40
    level: 3
    objective: defining ClassLoader와 delegation을 이해하고 같은 binary name이라도 다른 loader가 정의하면 다른 runtime type이 될 수 있음을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.class-loading-linking-initialization
    visualizationNote: 두 ClassLoader namespace가 동일 이름 class를 서로 다른 type으로 정의하는 경계를 그린다.
  - key: java.core.jvm-runtime.jvm-runtime-data-areas-frames
    title: JVM runtime data areas and frames
    order: 50
    level: 3
    objective: JVM stack, frame, local variable array, operand stack, heap, method area, runtime constant pool을 JVMS의 abstract data area로 이해한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.bytecode-javap
    visualizationNote: method call이 frame을 만들고 JVM abstract data area와 연결되는 모습을 보여 준다.
  - key: java.core.jvm-runtime.gc-reachability-roots
    title: GC reachability and roots
    order: 60
    level: 2
    objective: source-level scope 종료와 즉시 deallocation을 동일시하지 않고 GC root에서 객체까지의 reachability로 수명 판단을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
    visualizationNote: root에서 참조를 따라 도달 가능한 object graph가 참조 제거 후 어떻게 달라지는지 보여 준다.
  - key: java.core.jvm-runtime.reference-strengths
    title: Reference strengths
    order: 70
    level: 3
    objective: strong, soft, weak, phantom reference의 의미와 제한적인 사용 목적을 구분하고 일반 object lifetime 관리 수단처럼 남용하지 않는다.
    density: STANDARD
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
  - key: java.core.jvm-runtime.gc-fundamentals-collectors
    title: GC fundamentals and collectors
    order: 80
    level: 3
    objective: GC의 reclaim·pause·throughput/latency trade-off를 이해하고 G1/ZGC 같은 collector를 Java language semantics와 구분해 실용적인 수준으로 비교한다.
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
  - key: java.core.jvm-runtime.java-memory-leaks
    title: Java memory leaks
    order: 90
    level: 2
    objective: GC가 있어도 cache, listener, ThreadLocal 등에서 필요 없는 객체가 reachable 상태로 남아 memory leak이 될 수 있음을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
    visualizationNote: cache/listener/ThreadLocal root가 필요 없는 object graph를 계속 retain하는 모습을 보여 준다.
  - key: java.core.jvm-runtime.heap-metaspace-native-thread-memory
    title: Heap, metaspace, native, and thread memory
    order: 100
    level: 3
    objective: Java process memory를 heap만으로 보지 않고 metaspace, native allocation, thread stack 등과 구분해 진단 관점에서 이해한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
    visualizationNote: process memory 안에서 JVM-managed heap과 metaspace/native/thread 관련 영역을 구분한다.
  - key: java.core.jvm-runtime.jit-hotspot-warmup
    title: JIT, HotSpot, and warm-up
    order: 110
    level: 3
    objective: JIT, profiling, tiered compilation, warm-up 같은 설명을 HotSpot/JVM implementation behavior로 범위를 명시하고 benchmark 결과에 미치는 영향을 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.jvm-runtime.runtime-diagnostics-jcmd-jstack-jfr
    title: Runtime diagnostics with jcmd, jstack, and JFR
    order: 120
    level: 3
    objective: thread dump, jcmd와 JFR이 각각 어떤 runtime evidence를 제공하는지 알고 증상에 맞는 기본 진단 도구를 선택한다.
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
- key: java.core.metadata-compatibility
  title: Reflection, Metadata & Compatibility
  order: 180
  scope: Reflection/Class API, annotation, dynamic proxy, annotation processing, serialization, Java module system과 API compatibility를 다룬다.
  boundary: Spring의 proxy/AOP/container 기능 자체는 Spring 영역이 소유하며 여기서는 그 기반이 되는 Java language/runtime mechanism과 library compatibility를 이해한다.
  concepts:
  - key: java.core.metadata-compatibility.reflection-class-api
    title: Reflection and Class API
    order: 10
    level: 2
    objective: Class와 reflection API로 runtime type, method, field, constructor를 조사하고 access·type safety·performance 경계를 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.metadata-compatibility.annotations-retention-target
    title: Annotations, Retention, and Target
    order: 20
    level: 2
    objective: annotation metadata와 @Target, @Retention, runtime visibility, meta-annotation의 기본 의미를 설명한다.
    density: CORE
    visualization: NONE
  - key: java.core.metadata-compatibility.dynamic-proxy-invocationhandler
    title: Dynamic proxy and InvocationHandler
    order: 30
    level: 2
    objective: JDK dynamic proxy가 interface call을 InvocationHandler로 중계하는 구조를 이해하고 Spring proxy 학습을 위한 Java 기반을 만든다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.metadata-compatibility.reflection-class-api
    visualizationNote: interface 호출이 proxy와 InvocationHandler를 거쳐 target으로 전달되는 흐름을 보여 준다.
  - key: java.core.metadata-compatibility.annotation-processing-vs-reflection
    title: Annotation processing versus reflection
    order: 40
    level: 2
    objective: compile-time annotation processing/code generation과 runtime reflection을 실행 시점과 결과물 관점에서 구분한다.
    density: STANDARD
    visualization: TEXT
    prerequisites:
    - java.core.metadata-compatibility.annotations-retention-target
    - java.core.metadata-compatibility.reflection-class-api
    visualizationNote: compile-time processor 경로와 runtime metadata inspection 경로를 나누어 보여 준다.
  - key: java.core.metadata-compatibility.serialization-contract-risk
    title: Serialization contract risk
    order: 50
    level: 2
    objective: Serializable, transient, serialVersionUID를 high-level contract로 이해하고 native Java deserialization을 신뢰 경계에서 위험한 입력 처리로 본다.
    density: STANDARD
    visualization: NONE
  - key: java.core.metadata-compatibility.jpms-classpath-modulepath
    title: JPMS, classpath, and module path
    order: 60
    level: 2
    objective: classpath와 module path의 차이, named/unnamed module, requires/exports의 기본 의미를 이해하고 Java module system이 접근성과 dependency를 어떻게 명시하는지 설명한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.metadata-compatibility.binary-compatibility-api-evolution
    title: Binary compatibility and API evolution
    order: 70
    level: 2
    objective: library/API를 변경할 때 source compatibility, binary compatibility, runtime compatibility가 서로 다른 문제임을 구분한다.
    density: STANDARD
    visualization: NONE
boundaries:
- area: Data Structures & Algorithms
  owns: BFS/DFS, shortest path, binary search, DP 같은 알고리즘과 자료구조 이론
  javaBoundary: Java는 collection, comparator, queue, heap, map/set과 coding-test 구현 API를 다룬다.
- area: Operating Systems
  owns: scheduling, process, virtual memory, system call을 포함한 OS 동작
  javaBoundary: Java는 Java code를 예측하는 데 필요한 Thread/JVM/JMM 경계를 다룬다.
- area: Spring
  owns: container, Bean lifecycle, MVC, transaction, AOP와 framework-specific behavior
  javaBoundary: Java는 construction, reflection, annotation, proxy, threading처럼 Spring이 기반으로 사용하는 언어/runtime mechanism을 다룬다.
- area: Database
  owns: DB transaction, isolation, locking, schema와 persistence semantics
  javaBoundary: Java는 I/O/JDBC resource ownership 같은 Java API 계약까지만 다룬다.
- area: Performance / Observability / Operations
  owns: production diagnosis, capacity, 운영 대응과 end-to-end observability
  javaBoundary: Java는 JVM/JFR/jcmd, heap/thread 등 runtime evidence를 읽기 위한 기반을 다룬다.
- area: Network & HTTP
  owns: TCP/IP, HTTP, socket/protocol behavior와 network architecture
  javaBoundary: Java는 byte/character I/O, NIO Channel/Buffer/Selector처럼 Java program이 사용하는 API abstraction까지만 다룬다.
