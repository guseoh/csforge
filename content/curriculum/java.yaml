- key: java.core.concurrency
  title: Concurrency & Async
  order: 160
  scope: Java thread, shared mutable state, JMM visibility, synchronization, executor, context propagation, future와 liveness를 다룬다.
  boundary: OS는 scheduling/process 이론을 소유하며 Java는 Thread/JMM/API contract에 집중한다. production diagnosis 전체는 Performance/Operations 영역이 소유한다.
  concepts:
  - key: java.core.concurrency.concurrency-vs-parallelism
