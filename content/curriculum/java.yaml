    visualizationNote: "원본 컬렉션 변경이 변경 불가 뷰와 독립 복사본에 각각 어떻게 반영되는지 비교한다."
- key: java.core.generics
  title: "제네릭과 타입 안전성"
  order: 80
  scope: 제네릭 타입과 메서드, 불공변성, 와일드카드, 타입 소거, 제네릭 가변 인자를 통해 컴파일 시점의 타입 안전성을 다룬다.
  boundary: JVM 런타임 데이터 영역과 클래스 로딩은 JVM Topic에서 다루며 여기서는 Java 타입 시스템에서 제네릭이 갖는 의미와 제약에 집중한다.
  concepts:
  - key: java.core.generics.generic-types-methods
    title: "제네릭 타입과 제네릭 메서드"
    order: 10
    level: 1
    objective: "제네릭 클래스와 메서드로 재사용성을 높이면서 컴파일 시점의 타입 안전성을 지키는 방법을 이해한다."
    density: CORE
    visualization: NONE
  - key: java.core.generics.generic-invariance
    title: "제네릭 불공변성과 잘못된 쓰기 방지"
