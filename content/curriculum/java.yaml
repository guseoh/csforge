schemaVersion: 2
area:
  key: java
  title: Java
  baseline: Java SE 25
  contentKeyPrefix: java.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    terminologyRule: 가능하면 쉬운 한국어로 문제와 상태를 먼저 설명한 뒤 정확한 Java/JVM 용어를 함께 소개한다.
    layerRule:
    - EASY_ENTRY
    - ACCURATE_MECHANISM
    - PRACTICAL_REASONING_CONNECTION
  level:
    L1: 일반적인 Java 코드를 읽고 쓰는 데 필요한 기반
    L2: backend 개발에 필요한 설계, API 선택, trade-off, 실행 동작
    L3: JMM/JVM/runtime/performance를 포함한 심화 추론
  source:
    primary:
    - Java SE 25 JLS
    - Java SE 25 JVMS
    - Java SE 25 API and Oracle Java guides
    - Applicable OpenJDK JEPs and project documentation
    discovery:
    - Effective Java, 3rd edition
    - Modern Java in Action
    - Established Java/JVM books and conference material
    - Verified Korean/company engineering material such as NAVER D2, 우아한형제들, LINE/LY, Kakao/KakaoPay, Hyperconnect
    versionRule: runtime/implementation 주장은 Java SE 25 공식 자료와 대조하고 language, JVM specification, JDK/HotSpot implementation, OS behavior를 구분한다.
    urlRule: 실제로 확인한 reference만 기록하며 URL을 추측하거나 만들지 않는다.
  question:
    designRule: Question 수, 유형, 난이도는 각 Learning Objective를 가장 잘 검증하도록 결정한다.
    reviewRule: Concept별 고정 quota를 두지 않고 Topic과 LearningArea 전체에서 유형과 난이도 coverage를 검토한다.
    difficulty:
      EASY: 학습 직후 핵심 원칙을 직접 확인한다.
      MEDIUM: 코드 결과, 비교, 흔한 오해처럼 한 단계 더 추론한다.
      HARD: 복합 코드, debugging, API 설계, concurrency/JVM reasoning, backend 상황을 결합하며 obscure trivia로 난이도를 만들지 않는다.
    typeRule: 특정 Question type을 기본으로 우선하지 않고 Learning Objective와 채점 가능성에 맞는 유형을 선택한다.
    distractorRule: 객관식 오답은 실제로 헷갈릴 수 있는 misconception을 사용하고 명백히 무관한 선택지로 정답을 노출하지 않는다.
  visualization:
    values:
    - NONE
    - TEXT
    - DIAGRAM
    NONE: 시각화가 없어도 설명과 코드로 충분하다.
    TEXT: text/ASCII 흐름이나 관계 그림이면 충분하다.
    DIAGRAM: 참조 관계, 상태 전이, 실행 순서 등에서 실제 diagram/image가 학습 효과를 크게 높인다.
  prerequisites:
    rule: Topic 전체를 선형 course로 묶지 않는다. Concept 이해에 실제 선행 지식이 필요한 경우에만 선택적으로 prerequisites를 기록한다.
topics:
- key: java.core.language-types
  title: "Java 언어와 값의 의미"
  order: 10
  scope: Java 값, 변수, 변환, 배열, final, 문자열처럼 일반 Java 코드를 읽고 쓰는 데 필요한 언어 의미를 다룬다.
  boundary: 물리 메모리 배치나 JVM 구현 세부를 Java 언어 보장처럼 설명하지 않는다.
  concepts:
  - key: java.core.language-types.primitive-reference-values
    title: "원시 값과 참조 값"
    order: 10
    level: 1
    objective: 원시 값과 참조 값을 구분하고 참조를 보장된 물리 메모리 주소와 동일시하지 않는다.
    density: CORE
    visualization: DIAGRAM
    visualizationNote: 원시 값 복사와 두 변수가 같은 객체를 가리키는 상황을 비교한다.
  - key: java.core.language-types.variables-scope-definite-assignment
    title: "변수, 범위와 확정 할당"
    order: 20
    level: 1
    objective: 필드·지역 변수·매개변수의 차이, scope, 초기화와 definite assignment 규칙을 구분한다.
    density: CORE
    visualization: TEXT
    visualizationNote: 작은 scope 구조와 변수를 사용할 수 있는 시점을 표시한다.
  - key: java.core.language-types.numeric-conversion-overflow
    title: "숫자 변환과 오버플로"
    order: 30
    level: 1
    objective: "정수의 확장·축소 변환(widening·narrowing conversion), 숫자 승격과 오버플로가 코드 결과에 미치는 영향을 예측한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.language-types.boxing-unboxing-wrapper
    title: "박싱·언박싱과 래퍼 타입"
    order: 40
    level: 2
    objective: boxing/unboxing, null unboxing 위험, wrapper equality와 캐시 관련 흔한 오해를 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.language-types.pass-by-value
    title: "Java는 항상 값을 전달한다"
    order: 50
    level: 1
    objective: Java가 항상 값을 전달하며 참조형도 참조 값이 복사된다는 점과 호출자 변수·매개변수 변수가 서로 다름을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: 호출자 변수의 참조 값이 매개변수로 복사되고 재대입은 호출자 변수를 바꾸지 못하는 흐름을 그린다.
  - key: java.core.language-types.arrays-covariance-runtime-check
    title: "배열 공변성과 저장 시 런타임 타입 검사"
    order: 60
    level: 2
    objective: Java 배열의 고정 길이·참조형 성격과 배열 covariance가 ArrayStoreException 같은 런타임 검사를 만드는 이유를 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: "`Object[]` 변수가 `String[]` 배열을 가리킬 때 잘못된 저장이 실행 시점에 차단되는 흐름을 보여 준다."
  - key: java.core.language-types.final-reference-and-immutability
    title: "final과 불변 객체는 같은 말이 아니다"
    order: 70
    level: 1
    objective: "`final`이 변수의 재대입을 제한하는 것과 객체의 불변성을 보장하는 것은 다름을 구분하고, 메서드와 클래스에 적용할 때의 의미도 이해한다."
    density: CORE
    visualization: NONE
  - key: java.core.language-types.string-immutability-equality
    title: "String의 불변성과 문자열 비교"
    order: 80
    level: 1
    objective: String이 불변 객체라는 의미와 ==가 identity를, equals가 문자열 내용을 비교한다는 차이를 코드 결과와 함께 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: 서로 다른 String 객체의 identity와 같은 문자열 내용 equality를 비교한다.
  - key: java.core.language-types.string-pool-interning
    title: "문자열 풀(String Pool)과 intern()"
    order: 90
    level: 2
    objective: "문자열 리터럴(string literal)의 재사용, 문자열 풀(string pool), `intern()`의 의미를 이해하되 이를 모든 `String` 생성과 메모리 동작에 대한 단순한 규칙으로 일반화하지 않는다."
    density: STANDARD
    visualization: TEXT
    prerequisites:
    - java.core.language-types.string-immutability-equality
    visualizationNote: literal이 재사용되는 경우와 runtime에 별도 String 객체가 만들어지는 경우를 구분한다.
  - key: java.core.language-types.stringbuilder-mutable-text
    title: "StringBuilder와 반복 문자열 조립"
    order: 100
    level: 1
    objective: 반복적인 문자열 조립에서 StringBuilder가 mutable buffer를 제공하는 이유와 String 불변성과의 차이를 이해하고 적절한 사용 범위를 판단한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.string-immutability-equality
    visualizationNote: String은 연결할 때마다 새 결과를 만들 수 있고 StringBuilder는 하나의 가변 buffer에 append한 뒤 String으로 확정하는 흐름을 비교한다.
- key: java.core.object-model
  title: "객체 생성, 상태와 객체지향"
  order: 20
  scope: 객체 생성과 초기화, 캡슐화, 추상화, 상속·합성, 다형성과 타입 변환 등 Java 객체 모델을 다룬다.
  boundary: Spring Bean 생명주기와 프록시 프레임워크 동작은 Spring 영역이 소유하며 여기서는 Java 언어 수준의 객체 동작에 집중한다.
  concepts:
  - key: java.core.object-model.class-object-constructor
    title: "클래스, 객체와 생성자"
    order: 10
    level: 1
    objective: "클래스·객체·생성자의 역할을 구분하고 객체 생성 시 유효한 초기 상태를 만드는 기본 흐름을 이해한다."
    density: CORE
    visualization: NONE
  - key: java.core.object-model.static-vs-instance-members
    title: "static 멤버와 인스턴스 멤버"
    order: 20
    level: 1
    objective: "`static` 멤버는 클래스에 속하고 인스턴스 멤버는 객체 상태에 속한다는 차이와 접근·공유 특성을 이해한다."
    density: CORE
    visualization: TEXT
    visualizationNote: "여러 인스턴스가 하나의 `static` 상태를 공유하는 구조와 각 인스턴스의 개별 상태를 비교한다."
  - key: java.core.object-model.initialization-order-constructor-chaining
    title: "초기화 순서와 생성자 연결"
    order: 30
    level: 2
    objective: "클래스 초기화와 인스턴스 필드·초기화 블록·생성자의 실행 순서, `this`·`super` 생성자 연결을 예측한다."
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.static-vs-instance-members
    visualizationNote: "클래스 초기화와 객체 생성 단계를 시간 순서로 보여 준다."
  - key: java.core.object-model.encapsulation-invariants
    title: "캡슐화와 객체의 불변 조건"
    order: 40
    level: 1
    objective: 상태 변경 규칙과 invariant를 객체 내부에 두고 무분별한 setter 노출보다 의도가 드러나는 동작으로 보호하는 이유를 설명한다.
    density: CORE
    visualization: NONE
  - key: java.core.object-model.abstraction-responsibility
    title: "추상화와 객체의 책임"
    order: 50
    level: 2
    objective: 객체가 제공해야 할 책임과 계약을 중심으로 추상화하고 불필요한 구현 세부 노출을 줄인다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-model.inheritance-is-a
    title: "상속과 is-a 관계"
    order: 60
    level: 2
    objective: 상속을 의미 있는 subtype/is-a 관계에 사용할 때의 장점과 강한 결합·취약한 기반 클래스 문제를 이해한다.
    density: STANDARD
    visualization: TEXT
    visualizationNote: is-a 계층과 has-a 협력 구조를 비교한다.
  - key: java.core.object-model.composition-collaboration
    title: "합성과 객체 협력"
    order: 70
    level: 2
    objective: 독립적으로 바뀌어야 하는 행동은 상속보다 객체 협력과 합성으로 분리하는 이유와 trade-off를 설명한다.
    density: CORE
    visualization: DIAGRAM
    visualizationNote: 상속으로 구현을 물려받는 구조와 collaborator에 위임하는 구조를 비교한다.
  - key: java.core.object-model.polymorphism-dynamic-dispatch
    title: "다형성과 런타임 메서드 선택"
    order: 80
    level: 2
    objective: "선언 타입과 런타임 객체 타입을 구분하고 재정의된 인스턴스 메서드가 실행 시점에 선택되는 동작을 예측한다."
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.inheritance-is-a
    visualizationNote: "선언 타입과 실제 객체 타입을 따라 재정의된 메서드가 선택되는 흐름을 나타낸다."
  - key: java.core.object-model.overload-vs-override
    title: "오버로딩과 오버라이딩"
    order: 90
    level: 2
    objective: "컴파일 시점의 오버로드 해석(overload resolution)과 실행 시점의 재정의 메서드 선택(override dispatch)을 구분하고, 혼합된 코드의 호출 결과를 예측한다."
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
  - key: java.core.object-model.reference-casting-instanceof
    title: "참조 타입 변환과 instanceof"
    order: 100
    level: 2
    objective: "상향·하향 형변환(upcasting·downcasting), `ClassCastException`, `instanceof`와 패턴 매칭의 타입 검사 의미를 이해한다."
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
    visualizationNote: 상위 타입 참조가 하위 객체를 가리킬 때 안전한/위험한 downcast 경로를 비교한다.
  - key: java.core.object-model.interface-vs-abstract-class
    title: "인터페이스와 추상 클래스 선택"
    order: 110
    level: 2
    objective: "계약 중심 다형성, 공유 상태·구현, 확장 요구를 기준으로 인터페이스와 추상 클래스를 선택한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.object-model.immutability-defensive-copy
    title: "불변 객체와 방어적 복사"
    order: 120
    level: 2
    objective: "불변 객체를 설계하고 변경 가능한 입력·출력 객체의 소유권 경계를 방어적 복사로 보호해야 하는 상황을 판단한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.final-reference-and-immutability
    visualizationNote: "변경 가능한 컬렉션을 그대로 공유할 때와 복사해 소유권을 분리할 때를 비교한다."
- key: java.core.api-design
  title: "객체 생성과 API 설계"
  order: 30
  scope: 생성 API, 의존성 전달, 접근 범위와 메서드 계약처럼 유지보수 가능한 Java API 설계를 다룬다.
  boundary: Spring의 의존성 주입 컨테이너 동작은 Spring 영역에서 다루고 여기서는 순수 Java 객체 생성과 API 계약에 집중한다.
  concepts:
  - key: java.core.api-design.static-factory-method
    title: "정적 팩터리 메서드"
    order: 10
    level: 2
    objective: "이름 있는 생성, 인스턴스 재사용, 하위 타입 반환, 불변 조건 보호가 필요할 때 생성자보다 정적 팩터리가 유리한 이유를 설명한다."
    density: CORE
    visualization: NONE
  - key: java.core.api-design.builder-pattern-construction
    title: "Builder로 복잡한 생성 인자 다루기"
    order: 20
    level: 2
    objective: 선택 인자가 많거나 이름 있는 구성 단계가 필요할 때 builder를 사용하되 필수 invariant를 숨기지 않는다.
    density: STANDARD
    visualization: NONE
  - key: java.core.api-design.dependency-injection-construction
    title: "의존성을 밖에서 전달하는 설계"
    order: 30
    level: 2
    objective: "숨겨진 전역·정적 의존성보다 필요한 협력 객체를 명시적으로 전달해 결합도를 낮추고 테스트하기 쉬워지는 이유를 설명한다."
    density: CORE
    visualization: TEXT
    visualizationNote: constructor로 보이는 dependency와 내부 global lookup을 비교한다.
  - key: java.core.api-design.minimize-accessibility-api-surface
    title: "필요한 범위만 공개하기"
    order: 40
    level: 2
    objective: "타입과 멤버를 필요한 범위까지만 공개하고, 공개 API 범위가 장기 호환성 비용에 미치는 영향을 이해한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.api-design.method-contract-parameter-validation
    title: "메서드 계약과 매개변수 검증"
    order: 50
    level: 2
    objective: "사전 조건(precondition), null 허용 여부, 유효 범위와 실패 방식을 명시해 메서드 사용 계약을 분명하게 만든다."
    density: CORE
    visualization: NONE
- key: java.core.object-contracts
  title: "객체 계약과 정렬"
  order: 40
  scope: equals/hashCode/toString과 Comparable/Comparator처럼 Java API와 컬렉션이 의존하는 객체 계약을 다룬다.
  boundary: 컬렉션 내부 구현은 Collections Topic에서 다루며 여기서는 객체가 제공하는 동등성·순서 계약에 집중한다.
  concepts:
  - key: java.core.object-contracts.equals-contract
    title: "equals 계약과 논리적 동등성"
    order: 10
    level: 2
    objective: reflexive·symmetric·transitive·consistent·null 규칙을 적용하고 어떤 상태를 논리적 equality에 포함할지 판단한다.
    density: CORE
    visualization: NONE
  - key: java.core.object-contracts.hashcode-contract
    title: "hashCode와 equals의 계약"
    order: 20
    level: 2
    objective: equals와 hashCode의 계약을 함께 지키고 위반 시 hash 기반 collection에서 발생하는 문제를 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-contracts.equals-contract
    visualizationNote: 같은 객체가 같은 hash 후보 영역으로 이동한 뒤 equals로 확인되는 과정을 보여 준다.
  - key: java.core.object-contracts.tostring-diagnostics
    title: "toString과 진단용 표현"
    order: 30
    level: 1
    objective: debugging에 유용한 toString을 작성하되 안정적 serialization 형식이나 민감정보 안전 형식으로 오해하지 않는다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-contracts.comparable-natural-order
    title: "Comparable과 자연 순서"
    order: 40
    level: 2
    objective: 자연 순서를 정의하고 compareTo와 equals의 불일치가 sorted collection에 미치는 영향을 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-contracts.comparator-custom-order
    title: "Comparator로 정렬 기준 조합하기"
    order: 50
    level: 2
    objective: 여러 기준을 안전하게 조합한 custom order를 만들고 subtraction 기반 비교의 overflow 위험을 피한다.
    density: CORE
    visualization: NONE
- key: java.core.enum-modeling
  title: "열거형(Enum)과 타입 안전한 모델링"
  order: 50
  scope: 닫힌 값 집합과 enum의 동작, EnumSet·EnumMap 같은 열거형 전용 API를 다룬다.
  boundary: DB 저장 스키마는 Database 영역이 소유하며 여기서는 ordinal 값을 외부 식별자로 노출할 때의 Java 모델링 위험까지만 다룬다.
  concepts:
  - key: java.core.enum-modeling.enum-closed-values-behavior
    title: "enum으로 닫힌 값 집합 모델링하기"
    order: 10
    level: 1
    objective: 닫힌 값 집합을 enum으로 모델링하고 상태와 관련 행동을 함께 두는 것이 응집도를 높이는 경우를 판단한다.
    density: CORE
    visualization: NONE
  - key: java.core.enum-modeling.enum-ordinal-name-persistence
    title: "enum 순번(ordinal)과 외부 저장값"
    order: 20
    level: 2
    objective: ordinal은 선언 순서에 따라 바뀌므로 안정적 외부 identity로 사용하기 위험하다는 점과 name 사용의 trade-off를 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.enum-modeling.enumset
    title: "EnumSet으로 enum 집합 표현하기"
    order: 30
    level: 2
    objective: "enum 집합이 필요할 때 EnumSet으로 타입 의도가 분명하고 효율적인 집합을 구성한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.enum-modeling.enummap
    title: "EnumMap으로 enum 키 매핑하기"
    order: 40
    level: 2
    objective: key가 enum으로 제한된 mapping에서 EnumMap이 일반 Map보다 의도를 잘 드러내는 경우를 판단한다.
    density: STANDARD
    visualization: NONE
- key: java.core.design-patterns
  title: "Java 디자인 패턴"
  order: 60
  scope: 실제 변경 지점, 객체 감싸기, 경계 보호, 상태 변화 문제를 해결하는 소규모 Java 디자인 패턴을 각각 독립적으로 다룬다.
  boundary: 패턴 적용 자체가 목적은 아니며 Spring 프레임워크 구현을 중복하거나 단순한 코드를 억지로 복잡하게 만들지 않는다.
  concepts:
  - key: java.core.design-patterns.strategy-pattern
    title: "전략(Strategy) 패턴과 정책 교체"
    order: 10
    level: 2
    objective: 정책·타입별 분기가 계속 늘어날 때 교체 가능한 behavior로 variation을 분리하는 Strategy의 적용 기준을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
    visualizationNote: "한 사용 사례가 안정된 계약 뒤에 있는 여러 전략(Strategy) 중 하나를 선택하는 구조를 그린다."
  - key: java.core.design-patterns.template-method-pattern
    title: "템플릿 메서드(Template Method) 패턴과 공통 실행 흐름"
    order: 20
    level: 2
    objective: "공통 알고리즘의 뼈대(skeleton)를 상위 타입에 두고 일부 단계만 바꾸는 Template Method의 구조와 상속 결합의 장단점을 이해한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.design-patterns.factory-pattern
    title: "팩터리(Factory)와 객체 생성 책임"
    order: 30
    level: 2
    objective: "구현 선택이나 복잡한 생성 정책을 한 경계에 모을 때 팩터리(Factory)가 필요한 이유와 불필요한 팩터리 추상화를 구분한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.design-patterns.adapter-pattern
    title: "어댑터(Adapter)로 외부 인터페이스와 경계 분리하기"
    order: 40
    level: 2
    objective: 외부 library나 다른 interface를 application이 기대하는 contract로 변환하여 경계를 보호한다.
    density: CORE
    visualization: DIAGRAM
    visualizationNote: "외부 인터페이스를 애플리케이션이 사용하는 계약으로 변환하는 단방향 경계를 보여 준다."
  - key: java.core.design-patterns.decorator-pattern
    title: "데코레이터(Decorator)로 책임을 조합하기"
    order: 50
    level: 2
    objective: "기존 객체의 계약을 유지하면서 책임과 동작을 조합해 덧붙이는 Decorator의 구조와 사용 조건을 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.object-model.composition-collaboration
    visualizationNote: 여러 decorator가 target을 감싸며 호출을 위임하는 구조를 보여 준다.
  - key: java.core.design-patterns.proxy-pattern
    title: "프록시(Proxy)와 호출 중개"
    order: 60
    level: 2
    objective: 실제 객체를 대신해 접근 제어, lazy loading, 원격 호출, interception 같은 중개 책임을 수행하는 Proxy를 이해한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
    visualizationNote: 호출자가 proxy를 거쳐 target에 접근하는 흐름을 그린다.
  - key: java.core.design-patterns.observer-pattern
    title: "옵저버(Observer)와 상태 변화 알림"
    order: 70
    level: 2
    objective: 한 객체의 상태 변화나 event를 여러 관심 대상에게 알릴 때 Observer를 적용하고 coupling·subscription lifecycle을 고려한다.
    density: STANDARD
    visualization: DIAGRAM
    visualizationNote: publisher와 여러 subscriber 사이의 event 전달 관계를 보여 준다.
  - key: java.core.design-patterns.state-pattern
    title: "상태(State) 패턴과 상태별 동작"
    order: 80
    level: 2
    objective: "상태별 동작과 전이 규칙이 복잡해질 때 상태 객체로 분리하는 방식과 단순한 enum·상태 메서드가 더 나은 경우를 구분한다."
    density: STANDARD
    visualization: DIAGRAM
    visualizationNote: "문맥 객체가 현재 상태 객체에 동작을 위임하고 상태가 전환되는 흐름을 보여 준다."
- key: java.core.collections
  title: "컬렉션과 반복"
  order: 70
  scope: List·Set·Map의 계약과 주요 구현체, 순회와 순서, Queue·Deque·PriorityQueue 선택, 컬렉션의 변경 가능성을 다룬다.
  boundary: Data Structures & Algorithms는 알고리즘 이론을 다루며 Java에서는 컬렉션 API와 구현별 장단점을 다룬다.
  concepts:
  - key: java.core.collections.list-set-map-contracts
    title: "List, Set, Map을 요구사항으로 선택하기"
    order: 10
    level: 1
    objective: "순서, 중복 허용 여부, 원소 포함 여부와 키-값 대응 요구에 따라 `List`·`Set`·`Map` 추상화를 선택한다."
    density: CORE
    visualization: NONE
  - key: java.core.collections.arraylist-linkedlist-tradeoff
    title: "ArrayList와 LinkedList의 실제 선택 기준"
    order: 20
    level: 2
    objective: 접근·순회·삽입·삭제·allocation·locality를 기준으로 ArrayList와 LinkedList를 비교하고 단순 Big-O 암기를 넘어 실제 trade-off를 설명한다.
    density: CORE
    visualization: DIAGRAM
