  - key: java.core.concurrency.scoped-value-context
    title: "ScopedValue로 실행 문맥 전달하기"
    order: 170
    level: 3
    objective: "Java 25의 ScopedValue가 제한된 동적 범위에서 값을 바인딩해 단방향 문맥 전달에 쓰이는 방식과 ThreadLocal과의 선택 기준을 이해하고, 참조된 객체까지 깊이 불변으로 만드는 것은 아님을 구분한다."
    density: CORE
    visualization: TEXT
    visualizationNote: "동적 범위 안에서 바인딩을 조회하고 범위를 벗어나면 더는 사용할 수 없는 흐름을 보여 준다."
  - key: java.core.concurrency.future-completablefuture
    title: "Future와 CompletableFuture"
    order: 180
    level: 2
    objective: "비동기 결과의 완료와 실패를 다루고 CompletableFuture의 단계 조합과 Executor·스레드 동작을 이해한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.executor-task-thread-pools
    visualizationNote: dependent stage가 정상 완료와 exceptional completion으로 이어지는 경로를 보여 준다.
  - key: java.core.concurrency.deadlock-starvation-livelock
    title: "교착 상태·기아·라이브락 구분하기"
    order: 190
    level: 3
    objective: circular lock wait, 작업 기회 부족, 서로 반응만 하며 진전하지 못하는 liveness 문제를 구분하고 lock ordering과 progress 관점에서 진단한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.synchronized-monitor
    visualizationNote: deadlock의 순환 wait, starvation, livelock의 서로 다른 진행 실패를 비교한다.
- key: java.core.jvm-runtime
  title: "JVM 런타임과 진단"
  order: 170
  scope: JDK·JVM·클래스 파일, 바이트코드, 클래스 로딩, 런타임 데이터 영역, GC, 메모리, JIT와 기본 JVM 진단 도구를 다룬다.
  boundary: 운영 환경 전반의 진단은 Performance/Operations 영역에서, 프로세스와 가상 메모리 이론은 OS 영역에서 다루며 여기서는 Java 런타임을 이해하는 JVM 기반에 집중한다.
  concepts:
  - key: java.core.jvm-runtime.jdk-jvm-classfile
    title: "JDK·JVM·클래스 파일의 경계"
    order: 10
    level: 1
    objective: "JDK, JVM, class file의 역할을 구분하고 Java 소스 코드→`javac`→바이트코드→JVM 실행 흐름을 설명한다."
    density: CORE
    visualization: DIAGRAM
    visualizationNote: "컴파일과 실행 시점의 경계를 보여 주고 바이트코드를 native code와 같은 것으로 표현하지 않는다."
  - key: java.core.jvm-runtime.bytecode-javap
    title: "바이트코드와 javap로 실행 흔적 읽기"
    order: 20
    level: 2
    objective: "간단한 `javap` 출력과 바이트코드를 읽어 소스 코드 구문이 JVM 명령과 어떻게 연결되는지 이해하되 명령어 집합 암기를 목표로 하지 않는다."
    density: STANDARD
    visualization: NONE
  - key: java.core.jvm-runtime.class-loading-linking-initialization
    title: "클래스 로딩(Class Loading)·링킹(Linking)·초기화(Initialization)"
    order: 30
    level: 3
    objective: 로딩, 검증, 준비, 해석, 초기화 단계를 구분하고 JVMS 명세 경계에 맞게 클래스 생명주기를 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jdk-jvm-classfile
    visualizationNote: 클래스 생명주기 단계와 준비·초기화의 차이를 순서대로 보여 준다.
  - key: java.core.jvm-runtime.classloader-delegation-type-identity
    title: "ClassLoader 위임과 타입 동일성"
    order: 40
    level: 3
    objective: "어떤 `ClassLoader`가 클래스를 정의하는지와 위임 방식을 이해하고, 다른 로더가 같은 binary name의 클래스를 정의하면 서로 다른 실행 시점 타입이 될 수 있음을 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.class-loading-linking-initialization
    visualizationNote: "두 ClassLoader의 이름 공간이 같은 이름의 클래스를 서로 다른 타입으로 정의하는 경계를 보여 준다."
  - key: java.core.jvm-runtime.jvm-runtime-data-areas-frames
    title: "JVM 런타임 데이터 영역(Runtime Data Area)과 프레임(Frame)"
    order: 50
    level: 3
    objective: JVM 스택, 프레임, 지역 변수 배열, 피연산자 스택, 힙, 메서드 영역, 런타임 상수 풀이 JVMS에서 정의하는 추상 데이터 영역임을 이해한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.bytecode-javap
    visualizationNote: 메서드 호출이 프레임을 만들고 이를 JVM의 추상 데이터 영역과 연결하는 모습을 보여 준다.
  - key: java.core.jvm-runtime.gc-reachability-roots
    title: "GC 도달 가능성과 루트(Root)"
    order: 60
    level: 2
    objective: "소스 코드의 변수 범위가 끝났다고 메모리가 즉시 해제되는 것은 아니다. GC 루트(root)에서 객체까지 도달할 수 있는지를 기준으로 수명을 판단한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
    visualizationNote: "루트에서 참조를 따라 닿을 수 있는 객체 그래프가 참조를 끊은 뒤 어떻게 달라지는지 보여 준다."
  - key: java.core.jvm-runtime.reference-strengths
    title: "강한·소프트·약한·팬텀 참조"
    order: 70
    level: 3
    objective: "강한·소프트·약한·팬텀 참조의 의미와 제한된 사용 목적을 구분하고 일반적인 객체 수명 관리 수단처럼 남용하지 않는다."
    density: STANDARD
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
  - key: java.core.jvm-runtime.gc-fundamentals-collectors
    title: "GC 기본 원리와 수집기(Collector)"
    order: 80
    level: 3
    objective: "GC의 메모리 회수, 일시 정지 시간, 처리량과 지연 시간 사이의 절충을 이해하고 G1·ZGC 같은 수집기를 Java 언어 의미와 구분해 JVM 구현 선택으로 비교한다."
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
  - key: java.core.jvm-runtime.java-memory-leaks
    title: "Java 메모리 누수의 원인"
    order: 90
    level: 2
    objective: "GC가 있어도 캐시, 리스너, `ThreadLocal` 등에 필요 없는 객체가 도달 가능한 상태(reachable)로 남아 메모리 누수가 될 수 있음을 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.gc-reachability-roots
    visualizationNote: "캐시·리스너·ThreadLocal을 통한 참조가 더는 필요하지 않은 객체 그래프를 계속 붙잡는 모습을 보여 준다."
  - key: java.core.jvm-runtime.heap-metaspace-native-thread-memory
    title: "힙(Heap)·Metaspace·네이티브 메모리·스레드 메모리"
    order: 100
    level: 3
    objective: "Java 프로세스 메모리를 힙 하나로만 보지 않고 Metaspace, 네이티브 메모리 할당, 스레드 스택과 구분해 진단 관점에서 이해한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
    visualizationNote: "프로세스 메모리 안에서 JVM이 관리하는 힙과 Metaspace·네이티브·스레드 관련 영역을 구분한다."
  - key: java.core.jvm-runtime.jit-hotspot-warmup
    title: "JIT·HotSpot과 워밍업(warm-up)"
    order: 110
    level: 3
    objective: "JIT, 프로파일링, 단계별 컴파일, 워밍업이 HotSpot·JVM 구현에 따른 동작임을 밝히고, 벤치마크 결과에 미치는 영향을 이해한다."
    density: CORE
    visualization: NONE
  - key: java.core.jvm-runtime.runtime-diagnostics-jcmd-jstack-jfr
    title: "jcmd·jstack·JFR로 JVM 진단하기"
    order: 120
    level: 3
    objective: "스레드 덤프(thread dump), `jcmd`, JFR이 각각 어떤 실행 시점의 근거를 제공하는지 알고 증상에 맞는 기본 진단 도구를 선택한다."
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.jvm-runtime.jvm-runtime-data-areas-frames
- key: java.core.metadata-compatibility
  title: "리플렉션, 메타데이터와 호환성"
  order: 180
  scope: Reflection·Class API, 애너테이션, 동적 프록시, 애너테이션 처리, 직렬화, Java 모듈 시스템과 API 호환성을 다룬다.
  boundary: Spring의 프록시·AOP·컨테이너 기능은 Spring 영역에서 다루며 여기서는 그 기반이 되는 Java 언어·런타임 동작과 라이브러리 호환성을 이해한다.
  concepts:
  - key: java.core.metadata-compatibility.reflection-class-api
    title: "리플렉션과 Class API"
    order: 10
    level: 2
    objective: "`Class`와 리플렉션 API로 실행 시점의 타입·메서드·필드·생성자를 조사하고 접근 제어, 타입 안전성, 성능의 경계를 이해한다."
    density: CORE
    visualization: NONE
  - key: java.core.metadata-compatibility.annotations-retention-target
    title: "애너테이션의 보존 정책(Retention)과 적용 대상(Target)"
    order: 20
    level: 2
    objective: "애너테이션 메타데이터와 `@Target`·`@Retention`, 실행 시점 가시성, 메타 애너테이션의 기본 의미를 설명한다."
    density: CORE
    visualization: NONE
  - key: java.core.metadata-compatibility.dynamic-proxy-invocationhandler
    title: "동적 프록시와 InvocationHandler"
    order: 30
    level: 2
    objective: "JDK 동적 프록시가 인터페이스 호출을 `InvocationHandler`에 전달하는 구조를 이해하고 Spring 프록시를 배우기 위한 Java 기반을 다진다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.metadata-compatibility.reflection-class-api
    visualizationNote: interface 호출이 proxy와 InvocationHandler를 거쳐 target으로 전달되는 흐름을 보여 준다.
  - key: java.core.metadata-compatibility.annotation-processing-vs-reflection
    title: "애너테이션 처리(Annotation Processing)와 리플렉션(Reflection)"
    order: 40
    level: 2
    objective: "컴파일 시점 애너테이션 처리와 코드 생성, 실행 중 리플렉션을 실행 시점과 결과물 관점에서 구분한다."
    density: STANDARD
    visualization: TEXT
    prerequisites:
    - java.core.metadata-compatibility.annotations-retention-target
    - java.core.metadata-compatibility.reflection-class-api
    visualizationNote: "컴파일 시점의 애너테이션 처리 경로와 실행 시점의 메타데이터 검사 경로를 나누어 보여 준다."
  - key: java.core.metadata-compatibility.serialization-contract-risk
    title: "직렬화가 만드는 장기 계약"
    order: 50
    level: 2
    objective: "`Serializable`, `transient`, `serialVersionUID`를 상위 수준의 계약으로 이해하고 Java 내장 역직렬화를 신뢰 경계 안에서 주의 깊게 다뤄야 하는 이유를 설명한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.metadata-compatibility.jpms-classpath-modulepath
    title: "JPMS·클래스패스(Classpath)·모듈 경로(Module Path)"
    order: 60
    level: 2
    objective: "classpath와 module path, 명명·비명명 모듈(named·unnamed module), `requires`·`exports`의 기본 의미를 이해하고 Java 모듈 시스템이 접근성과 의존성을 어떻게 명시하는지 설명한다."
    density: STANDARD
    visualization: NONE
  - key: java.core.metadata-compatibility.binary-compatibility-api-evolution
    title: "바이너리 호환성과 API 진화"
    order: 70
    level: 2
    objective: "라이브러리나 API를 바꿀 때 소스 호환성, 바이너리 호환성, 실행 호환성이 서로 다른 문제임을 구분한다."
    density: STANDARD
    visualization: NONE
boundaries:
- area: Data Structures & Algorithms
  owns: BFS/DFS, shortest path, binary search, DP 같은 알고리즘과 자료구조 이론
  javaBoundary: Java에서는 컬렉션, 비교기, 큐, 힙, 맵·셋과 코딩 테스트 풀이에 필요한 구현 API를 다룬다.
- area: Operating Systems
  owns: scheduling, process, virtual memory, system call을 포함한 OS 동작
  javaBoundary: Java는 Java 코드의 동작을 예측하는 데 필요한 `Thread`·JVM·JMM 경계를 다룬다.
- area: Spring
  owns: container, Bean lifecycle, MVC, transaction, AOP와 framework-specific behavior
  javaBoundary: Java는 Spring의 바탕이 되는 객체 생성, 리플렉션, 애너테이션, 프록시, 스레드 처리 같은 언어·런타임 기능을 다룬다.
- area: Database
  owns: DB transaction, isolation, locking, schema와 persistence semantics
  javaBoundary: Java는 I/O·JDBC 자원 소유권 같은 Java API 계약까지만 다룬다.
- area: Performance / Observability / Operations
  owns: production diagnosis, capacity, 운영 대응과 end-to-end observability
  javaBoundary: Java는 JVM·JFR·`jcmd`, 힙·스레드 등 실행 시점의 근거를 읽기 위한 기반을 다룬다.
- area: Network & HTTP
  owns: TCP/IP, HTTP, socket/protocol behavior와 network architecture
  javaBoundary: Java는 바이트·문자 I/O, NIO `Channel`·`Buffer`·`Selector`처럼 Java 프로그램이 사용하는 API 추상화까지만 다룬다.
