  - key: java.core.collections.queue-deque-arraydeque
    title: "Queue, Deque와 ArrayDeque"
    order: 60
    level: 1
    objective: "선입선출 큐, 양끝 큐, 스택의 동작을 구분하고 여러 상황에서 ArrayDeque가 좋은 기본 선택인 이유를 설명한다."
    density: CORE
    visualization: NONE
  - key: java.core.collections.priorityqueue
    title: "PriorityQueue와 우선순위 처리"
    order: 70
    level: 2
    objective: "힙을 바탕으로 우선순위가 가장 높은 원소를 꺼내는 방식과 맨 앞 원소의 의미를 이해하고, 순회가 전체 정렬 순서를 보장하지 않음을 구분한다."
