    visualization: NONE
  - key: java.core.generics.generic-invariance
    title: Generic invariance
    order: 20
    level: 2
    objective: List<Integer>가 List<Number>의 subtype이 아닌 이유를 잘못된 write 가능성과 연결해 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.language-types.arrays-covariance-runtime-check
