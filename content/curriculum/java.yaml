- key: java.core.concurrency
  title: "동시성과 비동기 처리"
  order: 160
  scope: Java 스레드, 공유 가변 상태, JMM 가시성, 동기화, Executor, 실행 문맥 전달, Future와 진행 가능성 문제를 다룬다.
  boundary: OS는 스케줄링과 프로세스 이론을 다루며 Java는 Thread·JMM·API 계약에 집중한다. 운영 환경의 전반적인 진단은 Performance/Operations 영역에서 다룬다.
  concepts:
  - key: java.core.concurrency.concurrency-vs-parallelism
    title: "동시성과 병렬성"
    order: 10
    level: 1
    objective: 여러 작업이 겹쳐 진행되는 concurrency와 실제로 동시에 CPU에서 실행되는 parallelism을 구분한다.
    density: STANDARD
    visualization: TEXT
    visualizationNote: "한 작업자에서 작업들이 번갈아 진행되는 경우와 여러 작업자가 실제로 동시에 실행하는 경우를 비교한다."
  - key: java.core.concurrency.thread-lifecycle-interruption
    title: "Thread 생명주기와 중단"
    order: 20
    level: 2
    objective: "Thread의 시작·join·sleep과 생명주기 상태를 이해하고 interrupt가 강제 종료가 아닌 협력적 취소 신호임을 설명한다."
    density: CORE
    visualization: TEXT
    visualizationNote: thread 상태 전이와 interrupt signal을 관찰하는 흐름을 보여 준다.
  - key: java.core.concurrency.platform-virtual-thread
    title: "플랫폼 스레드(Platform Thread)와 가상 스레드(Virtual Thread)"
    order: 30
    level: 2
    objective: "Java Thread, 플랫폼 스레드, 가상 스레드를 구분하고 Java 25의 carrier 모델을 이해하되 `synchronized`가 가상 스레드를 carrier에 고정한다는 과거 설명을 일반화하지 않는다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.thread-lifecycle-interruption
    visualizationNote: "여러 가상 스레드가 carrier 역할의 플랫폼 스레드 위에서 실행되는 Java·OS 경계를 보여 준다."
  - key: java.core.concurrency.shared-mutable-state-race
    title: "공유 가변 상태와 경합 조건(Race Condition)"
    order: 40
    level: 2
    objective: "여러 스레드가 같은 변경 가능한 상태를 읽고 쓰는 실행 순서가 엇갈려 갱신 누락이나 경합 조건이 생기는 흐름을 식별하고 보호할 불변 조건을 찾는다."
    density: CORE
    visualization: DIAGRAM
    visualizationNote: 두 read-modify-write가 겹쳐 update를 잃는 순서를 그린다.
  - key: java.core.concurrency.synchronized-monitor
    title: "synchronized와 모니터(Monitor)"
    order: 50
    level: 2
    objective: synchronized를 사용한 mutual exclusion, intrinsic monitor ownership과 reentrancy를 이해하고 어떤 critical section을 보호하는지 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.shared-mutable-state-race
    visualizationNote: 하나의 monitor owner와 진입을 기다리는 thread, reentrant acquisition을 보여 준다.
  - key: java.core.concurrency.jmm-happens-before-visibility
    title: "JMM의 happens-before와 가시성"
    order: 60
    level: 3
    objective: "CPU cache에 관한 통념이 아니라 Java Memory Model의 happens-before 관계를 통해 가시성과 실행 순서를 설명한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.shared-mutable-state-race
    - java.core.concurrency.synchronized-monitor
    visualizationNote: 한 synchronization action이 앞선 write를 이후 read에 보이게 하는 happens-before edge를 그린다.
  - key: java.core.concurrency.safe-publication-final-fields
    title: "안전한 공개와 final 필드"
    order: 70
    level: 3
    objective: "새 객체를 다른 스레드에 전달할 때 안전한 공개가 필요한 이유와 final 필드 규칙, volatile·잠금·정적 초기화 같은 공개 경계를 이해한다."
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.concurrency.jmm-happens-before-visibility
    - java.core.language-types.final-reference-and-immutability
    visualizationNote: 잘못 publish된 객체와 happens-before가 있는 안전한 publication을 비교한다.
  - key: java.core.concurrency.volatile
    title: "volatile과 가시성"
    order: 80
    level: 3
    objective: "volatile 읽기·쓰기가 제공하는 가시성·순서·단일 읽기와 쓰기의 원자성을 이해하고 `count++` 같은 복합 연산은 원자적으로 만들지 못함을 설명한다."
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.concurrency.jmm-happens-before-visibility
  - key: java.core.concurrency.atomic-cas
    title: "Atomic 변수와 CAS"
    order: 90
    level: 3
    objective: compare-and-set의 expected/current 비교, 성공·실패 retry와 contention을 이해하고 단일 atomic variable이 복합 invariant를 자동 보호하지 못함을 판단한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.jmm-happens-before-visibility
    visualizationNote: "같은 공유 값에 대한 CAS가 성공하는 경우와 실패 뒤 재시도하는 흐름을 보여 준다."
  - key: java.core.concurrency.locks-reentrantlock-condition
    title: "Lock, ReentrantLock과 Condition"
    order: 100
    level: 3
    objective: synchronized보다 timed/interruptible lock acquisition이나 여러 Condition이 필요한 경우 explicit Lock API를 선택하고 trade-off를 설명한다.
    density: STANDARD
    visualization: NONE
    prerequisites:
    - java.core.concurrency.synchronized-monitor
  - key: java.core.concurrency.executor-task-thread-pools
    title: "Executor와 스레드 풀(Thread Pool)"
    order: 110
    level: 2
    objective: "작업 제출과 스레드 생명주기를 분리하고 스레드 풀 크기, 작업 큐와 자원 한도가 시스템 동작에 미치는 영향을 이해한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.thread-lifecycle-interruption
    visualizationNote: "작업이 큐에 들어가고 작업자 스레드가 꺼내 실행하는 구조를 보여 준다."
  - key: java.core.concurrency.blockingqueue-producer-consumer
    title: "BlockingQueue와 생산자·소비자"
    order: 120
    level: 2
    objective: "BlockingQueue의 put·take와 제한 용량을 이용해 생산자와 소비자 사이의 작업 전달, 큐가 가득 차거나 비었을 때 기다리는 동작을 이해한다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.concurrency.executor-task-thread-pools
    visualizationNote: "생산자가 제한 용량의 큐에 작업을 넣고 소비자가 꺼내며, 큐가 가득 차거나 빌 때 기다리는 흐름을 보여 준다."
  - key: java.core.concurrency.countdownlatch-coordination
    title: "CountDownLatch로 작업 조율하기"
    order: 130
    level: 2
    objective: "여러 작업이 끝날 때까지 하나 이상의 스레드가 기다리는 일회성 조율에 CountDownLatch를 사용하는 목적과 count가 0이 되는 의미를 이해한다."
    density: STANDARD
    visualization: TEXT
    prerequisites:
    - java.core.concurrency.thread-lifecycle-interruption
    visualizationNote: "여러 작업이 countDown을 호출하고 count가 0이 되면 기다리던 스레드가 진행하는 흐름을 보여 준다."
  - key: java.core.concurrency.semaphore-permits
    title: "Semaphore와 동시 실행 허가 수"
    order: 140
    level: 2
    objective: 동시에 사용할 수 있는 resource나 작업 수를 permit으로 제한하는 Semaphore의 acquire/release 동작과 concurrency limit 의미를 이해한다.
