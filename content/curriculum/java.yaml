  - key: java.core.generics.wildcards-pecs
    title: "와일드카드(Wildcard)와 PECS"
    order: 30
    level: 2
    objective: "생산자와 소비자의 방향에 따라 범위 제한 와일드카드를 사용하고 PECS를 기계적으로 적용하지 않는다."
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.generics.generic-invariance
    visualizationNote: extends는 읽기, super는 쓰기 방향을 데이터 흐름으로 비교한다.
  - key: java.core.generics.raw-types-unchecked
    title: "로 타입(raw type)과 비검사 경고(unchecked warning)"
    order: 40
    level: 2
    objective: "로 타입과 비검사 변환이 컴파일 시점의 타입 안전성을 잃게 하는 이유와 경고를 무시할 위험을 설명한다."
    density: STANDARD
    visualization: NONE
