schemaVersion: 2
area:
  key: java
  title: Java
  baseline: Java SE 25
  contentKeyPrefix: java.core
  status: CANONICAL_FOUNDATION
policies:
  language:
    authoringLanguage: ko-KR
    terminologyRule: 가능하면 쉬운 한국어로 문제와 상태를 먼저 설명한 뒤 정확한 Java/JVM 용어를 함께 소개한다.
    layerRule:
    - EASY_ENTRY
    - ACCURATE_MECHANISM
    - PRACTICAL_INTERVIEW_DEEPER_CONNECTION
  level:
    L1: 일반적인 Java 코드를 읽고 쓰는 데 필요한 기반
    L2: backend 개발에 필요한 설계, API 선택, trade-off, 실행 동작
    L3: JMM/JVM/runtime/performance를 포함한 심화 추론
  source:
    primary:
    - Java SE 25 JLS
    - Java SE 25 JVMS
    - Java SE 25 API and Oracle Java guides
    - Applicable OpenJDK JEPs and project documentation
    discovery:
    - Effective Java, 3rd edition
    - Modern Java in Action
    - Established Java/JVM books and conference material
    - Verified Korean/company engineering material such as NAVER D2, 우아한형제들, LINE/LY, Kakao/KakaoPay, Hyperconnect
    versionRule: runtime/implementation 주장은 Java SE 25 공식 자료와 대조하고 language, JVM specification, JDK/HotSpot implementation, OS behavior를 구분한다.
    urlRule: 실제로 확인한 reference만 기록하며 URL을 추측하거나 만들지 않는다.
  question:
    everyConcept:
      minimumByDifficulty:
        EASY: 1
        MEDIUM: 1
        HARD: 1
      minimumTotal: 3
    density:
      CORE: 대략 5-8문제
      STANDARD: 대략 3-5문제
    difficulty:
      EASY: 학습 직후 핵심 원칙을 직접 확인한다.
      MEDIUM: 코드 결과, 비교, 흔한 오해처럼 한 단계 더 추론한다.
      HARD: 복합 코드, debugging, API 설계, concurrency/JVM reasoning, backend 상황을 결합하며 obscure trivia로 난이도를 만들지 않는다.
    form: 빠른 학습 loop에 맞춰 MULTIPLE_CHOICE를 우선하고 SHORT_ANSWER, DESCRIPTIVE, SCENARIO는 실제 학습 가치가 있을 때 보조적으로 사용한다.
    distractorRule: 객관식 오답은 실제로 헷갈릴 수 있는 misconception을 사용하고 명백히 무관한 선택지로 정답을 노출하지 않는다.
  visualization:
    values:
    - NONE
    - TEXT
    - DIAGRAM
    NONE: 시각화가 없어도 설명과 코드로 충분하다.
    TEXT: text/ASCII 흐름이나 관계 그림이면 충분하다.
    DIAGRAM: 참조 관계, 상태 전이, 실행 순서 등에서 실제 diagram/image가 학습 효과를 크게 높인다.
  prerequisites:
    rule: Topic 전체를 선형 course로 묶지 않는다. Concept 이해에 실제 선행 지식이 필요한 경우에만 선택적으로 prerequisites를 기록한다.
topics:
- key: java.core.language-types
  title: Java Language & Value Semantics
  order: 10
  scope: Java 값, 변수, 변환, 배열, final, 문자열처럼 일반 Java 코드를 읽고 쓰는 데 필요한 언어 의미를 다룬다.
  boundary: 물리 메모리 배치나 JVM 구현 세부를 Java 언어 보장처럼 설명하지 않는다.
  concepts:
  - key: java.core.language-types.primitive-reference-values
    title: Primitive values and reference values
    order: 10
    level: 1
    objective: 원시 값과 참조 값을 구분하고 참조를 보장된 물리 메모리 주소와 동일시하지 않는다.
    density: CORE
    visualization: TEXT
    visualizationNote: 원시 값 복사와 두 변수가 같은 객체를 가리키는 상황을 비교한다.
  - key: java.core.language-types.variables-scope-definite-assignment
    title: Variables, scope, and definite assignment
    order: 20
    level: 1
    objective: 필드·지역 변수·매개변수의 차이, scope, 초기화와 definite assignment 규칙을 구분한다.
    density: CORE
    visualization: TEXT
    visualizationNote: 작은 scope 구조와 변수를 사용할 수 있는 시점을 표시한다.
  - key: java.core.language-types.numeric-conversion-overflow
    title: Numeric conversion and overflow
    order: 30
    level: 1
    objective: widening·narrowing 변환, 숫자 승격과 정수 overflow가 코드 결과에 미치는 영향을 예측한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.language-types.boxing-unboxing-wrapper
    title: Boxing, unboxing, and wrappers
    order: 40
    level: 2
    objective: boxing/unboxing, null unboxing 위험, wrapper equality와 캐시 관련 흔한 오해를 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.language-types.pass-by-value
    title: Pass-by-value
    order: 50
    level: 1
    objective: Java가 항상 값을 전달하며 참조형도 참조 값이 복사된다는 점과 호출자 변수·매개변수 변수가 서로 다름을 설명한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: 호출자 변수의 참조 값이 매개변수로 복사되고 재대입은 호출자 변수를 바꾸지 못하는 흐름을 그린다.
  - key: java.core.language-types.arrays-covariance-runtime-check
    title: Arrays, covariance, and runtime store checks
    order: 60
    level: 2
    objective: Java 배열의 고정 길이·참조형 성격과 배열 covariance가 ArrayStoreException 같은 런타임 검사를 만드는 이유를 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: Object[]가 String[]을 가리킬 때 잘못된 저장을 런타임에서 막는 흐름을 보여 준다.
  - key: java.core.language-types.final-reference-and-immutability
    title: final, reassignment, and immutability
    order: 70
    level: 1
    objective: final이 변수의 재대입을 제한하는 것과 객체 자체의 불변성을 보장하는 것은 다르다는 점을 구분하고 method/class의 final 의미도 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.language-types.string-immutability-equality
    title: String immutability and equality
    order: 80
    level: 1
    objective: String이 불변 객체라는 의미와 ==가 identity를, equals가 문자열 내용을 비교한다는 차이를 코드 결과와 함께 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.language-types.primitive-reference-values
    visualizationNote: 서로 다른 String 객체의 identity와 같은 문자열 내용 equality를 비교한다.
  - key: java.core.language-types.string-pool-interning
    title: String pool and interning
    order: 90
    level: 2
    objective: 문자열 literal 재사용과 string pool, intern의 의미를 이해하되 이를 모든 String 생성·메모리 동작에 대한 단순 규칙으로 일반화하지 않는다.
    density: STANDARD
    visualization: TEXT
    prerequisites:
    - java.core.language-types.string-immutability-equality
    visualizationNote: literal이 재사용되는 경우와 runtime에 별도 String 객체가 만들어지는 경우를 구분한다.
  - key: java.core.language-types.stringbuilder-mutable-text
    title: StringBuilder and mutable text construction
    order: 100
    level: 1
    objective: 반복적인 문자열 조립에서 StringBuilder가 mutable buffer를 제공하는 이유와 String 불변성과의 차이를 이해하고 적절한 사용 범위를 판단한다.
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.language-types.string-immutability-equality
- key: java.core.object-model
  title: Object Creation, State & OOP
  order: 20
  scope: 객체 생성과 초기화, 캡슐화, 추상화, 상속·합성, 다형성과 타입 변환 등 Java 객체 모델을 다룬다.
  boundary: Spring Bean lifecycle이나 proxy framework 동작은 Spring 영역이 소유하며 여기서는 Java 언어 수준 객체 동작에 집중한다.
  concepts:
  - key: java.core.object-model.class-object-constructor
    title: Class, object, and constructor
    order: 10
    level: 1
    objective: class·object·constructor의 역할을 구분하고 생성 시 유효한 객체 상태를 만드는 기본 흐름을 이해한다.
    density: CORE
    visualization: NONE
  - key: java.core.object-model.static-vs-instance-members
    title: Static versus instance members
    order: 20
    level: 1
    objective: static member가 class에 속하고 instance member가 객체 상태에 속한다는 차이와 접근·공유 특성을 이해한다.
    density: CORE
    visualization: TEXT
    visualizationNote: 여러 instance가 하나의 static 상태를 공유하는 구조와 각 instance의 개별 상태를 비교한다.
  - key: java.core.object-model.initialization-order-constructor-chaining
    title: Initialization order and constructor chaining
    order: 30
    level: 2
    objective: class initialization과 instance field/initializer/constructor 실행 순서, this/super constructor chaining을 예측한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.static-vs-instance-members
    visualizationNote: class 초기화와 객체 생성 단계를 시간 순서로 보여 준다.
  - key: java.core.object-model.encapsulation-invariants
    title: Encapsulation and invariants
    order: 40
    level: 1
    objective: 상태 변경 규칙과 invariant를 객체 내부에 두고 무분별한 setter 노출보다 의도가 드러나는 동작으로 보호하는 이유를 설명한다.
    density: CORE
    visualization: NONE
  - key: java.core.object-model.abstraction-responsibility
    title: Abstraction and responsibility
    order: 50
    level: 2
    objective: 객체가 제공해야 할 책임과 계약을 중심으로 추상화하고 불필요한 구현 세부 노출을 줄인다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-model.inheritance-is-a
    title: Inheritance and is-a relationships
    order: 60
    level: 2
    objective: 상속을 의미 있는 subtype/is-a 관계에 사용할 때의 장점과 강한 결합·취약한 기반 클래스 문제를 이해한다.
    density: STANDARD
    visualization: TEXT
    visualizationNote: is-a 계층과 has-a 협력 구조를 비교한다.
  - key: java.core.object-model.composition-collaboration
    title: Composition and collaboration
    order: 70
    level: 2
    objective: 독립적으로 바뀌어야 하는 행동은 상속보다 객체 협력과 합성으로 분리하는 이유와 trade-off를 설명한다.
    density: CORE
    visualization: DIAGRAM
    visualizationNote: 상속으로 구현을 물려받는 구조와 collaborator에 위임하는 구조를 비교한다.
  - key: java.core.object-model.polymorphism-dynamic-dispatch
    title: Polymorphism and dynamic dispatch
    order: 80
    level: 2
    objective: 선언 타입과 런타임 객체 타입을 구분하고 override된 instance method가 런타임에 선택되는 동작을 예측한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.inheritance-is-a
    visualizationNote: 선언 타입과 실제 객체 타입을 따라 override method가 선택되는 흐름을 나타낸다.
  - key: java.core.object-model.overload-vs-override
    title: Overload versus override
    order: 90
    level: 2
    objective: compile time overload 선택과 runtime override dispatch를 구분하고 혼합된 코드의 호출 결과를 예측한다.
    density: CORE
    visualization: NONE
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
  - key: java.core.object-model.reference-casting-instanceof
    title: Reference casting and instanceof
    order: 100
    level: 2
    objective: upcasting·downcasting, ClassCastException과 instanceof/pattern matching의 타입 검사 의미를 이해한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-model.polymorphism-dynamic-dispatch
    visualizationNote: 상위 타입 참조가 하위 객체를 가리킬 때 안전한/위험한 downcast 경로를 비교한다.
  - key: java.core.object-model.interface-vs-abstract-class
    title: Interface versus abstract class
    order: 110
    level: 2
    objective: 계약 중심 다형성, 공유 상태·구현, 확장 요구를 기준으로 interface와 abstract class를 선택한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-model.immutability-defensive-copy
    title: Immutability and defensive copying
    order: 120
    level: 2
    objective: 불변 객체를 설계하고 mutable input/output의 ownership 경계를 defensive copy로 보호해야 하는 상황을 판단한다.
    density: CORE
    visualization: DIAGRAM
    prerequisites:
    - java.core.language-types.final-reference-and-immutability
    visualizationNote: mutable collection을 그대로 공유할 때와 copy하여 ownership을 분리할 때를 비교한다.
- key: java.core.api-design
  title: Object Creation & API Design
  order: 30
  scope: 생성 API, 의존성 전달, 접근 범위와 method contract처럼 유지보수 가능한 Java API 설계를 다룬다.
  boundary: Spring DI container 동작은 Spring 영역에서 다루고 여기서는 순수 Java construction과 API contract에 집중한다.
  concepts:
  - key: java.core.api-design.static-factory-method
    title: Static factory method
    order: 10
    level: 2
    objective: 이름 있는 생성, instance 재사용, subtype 반환, invariant 보호가 필요할 때 constructor보다 static factory가 주는 이점을 설명한다.
    density: CORE
    visualization: NONE
  - key: java.core.api-design.builder-pattern-construction
    title: Builder pattern construction
    order: 20
    level: 2
    objective: 선택 인자가 많거나 이름 있는 구성 단계가 필요할 때 builder를 사용하되 필수 invariant를 숨기지 않는다.
    density: STANDARD
    visualization: NONE
  - key: java.core.api-design.dependency-injection-construction
    title: Dependency injection and construction
    order: 30
    level: 2
    objective: 숨겨진 global/static dependency보다 필요한 협력 객체를 명시적으로 전달하여 결합도와 테스트 가능성을 개선한다.
    density: CORE
    visualization: TEXT
    visualizationNote: constructor로 보이는 dependency와 내부 global lookup을 비교한다.
  - key: java.core.api-design.minimize-accessibility-api-surface
    title: Minimize accessibility and API surface
    order: 40
    level: 2
    objective: type/member의 공개 범위를 필요한 만큼만 열고 public API surface가 장기 호환성 비용이라는 점을 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.api-design.method-contract-parameter-validation
    title: Method contracts and parameter validation
    order: 50
    level: 2
    objective: precondition, nullability, 유효 범위와 실패 방식을 명시하여 method 사용 계약을 분명하게 만든다.
    density: CORE
    visualization: NONE
- key: java.core.object-contracts
  title: Object Contracts & Ordering
  order: 40
  scope: equals/hashCode/toString과 Comparable/Comparator처럼 Java API와 collection이 의존하는 객체 계약을 다룬다.
  boundary: collection 내부 구현은 Collections Topic에서 다루며 여기서는 객체가 제공하는 equality·ordering 계약에 집중한다.
  concepts:
  - key: java.core.object-contracts.equals-contract
    title: equals contract
    order: 10
    level: 2
    objective: reflexive·symmetric·transitive·consistent·null 규칙을 적용하고 어떤 상태를 논리적 equality에 포함할지 판단한다.
    density: CORE
    visualization: NONE
  - key: java.core.object-contracts.hashcode-contract
    title: hashCode contract
    order: 20
    level: 2
    objective: equals와 hashCode의 계약을 함께 지키고 위반 시 hash 기반 collection에서 발생하는 문제를 설명한다.
    density: CORE
    visualization: TEXT
    prerequisites:
    - java.core.object-contracts.equals-contract
    visualizationNote: 같은 객체가 같은 hash 후보 영역으로 이동한 뒤 equals로 확인되는 과정을 보여 준다.
  - key: java.core.object-contracts.tostring-diagnostics
    title: toString and diagnostics
    order: 30
    level: 1
    objective: debugging에 유용한 toString을 작성하되 안정적 serialization 형식이나 민감정보 안전 형식으로 오해하지 않는다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-contracts.comparable-natural-order
    title: Comparable and natural order
    order: 40
    level: 2
    objective: 자연 순서를 정의하고 compareTo와 equals의 불일치가 sorted collection에 미치는 영향을 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.object-contracts.comparator-custom-order
    title: Comparator and custom order
    order: 50
    level: 2
    objective: 여러 기준을 안전하게 조합한 custom order를 만들고 subtraction 기반 비교의 overflow 위험을 피한다.
    density: CORE
    visualization: NONE
- key: java.core.enum-modeling
  title: Enum & Type-safe Modeling
  order: 50
  scope: 닫힌 값 집합과 enum의 behavior, EnumSet/EnumMap 같은 enum 특화 API를 다룬다.
  boundary: DB persistence schema는 Database 영역이 소유하며 여기서는 ordinal을 외부 identity로 노출할 때의 Java 모델링 위험까지만 다룬다.
  concepts:
  - key: java.core.enum-modeling.enum-closed-values-behavior
    title: Enum closed values and behavior
    order: 10
    level: 1
    objective: 닫힌 값 집합을 enum으로 모델링하고 상태와 관련 행동을 함께 두는 것이 응집도를 높이는 경우를 판단한다.
    density: CORE
    visualization: NONE
  - key: java.core.enum-modeling.enum-ordinal-name-persistence
    title: Enum ordinal, name, and persistence
    order: 20
    level: 2
    objective: ordinal은 선언 순서에 따라 바뀌므로 안정적 외부 identity로 사용하기 위험하다는 점과 name 사용의 trade-off를 이해한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.enum-modeling.enumset
    title: EnumSet
    order: 30
    level: 2
    objective: enum 집합이 필요한 경우 EnumSet을 사용하여 type-safe하고 효율적인 집합 모델을 구성한다.
    density: STANDARD
    visualization: NONE
  - key: java.core.enum-modeling.enummap
    title: EnumMap
    order: 40
    level: 2
