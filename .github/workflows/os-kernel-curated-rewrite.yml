name: OS kernel sentence-level rewrite
on:
  push:
    branches: [codex/content-operating-systems-quality]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - name: Rewrite reviewed kernel-boundary questions
        shell: bash
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          path = Path('content/operating-systems/kernel-boundary/questions.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data) == 25
          by = {q['contentKey']: q for q in data}
          def ident(q):
              return (q['contentKey'], q['questionType'], q['difficulty'], q['status'], copy.deepcopy(q.get('conceptKeys')), copy.deepcopy(q.get('acceptedAnswers')), q.get('correctChoiceKey'), [(c['key'], c['displayOrder']) for c in q.get('choices',[])])
          before = [ident(q) for q in data]
          def apply(key, prompt=None, model=None, explain=None, choices=None):
              q=by[key]
              if prompt is not None: q['promptMarkdown']=prompt
              if model is not None: q['modelAnswer']=model
              if explain is not None: q['explanationMarkdown']=explain
              if choices:
                  cm={c['key']:c for c in q['choices']}
                  for ck,(content,rat) in choices.items():
                      cm[ck]['content']=content; cm[ck]['rationaleMarkdown']=rat

          apply('operating-systems.core.kernel-boundary.os-resource-manager.q1',
            '운영체제를 자원 관리자(resource manager)라고 부르는 설명으로 가장 적절한 것은?',
            explain='운영체제는 제한된 하드웨어 자원을 여러 실행 주체가 안전하게 공유하도록 **배분·보호·회수**한다. CPU 스케줄링만 보는 것은 범위를 지나치게 좁힌 것이고, 보호나 회수를 애플리케이션에만 맡기면 한 프로세스의 오류가 시스템 전체에 영향을 줄 수 있다.',
            choices={
              'A':('여러 프로세스가 하드웨어를 공유하더라도 공정성만 보장하면 보호는 필요하지 않다.','공정한 스케줄링만으로 한 프로세스가 다른 프로세스의 메모리를 읽거나 장치를 제어하는 일을 막지는 못한다. 하드웨어 자원을 공유할 때 보호 경계도 별도로 필요하다.'),
              'B':('자원을 프로세스에 한 번 배정한 뒤 보호와 회수는 전적으로 애플리케이션에 맡긴다.','운영체제는 자원을 할당한 뒤에도 보호 규칙을 적용하고 더 이상 필요하지 않은 자원을 회수해야 한다. 이를 모두 애플리케이션에 맡기면 잘못된 프로세스가 공유 시스템 상태를 훼손할 수 있다.'),
              'C':('자원 관리는 CPU 스케줄링만 뜻하며 메모리와 장치 격리는 포함하지 않는다.','CPU 스케줄링은 자원 관리의 한 부분일 뿐이다. 메모리 매핑·장치·파일·접근 보호도 운영체제가 관리하는 중요한 자원 영역이다.'),
              'D':('제한된 CPU·메모리·장치를 여러 실행 주체에 배분하고 보호·회수한다.','운영체제는 제한된 CPU 시간·메모리·장치 접근을 여러 실행 주체에 배분하고, 접근 경계를 강제하며, 사용이 끝난 자원을 회수한다. 스케줄링은 그 업무 중 일부다.')})
          apply('operating-systems.core.kernel-boundary.os-resource-manager.q2',
            '`Spring 스레드 풀 → Java 스레드 → OS 스케줄러 → CPU 코어` 흐름에서 애플리케이션 정책과 운영체제의 자원 관리 책임을 구분해 설명하라.',
            '스레드 풀 크기는 애플리케이션이 동시에 수행할 작업 수를 제한하는 정책이다. Java 스레드의 실제 CPU 실행 기회는 JVM 아래에서 운영체제 스케줄러가 실행 가능한 작업과 CPU 코어를 조정해 제공한다. 스레드 풀 크기가 CPU 코어를 직접 소유하거나 생성하는 것은 아니다.',
            '핵심은 **애플리케이션의 동시성 정책**과 **운영체제의 CPU 자원 배분**을 분리하는 것이다. 스레드 풀은 동시에 맡길 작업 수를 정하지만, 실행 가능한 작업이 언제 어느 CPU 코어에서 실행될지는 운영체제 스케줄러가 결정한다.')
          apply('operating-systems.core.kernel-boundary.os-resource-manager.q3',
            '한 백엔드 프로세스가 파일 디스크립터를 계속 열고 닫지 않아 결국 새 소켓을 만들지 못한다. 이 문제를 `자원 할당 → 보호/제한 → 회수` 관점에서 분석하라.',
            '파일 디스크립터는 커널이 프로세스에 할당하는 제한된 자원이다. 프로세스와 파일 디스크립터의 제한은 한 프로세스가 자원을 무제한 소비하지 못하게 경계를 만들지만, 애플리케이션이 디스크립터의 생명주기를 끝내지 않으면 회수가 일어나지 않아 제한에 도달한다. `close` 누수를 먼저 고치고 필요한 제한과 풀 상한을 실제 작업 부하에 맞춰야 한다. 제한만 계속 올리면 누수 원인은 남는다.',
            '파일 디스크립터가 열릴 때 자원이 **할당**되고, 프로세스별 제한은 한 실행 주체가 무제한 소비하지 못하도록 **보호 경계**를 만든다. `close`가 누락되면 정상적인 **회수**가 일어나지 않으므로 제한 상향만으로는 원인을 제거하지 못한다. 누수를 먼저 고친 뒤 실제 작업 부하에 맞는 제한을 조정해야 한다.')
          apply('operating-systems.core.kernel-boundary.os-resource-manager.q4',
            '요청 지연 시간 500 ms 중 Java 코드가 CPU에서 실행된 시간은 25 ms이고 나머지는 스케줄러 대기와 I/O 대기가 대부분이었다. CPU 연산 최적화만으로 전체 지연 시간이 크게 줄기 어려운 이유를 설명하라.',
            '전체 경과 시간에는 애플리케이션이 CPU에서 실제 실행한 시간뿐 아니라 운영체제 스케줄러의 실행 기회를 기다린 시간과 I/O 완료를 기다린 시간이 포함된다. CPU 실행 25 ms만 줄여서는 나머지 대기 시간이 그대로이므로 종단 간 지연 시간 개선 폭은 제한적이다.',
            '500 ms의 경과 시간은 CPU 실행 시간과 스케줄러·I/O 대기 시간을 모두 포함한다. CPU에서 실제 실행한 시간이 25 ms뿐이라면 그 부분을 크게 줄여도 나머지 약 475 ms가 그대로 남을 수 있다. 먼저 지연 시간이 어느 자원과 대기에서 생기는지 측정해야 한다.')

          apply('operating-systems.core.kernel-boundary.user-kernel-mode.q1',
            '사용자 모드와 커널 모드의 보호가 단순한 소프트웨어 관례가 아닌 이유는?',
            explain='보호 경계가 애플리케이션의 선의나 API 사용 규칙에만 의존하면 버그가 있거나 악의적인 코드가 이를 우회할 수 있다. CPU가 권한 수준에 따라 특권 명령어와 보호된 자원 접근을 제한해야 커널이 강제 가능한 경계를 만들 수 있다.',
            choices={
              'A':('가상 메모리만 있으면 권한 수준 없이도 장치와 제어 레지스터 접근이 자동으로 안전해진다.','가상 메모리는 주소 변환과 페이지 권한을 제공하지만 모든 장치 레지스터나 특권 제어 연산에 대한 접근을 단독으로 차단하지는 않는다. 민감한 연산은 프로세서의 권한 검사도 필요하다.'),
              'B':('커널 API 호출 규칙만 정하면 CPU가 특권 명령어를 제한하지 않아도 같은 보호가 성립한다.','소프트웨어 API 규칙은 버그가 있거나 악의적인 코드가 무시할 수 있다. 하드웨어 권한 수준은 비특권 모드에서 보호된 명령과 자원을 사용할 수 없도록 강제한다.'),
              'C':('CPU가 현재 권한 수준에서 허용되지 않은 연산을 제한하기 때문이다.','CPU는 현재 권한 수준을 강제하고 더 높은 권한이 필요한 연산을 거부한다. 커널 API는 필요한 서비스를 요청할 수 있도록 통제된 진입 경로를 제공한다.'),
              'D':('사용자 모드와 커널 모드의 차이는 스케줄링 우선순위뿐이고 실행 가능한 명령어에는 영향을 주지 않는다.','권한 모드는 스케줄링 우선순위가 아니라 접근 가능한 명령과 보호 자원을 결정하는 보호 경계다.')})
          apply('operating-systems.core.kernel-boundary.user-kernel-mode.q2',
            '시스템 콜로 사용자 모드에서 커널 모드에 들어갔다가 같은 스레드가 즉시 복귀했다. 반드시 다른 프로세스로의 문맥 전환이 발생했다고 볼 수 있는가?',
            explain='**모드 전환**은 권한 수준의 변화이고, **문맥 전환**은 스케줄러가 실행 작업을 바꾸며 CPU 실행 문맥을 교체하는 사건이다. 같은 스레드가 커널에서 시스템 콜을 처리한 뒤 바로 돌아오면 모드는 바뀌었어도 다른 작업으로의 문맥 전환은 없을 수 있다.',
            choices={
              'A':('그렇다. 모든 모드 전환은 반드시 다른 프로세스로의 문맥 전환이다.','시스템 콜은 권한 모드를 바꾸지만 다른 작업을 스케줄링하지 않고 같은 스레드로 돌아올 수 있다. 모드 전환과 작업 문맥 전환은 별개 사건이다.'),
              'B':('아니다. 권한 모드는 바뀌어도 다른 작업으로 CPU가 넘어가지 않을 수 있다.','CPU는 시스템 콜을 처리하려고 커널 모드에 진입한 뒤 같은 스레드로 돌아올 수 있다. 다른 작업이 선택되어 실행 문맥이 바뀔 때 문맥 전환이 발생한다.'),
              'C':('그렇다. 커널 모드에서는 항상 새 프로세스가 생성된다.','커널 모드에서 실행한다고 새 프로세스가 생기는 것은 아니다. 현재 작업을 대신해 커널 코드가 높은 권한으로 실행될 수 있다.'),
              'D':('그렇다. 시스템 콜 진입은 스케줄러가 반드시 다른 작업을 선택하는 시점이다.','시스템 콜 진입이 스케줄링 지점이 될 수는 있지만 매번 다른 작업을 선택해야 하는 것은 아니다. 같은 스레드가 서비스를 마치고 바로 복귀할 수 있다.')})
          apply('operating-systems.core.kernel-boundary.user-kernel-mode.q3',
            'Java 코드가 소켓 읽기를 호출하는 흐름을 `Java/JVM → OS → 하드웨어` 층으로 설명하라.',
            'Java API는 JVM과 네이티브 런타임 구현을 거쳐 필요할 때 시스템 콜 인터페이스로 커널에 I/O를 요청한다. 커널의 네트워크 스택과 드라이버가 NIC 같은 하드웨어 자원을 다룬다. Java 프로세스가 NIC 레지스터를 직접 제어하는 구조가 아니다.',
            'Java API는 애플리케이션·런타임 계층의 추상화다. 실제 커널 서비스가 필요하면 JVM의 네이티브 계층 아래에서 운영체제 인터페이스를 사용한다. 네트워크 스택과 드라이버는 커널 권한으로 장치와 상호작용하므로 Java 메서드 호출 자체를 하드웨어 접근과 같은 층으로 보면 안 된다.')
          apply('operating-systems.core.kernel-boundary.user-kernel-mode.q4',
            '사용자 프로세스가 임의의 커널 주소로 점프하기만 하면 커널 권한을 얻을 수 있는 CPU를 가정하자. 프로세스 격리에 어떤 문제가 생기는가?',
            '통제된 진입 경로가 무너지면 애플리케이션이 커널 코드와 상태에 임의로 진입해 높은 권한의 연산을 실행할 수 있으므로 다른 프로세스의 메모리·장치·커널 상태를 보호할 수 없다. CPU의 권한 메커니즘은 정해진 진입 경로와 접근 권한을 강제해야 한다.',
            '핵심은 **권한 상승 경로도 하드웨어가 통제해야 한다**는 점이다. 임의 점프만으로 높은 권한을 얻을 수 있다면 애플리케이션이 커널 상태나 다른 프로세스의 자원을 조작할 수 있어 격리가 무너진다. 그래서 시스템 콜·예외·인터럽트 같은 진입은 정해진 하드웨어 메커니즘을 거친다.')

          apply('operating-systems.core.kernel-boundary.privilege-protection.q1',
            '주소가 현재 프로세스에 매핑되어 있다는 사실만으로 모든 종류의 메모리 접근이 허용된다고 볼 수 있는가?',
            explain='주소 변환이 가능하다는 사실과 어떤 접근이 허용되는지는 별개의 조건이다. 페이지 매핑이 존재해도 읽기·쓰기·실행 권한에 따라 특정 접근은 거부될 수 있다. 애플리케이션의 역할(role)은 또 다른 계층의 인가 개념이므로 CPU의 메모리 접근 권한을 대신하지 않는다.',
            choices={
              'A':('그렇다. 메모리 접근 권한은 시스템 콜 경계에서만 검사하고 CPU의 메모리 접근에는 적용하지 않는다.','메모리 접근 권한은 시스템 콜 경계에서만이 아니라 load·store·instruction fetch 중에도 하드웨어/MMU가 검사한다. 주소가 매핑되어 있어도 금지된 접근이면 폴트가 발생할 수 있다.'),
              'B':('그렇다. 커널이 매핑을 만들었다는 사실만으로 읽기·쓰기·실행이 모두 허용된다.','매핑에는 읽기·쓰기·실행 권한이 따로 설정될 수 있다. 주소 변환이 존재한다고 모든 동작이 허용되는 것은 아니다.'),
              'C':('아니다. 읽기·쓰기·실행 같은 접근 권한을 별도로 확인해야 한다.','가상 주소가 물리 주소에 매핑되었는지와 특정 접근 권한이 있는지는 별도로 검사한다. 같은 매핑에서도 읽기·쓰기·실행 권한이 다를 수 있다.'),
              'D':('그렇다. 애플리케이션의 `ADMIN` 역할이 있으면 CPU의 페이지 접근 권한도 자동으로 허용된다.','애플리케이션 역할은 애플리케이션 계층의 인가 개념이다. CPU/MMU가 검사하는 페이지 접근 권한을 바꾸지 않는다.')})
          apply('operating-systems.core.kernel-boundary.privilege-protection.q2',
            '왜 `present bit` 같은 특정 PTE 이름을 모든 아키텍처의 공통 메모리 보호 계약처럼 설명하면 안 되는가?',
            '페이지 테이블 엔트리(PTE)의 비트 이름과 의미는 아키텍처마다 다를 수 있다. 공통 개념에서는 주소 매핑·변환과 읽기·쓰기·실행 권한 같은 역할을 설명하고, `present`·`valid`·`accessed` 같은 구체적인 비트는 특정 ISA나 운영체제 구현 범위를 명시해야 한다.',
            '공통 개념은 **가상 주소를 변환하고 접근 권한을 표현·검사한다**는 역할이다. PTE의 실제 비트 이름과 의미는 ISA에 따라 다를 수 있으므로 `present` 같은 구현 이름을 모든 운영체제의 보장으로 일반화하면 계층을 혼동하게 된다.')
          apply('operating-systems.core.kernel-boundary.privilege-protection.q3',
            '시스템 콜이 `(userPointer, length)`를 받는다. 커널이 최소한 어떤 종류의 입력 검증을 해야 하는지 설명하라.',
            '포인터가 호출자의 유효한 사용자 주소 범위인지, 요청 방향에 맞는 접근 권한이 있는지, 길이와 주소 계산이 오버플로하지 않는지 등을 확인해야 한다. 커널 모드에 들어왔다는 이유만으로 사용자 메모리를 신뢰해서는 안 된다.',
            '시스템 콜 인자는 사용자 공간에서 온 **신뢰할 수 없는 입력**이다. 커널은 주소 범위와 접근 방향, 길이 계산 등을 검증해야 하며 높은 권한으로 실행된다는 이유로 호출자가 준 포인터를 그대로 신뢰해서는 안 된다.')
          apply('operating-systems.core.kernel-boundary.privilege-protection.q4',
            'HTTP `ADMIN` 역할 검사는 통과했지만 Linux 프로세스가 `/etc/secret`을 읽을 운영체제 권한은 없다. 요청 결과와 두 권한 계층의 관계를 설명하라.',
            '애플리케이션 인가와 운영체제의 파일 권한은 독립된 계층이다. `ADMIN` 역할이 비즈니스 정책을 통과시켜도 프로세스의 UID/GID/capability가 파일 접근을 허용하지 않으면 운영체제에서 거부될 수 있다. 반대로 운영체제에서 파일 접근이 가능하다고 애플리케이션 인가를 대신하는 것도 아니다.',
            '애플리케이션의 역할 검사는 비즈니스 인가이고, Linux 파일 권한은 프로세스 자격 정보와 파일 시스템 객체 사이의 운영체제 보호 규칙이다. 요청이 성공하려면 필요한 각 계층의 검사를 모두 통과해야 하며 한 계층의 권한이 다른 계층의 권한을 자동으로 부여하지 않는다.')

          apply('operating-systems.core.kernel-boundary.system-call.q1',
            '시스템 콜(System Call)의 역할로 가장 적절한 것은?',
            explain='시스템 콜은 애플리케이션이 운영체제가 소유한 서비스를 **의도적으로 요청하는 인터페이스**다. 라이브러리 API는 사용자 공간에서 끝날 수도 있고, 예외·인터럽트도 커널 진입을 만들 수 있으므로 단순한 모드 전환 전체를 시스템 콜이라고 부를 수 없다. 문맥 전환 역시 별개의 스케줄링 사건이다.',
            choices={
              'A':('사용자 애플리케이션이 커널이 소유한 서비스를 요청하는 인터페이스다.','시스템 콜은 사용자 프로그램이 파일·프로세스 연산처럼 커널 소유 서비스를 요청하는 통제된 인터페이스다.'),
              'B':('커널 기능을 내부에서 사용할 수 있는 모든 라이브러리 함수 자체를 의미한다.','라이브러리 함수는 사용자 공간에서만 끝날 수도 있고 하나 이상의 시스템 콜을 감쌀 수도 있다. 모든 라이브러리 함수가 시스템 콜은 아니다.'),
              'C':('원인과 관계없이 사용자 모드에서 커널 모드로 들어가는 모든 사건을 의미한다.','예외와 인터럽트도 애플리케이션의 의도적인 서비스 요청이 아니어도 커널 처리를 시작할 수 있다. 시스템 콜은 통제된 커널 진입 경로 중 하나다.'),
              'D':('스케줄러가 현재 작업 대신 다른 작업을 선택하는 문맥 전환을 의미한다.','문맥 전환은 실행 중인 작업을 바꾸지만 시스템 콜은 같은 작업 안에서 끝날 수 있다. 커널 진입과 스케줄러의 작업 선택은 다른 사건이다.')})
          apply('operating-systems.core.kernel-boundary.system-call.q2',
            '라이브러리 함수 호출 수와 시스템 콜 수가 1:1이라고 볼 수 없는 이유를 설명하라.',
            '일부 라이브러리 함수는 사용자 공간에서만 실행되고, 버퍼링은 여러 라이브러리 호출을 하나의 시스템 콜로 모을 수 있으며, 하나의 고수준 API가 여러 시스템 콜을 사용할 수도 있다. 라이브러리 추상화와 커널 인터페이스의 단위는 서로 다르다.',
            '라이브러리 함수는 런타임이나 라이브러리가 제공하는 추상화이고 시스템 콜은 커널 인터페이스다. 사용자 공간에서 끝나는 함수도 있고 버퍼링으로 여러 호출을 합칠 수도 있으며, 반대로 하나의 고수준 API가 여러 시스템 콜을 사용할 수도 있다. 따라서 호출 횟수를 기계적으로 1:1 대응시키면 안 된다.')
          apply('operating-systems.core.kernel-boundary.system-call.q3',
            '`read(fd, buf, 4096)`이 정상적으로 1024를 반환했다. 반드시 오류인가? 이유를 설명하라.',
            '반드시 오류는 아니다. I/O 인터페이스는 요청한 길이보다 적은 **부분 결과**를 정상적으로 반환할 수 있다. 호출자는 반환값을 확인해 실제 처리된 바이트 수와 EOF·오류 계약을 구분해야 한다.',
            '`4096`은 요청한 최대 길이지 반드시 반환되어야 하는 길이가 아니다. I/O 계약에 따라 부분 읽기(partial read)가 정상 결과일 수 있으므로 호출자는 실제 반환 바이트 수를 기준으로 이후 처리를 결정해야 한다. EOF와 오류도 API 계약에 따라 별도로 구분한다.')
          apply('operating-systems.core.kernel-boundary.system-call.q4',
            '서로 다른 CPU 아키텍처에서 Linux 시스템 콜 진입을 구현할 때 동일하게 유지해야 할 것과 달라질 수 있는 것을 구분하라.',
            '애플리케이션 관점의 커널 서비스 의미와 운영체제가 제공하는 시스템 콜 동작은 유지될 수 있지만, 진입 명령어·시스템 콜 번호 전달 위치·인자 레지스터 규약 같은 ABI 세부사항은 아키텍처별로 달라질 수 있다. 일반적인 운영체제 개념을 특정 명령어 하나로 고정하면 안 된다.',
            '학습자가 구분해야 하는 층은 **운영체제가 제공하는 서비스의 의미**와 **ISA/ABI가 그 요청을 전달하는 메커니즘**이다. Linux에서 같은 종류의 서비스라도 아키텍처가 달라지면 진입 명령어와 레지스터 규약이 달라질 수 있다. 특정 CPU의 시스템 콜 명령어를 운영체제 일반 정의로 만들면 안 된다.')

          apply('operating-systems.core.kernel-boundary.system-call-flow.q1',
            '다음 시스템 콜 흐름의 올바른 순서는?',
            explain='호출자가 먼저 시스템 콜 번호와 인자를 준비하고 통제된 경로로 커널에 들어간 뒤, 커널이 요청을 분기하고 검증한다. 실제 서비스 실행과 반환 상태 구성은 그 다음이다. 사용자 공간의 인자 준비와 커널 내부 분기 순서를 뒤집으면 경계의 의미가 사라진다.',
            choices={
              'A':('사용자 인자 준비 → 통제된 커널 진입 → 반환 상태 구성 → 서비스 실행 → 요청 분기/검증','서비스를 실행하려면 먼저 커널의 보호된 문맥으로 들어와 요청을 분기하고 검증해야 한다. 서비스 실행 전에 반환 상태부터 만드는 순서는 맞지 않는다.'),
              'B':('사용자 인자 준비 → 요청 분기/검증 → 통제된 커널 진입 → 서비스 실행 → 반환','요청 분기와 검증은 커널에서 실행되므로 통제된 방식으로 커널에 진입한 뒤 수행해야 한다.'),
              'C':('통제된 커널 진입 → 사용자 인자 준비 → 요청 분기/검증 → 서비스 실행 → 반환','호출자는 커널에 진입하기 전에 시스템 콜 번호와 인자를 준비한다. 진입 이후에야 인자를 준비한다면 어떤 요청으로 진입할지 전달할 수 없다.'),
              'D':('사용자 인자 준비 → 통제된 커널 진입 → 요청 분기/검증 → 서비스 실행 → 반환','호출자가 시스템 콜 번호와 인자를 준비하고 통제된 경로로 커널에 진입한 뒤, 커널이 요청을 분기·검증하고 서비스를 수행해 반환한다.')})
          apply('operating-systems.core.kernel-boundary.system-call-flow.q2',
            '블로킹 I/O 시스템 콜이 자원을 기다려야 할 때 현재 작업과 CPU에는 어떤 일이 일어날 수 있는지 설명하라.',
            '현재 작업이 대기·수면 상태가 되어 실행 가능하지 않게 될 수 있고, 스케줄러는 다른 실행 가능한 작업에 CPU를 줄 수 있다. I/O 완료 사건이 발생하면 원래 작업이 다시 실행 가능 상태가 되고, 이후 실행 기회를 얻어 시스템 콜의 복귀 경로를 이어간다.',
            '블로킹은 CPU가 그 작업의 코드를 계속 실행하며 기다린다는 뜻이 아니다. 작업이 대기 상태로 빠지면 스케줄러는 다른 실행 가능한 작업을 실행할 수 있고, I/O 완료 같은 사건이 온 뒤 원래 작업이 다시 실행 가능 상태가 되어 복귀 경로를 이어간다.')
          apply('operating-systems.core.kernel-boundary.system-call-flow.q3',
            '시스템 콜 진입과 동시에 무조건 문맥 전환이 발생한다고 설명하는 것이 틀린 이유를 서술하라.',
            '시스템 콜은 사용자 모드에서 커널 모드로의 진입을 포함할 수 있지만 같은 작업이 커널에서 처리된 뒤 즉시 사용자 모드로 돌아올 수 있다. 문맥 전환은 스케줄러가 다른 작업으로 CPU 실행 문맥을 바꿀 때 발생한다. 블로킹 때문에 문맥 전환이 뒤따를 수는 있지만 둘은 같은 사건이 아니다.',
            '시스템 콜 진입은 같은 작업의 실행이 사용자 영역에서 커널 영역으로 넘어가는 과정일 수 있다. 다른 작업을 선택하지 않았다면 문맥 전환은 필요하지 않다. 다만 시스템 콜이 블로킹되어 현재 작업이 실행 불가능해지면 스케줄러가 다른 작업을 선택하면서 문맥 전환이 뒤따를 수 있다.')
          apply('operating-systems.core.kernel-boundary.system-call-flow.q4',
            '소켓 읽기가 300 ms 걸렸지만 프로파일러에서 해당 Java 스레드의 CPU 사용 시간은 매우 작다. 시스템 콜 흐름과 스케줄러 관점에서 가능한 상태를 분석하라.',
            '스레드가 커널에 읽기를 요청한 뒤 데이터가 준비될 때까지 대기·수면 상태가 되어 CPU를 사용하지 않았을 수 있다. 스케줄러는 그동안 다른 작업을 실행하고, I/O 완료 후 해당 작업이 다시 실행 가능 상태가 되어 복귀한다. 경과 시간 300 ms를 CPU 실행 시간 300 ms로 해석하면 안 된다.',
            '관찰된 300 ms는 실제 경과 시간이다. 읽기가 데이터를 기다리는 동안 작업이 수면 상태에 있고 CPU는 다른 작업을 실행했을 수 있으므로 CPU 시간은 작게 나올 수 있다. 원인을 찾을 때 시스템 콜 진입 비용만 보지 말고 I/O 대기, 깨우기, 실행 가능 상태가 된 뒤의 스케줄링 지연까지 나눠 봐야 한다.')

          apply('operating-systems.core.kernel-boundary.interrupt-exception-system-call.q1',
            'RISC-V 용어에서 트랩(trap)과 인터럽트(interrupt)·예외(exception)의 관계로 맞는 것은?',
            explain='RISC-V 문맥에서 예외는 현재 명령어와 연관된 동기 사건이고 인터럽트는 비동기적인 외부 사건이다. **트랩(trap)**은 이 예외 또는 인터럽트 때문에 처리기로 제어가 전달되는 사건을 가리킨다. 시스템 콜은 `ECALL` 같은 동기 예외 메커니즘 위에 구현될 수 있다.',
            choices={
              'A':('트랩은 예외 또는 인터럽트 때문에 처리기로 제어가 전달되는 것을 가리킨다.','RISC-V에서 트랩은 예외 또는 인터럽트가 일으키는 처리기로의 제어 이전을 뜻한다. 예외는 명령 실행과 동기적이고 인터럽트는 비동기적이다.'),
              'B':('트랩은 비동기 인터럽트만 가리키며 동기 예외는 포함하지 않는다.','트랩 처리는 비동기 인터럽트뿐 아니라 동기 예외도 포함한다. 이를 인터럽트로만 한정하면 현재 명령어와 연관된 원인을 놓친다.'),
              'C':('트랩은 인터럽트와 예외 옆에 놓이는 독립적인 세 번째 원인 범주다.','이 용어에서 트랩은 예외·인터럽트와 나란한 세 번째 독립 원인이 아니다. 둘 중 하나 때문에 처리기로 제어가 넘어가는 사건을 가리킨다.'),
              'D':('시스템 콜은 예외와 무관한 별도의 하드웨어 트랩 범주로 반드시 구현된다.','RISC-V의 `ECALL` 같은 환경 호출은 동기 예외를 일으킬 수 있고 운영체제는 이를 시스템 콜 요청으로 처리한다. 시스템 콜이 별도의 하드웨어 사건 범주일 필요는 없다.')})
          apply('operating-systems.core.kernel-boundary.interrupt-exception-system-call.q2',
