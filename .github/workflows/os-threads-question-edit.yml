name: OS Threads curated question edit

on:
  push:
    branches:
      - codex/content-operating-systems-quality

permissions:
  contents: write

jobs:
  edit-threads-questions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0

      - name: Apply curated Threads question wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('content/operating-systems/threads/questions.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          before = [
              (q['contentKey'], q['questionType'], q['difficulty'], q['status'],
               copy.deepcopy(q.get('conceptKeys')), copy.deepcopy(q.get('acceptedAnswers')),
               q.get('correctChoiceKey'), [(c['key'], c['displayOrder']) for c in q.get('choices', [])])
              for q in data
          ]
          by_key = {q['contentKey']: q for q in data}

          def edit(key, *, prompt=None, model=None, explanation=None, choices=None):
              q = by_key[key]
              if prompt is not None:
                  q['promptMarkdown'] = prompt
              if model is not None:
                  q['modelAnswer'] = model
              if explanation is not None:
                  q['explanationMarkdown'] = explanation
              if choices:
                  choice_by_key = {c['key']: c for c in q['choices']}
                  for ck, values in choices.items():
                      c = choice_by_key[ck]
                      if 'content' in values:
                          c['content'] = values['content']
                      if 'rationale' in values:
                          c['rationaleMarkdown'] = values['rationale']

          edit('operating-systems.core.threads.process-vs-thread.q1',
               prompt='같은 프로세스의 두 스레드가 일반적으로 공유하는 것과 스레드별로 따로 가지는 것을 올바르게 짝지은 것은?',
               explanation='같은 프로세스의 스레드들은 보통 코드·힙과 여러 프로세스 자원을 공유하지만, 각자 독립적으로 명령어를 실행해야 하므로 **프로그램 카운터·레지스터 문맥·스택**은 스레드별로 필요하다. 공유 자원과 실행 문맥의 경계를 구분하는 것이 핵심이다.',
               choices={
                   'A': {'content':'각 스레드가 독립된 주소 공간을 가지지만 열린 자원은 항상 공유한다','rationale':'한 프로세스의 스레드들은 보통 주소 공간을 공유한다. 반대로 서로 다른 프로세스는 각자 주소 공간 매핑을 가지며 파일 같은 자원의 공유·상속 여부도 운영체제 규칙에 따라 달라진다.'},
                   'B': {'content':'같은 주소 공간을 쓰므로 스택과 레지스터 문맥도 하나를 공유한다','rationale':'주소 공간은 공유해도 각 스레드는 독립적으로 실행하기 위해 별도의 스택과 레지스터 문맥이 필요하다. 실행 문맥 하나만 공유하면 서로 다른 호출 경로를 유지할 수 없다.'},
                   'C': {'content':'힙은 공유하고 각 스레드의 스택·레지스터 문맥은 분리한다','rationale':'한 프로세스의 스레드들은 보통 힙 객체와 코드 매핑을 공유하지만 각자 스택·레지스터·프로그램 카운터를 가진다. 그래서 공유 데이터에 접근하면서도 서로 다른 실행 흐름을 유지할 수 있다.'},
                   'D': {'content':'스레드마다 힙은 분리되지만 프로그램 카운터는 프로세스 전체에서 하나다','rationale':'같은 프로세스의 스레드들은 힙 객체를 공유할 수 있지만 각자 현재 명령어 위치와 레지스터 상태를 가져야 한다. 프로세스 전체에 프로그램 카운터가 하나뿐이라면 여러 실행 흐름을 독립적으로 나타낼 수 없다.'}
               })
          edit('operating-systems.core.threads.process-vs-thread.q2',
               prompt='같은 프로그램을 두 프로세스로 실행하는 경우와 한 프로세스 안에서 두 스레드를 실행하는 경우의 격리 차이를 설명하라.',
               model='두 프로세스는 기본적으로 서로 다른 가상 주소 공간과 프로세스 자원·생명주기 경계를 가진다. 같은 프로세스의 스레드는 힙과 여러 프로세스 자원을 공유한다. 스레드 사이의 데이터 교환은 직접적이지만 메모리 손상이나 치명적 오류의 영향도 같은 프로세스 내부에서 함께 전파될 수 있다.',
               explanation='프로세스를 나누면 주소 공간과 생명주기 경계가 강해져 직접 메모리를 공유하기 어렵고 IPC가 필요할 수 있다. 반대로 같은 프로세스의 스레드는 힙을 직접 공유해 데이터 교환 비용은 낮지만 경쟁 상태나 프로세스 전체를 끝낼 수 있는 치명적 오류의 영향도 함께 받을 수 있다.')
          edit('operating-systems.core.threads.process-vs-thread.q3',
               prompt='신뢰할 수 없는 플러그인을 호스트와 같은 프로세스의 스레드로 실행했더니 네이티브 메모리 오류로 서버 전체가 종료되었다. 스레드 대신 프로세스 경계를 고려할 이유를 설명하라.',
               model='스레드는 호스트와 주소 공간·프로세스 생명주기를 공유하므로 네이티브 메모리 손상이나 치명적 오류가 프로세스 전체에 영향을 줄 수 있다. 별도 프로세스는 IPC 비용이 생기지만 주소 공간과 비정상 종료의 영향을 더 강하게 격리할 수 있다.',
               explanation='이 상황의 핵심 요구는 단순한 동시성이 아니라 **장애 격리**다. 같은 프로세스의 스레드는 주소 공간과 생명주기를 공유하므로 네이티브 메모리 손상 같은 치명적 오류가 서버 프로세스 전체로 전파될 수 있다. 별도 프로세스는 IPC 비용을 지불하는 대신 메모리와 장애 경계를 더 강하게 분리한다.')

          edit('operating-systems.core.threads.thread-shared-state.q1',
               prompt='두 스레드가 같은 힙의 `counter`에 대해 동시에 읽기-수정-쓰기(read-modify-write)를 수행할 때 발생할 수 있는 대표 문제는?',
               explanation='`counter = counter + 1`은 하나의 문장처럼 보여도 실제 실행은 읽기 → 계산 → 쓰기 단계로 나뉠 수 있다. 두 스레드가 같은 이전 값을 읽으면 각각 같은 새 값을 써서 한 번의 증가가 사라질 수 있다. **메모리를 공유한다는 사실만으로 연산의 원자성이 보장되지는 않는다.**',
               choices={
                   'A': {'content':'두 스레드가 같은 이전 값을 읽어 증가 한 번의 결과가 사라질 수 있다','rationale':'읽기-수정-쓰기가 하나의 원자적 연산으로 보호되지 않으면 여러 단계가 서로 교차할 수 있다. 두 스레드가 같은 이전 값을 읽고 같은 증가 값을 쓰면 한 번의 갱신 효과가 사라질 수 있다.'},
                   'B': {'content':'같은 힙을 공유하므로 읽기-수정-쓰기 전체가 자동으로 원자적이 된다','rationale':'힙 공유는 두 스레드가 같은 값을 볼 수 있게 할 뿐 여러 단계의 갱신을 하나의 원자적 연산으로 묶어 주지는 않는다. 동기화나 원자적 연산이 별도로 필요하다.'},
                   'C': {'content':'CPU가 여러 코어를 사용하면 같은 메모리 위치에 대한 접근은 자동으로 직렬화된다','rationale':'여러 코어가 캐시 일관성을 유지하더라도 여러 명령으로 이루어진 읽기-수정-쓰기 전체가 자동으로 하나의 원자적 연산이 되지는 않는다. 실행이 교차되면 한쪽 결과가 다른 쪽에 덮어써질 수 있다.'},
                   'D': {'content':'각 스레드의 스택이 분리되어 있으므로 공유 힙의 갱신도 서로 영향을 주지 않는다','rationale':'스레드별 스택은 각자의 호출 상태를 분리할 뿐 공유 힙 객체를 격리하지 않는다. 공통 힙의 `counter`를 갱신하면 다른 스레드가 관찰하는 값에도 영향을 준다.'}
               })
          edit('operating-systems.core.threads.thread-shared-state.q2',
               prompt="같은 프로세스의 여러 스레드가 파일 디스크립터를 공유할 때 단순히 '각 스레드가 독립된 파일 상태를 가진다'고 생각하면 안 되는 이유를 설명하라.",
               model='파일 디스크립터와 그 디스크립터가 가리키는 열린 자원 상태가 프로세스 단위에서 공유될 수 있기 때문이다. 여러 스레드의 `read`·`write`·`close`가 같은 커널 객체와 파일 오프셋·소켓 상태에 영향을 줄 수 있으므로 어떤 상태가 공유되는지 운영체제의 자원 계약을 확인해야 한다.',
               explanation='같은 프로세스의 스레드는 프로세스 단위의 디스크립터 테이블과 그 디스크립터가 가리키는 커널 자원을 함께 사용할 수 있다. 따라서 한 스레드의 `read`·`write`·`close`가 다른 스레드가 보는 파일 오프셋이나 소켓 생명주기에 영향을 줄 수 있어 자원별 공유 규칙을 확인해야 한다.')
          edit('operating-systems.core.threads.thread-shared-state.q3',
               prompt='T1과 T2가 같은 `balance`를 읽고 각각 `+10`을 계산한 뒤 쓴다. 초기값이 100이고 두 스레드가 모두 쓰기 전에 100을 읽었다면 최종값으로 가능한 것은?',
               explanation='두 스레드가 모두 100을 읽었다면 각자 계산한 값은 110이다. 이후 T1과 T2가 차례로 110을 써도 최종값은 110이므로 한 번의 `+10` 효과가 사라진다. 이것이 읽기-수정-쓰기 실행 교차에서 나타나는 대표적인 **갱신 손실(lost update)**이다.')
          edit('operating-systems.core.threads.thread-shared-state.q4',
               prompt='DB 트랜잭션 안에서 실행되는 Java 코드라면 같은 싱글턴 필드에 대한 스레드 경쟁도 자동으로 해결된다고 볼 수 있는가? 이유를 설명하라.',
               model='아니다. DB 트랜잭션은 DB가 관리하는 자원의 원자성·격리 계약이고 JVM 힙의 공유 가변 상태에 대한 스레드 동기화를 자동으로 제공하지 않는다. 자바 메모리 모델(Java Memory Model)과 원자성·락 계약은 별도로 고려해야 한다.',
               explanation='DB 트랜잭션의 격리는 DB가 관리하는 데이터와 트랜잭션 사이의 계약이다. 같은 JVM 프로세스 안의 싱글턴 필드는 별도의 힙 공유 상태이므로 트랜잭션을 열었다는 이유만으로 Java 수준의 원자성·가시성·상호 배제가 생기지 않는다. 서로 다른 계층의 동시성 문제다.')

          edit('operating-systems.core.threads.thread-private-state.q1',
               prompt='스레드마다 독립적으로 유지되어야 하는 실행 상태는?',
               explanation='각 스레드는 서로 다른 명령어 위치와 함수 호출 경로를 독립적으로 진행하므로 프로그램 카운터, 레지스터 문맥, 호출 스택이 필요하다. 힙·코드·여러 프로세스 자원은 같은 프로세스의 스레드 사이에서 공유될 수 있다.',
               choices={
                   'A': {'content':'프로세스 전체의 가상 주소 공간 매핑 전체','rationale':'프로세스 주소 공간은 보통 스레드마다 복제하지 않고 여러 스레드가 공유한다. 스레드별 실행 상태는 전체 주소 공간 매핑보다 범위가 좁다.'},
                   'B': {'content':'프로세스의 모든 힙 객체와 코드 페이지','rationale':'한 프로세스 안의 힙 객체와 코드 페이지는 여러 스레드가 공유할 수 있다. 이를 스레드마다 모두 복제하는 것은 일반적인 스레드 모델이 아니다.'},
                   'C': {'content':'프로세스가 연 모든 파일 디스크립터의 독립 복사본','rationale':'프로세스의 디스크립터 테이블은 스레드 사이에서 공유될 수 있어 각 스레드가 모든 디스크립터를 별도로 복제할 필요는 없다. 대신 CPU 실행 상태는 스레드마다 따로 필요하다.'},
                   'D': {'content':'프로그램 카운터, 레지스터 문맥, 호출 스택','rationale':'각 스레드는 자신의 명령어 위치와 호출 경로에서 실행을 재개할 수 있도록 프로그램 카운터·레지스터 문맥·호출 스택을 따로 가져야 한다. 이들은 프로세스 전체가 공유하는 메모리 매핑과 다르다.'}
               })
          edit('operating-systems.core.threads.thread-private-state.q2',
               prompt='지역 참조 변수가 한 스레드의 스택에 있다는 사실만으로 그 참조가 가리키는 객체까지 스레드 전용이라고 할 수 없는 이유를 설명하라.',
               model='참조 변수 자체는 각 스레드의 스택 프레임에 있어도 그 값이 가리키는 객체는 공유 힙에 존재할 수 있다. 다른 스레드도 같은 객체의 참조를 얻을 수 있다면 그 객체의 상태는 공유된다.',
               explanation='변수의 **저장 위치**와 그 변수가 가리키는 **객체의 공유 범위**는 다르다. 지역 참조 변수가 한 스레드의 스택에 있어도 대상 객체가 공유 힙에 있고 다른 스레드도 그 객체에 도달할 수 있다면 객체 상태는 공유된다.')
          edit('operating-systems.core.threads.thread-private-state.q3',
               prompt='스레드 풀의 작업 스레드에 요청 ID를 `ThreadLocal`로 저장하고 작업 종료 후 값을 제거하지 않았다. 다음 요청에서 이전 ID가 보일 수 있는 이유를 설명하라.',
               model='스레드 풀은 같은 플랫폼 스레드를 여러 작업에 재사용할 수 있으므로 `ThreadLocal` 값의 생명주기가 요청이 아니라 작업 스레드에 묶일 수 있다. 작업 경계에서 값을 명시적으로 설정·제거하거나 안전한 문맥 전파 방식을 사용해야 한다.',
               explanation='스레드 풀은 요청이 끝나도 작업 스레드를 종료하지 않고 다음 작업에 재사용할 수 있다. `ThreadLocal` 값은 요청이 아니라 **그 작업 스레드의 생명주기**에 붙으므로 정리가 빠지면 다음 작업이 이전 요청의 문맥을 관찰할 수 있다.')

          edit('operating-systems.core.threads.kernel-thread.q1',
               prompt='이 Topic에서 말하는 커널이 인식하는 스레드(kernel-visible thread)의 핵심 특징은?',
               explanation='여기서 커널이 인식하는 스레드는 운영체제 스케줄러가 별도의 실행 상태로 추적할 수 있는 스레드를 뜻한다. 같은 프로세스의 여러 스레드가 주소 공간을 공유하면서도 서로 다른 실행 가능·대기 상태를 가질 수 있으므로 주소 공간 경계와 스케줄링 경계를 혼동하면 안 된다.',
               choices={
