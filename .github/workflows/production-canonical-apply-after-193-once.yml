name: One-time exact canonical apply after import fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-apply-after-193-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  apply-exact-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      APPLY_SERVICE: csforge-canonical-apply-after-194-once
      CODE_BASE_SHA: 1d7018a812f62adc2f2f0d44a76f32c44719d081
      CONTENT_BASE_SHA: ba8c40c4907bbb35fbd662fbc1beb56f64ae7736
      EXACT_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-exact-ba8c40c-code-1d7018a
      APPLY_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-apply-after-194-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODE_BASE_SHA }}
          fetch-depth: 0

      - name: Verify code and pinned content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CODE_BASE_SHA}"
          git cat-file -e "${CONTENT_BASE_SHA}^{commit}"
          git diff --exit-code "${CONTENT_BASE_SHA}" "${CODE_BASE_SHA}" -- content

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and verify backend image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build \
            --label "org.opencontainers.image.revision=${CODE_BASE_SHA}" \
            --label "com.csforge.canonical-content=${CONTENT_BASE_SHA}" \
            --file backend/Dockerfile \
            --tag "${EXACT_IMAGE}" \
            .

          cid="$(docker create "${EXACT_IMAGE}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/app/app.jar" /tmp/exact-app.jar
          docker rm -f "${cid}" >/dev/null
          trap - EXIT

          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('content')
          prefix = 'BOOT-INF/classes/canonical-content/'
          with ZipFile('/tmp/exact-app.jar') as jar:
              manifest = jar.read(prefix + 'manifest.txt').decode('utf-8').splitlines()
              if len(manifest) != 870:
                  raise SystemExit(f'expected 870 canonical files, got {len(manifest)}')
              if manifest != sorted(manifest) or len(manifest) != len(set(manifest)):
                  raise SystemExit('canonical manifest is not sorted and unique')
              mismatches = [rel for rel in manifest if (root / rel).read_bytes() != jar.read(prefix + rel)]
              if mismatches:
                  raise SystemExit('packaged canonical content mismatch: ' + ', '.join(mismatches[:10]))
          print(f'canonical files={len(manifest)}, byte mismatches=0')
          PY

          docker push "${EXACT_IMAGE}"

      - name: Build apply wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-apply-after-194

          cat > /tmp/canonical-apply-after-194/result-server.py <<'PY'
          import hmac
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          TOKEN = os.environ['PREVIEW_RESULT_TOKEN']
          RESULT = Path('/tmp/public-result.json')
          PORT = int(os.environ.get('PORT', '8080'))

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/result':
                      self.send_response(404); self.end_headers(); return
                  if not hmac.compare_digest(self.headers.get('X-Preview-Token', ''), TOKEN):
                      self.send_response(403); self.end_headers(); return
                  if not RESULT.exists():
                      body = b'{"state":"RUNNING"}'
                      self.send_response(202)
                  else:
                      body = RESULT.read_bytes()
                      self.send_response(200)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, fmt, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', PORT), Handler).serve_forever()
          PY

          cat > /tmp/canonical-apply-after-194/run-apply.sh <<'SH'
          #!/bin/bash
          set -euo pipefail

          EXPECTED_FILES=870
          EXPECTED_BATCHES=12
          EXPECTED_ITEMS=3380
          EXPECTED_TOPICS=134
          EXPECTED_CONCEPTS=721
          EXPECTED_QUESTIONS=2525
          EXPECTED_AREAS=15
          EXPECTED_UPDATED=2472
          EXPECTED_UNCHANGED=908

          phase() { printf '%s' "$1" >/tmp/apply-phase; }

          phase START_JAVA
          java -jar /app/app.jar --spring.profiles.active=local --server.port=8081 >/tmp/java.log 2>&1 &
          java_pid=$!
          cleanup() {
            kill "$java_pid" 2>/dev/null || true
            wait "$java_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          phase WAIT_PREFLIGHT
          ok=0
          for _ in $(seq 1 360); do
            code=$(curl --silent --show-error --max-time 300 --output /tmp/pre.json --write-out '%{http_code}' \
              http://127.0.0.1:8081/api/canonical-bootstrap/status || true)
            if [[ "$code" == "200" ]]; then ok=1; break; fi
            if ! kill -0 "$java_pid" 2>/dev/null; then exit 21; fi
            sleep 2
          done
          [[ "$ok" -eq 1 ]] || exit 22

          phase ASSERT_PREFLIGHT
          jq -e \
            --argjson files "$EXPECTED_FILES" --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_ITEMS" --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .state == "PARTIAL" and .sourceFileCount == $files and
              .totalBatches == $batches and .readyBatches == 9 and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/pre.json >/dev/null

          phase PREPARE_DB
          python3 <<'PY' >/tmp/pg-env
          import os, shlex
          from urllib.parse import urlparse, parse_qs, unquote
          raw = os.environ['DB_URL']
          if raw.startswith('jdbc:'): raw = raw[5:]
          parsed = urlparse(raw)
          if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
              raise SystemExit('unsupported DB_URL')
          db = unquote(parsed.path.lstrip('/'))
          if not db: raise SystemExit('database name missing')
          values = {
              'PGHOST': parsed.hostname,
              'PGPORT': str(parsed.port or 5432),
              'PGDATABASE': db,
              'PGUSER': os.environ['DB_USERNAME'],
              'PGPASSWORD': os.environ['DB_PASSWORD'],
          }
          q = parse_qs(parsed.query)
          if q.get('sslmode'): values['PGSSLMODE'] = q['sslmode'][0]
          for key, value in values.items(): print(f'export {key}={shlex.quote(value)}')
          PY
          . /tmp/pg-env
          rm -f /tmp/pg-env
          export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
          [[ -z "${PGSSLMODE:-}" ]] || export PGSSLMODE
          psql -X -v ON_ERROR_STOP=1 -Atc 'select 1' >/dev/null

          snapshot() {
            local dest="$1"
            : >"$dest"
            for table in concept_progress personal_note quiz_session quiz_question attempt wrong_note review_schedule review_history; do
              exists=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.${table}') IS NOT NULL;")
              if [[ "$exists" == "t" ]]; then
                psql -X -v ON_ERROR_STOP=1 -Atc "SELECT '${table}' || E'\\t' || count(*) || E'\\t' || md5(COALESCE(string_agg(md5(row_to_json(t)::text), '' ORDER BY md5(row_to_json(t)::text)), '')) FROM ${table} t;" >>"$dest"
              fi
            done
          }

          snapshot /tmp/history-before.tsv

          phase APPLY_FIRST
          : >/tmp/apply-invoked
          curl --silent --show-error --fail-with-body --max-time 1200 \
            --request POST http://127.0.0.1:8081/api/canonical-bootstrap >/tmp/first.json

          phase ASSERT_FIRST
          jq -e \
            --argjson files "$EXPECTED_FILES" --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_ITEMS" --argjson updated "$EXPECTED_UPDATED" \
            --argjson unchanged "$EXPECTED_UNCHANGED" --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .success == true and .state == "READY" and .sourceFileCount == $files and
              .totalBatches == $batches and .completedBatches == $batches and .totalItems == $items and
              .failedBatch == null and .failedKind == null and .failureMessage == null and
              .totals.created == 0 and .totals.updated == $updated and .totals.unchanged == $unchanged and
              .totals.skipped == 0 and .totals.errors == 0 and .totals.failed == 0 and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/first.json >/dev/null

          phase VERIFY_HISTORY_FIRST
          snapshot /tmp/history-first.tsv
          cmp -s /tmp/history-before.tsv /tmp/history-first.tsv

          phase VERIFY_REPRESENTATIVE_CONTENT
          [[ "$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM concept WHERE content_key='messaging.core.semantics.consumer-offset' AND title='컨슈머 그룹과 처리 위치';")" == "1" ]]
          [[ "$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM question WHERE (content_key='backend.core.api.methods-status.q2' AND question_type='DESCRIPTIVE') OR (content_key='dsa.core.search-sort.merge-sort.q1' AND question_type='SHORT_ANSWER') OR (content_key='dsa.core.stack-queue-deque.deque.q1' AND question_type='SHORT_ANSWER') OR (content_key='infrastructure.core.compute.execution-models.q1' AND question_type='SHORT_ANSWER');")" == "4" ]]

          phase VERIFY_READY
          curl --silent --show-error --fail-with-body --max-time 900 \
            http://127.0.0.1:8081/api/canonical-bootstrap/status >/tmp/post.json
          jq -e \
            --argjson files "$EXPECTED_FILES" --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_ITEMS" --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .state == "READY" and .sourceFileCount == $files and .totalBatches == $batches and
              .readyBatches == $batches and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/post.json >/dev/null

          phase APPLY_SECOND
          curl --silent --show-error --fail-with-body --max-time 1200 \
            --request POST http://127.0.0.1:8081/api/canonical-bootstrap >/tmp/second.json
          jq -e --argjson batches "$EXPECTED_BATCHES" --argjson items "$EXPECTED_ITEMS" '
              .success == true and .state == "READY" and .completedBatches == $batches and
              .totals.created == 0 and .totals.updated == 0 and .totals.unchanged == $items and
              .totals.skipped == 0 and .totals.errors == 0 and .totals.failed == 0 and
              .failedBatch == null and .failedKind == null and .failureMessage == null
            ' /tmp/second.json >/dev/null

          phase VERIFY_HISTORY_SECOND
          snapshot /tmp/history-second.tsv
          cmp -s /tmp/history-before.tsv /tmp/history-second.tsv

          phase BUILD_RESULT
          python3 <<'PY'
          import json
          from pathlib import Path
          result = {
              'state': 'DONE',
              'codeBaseSha': '1d7018a812f62adc2f2f0d44a76f32c44719d081',
              'contentBaseSha': 'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736',
              'exactJarContentVerified': True,
              'preStatus': json.load(open('/tmp/pre.json', encoding='utf-8')),
              'firstApply': json.load(open('/tmp/first.json', encoding='utf-8')),
              'postStatus': json.load(open('/tmp/post.json', encoding='utf-8')),
              'secondApply': json.load(open('/tmp/second.json', encoding='utf-8')),
              'historyPreserved': True,
              'representativeContentVerified': True,
              'idempotencyVerified': True,
              'flywayEnabled': False,
              'destructiveApplyInvoked': True,
          }
          Path('/tmp/public-result.json.tmp').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          Path('/tmp/public-result.json.tmp').replace('/tmp/public-result.json')
          PY
          phase DONE
          SH
          chmod +x /tmp/canonical-apply-after-194/run-apply.sh

          cat > /tmp/canonical-apply-after-194/wrapper-entrypoint.sh <<'SH'
          #!/bin/sh
          set -u
          (
            /app/run-apply.sh >/tmp/compute.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && [ ! -f /tmp/public-result.json ]; then
              phase=$(cat /tmp/apply-phase 2>/dev/null || echo UNKNOWN)
              invoked=false
              [ -f /tmp/apply-invoked ] && invoked=true
              python3 - "$rc" "$phase" "$invoked" <<'PY'
          import json, sys
          from pathlib import Path
          rc, phase, invoked = int(sys.argv[1]), sys.argv[2], sys.argv[3] == 'true'
          diagnostic = ''
          for path in ['/tmp/compute.log', '/tmp/java.log']:
              p = Path(path)
              if p.exists(): diagnostic += p.read_text(encoding='utf-8', errors='replace')[-8000:]
          payload = {
              'state':'ERROR', 'exitCode':rc, 'phase':phase,
              'diagnostic':diagnostic[-12000:],
              'codeBaseSha':'1d7018a812f62adc2f2f0d44a76f32c44719d081',
              'contentBaseSha':'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736',
              'destructiveApplyInvoked':invoked, 'flywayEnabled':False,
          }
          for name, path in [('preStatus','/tmp/pre.json'),('firstApply','/tmp/first.json'),('postStatus','/tmp/post.json'),('secondApply','/tmp/second.json')]:
              p = Path(path)
              if p.exists():
                  try: payload[name] = json.loads(p.read_text(encoding='utf-8'))
                  except Exception: pass
          Path('/tmp/public-result.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
            fi
          ) &
          exec python3 /app/result-server.py
          SH
          chmod +x /tmp/canonical-apply-after-194/wrapper-entrypoint.sh

          cat > /tmp/canonical-apply-after-194/Dockerfile <<'DOCKER'
          ARG EXACT_IMAGE
          FROM ${EXACT_IMAGE}
          USER root
          RUN apt-get update \
              && apt-get install --no-install-recommends --yes postgresql-client jq python3 \
              && rm -rf /var/lib/apt/lists/*
          COPY result-server.py /app/result-server.py
          COPY run-apply.sh /app/run-apply.sh
          COPY wrapper-entrypoint.sh /app/wrapper-entrypoint.sh
          RUN chmod +x /app/run-apply.sh /app/wrapper-entrypoint.sh
          USER 10001:10001
          ENTRYPOINT ["/app/wrapper-entrypoint.sh"]
          DOCKER

          docker build --build-arg EXACT_IMAGE="${EXACT_IMAGE}" --tag "${APPLY_IMAGE}" /tmp/canonical-apply-after-194
          docker push "${APPLY_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json >"${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json, os, sys
          service_path, output_path = sys.argv[1], sys.argv[2]
          service = json.load(open(service_path, encoding='utf-8'))
          wanted = {'DB_URL','DB_USERNAME','DB_PASSWORD','DB_MAX_POOL_SIZE','DB_MIN_IDLE','DB_CONNECTION_TIMEOUT','DB_VALIDATION_TIMEOUT'}
          required = {'DB_URL','DB_USERNAME','DB_PASSWORD'}
          entries = service['spec']['template']['spec']['containers'][0].get('env', [])
          plain = {
              'SPRING_PROFILES_ACTIVE':'local',
              'CSFORGE_AI_ENABLED':'false',
              'SPRING_FLYWAY_ENABLED':'false',
              'SPRING_JPA_HIBERNATE_DDL_AUTO':'validate',
              'PREVIEW_RESULT_TOKEN': os.environ['PREVIEW_RESULT_TOKEN'],
          }
          secrets, found = [], set()
          for item in entries:
              name = item.get('name')
              if name not in wanted: continue
              found.add(name)
              if 'value' in item:
                  plain[name] = item['value']; continue
              ref = item.get('valueFrom', {}).get('secretKeyRef', {})
              if not ref.get('name') or not ref.get('key'):
                  raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          missing = required - found
          if missing: raise SystemExit('missing DB vars: ' + ','.join(sorted(missing)))
          json.dump(plain, open('/tmp/apply-env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out:
              out.write('secrets=' + ','.join(secrets) + '\n')
          PY
          echo "service_account=${service_account}" >>"${GITHUB_OUTPUT}"

      - name: Deploy private apply service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${APPLY_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --image="${APPLY_IMAGE}" \
            --service-account="${{ steps.prod.outputs.service_account }}" \
            --env-vars-file=/tmp/apply-env.json \
            --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=1800 \
            --no-cpu-throttling --cpu-boost --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.prod.outputs.secrets }}")
          fi
          gcloud "${args[@]}"
          actual_url="$(gcloud run services describe "${APPLY_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          test -n "${actual_url}"
          echo "url=${actual_url}" >>"${GITHUB_OUTPUT}"

      - name: Mint apply service ID token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch and verify apply result
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          APPLY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for _ in $(seq 1 700); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" \
              --header "X-Preview-Token: ${PREVIEW_RESULT_TOKEN}" \
              "${APPLY_URL}/result" || true)"
            if [[ "${code}" == "200" ]]; then break; fi
            if [[ "${code}" != "202" && "${code}" != "000" ]]; then
              cat /tmp/result.json || true
              exit 1
            fi
            sleep 3
          done
          test "${code}" = "200"
          jq . /tmp/result.json
          jq -e '.state == "DONE" and .codeBaseSha == "1d7018a812f62adc2f2f0d44a76f32c44719d081" and .contentBaseSha == "ba8c40c4907bbb35fbd662fbc1beb56f64ae7736"' /tmp/result.json >/dev/null
          jq -e '.exactJarContentVerified == true and .destructiveApplyInvoked == true and .flywayEnabled == false' /tmp/result.json >/dev/null
          jq -e '.firstApply.success == true and .firstApply.totals.created == 0 and .firstApply.totals.updated == 2472 and .firstApply.totals.unchanged == 908 and .firstApply.totals.errors == 0 and .firstApply.totals.failed == 0' /tmp/result.json >/dev/null
          jq -e '.postStatus.state == "READY" and .postStatus.readyBatches == 12' /tmp/result.json >/dev/null
          jq -e '.secondApply.success == true and .secondApply.totals.updated == 0 and .secondApply.totals.unchanged == 3380' /tmp/result.json >/dev/null
          jq -e '.historyPreserved == true and .representativeContentVerified == true and .idempotencyVerified == true' /tmp/result.json >/dev/null

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canonical-apply-after-194-ba8c40c
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary apply service
        if: always()
        run: gcloud run services delete "${APPLY_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
