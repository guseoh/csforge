name: One-time production canonical question batch diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-apply-diagnostic-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-question-batches:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      DIAGNOSTIC_SERVICE: csforge-canonical-diagnostic-once
      CONTENT_BASE_SHA: ba8c40c4907bbb35fbd662fbc1beb56f64ae7736
      BASE_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-apply-retry-061185f302775cea51fe27245eb96ed3e8484b1e
      DIAGNOSTIC_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-question-batches-${{ github.sha }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build exact batch diagnostic wrapper
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          mkdir -p /tmp/question-batch-diagnostic
          cat > /tmp/question-batch-diagnostic/run-diagnostic.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          java -jar /app/app.jar --spring.profiles.active=local --server.port=8081 >/tmp/java.log 2>&1 &
          java_pid=$!
          cleanup() {
            kill "$java_pid" 2>/dev/null || true
            wait "$java_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 360); do
            code=$(curl --silent --show-error --max-time 60 --output /tmp/status.json --write-out '%{http_code}' http://127.0.0.1:8081/api/canonical-bootstrap/status || true)
            if [[ "$code" == "200" ]]; then ok=1; break; fi
            if ! kill -0 "$java_pid" 2>/dev/null; then exit 21; fi
            sleep 2
          done
          [[ "$ok" -eq 1 ]]

          mapfile -t question_files < <(find /app/content -type f -name questions.json | sort)
          batch_no=10
          batch_files=()
          batch_items=0
          batch_bytes=0
          : >/tmp/batches.jsonl

          preview_batch() {
            local seq="$1"
            shift
            local -a files=("$@")
            local -a args=(--silent --show-error --max-time 600 --output "/tmp/batch-${seq}.json" --write-out '%{http_code}')
            for file in "${files[@]}"; do
              local rel="${file#/app/}"
              args+=(-F "files=@${file};filename=${rel}")
            done
            local code
            code=$(curl "${args[@]}" http://127.0.0.1:8081/api/imports/preview || true)
            if [[ "$code" != "200" ]]; then
              python3 - "$seq" "$code" "/tmp/batch-${seq}.json" <<'PY' >>/tmp/batches.jsonl
          import json,sys
          from pathlib import Path
          seq=int(sys.argv[1]); code=sys.argv[2]; p=Path(sys.argv[3])
          body=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          print(json.dumps({'batch':seq,'httpCode':code,'canApply':False,'totals':None,'errors':[],'httpBody':body[:4000]},ensure_ascii=False))
          PY
              return
            fi
            jq -c --argjson batch "$seq" '{batch:$batch,httpCode:"200",canApply:.canApply,totals:.totals,errors:[.items[]|select(.classification=="ERROR")|{fileName,itemIndex,kind,contentKey,classification,reason,errors,diffs}]}' "/tmp/batch-${seq}.json" >>/tmp/batches.jsonl
          }

          for file in "${question_files[@]}"; do
            rel="${file#/app/}"
            curl --silent --show-error --fail-with-body --max-time 180 -F "files=@${file};filename=${rel}" http://127.0.0.1:8081/api/imports/preview >/tmp/single.json
            item_count=$(jq '.items|length' /tmp/single.json)
            byte_count=$(wc -c <"$file" | tr -d ' ')
            if [[ ${#batch_files[@]} -gt 0 ]] && (( ${#batch_files[@]} == 100 || batch_items + item_count > 1000 || batch_bytes + byte_count > 20 * 1024 * 1024 )); then
              preview_batch "$batch_no" "${batch_files[@]}"
              batch_no=$((batch_no + 1))
              batch_files=()
              batch_items=0
              batch_bytes=0
            fi
            batch_files+=("$file")
            batch_items=$((batch_items + item_count))
            batch_bytes=$((batch_bytes + byte_count))
          done
          if [[ ${#batch_files[@]} -gt 0 ]]; then preview_batch "$batch_no" "${batch_files[@]}"; fi

          python3 <<'PY'
          import json
          from pathlib import Path
          batches=[json.loads(x) for x in Path('/tmp/batches.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          errors=[dict(item,batch=b['batch']) for b in batches for item in b.get('errors',[])]
          result={
            'state':'DONE',
            'contentBaseSha':'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736',
            'destructiveApplyInvoked':False,
            'flywayEnabled':False,
            'canonicalStatus':json.load(open('/tmp/status.json',encoding='utf-8')),
            'batches':batches,
            'errorCount':len(errors),
            'errorItems':errors,
          }
          Path('/tmp/public-result.json.tmp').write_text(json.dumps(result,ensure_ascii=False),encoding='utf-8')
          Path('/tmp/public-result.json.tmp').replace('/tmp/public-result.json')
          PY
          SH
          chmod +x /tmp/question-batch-diagnostic/run-diagnostic.sh

          cat > /tmp/question-batch-diagnostic/wrapper-entrypoint.sh <<'SH'
          #!/bin/sh
          set -u
          (
            /app/run-diagnostic.sh >/tmp/compute.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && [ ! -f /tmp/public-result.json ]; then
              python3 - "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          compute=Path('/tmp/compute.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/compute.log').exists() else ''
          java=Path('/tmp/java.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/java.log').exists() else ''
          diag=('=== compute ===\n'+compute+'\n=== spring ===\n'+java)[-16000:]
          Path('/tmp/public-result.json').write_text(json.dumps({'state':'ERROR','exitCode':int(sys.argv[1]),'diagnostic':diag,'contentBaseSha':'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736','destructiveApplyInvoked':False,'flywayEnabled':False},ensure_ascii=False),encoding='utf-8')
          PY
            fi
          ) &
          exec python3 /app/result-server.py
          SH
          chmod +x /tmp/question-batch-diagnostic/wrapper-entrypoint.sh

          cat > /tmp/question-batch-diagnostic/Dockerfile <<'DOCKER'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          USER root
          COPY run-diagnostic.sh /app/run-diagnostic.sh
          COPY wrapper-entrypoint.sh /app/wrapper-entrypoint.sh
          RUN chmod +x /app/run-diagnostic.sh /app/wrapper-entrypoint.sh
          USER 10001:10001
          ENTRYPOINT ["/app/wrapper-entrypoint.sh"]
          DOCKER
          docker build --build-arg BASE_IMAGE="${BASE_IMAGE}" --tag "${DIAGNOSTIC_IMAGE}" /tmp/question-batch-diagnostic
          docker push "${DIAGNOSTIC_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json >"${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json,os,sys
          service_path,output_path=sys.argv[1],sys.argv[2]
          service=json.load(open(service_path,encoding='utf-8'))
          wanted={'DB_URL','DB_USERNAME','DB_PASSWORD','DB_MAX_POOL_SIZE','DB_MIN_IDLE','DB_CONNECTION_TIMEOUT','DB_VALIDATION_TIMEOUT'}
          required={'DB_URL','DB_USERNAME','DB_PASSWORD'}
          entries=service['spec']['template']['spec']['containers'][0].get('env',[])
          plain={
              'SPRING_PROFILES_ACTIVE':'local',
              'CSFORGE_AI_ENABLED':'false',
              'SPRING_FLYWAY_ENABLED':'false',
              'SPRING_JPA_HIBERNATE_DDL_AUTO':'validate',
              'SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE':'2MB',
              'SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE':'20MB',
              'PREVIEW_RESULT_TOKEN':os.environ['PREVIEW_RESULT_TOKEN']
          }
          secrets=[]; found=set()
          for item in entries:
              name=item.get('name')
              if name not in wanted: continue
              found.add(name)
              if 'value' in item: plain[name]=item['value']; continue
              ref=item.get('valueFrom',{}).get('secretKeyRef',{})
              if not ref.get('name') or not ref.get('key'): raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          missing=required-found
          if missing: raise SystemExit('missing DB vars: '+','.join(sorted(missing)))
          json.dump(plain,open('/tmp/diag-env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out: out.write('secrets='+','.join(secrets)+'\n')
          PY
          echo "service_account=${service_account}" >>"${GITHUB_OUTPUT}"

      - name: Deploy private diagnostic service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --image="${DIAGNOSTIC_IMAGE}" --service-account="${{ steps.prod.outputs.service_account }}" --env-vars-file=/tmp/diag-env.json --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=900 --no-cpu-throttling --cpu-boost --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then args+=(--set-secrets="${{ steps.prod.outputs.secrets }}"); fi
          gcloud "${args[@]}"
          actual_url="$(gcloud run services describe "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          test -n "${actual_url}"
          echo "url=${actual_url}" >>"${GITHUB_OUTPUT}"

      - name: Mint diagnostic service ID token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch diagnostic result
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          DIAGNOSTIC_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for _ in $(seq 1 500); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" --header "X-Preview-Token: ${PREVIEW_RESULT_TOKEN}" "${DIAGNOSTIC_URL}/result" || true)"
            if [[ "${code}" == "200" ]]; then break; fi
            if [[ "${code}" != "202" && "${code}" != "000" ]]; then cat /tmp/result.json || true; exit 1; fi
            sleep 3
          done
          test "${code}" = "200"
          jq . /tmp/result.json
          jq -e '.state=="DONE" and .contentBaseSha=="ba8c40c4907bbb35fbd662fbc1beb56f64ae7736" and .destructiveApplyInvoked==false and .flywayEnabled==false' /tmp/result.json >/dev/null

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canonical-question-batches-ba8c40c-v2
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary diagnostic service
        if: always()
        run: gcloud run services delete "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
