name: PR12 content review fix

on:
  push:
    branches: [content/java-core-foundation]
    paths: [.github/workflows/pr12-content-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/java-core-foundation
          fetch-depth: 0

      - name: Apply reviewed content fixes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path('content/java')
          lang_path = ROOT / 'language-types/questions.json'
          obj_path = ROOT / 'object-model/questions.json'
          lang = json.loads(lang_path.read_text(encoding='utf-8'))
          obj = json.loads(obj_path.read_text(encoding='utf-8'))
          questions = lang + obj
          by_key = {q['contentKey']: q for q in questions}
          assert len(by_key) == 115 == len(questions)

          def setq(key, *, prompt=None, difficulty=None, options=None, correct=None, explanation=None):
              q = by_key[key]
              if prompt is not None:
                  q['promptMarkdown'] = prompt
              if difficulty is not None:
                  q['difficulty'] = difficulty
              if options is not None:
                  assert len(options) == 4
                  q['choices'] = [
                      {'key': chr(65+i), 'content': text, 'displayOrder': i}
                      for i, text in enumerate(options)
                  ]
                  assert correct is not None
                  q['correctChoiceKey'] = chr(65 + correct)
              if explanation is not None:
                  q['explanationMarkdown'] = explanation

          # Language & Value Semantics: remove duplicated objectives and make HARD actually require reasoning.
          setq(
              'java.core.language-types.primitive-reference-values.q3',
              prompt='다음 코드 실행 후 `source[0]`의 값은? `int[] source = {1}; int[] alias = source; alias[0] = 7;`',
              difficulty='MEDIUM',
              options=['1', '7', '0', '컴파일 오류'],
              correct=1,
              explanation='배열 변수 대입은 배열 object를 복제하지 않고 참조 값을 복사한다. source와 alias가 같은 배열을 가리키므로 alias를 통한 원소 변경을 source에서도 7로 관찰한다.'
          )
          setq(
              'java.core.language-types.primitive-reference-values.q5',
              prompt='다음 코드의 출력은? `StringBuilder a = new StringBuilder("x"); StringBuilder b = a; b.append("y"); b = new StringBuilder("z"); System.out.println(a + ":" + b);`',
              difficulty='HARD',
              options=['x:z', 'xy:xy', 'xy:z', 'z:z'],
              correct=2,
              explanation='처음에는 a와 b가 같은 builder를 가리켜 append가 a에도 보인다. 이후 b의 재대입은 b가 가진 참조 값만 바꾸므로 a는 원래 object의 "xy", b는 새 object의 "z"를 가리킨다.'
          )
          setq('java.core.language-types.primitive-reference-values.q6', difficulty='MEDIUM')

          setq('java.core.language-types.variables-scope-definite-assignment.q5', difficulty='MEDIUM')
          setq(
              'java.core.language-types.variables-scope-definite-assignment.q6',
              prompt='다음 코드에 대한 설명으로 옳은 것은? `int value; if (ready) { value = 1; } else { throw new IllegalStateException(); } System.out.println(value);`',
              difficulty='HARD',
              options=['ready가 false인 경로에서 value가 미대입이므로 컴파일되지 않는다', '컴파일되며 ready가 true이면 1을 출력하고 false이면 출력 전에 예외로 종료한다', 'value는 자동으로 0으로 초기화되므로 항상 컴파일된다', 'throw가 있는 분기는 definite assignment 분석에서 무조건 true 분기로 취급된다'],
              correct=1,
              explanation='println까지 정상적으로 도달하는 경로는 ready가 true인 경우뿐이고 그 경로에서는 value가 대입되어 있다. false 경로는 throw로 정상 완료하지 않으므로 사용 시점의 definite assignment를 깨지 않는다.'
          )

          setq(
              'java.core.language-types.numeric-conversion-overflow.q3',
              prompt='다음 설명으로 가장 정확한 것은? `int big = 1_234_567_890; float approx = big;`',
              difficulty='MEDIUM',
              options=['widening이므로 approx는 반드시 모든 비트를 정확히 보존한다', 'int에서 float은 narrowing이므로 명시적 cast 없이는 컴파일되지 않는다', 'int에서 float은 widening이라 cast 없이 가능하지만 일부 하위 비트가 반올림되어 precision을 잃을 수 있다', 'precision을 잃으면 반드시 ArithmeticException이 발생한다'],
              correct=2,
              explanation='int→float은 JLS가 정의한 widening primitive conversion이지만 exact widening은 아니다. float 표현 정밀도 때문에 일부 least-significant bits를 잃고 반올림될 수 있으며 런타임 예외는 발생하지 않는다.'
          )

          setq('java.core.language-types.boxing-unboxing-wrapper.q6', difficulty='MEDIUM')
          setq('java.core.language-types.pass-by-value.q5', difficulty='MEDIUM')
          setq(
              'java.core.language-types.pass-by-value.q4',
              options=[
                  'String이 immutable이기 때문에 매개변수 변수의 재대입만 호출자에 반영되지 않는다',
                  '참조형만 pass-by-reference이지만 String에 한해서 예외가 적용된다',
                  'a와 b는 호출자 변수 자체가 아니라 복사된 참조 값을 담는 별도 매개변수 변수이므로 둘을 재대입해도 호출자 binding은 바뀌지 않는다',
                  'swap 안에서 임시 변수를 사용하면 호출자 변수도 함께 교환된다'
              ],
              correct=2,
              explanation='Java는 참조형도 참조 값을 value로 전달한다. a와 b는 호출자의 변수 자체가 아니므로 swap 내부의 재대입은 매개변수 binding만 바꾸고 호출자 binding은 바꾸지 못한다.'
          )

          setq('java.core.language-types.arrays-covariance-runtime-check.q4', difficulty='MEDIUM')
          setq(
              'java.core.language-types.arrays-covariance-runtime-check.q5',
              prompt='다음 코드의 실행 결과로 가장 정확한 것은? `Object[] values = new String[2]; values[0] = "A"; Object candidate = Integer.valueOf(1); values[1] = candidate;`',
              difficulty='HARD',
              options=['첫 저장부터 컴파일 오류가 난다', '두 저장 모두 성공하고 Integer가 String으로 변환된다', '첫 저장은 성공하지만 두 번째 저장에서 ArrayStoreException이 발생하며 values[0]의 "A"는 유지된다', '두 번째 저장에서 ClassCastException이 발생하고 배열 전체가 초기화된다'],
              correct=2,
              explanation='정적 타입 Object[] 때문에 두 대입문은 컴파일된다. 실제 배열 object는 String[]이므로 "A" 저장은 성공하지만 Integer 저장 시 runtime store check가 실패해 ArrayStoreException이 발생한다. 이미 성공한 첫 원소 저장은 되돌려지지 않는다.'
          )

          setq(
              'java.core.language-types.final-reference-and-immutability.q5',
              prompt='다음 constructor는 컴파일되는가? `class Token { final int code; Token(boolean valid) { if (valid) code = 200; else throw new IllegalArgumentException(); } }`',
              difficulty='HARD',
              options=['컴파일되지 않는다. final field는 선언과 동시에만 대입할 수 있다', '컴파일되지 않는다. else 경로에서 code가 대입되지 않는다', '컴파일된다. 정상적으로 constructor를 완료하는 경로에서는 code가 정확히 한 번 대입되고 다른 경로는 예외로 완료한다', '컴파일되지만 valid가 false이면 code가 자동으로 0인 Token이 반환된다'],
              correct=2,
              explanation='blank final field는 constructor에서 대입할 수 있다. 정상 완료하는 valid=true 경로에서는 code가 정확히 한 번 대입되고, false 경로는 예외로 종료되어 미초기화 Token을 반환하지 않는다.'
          )

          setq('java.core.language-types.string-immutability-equality.q4', difficulty='MEDIUM')
          setq('java.core.language-types.string-immutability-equality.q5', difficulty='MEDIUM')
          setq(
              'java.core.language-types.string-immutability-equality.q6',
              prompt='다음 출력으로 옳은 것은? `String a = "ab"; String b = new String("ab"); String c = b; b = b.toUpperCase(); System.out.println(a.equals(c) + ":" + b.equals(c) + ":" + (b == c));`',
              difficulty='HARD',
              options=['true:true:true', 'true:false:false', 'false:false:false', 'true:true:false'],
              correct=1,
              explanation='c는 원래 b가 가리키던 내용 "ab"의 String object를 계속 가리킨다. a와 c는 내용이 같아 equals가 true다. b.toUpperCase() 결과는 "AB"이므로 b.equals(c)는 false이고 b와 c의 identity도 다르다.'
          )

          setq(
              'java.core.language-types.string-pool-interning.q4',
              prompt='다음 코드 뒤의 비교 결과로 옳은 것은? `String a = "ja" + "va"; String part = "ja"; String b = part + "va";`',
              difficulty='HARD',
              options=['`a == "java"`와 `b == "java"`가 모두 true다', '`a == "java"`는 true이고 `b == "java"`는 false다', '`a == "java"`는 false이고 `b == "java"`는 true다', '두 비교는 모두 컴파일 오류다'],
              correct=1,
              explanation='"ja" + "va"는 compile-time constant expression이라 interned literal "java"와 같은 reference가 된다. part가 변수인 b의 concatenation은 runtime에 평가되므로 내용은 같아도 literal과 같은 identity를 보장하지 않는다. 내용 비교에는 equals를 사용한다.'
          )

          setq(
              'java.core.language-types.stringbuilder-mutable-text.q4',
              prompt='다음 출력은? `StringBuilder a = new StringBuilder("x"); StringBuilder b = a; String snapshot = a.toString(); b.append("y"); b = new StringBuilder("z"); System.out.println(a + ":" + snapshot + ":" + b);`',
              difficulty='HARD',
              options=['xy:x:z', 'x:xy:z', 'xy:xy:z', 'z:x:z'],
              correct=0,
              explanation='a와 b가 같은 builder를 가리킬 때 append가 원래 builder를 "xy"로 바꾼다. snapshot은 append 전에 만든 immutable String "x"로 유지된다. 마지막 b 재대입은 b만 새 "z" builder를 가리키게 한다.'
          )
          setq(
              'java.core.language-types.stringbuilder-mutable-text.q5',
              difficulty='MEDIUM',
              options=[
                  'StringBuilder의 각 append가 원자적이므로 추가 동기화 없이도 항상 안전하다',
                  '공유 mutable buffer이므로 thread confinement, 외부 동기화 또는 다른 동시성 설계가 필요하다',
                  '여러 thread가 접근하면 JVM이 자동으로 StringBuffer로 교체한다',
                  '문제가 되는 것은 읽기뿐이며 여러 thread의 append는 순서까지 보장된다'
              ],
              correct=1,
              explanation='StringBuilder는 thread-safe한 공유 버퍼 계약을 제공하지 않는다. 한 thread에 가두는 것이 가장 단순하고, 정말 공유해야 한다면 외부 동기화나 요구에 맞는 다른 설계를 선택해야 한다.'
          )

          # Object model: strengthen scenarios, remove duplicate constructor/dynamic-dispatch questions.
          setq(
              'java.core.object-model.class-object-constructor.q3',
              explanation='현재 선언된 constructor는 User()뿐이다. `new User("mina")`에 필요한 User(String) constructor가 없으므로 해당 호출이 컴파일되지 않는다.'
          )
          setq(
              'java.core.object-model.static-vs-instance-members.q5',
              prompt='다음 출력은? `class C { static int s = 1; int i = s++; void inc() { i++; s++; } } C a = new C(); C b = new C(); a.inc(); System.out.println(a.i + ":" + b.i + ":" + C.s);`',
              difficulty='HARD',
              options=['1:2:3', '2:2:4', '2:3:4', '2:2:3'],
              correct=1,
              explanation='a 생성 시 i=1 후 s=2, b 생성 시 i=2 후 s=3이다. a.inc()가 a.i를 2로, 공유 static s를 4로 만든다. 따라서 2:2:4가 출력된다.'
          )

          setq(
              'java.core.object-model.initialization-order-constructor-chaining.q4',
              prompt='Java SE 25의 flexible constructor body에서 `super(...)` 또는 `this(...)` 앞의 early construction context에 대한 설명으로 옳은 것은?',
              difficulty='MEDIUM',
              options=[
                  '현재 instance의 field를 읽고 instance method를 호출하는 것도 모두 허용된다',
                  '어떤 statement도 explicit constructor invocation 앞에 둘 수 없다',
                  '인자 검증 같은 statement를 둘 수 있고, 현재 instance field를 assignment로 초기화하는 것도 허용되지만 그 field를 읽거나 instance method를 호출하는 데에는 제한이 있다',
                  '`this(...)`와 `super(...)`를 한 constructor에서 연속으로 둘 다 호출할 수 있다'
              ],
              correct=2,
              explanation='Java SE 25 flexible constructor bodies는 explicit constructor invocation 앞의 prologue를 허용한다. early construction context에서는 현재 instance를 읽는 접근과 instance method 호출 등이 제한되지만, assignment operator로 현재 instance field를 초기화하는 것은 허용된다.'
          )
          setq(
              'java.core.object-model.initialization-order-constructor-chaining.q6',
              prompt='다음 코드에서 처음 `new Child()`를 실행할 때 출력 순서는? `class Parent { static { System.out.print("S"); } { System.out.print("I"); } Parent() { System.out.print("P"); } } class Child extends Parent { static { System.out.print("T"); } { System.out.print("J"); } Child() { System.out.print("C"); } }`',
              difficulty='HARD',
              options=['STIPJC', 'SITPJC', 'TSIPJC', 'STJPIC'],
              correct=0,
              explanation='처음 Child를 active use하면 superclass Parent의 class initialization(S), Child의 class initialization(T)이 순서대로 진행된다. 인스턴스 생성에서는 Parent instance initializer(I)와 constructor(P), 이어 Child instance initializer(J)와 constructor(C)가 실행되어 STIPJC가 된다.'
          )

          setq(
              'java.core.object-model.encapsulation-invariants.q6',
              prompt='`private` field를 사용하는 설계에 대한 설명으로 가장 정확한 것은?',
              difficulty='MEDIUM',
              options=[
                  'private이면 객체의 모든 상태 변경 가능성이 사라져 자동으로 immutable이 된다',
                  'private은 Java의 member 접근 경계를 제공하지만, 객체가 좋은 invariant를 갖는지는 공개된 생성·행동 API 설계까지 함께 봐야 한다',
                  'private field는 reflection이나 serialization 같은 런타임 메커니즘과 무관하게 절대 관찰될 수 없다',
                  'private을 쓰면 별도의 입력 검증이나 상태 전이 메서드는 필요 없다'
              ],
              correct=1,
              explanation='private은 직접 member 접근을 제한하는 언어 경계다. 하지만 무조건적인 setter를 공개하면 invariant가 여전히 깨질 수 있으므로 생성 규칙과 의도 중심 상태 전이까지 함께 설계해야 한다.'
          )

          setq(
              'java.core.object-model.abstraction-responsibility.q4',
              prompt='`CheckoutService`가 특정 결제사 SDK를 직접 사용 중이다. 결제사는 교체될 수 있고 애플리케이션은 승인·취소만 필요하며 SDK의 세부 메서드는 외부 경계에 숨기고 싶다. 가장 적절한 설계는?',
              difficulty='HARD',
              options=[
                  '도메인과 서비스 전반이 VendorSdk 타입을 직접 사용하게 해 변경을 한 번에 반영한다',
                  '애플리케이션이 필요한 `PaymentGateway.authorize/cancel` 계약을 두고 Vendor SDK는 adapter 구현 안에 둔다',
                  'Vendor SDK의 모든 메서드를 동일하게 복사한 거대한 interface를 만들어 추상화라고 부른다',
                  '타입 결합을 없애기 위해 모든 요청·응답을 Object와 Map으로 바꾼다'
              ],
              correct=1,
              explanation='좋은 추상화는 외부 SDK 전체를 복제하는 것이 아니라 애플리케이션이 실제로 필요로 하는 책임과 계약을 경계에 둔다. Vendor 세부는 adapter가 맡으면 교체와 테스트의 영향 범위를 줄일 수 있다.'
          )

          setq(
              'java.core.object-model.composition-collaboration.q6',
              prompt='composition을 적용할 때 오히려 구조를 단순하게 유지해야 할 상황은?',
              difficulty='MEDIUM',
              options=[
                  '실제로 바뀌는 정책이 여러 개이고 런타임 교체가 필요한 경우',
                  '외부 시스템을 테스트 대역으로 교체해야 하는 경우',
                  '변경 축도 대체 구현도 없는 짧고 안정적인 내부 계산 하나를 위해 interface·wrapper 계층을 여러 개 추가하려는 경우',
                  '하나의 객체가 명확한 collaborator 계약을 통해 다른 책임을 위임하는 경우'
              ],
              correct=2,
              explanation='composition은 실제 variation과 협력 경계를 분리할 때 가치가 있다. 대체 가능성이나 변경 이유가 없는 단순 동작까지 여러 interface와 wrapper로 나누면 읽기와 유지보수 비용만 커질 수 있다.'
          )

          setq('java.core.object-model.polymorphism-dynamic-dispatch.q5', difficulty='MEDIUM')
          setq(
              'java.core.object-model.polymorphism-dynamic-dispatch.q6',
              prompt='다음 출력은? `class A { String value = "A"; String label() { return value; } } class B extends A { String value = "B"; @Override String label() { return value; } } A x = new B(); System.out.println(x.value + x.label());`',
              difficulty='HARD',
              options=['AA', 'AB', 'BA', 'BB'],
              correct=1,
              explanation='field 접근 x.value는 참조의 정적 타입 A에 의해 A.value를 읽어 "A"가 된다. instance method label()은 실제 object B로 dynamic dispatch되고 B.label은 B.value인 "B"를 반환하므로 AB가 출력된다.'
          )

          setq(
              'java.core.object-model.reference-casting-instanceof.q5',
              prompt='다음 코드가 출력하는 값은? `Object value = "java"; if (value instanceof String text) { value = Integer.valueOf(1); System.out.println(text.length()); }`',
              difficulty='HARD',
              options=['1', '4', 'ClassCastException', '컴파일 오류'],
              correct=1,
              explanation='pattern variable text는 instanceof가 성공했을 때 원래 String reference를 별도로 바인딩한다. 이후 value 변수를 Integer reference로 재대입해도 text의 binding은 바뀌지 않으므로 "java"의 길이 4를 출력한다.'
          )

          setq(
              'java.core.object-model.interface-vs-abstract-class.q4',
              prompt='`Job` 계열은 공통 id, retryCount, constructor 검증과 실행 template을 공유한다. 한편 Job과 무관한 `HttpClient`도 `Retryable` capability를 제공해야 한다. 가장 자연스러운 조합은?',
              difficulty='HARD',
              options=[
                  'Job 공통 상태·template은 abstract Job에 두고, 독립 capability는 Retryable interface로 분리한다',
                  'Job과 HttpClient가 모두 하나의 거대한 abstract superclass를 상속한다',
                  '공통 상태가 필요해도 모든 것을 interface static field에 저장한다',
                  '다중 class 상속으로 JobBase와 RetryBase를 동시에 상속한다'
              ],
              correct=0,
              explanation='같은 계층이 공유하는 state·constructor invariant·template은 abstract class가 자연스럽고, 서로 무관한 타입에도 붙는 capability는 interface가 자연스럽다. Java class는 여러 class를 직접 상속할 수 없다.'
