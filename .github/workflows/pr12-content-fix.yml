          # Clarify List.copyOf terminology in the question too.
          setq(
              'java.core.object-model.immutability-defensive-copy.q3',
              options=[
                  '전자는 backing list의 변경을 볼 수 있는 unmodifiable view이고, 후자는 입력 collection의 이후 구조 변경을 반영하지 않는 unmodifiable snapshot을 제공한다',
                  '둘 다 원소 object까지 재귀적으로 복사하는 deep immutable copy다',
                  'List.copyOf로 만든 list는 add/remove가 가능하지만 unmodifiableList는 불가능하다',
                  '둘의 차이는 오직 generic type inference뿐이며 mutation 계약은 같다'
              ],
              correct=0,
              explanation='Collections.unmodifiableList는 backing list에 대한 unmodifiable view라 원본 구조 변경이 보일 수 있다. List.copyOf는 입력 collection의 이후 구조 변경을 반영하지 않는 unmodifiable list를 반환한다. 다만 원소 object까지 deep copy하거나 immutable하게 만들지는 않는다.'
          )

          # Regrade ordinary one-step HARD questions, while preserving >=1 genuine HARD per Concept.
          for key in [
              'java.core.language-types.boxing-unboxing-wrapper.q6',
              'java.core.language-types.pass-by-value.q5',
              'java.core.language-types.arrays-covariance-runtime-check.q4',
              'java.core.language-types.stringbuilder-mutable-text.q5',
              'java.core.object-model.encapsulation-invariants.q6',
              'java.core.object-model.composition-collaboration.q6',
              'java.core.object-model.polymorphism-dynamic-dispatch.q5',
          ]:
              by_key[key]['difficulty'] = 'MEDIUM'

          # Deterministically remove answer-position bias without imposing an exact quota.
          # The target position comes from SHA-256(contentKey), not a hand-set A/B/C/D cycle.
          for q in questions:
              choices = sorted(q['choices'], key=lambda c: c['displayOrder'])
              correct_content = next(c['content'] for c in choices if c['key'] == q['correctChoiceKey'])
              wrong = [c['content'] for c in choices if c['key'] != q['correctChoiceKey']]
              target = hashlib.sha256(q['contentKey'].encode()).digest()[0] % 4
              ordered = wrong[:]
              ordered.insert(target, correct_content)
              q['choices'] = [
                  {'key': chr(65+i), 'content': text, 'displayOrder': i}
                  for i, text in enumerate(ordered)
              ]
              q['correctChoiceKey'] = chr(65 + target)

          # Markdown factual corrections.
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert old in text, f'missing expected text in {path}: {old[:60]}'
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              ROOT / 'language-types/numeric-conversion-overflow.md',
              '큰 타입으로 넓히는 변환은 대체로 값을 보존하지만, 작은 타입으로 좁히거나 제한된\n정수 범위를 넘으면 결과를 그대로 믿을 수 없다.',
              'Java가 widening으로 분류한 변환은 명시적 cast 없이 허용되지만, "widening = 항상 정확한 값 보존"은 아니다.\n특히 `int -> float`, `long -> float`, `long -> double`은 magnitude를 표현할 수 있어도 일부 정밀도를 잃을 수 있다.\n작은 타입으로 좁히거나 제한된 정수 범위를 넘는 경우에는 별도의 정보 손실도 생길 수 있다.'
          )
          replace(
              ROOT / 'language-types/numeric-conversion-overflow.md',
              '`widening primitive conversion`은 더 넓은 표현 범위의 타입으로 바꾸는 변환이고, `narrowing`\n은 명시적 cast가 필요한 경우가 많다. 정수 산술은 피연산자를 `int` 이상으로 승격해 계산하는\n규칙도 있으므로 `short`나 `byte`끼리의 계산 결과가 다시 그 타입으로 나오지 않는다.',
              '`widening primitive conversion`은 JLS가 정한 암시적 primitive 변환 범주다. 정수형끼리의 widening처럼\n정확히 값이 보존되는 경우도 있지만, `int -> float`, `long -> float`, `long -> double`은 floating-point\n정밀도 때문에 least-significant bits가 반올림될 수 있다. `narrowing`은 명시적 cast가 필요한 경우가 많다.\n또 정수 산술은 피연산자를 `int` 이상으로 승격해 계산하므로 `short`나 `byte`끼리의 결과도 보통 `int`다.'
          )
          replace(
              ROOT / 'language-types/numeric-conversion-overflow.md',
              'long safe = 2_000_000_000L + 2_000_000_000L;\nbyte wrapped = (byte) 130;                  // narrowing 후 표현 범위에 맞춘 결과',
              'long safe = 2_000_000_000L + 2_000_000_000L;\nint big = 1_234_567_890;\nfloat approx = big;                         // widening이지만 일부 precision 손실 가능\nbyte wrapped = (byte) 130;                  // narrowing 후 표현 범위에 맞춘 결과'
          )
          replace(
              ROOT / 'language-types/numeric-conversion-overflow.md',
              '- 모든 숫자 변환이 자동 widening인 것은 아니다.\n- narrowing cast는 overflow를 예외로 알려 주는 검증이 아니다.',
              '- widening primitive conversion이라고 해서 모든 경우에 숫자 값이 bit 단위까지 정확히 보존되는 것은 아니다.\n- 모든 숫자 변환이 자동 widening인 것은 아니다.\n- narrowing cast는 overflow를 예외로 알려 주는 검증이 아니다.'
          )

          replace(
              ROOT / 'object-model/class-object-constructor.md',
              'class는 같은 종류의 상태와 행동을 설명하는 설계도이고, object는 그 설계도로 실제 만들어진\n하나의 값이다.',
              'class는 같은 종류의 상태와 행동을 설명하는 타입이고, object는 그 class를 바탕으로 실행 중 동적으로 생성된\nclass instance(또는 배열)다. object를 가리키는 reference value와 object 자체는 구분한다.'
          )

          replace(
              ROOT / 'object-model/initialization-order-constructor-chaining.md',
              '진행된다. `this(...)`는 같은 class의 다른 constructor로 위임한다. Java SE 25에서는 제한된\nprologue를 constructor invocation 앞에 둘 수 있지만, 그 구간에서는 `this`와 instance field·method\n접근이 제한된다. 한 constructor에서 `this(...)`와 `super(...)`를 동시에 호출할 수는 없다.',
              '진행된다. `this(...)`는 같은 class의 다른 constructor로 위임한다. Java SE 25의 flexible constructor bodies는\nexplicit constructor invocation 앞에 prologue를 둘 수 있게 한다. 이 early construction context에서는 현재\ninstance field를 읽거나 instance method를 호출하는 등의 접근은 제한되지만, assignment operator로 현재\ninstance field를 초기화하는 것은 허용된다. 한 constructor에서 `this(...)`와 `super(...)`를 동시에 호출할 수는 없다.'
          )
          # Add current Oracle Java 25 guide as an explicit version-sensitive reference.
          p = ROOT / 'object-model/initialization-order-constructor-chaining.md'
          text = p.read_text(encoding='utf-8')
          marker = '    relationNote: constructor declaration와 constructor invocation 확인\n---'
          assert marker in text
          text = text.replace(marker, '    relationNote: constructor declaration와 constructor invocation 확인\n  - url: "https://docs.oracle.com/en/java/javase/25/language/flexible-constructor-bodies.html"\n    title: "Java SE 25 Flexible Constructor Bodies"\n    referenceType: OFFICIAL\n    language: en\n    displayOrder: 3\n    relationNote: Java 25 early construction context와 super 이전 field initialization 규칙 확인\n---')
          p.write_text(text, encoding='utf-8')

          replace(
              ROOT / 'object-model/immutability-defensive-copy.md',
              '`Collections.unmodifiableList` 같은 view는 원본이 바뀌면 관찰 결과도 바뀔 수 있지만 `List.copyOf`\n는 입력을 복사한 불변 list를 제공한다. 복사는 얕은 복사일 수 있으므로 list 안의 mutable 원소',
              '`Collections.unmodifiableList` 같은 view는 backing list가 바뀌면 관찰 결과도 바뀔 수 있지만 `List.copyOf`\n는 입력 collection의 이후 구조 변경을 반영하지 않는 unmodifiable list를 제공한다. 이것이 원소까지\nimmutable하게 만든다는 뜻은 아니다. 복사는 얕은 복사일 수 있으므로 list 안의 mutable 원소'
          )
          replace(
              ROOT / 'object-model/immutability-defensive-copy.md',
              'return items;                    // immutable list이므로 안전한 공개',
              'return items;                    // unmodifiable snapshot이라 list 구조 변경 API는 노출하지 않음'
          )

          # Add one verified Korean company engineering source where it supports OOP design guidance.
          company_url = 'https://techblog.woowahan.com/2644/'
          company_title = '우아한형제들 기술블로그: 병아리 개발자의 걸음마 한 발짝'
          for rel, note in [
              ('object-model/encapsulation-invariants.md', 'getter/setter와 캡슐화에 대한 실무 코드리뷰 사례 보충'),
              ('object-model/abstraction-responsibility.md', '객체 책임과 객체지향 코드리뷰 사례 보충'),
              ('object-model/inheritance-is-a.md', '구현 재사용 목적 상속의 위험과 합성 선택 사례 보충'),
              ('object-model/composition-collaboration.md', '상속보다 합성을 선택하는 실무 설계 맥락 보충'),
          ]:
              p = ROOT / rel
              text = p.read_text(encoding='utf-8')
              if company_url in text:
                  continue
              idx = text.index('\n---\n# ')
              block = f'\n  - url: "{company_url}"\n    title: "{company_title}"\n    referenceType: COMPANY_TECH_BLOG\n    language: ko\n    displayOrder: 3\n    relationNote: {note}'
              text = text[:idx] + block + text[idx:]
              p.write_text(text, encoding='utf-8')

          # Write questions after transformations.
          lang_path.write_text(json.dumps(lang, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          obj_path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Canonical question validation.
          questions = lang + obj
          assert len(questions) == 115
          assert len({q['contentKey'] for q in questions}) == 115
          prompts = [q['promptMarkdown'] for q in questions]
          assert len(prompts) == len(set(prompts)), 'duplicate prompts remain'
          difficulty = Counter(q['difficulty'] for q in questions)
          answers = Counter(q['correctChoiceKey'] for q in questions)
          by_concept = defaultdict(Counter)
          for q in questions:
              assert q['questionType'] == 'MULTIPLE_CHOICE'
              assert q['status'] == 'PUBLISHED'
              assert len(q['conceptKeys']) == 1
              assert len(q['choices']) == 4
              assert {c['key'] for c in q['choices']} == {'A','B','C','D'}
              assert [c['displayOrder'] for c in q['choices']] == [0,1,2,3]
              assert q['correctChoiceKey'] in {'A','B','C','D'}
              by_concept[q['conceptKeys'][0]][q['difficulty']] += 1
          assert len(by_concept) == 22
          for concept, counts in by_concept.items():
              for d in ('EASY','MEDIUM','HARD'):
                  assert counts[d] >= 1, (concept, counts)
          assert all(15 <= answers[k] <= 40 for k in 'ABCD'), answers
          print('questions=', len(questions))
          print('difficulty=', dict(difficulty))
          print('answers=', dict(answers))
          for concept in sorted(by_concept):
              print(concept, dict(by_concept[concept]))
          PY

