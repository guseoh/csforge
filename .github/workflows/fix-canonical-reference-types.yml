name: Fix canonical reference types

on:
  push:
    branches:
      - content/validate-five-areas

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/validate-five-areas

      - name: Align remaining reference types
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('content/backend-engineering/retry/transient-permanent.md'):
                  ('referenceType: REFERENCE', 'referenceType: COMPANY_TECH_BLOG'),
              Path('content/backend-engineering/testing-recovery/tradeoffs.md'):
                  ('referenceType: ARTICLE', 'referenceType: OTHER'),
          }

          for path, (before, after) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if before in text:
                  path.write_text(text.replace(before, after), encoding='utf-8')
          PY

      - name: Commit only when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/backend-engineering/retry/transient-permanent.md content/backend-engineering/testing-recovery/tradeoffs.md
          if git diff --cached --quiet; then
            echo "Reference types already aligned"
          else
            git commit -m "fix: align remaining canonical reference types"
            git push
          fi
