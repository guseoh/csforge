name: One-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-stale-branches-once.yml

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete verified stale branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "chore/bootstrap-local-skeleton"
            "ci/cloud-run-backend-deploy"
            "cloud/single-user-auth-deployment"
            "codex/ci-update-checkout-v7"
            "codex/fix-oauth-success-redirect"
            "content/backend-engineering-learning-v2"
            "content/backend-question-final-polish"
            "content/cache-learning-v2"
            "content/computer-architecture-learning-v2"
            "content/curriculum-wave-a-core-cs-final"
            "content/database-learning-v2"
            "content/distributed-systems-learning-v2"
            "content/dsa-learning-v2"
            "content/final-learning-content-review"
            "content/infrastructure-cloud-learning-v2"
            "content/java-learning-notes-rebaseline"
            "content/java-learning-v2"
            "content/java-question-v2-batch-01"
            "content/java-question-v2-batch-02"
            "content/java-question-v2-batch-03"
            "content/java-question-v2-batch-04"
            "content/java-question-v2-batch-05"
            "content/java-question-v2-batch-06"
            "content/java-question-v2-polish"
            "content/java-question-v2-review"
            "content/learning-area-completion"
            "content/learning-experience-quality"
            "content/learning-v2-integration-validation"
            "content/messaging-async-learning-v2"
            "content/network-http-learning-v2"
            "content/network-http-question-v2-descriptive"
            "content/network-http-question-v2-mc"
            "content/network-http-question-v2-scenario"
            "content/operating-systems-learning-v2"
            "content/performance-observability-operations-learning-v2"
            "content/question-explanation-v2-batch-01"
            "content/question-v2-integration"
            "content/remaining-question-v2-mc-polish"
            "content/review-batch-01-database-spring-backend"
            "content/review-operating-systems"
            "content/review-remaining-learning-areas"
            "content/risk-based-deep-review"
            "content/security-learning-v2"
            "content/spring-learning-v2"
            "content/system-design-learning-v2"
            "content/validate-five-areas"
            "design/independent-visual-direction"
            "docs/design-contract"
            "feat/ai-wrong-answer-analysis"
            "feat/canonical-content-bootstrap"
            "feat/content-import"
            "feat/daily-use-convenience"
            "feat/dashboard"
            "feat/desktop-ui-ux-closure"
            "feat/issue-37-single-host-deploy"
            "feat/jenkins-cicd-lab"
            "feat/learning-foundation"
            "feat/question-quiz-core"
            "feat/search"
            "feat/v1-end-to-end-hardening"
            "feat/wrong-notes-review"
            "fix/cloud-oauth-redirect-config"
            "fix/import-attempted-canonical-updates"
            "fix/import-attempted-choice-content-updates"
            "fix/randomize-quiz-selection"
            "fix/wrong-note-choice-content"
            "fix/wrong-note-cloud-ai-copy"
            "fix/wrong-note-cloud-ai-copy-temp"
            "ops/bootstrap-ephemeral-secret-path"
            "ops/bootstrap-job-script"
            "ops/bootstrap-latest-main-image"
            "ops/bootstrap-readiness-diagnostics"
            "ops/bootstrap-via-private-service"
            "ops/delete-stale-branches"
            "ops/diagnose-production-canonical-bootstrap"
            "ops/production-canonical-bootstrap"
            "ops/remove-one-time-bootstrap-workflow"
            "ops/retry-production-canonical-bootstrap"
            "refactor/code-cleanup-gate"
            "refactor/postgres-search-runtime-cleanup"
            "refactor/v1-codebase-maintainability"
            "ui/design-system-followups"
            "ui/independent-dashboard-learning"
            "ui/learning-experience-correction"
            "validation/backend-question-final-polish"
            "validation/java-question-v2-batch-02"
            "validation/java-question-v2-batch-03"
            "validation/java-question-v2-batch-04"
          )

          failures=()
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              echo "Refusing to delete main." >&2
              exit 2
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              if ! git push origin --delete "${branch}"; then
                failures+=("${branch}")
              fi
            else
              echo "Already absent: ${branch}"
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf 'Failed to delete: %s\n' "${failures[*]}" >&2
            exit 3
          fi

          echo "Verified stale branch cleanup completed."

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-stale-branches-once.yml
          git commit -m "chore: remove one-time stale branch cleanup workflow"
          git push origin HEAD:main
