name: Java review export temp

on:
  push:
    branches: [codex/content-java-quality]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package Java review sources
        shell: bash
        run: |
          mkdir -p java-review-export/content/curriculum
          cp -R content/java java-review-export/content/
          cp content/curriculum/java.yaml java-review-export/content/curriculum/java.yaml
          cp content/AGENTS.md java-review-export/content/AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: java-review-export
          path: java-review-export
          if-no-files-found: error
