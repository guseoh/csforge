name: Validate Pass 2 Canonical Import

on:
  push:
    branches:
      - content/patch-risk-review-java

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/risk-based-deep-review
          fetch-depth: 0

      - name: Guard expected review head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a34fc6b62ddba3164889c75a171c6f5eeb061f78"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore proven fifteen-area validation test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/validate-fifteen-areas
          mkdir -p backend/src/test/java/com/guseoh/csforge/importcontent
          git show dd9f9ff541a47b94b98f2c432361f1762c6ea28e:backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java \
            > backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java
          test -s backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java

      - name: Run parser regression
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test --tests com.guseoh.csforge.importcontent.ContentImportParserTest

      - name: Run canonical fifteen-area import validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test --tests com.guseoh.csforge.importcontent.CanonicalFifteenAreaImportValidationTest --info 2>&1 | tee pass2-import-validation.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-final-import-validation
          path: |
            backend/pass2-import-validation.log
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
          if-no-files-found: warn
