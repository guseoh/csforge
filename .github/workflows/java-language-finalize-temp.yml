name: Java language finalize temp

on:
  push:
    branches: [codex/content-java-quality]
    paths: [.github/workflows/java-language-finalize-temp.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct reviewed finalizer
        shell: bash
        run: |
          cat .tmp/java-finalizer/part-*.py > /tmp/finalize_java_language.py
          echo '49c4f21a31a132ae15d73c9ee7596f7587c90a32c78f687dfa014d9c2bac5641  /tmp/finalize_java_language.py' | sha256sum -c -
          python -m py_compile /tmp/finalize_java_language.py
      - name: Snapshot canonical identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          text_keys={'promptMarkdown','content','rationaleMarkdown','explanationMarkdown','modelAnswer','title','description','summary'}
          def keep(o):
              if isinstance(o,dict): return {k:keep(v) for k,v in o.items() if k not in text_keys}
              if isinstance(o,list): return [keep(v) for v in o]
              return o
          payload={}
          for p in sorted(Path('content/java').rglob('*.json')):
              payload[str(p)]=keep(json.loads(p.read_text(encoding='utf-8')))
          raw=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          Path('/tmp/java-identity.sha256').write_text(hashlib.sha256(raw).hexdigest())
          PY
      - name: Apply reviewed Java language corrections
        shell: bash
        run: python /tmp/finalize_java_language.py
      - name: Validate result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          text_keys={'promptMarkdown','content','rationaleMarkdown','explanationMarkdown','modelAnswer','title','description','summary'}
          def keep(o):
              if isinstance(o,dict): return {k:keep(v) for k,v in o.items() if k not in text_keys}
              if isinstance(o,list): return [keep(v) for v in o]
              return o
          payload={}
          for p in sorted(Path('content/java').rglob('*.json')):
              data=json.loads(p.read_text(encoding='utf-8'))
              payload[str(p)]=keep(data)
          raw=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          actual=hashlib.sha256(raw).hexdigest()
          expected=Path('/tmp/java-identity.sha256').read_text().strip()
          assert actual==expected, (expected,actual)
          assert len(json.loads(Path('content/java/topics.json').read_text(encoding='utf-8'))) == 18
          assert sum(1 for p in Path('content/java').rglob('*.md')) == 145
          assert sum(len(json.loads(p.read_text(encoding='utf-8'))) for p in Path('content/java').rglob('questions.json')) == 841
          for p in Path('content/java').rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              if not text.startswith('---'): continue
              parts=text.split('---',2)
              if len(parts)<3: continue
              fm,body=parts[1],parts[2]
              tm=re.search(r'(?m)^title:\s*(?:"([^"]*)"|(.+))$',fm)
              hm=re.search(r'(?m)^#\s+(.+)$',body)
              if tm and hm:
                  title=tm.group(1) if tm.group(1) is not None else tm.group(2).strip()
                  assert title==hm.group(1).strip(), (p,title,hm.group(1).strip())
          print('Java identity/count/title validation: PASS')
          PY
          git diff --check
          test -z "$(git diff --name-only | grep -Ev '^(content/java/|content/curriculum/java.yaml$)')"
      - name: Commit clean content-only result
        shell: bash
        run: |
          rm -rf .tmp/java-finalizer .github/workflows/java-language-finalize-temp.yml
          git config user.name guseoh
          git config user.email 81723538+guseoh@users.noreply.github.com
          git add content/java content/curriculum/java.yaml .tmp/java-finalizer .github/workflows/java-language-finalize-temp.yml
          git diff --cached --check
          git commit -m 'Polish remaining Java user-facing terminology'
          git push origin HEAD:codex/content-java-quality
