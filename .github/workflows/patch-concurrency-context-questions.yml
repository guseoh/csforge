name: Validate Java Stage 4 Review

on:
  push:
    branches:
      - content/patch-risk-review-java

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/risk-based-deep-review
          fetch-depth: 0

      - name: Guard expected review head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1dcd453d1aff30c8c6fb8f2e00ff7b65cc13e857"

      - name: Validate Java Stage 4 canonical content
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 4b0a27dd372760f34272f9b8618ceea43b62c109...HEAD -- content/java

          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('content/java')
          errors = []

          def clean(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                  return value[1:-1]
              return value

          def scalar(front: str, name: str):
              match = re.search(rf'(?m)^{re.escape(name)}:\s*(.+?)\s*$', front)
              return clean(match.group(1)) if match else None

          topics_path = root / 'topics.json'
          topics = json.loads(topics_path.read_text(encoding='utf-8'))
          topic_keys = [item['contentKey'] for item in topics if item.get('kind') == 'topic']
          if len(topic_keys) != len(set(topic_keys)):
              errors.append('duplicate topic contentKey')
          topic_key_set = set(topic_keys)

          concept_keys = []
          concept_paths = {}
          shared_reference_meta = {}
          reference_count = 0

          markdown_files = sorted(root.rglob('*.md'))
          for path in markdown_files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  errors.append(f'{path}: missing YAML front matter')
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  errors.append(f'{path}: malformed YAML front matter')
                  continue
              front = parts[1]

              kind = scalar(front, 'kind')
              if kind != 'concept':
                  errors.append(f'{path}: kind={kind!r}, expected concept')

              content_key = scalar(front, 'contentKey')
              topic_key = scalar(front, 'topicContentKey')
              slug = scalar(front, 'slug')
              if not content_key:
                  errors.append(f'{path}: missing contentKey')
              else:
                  concept_keys.append(content_key)
                  concept_paths.setdefault(content_key, []).append(str(path))
              if not topic_key or topic_key not in topic_key_set:
                  errors.append(f'{path}: unknown topicContentKey={topic_key!r}')
              if slug != path.stem:
                  errors.append(f'{path}: slug={slug!r} does not match filename')

              refs = []
              current = None
              in_refs = False
              for line in front.splitlines():
                  if line.strip() == 'references:':
                      in_refs = True
                      continue
                  if not in_refs:
                      continue
                  url_match = re.match(r'^\s*-\s+url:\s*(.+?)\s*$', line)
                  if url_match:
                      if current is not None:
                          refs.append(current)
                      current = {'url': clean(url_match.group(1))}
                      continue
                  field_match = re.match(r'^\s+(title|referenceType|language|displayOrder|relationNote):\s*(.*?)\s*$', line)
                  if field_match and current is not None:
                      current[field_match.group(1)] = clean(field_match.group(2))
                      continue
                  if line and not line[0].isspace():
                      break
              if current is not None:
                  refs.append(current)

              if not refs:
                  errors.append(f'{path}: no references')
                  continue

              display_orders = []
              for ref in refs:
                  reference_count += 1
                  required = ('url', 'title', 'referenceType', 'language', 'displayOrder', 'relationNote')
                  missing = [field for field in required if not ref.get(field)]
                  if missing:
                      errors.append(f'{path}: reference {ref.get("url", "<unknown>")} missing {missing}')
                      continue
                  parsed = urlparse(ref['url'])
                  if parsed.scheme not in {'http', 'https'} or not parsed.netloc:
                      errors.append(f'{path}: invalid reference URL {ref["url"]}')
                  try:
                      display_order = int(ref['displayOrder'])
                      if display_order <= 0:
                          raise ValueError
                      display_orders.append(display_order)
                  except ValueError:
                      errors.append(f'{path}: invalid reference displayOrder {ref["displayOrder"]!r}')

                  meta = (ref['title'], ref['referenceType'], ref['language'])
                  previous = shared_reference_meta.setdefault(ref['url'], (meta, str(path)))
                  if previous[0] != meta:
                      errors.append(
                          f'reference metadata conflict for {ref["url"]}: '
                          f'{previous[0]} in {previous[1]} vs {meta} in {path}'
                      )

              if len(display_orders) != len(set(display_orders)):
                  errors.append(f'{path}: duplicate reference displayOrder')

          for key, paths in concept_paths.items():
              if len(paths) > 1:
                  errors.append(f'duplicate concept contentKey {key}: {paths}')
          concept_key_set = set(concept_keys)

          json_files = sorted(root.rglob('*.json'))
          question_keys = []
          question_paths = {}
          question_count = 0

          for path in json_files:
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{path}: JSON parse error: {exc}')
                  continue

              items = data if isinstance(data, list) else [data]
              for item in items:
                  if not isinstance(item, dict) or item.get('kind') != 'question':
                      continue
                  question_count += 1
                  key = item.get('contentKey')
                  if not key:
                      errors.append(f'{path}: question missing contentKey')
                      continue
                  question_keys.append(key)
                  question_paths.setdefault(key, []).append(str(path))

                  concept_refs = item.get('conceptKeys') or []
                  if not concept_refs:
                      errors.append(f'{path}: {key} has no conceptKeys')
                  for concept_ref in concept_refs:
                      if concept_ref not in concept_key_set:
                          errors.append(f'{path}: {key} references unknown concept {concept_ref}')

                  if item.get('questionType') == 'MULTIPLE_CHOICE':
                      choices = item.get('choices') or []
                      choice_keys = [choice.get('key') for choice in choices if isinstance(choice, dict)]
                      if not choices or len(choice_keys) != len(choices):
                          errors.append(f'{path}: {key} has malformed choices')
                      if len(choice_keys) != len(set(choice_keys)):
                          errors.append(f'{path}: {key} has duplicate choice keys')
                      if item.get('correctChoiceKey') not in choice_keys:
                          errors.append(f'{path}: {key} correctChoiceKey not in choices')

          for key, paths in question_paths.items():
              if len(paths) > 1:
                  errors.append(f'duplicate question contentKey {key}: {paths}')

          if errors:
              print('JAVA_STAGE4_STATIC_VALIDATION status=FAIL')
              for error in errors:
                  print('ERROR', error)
              raise SystemExit(1)

          print(
              'JAVA_STAGE4_STATIC_VALIDATION status=PASS '
              f'topics={len(topic_keys)} concepts={len(concept_keys)} '
              f'questions={question_count} references={reference_count} json_files={len(json_files)}'
          )
          PY
