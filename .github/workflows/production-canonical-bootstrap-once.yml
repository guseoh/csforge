name: One-time production canonical bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-bootstrap-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-production-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      BOOTSTRAP_SERVICE: csforge-canonical-bootstrap-once
      BOOTSTRAP_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:bootstrap-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build bootstrap image from current main
        run: |
          docker build --file backend/Dockerfile --tag "${BOOTSTRAP_IMAGE}" .
          docker push "${BOOTSTRAP_IMAGE}"

      - name: Prepare production database environment
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${service_json}"

          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          if [[ -z "${service_account}" || "${service_account}" == "null" ]]; then
            echo "Could not resolve the production runtime service account." >&2
            exit 1
          fi

          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          service_path, output_path = sys.argv[1], sys.argv[2]
          with open(service_path, encoding="utf-8") as handle:
              service = json.load(handle)

          wanted = {
              "DB_URL",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_MAX_POOL_SIZE",
              "DB_MIN_IDLE",
              "DB_CONNECTION_TIMEOUT",
              "DB_VALIDATION_TIMEOUT",
          }
          required = {"DB_URL", "DB_USERNAME", "DB_PASSWORD"}
          entries = service["spec"]["template"]["spec"]["containers"][0].get("env", [])

          plain = {
              "SPRING_PROFILES_ACTIVE": "local",
              "CSFORGE_AI_ENABLED": "false",
              "MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS": "always",
          }
          secrets = []
          found = set()

          for item in entries:
              name = item.get("name")
              if name not in wanted:
                  continue
              found.add(name)
              if "value" in item:
                  plain[name] = item["value"]
                  continue

              secret_ref = item.get("valueFrom", {}).get("secretKeyRef", {})
              secret_name = secret_ref.get("name")
              secret_version = secret_ref.get("key")
              if not secret_name or not secret_version:
                  raise SystemExit(f"Unsupported environment source for {name}")
              secrets.append(f"{name}={secret_name}:{secret_version}")

          missing = required - found
          if missing:
              raise SystemExit("Missing required production DB variables: " + ", ".join(sorted(missing)))

          with open("/tmp/bootstrap-env.json", "w", encoding="utf-8") as handle:
              json.dump(plain, handle)

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write("secrets=" + ",".join(secrets) + "\n")
          PY

          echo "service_account=${service_account}" >> "${GITHUB_OUTPUT}"

      - name: Deploy private bootstrap service
        shell: bash
        run: |
          set -euo pipefail

          args=(
            run deploy "${BOOTSTRAP_SERVICE}"
            --project="${GCP_PROJECT_ID}"
            --region="${GCP_REGION}"
            --image="${BOOTSTRAP_IMAGE}"
            --service-account="${{ steps.runtime.outputs.service_account }}"
            --env-vars-file=/tmp/bootstrap-env.json
            --cpu=1
            --memory=1Gi
            --min=0
            --max=1
            --timeout=900
            --no-allow-unauthenticated
            --quiet
          )

          if [[ -n "${{ steps.runtime.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime.outputs.secrets }}")
          fi

          gcloud "${args[@]}"

      - name: Run canonical bootstrap through authenticated proxy
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services proxy "${BOOTSTRAP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --port=8081 \
            >/tmp/bootstrap-proxy.log 2>&1 &
          proxy_pid=$!

          cleanup_proxy() {
            kill "${proxy_pid}" 2>/dev/null || true
            wait "${proxy_pid}" 2>/dev/null || true
          }
          trap cleanup_proxy EXIT

          ready=0
          last_status=""
          for _ in $(seq 1 60); do
            last_status="$(curl --silent --show-error --output /tmp/readiness.json --write-out '%{http_code}' http://127.0.0.1:8081/actuator/health/readiness || true)"
            if [[ "${last_status}" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "Authenticated proxy did not become ready. Last HTTP status: ${last_status}" >&2
            echo "Readiness response:" >&2
            cat /tmp/readiness.json >&2 || true
            echo >&2
            echo "Proxy output:" >&2
            cat /tmp/bootstrap-proxy.log >&2 || true
            exit 1
          fi

          before="$(curl --fail --silent --show-error http://127.0.0.1:8081/api/canonical-bootstrap/status)"
          echo "Before bootstrap:"
          echo "${before}" | jq .

          first="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8081/api/canonical-bootstrap)"
          echo "First bootstrap:"
          echo "${first}" | jq .

          if [[ "$(echo "${first}" | jq -r '.success')" != "true" ]]; then
            echo "First bootstrap failed: batch=$(echo "${first}" | jq -r '.failedBatch') kind=$(echo "${first}" | jq -r '.failedKind') message=$(echo "${first}" | jq -r '.failureMessage')" >&2
            exit 21
          fi
          if [[ "$(echo "${first}" | jq -r '.currentCounts.questions')" != "2524" ]]; then
            echo "First bootstrap did not reach 2,524 questions." >&2
            exit 22
          fi

          second="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8081/api/canonical-bootstrap)"
          echo "Idempotency bootstrap:"
          echo "${second}" | jq .

          test "$(echo "${second}" | jq -r '.success')" = "true"
          test "$(echo "${second}" | jq -r '.state')" = "READY"
          test "$(echo "${second}" | jq -r '.currentCounts.questions')" = "2524"
          test "$(echo "${second}" | jq -r '.totals.created')" = "0"
          test "$(echo "${second}" | jq -r '.totals.updated')" = "0"
          test "$(echo "${second}" | jq -r '.totals.errors')" = "0"
          test "$(echo "${second}" | jq -r '.totals.failed')" = "0"

          echo "Canonical bootstrap completed and reimport is idempotent."

      - name: Remove temporary bootstrap service
        if: always()
        run: |
          gcloud run services delete "${BOOTSTRAP_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --quiet || true
