name: One-time production canonical final synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-bootstrap-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-canonical-final-synchronization
  cancel-in-progress: false

jobs:
  bootstrap-production-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      BOOTSTRAP_JOB: csforge-canonical-bootstrap-once
      BOOTSTRAP_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:bootstrap-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Verify immutable canonical source and prepare guarded bootstrap job image
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "e56e55e0d49ec172baf91bb26faa194ade703ab3^{commit}" || { echo "Reviewed main source SHA absent"; exit 1; }
          test "$(git diff --name-only e56e55e0d49ec172baf91bb26faa194ade703ab3 HEAD)" = ".github/workflows/production-canonical-bootstrap-once.yml" || { echo "Unexpected source changed in bootstrap commit"; exit 1; }
          python3 - <<'PATCH_SCRIPT'
          from pathlib import Path
          p=Path("backend/scripts/production-canonical-bootstrap.sh")
          s=p.read_text(encoding="utf-8")
          for old,new in [('"concepts":721','"concepts":727'),('"questions":2525','"questions":2549')]:
              if s.count(old) != 2:
                  raise SystemExit(f"Stale bootstrap assertion shape changed: {old}")
              s=s.replace(old,new)
          anchor='first="$(curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/canonical-bootstrap)"'
          if s.count(anchor)!=1:
              raise SystemExit("Bootstrap API invocation contract changed")
          preflight="""preflight="$(curl --fail --silent --show-error http://127.0.0.1:8080/api/canonical-bootstrap/status)"
          printf 'Read-only canonical preflight:\\n%s\\n' "$preflight"
          printf '%s' "$preflight" | grep -q '"sourceFileCount":876' || exit 15
          printf '%s' "$preflight" | grep -q '"totalItems":3410' || exit 16
          printf '%s' "$preflight" | grep -q '"topics":134' || exit 17
          printf '%s' "$preflight" | grep -q '"concepts":727' || exit 18
          printf '%s' "$preflight" | grep -q '"questions":2549' || exit 19
          
          """
          p.write_text(s.replace(anchor,preflight+anchor),encoding="utf-8")
          
          PATCH_SCRIPT
          cat > backend/scripts/production-history-digest.sql <<'HISTORY_SQL'
          BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SELECT 'concept_progress' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.concept_id), '')) AS row_digest FROM concept_progress AS r;
          SELECT 'concept_view_history' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM concept_view_history AS r;
          SELECT 'personal_note' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM personal_note AS r;
          SELECT 'quiz_session' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM quiz_session AS r;
          SELECT 'quiz_question' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM quiz_question AS r;
          SELECT 'attempt' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM attempt AS r;
          SELECT 'wrong_note' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM wrong_note AS r;
          SELECT 'review_schedule' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.question_id), '')) AS row_digest FROM review_schedule AS r;
          SELECT 'review_history' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM review_history AS r;
          SELECT 'bookmark_category' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.id), '')) AS row_digest FROM bookmark_category AS r;
          SELECT 'bookmark_category_concept' AS table_name, count(*) AS row_count, md5(coalesce(string_agg(to_jsonb(r)::text, E'\n' ORDER BY r.concept_id), '')) AS row_digest FROM bookmark_category_concept AS r;
          COMMIT;
          HISTORY_SQL
          cat > backend/scripts/production-canonical-final-sync.sh <<'FINAL_SYNC_SH'
          #!/bin/sh
          set -eu
          if [ -z "$DB_URL" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Required production DB connection variables missing." >&2
            exit 41
          fi
          case "$DB_URL" in
            jdbc:postgresql://*) pg_uri="$(printf '%s' "$DB_URL" | sed 's/^jdbc://')" ;;
            *) echo "Unsupported JDBC URL form; refusing to apply." >&2; exit 42 ;;
          esac
          export PGUSER="$DB_USERNAME"
          export PGPASSWORD="$DB_PASSWORD"
          export PGCONNECT_TIMEOUT=15
          umask 077
          psql "$pg_uri" -w -q -A -t -F '|' -v ON_ERROR_STOP=1 -f /app/production-history-digest.sql > /tmp/personal-history-before.txt
          echo "Pre-apply personal/history table count and digest:"
          cat /tmp/personal-history-before.txt
          
          /app/production-canonical-bootstrap.sh
          
          psql "$pg_uri" -w -q -A -t -F '|' -v ON_ERROR_STOP=1 -f /app/production-history-digest.sql > /tmp/personal-history-after.txt
          echo "Post-apply personal/history table count and digest:"
          cat /tmp/personal-history-after.txt
          if ! diff -u /tmp/personal-history-before.txt /tmp/personal-history-after.txt; then
            echo "PERSONAL_HISTORY_CHANGED: production canonical sync must not alter personal/history rows." >&2
            exit 44
          fi
          echo "PERSONAL_HISTORY_DIGEST_UNCHANGED: all 11 checked tables."
          rm -f /tmp/personal-history-before.txt /tmp/personal-history-after.txt
          FINAL_SYNC_SH
          cat >> backend/Dockerfile <<'BOOTSTRAP_DOCKER'
          
          # Additional tools are present ONLY in the temporary bootstrap job image.
          USER root
          RUN apt-get update \
              && apt-get install --no-install-recommends --yes postgresql-client \
              && rm -rf /var/lib/apt/lists/*
          COPY --chown=10001:10001 backend/scripts/production-history-digest.sql /app/production-history-digest.sql
          COPY --chown=10001:10001 backend/scripts/production-canonical-final-sync.sh /app/production-canonical-final-sync.sh
          RUN chmod +x /app/production-canonical-final-sync.sh
          USER 10001:10001
          
          BOOTSTRAP_DOCKER
          sh -n backend/scripts/production-canonical-bootstrap.sh
          sh -n backend/scripts/production-canonical-final-sync.sh
          echo "Isolated job-only scripts generated and syntax checked."

      - name: Build bootstrap image from current main
        run: |
          docker build --file backend/Dockerfile --tag "${BOOTSTRAP_IMAGE}" .
          docker push "${BOOTSTRAP_IMAGE}"

      - name: Prepare production database environment
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${service_json}"

          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          if [[ -z "${service_account}" || "${service_account}" == "null" ]]; then
            echo "Could not resolve the production runtime service account." >&2
            exit 1
          fi

          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          service_path, output_path = sys.argv[1], sys.argv[2]
          with open(service_path, encoding="utf-8") as handle:
              service = json.load(handle)

          wanted = {
              "DB_URL",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_MAX_POOL_SIZE",
              "DB_MIN_IDLE",
              "DB_CONNECTION_TIMEOUT",
              "DB_VALIDATION_TIMEOUT",
          }
          required = {"DB_URL", "DB_USERNAME", "DB_PASSWORD"}
          entries = service["spec"]["template"]["spec"]["containers"][0].get("env", [])

          plain = {
              "SPRING_PROFILES_ACTIVE": "local",
              "CSFORGE_AI_ENABLED": "false",
          }
          secrets = []
          found = set()

          for item in entries:
              name = item.get("name")
              if name not in wanted:
                  continue
              found.add(name)
              if "value" in item:
                  plain[name] = item["value"]
                  continue

              secret_ref = item.get("valueFrom", {}).get("secretKeyRef", {})
              secret_name = secret_ref.get("name")
              secret_version = secret_ref.get("key")
              if not secret_name or not secret_version:
                  raise SystemExit(f"Unsupported environment source for {name}")
              secrets.append(f"{name}={secret_name}:{secret_version}")

          missing = required - found
          if missing:
              raise SystemExit("Missing required production DB variables: " + ", ".join(sorted(missing)))

          with open("/tmp/bootstrap-env.json", "w", encoding="utf-8") as handle:
              json.dump(plain, handle)

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write("secrets=" + ",".join(secrets) + "\n")
          PY

          echo "service_account=${service_account}" >> "${GITHUB_OUTPUT}"

      - name: Deploy bootstrap job
        shell: bash
        run: |
          set -euo pipefail

          args=(
            run jobs deploy "${BOOTSTRAP_JOB}"
            --project="${GCP_PROJECT_ID}"
            --region="${GCP_REGION}"
            --image="${BOOTSTRAP_IMAGE}"
            --service-account="${{ steps.runtime.outputs.service_account }}"
            --command=/app/production-canonical-final-sync.sh
            --env-vars-file=/tmp/bootstrap-env.json
            --cpu=1
            --memory=1Gi
            --tasks=1
            --parallelism=1
            --task-timeout=30m
            --max-retries=0
            --quiet
          )

          if [[ -n "${{ steps.runtime.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime.outputs.secrets }}")
          fi

          gcloud "${args[@]}"

      - name: Execute and verify canonical bootstrap
        run: |
          gcloud run jobs execute "${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait \
            --quiet

          execution="$(gcloud run jobs executions list \
            --job="${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --limit=1 \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)")"

          succeeded="$(gcloud run jobs executions describe "${execution}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="value(status.succeededCount)")"

          test "${succeeded}" = "1"
          echo "Production canonical bootstrap job succeeded."

      - name: Remove one-time bootstrap job
        if: always()
        run: |
          gcloud run jobs delete "${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --quiet || true
