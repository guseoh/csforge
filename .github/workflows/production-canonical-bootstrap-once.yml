name: One-time production canonical bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-bootstrap-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-production-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      BOOTSTRAP_JOB: csforge-canonical-bootstrap-once
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare production database environment
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${service_json}"

          image="$(jq -r '.spec.template.spec.containers[0].image' "${service_json}")"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"

          if [[ -z "${image}" || "${image}" == "null" ]]; then
            echo "Could not resolve the production Cloud Run image." >&2
            exit 1
          fi
          if [[ -z "${service_account}" || "${service_account}" == "null" ]]; then
            echo "Could not resolve the production runtime service account." >&2
            exit 1
          fi

          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          service_path, output_path = sys.argv[1], sys.argv[2]
          with open(service_path, encoding="utf-8") as handle:
              service = json.load(handle)

          wanted = {
              "DB_URL",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_MAX_POOL_SIZE",
              "DB_MIN_IDLE",
              "DB_CONNECTION_TIMEOUT",
              "DB_VALIDATION_TIMEOUT",
          }
          required = {"DB_URL", "DB_USERNAME", "DB_PASSWORD"}
          entries = service["spec"]["template"]["spec"]["containers"][0].get("env", [])

          plain = {
              "SPRING_PROFILES_ACTIVE": "local",
              "CSFORGE_AI_ENABLED": "false",
          }
          secrets = []
          found = set()

          for item in entries:
              name = item.get("name")
              if name not in wanted:
                  continue
              found.add(name)
              if "value" in item:
                  plain[name] = item["value"]
                  continue

              secret_ref = item.get("valueFrom", {}).get("secretKeyRef", {})
              secret_name = secret_ref.get("name")
              secret_version = secret_ref.get("key")
              if not secret_name or not secret_version:
                  raise SystemExit(f"Unsupported environment source for {name}")
              secrets.append(f"{name}={secret_name}:{secret_version}")

          missing = required - found
          if missing:
              raise SystemExit("Missing required production DB variables: " + ", ".join(sorted(missing)))

          with open("/tmp/bootstrap-env.json", "w", encoding="utf-8") as handle:
              json.dump(plain, handle)

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write("secrets=" + ",".join(secrets) + "\n")
          PY

          {
            echo "image=${image}"
            echo "service_account=${service_account}"
          } >> "${GITHUB_OUTPUT}"

      - name: Deploy bootstrap job
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_script=$(cat <<'SCRIPT'
          set -eu

          java -jar /app/app.jar --spring.profiles.active=local --server.port=8080 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness >/tmp/readiness.json; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Bootstrap application did not become ready." >&2
            exit 1
          fi

          echo "Reading canonical bootstrap status..."
          before=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/canonical-bootstrap/status)
          echo "Before bootstrap: $before"

          echo "Running first canonical bootstrap..."
          first=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/canonical-bootstrap)
          echo "First bootstrap: $first"

          if ! echo "$first" | grep -q '"success":true'; then
            echo "First bootstrap did not report success." >&2
            exit 21
          fi
          if ! echo "$first" | grep -q '"questions":2524'; then
            echo "First bootstrap did not reach 2,524 questions." >&2
            exit 22
          fi

          echo "Running idempotency bootstrap..."
          second=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/canonical-bootstrap)
          echo "Idempotency bootstrap: $second"

          if ! echo "$second" | grep -q '"success":true'; then
            echo "Second bootstrap did not report success." >&2
            exit 31
          fi
          if ! echo "$second" | grep -q '"state":"READY"'; then
            echo "Second bootstrap did not report READY." >&2
            exit 32
          fi
          if ! echo "$second" | grep -q '"questions":2524'; then
            echo "Second bootstrap did not retain 2,524 questions." >&2
            exit 33
          fi
          if ! echo "$second" | grep -q '"created":0'; then
            echo "Second bootstrap still created canonical items." >&2
            exit 34
          fi
          if ! echo "$second" | grep -q '"updated":0'; then
            echo "Second bootstrap still updated canonical items." >&2
            exit 35
          fi
          if ! echo "$second" | grep -q '"errors":0'; then
            echo "Second bootstrap reported validation errors." >&2
            exit 36
          fi
          if ! echo "$second" | grep -q '"failed":0'; then
            echo "Second bootstrap reported failed items." >&2
            exit 37
          fi

          echo "Canonical bootstrap completed and reimport is idempotent."
          SCRIPT
          )

          args=(
            run jobs deploy "${BOOTSTRAP_JOB}"
            --project="${GCP_PROJECT_ID}"
            --region="${GCP_REGION}"
            --image="${{ steps.runtime.outputs.image }}"
            --service-account="${{ steps.runtime.outputs.service_account }}"
            --command=/bin/sh
            --args=-c,"${bootstrap_script}"
            --env-vars-file=/tmp/bootstrap-env.json
            --cpu=1
            --memory=1Gi
            --tasks=1
            --parallelism=1
            --task-timeout=30m
            --max-retries=0
            --quiet
          )

          if [[ -n "${{ steps.runtime.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.runtime.outputs.secrets }}")
          fi

          gcloud "${args[@]}"

      - name: Execute canonical bootstrap
        run: |
          gcloud run jobs execute "${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait \
            --quiet

      - name: Describe failed bootstrap execution
        if: failure()
        shell: bash
        run: |
          set +e
          execution="$(gcloud run jobs executions list \
            --job="${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --limit=1 \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)")"

          if [[ -n "${execution}" ]]; then
            echo "Failed execution: ${execution}"
            gcloud run jobs executions describe "${execution}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format="yaml(metadata.name,status.conditions,status.failedCount,status.succeededCount,status.logUri)"
          fi

          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --freshness=30m \
            --limit=100 \
            --order=asc \
            --format="value(textPayload)" || true

      - name: Remove one-time bootstrap job
        if: always()
        run: |
          gcloud run jobs delete "${BOOTSTRAP_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --quiet || true
