name: Issue 204 Messaging isolated historical import

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue204-messaging-import-once.yml'

permissions:
  contents: read

jobs:
  isolated-import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stage baseline and corrected Question files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue204-old /tmp/issue204-new
          git show acd47851637838c2a7db6ea522308ebb32db3914:content/messaging-async/semantics/questions.json > /tmp/issue204-old/semantics-questions.json
          git show acd47851637838c2a7db6ea522308ebb32db3914:content/messaging-async/delivery/questions.json > /tmp/issue204-old/delivery-questions.json
          cp content/messaging-async/semantics/questions.json /tmp/issue204-new/semantics-questions.json
          cp content/messaging-async/delivery/questions.json /tmp/issue204-new/delivery-questions.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Start disposable PostgreSQL and Redis
        run: |
          docker compose up -d postgres redis
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U csforge -d csforge; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start local-only Spring Boot backend
        run: |
          cd backend
          chmod +x gradlew
          nohup ./gradlew bootRun --no-daemon > /tmp/issue204-boot.log 2>&1 < /dev/null &
          for i in $(seq 1 160); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -n 180 /tmp/issue204-boot.log
          exit 1
      - name: Confirm real Preview Apply exact replay and personal history preservation
        run: |
          python3 - <<'PY'
          import copy,hashlib,json,pathlib,subprocess,urllib.request,uuid
          API='http://127.0.0.1:8080'
          NAMES=['semantics-questions.json','delivery-questions.json']
          QKEYS=['messaging.core.semantics.partition-key.q1','messaging.core.delivery.ordering.q1']
          def questions(folder):
            return {q['contentKey']:q for name in NAMES for q in json.loads(pathlib.Path(folder,name).read_text())}
          old=questions('/tmp/issue204-old')
          new=questions('/tmp/issue204-new')
          assert old.keys()==new.keys() and len(old)==18
          assert {k for k in old if old[k]!=new[k]}==set(QKEYS)
          expected=copy.deepcopy(new)
          expected[QKEYS[0]]['promptMarkdown']=old[QKEYS[0]]['promptMarkdown']
          expected[QKEYS[0]]['explanationMarkdown']=old[QKEYS[0]]['explanationMarkdown']
          expected[QKEYS[1]]['choices'][0]['content']=old[QKEYS[1]]['choices'][0]['content']
          expected[QKEYS[1]]['choices'][0]['rationaleMarkdown']=old[QKEYS[1]]['choices'][0]['rationaleMarkdown']
          assert expected==old,'Unapproved Question delta'
          def sql(q):
            return subprocess.check_output(['docker','compose','exec','-T','postgres','psql','-U','csforge','-d','csforge','-At','-c',q],text=True).strip()
          def call(path,method='GET',data=None):
            raw=None if data is None else json.dumps(data,ensure_ascii=False).encode()
            headers={'Accept':'application/json'}
            if raw is not None:headers['Content-Type']='application/json'
            if method=='POST':headers['Idempotency-Key']=str(uuid.uuid4())
            req=urllib.request.Request(API+path,headers=headers,data=raw,method=method)
            with urllib.request.urlopen(req,timeout=180) as resp:
              content=resp.read()
              return json.loads(content) if content else None
          def multipart(folder,digest=None):
            boundary='issue204'+uuid.uuid4().hex
            body=b''
            for name in NAMES:
              content=pathlib.Path(folder,name).read_bytes()
              body+=(f'--{boundary}\r\nContent-Disposition: form-data; name="files"; filename="{name}"\r\nContent-Type: application/json\r\n\r\n').encode()+content+b'\r\n'
            if digest is not None:
              body+=f'--{boundary}\r\nContent-Disposition: form-data; name="previewDigest"\r\n\r\n{digest}\r\n'.encode()
            return body+f'--{boundary}--\r\n'.encode(),'multipart/form-data; boundary='+boundary
          def post(path,body,mime):
            req=urllib.request.Request(API+path,data=body,method='POST',headers={'Content-Type':mime})
            with urllib.request.urlopen(req,timeout=180) as resp:return json.load(resp)
          def apply(folder):
            preview=post('/api/imports/preview',*multipart(folder))
            assert preview['canApply'] and preview['totals']['errors']==0,preview
            applied=post('/api/imports/apply',*multipart(folder,preview['previewDigest']))
            assert applied['totals']['failed']==0,(preview,applied)
            return preview,applied
          def digest(t):
            return sql("select md5(coalesce(string_agg(row_to_json(t)::text,chr(10) order by row_to_json(t)::text),'')) from "+t+" t")
          assert call('/api/auth/session')['mode']=='LOCAL'
          init=call('/api/canonical-bootstrap','POST')
          assert init['success'] and init['totalItems']==3380 and init['totals']['created']==3380,init
          ids={k:int(sql("select id from question where content_key='"+k+"'")) for k in QKEYS}
          cid=int(sql("select id from concept where content_key='messaging.core.semantics.partition-key'"))
          q=ids[QKEYS[1]]
          correct=sql("select c.choice_key from question_answer a join question_choice c on c.id=a.choice_id where a.question_id="+str(q)+" and a.answer_kind='CORRECT_CHOICE'")
          assert correct=='B',correct
          started=call('/api/quizzes/questions/'+str(q)+'/practice','POST')
          call('/api/quizzes/'+str(started['quizId'])+'/questions/'+str(q)+'/answer','PUT',{'selectedChoiceKey':'A','answerText':None,'reviewNeeded':True})
          call('/api/quizzes/'+str(started['quizId'])+'/submit','POST')
          assert call('/api/quizzes/'+str(started['quizId'])+'/result')['wrong']==1
          call('/api/concepts/'+str(cid)+'/note','PUT',{'content':'issue204-messaging-history-personal'})
          call('/api/wrong-notes/'+str(q)+'/note','PUT',{'content':'issue204-messaging-history-wrong'})
          tables=['personal_note','concept_progress','quiz_session','attempt','wrong_note','review_schedule','review_history','question_answer','question_concept','concept_reference']
          before={t:digest(t) for t in tables}
          a,b=apply('/tmp/issue204-old')
          assert a['totals']['updated']==2 and b['totals']['updated']==2,(a['totals'],b['totals'])
          a,b=apply('/tmp/issue204-new')
          assert a['totals']['updated']==2 and b['totals']['updated']==2,(a['totals'],b['totals'])
          a,b=apply('/tmp/issue204-new')
          assert a['totals']['updated']==0 and b['totals']['updated']==0,(a['totals'],b['totals'])
          assert a['totals']['unchanged']==18 and b['totals']['unchanged']==18,(a['totals'],b['totals'])
          final=call('/api/canonical-bootstrap','POST')
          assert final['success'] and final['totals']['unchanged']==3380 and final['totals']['updated']==0 and final['totals']['errors']==0,final
          assert before=={t:digest(t) for t in tables},'personal/history/reference relations changed'
          assert ids=={k:int(sql("select id from question where content_key='"+k+"'")) for k in QKEYS}
          assert call('/api/quizzes/'+str(started['quizId'])+'/result')['wrong']==1
          practice=call('/api/quizzes/questions/'+str(q)+'/practice','POST')
          call('/api/quizzes/'+str(practice['quizId'])+'/questions/'+str(q)+'/answer','PUT',{'selectedChoiceKey':'B','answerText':None,'reviewNeeded':False})
          call('/api/quizzes/'+str(practice['quizId'])+'/submit','POST')
          assert call('/api/quizzes/'+str(practice['quizId'])+'/result')['correct']==1
          sq=ids[QKEYS[0]]
          practice=call('/api/quizzes/questions/'+str(sq)+'/practice','POST')
          call('/api/quizzes/'+str(practice['quizId'])+'/questions/'+str(sq)+'/answer','PUT',{'selectedChoiceKey':None,'answerText':'메시지 키','reviewNeeded':False})
          call('/api/quizzes/'+str(practice['quizId'])+'/submit','POST')
          assert call('/api/quizzes/'+str(practice['quizId'])+'/result')['correct']==1
          print('PASS: baseline -> correction Preview/Apply each 2 UPDATED')
          print('PASS: exact files reimport 18 UNCHANGED, whole canonical rebootstrap 3380 UNCHANGED')
          print('PASS: 10 history digests + 2 stable question IDs + practice A wrong/B correct/short answer correct')
          PY
      - name: Diagnostics on failure only
        if: failure()
        run: |
          tail -n 160 /tmp/issue204-boot.log || true
          docker compose ps || true
