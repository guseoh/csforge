name: Validate five-area canonical import

on:
  push:
    branches:
      - content/validate-five-areas

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Add reimport diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFiveAreaImportValidationTest.java')
          text = path.read_text(encoding='utf-8')
          old = '            assertEquals(0, preview.updated(), "identical reimport must not update canonical items");'
          new = '''            if (preview.updated() != 0) {
                preview.items().stream()
                        .filter(item -> item.classification().name().equals("UPDATED"))
                        .forEach(item -> System.out.println(
                                "CANONICAL_REIMPORT_UPDATED key=" + item.contentKey() + " diffs=" + item.diffs()));
            }
            assertEquals(0, preview.updated(), "identical reimport must not update canonical items");'''
          if old not in text:
              raise SystemExit('diagnostic insertion point not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run canonical five-area import validation
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --tests com.guseoh.csforge.importcontent.CanonicalFiveAreaImportValidationTest --info
