name: Validate five-area canonical import

on:
  push:
    branches:
      - content/validate-five-areas

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Scan shared reference metadata
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import yaml

          roots = [
              Path('content/java'),
              Path('content/spring'),
              Path('content/database'),
              Path('content/security'),
              Path('content/backend-engineering'),
          ]
          by_url = defaultdict(list)

          for root in roots:
              for path in sorted(root.rglob('*.md')):
                  text = path.read_text(encoding='utf-8')
                  if not text.startswith('---\n'):
                      continue
                  end = text.find('\n---\n', 4)
                  if end < 0:
                      continue
                  meta = yaml.safe_load(text[4:end]) or {}
                  for ref in meta.get('references') or []:
                      url = ref.get('url')
                      if not url:
                          continue
                      global_meta = (
                          ref.get('title'),
                          ref.get('referenceType'),
                          ref.get('language'),
                          ref.get('depth'),
                          ref.get('recommendation'),
                      )
                      by_url[url].append((str(path), global_meta))

          conflicts = 0
          for url, entries in sorted(by_url.items()):
              variants = defaultdict(list)
              for path, meta in entries:
                  variants[meta].append(path)
              if len(variants) <= 1:
                  continue
              conflicts += 1
              print(f'REFERENCE_METADATA_CONFLICT url={url}')
              for meta, paths in variants.items():
                  print(f'  metadata={meta}')
                  for path in paths:
                      print(f'    file={path}')

          print(f'REFERENCE_METADATA_CONFLICT_COUNT={conflicts}')
          PY

      - name: Collect all reimport diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFiveAreaImportValidationTest.java')
          text = path.read_text(encoding='utf-8')
          old_updated = '            assertEquals(0, preview.updated(), "identical reimport must not update canonical items");'
          diagnostic = '''            if (preview.updated() != 0) {
                preview.items().stream()
                        .filter(item -> item.classification().name().equals("UPDATED"))
                        .forEach(item -> System.out.println(
                                "CANONICAL_REIMPORT_UPDATED key=" + item.contentKey() + " diffs=" + item.diffs()));
            }'''
          old_unchanged = '            assertEquals(itemCount, preview.unchanged(), "every canonical item must classify as UNCHANGED on identical reimport");'
          if old_updated not in text or old_unchanged not in text:
              raise SystemExit('diagnostic insertion point not found')
          text = text.replace(old_updated, diagnostic)
          text = text.replace(old_unchanged, '            // diagnostic run: collect all UPDATED items before restoring strict idempotency assertions')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run canonical five-area import diagnostic
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --tests com.guseoh.csforge.importcontent.CanonicalFiveAreaImportValidationTest --info
