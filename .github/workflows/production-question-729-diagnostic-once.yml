name: One-time production question 729 diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-question-729-diagnostic-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect-question:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      DIAGNOSTIC_SERVICE: csforge-question-729-diagnostic-once
      DIAGNOSTIC_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:question-729-diagnostic-${{ github.sha }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build read-only diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/question-diagnostic
          cat > /tmp/question-diagnostic/server.py <<'PY'
          import hmac, json, os, shlex, subprocess
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse, parse_qs, unquote

          TOKEN = os.environ['RESULT_TOKEN']

          def pg_env():
              raw = os.environ['DB_URL']
              if raw.startswith('jdbc:'): raw = raw[5:]
              parsed = urlparse(raw)
              if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
                  raise RuntimeError('unsupported DB_URL')
              env = os.environ.copy()
              env.update({
                  'PGHOST': parsed.hostname,
                  'PGPORT': str(parsed.port or 5432),
                  'PGDATABASE': unquote(parsed.path.lstrip('/')),
                  'PGUSER': os.environ['DB_USERNAME'],
                  'PGPASSWORD': os.environ['DB_PASSWORD'],
              })
              q = parse_qs(parsed.query)
              if q.get('sslmode'): env['PGSSLMODE'] = q['sslmode'][0]
              return env

          def query(sql):
              out = subprocess.check_output(['psql','-X','-v','ON_ERROR_STOP=1','-At','-F','\t','-c',sql], env=pg_env(), text=True)
              return [line.split('\t') for line in out.splitlines() if line]

          def diagnostic():
              question = query("SELECT id::text, content_key, question_type, status, difficulty, prompt_markdown FROM question WHERE id=729")
              choices = query("SELECT id::text, choice_key, content_markdown, coalesce(rationale_markdown,''), display_order::text FROM question_choice WHERE question_id=729 ORDER BY display_order,id")
              answers = query("SELECT qa.id::text, qa.answer_kind, coalesce(qa.choice_id::text,''), coalesce(qc.choice_key,''), coalesce(qa.answer_text,''), qa.display_order::text FROM question_answer qa LEFT JOIN question_choice qc ON qc.id=qa.choice_id WHERE qa.question_id=729 ORDER BY qa.display_order,qa.id")
              concepts = query("SELECT c.id::text, c.content_key, c.title FROM question_concept link JOIN concept c ON c.id=link.concept_id WHERE link.question_id=729 ORDER BY c.content_key")
              neighborhood = query("SELECT id::text, content_key, question_type FROM question WHERE id BETWEEN 725 AND 733 ORDER BY id")
              attempts = query("SELECT count(*)::text FROM attempt WHERE question_id=729")
              return {
                  'state':'DONE', 'readOnly':True, 'question':question,
                  'choices':choices, 'answers':answers, 'concepts':concepts,
                  'neighborhood':neighborhood, 'attemptCount':int(attempts[0][0])
              }

          RESULT = diagnostic()
          BODY = json.dumps(RESULT, ensure_ascii=False).encode()

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/result': self.send_response(404); self.end_headers(); return
                  if not hmac.compare_digest(self.headers.get('X-Result-Token',''), TOKEN):
                      self.send_response(403); self.end_headers(); return
                  self.send_response(200)
                  self.send_header('Content-Type','application/json; charset=utf-8')
                  self.send_header('Content-Length',str(len(BODY)))
                  self.end_headers(); self.wfile.write(BODY)
              def log_message(self, fmt, *args): return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY
          cat > /tmp/question-diagnostic/Dockerfile <<'DOCKER'
          FROM python:3.13-slim
          RUN apt-get update && apt-get install --no-install-recommends --yes postgresql-client && rm -rf /var/lib/apt/lists/*
          COPY server.py /app/server.py
          USER 65532:65532
          CMD ["python3","/app/server.py"]
          DOCKER
          docker build -t "${DIAGNOSTIC_IMAGE}" /tmp/question-diagnostic
          docker push "${DIAGNOSTIC_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >>"${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json >"${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json, os, sys
          service_path, output_path = sys.argv[1], sys.argv[2]
          service = json.load(open(service_path, encoding='utf-8'))
          wanted={'DB_URL','DB_USERNAME','DB_PASSWORD'}; required=set(wanted)
          entries=service['spec']['template']['spec']['containers'][0].get('env',[])
          plain={'RESULT_TOKEN':os.environ['RESULT_TOKEN']}; secrets=[]; found=set()
          for item in entries:
              name=item.get('name')
              if name not in wanted: continue
              found.add(name)
              if 'value' in item: plain[name]=item['value']; continue
              ref=item.get('valueFrom',{}).get('secretKeyRef',{})
              if not ref.get('name') or not ref.get('key'): raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          if required-found: raise SystemExit('missing DB vars: '+','.join(sorted(required-found)))
          json.dump(plain,open('/tmp/env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out: out.write('secrets='+','.join(secrets)+'\n')
          PY
          echo "service_account=${service_account}" >>"${GITHUB_OUTPUT}"

      - name: Deploy private diagnostic service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --image="${DIAGNOSTIC_IMAGE}" --service-account="${{ steps.prod.outputs.service_account }}" \
            --env-vars-file=/tmp/env.json --cpu=1 --memory=512Mi --min=0 --max=1 --timeout=300 \
            --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then args+=(--set-secrets="${{ steps.prod.outputs.secrets }}"); fi
          gcloud "${args[@]}"
          url="$(gcloud run services describe "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          test -n "$url"; echo "url=$url" >>"${GITHUB_OUTPUT}"

      - name: Mint diagnostic ID token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch read-only result
        env:
          RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" --header "X-Result-Token: ${RESULT_TOKEN}" "${URL}/result" || true)"
            [[ "$code" == "200" ]] && break
            sleep 2
          done
          test "$code" = "200"
          jq -e '.state == "DONE" and .readOnly == true and (.question|length) == 1' /tmp/result.json >/dev/null
          jq . /tmp/result.json

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-question-729-diagnostic
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary diagnostic service
        if: always()
        run: gcloud run services delete "${DIAGNOSTIC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
