name: CA correction import regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/computer-architecture/**'
      - 'backend/src/test/java/com/guseoh/csforge/importcontent/CaCorrectionSnapshotIntegrationTest.java'
      - '.github/workflows/ca-correction-regression.yml'
      - 'frontend/scripts/ca-reader-browser-qa.mjs'

permissions:
  contents: read

jobs:
  historical-ca-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Materialize immutable pre-PR Computer Architecture pack
        run: |
          mkdir -p /tmp/csforge-ca-baseline
          git cat-file -e 2911f82f702b0cc3d0482a4df473288775513566^{commit}
          git archive 2911f82f702b0cc3d0482a4df473288775513566 content/computer-architecture | tar -x -C /tmp/csforge-ca-baseline
          test -f /tmp/csforge-ca-baseline/content/computer-architecture/performance/questions.json
      - name: CA historical PostgreSQL Preview Apply Reimport History
        working-directory: backend
        env:
          CSFORGE_CA_BASELINE_DIR: /tmp/csforge-ca-baseline/content/computer-architecture
        run: |
          chmod +x gradlew
          ./gradlew test --tests 'com.guseoh.csforge.importcontent.CaCorrectionSnapshotIntegrationTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca-correction-regression-test-results
          path: backend/build/test-results/test/*.xml
          if-no-files-found: warn

  reader-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual CA Reader route
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4179 > /tmp/ca-vite.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4179/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/ca-reader-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca-reader-light-dark-mobile-desktop
          path: frontend/ca-reader-evidence/*.png
          if-no-files-found: warn
