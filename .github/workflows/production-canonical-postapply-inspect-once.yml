name: One-time canonical temporary asset cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/production-canonical-postapply-inspect-once.yml]
permissions:
  contents: read
  id-token: write
jobs:
  cleanup-temporary-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: csforge-508510
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Remove only temporary canonical assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re, subprocess
          project = 'csforge-508510'
          region = 'asia-southeast1'
          image = region + '-docker.pkg.dev/' + project + '/csforge/csforge'
          def call(args):
              return subprocess.check_output(['gcloud', *args, '--project=' + project, '--quiet'], text=True)
          def read(args):
              return json.loads(call([*args, '--format=json']))
          revisions = read(['run', 'revisions', 'list', '--service=csforge', '--region=' + region])
          protected = set()
          for rev in revisions:
              digest = rev.get('status', {}).get('imageDigest', '')
              if '@' in digest: protected.add(digest.rsplit('@', 1)[1])
          if not protected: raise SystemExit('production revision image protection unavailable')
          services = read(['run', 'services', 'list', '--region=' + region])
          deleted_services = []
          for service in services:
              name = service.get('metadata', {}).get('name', '')
              if name.startswith('csforge-canonical-') and name.endswith('-once'):
                  call(['run', 'services', 'delete', name, '--region=' + region])
                  deleted_services.append(name)
          images = read(['artifacts', 'docker', 'images', 'list', image, '--include-tags'])
          deleted_images = []
          pattern = re.compile(r'^(preview-|canonical-(apply|exact))')
          for item in images:
              version = item.get('version', '').rsplit('/', 1)[-1]
              tags = item.get('tags', [])
              if isinstance(tags, str): tags = [t.strip() for t in tags.split(',') if t.strip()]
              tags = [t.rsplit('/tags/', 1)[-1] for t in tags]
              if not tags or not all(pattern.match(t) for t in tags): continue
              if not version.startswith('sha256:') or version in protected: continue
              call(['artifacts', 'docker', 'images', 'delete', image + '@' + version, '--delete-tags'])
              deleted_images.append({'digest': version, 'tags': tags})
          remaining_services = read(['run', 'services', 'list', '--region=' + region])
          if any(s.get('metadata', {}).get('name', '').startswith('csforge-canonical-') for s in remaining_services):
              raise SystemExit('canonical temporary service remains')
          print(json.dumps({'state':'DONE', 'productionRevisionDigestsProtected':len(protected), 'deletedServices':deleted_services, 'deletedTemporaryImages':deleted_images}, indent=2))
          PY
