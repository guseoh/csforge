# 임시 Database G1 전용 QA. 검증 후 PR 머지 범위에서 제거한다.
name: Database G1 isolated QA
on:
  push:
    branches:
      - viz/database-g1

permissions:
  contents: read

jobs:
  isolated-import-and-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: PostgreSQL 16 isolated Database G1 Import and Reader HTTP
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --tests com.guseoh.csforge.importcontent.DatabaseG1FullPackIntegrationTest --no-daemon --stacktrace

  frontend-and-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate all 17 SVG XML and Markdown path mapping
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('frontend/public/learning/database').glob('*.svg'))
          assert len(paths)==17, f'Unexpected diagram inventory: {len(paths)}'
          for f in paths:
              root=ET.parse(f).getroot()
              ns='{http://www.w3.org/2000/svg}'
              assert root.tag == ns+'svg', f
              assert root.attrib.get('viewBox'), f
              assert root.find(ns+'title') is not None, f
              assert root.find(ns+'desc') is not None, f
              assert not any(element.tag.endswith(('script','foreignObject')) for element in root.iter()), f
              image='/learning/database/'+f.name
              content=list(Path('content/database').rglob('*.md'))
              assert sum(image in x.read_text(encoding='utf-8') for x in content)==1, f
          print('DATABASE_G1_SVG_XML_PASS 17/17')
      - name: Frontend lint, unit tests, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
