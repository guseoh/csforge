name: OS scheduling sentence-level rewrite
on:
  push:
    branches: [codex/content-operating-systems-quality]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - name: Rewrite reviewed scheduling questions
        shell: bash
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          p=Path('content/operating-systems/scheduling/questions.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert len(data)==31, len(data)
          by={q['contentKey']:q for q in data}
          def ident(q):
            return (q['contentKey'],q['questionType'],q['difficulty'],q['status'],copy.deepcopy(q.get('conceptKeys')),copy.deepcopy(q.get('acceptedAnswers')),q.get('correctChoiceKey'),[(c['key'],c['displayOrder']) for c in q.get('choices',[])])
          before=[ident(q) for q in data]
          def setq(key,prompt=None,model=None,explain=None,choices=None):
            q=by[key]
            if prompt is not None:q['promptMarkdown']=prompt
            if model is not None:q['modelAnswer']=model
            if explain is not None:q['explanationMarkdown']=explain
            if choices:
              cm={c['key']:c for c in q['choices']}
              for k,(content,rat) in choices.items(): cm[k]['content']=content;cm[k]['rationaleMarkdown']=rat

          # Context switch
          setq('operating-systems.core.scheduling.context-switch.q1','다음 중 문맥 전환(context switch)에 대한 설명으로 가장 정확한 것은?',explain='문맥 전환은 CPU가 **다른 실행 문맥을 실행하기 위해 현재 상태를 저장하고 다음 상태를 복원하는 전환**이다. 사용자 모드에서 커널 모드로 권한만 바뀌고 같은 작업으로 돌아온다면 모드 전환일 수는 있어도 작업 문맥 전환이라고 할 수 없다.',choices={
            'A':('항상 사용자 모드에서 커널 모드로 들어가는 것만을 뜻한다.','시스템 콜이나 인터럽트로 커널 모드에 들어가도 같은 작업으로 돌아올 수 있다. 문맥 전환은 실행 대상으로 선택된 작업의 문맥 자체가 바뀌는 경우를 말한다.'),
            'B':('현재 실행 흐름의 CPU 문맥을 저장하고 다른 실행 가능한 흐름의 문맥을 복원한다.','문맥 전환은 현재 실행 상태를 저장하고 다른 실행 가능한 작업의 상태를 복원해 이어서 실행하게 한다. 어떤 상태를 보존할지는 CPU 아키텍처와 운영체제 구현에 따라 달라진다.'),
            'C':('프로세스의 실행 이미지를 다시 읽는 과정이다.','실행 이미지를 다시 적재하는 것은 프로세스 생성이나 `exec` 동작과 관련된다. 일반적인 스케줄링 문맥 전환은 저장된 실행 상태를 바꾸어 재개하는 과정이다.'),
            'D':('반드시 프로세스가 종료될 때만 발생한다.','시간 할당량이 끝나거나 작업이 대기 상태로 들어가는 경우처럼 프로세스나 스레드가 종료되지 않아도 문맥 전환은 발생할 수 있다.')})
          setq('operating-systems.core.scheduling.context-switch.q2','모드 전환(mode switch)과 문맥 전환(context switch)이 같은 개념이 아닌 이유를 설명하라.','모드 전환은 같은 실행 흐름이 권한 수준만 바꾸어 커널 코드를 실행할 수도 있지만, 문맥 전환은 CPU가 실행할 흐름 자체를 바꾸면서 레지스터·프로그램 카운터 같은 실행 문맥을 저장·복원한다. 시스템 콜 진입이 곧 다른 프로세스로의 문맥 전환을 뜻하지는 않는다.','시스템 콜이나 인터럽트는 커널이 CPU 제어권을 얻는 계기가 될 수 있지만 **다른 실행 가능한 작업을 실제로 선택했는지**는 별도 문제다. 따라서 시스템 콜 수나 인터럽트 수를 문맥 전환 수와 1:1로 해석하면 안 된다.')
          setq('operating-systems.core.scheduling.context-switch.q3','관측 결과는 다음과 같다.\n\n- 초당 문맥 전환 횟수: 크게 증가\n- CPU 활용률: 높음\n- 처리량: 감소\n\n질문: 가능한 원인과 확인할 지표를 설명하라.','시간 할당량이 지나치게 작거나 실행 가능한 스레드가 너무 많아 유용한 계산보다 스케줄링·레지스터 복원·캐시/TLB 지역성 손실 비용이 커졌을 수 있다. 자발적/비자발적 문맥 전환, 실행 큐 길이, CPU 시간, 캐시 미스, 처리량과 지연 시간을 함께 비교해야 한다.','문맥 전환 증가만으로 원인을 확정할 수는 없지만 실행 가능한 작업 사이의 경쟁이 커지면 상태 전환과 지역성 손실에 CPU 시간을 더 쓸 수 있다. **전환 횟수와 실행 큐가 늘어난 시점에 실제 계산 시간·캐시 미스·처리량이 어떻게 변했는지 함께 봐야** 원인과 단순 상관관계를 구분할 수 있다.')
          setq('operating-systems.core.scheduling.context-switch.q4','두 스레드가 같은 프로세스 안에서 교대하는 경우와 서로 다른 프로세스가 교대하는 경우를 비교하라.','둘 다 CPU 레지스터와 실행 문맥 전환이 필요하지만 같은 프로세스의 스레드는 보통 같은 주소 공간을 공유한다. 서로 다른 프로세스 사이 전환은 주소 공간과 관련된 상태까지 달라질 수 있어 비용 특성이 다르다. 실제 비용은 운영체제와 CPU 아키텍처 구현에 의존한다.','스레드 전환도 레지스터·스택·프로그램 카운터 같은 실행 상태를 바꿔야 하므로 무료가 아니다. 다만 같은 프로세스의 스레드는 주소 공간을 공유할 수 있어 서로 다른 프로세스 사이 전환과 주소 변환·캐시 지역성 영향이 같다고 일반화할 수 없다.')

          # Timer / preemption
          setq('operating-systems.core.scheduling.timer-interrupt-preemption.q1','타이머 인터럽트가 선점형 스케줄링에 기여하는 핵심 이유는?',explain='하드웨어 타이머는 실행 중인 작업이 자발적으로 CPU를 놓지 않아도 **운영체제가 다시 CPU 제어권을 얻어 스케줄링 조건을 평가할 기회**를 만든다. 타이머가 블로킹 I/O를 완료시키거나 미래 CPU 버스트를 예측하는 것은 아니다.',choices={
            'A':('CPU 버스트 시간을 정확히 예측한다.','타이머 인터럽트는 스케줄링 기회를 제공하지만 작업의 다음 CPU 버스트 길이를 예측하지 않는다.'),
            'B':('모든 대기 중인 작업을 즉시 완료시킨다.','타이머 인터럽트가 I/O를 완료하거나 모든 대기 작업을 깨우는 것은 아니다. 커널이 시간과 스케줄링 조건을 처리할 기회를 얻는 것이다.'),
            'C':('현재 작업이 스스로 양보하지 않아도 커널이 스케줄링 결정을 다시 할 기회를 얻는다.','타이머는 자발적으로 CPU를 양보하지 않는 작업도 인터럽트할 수 있어 커널이 제어권을 되찾고 실행할 작업을 다시 고를 수 있게 한다.'),
            'D':('모든 문맥 전환 비용을 제거한다.','선점 뒤 다른 작업을 선택하면 상태 저장·복원이 필요하므로 문맥 전환 비용이 들 수 있다. 타이머는 제어 기회를 만들 뿐 전환 비용을 없애지 않는다.')})
          setq('operating-systems.core.scheduling.timer-interrupt-preemption.q2','실행 중인 작업이 타이머 인터럽트 뒤에도 계속 실행될 수 있는 이유를 설명하라.','타이머 인터럽트는 스케줄러가 판단할 기회를 제공할 뿐 반드시 다른 작업으로 전환해야 한다는 뜻은 아니다. 현재 작업을 계속 실행하는 것이 정책상 적절하거나 다른 실행 가능한 작업이 없다면 처리기 실행 뒤 같은 작업으로 복귀할 수 있다.','`타이머 인터럽트`와 `문맥 전환`은 같은 사건이 아니다. 인터럽트는 커널 진입과 스케줄링 기회를 만들지만, **실제 전환은 스케줄러가 다른 실행 가능한 작업을 선택할 때** 일어난다.')
          setq('operating-systems.core.scheduling.timer-interrupt-preemption.q3','CPU 중심 작업 A가 계속 실행 중이고 작업 B가 준비 큐에서 기다리고 있다. 타이머 인터럽트가 제대로 발생하지만 B가 영원히 실행되지 않는다면 어느 부분을 의심해야 하는가?','타이머 메커니즘 자체보다 스케줄링 정책·우선순위·CPU 친화도 또는 실제 선점 가능 조건을 확인해야 한다. 인터럽트가 스케줄링 판단 기회를 제공해도 정책이 계속 A를 고르거나 B가 해당 CPU에서 실행할 수 없다면 B는 실행 기회를 얻지 못할 수 있다.','타이머 인터럽트가 정상이라는 것은 운영체제가 판단 기회를 얻고 있다는 뜻이다. 그럼에도 B가 실행 기회를 못 받는다면 **선택 정책, 실행 가능한 CPU 제약, 우선순위·공정성, 실제 선점 가능 시점**을 추적해야 한다. 원인을 타이머 자체로만 좁히면 안 된다.')

          # Scheduler goals
          setq('operating-systems.core.scheduling.scheduler-goals.q1','스케줄러가 동시에 고려할 수 있는 목표 조합으로 가장 적절한 것은?',explain='스케줄링 정책은 하나의 숫자만 최적화하지 않는다. 상호작용형 작업의 응답 시간, 배치 작업의 처리량, 기아 방지를 위한 공정성, CPU 활용률처럼 **서로 충돌할 수 있는 여러 목표**를 작업 부하의 요구에 맞춰 조정한다.',choices={
            'A':('응답 시간, 처리량, 공정성, CPU 활용률','스케줄러는 응답 시간·처리량·공정성·CPU 활용률을 함께 고려할 수 있고 목표가 서로 충돌할 수 있다. 적절한 정책은 작업 부하와 서비스 목표에 따라 달라진다.'),
            'B':('처리량만 최대화하면 응답 시간과 공정성도 자동으로 최적화된다.','처리량을 높이는 정책이 상호작용형 작업을 오래 기다리게 하거나 공정성을 나쁘게 만들 수 있다. 하나의 지표가 모든 목표를 자동으로 최적화하지는 않는다.'),
            'C':('모든 작업 부하에서 반환 시간 하나만 최소화하면 충분하다.','반환 시간은 일부 배치 작업에서 중요하지만 상호작용형 시스템은 응답 시간과 공정성도 고려한다. 모든 작업 부하에 충분한 단일 목표는 없다.'),
            'D':('문맥 전환을 0으로 만드는 것이 다른 목표보다 항상 우선한다.','문맥 전환을 줄이면 부가 비용은 줄 수 있지만 한 작업이 CPU를 오래 잡게 하면 응답성과 공정성이 나빠질 수 있다. 다른 목표와 함께 조정해야 한다.')})
          setq('operating-systems.core.scheduling.scheduler-goals.q2','응답 시간(response time)과 반환 시간(turnaround time)을 구분하라.','응답 시간은 보통 작업이 도착한 뒤 처음 CPU 실행 기회를 얻기까지의 시간을 보고, 반환 시간은 도착부터 완료까지의 전체 시간을 본다. 상호작용형 작업은 응답 시간이 중요할 수 있고 배치 작업은 반환 시간이나 처리량이 더 중요할 수 있다.','두 지표는 다른 질문에 답한다. 응답 시간은 **첫 실행 기회까지의 기다림**, 반환 시간은 **도착부터 완료까지의 전체 시간**을 본다. 따라서 라운드 로빈이 첫 응답을 개선해도 모든 작업의 반환 시간까지 최소화한다는 뜻은 아니다.')
          setq('operating-systems.core.scheduling.scheduler-goals.q3','한 정책 변경 뒤 배치 처리량은 20% 증가했지만 상호작용형 요청의 p99 지연 시간이 두 배가 되었다. 이 결과를 어떻게 해석해야 하는가?','스케줄러 목표 사이에 절충이 발생한 것이다. 처리량 개선만으로 성공이라 할 수 없고 작업 부하별 SLO와 공정성을 함께 봐야 한다. 상호작용형 요청의 대기·응답 시간, 배치 처리량, 문맥 전환과 CPU 활용률을 함께 비교해 정책을 조정해야 한다.','처리량 하나만 보면 개선처럼 보이지만 상호작용형 요청의 꼬리 지연 시간(tail latency)이라는 다른 목표는 악화됐다. **정책의 성공 여부는 어떤 작업 부하의 SLO를 우선하는지**에 따라 판단해야 하며 평균치만으로 p99 악화를 숨기면 안 된다.')

          # FCFS
          setq('operating-systems.core.scheduling.fcfs.q1','FCFS에서 CPU 버스트가 각각 A=8 ms, B=2 ms, C=1 ms이고 세 작업이 A→B→C 순서로 준비되었다. B가 CPU를 처음 받기까지 기다리는 시간은?',explain='A가 먼저 8 ms 동안 CPU를 사용한 뒤 B가 시작하므로 B의 대기 시간은 8 ms다. FCFS에서는 앞 작업의 CPU 버스트가 그대로 뒤 작업의 초기 대기 시간에 누적될 수 있다.')
          setq('operating-systems.core.scheduling.fcfs.q2','같은 A=8, B=2, C=1에서 FCFS 순서가 A→B→C일 때 각 작업의 대기 시간과 평균 대기 시간을 계산하라.','A는 0, B는 8, C는 10만큼 기다린다. 평균 대기 시간은 `(0+8+10)/3 = 6`이다. 긴 A가 앞에 있어 짧은 B와 C가 함께 기다리는 호송 효과(convoy effect)를 볼 수 있다.','A는 즉시 시작하고, B는 A의 8만큼, C는 A와 B의 8+2만큼 기다린다. 평균은 6이다. **짧은 B·C가 긴 A 뒤에서 함께 지연되는 것**이 호송 효과의 핵심이다.')
          setq('operating-systems.core.scheduling.fcfs.q3','같은 세 작업의 실행 순서를 C→B→A로 바꾸면 평균 대기 시간은 얼마이며, 이 결과가 FCFS의 어떤 한계를 보여 주는가?','C=0, B=1, A=3이므로 평균 대기 시간은 `4/3`이다. 같은 작업 집합이라도 실행 순서에 따라 평균 대기 시간이 크게 달라지며, FCFS가 짧은 작업의 빠른 완료를 보호하지 못함을 보여 준다.','C가 먼저 끝나고 B가 이어지면 긴 A 뒤에서 기다리는 짧은 작업이 사라져 평균 대기 시간이 `4/3`으로 내려간다. **FCFS는 작업 길이를 고려하지 않기 때문에 도착·배치 순서에 성능이 크게 좌우된다.**')

          # SJF
          setq('operating-systems.core.scheduling.sjf.q1','모든 작업이 동시에 도착하고 CPU 버스트 길이를 정확히 안다고 가정할 때, 비선점 SJF가 먼저 선택하는 작업은?',explain='SJF는 이름 그대로 **예상 CPU 버스트가 가장 짧은 작업**을 먼저 고르는 모델이다. PID나 메모리 사용량은 이 선택 기준과 무관하다.',choices={
            'A':('메모리 사용량이 가장 큰 작업','SJF는 실행 가능한 작업을 예상 CPU 버스트 길이로 비교하지 메모리 사용량으로 정렬하지 않는다.'),
            'B':('PID가 가장 큰 작업','PID는 프로세스 식별 값이지 실행 시간 정보가 아니다. SJF는 예상 CPU 버스트 길이를 비교한다.'),
            'C':('예상 CPU 버스트가 가장 짧은 작업','모든 작업이 준비되어 있고 버스트 길이를 안다면 비선점 SJF는 예상 CPU 버스트가 가장 짧은 작업을 먼저 고른다.'),
            'D':('항상 가장 먼저 도착한 작업','먼저 도착한 작업을 고르는 것은 FCFS의 선택 규칙이다. 제시된 조건에서 SJF는 버스트 길이를 사용한다.')})
          setq('operating-systems.core.scheduling.sjf.q2','CPU 버스트가 A=8, B=2, C=1이고 세 작업이 동시에 도착했다. 비선점 SJF의 실행 순서와 평균 대기 시간을 계산하라.','실행 순서는 C→B→A다. 대기 시간은 C=0, B=1, A=3이므로 평균은 `4/3`이다.','가장 짧은 C(1), B(2), A(8) 순서로 실행한다. 따라서 대기 시간은 0, 1, 3이고 평균은 `4/3`이다. 이 예는 **짧은 작업을 긴 작업 앞에 두면 평균 대기 시간이 줄어드는 이유**를 보여 준다.')
          setq('operating-systems.core.scheduling.sjf.q3','실제 운영체제에서 순수한 SJF를 그대로 구현하기 어려운 이유와 긴 작업의 기아 가능성을 함께 설명하라.','미래 CPU 버스트를 정확히 알 수 없어 과거 실행 패턴 등을 이용해 추정해야 하고, 짧은 작업이 계속 들어오면 긴 작업이 계속 뒤로 밀릴 수 있다. 예측 오차와 기아를 줄이려면 에이징·우선순위 보정이나 다른 공정성 정책이 필요하다.','SJF의 이상적인 성질은 **다음 CPU 버스트 길이를 안다는 전제**에 기대고 있다. 현실에서는 그 값을 추정해야 하며, 짧은 작업이 끊임없이 도착하면 긴 작업이 계속 밀릴 수 있으므로 공정성을 보완해야 한다.')

          # Round Robin
          setq('operating-systems.core.scheduling.round-robin.q1','라운드 로빈에서 시간 할당량(time quantum)이 매우 커지면 어떤 정책과 비슷해지는가?',explain='시간 할당량이 각 작업의 CPU 버스트보다 충분히 크면 첫 작업이 할당 시간이 끝나기 전에 사실상 완료되므로 다음 작업으로 넘어가는 모습이 **FCFS와 가까워진다.**')
          setq('operating-systems.core.scheduling.round-robin.q2','A와 B 두 CPU 중심 작업의 버스트가 각각 5이고 시간 할당량이 2다. A가 먼저 실행된다고 할 때 CPU 실행 순서를 할당량 단위로 적어라.','A 2 → B 2 → A 2 → B 2 → A 1 → B 1 순서가 된다. 두 작업이 번갈아 CPU를 얻으며 각 할당 시간 종료 때 아직 실행할 일이 남은 작업은 다시 실행 가능 큐 뒤로 간다.','각 작업은 한 번에 최대 2만큼 실행한 뒤 남은 버스트가 있으면 큐 뒤로 돌아간다. 그래서 `A2 → B2 → A2 → B2` 뒤 A와 B가 각각 1씩 남아 순서대로 완료된다.')
          setq('operating-systems.core.scheduling.round-robin.q3','시간 할당량을 10 ms에서 0.1 ms로 줄였더니 응답 시간은 좋아지지 않고 처리량만 감소했다. 원인을 분석하라.','시간 할당량이 실제 유용한 CPU 작업 구간보다 지나치게 작아 문맥 전환과 캐시 지역성 손실의 비중이 커졌을 수 있다. 실행 가능한 작업 수, 전환 횟수, 응답 시간, 처리량을 함께 측정해 적절한 할당량을 선택해야 한다.','작은 시간 할당량은 작업 순환을 빠르게 하지만 전환이 너무 잦아지면 **유용한 계산보다 문맥 전환·지역성 손실 비용의 비율이 커질 수 있다.** 응답 시간이 이미 충분히 짧다면 더 줄여도 이득 없이 처리량만 손해 볼 수 있다.')
          setq('operating-systems.core.scheduling.round-robin.q4','I/O 중심 작업과 CPU 중심 작업이 섞인 라운드 로빈에서 I/O 중심 작업이 시간 할당량을 다 쓰지 않고 블로킹되면 스케줄러 관점에서 어떤 일이 일어나는가?','I/O 중심 작업은 할당 시간이 끝나기 전에 대기 상태로 이동하고 CPU를 양보한다. 스케줄러는 다른 실행 가능한 작업을 선택한다. I/O가 완료되면 해당 작업은 다시 준비 상태가 되므로 CPU 중심 작업과 똑같이 항상 전체 시간 할당량을 소비한다고 가정하면 안 된다.','시간 할당량은 작업이 반드시 끝까지 써야 하는 예약 시간이 아니다. I/O 대기가 먼저 오면 작업은 대기 상태로 이동하고 CPU가 비므로 스케줄러는 다른 실행 가능한 작업을 고른다. I/O 완료 뒤에는 다시 준비 큐 경쟁에 참여한다.')

          # Priority scheduling
          setq('operating-systems.core.scheduling.priority-scheduling.q1','우선순위 스케줄링의 일반적인 위험으로 가장 적절한 것은?',explain='높은 우선순위 작업이 끊임없이 선택되면 낮은 우선순위 작업은 실행 가능한 상태여도 CPU 실행 기회를 받지 못할 수 있다. **우선순위는 중요도 순서를 만들지만 자동으로 공정성을 보장하지 않는다.**',choices={
            'A':('우선순위 스케줄링에서는 대기 상태가 존재할 수 없다.','우선순위는 실행 가능한 작업 가운데 누구를 선택할지에 영향을 주지만 작업은 여전히 I/O나 다른 사건을 기다리며 대기 상태가 될 수 있다.'),
            'B':('우선순위를 사용하면 문맥 전환이 원천적으로 사라진다.','선택 우선순위를 바꿔도 선점·블로킹·작업 전환은 사라지지 않는다. 다른 작업을 선택하면 문맥 전환은 여전히 발생할 수 있다.'),
            'C':('우선순위가 높을수록 항상 CPU 버스트가 짧다.','우선순위는 스케줄링 선호도를 표현하지 작업의 CPU 버스트 길이를 예측하는 값은 아니다. 높은 우선순위 작업도 CPU를 오래 사용할 수 있다.'),
            'D':('높은 우선순위 작업이 계속 도착하면 낮은 우선순위 작업이 기아 상태가 될 수 있다.','높은 우선순위 작업이 계속 실행 가능한 상태라면 낮은 우선순위 작업은 준비되어 있어도 선택되지 않을 수 있다. 우선순위 순서만으로 공정성이나 기아 방지가 보장되지는 않는다.')})
          setq('operating-systems.core.scheduling.priority-scheduling.q2','일반적인 스케줄링 기아와 락에 의한 우선순위 역전(priority inversion)을 구분하라.','기아는 스케줄링 정책과 경쟁 때문에 특정 실행 가능한 작업이 CPU 실행 기회를 계속 얻지 못하는 문제다. 우선순위 역전은 높은 우선순위 작업이 필요한 락이나 자원을 낮은 우선순위 작업이 보유해 간접적으로 막히는 문제다. 우선순위 상속(priority inheritance)은 주로 후자를 완화하는 방법이지 일반 기아의 만능 해결책이 아니다.','기아는 **누가 CPU 실행 기회를 선택받는가**의 문제이고, 우선순위 역전은 **누가 필요한 자원을 보유하고 있는가**가 핵심이다. 따라서 우선순위 상속을 일반 기아의 해결책으로 쓰는 것은 원인과 처방을 혼동한 것이다.')
          setq('operating-systems.core.scheduling.priority-scheduling.q3','낮은 우선순위의 백그라운드 작업이 30분 이상 준비 상태인데 높은 우선순위 작업이 계속 들어와 실행되지 않는다. 어떤 정책을 고려할 수 있는가?','에이징, 동적 우선순위 부스트, 최소 실행 기회 보장, 할당량 같은 정책으로 최대 대기 시간을 제한할 수 있다. 단순한 우선순위 상속을 적용할 상황은 아니며 작업 부하별 우선순위의 의미와 최대 대기 시간 SLO를 명시해야 한다.','이 작업은 블로킹된 것이 아니라 실행 가능한데 선택에서 계속 밀리고 있으므로 스케줄링 기아에 가깝다. **대기 이력을 우선순위에 반영하거나 최소 실행 기회를 보장하는 정책**을 검토해야 하며 락 소유자가 원인이 아니므로 우선순위 상속은 직접 해법이 아니다.')

          # Starvation / aging
          setq('operating-systems.core.scheduling.starvation-aging.q1','기아(starvation) 상태의 작업에 대한 설명으로 맞는 것은?',explain='기아의 핵심은 작업이 **실행 가능한데도 정책과 경쟁 때문에 CPU 실행 기회를 받지 못하는 것**이다. 교착 순환이나 I/O 실패는 필수 조건이 아니다.',choices={
            'A':('실행 가능하지만 스케줄링 기회를 오랫동안 얻지 못할 수 있다.','기아 상태의 작업은 실행 가능한 상태로 남아 있으면서 스케줄링 정책이 반복해서 다른 작업을 선택할 수 있다. 준비되지 않은 것이 아니라 실행 기회를 받지 못한 것이다.'),
            'B':('반드시 교착 상태의 순환 의존에 포함되어 있다.','불공정한 우선순위 정책만으로도 기아가 생길 수 있으며 자원 대기 순환은 필요하지 않다. 순환 의존은 교착 상태와 관련된다.'),
            'C':('항상 이미 종료된 상태다.','종료된 작업은 스케줄링 기회를 기다릴 수 없다. 기아는 실행할 자격은 있지만 실행 기회를 받지 못하는 작업에 관한 문제다.'),
            'D':('반드시 I/O 폴트가 발생한 상태다.','기아에 I/O 폴트가 필요한 것은 아니다. 작업이 실행 준비가 되어 있어도 경쟁 작업이 반복해서 CPU를 차지할 수 있다.')})
          setq('operating-systems.core.scheduling.starvation-aging.q2','에이징(aging)이 기아를 줄이는 기본 원리를 설명하라.','준비 큐에서 오래 기다릴수록 실효 우선순위를 점진적으로 높여 결국 선택될 가능성을 키운다. 기다린 시간과 우선순위 보정 규칙이 함께 정의되어야 한다.','에이징은 대기 이력을 스케줄링 결정에 반영해 **오래 기다린 작업이 실행 기회를 얻을 가능성을 점차 높이는 방식**이다. 구체적인 숫자 규칙보다 무기한 배제를 막는 방향이 핵심이다.')
          setq('operating-systems.core.scheduling.starvation-aging.q3','에이징을 너무 공격적으로 적용했더니 원래 높은 우선순위 작업 부하의 지연 시간이 크게 악화되었다. 왜 그런가?','대기 중인 작업의 우선순위가 너무 빠르게 상승해 원래 우선순위 차이를 사실상 지워버렸기 때문이다. 최대 대기 시간을 보호하면서도 원래 우선순위의 의미를 유지하도록 에이징 속도와 상한을 조정해야 한다.','에이징을 강하게 하면 공정성은 좋아질 수 있지만 낮은 우선순위 작업이 빠르게 높은 우선순위 작업과 경쟁하게 된다. 따라서 **기아 방지와 원래의 우선순위·지연 시간 목표 사이의 절충**을 조정해야 한다.')
          setq('operating-systems.core.scheduling.starvation-aging.q4','기아와 교착 상태가 둘 다 "진행하지 못한다"고 보이지만 운영 대응이 다른 이유를 설명하라.','기아는 다른 작업들은 계속 진행하면서 특정 작업만 스케줄링·자원 기회를 잃는 상황일 수 있어 공정성과 우선순위 정책을 조정한다. 교착 상태는 참여 작업들이 서로의 자원을 기다리는 순환 의존 등으로 진행하지 못하므로 자원 획득 규칙이나 복구가 필요하다.','기아는 **시스템 전체의 진행은 남아 있지만 특정 작업이 배제되는 문제**이고, 교착 상태는 의존 관계의 순환 때문에 참여자들이 진행하지 못하는 문제다. 관측해야 할 의존 관계와 해결 정책이 다르다.')

          # Multicore affinity
          setq('operating-systems.core.scheduling.multicore-affinity.q1','Linux `sched_setaffinity()`가 설정하는 CPU 친화도 마스크의 의미로 가장 정확한 것은?',explain='Linux의 CPU 친화도 마스크는 스레드가 **실행될 수 있는 CPU의 집합**을 정한다. 메모리 배치나 우선순위를 자동으로 바꾸는 설정이 아니며, 허용 CPU 범위를 좁히면 스케줄러의 이동·부하 분산 선택지도 그 범위 안으로 제한된다.',choices={
            'A':('친화도 마스크는 작업 우선순위를 바꾸므로 허용 CPU 집합과는 관계가 없다.','CPU 친화도는 스레드가 실행될 수 있는 CPU를 제한하는 설정이지 우선순위를 정하는 설정이 아니다.'),
            'B':('해당 스레드를 지정 CPU에서만 실행하면서 메모리도 자동으로 같은 NUMA 노드에 고정한다.','CPU 친화도는 실행 위치를 제한하지만 같은 NUMA 노드에 메모리를 자동으로 배치하지 않는다. 메모리 정책과 페이지 배치는 별도 문제다.'),
            'C':('CPU 집합을 제한하면 스케줄러가 모든 CPU로 자유롭게 작업을 이동할 수 있다.','허용 CPU를 제한하면 작업 이동 선택지가 줄고 부하 분산을 제약할 수 있다. 모든 CPU로 자유롭게 이동하게 하는 설정이 아니다.'),
            'D':('해당 스레드가 실행될 수 있는 CPU 집합을 제한한다.','친화도 마스크는 스레드가 실행될 수 있도록 허용된 CPU 집합을 정의한다. 그 자체로 우선순위나 메모리 배치는 정하지 않는다.')})
          setq('operating-systems.core.scheduling.multicore-affinity.q2','CPU 친화도가 캐시 지역성에는 도움이 되면서 부하 분산에는 불리할 수 있는 이유를 설명하라.','같은 CPU에서 반복 실행하면 캐시의 작업 집합을 재사용하기 쉬워 작업 이동 비용을 줄일 수 있다. 하지만 허용 CPU를 과도하게 제한하면 특정 CPU의 실행 가능 큐가 길어져 다른 CPU가 놀고 있어도 작업을 옮기지 못할 수 있다.','같은 CPU에서 다시 실행하면 따뜻한 캐시 상태를 활용할 가능성이 높다. 하지만 강한 친화도로 허용 CPU 범위를 좁히면 스케줄러가 사용할 수 있는 이동 목적지도 줄어 **지역성과 부하 분산이 상충**할 수 있다.')
          setq('operating-systems.core.scheduling.multicore-affinity.q3','8코어 시스템에서 워커 8개를 모두 CPU0에 고정했더니 CPU0은 100%, 나머지 CPU는 거의 유휴 상태다. 어떤 문제가 있고 어떻게 검증할 것인가?','CPU 친화도가 부하 분산을 막아 CPU0의 실행 큐가 병목이 된 것이다. 친화도 범위를 넓히거나 스케줄러의 작업 이동을 허용한 뒤 CPU별 실행 가능 큐, 작업 이동, 캐시 미스, 처리량과 지연 시간을 비교해야 한다.','시스템에 CPU가 남아 있어도 작업의 허용 CPU 마스크가 CPU0 하나라면 그 처리 용량을 사용할 수 없다. 해결은 무조건 친화도를 없애는 것이 아니라 **범위를 넓혔을 때 큐·작업 이동·캐시 미스·처리량·꼬리 지연 시간이 어떻게 바뀌는지 비교**해 지역성 손실보다 부하 분산 이득이 큰지 확인하는 것이다.')
          setq('operating-systems.core.scheduling.multicore-affinity.q4','NUMA 환경에서 CPU 친화도만 고정하고 메모리 배치를 고려하지 않으면 성능이 나빠질 수 있는 이유를 설명하라.','작업이 고정된 CPU와 실제 메모리가 다른 NUMA 노드에 있으면 원격 메모리 접근 비용이 커질 수 있다. CPU 친화도와 메모리 지역성을 함께 관찰해야 하며 CPU 친화도만으로 메모리 지역성이 자동 보장되지는 않는다.','NUMA에서는 CPU 배치와 메모리 배치가 함께 지역성을 만든다. **CPU만 특정 노드에 고정하고 작업 집합이 다른 노드에 남아 있으면 원격 메모리 접근**이 늘 수 있으므로 CPU 친화도만 보고 최적화를 판단하면 안 된다.')

          after=[ident(q) for q in data]
          assert before==after,'identity contract changed'
          assert by['operating-systems.core.scheduling.timer-interrupt-preemption.q3']['difficulty']=='MEDIUM'
          assert by['operating-systems.core.scheduling.round-robin.q3']['difficulty']=='MEDIUM'
          assert by['operating-systems.core.scheduling.multicore-affinity.q3']['difficulty']=='HARD'
          out=json.dumps(data,ensure_ascii=False,indent=2)+'\n'
          for bad in ['자원를','작업가','우선순위가가','시간 할당량을을','실행 가능 큐를를']:
            assert bad not in out,bad
          p.write_text(out,encoding='utf-8')
          print('scheduling questions',len(data),'identity preserved')
