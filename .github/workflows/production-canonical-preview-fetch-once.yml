name: One-time production canonical preview fetch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-preview-fetch-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  preview-production-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      PREVIEW_SERVICE: csforge-canonical-preview-once
      CONTENT_BASE_SHA: b7accce59a7971a0ca5e95813c3a51227159cbb7
      BASE_PREVIEW_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:preview-7f0a4316786a6147513717289e575fc166efc47b
      DIAGNOSTIC_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:preview-diagnostic-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build diagnostic wrapper
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          mkdir -p /tmp/preview-diagnostic/content/backend-engineering/api
          mkdir -p /tmp/preview-diagnostic/content/dsa/search-sort
          mkdir -p /tmp/preview-diagnostic/content/dsa/stack-queue-deque
          mkdir -p /tmp/preview-diagnostic/content/infrastructure-cloud/compute
          cp content/backend-engineering/api/questions.json /tmp/preview-diagnostic/content/backend-engineering/api/questions.json
          cp content/dsa/search-sort/questions.json /tmp/preview-diagnostic/content/dsa/search-sort/questions.json
          cp content/dsa/stack-queue-deque/questions.json /tmp/preview-diagnostic/content/dsa/stack-queue-deque/questions.json
          cp content/infrastructure-cloud/compute/questions.json /tmp/preview-diagnostic/content/infrastructure-cloud/compute/questions.json
          cat > /tmp/preview-diagnostic/wrapper-entrypoint.sh <<'SH'
          #!/bin/sh
          set -u
          (
            /app/run-preview.sh >/tmp/compute.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && [ ! -f /tmp/public-result.json ]; then
              phase=$(cat /tmp/preview-phase 2>/dev/null || echo UNKNOWN)
              {
                echo '=== compute ==='
                tail -n 30 /tmp/compute.log 2>/dev/null || true
                echo '=== spring ==='
                tail -n 120 /tmp/java.log 2>/dev/null || true
              } | sed -E \
                -e 's#jdbc:[^ ]+#jdbc:[REDACTED]#g' \
                -e 's#(password|DB_PASSWORD)[=:][^ ]+#\1=[REDACTED]#gi' \
                -e 's#postgres(ql)?://[^@ ]+@#postgresql://[REDACTED]@#gi' \
                >/tmp/diagnostic.txt
              python3 - "$rc" "$phase" <<'PY'
          import json, sys
          from pathlib import Path
          rc, phase = int(sys.argv[1]), sys.argv[2]
          diagnostic = Path('/tmp/diagnostic.txt').read_text(encoding='utf-8', errors='replace')[-12000:]
          Path('/tmp/public-result.json').write_text(json.dumps({
              'state':'ERROR','exitCode':rc,'phase':phase,'diagnostic':diagnostic,
              'destructiveApplyInvoked':False
          }, ensure_ascii=False), encoding='utf-8')
          PY
            fi
          ) &
          exec python3 /app/result-server.py
          SH
          chmod +x /tmp/preview-diagnostic/wrapper-entrypoint.sh
          cat > /tmp/preview-diagnostic/Dockerfile <<'DOCKER'
          ARG BASE_PREVIEW_IMAGE
          FROM ${BASE_PREVIEW_IMAGE}
          USER root
          COPY wrapper-entrypoint.sh /app/wrapper-entrypoint.sh
          COPY content/backend-engineering/api/questions.json /app/content/backend-engineering/api/questions.json
          COPY content/dsa/search-sort/questions.json /app/content/dsa/search-sort/questions.json
          COPY content/dsa/stack-queue-deque/questions.json /app/content/dsa/stack-queue-deque/questions.json
          COPY content/infrastructure-cloud/compute/questions.json /app/content/infrastructure-cloud/compute/questions.json
          RUN sed -i 's/seq 1 120/seq 1 360/' /app/run-preview.sh \
              && sed -i 's/5e1b3328af8844e7a22e8d440cd75b80a0ad740d/b7accce59a7971a0ca5e95813c3a51227159cbb7/g' /app/run-preview.sh \
              && chmod +x /app/wrapper-entrypoint.sh
          USER 10001:10001
          ENTRYPOINT ["/app/wrapper-entrypoint.sh"]
          DOCKER
          docker build --build-arg BASE_PREVIEW_IMAGE="${BASE_PREVIEW_IMAGE}" \
            --tag "${DIAGNOSTIC_IMAGE}" /tmp/preview-diagnostic
          docker push "${DIAGNOSTIC_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > "${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json, os, sys
          service_path, output_path = sys.argv[1], sys.argv[2]
          service = json.load(open(service_path, encoding='utf-8'))
          wanted = {'DB_URL','DB_USERNAME','DB_PASSWORD','DB_MAX_POOL_SIZE','DB_MIN_IDLE','DB_CONNECTION_TIMEOUT','DB_VALIDATION_TIMEOUT'}
          required = {'DB_URL','DB_USERNAME','DB_PASSWORD'}
          entries = service['spec']['template']['spec']['containers'][0].get('env', [])
          plain = {
              'SPRING_PROFILES_ACTIVE':'local',
              'CSFORGE_AI_ENABLED':'false',
              'SPRING_FLYWAY_ENABLED':'false',
              'SPRING_JPA_HIBERNATE_DDL_AUTO':'validate',
              'PREVIEW_RESULT_TOKEN': os.environ['PREVIEW_RESULT_TOKEN'],
          }
          secrets, found = [], set()
          for item in entries:
              name = item.get('name')
              if name not in wanted:
                  continue
              found.add(name)
              if 'value' in item:
                  plain[name] = item['value']
                  continue
              ref = item.get('valueFrom', {}).get('secretKeyRef', {})
              if not ref.get('name') or not ref.get('key'):
                  raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          missing = required - found
          if missing:
              raise SystemExit('missing DB vars: ' + ','.join(sorted(missing)))
          json.dump(plain, open('/tmp/preview-env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out:
              out.write('secrets=' + ','.join(secrets) + '\n')
          PY
          echo "service_account=${service_account}" >> "${GITHUB_OUTPUT}"

      - name: Deploy private preview result service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${PREVIEW_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --image="${DIAGNOSTIC_IMAGE}" \
            --service-account="${{ steps.prod.outputs.service_account }}" \
            --env-vars-file=/tmp/preview-env.json \
            --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=900 \
            --no-cpu-throttling --cpu-boost \
            --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.prod.outputs.secrets }}")
          fi
          gcloud "${args[@]}"
          actual_url="$(gcloud run services describe "${PREVIEW_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.url)')"
          test -n "${actual_url}"
          echo "url=${actual_url}" >> "${GITHUB_OUTPUT}"

      - name: Mint preview service ID token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch sanitized preview result
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="000"
          for _ in $(seq 1 400); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" \
              --header "X-Preview-Token: ${PREVIEW_RESULT_TOKEN}" \
              "${PREVIEW_URL}/result" || true)"
            if [[ "${code}" == "200" ]]; then
              break
            fi
            if [[ "${code}" != "202" && "${code}" != "000" ]]; then
              echo "Unexpected result HTTP ${code}"
              cat /tmp/result.json || true
              exit 1
            fi
            sleep 3
          done
          test "${code}" = "200"
          jq . /tmp/result.json
          jq -e '.destructiveApplyInvoked == false' /tmp/result.json >/dev/null
          jq -e '.state == "DONE"' /tmp/result.json >/dev/null
          jq -e '.preview.canApply == true and .preview.totals.errors == 0' /tmp/result.json >/dev/null
          jq -e '.identitySafety.identitySafe == true' /tmp/result.json >/dev/null

      - name: Upload sanitized preview result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canonical-preview-authenticated-${{ env.CONTENT_BASE_SHA }}
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary preview service
        if: always()
        run: gcloud run services delete "${PREVIEW_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
