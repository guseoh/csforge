name: One-time production canonical apply

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-canonical-apply-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  apply-production-content:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      APPLY_SERVICE: csforge-canonical-apply-once
      CONTENT_BASE_SHA: ba8c40c4907bbb35fbd662fbc1beb56f64ae7736
      BASE_PREVIEW_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:preview-7f0a4316786a6147513717289e575fc166efc47b
      APPLY_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-apply-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONTENT_BASE_SHA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build pinned apply wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTENT_BASE_SHA}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

          mkdir -p /tmp/canonical-apply/content/backend-engineering/api
          mkdir -p /tmp/canonical-apply/content/dsa/search-sort
          mkdir -p /tmp/canonical-apply/content/dsa/stack-queue-deque
          mkdir -p /tmp/canonical-apply/content/infrastructure-cloud/compute
          cp content/backend-engineering/api/questions.json /tmp/canonical-apply/content/backend-engineering/api/questions.json
          cp content/dsa/search-sort/questions.json /tmp/canonical-apply/content/dsa/search-sort/questions.json
          cp content/dsa/stack-queue-deque/questions.json /tmp/canonical-apply/content/dsa/stack-queue-deque/questions.json
          cp content/infrastructure-cloud/compute/questions.json /tmp/canonical-apply/content/infrastructure-cloud/compute/questions.json

          cat > /tmp/canonical-apply/run-apply.sh <<'SH'
          #!/bin/sh
          set -eu

          CONTENT_SHA='ba8c40c4907bbb35fbd662fbc1beb56f64ae7736'
          EXPECTED_SOURCE_FILES=378
          EXPECTED_BATCHES=7
          EXPECTED_TOTAL_ITEMS=3380
          EXPECTED_TOPICS=75
          EXPECTED_CONCEPTS=721
          EXPECTED_QUESTIONS=2584
          EXPECTED_AREAS=15

          phase() { printf '%s' "$1" >/tmp/apply-phase; }

          phase START_JAVA
          java -jar /app/app.jar --spring.profiles.active=local --server.port=8081 >/tmp/java.log 2>&1 &
          java_pid=$!

          cleanup() {
            kill "$java_pid" 2>/dev/null || true
            wait "$java_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          phase WAIT_PREFLIGHT
          ok=0
          for _ in $(seq 1 360); do
            code=$(curl --silent --show-error --max-time 300 --output /tmp/pre-status.json --write-out '%{http_code}' \
              http://127.0.0.1:8081/api/canonical-bootstrap/status || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            if ! kill -0 "$java_pid" 2>/dev/null; then
              exit 21
            fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || exit 22

          phase ASSERT_PREFLIGHT
          jq -e \
            --argjson files "$EXPECTED_SOURCE_FILES" \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .state == "PARTIAL" and
              .sourceFileCount == $files and .totalBatches == $batches and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/pre-status.json >/dev/null

          phase PREPARE_HISTORY_SNAPSHOT
          python3 <<'PY' >/tmp/pg-env
          import os, shlex
          from urllib.parse import urlparse, parse_qs, unquote

          raw = os.environ['DB_URL']
          if raw.startswith('jdbc:'):
              raw = raw[5:]
          parsed = urlparse(raw)
          if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
              raise SystemExit('DB_URL is not a direct PostgreSQL URL supported by the safety snapshot')
          dbname = unquote(parsed.path.lstrip('/'))
          if not dbname:
              raise SystemExit('DB_URL database name is missing')
          values = {
              'PGHOST': parsed.hostname,
              'PGPORT': str(parsed.port or 5432),
              'PGDATABASE': dbname,
              'PGUSER': os.environ['DB_USERNAME'],
              'PGPASSWORD': os.environ['DB_PASSWORD'],
          }
          query = parse_qs(parsed.query)
          if query.get('sslmode'):
              values['PGSSLMODE'] = query['sslmode'][0]
          for key, value in values.items():
              print(f"export {key}={shlex.quote(value)}")
          PY
          . /tmp/pg-env
          rm -f /tmp/pg-env
          export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
          [ -z "${PGSSLMODE:-}" ] || export PGSSLMODE
          psql -X -v ON_ERROR_STOP=1 -Atc 'select 1' >/dev/null

          snapshot_history() {
            dest="$1"
            : >"$dest"
            for table in quiz_session quiz_question attempt review_schedule review_history; do
              psql -X -v ON_ERROR_STOP=1 -Atc "SELECT '$table' || E'\\t' || count(*) || E'\\t' || md5(COALESCE(string_agg(md5(row_to_json(t)::text), '' ORDER BY md5(row_to_json(t)::text)), '')) FROM $table t;" >>"$dest"
            done
          }

          snapshot_history /tmp/history-before.tsv

          phase APPLY
          : >/tmp/apply-invoked
          curl --silent --show-error --fail-with-body --max-time 900 \
            --request POST http://127.0.0.1:8081/api/canonical-bootstrap >/tmp/apply.json

          phase ASSERT_APPLY
          jq -e \
            --argjson files "$EXPECTED_SOURCE_FILES" \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .success == true and .state == "READY" and
              .sourceFileCount == $files and .totalBatches == $batches and
              .completedBatches == $batches and .totalItems == $items and
              .failedBatch == null and .failedKind == null and .failureMessage == null and
              .totals.created == 0 and .totals.skipped == 0 and .totals.errors == 0 and .totals.failed == 0 and
              (.totals.updated + .totals.unchanged == $items) and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/apply.json >/dev/null

          phase VERIFY_HISTORY
          snapshot_history /tmp/history-after.tsv
          cmp -s /tmp/history-before.tsv /tmp/history-after.tsv

          phase VERIFY_REPRESENTATIVE_CONTENT
          concept_ok=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM concept WHERE content_key='messaging.core.semantics.consumer-offset' AND title='컨슈머 그룹과 처리 위치';")
          structure_ok=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM question WHERE (content_key='backend.core.api.methods-status.q2' AND question_type='DESCRIPTIVE') OR (content_key='dsa.core.search-sort.merge-sort.q1' AND question_type='SHORT_ANSWER') OR (content_key='dsa.core.stack-queue-deque.deque.q1' AND question_type='SHORT_ANSWER') OR (content_key='infrastructure.core.compute.execution-models.q1' AND question_type='SHORT_ANSWER');")
          [ "$concept_ok" = "1" ]
          [ "$structure_ok" = "4" ]

          phase VERIFY_IDEMPOTENCY
          curl --silent --show-error --fail-with-body --max-time 900 \
            http://127.0.0.1:8081/api/canonical-bootstrap/status >/tmp/post-status.json
          jq -e \
            --argjson files "$EXPECTED_SOURCE_FILES" \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .state == "READY" and .sourceFileCount == $files and
              .totalBatches == $batches and .readyBatches == $batches and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/post-status.json >/dev/null

          phase BUILD_RESULT
          python3 <<'PY'
          import json
          from pathlib import Path

          pre = json.load(open('/tmp/pre-status.json', encoding='utf-8'))
          applied = json.load(open('/tmp/apply.json', encoding='utf-8'))
          post = json.load(open('/tmp/post-status.json', encoding='utf-8'))
          history = {}
          for line in Path('/tmp/history-after.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              table, count, _digest = line.split('\t', 2)
              history[table] = int(count)
          result = {
              'state': 'DONE',
              'contentBaseSha': 'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736',
              'preStatus': {
                  'state': pre['state'],
                  'sourceFileCount': pre['sourceFileCount'],
                  'totalBatches': pre['totalBatches'],
                  'readyBatches': pre['readyBatches'],
                  'totalItems': pre['totalItems'],
                  'canonicalItems': pre['canonicalItems'],
                  'currentCounts': pre['currentCounts'],
              },
              'apply': applied,
              'postStatus': {
                  'state': post['state'],
                  'sourceFileCount': post['sourceFileCount'],
                  'totalBatches': post['totalBatches'],
                  'readyBatches': post['readyBatches'],
                  'totalItems': post['totalItems'],
                  'canonicalItems': post['canonicalItems'],
                  'currentCounts': post['currentCounts'],
              },
              'historyPreserved': True,
              'historyRowCounts': history,
              'representativeContentVerified': True,
              'flywayEnabled': False,
              'destructiveApplyInvoked': True,
          }
          Path('/tmp/public-result.json.tmp').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          Path('/tmp/public-result.json.tmp').replace('/tmp/public-result.json')
          PY

          phase DONE
          SH
          chmod +x /tmp/canonical-apply/run-apply.sh

          cat > /tmp/canonical-apply/wrapper-entrypoint.sh <<'SH'
          #!/bin/sh
          set -u
          (
            /app/run-apply.sh >/tmp/compute.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && [ ! -f /tmp/public-result.json ]; then
              phase=$(cat /tmp/apply-phase 2>/dev/null || echo UNKNOWN)
              invoked=false
              [ -f /tmp/apply-invoked ] && invoked=true
              {
                echo '=== compute ==='
                tail -n 60 /tmp/compute.log 2>/dev/null || true
                echo '=== spring ==='
                tail -n 120 /tmp/java.log 2>/dev/null || true
              } | sed -E \
                -e 's#jdbc:[^ ]+#jdbc:[REDACTED]#g' \
                -e 's#(password|DB_PASSWORD|PGPASSWORD)[=:][^ ]+#\1=[REDACTED]#gi' \
                -e 's#postgres(ql)?://[^@ ]+@#postgresql://[REDACTED]@#gi' \
                >/tmp/diagnostic.txt
              python3 - "$rc" "$phase" "$invoked" <<'PY'
          import json, sys
          from pathlib import Path
          rc, phase, invoked = int(sys.argv[1]), sys.argv[2], sys.argv[3] == 'true'
          diagnostic = Path('/tmp/diagnostic.txt').read_text(encoding='utf-8', errors='replace')[-12000:]
          Path('/tmp/public-result.json').write_text(json.dumps({
              'state':'ERROR', 'exitCode':rc, 'phase':phase, 'diagnostic':diagnostic,
              'contentBaseSha':'ba8c40c4907bbb35fbd662fbc1beb56f64ae7736',
              'destructiveApplyInvoked':invoked, 'flywayEnabled':False
          }, ensure_ascii=False), encoding='utf-8')
          PY
            fi
          ) &
          exec python3 /app/result-server.py
          SH
          chmod +x /tmp/canonical-apply/wrapper-entrypoint.sh

          cat > /tmp/canonical-apply/Dockerfile <<'DOCKER'
          ARG BASE_PREVIEW_IMAGE
          FROM ${BASE_PREVIEW_IMAGE}
          USER root
          RUN apt-get update \
              && apt-get install --no-install-recommends --yes postgresql-client \
              && rm -rf /var/lib/apt/lists/*
          COPY content/backend-engineering/api/questions.json /app/content/backend-engineering/api/questions.json
          COPY content/dsa/search-sort/questions.json /app/content/dsa/search-sort/questions.json
          COPY content/dsa/stack-queue-deque/questions.json /app/content/dsa/stack-queue-deque/questions.json
          COPY content/infrastructure-cloud/compute/questions.json /app/content/infrastructure-cloud/compute/questions.json
          COPY run-apply.sh /app/run-apply.sh
          COPY wrapper-entrypoint.sh /app/wrapper-entrypoint.sh
          RUN chmod +x /app/run-apply.sh /app/wrapper-entrypoint.sh
          USER 10001:10001
          ENTRYPOINT ["/app/wrapper-entrypoint.sh"]
          DOCKER

          docker build --build-arg BASE_PREVIEW_IMAGE="${BASE_PREVIEW_IMAGE}" \
            --tag "${APPLY_IMAGE}" /tmp/canonical-apply
          docker push "${APPLY_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > "${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json, os, sys
          service_path, output_path = sys.argv[1], sys.argv[2]
          service = json.load(open(service_path, encoding='utf-8'))
          wanted = {'DB_URL','DB_USERNAME','DB_PASSWORD','DB_MAX_POOL_SIZE','DB_MIN_IDLE','DB_CONNECTION_TIMEOUT','DB_VALIDATION_TIMEOUT'}
          required = {'DB_URL','DB_USERNAME','DB_PASSWORD'}
          entries = service['spec']['template']['spec']['containers'][0].get('env', [])
          plain = {
              'SPRING_PROFILES_ACTIVE':'local',
              'CSFORGE_AI_ENABLED':'false',
              'SPRING_FLYWAY_ENABLED':'false',
              'SPRING_JPA_HIBERNATE_DDL_AUTO':'validate',
              'PREVIEW_RESULT_TOKEN': os.environ['PREVIEW_RESULT_TOKEN'],
          }
          secrets, found = [], set()
          for item in entries:
              name = item.get('name')
              if name not in wanted:
                  continue
              found.add(name)
              if 'value' in item:
                  plain[name] = item['value']
                  continue
              ref = item.get('valueFrom', {}).get('secretKeyRef', {})
              if not ref.get('name') or not ref.get('key'):
                  raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          missing = required - found
          if missing:
              raise SystemExit('missing DB vars: ' + ','.join(sorted(missing)))
          json.dump(plain, open('/tmp/apply-env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out:
              out.write('secrets=' + ','.join(secrets) + '\n')
          PY
          echo "service_account=${service_account}" >> "${GITHUB_OUTPUT}"

      - name: Deploy private apply service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${APPLY_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --image="${APPLY_IMAGE}" \
            --service-account="${{ steps.prod.outputs.service_account }}" \
            --env-vars-file=/tmp/apply-env.json \
            --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=900 \
            --no-cpu-throttling --cpu-boost \
            --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.prod.outputs.secrets }}")
          fi
          gcloud "${args[@]}"
          actual_url="$(gcloud run services describe "${APPLY_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.url)')"
          test -n "${actual_url}"
          echo "url=${actual_url}" >> "${GITHUB_OUTPUT}"

      - name: Mint apply service ID token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch sanitized apply result
        shell: bash
        env:
          PREVIEW_RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          APPLY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="000"
          for _ in $(seq 1 500); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" \
              --header "X-Preview-Token: ${PREVIEW_RESULT_TOKEN}" \
              "${APPLY_URL}/result" || true)"
            if [[ "${code}" == "200" ]]; then
              break
            fi
            if [[ "${code}" != "202" && "${code}" != "000" ]]; then
              echo "Unexpected result HTTP ${code}"
              cat /tmp/result.json || true
              exit 1
            fi
            sleep 3
          done
          test "${code}" = "200"
          jq . /tmp/result.json
          jq -e '.state == "DONE" and .contentBaseSha == "ba8c40c4907bbb35fbd662fbc1beb56f64ae7736"' /tmp/result.json >/dev/null
          jq -e '.destructiveApplyInvoked == true and .flywayEnabled == false' /tmp/result.json >/dev/null
          jq -e '.apply.success == true and .apply.totals.created == 0 and .apply.totals.errors == 0 and .apply.totals.failed == 0' /tmp/result.json >/dev/null
          jq -e '.postStatus.state == "READY" and .postStatus.readyBatches == .postStatus.totalBatches' /tmp/result.json >/dev/null
          jq -e '.historyPreserved == true and .representativeContentVerified == true' /tmp/result.json >/dev/null

      - name: Upload sanitized apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canonical-apply-${{ env.CONTENT_BASE_SHA }}
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary apply service
        if: always()
        run: gcloud run services delete "${APPLY_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
