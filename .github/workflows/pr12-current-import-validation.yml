name: PR12 current import validation

on:
  push:
    branches: [content/java-core-foundation]
    paths: [.github/workflows/pr12-current-import-validation.yml]

permissions:
  contents: read

jobs:
  validate-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/java-core-foundation

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create temporary current-pack integration test
        shell: bash
        run: |
          cat > backend/src/test/java/com/guseoh/csforge/importcontent/JavaPackCurrentImportValidationTest.java <<'JAVA'
          package com.guseoh.csforge.importcontent;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Comparator;
          import java.util.List;

          import com.guseoh.csforge.importcontent.application.ContentImportApplyService;
          import com.guseoh.csforge.importcontent.application.ContentImportPreviewService;
          import com.guseoh.csforge.importcontent.application.ImportApplyResult;
          import com.guseoh.csforge.importcontent.application.ImportFilesCommand;
          import com.guseoh.csforge.importcontent.application.ImportPreviewResult;
          import com.guseoh.csforge.importcontent.application.ImportSourceFile;
          import org.junit.jupiter.api.Test;
          import org.springframework.beans.factory.annotation.Autowired;
          import org.springframework.boot.test.context.SpringBootTest;
          import org.springframework.jdbc.core.JdbcTemplate;
          import org.springframework.test.context.DynamicPropertyRegistry;
          import org.springframework.test.context.DynamicPropertySource;
          import org.testcontainers.containers.PostgreSQLContainer;
          import org.testcontainers.junit.jupiter.Container;
          import org.testcontainers.junit.jupiter.Testcontainers;

          @Testcontainers
          @SpringBootTest
          class JavaPackCurrentImportValidationTest {
              @Container
              static final PostgreSQLContainer<?> POSTGRES = new PostgreSQLContainer<>("postgres:16.4")
                      .withDatabaseName("csforge_java_pack")
                      .withUsername("csforge")
                      .withPassword("csforge");

              @Autowired ContentImportPreviewService previewService;
              @Autowired ContentImportApplyService applyService;
              @Autowired JdbcTemplate jdbc;

              @DynamicPropertySource
              static void database(DynamicPropertyRegistry registry) {
                  registry.add("spring.datasource.url", POSTGRES::getJdbcUrl);
                  registry.add("spring.datasource.username", POSTGRES::getUsername);
                  registry.add("spring.datasource.password", POSTGRES::getPassword);
              }

              @Test
              void currentJavaPackPreviewApplyAndReimportAreClean() throws Exception {
                  Path root = Path.of("../content/java").toAbsolutePath().normalize();
                  List<Path> paths;
                  try (var stream = Files.walk(root)) {
                      paths = stream
                              .filter(Files::isRegularFile)
                              .filter(path -> path.toString().endsWith(".md") || path.toString().endsWith(".json"))
                              .sorted(Comparator.comparing(path -> root.relativize(path).toString()))
                              .toList();
                  }
                  assertEquals(25, paths.size());

                  List<ImportSourceFile> sources = paths.stream()
                          .map(path -> {
                              try {
                                  return new ImportSourceFile(root.relativize(path).toString().replace('\\', '/'), Files.readAllBytes(path));
                              } catch (java.io.IOException exception) {
                                  throw new java.io.UncheckedIOException(exception);
                              }
                          })
                          .toList();
                  ImportFilesCommand command = new ImportFilesCommand(sources);

                  ImportPreviewResult preview = previewService.preview(command);
                  assertTrue(preview.canApply());
                  assertEquals(139, preview.created());
                  assertEquals(0, preview.updated());
                  assertEquals(0, preview.unchanged());
                  assertEquals(0, preview.errors());

                  ImportApplyResult applied = applyService.apply(command, preview.previewDigest());
                  assertEquals(139, applied.created());
                  assertEquals(0, applied.updated());
                  assertEquals(0, applied.failed());

                  assertEquals(2, jdbc.queryForObject("select count(*) from topic where content_key like 'java.core.%'", Integer.class));
                  assertEquals(22, jdbc.queryForObject("select count(*) from concept where content_key like 'java.core.%'", Integer.class));
                  assertEquals(115, jdbc.queryForObject("select count(*) from question where content_key like 'java.core.%'", Integer.class));
                  assertEquals(460, jdbc.queryForObject("select count(*) from question_choice qc join question q on q.id = qc.question_id where q.content_key like 'java.core.%'", Integer.class));

                  ImportPreviewResult second = previewService.preview(command);
                  assertTrue(second.canApply());
                  assertEquals(0, second.created());
                  assertEquals(0, second.updated());
                  assertEquals(139, second.unchanged());
                  assertEquals(0, second.errors());

                  ImportApplyResult reapplied = applyService.apply(command, second.previewDigest());
                  assertEquals(0, reapplied.created());
                  assertEquals(0, reapplied.updated());
                  assertEquals(139, reapplied.unchanged());
                  assertEquals(0, reapplied.failed());

                  System.out.println("CURRENT_JAVA_PACK_IMPORT_PASS preview=139 apply=139 reimport=139_UNCHANGED topics=2 concepts=22 questions=115 choices=460");
              }
          }
          JAVA

      - name: Run current Java Pack import validation
        working-directory: backend
        run: ./gradlew test --tests 'com.guseoh.csforge.importcontent.JavaPackCurrentImportValidationTest'

      - name: Ensure temporary test was not committed
        run: git status --short
