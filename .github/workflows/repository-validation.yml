name: Repository Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace
      - name: Backend build
        working-directory: backend
        run: ./gradlew build --no-daemon --stacktrace
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Compose validation
        run: |
          docker compose config --quiet
          POSTGRES_PASSWORD=validation-secret docker compose -f compose.prod.yaml config --quiet
          if env -u POSTGRES_PASSWORD docker compose -f compose.prod.yaml config --quiet; then
            echo 'Expected missing-secret failure did not occur' >&2
            exit 1
          fi
      - name: Audit Java learner-facing language
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          candidate_words = {
              'abstraction','application','associative','behavior','binary','bookkeeping','boxing','bucket','buffer',
              'callback','capacity','carrier','cause','collaborator','collection','compile-time','consumer','context',
              'contract','correlation','correctness','coupling','covariance','custom','debugging','decoding','default',
              'destination','encoding','encounter','entry','equality','executor','failure','fallback','filesystem',
              'handler','hash','identity','implementation','invariant','iteration','iterator','key','lazy','library',
              'lifecycle','literal','mapping','mutable','native','offset','parallel','permit','pinning','priority',
              'production','publisher','race','raw','reduction','resource','rewind','runtime','sequential','serialization',
              'setter','shape','shared','signal','snapshot','source','subscriber','subtype','target','task','terminal',
              'thread','token','unchecked','unboxing','unmappable','value','variation','worker','workload','wrapper'
          }
          allowed_lower = {
              'happens-before','lock-free','wait-free','is-a','has-a','null','final','volatile','synchronized',
              'enum','record','sealed','var','instanceof','yield','switch','case','break','continue','return','throw',
              'throws','try','catch','finally','extends','super','this','static','public','protected','private','void',
              'byte','short','int','long','float','double','boolean','char','true','false'
          }
          exact_bad = [
              '하위 수집기(하위 수집기(후속 collector))', '객체 객체', '변수 변수', '원인 원인', '검사 검사',
              '타입 타입', '도달 불가능한한', '인터페이스(인터페이스)', 'List::스트림', 'Stream::스트림'
          ]

          counts = Counter()
          hits = defaultdict(list)
          strong = []
          scanned_fields = 0

          def mask(text: str) -> str:
              text = re.sub(r'```.*?```', ' ', text, flags=re.S)
              text = re.sub(r'`[^`]*`', ' ', text)
              text = re.sub(r'https?://\S+', ' ', text)
              text = re.sub(r'\[[^\]]*\]\([^)]*\)', ' ', text)
              text = re.sub(r'(?<=[가-힣])\([A-Za-z][A-Za-z0-9 ._+/#:-]*\)', ' ', text)
              return text

          def scan(path: str, locator: str, text):
              global scanned_fields
              if not isinstance(text, str) or not text.strip():
                  return
              scanned_fields += 1
              masked = mask(text)
              for bad in exact_bad:
                  if bad in masked:
                      strong.append((path, locator, bad, text.replace('\n', ' ')))
              if re.search(r'::[가-힣]+', masked):
                  strong.append((path, locator, 'translated_method_reference', text.replace('\n', ' ')))
              for token in re.findall(r'(?<![A-Za-z0-9_])([a-z][a-z-]*)(?![A-Za-z0-9_])', masked):
                  t = token.lower()
                  if t in allowed_lower or t not in candidate_words:
                      continue
                  counts[t] += 1
                  hits[t].append((path, locator, text.replace('\n', ' ')))

          curriculum = Path('content/curriculum/java.yaml')
          for i, line in enumerate(curriculum.read_text(encoding='utf-8').splitlines(), 1):
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or ':' not in stripped:
                  continue
              key, value = stripped.split(':', 1)
              if key in {'key','contentKeyPrefix','status','order','level','density','visualization'}:
                  continue
              scan(str(curriculum), f'line {i}:{key}', value.strip().strip('"'))

          topics = Path('content/java/topics.json')
          data = json.loads(topics.read_text(encoding='utf-8'))
          for item in data:
              ck = item.get('contentKey', '?')
              scan(str(topics), ck + '.title', item.get('title'))
              scan(str(topics), ck + '.description', item.get('description'))

          for path in sorted(Path('content/java').rglob('questions.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for q in data:
                  ck = q.get('contentKey', '?')
                  for field in ('promptMarkdown','explanationMarkdown','modelAnswer'):
                      scan(str(path), ck + '.' + field, q.get(field))
                  for idx, answer in enumerate(q.get('acceptedAnswers') or []):
                      scan(str(path), f'{ck}.acceptedAnswers[{idx}]', answer)
                  for choice in q.get('choices') or []:
                      key = choice.get('key', '?')
                      scan(str(path), f'{ck}.choice[{key}].content', choice.get('content'))
                      scan(str(path), f'{ck}.choice[{key}].rationale', choice.get('rationaleMarkdown'))

          for path in sorted(Path('content/java').rglob('*.md')):
              lines = path.read_text(encoding='utf-8').splitlines()
              in_front = bool(lines and lines[0].strip() == '---')
              in_refs = False
              in_code = False
              for i, line in enumerate(lines, 1):
                  if i == 1 and in_front:
                      continue
                  if in_front:
                      if line.strip() == '---':
                          in_front = False
                          continue
                      if re.match(r'^references\s*:', line):
                          in_refs = True
                          continue
                      if in_refs:
                          if line and not line.startswith(' ') and re.match(r'^[A-Za-z][A-Za-z0-9_-]*\s*:', line):
                              in_refs = False
                          else:
                              continue
                      if ':' in line:
                          k, v = line.strip().split(':', 1)
                          if k in {'title','summary','relationNote'}:
                              scan(str(path), f'line {i}:{k}', v.strip().strip('"'))
                      continue
                  if line.strip().startswith('```'):
                      in_code = not in_code
                      continue
                  if not in_code:
                      scan(str(path), f'line {i}', line)

          out = [
              f'SCANNED_FIELDS={scanned_fields}',
              f'STRONG_HITS={len(strong)}',
              f'CANDIDATE_OCCURRENCES={sum(counts.values())}',
              '',
              '=== STRONG HITS ==='
          ]
          for path, locator, bad, text in strong:
              out.append(f'{path} | {locator} | {bad} | {text}')
          out += ['', '=== CANDIDATE COUNTS ===']
          for token, count in counts.most_common():
              out.append(f'{token}\t{count}')
          out += ['', '=== ALL CANDIDATE OCCURRENCES ===']
          for token, count in counts.most_common():
              out.append(f'## {token} ({count})')
              for path, locator, text in hits[token]:
                  out.append(f'{path} | {locator} | {text}')

          Path('java-language-audit.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out[:160]))
          PY
      - name: Upload Java language audit
        uses: actions/upload-artifact@v4
        with:
          name: java-language-audit
          path: java-language-audit.txt
      - name: Upload Java content snapshot
        uses: actions/upload-artifact@v4
        with:
          name: java-content-snapshot
          path: |
            content/curriculum/java.yaml
            content/java

  deploy-backend:
    name: Deploy backend to Cloud Run
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      ARTIFACT_REGISTRY_REPOSITORY: csforge
      IMAGE_URI: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge
      WORKLOAD_IDENTITY_PROVIDER: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
      DEPLOY_SERVICE_ACCOUNT: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend deployment changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$before" "$after" --             backend             content             .github/workflows/repository-validation.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        if: steps.changes.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        if: steps.changes.outputs.deploy == 'true'
        run: docker build -f backend/Dockerfile -t "${IMAGE_URI}:${GITHUB_SHA}" .

      - name: Push backend image
        if: steps.changes.outputs.deploy == 'true'
        run: docker push "${IMAGE_URI}:${GITHUB_SHA}"

      - name: Deploy backend image
        id: deploy
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}:${GITHUB_SHA}" \
            --quiet

          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          echo "url=${service_url}" >> "$GITHUB_OUTPUT"

      - name: Verify readiness
        if: steps.changes.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 "${{ steps.deploy.outputs.url }}/actuator/health/readiness"
