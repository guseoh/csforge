name: Repository Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      r1_postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: csforge_r1_disposable
          POSTGRES_USER: csforge
          POSTGRES_PASSWORD: r1_validation_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csforge -d csforge_r1_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace
      - name: Backend build
        working-directory: backend
        run: ./gradlew build --no-daemon --stacktrace
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Compose validation
        run: |
          docker compose config --quiet
          POSTGRES_PASSWORD=validation-secret docker compose -f compose.prod.yaml config --quiet
          if env -u POSTGRES_PASSWORD docker compose -f compose.prod.yaml config --quiet; then
            echo 'Expected missing-secret failure did not occur' >&2
            exit 1
          fi

      - name: R1 isolated Chromium Reader acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          export R1_PLAYWRIGHT_ROOT="$RUNNER_TEMP/csforge-r1-playwright"
          npm install --silent --prefix "$R1_PLAYWRIGHT_ROOT" --no-save playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f "%{family}\n" "sans:lang=ko" | grep -i "Noto Sans CJK"
          if command -v google-chrome >/dev/null 2>&1; then
            export R1_CHROME_PATH="$(command -v google-chrome)"
          else
            node "$R1_PLAYWRIGHT_ROOT/node_modules/playwright/cli.js" install chromium
          fi
          JAR="$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$JAR"
          DB_URL="jdbc:postgresql://127.0.0.1:5432/csforge_r1_disposable" \
          DB_USERNAME=csforge DB_PASSWORD=r1_validation_local_only \
          CSFORGE_SECURITY_MODE=local SPRING_PROFILES_ACTIVE=default \
          SERVER_PORT=8080 CSFORGE_AI_ENABLED=false \
          java -jar "$JAR" > "$RUNNER_TEMP/r1-backend.log" 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/r1-vite.log" 2>&1) &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 120 "$RUNNER_TEMP/r1-backend.log" || true
            tail -n 80 "$RUNNER_TEMP/r1-vite.log" || true
            exit 1
          fi
          node docs/content-corrections/issue-222-java/browser-check.cjs
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr225-reference-browser-evidence
          path: /tmp/csforge-r1-evidence
          if-no-files-found: warn

  deploy-backend:
    name: Deploy backend to Cloud Run
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      ARTIFACT_REGISTRY_REPOSITORY: csforge
      IMAGE_URI: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge
      WORKLOAD_IDENTITY_PROVIDER: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
      DEPLOY_SERVICE_ACCOUNT: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend deployment changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$before" "$after" --             backend             content             .github/workflows/repository-validation.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        if: steps.changes.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        if: steps.changes.outputs.deploy == 'true'
        run: docker build -f backend/Dockerfile -t "${IMAGE_URI}:${GITHUB_SHA}" .

      - name: Push backend image
        if: steps.changes.outputs.deploy == 'true'
        run: docker push "${IMAGE_URI}:${GITHUB_SHA}"

      - name: Deploy backend image
        id: deploy
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}:${GITHUB_SHA}" \
            --quiet

          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          echo "url=${service_url}" >> "$GITHUB_OUTPUT"

      - name: Verify readiness
        if: steps.changes.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 "${{ steps.deploy.outputs.url }}/actuator/health/readiness"
