name: Repository Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace
      - name: Backend build
        working-directory: backend
        run: ./gradlew build --no-daemon --stacktrace
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Compose validation
        run: |
          docker compose config --quiet
          POSTGRES_PASSWORD=validation-secret docker compose -f compose.prod.yaml config --quiet
          if env -u POSTGRES_PASSWORD docker compose -f compose.prod.yaml config --quiet; then
            echo 'Expected missing-secret failure did not occur' >&2
            exit 1
          fi
