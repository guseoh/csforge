name: Wave A curriculum materialize

on:
  push:
    branches: [content/curriculum-wave-a-core-cs]
    paths: [.github/workflows/wave-a-curriculum-materialize.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/curriculum-wave-a-core-cs
      - name: Decode approved curriculum design
        shell: bash
        run: |
          cat > /tmp/wavea.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/wavea.b64 > /tmp/wavea.tar.bz2
          echo '008e93d5e5d36a066c15555bcbd83575b3167e7933ce06ce114c38db59b32543  /tmp/wavea.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/wavea.tar.bz2 -C content/curriculum
      - name: Commit canonical curriculum files and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'guseoh'
          git config user.email '81723538+guseoh@users.noreply.github.com'
          git add content/curriculum
          git rm .github/workflows/wave-a-curriculum-materialize.yml
          git diff --cached --check
          git commit -m 'docs: define Core CS curriculum Wave A'
          git push origin HEAD:content/curriculum-wave-a-core-cs
