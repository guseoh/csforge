            '종료된 자식은 더 이상 사용자 코드를 실행하지 않지만 부모가 상태를 수집하기 전에는 종료 정보를 담은 엔트리가 좀비로 남을 수 있다. 반복 생성·미회수가 누적되면 프로세스 테이블과 PID 관련 자원을 소비하므로 문제의 본질은 CPU 누수가 아니라 **회수가 빠진 생명주기 관리**다.')
