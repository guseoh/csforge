name: OS process sentence-level rewrite
on:
  push:
    branches: [codex/content-operating-systems-quality]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - name: Rewrite reviewed process questions
        shell: bash
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          p=Path('content/operating-systems/process/questions.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert len(data)==28
          by={q['contentKey']:q for q in data}
          def ident(q):
            return (q['contentKey'],q['questionType'],q['difficulty'],q['status'],copy.deepcopy(q.get('conceptKeys')),copy.deepcopy(q.get('acceptedAnswers')),q.get('correctChoiceKey'),[(c['key'],c['displayOrder']) for c in q.get('choices',[])])
          before=[ident(q) for q in data]
          def setq(key,prompt=None,model=None,explain=None,choices=None):
            q=by[key]
            if prompt is not None:q['promptMarkdown']=prompt
            if model is not None:q['modelAnswer']=model
            if explain is not None:q['explanationMarkdown']=explain
            if choices:
              cm={c['key']:c for c in q['choices']}
              for k,v in choices.items(): cm[k]['content'],cm[k]['rationaleMarkdown']=v

          # Program vs Process
          setq('operating-systems.core.process.program-vs-process.q1',
            '같은 실행 파일을 두 번 실행했을 때 가장 정확한 설명은?',
            explain='프로그램은 저장된 실행 파일이라는 **정적인 코드·데이터 묶음**이고, 프로세스는 그 프로그램을 실행하면서 생긴 **동적인 실행 인스턴스**다. 같은 실행 파일의 일부 읽기 전용 페이지를 공유할 수 있어도 PID, 주소 공간 매핑, 열린 자원과 실행 상태까지 하나가 되는 것은 아니다.',
            choices={
              'A':('실행 파일의 코드 페이지를 공유할 수 있으므로 두 실행의 프로세스 상태도 하나로 공유된다.','읽기 전용 코드 페이지를 공유할 수 있어도 각 실행은 별도의 레지스터·스택·힙·주소 공간 매핑과 프로세스 식별 정보를 가진다. 코드를 공유한다고 실행 상태까지 합쳐지지는 않는다.'),
              'B':('프로그램 파일은 같아도 서로 다른 PID·주소 공간·실행 상태를 가진 프로세스가 만들어질 수 있다.','실행 파일은 정적인 파일이고 실행할 때마다 PID·주소 공간 매핑·실행 상태를 가진 별도 프로세스가 생길 수 있다. 변경되지 않는 코드 페이지 일부를 공유해도 실행 상태는 합쳐지지 않는다.'),
              'C':('같은 실행 파일을 실행하면 두 프로세스의 같은 가상 주소는 항상 같은 물리 프레임을 가리킨다.','서로 다른 프로세스에서 같은 가상 주소 값을 사용해도 각 주소 공간 매핑을 통해 다른 물리 프레임을 가리킬 수 있다. 코드 페이지 공유는 구현과 매핑 규칙의 결과이지 주소 숫자가 같아서 자동으로 생기는 것이 아니다.'),
              'D':('실행 파일이 같으면 운영체제는 두 실행을 같은 PID로 식별한다.','PID는 실행 중인 프로세스 인스턴스를 식별한다. 같은 프로그램을 다시 실행하면 별도의 프로세스와 다른 PID가 생길 수 있다.')})
          setq('operating-systems.core.process.program-vs-process.q2',
            '`execve`가 성공한 경우를 "항상 새 PID의 프로세스를 하나 더 만든다"고 설명하면 안 되는 이유를 설명하라.',
            'Unix 계열 모델에서 `execve`는 성공하면 호출한 현재 프로세스의 프로그램 이미지를 새 실행 이미지로 대체한다. 새 프로세스 생성은 `fork` 같은 생성 단계와 구분해야 하며 `exec` 자체를 새 PID 생성과 동일시하면 안 된다.',
            '`fork`와 `exec`를 한 덩어리로 외우면 **프로세스 생성**과 **프로그램 이미지 교체**가 섞인다. `execve()`가 성공하면 호출한 프로세스 자체가 새 프로그램 이미지를 실행하므로 `exec`라는 동작만으로 별도의 새 PID가 반드시 생기는 것은 아니다.')
          setq('operating-systems.core.process.program-vs-process.q3',
            '같은 Spring Boot JAR를 두 프로세스로 실행했는데 서로 다른 결과를 보였다. 프로그램 파일이 같아도 실행 동작이 달라질 수 있는 상태를 네 가지 이상 제시하라.',
            'PID와 독립된 주소 공간, 환경 변수, 명령줄 인자, 현재 작업 디렉터리, 자격 정보(credentials), 열린 파일·소켓, 스케줄링·자원 상태 등이 다를 수 있다. 프로그램은 정적인 실행 파일이고 프로세스는 이런 실행 상태를 가진 별도 인스턴스다.',
            '같은 JAR라는 사실은 실행 코드의 출처가 같다는 뜻이지 실행 상태까지 같다는 뜻은 아니다. 환경 변수·인자·작업 디렉터리·자격 정보·메모리·파일/소켓·스케줄링 상태가 달라지면 같은 프로그램도 서로 다른 동작을 보일 수 있다.')

          # Address Space
          setq('operating-systems.core.process.process-address-space.q1',
            '두 프로세스가 같은 가상 주소 값을 사용하면 반드시 같은 물리 메모리를 가리키는가?',
            explain='가상 주소는 현재 프로세스의 주소 공간 매핑을 통해 해석된다. 따라서 숫자가 같아도 서로 다른 페이지 테이블 매핑을 거쳐 다른 물리 프레임에 연결될 수 있다. ASLR은 가상 주소 배치를 바꾸는 기술이지 가상 주소를 시스템 전체의 물리 주소로 만드는 규칙이 아니다.',
            choices={
              'A':('ASLR을 사용하지 않으면 같은 가상 주소는 항상 같은 물리 프레임을 뜻한다.','ASLR은 가상 주소 배치를 바꾸지만 ASLR이 없어도 가상 주소는 프로세스별 주소 공간 매핑을 통해 해석된다. 같은 숫자의 주소가 프로세스마다 다르게 매핑될 수 있다.'),
              'B':('그렇다. 가상 주소 값 자체가 시스템 전체에서 하나의 물리 위치를 식별한다.','가상 주소는 시스템 전체에서 통용되는 물리 위치가 아니다. 현재 프로세스의 페이지 테이블이 그 주소가 어떤 물리 프레임에 연결되는지 결정한다.'),
              'C':('같은 가상 주소가 보이면 두 프로세스가 같은 페이지 테이블을 반드시 공유한다.','프로세스마다 페이지 테이블이 따로 있어도 같은 가상 주소 숫자를 사용할 수 있다. 주소 숫자가 같다고 페이지 테이블이나 물리 매핑을 공유한다는 뜻은 아니다.'),
              'D':('아니다. 프로세스별 주소 공간 매핑이 달라 서로 다른 물리 프레임을 가리킬 수 있다.','활성 프로세스의 주소 공간 매핑이 각 가상 주소를 변환한다. 두 프로세스가 같은 숫자의 가상 주소를 사용하면서 서로 다른 물리 프레임을 가리킬 수 있다.')})
          setq('operating-systems.core.process.process-address-space.q2',
            '주소 공간 그림의 코드·데이터·힙·스택 배치를 모든 운영체제와 ABI의 고정된 물리 메모리 배치처럼 해석하면 안 되는 이유를 설명하라.',
            '이 그림은 영역의 역할과 가상 주소 매핑을 이해하기 위한 모델이다. 실제 가상 주소 배치는 아키텍처, 로더, ABI, ASLR, 런타임에 따라 달라질 수 있고 물리 페이지 배치는 별도의 주소 변환으로 결정된다.',
            '교과서의 주소 공간 그림은 영역의 **역할과 관계를 설명하는 추상 모델**이다. 실제 가상 주소 배치는 운영체제·ABI·로더·ASLR 등에 따라 달라지고, 각 가상 페이지가 어느 물리 프레임과 연결되는지는 또 다른 매핑 문제다.')
          setq('operating-systems.core.process.process-address-space.q3',
            'JVM 프로세스의 RSS가 커졌지만 Java 힙 사용률은 낮다. 프로세스 주소 공간 관점에서 추가로 확인할 영역을 설명하라.',
            'Java 힙 외에 스레드 스택, 네이티브 메모리 할당, 직접 버퍼(direct buffer), 메타스페이스와 네이티브 라이브러리 매핑, 메모리 매핑 파일 같은 프로세스 주소 공간 사용처를 확인해야 한다. JVM 힙 하나가 전체 프로세스 메모리를 대표하지 않는다.',
            'RSS는 Java 힙만 세는 지표가 아니라 프로세스가 실제 물리 메모리에 상주시킨 여러 매핑의 영향을 받는다. 따라서 스레드 스택, 네이티브·직접 메모리 할당, 런타임 메타데이터, 공유 라이브러리와 `mmap` 영역 등을 함께 봐야 한다. **JVM 힙 사용률만으로 운영체제가 보는 프로세스 메모리를 설명할 수 없다.**')
          setq('operating-systems.core.process.process-address-space.q4',
            '가상 주소에 매핑이 존재한다는 사실만으로 그 페이지가 현재 물리 RAM에 상주한다고 단정할 수 없는 이유를 설명하라.',
            '요구 페이징(demand paging), 파일 기반 매핑, 쓰기 시 복사(copy-on-write)에서는 가상 매핑과 물리 메모리 상주 여부가 분리될 수 있다. 실제 물리 프레임은 접근 시 페이지 폴트를 통해 준비되거나 다른 매핑과 공유될 수 있다.',
            '가상 주소 공간에 매핑이 존재한다는 사실과 현재 물리 RAM에 상주한다는 사실은 다르다. 요구 페이징에서는 접근 시점에 페이지 폴트를 거쳐 물리 프레임이 준비될 수 있고, 파일 기반 매핑이나 쓰기 시 복사처럼 실제 물리 페이지의 공유·연결 관계도 별도로 존재한다.')

          # PCB
          setq('operating-systems.core.process.pcb.q1',
            'PCB를 특정 운영체제의 실제 구조체 이름과 완전히 같은 개념으로 보면 안 되는 이유는?',
            explain='PCB는 프로세스를 관리하는 데 필요한 커널 측 상태를 이해하기 위한 **개념적 모델**이다. 실제 Linux나 다른 운영체제가 그 정보를 어떤 구조체에 어떻게 나눠 저장하는지는 구현 선택이며, 교과서의 PCB 그림을 특정 커널 구조체와 1:1로 동일시하면 안 된다.',
            choices={
              'A':('PCB는 프로세스 생명주기에 필요한 커널 메타데이터의 개념적 묶음이고 실제 운영체제는 여러 구조에 상태를 나눠 저장할 수 있다.','PCB는 스케줄링 정보와 저장된 실행 상태처럼 프로세스를 관리하는 데 필요한 커널 상태의 개념적 묶음이다. 실제 운영체제는 그 정보를 여러 내부 구조에 나누어 둘 수 있다.'),
              'B':('PCB라는 용어를 쓰는 운영체제라면 PID·스케줄링·메모리 상태가 반드시 하나의 동일한 구조체에 모여 있어야 한다.','교재의 PCB 그림은 정보의 범주를 설명하지 실제 구조체 배치를 강제하지 않는다. 각 운영체제는 구현에 맞춰 프로세스 상태를 구성할 수 있다.'),
              'C':('PCB는 사용자 공간 프로세스가 직접 소유하고 자유롭게 갱신하는 런타임 객체를 뜻한다.','스케줄링·자격 정보·주소 매핑 등에 쓰는 프로세스 제어 상태는 커널이 관리한다. 사용자 공간 코드가 이를 소유하고 자유롭게 갱신할 수 없다.'),
              'D':('PCB의 필드 배치는 ISA가 정하므로 운영체제 구현과 무관하게 동일하다.','ISA는 명령어와 CPU 상태의 동작을 정의하지만 운영체제 내부 자료 구조의 배치를 정하지 않는다. PCB의 실제 필드와 저장 위치는 운영체제 구현의 선택이다.')})
          setq('operating-systems.core.process.pcb.q2',
            '작업 A에서 B로 문맥 전환할 때 커널이 보존·복원하거나 연결해서 관리해야 하는 상태의 종류를 세 가지 이상 설명하라.',
            '재개에 필요한 CPU 실행 문맥, 스케줄링 상태와 사용량 정보, 주소 공간 관계, 작업 식별 정보와 자원 참조 같은 커널 메타데이터가 필요하다. 구체적인 레지스터와 필드의 저장 위치는 운영체제와 아키텍처에 따라 달라질 수 있다.',
            '문맥 전환의 목적은 나중에 작업 A를 **중단 지점에서 다시 실행할 수 있게 상태를 보존**하고 작업 B의 실행 상태를 복원하는 것이다. CPU 문맥뿐 아니라 스케줄러, 주소 공간, 자원 관계처럼 커널이 작업 생명주기를 관리하는 메타데이터도 연결된다.')
          setq('operating-systems.core.process.pcb.q3',
            'Java 스레드 덤프에서 `RUNNABLE`로 보이는 스레드를 "현재 물리 CPU 코어에서 반드시 실행 중"이라고 결론 내리면 안 되는 이유를 운영체제의 작업 상태와 연결해 설명하라.',
            'JVM이 표현하는 스레드 상태와 운영체제 스케줄러가 보는 실제 실행 중(running)·실행 가능(runnable) 상태는 동일한 추상화가 아니다. 실행 가능한 스레드가 CPU 코어보다 많으면 일부는 스케줄러 큐에서 기다릴 수 있으므로 JVM 관찰과 운영체제의 CPU·스케줄러 지표를 함께 봐야 한다.',
            'JVM의 스레드 상태와 운영체제 스케줄러 상태는 서로 다른 계층의 추상화다. JVM에서 `RUNNABLE`로 분류됐다는 사실만으로 특정 순간 CPU 코어 위에서 실행 중이라고 단정할 수 없다. 실제 CPU 경합을 보려면 운영체제의 실행 가능/실행 중 상태와 스케줄러 지표를 함께 확인해야 한다.')

          # Process State
          setq('operating-systems.core.process.process-state.q1',
            '실행할 조건은 충족됐지만 아직 CPU를 배정받지 못한 작업의 교과서적 상태는?',
            explain='**Ready 또는 runnable(실행 가능)**은 실행 조건은 갖췄지만 CPU 실행 기회를 기다리는 상태다. I/O 같은 사건 자체를 기다리는 blocked/waiting 상태와 구분해야 한다.')
          setq('operating-systems.core.process.process-state.q2',
            '`running → ready`와 `waiting → ready` 전이가 각각 어떤 종류의 사건으로 발생할 수 있는지 비교하라.',
            '실행 중인 작업은 타이머 인터럽트나 선점 등으로 CPU에서 내려와 다시 실행 가능 상태가 될 수 있다. 대기 중인 작업은 기다리던 I/O·사건·자원 조건이 충족되면 실행 가능 상태가 된다. 결과 상태는 같아도 전이 원인이 다르다.',
            '두 전이는 결과적으로 ready가 되지만 원인이 다르다. `running → ready`는 작업이 여전히 실행 가능하지만 CPU를 양보하거나 선점당한 경우이고, `waiting → ready`는 이전까지 부족했던 I/O 완료 같은 진행 조건이 충족된 경우다.')
          setq('operating-systems.core.process.process-state.q3',
            '4코어 서버에서 실행 가능한 작업이 100개이고 CPU 사용률도 매우 높다. "100개 작업이 동시에 CPU에서 실행 중"이라는 해석이 왜 틀린지 설명하라.',
            '동시에 실제 CPU에서 실행할 수 있는 작업 수는 CPU 코어 같은 하드웨어 실행 용량에 제한된다. 나머지 작업은 실행 가능한 상태지만 스케줄러의 차례를 기다릴 수 있다. 실행 가능(runnable)과 실제 실행 중(running)을 구분해야 한다.',
            'Runnable은 **지금 실행할 수 있다**는 뜻이지 **지금 CPU 코어에서 실행 중이다**라는 뜻이 아니다. 4개 코어보다 실행 가능한 작업이 훨씬 많으면 많은 작업이 실행 큐에서 차례를 기다릴 수 있으므로 실행 가능 작업 수와 실제 동시 실행 수를 구분해야 한다.')
          setq('operating-systems.core.process.process-state.q4',
            '백엔드 워커 100개가 느릴 때 `실행 가능 큐 증가`와 `대부분 소켓 I/O 대기`가 서로 다른 진단을 요구하는 이유를 설명하라.',
            '실행 가능 큐 증가는 CPU 경합이나 스케줄링 지연 가능성을 시사하지만, I/O 대기는 작업이 완료 사건을 기다려 CPU를 더 줘도 즉시 진행하지 못할 수 있음을 뜻한다. CPU 지표와 대기 원인을 함께 봐야 한다.',
            '같은 "느림"이라도 실행 가능한 작업이 쌓인다면 CPU 실행 기회를 두고 경쟁하는 병목을 의심할 수 있고, I/O 대기가 많다면 CPU를 추가해도 기다리는 외부 사건이 해결되지 않을 수 있다. 따라서 작업 상태는 병목 후보를 가르는 진단 신호다.')

          # Creation
          setq('operating-systems.core.process.process-create.q1',
            'Unix 계열 프로세스 모델에서 `fork`와 `exec`의 역할을 가장 잘 구분한 것은?',
            explain='Unix 계열의 프로세스 생성 흐름에서는 `fork()`가 새 자식 프로세스를 만들고, `exec` 계열은 성공하면 **호출한 현재 프로세스의 프로그램 이미지를 교체**한다. 둘을 구분해야 "새 프로세스 생성"과 "현재 프로세스가 다른 프로그램을 실행하기"를 같은 동작으로 오해하지 않는다.',
            choices={
              'A':('`fork`와 `exec` 모두 항상 새 PID를 하나씩 추가하지만 주소 공간에는 영향을 주지 않는다.','`fork()`는 보통 자체 PID와 주소 공간을 가진 자식을 만든다. 성공한 `exec()`는 호출 프로세스의 프로그램 이미지를 교체한다. 둘 다 PID만 더하고 메모리는 그대로 두는 연산이 아니다.'),
              'B':('`fork`는 기존 프로세스의 프로그램 이미지만 바꾸고 `exec`가 별도 자식을 생성한다.','역할이 뒤바뀌었다. `fork()`가 자식을 만들고, 성공한 `exec()`가 현재 프로세스의 실행 이미지를 바꾼다. `exec()` 자체가 별도 자식을 만들지는 않는다.'),
              'C':('`fork`는 자식 프로세스를 만들고, `exec`는 성공하면 현재 프로세스의 프로그램 이미지를 교체할 수 있다.','`fork()`는 자식 프로세스를 만든다. 성공한 `exec()`는 현재 프로세스에 새 프로그램 이미지를 적재하며 PID는 유지될 수 있다. 두 호출은 프로세스 생성과 프로그램 교체를 나눈다.'),
              'D':('`exec`는 현재 PID를 유지할 수 있지만 기존 프로그램 이미지도 그대로 동시에 실행한다.','성공한 `exec()`는 두 프로그램을 같은 프로세스에서 동시에 실행하는 것이 아니라 현재 실행 이미지를 교체한다. PID는 유지될 수 있지만 이전 프로그램 코드는 더 이상 현재 실행 이미지가 아니다.')})
          setq('operating-systems.core.process.process-create.q2',
            '쓰기 시 복사(copy-on-write)가 `fork 시 모든 물리 페이지를 즉시 복사하지 않아도 된다`는 설명과 어떻게 연결되는지 설명하라.',
            '`fork` 직후 부모와 자식은 논리적으로 독립된 주소 공간을 갖지만 아직 쓰기가 발생하지 않은 물리 페이지를 공유할 수 있다. 한쪽이 페이지를 수정할 때 필요한 페이지를 복사해 독립성을 유지하므로 처음부터 모든 물리 페이지를 복사하는 비용을 피할 수 있다.',
            '중요한 구분은 **논리적인 주소 공간의 독립성**과 **물리 페이지를 처음부터 전부 복사하는가**가 다른 문제라는 점이다. 쓰기 시 복사는 변경이 발생하기 전까지 일부 물리 페이지를 공유하고, 쓰기 시 필요한 페이지만 분리해 `fork`의 독립성을 유지한다.')
          setq('operating-systems.core.process.process-create.q3',
            '다음 `fork` 결과를 생각하자.\n\n- 부모의 fd 3 ─┐\n- 자식의 fd 3  ─┴→ 같은 열린 파일 상태(open file description)\n\n질문: 이 사실이 파일 디스크립터를 완전히 독립된 복사본이라고 보는 설명과 충돌하는 이유를 설명하라.',
            '부모와 자식은 각자 파일 디스크립터 테이블 엔트리를 가지지만 상속된 엔트리가 같은 열린 파일 상태를 참조할 수 있어 파일 오프셋이나 상태 플래그 등이 서로 연관될 수 있다. 자원마다 무엇을 복제하고 무엇을 공유하는지 따로 봐야 한다.',
            '`fork` 뒤 부모와 자식은 각자의 파일 디스크립터 테이블을 가지지만 엔트리가 가리키는 **기반 열린 파일 상태(open file description)는 공유될 수 있다.** 따라서 같은 번호의 fd가 완전히 독립된 복사본이라고 보면 파일 오프셋 같은 연결된 상태를 설명할 수 없다.')
          setq('operating-systems.core.process.process-create.q4',
            '부모가 자식을 만든 직후 자식이 먼저 실행되면 깨지는 코드가 있다. 무엇이 잘못된 가정인지 설명하라.',
            '`fork` 이후 부모와 자식은 별도의 스케줄링 대상이며, 별도 동기화 없이 누가 먼저 실행될지 가정하면 안 된다. 실행 순서가 필요하면 파이프, `wait`, 공유 동기화 등 명시적인 조정 수단을 사용해야 한다.',
            '부모-자식 관계는 실행 순서 보장이 아니다. `fork` 뒤 둘은 독립적인 스케줄링 대상이므로 코드가 특정 순서를 요구한다면 스케줄러의 우연한 실행 순서가 아니라 `wait`·파이프·동기화 같은 명시적인 happens-before 조건을 만들어야 한다.')

          # Termination
          setq('operating-systems.core.process.process-terminate.q1',
            '자식 프로세스가 종료된 뒤 좀비(zombie)로 남아 있다는 설명으로 가장 정확한 것은?',
            explain='좀비는 자식 프로세스의 **실행이 이미 끝난 상태**다. 주소 공간과 파일 디스크립터 같은 주요 실행 자원은 정리됐지만 부모가 종료 상태를 수집할 수 있도록 최소한의 프로세스 엔트리가 남을 수 있으며, `wait` 계열 호출로 회수하면 이 메타데이터도 정리된다.',
            choices={
              'A':('좀비는 부모가 이미 `wait`로 종료 상태를 수집한 뒤에도 같은 메타데이터가 계속 남는 상태다.','부모가 `wait`로 자식의 종료 상태를 수집하면 커널은 남은 프로세스 엔트리를 정리할 수 있다. 회수된 자식은 더 이상 좀비가 아니다.'),
              'B':('좀비는 종료 요청을 받았지만 아직 사용자 코드를 계속 실행 중인 프로세스다.','좀비는 이미 사용자 코드 실행을 끝냈다. 부모가 아직 종료 상태를 수집하지 않은 종료된 자식 프로세스다.'),
              'C':('좀비가 남아 있으면 종료 전의 전체 주소 공간과 모든 열린 파일도 반드시 유지된다.','프로세스가 종료되면 주소 공간과 실행에 필요한 대부분의 자원이 해제된다. 좀비 엔트리에는 부모가 종료 상태를 얻는 데 필요한 제한된 정보만 남는다.'),
              'D':('애플리케이션 실행은 끝났고 주요 자원은 정리됐지만 부모가 종료 상태를 수집하기 위한 최소 메타데이터가 남아 있을 수 있다.','자식은 실행을 마치고 대부분의 자원이 정리되지만 부모가 종료 상태를 수집할 때까지 작은 프로세스 엔트리가 남을 수 있다. 회수(reap)가 남은 메타데이터를 정리한다.')})
          setq('operating-systems.core.process.process-terminate.q2',
            '프로세스 종료 코드와 애플리케이션이 외부 시스템에 이미 반영한 영속적인 부수 효과(side effect)를 같은 것으로 보면 안 되는 이유를 설명하라.',
            '종료 상태는 프로세스 수준의 실행 결과다. 프로세스가 종료되기 전에 DB 쓰기나 외부 API 호출이 이미 반영됐을 수 있으므로 실패 종료가 모든 비즈니스 상태를 되돌린다는 뜻은 아니다. 영속 체크포인트와 멱등성은 프로세스 생명주기 밖에서 별도로 설계해야 한다.',
            '종료 상태는 운영체제가 관찰하는 프로세스 종료 결과이지 DB 트랜잭션이나 외부 시스템 상태를 되돌리는 전역 롤백 신호가 아니다. 프로세스가 실패하기 전에 영속적인 부수 효과가 이미 커밋됐을 수 있으므로 재시도 안전성에는 별도의 멱등성·체크포인트 설계가 필요하다.')
          setq('operating-systems.core.process.process-terminate.q3',
            '배치 워커가 강제 종료된 뒤 같은 작업을 처음부터 다시 실행한다. 어떤 중복 부수 효과 위험이 있고 어떤 상태를 프로세스 밖에 보존해야 하는지 설명하라.',
            '이전 프로세스가 일부 항목을 이미 커밋했을 수 있으므로 재실행 시 중복 DB 쓰기나 메시지가 생길 수 있다. 안정적인 작업·항목 키, 체크포인트, 멱등성 상태처럼 영속적인 진행 정보를 프로세스 메모리 밖에 보존하고 재시도 규칙을 정의해야 한다.',
            '강제 종료는 프로세스 메모리를 없애지만 이미 외부에 커밋된 부수 효과까지 없애지 않는다. **부분 완료 → 프로세스 종료 → 전체 재시도** 순서를 추적하면 중복 DB 쓰기나 메시지가 생길 수 있다. 안정적인 키, 영속 체크포인트, 멱등성 상태가 필요한 이유다.')

          # Parent / Child
          setq('operating-systems.core.process.parent-child.q1',
            '`fork` 이후 부모와 자식의 관계로 옳은 것은?',
            explain='`fork`는 부모와 자식 사이에 여러 상태를 규칙에 따라 복제하거나 연결하지만 둘을 하나의 프로세스로 만드는 것은 아니다. 전용 쓰기 가능 메모리는 논리적으로 분리되고 둘은 별도의 스케줄링 대상이다. 파일 디스크립터처럼 일부 자원은 기반 커널 객체와 연결된 공유 규칙을 가질 수 있다.',
            choices={
              'A':('일부 자원 상태는 규칙에 따라 상속·공유 관계가 남지만 두 프로세스는 별도의 스케줄링 대상이다.','`fork`는 별도로 스케줄링되는 자식을 만들며 일부 자원은 운영체제 규칙에 따라 복사·상속·참조된다. 부모-자식 관계가 부모를 먼저 실행하게 강제하지는 않는다.'),
              'B':('부모와 자식은 `fork` 이후 같은 쓰기 가능 주소 공간을 계속 공동 소유한다.','부모와 자식은 논리적으로 쓰기 주소 공간이 분리된 별도 프로세스다. 쓰기 시 복사가 처음에는 물리 페이지를 공유할 수 있지만 일반적인 전용 메모리 변경은 서로 격리된다.'),
              'C':('부모-자식 관계 자체가 부모의 선행 실행을 보장한다.','`fork` 뒤 스케줄러는 부모나 자식 중 어느 쪽을 먼저 실행할 수도 있고 두 실행은 교차할 수 있다. 부모 관계는 생명주기 연결을 만들지만 실행 순서를 정하지 않는다.'),
              'D':('자식은 부모의 PID와 스케줄러 상태를 그대로 사용하므로 독립적인 프로세스가 아니다.','자식은 자체 프로세스 식별 정보와 스케줄링 상태를 가진다. 일부 파일 디스크립터가 같은 기반 열린 파일 상태를 가리킬 수 있어도 같은 프로세스가 되는 것은 아니다.')})
          setq('operating-systems.core.process.parent-child.q2',
