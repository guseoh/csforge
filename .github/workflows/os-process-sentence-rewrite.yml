            '파이프 EOF는 관련된 모든 쓰기 끝 참조가 닫혔다는 조건과 연결된다. `fork`로 상속된 파일 디스크립터가 다른 프로세스에 남아 있으면 한 쓰기 프로세스가 종료돼도 커널은 쓰기 끝이 아직 열려 있다고 볼 수 있어 읽는 쪽이 EOF를 기다릴 수 있다.',
