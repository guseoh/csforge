name: OS I/O manual pass v3

on:
  push:
    branches: [codex/content-operating-systems-quality]
    paths: ['.github/workflows/os-io-manual-pass-v3.yml']

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite I/O questions 16-30
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'content/operating-systems/io/questions.json';
          const qs = JSON.parse(fs.readFileSync(path, 'utf8'));
          const immutable = q => ({kind:q.kind,contentKey:q.contentKey,questionType:q.questionType,status:q.status,conceptKeys:q.conceptKeys,acceptedAnswers:q.acceptedAnswers,correctChoiceKey:q.correctChoiceKey,choiceShape:q.choices?.map(c=>({key:c.key,displayOrder:c.displayOrder}))});
          const before = qs.map(immutable);
          const byKey = new Map(qs.map(q => [q.contentKey, q]));
          function set(key, patch) {
            const q = byKey.get(key); if (!q) throw new Error(`missing ${key}`);
            for (const [k,v] of Object.entries(patch)) {
              if (k === 'choices') {
                for (const [ck, cv] of Object.entries(v)) {
                  const c = q.choices.find(x => x.key === ck); if (!c) throw new Error(`missing ${key}.${ck}`);
                  if (cv.content !== undefined) c.content = cv.content;
                  if (cv.rationaleMarkdown !== undefined) c.rationaleMarkdown = cv.rationaleMarkdown;
                }
              } else q[k] = v;
            }
          }

          set('operating-systems.core.io.epoll.q1', {
            promptMarkdown:'Linux `epoll`에서 관심 목록(interest list)과 준비 목록(ready list)을 나누는 이유를 가장 잘 설명한 것은?',
            choices:{
              A:{content:'준비 목록이 파일 내용을 애플리케이션 힙에 영구 복제하므로 `read()`가 필요 없기 때문이다',rationaleMarkdown:'`epoll`은 준비 상태를 알려줄 뿐 파일 내용을 애플리케이션 힙에 복사해 두지 않는다. 실제 읽기·쓰기는 애플리케이션이 수행해야 한다.'},
              B:{content:'fd마다 전용 커널 스레드를 만들어 애플리케이션 처리기를 실행하기 때문이다',rationaleMarkdown:'`epoll`은 파일 디스크립터마다 커널 스레드를 만들거나 애플리케이션 처리기를 직접 실행하지 않는다.'},
              C:{content:'등록된 전체 fd와 현재 준비된 fd를 분리해 대부분 유휴 상태인 큰 집합을 효율적으로 다루기 위해서다',rationaleMarkdown:'관심 목록에는 감시할 파일 디스크립터와 사건이 기록되고, 준비 목록에는 그중 현재 처리할 준비가 된 항목이 놓인다.'},
              D:{content:'`epoll_wait()`가 각 fd의 프로토콜 메시지를 완성해 비즈니스 콜백까지 호출하기 때문이다',rationaleMarkdown:'`epoll_wait()`는 준비 사건을 반환할 뿐 프로토콜 메시지를 완성하거나 비즈니스 콜백을 호출하지 않는다.'}
            },
            explanationMarkdown:'`epoll`은 등록된 **관심 집합과 현재 준비된 부분집합을 분리**해 많은 유휴 파일 디스크립터를 다룬다. 준비 사건 뒤 실제 읽기·쓰기와 애플리케이션 처리는 여전히 호출자 책임이다.'
          });
          set('operating-systems.core.io.epoll.q2', {
            promptMarkdown:'edge-triggered `epoll`에서 소켓에 16KiB가 있는데 4KiB만 읽고 다시 사건을 기다리는 구현이 멈출 수 있는 이유를 설명하라.',
            modelAnswer:'남은 데이터가 계속 읽을 수 있는 상태여도 새로운 상태 변화가 생기지 않으면 새 edge가 오지 않을 수 있다. 논블로킹 읽기를 `EAGAIN`이 나올 때까지 처리하고 연결별 파서 상태를 유지해야 한다.',
            explanationMarkdown:'edge-triggered 통지는 상태 변화에 민감하다. 12KiB가 읽히지 않은 채 계속 남아 있어도 **새로운 edge가 발생하지 않을 수 있으므로** 다음 사건만 기다리면 진행이 멈출 수 있다. 현재 가능한 데이터를 `EAGAIN`까지 처리하는 이유다.'
          });
          set('operating-systems.core.io.epoll.q3', {
            difficulty:'MEDIUM',
            promptMarkdown:'이벤트 루프의 상태가 다음과 같다.\n\n- 연결 A: 처리기가 500ms 블로킹 DB 쿼리를 실행한다.\n- 연결 B/C: 이미 준비 사건이 있지만 같은 이벤트 루프가 처리한다.\n\nB/C의 p99 지연 시간도 함께 올라간 이유를 설명하라.',
            modelAnswer:'`epoll`이 준비된 fd를 알려줘도 실제 처리기는 이벤트 루프 스레드가 실행한다. 그 스레드가 블로킹되면 같은 루프가 담당하는 다른 준비 사건 처리도 지연된다. 오래 걸리는 블로킹 작업은 이벤트 루프와 적절히 분리해야 한다.',
            explanationMarkdown:'`epoll`은 준비 상태를 효율적으로 전달할 뿐 애플리케이션 처리기를 자동으로 병렬 실행하지 않는다. 이벤트 루프 스레드가 500ms 동안 DB 대기에 묶이면 **같은 루프의 준비 큐에 있던 다른 연결도 처리 기회를 얻지 못해 꼬리 지연 시간이 함께 증가**한다.'
          });
          set('operating-systems.core.io.epoll.q4', {
            promptMarkdown:'`epoll`을 사용한다는 사실만으로 요청 처리 복잡도가 연결 수와 무관한 `O(1)`이라고 말할 수 없는 이유는?',
            modelAnswer:'등록·삭제, 준비 목록 관리와 깨움, 준비된 사건 수만큼의 처리, 애플리케이션 프로토콜 파싱과 처리기 비용이 남아 있으며 커널 구현과 작업 특성에도 영향을 받는다. `epoll`은 전체 집합 반복 검사 부담을 줄이는 준비 알림 기능이지 종단간 `O(1)` 보장이 아니다.',
            explanationMarkdown:'`epoll`은 매번 전체 fd 집합을 훑는 부담을 줄일 수 있지만 등록·깨움·준비 사건 처리·프로토콜 처리 비용은 남는다. 따라서 **특정 자료구조의 이점을 종단간 요청 처리 `O(1)` 보장으로 확대하면 안 된다.**'
          });

          set('operating-systems.core.io.async-io.q1', {
            promptMarkdown:'완료 기반 비동기 I/O의 일반적인 흐름은?',
            choices:{
              A:{content:'I/O 연산 제출 → 다른 작업 진행 → 나중에 완료 결과 수집',rationaleMarkdown:'완료 기반 I/O는 구체적인 연산을 먼저 제출하고, 애플리케이션은 다른 작업을 진행하다가 나중에 해당 연산의 결과를 수집한다.'},
              B:{content:'준비 사건을 기다린 뒤 애플리케이션이 직접 `read()`/`write()`를 수행하면 완료 기반 비동기 I/O와 같은 흐름이다',rationaleMarkdown:'준비 사건 뒤 실제 I/O를 호출하는 것은 readiness 중심 흐름이다. 연산 자체를 먼저 제출하는 완료 기반 모델과 다르다.'},
              C:{content:'연산을 제출한 뒤 fd의 준비 상태를 먼저 확인해야만 커널이 그 연산을 시작한다',rationaleMarkdown:'완료 기반 제출에서는 연산 수행을 I/O 시설에 맡기므로 별도의 준비 사건을 먼저 기다려야 한다고 일반화할 수 없다.'},
              D:{content:'제출 호출이 성공하면 그 반환값이 최종 I/O 결과이므로 별도 완료 결과가 필요 없다',rationaleMarkdown:'제출 성공은 보통 요청이 접수됐다는 뜻이지 데이터 전송이 끝났다는 뜻은 아니다. 최종 바이트 수나 오류는 완료 결과에서 확인한다.'}
            },
            explanationMarkdown:'완료 기반 모델은 **연산을 먼저 제출하고 다른 일을 진행한 뒤 그 제출의 완료 결과를 받는 흐름**이다. 준비 알림과 다르며 제출 성공 자체도 I/O 완료를 의미하지 않는다.'
          });
          set('operating-systems.core.io.async-io.q2', {
            promptMarkdown:'비동기 읽기를 제출한 직후 목적지 버퍼를 다른 용도로 덮어쓰면 안 될 수 있는 이유를 설명하라.',
            modelAnswer:'API나 런타임에 따라 완료 전까지 처리 중인 I/O가 해당 버퍼를 계속 참조할 수 있다. 버퍼의 생명주기와 소유권 계약을 지키지 않으면 데이터 손상이나 잘못된 결과가 생길 수 있다.',
            explanationMarkdown:'제출과 완료 사이에도 연산 상태가 살아 있다. API가 버퍼 내용을 미리 복사하지 않고 참조한다면 **완료 전에 재사용할 경우 커널·런타임과 애플리케이션이 같은 메모리를 서로 다른 목적으로 사용**해 결과가 깨질 수 있다.'
          });
          set('operating-systems.core.io.async-io.q3', {
            difficulty:'MEDIUM',
            promptMarkdown:'장치가 초당 5,000개 연산만 처리할 수 있는데 애플리케이션이 초당 50,000개의 비동기 요청을 제한 없이 제출한다. 어떤 실패 경로를 예상할 수 있는가?',
            modelAnswer:'처리 중인 요청 큐와 버퍼 메모리가 계속 쌓이고 완료 지연 시간이 급증할 수 있다. 최대 동시 처리 수, 큐 깊이, 유입 제어를 두어 제출 속도를 하위 장치의 완료 처리 능력에 맞춰야 한다.',
            explanationMarkdown:'비동기 I/O는 호출 스레드를 다른 일에 쓰게 할 뿐 장치 처리 용량을 늘리지는 않는다. 제출 속도가 완료 속도의 10배라면 **처리 중인 요청 수·버퍼 메모리·지연 시간이 계속 누적**될 수 있으므로 백프레셔와 제한된 동시 처리 수가 필요하다.'
          });
          set('operating-systems.core.io.async-io.q4', {
            promptMarkdown:'Future의 타임아웃이 발생했다고 실제 비동기 I/O도 반드시 중단됐다고 보면 안 되는 이유는?',
            modelAnswer:'Future 결과를 더 기다리지 않는 상태와 커널·장치 연산이 실제로 취소된 상태는 서로 다르다. 취소 요청과 완료가 경쟁할 수 있고 이미 완료됐을 수도 있으므로 실제 취소 결과와 뒤늦은 완료, 자원 정리를 별도로 처리해야 한다.',
            explanationMarkdown:'애플리케이션 Future의 타임아웃은 결과를 더 기다리지 않겠다는 상태일 수 있다. **커널 연산은 이미 진행 중이거나 취소와 완료가 경쟁할 수 있으므로** 실제 취소 결과와 뒤늦게 도착한 완료·자원 정리를 따로 처리해야 한다.'
          });

          set('operating-systems.core.io.mmap.q1', {
            promptMarkdown:'큰 파일을 `mmap()`한 직후 실제 메모리 상주 상태에 대한 설명으로 맞는 것은?',
            choices:{
              A:{content:'모든 파일 페이지가 즉시 RAM에 상주할 필요는 없고 실제 접근에서 페이지 폴트로 준비될 수 있다',rationaleMarkdown:'`mmap()`은 가상 메모리 매핑을 설정하지만 파일의 모든 페이지를 RAM에 즉시 적재하지는 않는다. 아직 준비되지 않은 페이지에 접근하면 페이지 폴트가 발생할 수 있다.'},
              B:{content:'`mmap()`은 항상 모든 페이지를 RAM에 고정하므로 첫 접근 페이지 폴트가 없다',rationaleMarkdown:'파일을 매핑해도 모든 페이지가 RAM에 고정되거나 전체 파일이 미리 읽히는 것은 아니다.'},
              C:{content:'매핑을 만들면 파일 내용이 프로세스 힙으로 전부 복사되어 페이지 캐시와 무관해진다',rationaleMarkdown:'파일 매핑은 가상 메모리와 파일 backing을 연결하는 것이지 전체 파일을 프로세스 힙으로 복제하는 동작이 아니다.'},
              D:{content:'매핑된 주소는 가상 주소가 아니므로 프로세스별 페이지 테이블을 거치지 않는다',rationaleMarkdown:'`mmap()`으로 얻은 주소도 프로세스 주소 공간의 가상 주소이며 접근 시 주소 변환과 권한 검사를 거친다.'}
            },
            explanationMarkdown:'`mmap()`은 가상 주소 매핑을 만드는 동작이지 전체 파일을 즉시 물리 메모리에 상주시킨다는 뜻이 아니다. **실제 첫 접근에서 페이지 폴트가 발생해 필요한 backing 페이지가 준비**될 수 있다.'
          });
          set('operating-systems.core.io.mmap.q2', {
            promptMarkdown:'`MAP_PRIVATE`와 `MAP_SHARED` 파일 매핑에서 쓰기의 의미를 비교하라.',
            modelAnswer:'`MAP_PRIVATE` 매핑의 쓰기는 쓰기 시 복사(COW)로 프로세스 전용 페이지가 만들어질 수 있어 원본 파일에 같은 변경이 반영되지 않는다. `MAP_SHARED`는 공유 backing의 변경과 연결될 수 있지만 동기화와 영속성은 별도 계약이다.',
            explanationMarkdown:'`MAP_PRIVATE`의 쓰기는 COW로 프로세스 전용 상태를 만들 수 있다. `MAP_SHARED`는 같은 backing 변경을 다른 매핑이 관찰할 수 있지만 **원자성·동기화·장애 후 영속성까지 자동으로 보장하지 않는다.**'
          });
          set('operating-systems.core.io.mmap.q3', {
            promptMarkdown:'`mmap()` 기반 읽기 전용 인덱스가 따뜻한 상태에서는 빠르지만 재시작 직후 p99가 높다. 어떤 운영체제 수준 비용을 의심하고 무엇을 측정할 것인가?',
            modelAnswer:'첫 접근 페이지 폴트와 파일 페이지 적재·readahead 비용을 의심한다. major/minor fault, 저장 장치 읽기, 실제 상주 집합, 접근 지역성과 차가운 상태·따뜻한 상태의 지연 시간을 함께 측정한다.',
            explanationMarkdown:'매핑만 복구되고 작업 집합이 차가운 상태라면 첫 요청이 **페이지 폴트와 저장 장치·페이지 캐시 채우기 비용**을 대신 지불할 수 있다. fault 종류, 저장 장치 읽기, 상주 상태, 접근 패턴을 차가운 구간과 따뜻한 구간으로 나눠 확인해야 한다.'
          });

          set('operating-systems.core.io.sendfile-zero-copy.q1', {
            promptMarkdown:'`sendfile()`이 주로 줄이려는 비용은?',
            choices:{
              A:{content:'저장 장치와 NIC 사이의 모든 물리적 데이터 이동과 장치 처리 자체',rationaleMarkdown:'`sendfile()`은 사용자 공간을 거치는 복사를 줄일 수 있지만 저장 장치와 네트워크 장치 사이의 실제 데이터 이동과 장치 처리가 모두 사라지는 것은 아니다.'},
              B:{content:'파일 데이터가 불필요하게 애플리케이션 사용자 공간 버퍼를 거치는 복사와 시스템 콜 경로',rationaleMarkdown:'적합한 경우 커널이 파일과 출력 대상 사이의 전송을 맡아 사용자 공간 버퍼를 거치는 복사를 줄일 수 있다.'},
              C:{content:'논블로킹 출력에서 생길 수 있는 일부 전송과 백프레셔',rationaleMarkdown:'`sendfile()`도 출력 대상이 지금 받아들일 수 있는 양에 따라 일부만 전송할 수 있으며 백프레셔는 그대로 존재한다.'},
