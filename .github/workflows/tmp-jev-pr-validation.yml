name: Temporary Jev PR Validation

on:
  push:
    branches:
      - feat/jev-review-priority

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/jev-content-quality/package-lock.json
      - name: Install Jev review tooling
        working-directory: experiments/jev-content-quality
        run: npm ci
      - name: Typecheck
        working-directory: experiments/jev-content-quality
        run: npm run typecheck
      - name: Test
        working-directory: experiments/jev-content-quality
        run: npm test
      - name: Validate frozen contracts
        working-directory: experiments/jev-content-quality
        run: npm run validate
