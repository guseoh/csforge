name: One-time Network HTTP production canonical sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-network-http-canonical-sync-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  sync-canonical:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      CLOUD_RUN_SERVICE: csforge
      SYNC_SERVICE: csforge-canonical-network-http-sync-once
      CONTENT_SHA: 7737f6b90e5e949a084926dab654b87912ded923
      EXACT_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-network-http-7737f6b
      SYNC_IMAGE: asia-southeast1-docker.pkg.dev/csforge-508510/csforge/csforge:canonical-network-http-sync-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONTENT_SHA }}
          fetch-depth: 0

      - name: Verify pinned content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTENT_SHA}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and verify exact backend image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build \
            --label "org.opencontainers.image.revision=${CONTENT_SHA}" \
            --label "com.csforge.canonical-content=${CONTENT_SHA}" \
            --file backend/Dockerfile \
            --tag "${EXACT_IMAGE}" \
            .

          cid="$(docker create "${EXACT_IMAGE}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/app/app.jar" /tmp/exact-app.jar
          docker rm -f "${cid}" >/dev/null
          trap - EXIT

          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('content')
          prefix = 'BOOT-INF/classes/canonical-content/'
          with ZipFile('/tmp/exact-app.jar') as jar:
              manifest = jar.read(prefix + 'manifest.txt').decode('utf-8').splitlines()
              if len(manifest) != 870:
                  raise SystemExit(f'expected 870 canonical files, got {len(manifest)}')
              if manifest != sorted(manifest) or len(manifest) != len(set(manifest)):
                  raise SystemExit('canonical manifest is not sorted and unique')
              mismatches = [rel for rel in manifest if (root / rel).read_bytes() != jar.read(prefix + rel)]
              if mismatches:
                  raise SystemExit('packaged canonical content mismatch: ' + ', '.join(mismatches[:10]))
          print(f'canonical files={len(manifest)}, byte mismatches=0')
          PY

          docker push "${EXACT_IMAGE}"

      - name: Build sync wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-sync

          cat > /tmp/canonical-sync/result-server.py <<'PY'
          import hmac
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          TOKEN = os.environ['SYNC_RESULT_TOKEN']
          RESULT = Path('/tmp/public-result.json')
          PORT = int(os.environ.get('PORT', '8080'))

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/result':
                      self.send_response(404); self.end_headers(); return
                  if not hmac.compare_digest(self.headers.get('X-Sync-Token', ''), TOKEN):
                      self.send_response(403); self.end_headers(); return
                  if not RESULT.exists():
                      body = b'{"state":"RUNNING"}'
                      self.send_response(202)
                  else:
                      body = RESULT.read_bytes()
                      self.send_response(200)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, fmt, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', PORT), Handler).serve_forever()
          PY

          cat > /tmp/canonical-sync/run-sync.sh <<'SH'
          #!/bin/bash
          set -euo pipefail

          CONTENT_SHA='7737f6b90e5e949a084926dab654b87912ded923'
          EXPECTED_SOURCE_FILES=870
          EXPECTED_BATCHES=12
          EXPECTED_TOTAL_ITEMS=3380
          EXPECTED_TOPICS=134
          EXPECTED_CONCEPTS=721
          EXPECTED_QUESTIONS=2525
          EXPECTED_AREAS=15

          phase() { printf '%s' "$1" >/tmp/sync-phase; }

          phase START_JAVA
          java -jar /app/app.jar --spring.profiles.active=local --server.port=8081 >/tmp/java.log 2>&1 &
          java_pid=$!
          cleanup() {
            kill "$java_pid" 2>/dev/null || true
            wait "$java_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          phase WAIT_PREFLIGHT
          ok=0
          for _ in $(seq 1 360); do
            code=$(curl --silent --show-error --max-time 300 --output /tmp/pre-status.json --write-out '%{http_code}' \
              http://127.0.0.1:8081/api/canonical-bootstrap/status || true)
            if [[ "$code" == "200" ]]; then ok=1; break; fi
            if ! kill -0 "$java_pid" 2>/dev/null; then exit 21; fi
            sleep 2
          done
          [[ "$ok" -eq 1 ]] || exit 22

          phase ASSERT_PREFLIGHT
          jq -e \
            --argjson files "$EXPECTED_SOURCE_FILES" \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              (.state == "PARTIAL" or .state == "READY") and
              .sourceFileCount == $files and .totalBatches == $batches and
              .readyBatches >= 0 and .readyBatches <= $batches and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/pre-status.json >/dev/null
          pre_state=$(jq -r '.state' /tmp/pre-status.json)

          phase PREPARE_HISTORY_SNAPSHOT
          python3 <<'PY' >/tmp/pg-env
          import os, shlex
          from urllib.parse import urlparse, parse_qs, unquote
          raw = os.environ['DB_URL']
          if raw.startswith('jdbc:'):
              raw = raw[5:]
          parsed = urlparse(raw)
          if parsed.scheme not in {'postgresql', 'postgres'} or not parsed.hostname:
              raise SystemExit('DB_URL is not a supported direct PostgreSQL URL')
          dbname = unquote(parsed.path.lstrip('/'))
          if not dbname:
              raise SystemExit('DB_URL database name is missing')
          values = {
              'PGHOST': parsed.hostname,
              'PGPORT': str(parsed.port or 5432),
              'PGDATABASE': dbname,
              'PGUSER': os.environ['DB_USERNAME'],
              'PGPASSWORD': os.environ['DB_PASSWORD'],
          }
          query = parse_qs(parsed.query)
          if query.get('sslmode'):
              values['PGSSLMODE'] = query['sslmode'][0]
          for key, value in values.items():
              print(f"export {key}={shlex.quote(value)}")
          PY
          . /tmp/pg-env
          rm -f /tmp/pg-env
          export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
          [[ -z "${PGSSLMODE:-}" ]] || export PGSSLMODE
          psql -X -v ON_ERROR_STOP=1 -Atc 'select 1' >/dev/null

          snapshot_history() {
            local dest="$1"
            : >"$dest"
            for table in quiz_session quiz_question attempt wrong_note review_schedule review_history; do
              exists=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.${table}') IS NOT NULL;")
              if [[ "$exists" == "t" ]]; then
                psql -X -v ON_ERROR_STOP=1 -Atc "SELECT '${table}' || E'\\t' || count(*) || E'\\t' || md5(COALESCE(string_agg(md5(row_to_json(t)::text), '' ORDER BY md5(row_to_json(t)::text)), '')) FROM ${table} t;" >>"$dest"
              fi
            done
          }

          snapshot_history /tmp/history-before.tsv

          phase APPLY_FIRST
          : >/tmp/apply-invoked
          curl --silent --show-error --fail-with-body --max-time 1200 \
            --request POST http://127.0.0.1:8081/api/canonical-bootstrap >/tmp/apply-first.json

          phase ASSERT_FIRST_APPLY
          jq -e \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" \
            --argjson areas "$EXPECTED_AREAS" '
              .success == true and .state == "READY" and
              .completedBatches == $batches and
              .totals.created == 0 and .totals.updated >= 0 and .totals.unchanged >= 0 and
              (.totals.updated + .totals.unchanged) == $items and
              .totals.skipped == 0 and .totals.errors == 0 and .totals.failed == 0 and
              .failedBatch == null and .failedKind == null and .failureMessage == null and
              .currentCounts.learningAreas == $areas and .currentCounts.topics == $topics and
              .currentCounts.concepts == $concepts and .currentCounts.questions == $questions
            ' /tmp/apply-first.json >/dev/null
          first_updated=$(jq -r '.totals.updated' /tmp/apply-first.json)
          if [[ "$pre_state" == "PARTIAL" ]]; then
            [[ "$first_updated" -gt 0 ]]
          else
            [[ "$first_updated" -eq 0 ]]
          fi

          phase VERIFY_HISTORY_AFTER_FIRST
          snapshot_history /tmp/history-after-first.tsv
          cmp -s /tmp/history-before.tsv /tmp/history-after-first.tsv

          phase VERIFY_READY_AFTER_FIRST
          curl --silent --show-error --fail-with-body --max-time 900 \
            http://127.0.0.1:8081/api/canonical-bootstrap/status >/tmp/post-status.json
          jq -e \
            --argjson files "$EXPECTED_SOURCE_FILES" \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" \
            --argjson topics "$EXPECTED_TOPICS" \
            --argjson concepts "$EXPECTED_CONCEPTS" \
            --argjson questions "$EXPECTED_QUESTIONS" '
              .state == "READY" and .sourceFileCount == $files and
              .totalBatches == $batches and .readyBatches == $batches and .totalItems == $items and
              .canonicalItems.topics == $topics and .canonicalItems.concepts == $concepts and
              .canonicalItems.questions == $questions
            ' /tmp/post-status.json >/dev/null

          phase VERIFY_REPRESENTATIVE_NETWORK_HTTP_CONTENT
          concept_ok=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM concept WHERE content_key='network-http.core.http-state-intermediary.cookie' AND summary='HTTP 요청 사이에서 사용자 에이전트가 쿠키를 저장하고 조건에 맞는 다음 요청에 다시 보내는 상태 관리 방식을 설명한다.';")
          cookie_q_ok=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM question WHERE content_key='network-http.core.http-state-intermediary.cookie.q1' AND prompt_markdown LIKE '%사용자 에이전트가 다음 요청에 값을 보내는 조건은?%';")
          http2_q_ok=$(psql -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM question WHERE content_key='network-http.core.http-versions.http2-stream.q3' AND prompt_markdown LIKE '%통신 끝점이 한 연결에서 이미 사용한 스트림 ID를 새 스트림에 다시 사용하려 한다%';")
          [[ "$concept_ok" == "1" ]]
          [[ "$cookie_q_ok" == "1" ]]
          [[ "$http2_q_ok" == "1" ]]

          phase APPLY_SECOND_IDEMPOTENCY
          curl --silent --show-error --fail-with-body --max-time 1200 \
            --request POST http://127.0.0.1:8081/api/canonical-bootstrap >/tmp/apply-second.json
          jq -e \
            --argjson batches "$EXPECTED_BATCHES" \
            --argjson items "$EXPECTED_TOTAL_ITEMS" '
              .success == true and .state == "READY" and .completedBatches == $batches and
              .totals.created == 0 and .totals.updated == 0 and .totals.unchanged == $items and
              .totals.skipped == 0 and .totals.errors == 0 and .totals.failed == 0 and
              .failedBatch == null and .failedKind == null and .failureMessage == null
            ' /tmp/apply-second.json >/dev/null

          phase VERIFY_HISTORY_AFTER_SECOND
          snapshot_history /tmp/history-after-second.tsv
          cmp -s /tmp/history-before.tsv /tmp/history-after-second.tsv

          phase BUILD_RESULT
          python3 <<'PY'
          import json
          from pathlib import Path
          pre = json.load(open('/tmp/pre-status.json', encoding='utf-8'))
          first = json.load(open('/tmp/apply-first.json', encoding='utf-8'))
          post = json.load(open('/tmp/post-status.json', encoding='utf-8'))
          second = json.load(open('/tmp/apply-second.json', encoding='utf-8'))
          history = {}
          for line in Path('/tmp/history-after-second.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              table, count, _digest = line.split('\t', 2)
              history[table] = int(count)
          result = {
              'state':'DONE',
              'contentBaseSha':'7737f6b90e5e949a084926dab654b87912ded923',
              'exactJarContentVerified':True,
              'preStatus':pre,
              'firstApply':first,
              'postStatus':post,
              'secondApply':second,
              'historyPreserved':True,
              'historyRowCounts':history,
              'representativeContentVerified':True,
              'idempotencyVerified':True,
              'flywayEnabled':False,
              'applyEndpointInvoked':True,
          }
          Path('/tmp/public-result.json.tmp').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          Path('/tmp/public-result.json.tmp').replace('/tmp/public-result.json')
          PY
          phase DONE
          SH
          chmod +x /tmp/canonical-sync/run-sync.sh

          cat > /tmp/canonical-sync/wrapper-entrypoint.sh <<'SH'
          #!/bin/sh
          set -u
          (
            /app/run-sync.sh >/tmp/compute.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] && [ ! -f /tmp/public-result.json ]; then
              phase=$(cat /tmp/sync-phase 2>/dev/null || echo UNKNOWN)
              invoked=false
              [ -f /tmp/apply-invoked ] && invoked=true
              python3 - "$rc" "$phase" "$invoked" <<'PY'
          import json, sys
          from pathlib import Path
          rc, phase, invoked = int(sys.argv[1]), sys.argv[2], sys.argv[3] == 'true'
          diagnostic = ''
          for path in ['/tmp/compute.log', '/tmp/java.log']:
              p = Path(path)
              if p.exists():
                  diagnostic += p.read_text(encoding='utf-8', errors='replace')[-8000:]
          payload = {
              'state':'ERROR', 'exitCode':rc, 'phase':phase,
              'diagnostic':diagnostic[-12000:],
              'contentBaseSha':'7737f6b90e5e949a084926dab654b87912ded923',
              'applyEndpointInvoked':invoked, 'flywayEnabled':False,
          }
          for name, path in [('preStatus','/tmp/pre-status.json'),('firstApply','/tmp/apply-first.json'),('postStatus','/tmp/post-status.json'),('secondApply','/tmp/apply-second.json')]:
              p = Path(path)
              if p.exists():
                  try:
                      payload[name] = json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      pass
          Path('/tmp/public-result.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
            fi
          ) &
          exec python3 /app/result-server.py
          SH
          chmod +x /tmp/canonical-sync/wrapper-entrypoint.sh

          cat > /tmp/canonical-sync/Dockerfile <<'DOCKER'
          ARG EXACT_IMAGE
          FROM ${EXACT_IMAGE}
          USER root
          RUN apt-get update \
              && apt-get install --no-install-recommends --yes postgresql-client jq python3 \
              && rm -rf /var/lib/apt/lists/*
          COPY result-server.py /app/result-server.py
          COPY run-sync.sh /app/run-sync.sh
          COPY wrapper-entrypoint.sh /app/wrapper-entrypoint.sh
          RUN chmod +x /app/run-sync.sh /app/wrapper-entrypoint.sh
          USER 10001:10001
          ENTRYPOINT ["/app/wrapper-entrypoint.sh"]
          DOCKER

          docker build --build-arg EXACT_IMAGE="${EXACT_IMAGE}" --tag "${SYNC_IMAGE}" /tmp/canonical-sync
          docker push "${SYNC_IMAGE}"

      - name: Create result token
        id: token
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "value=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read production DB configuration
        id: prod
        shell: bash
        env:
          SYNC_RESULT_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json >"${service_json}"
          service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' "${service_json}")"
          test -n "${service_account}"
          python3 - "${service_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json, os, sys
          service_path, output_path = sys.argv[1], sys.argv[2]
          service = json.load(open(service_path, encoding='utf-8'))
          wanted = {'DB_URL','DB_USERNAME','DB_PASSWORD','DB_MAX_POOL_SIZE','DB_MIN_IDLE','DB_CONNECTION_TIMEOUT','DB_VALIDATION_TIMEOUT'}
          required = {'DB_URL','DB_USERNAME','DB_PASSWORD'}
          entries = service['spec']['template']['spec']['containers'][0].get('env', [])
          plain = {
              'SPRING_PROFILES_ACTIVE':'local',
              'CSFORGE_AI_ENABLED':'false',
              'SPRING_FLYWAY_ENABLED':'false',
              'SPRING_JPA_HIBERNATE_DDL_AUTO':'validate',
              'SYNC_RESULT_TOKEN': os.environ['SYNC_RESULT_TOKEN'],
          }
          secrets, found = [], set()
          for item in entries:
              name = item.get('name')
              if name not in wanted:
                  continue
              found.add(name)
              if 'value' in item:
                  plain[name] = item['value']
                  continue
              ref = item.get('valueFrom', {}).get('secretKeyRef', {})
              if not ref.get('name') or not ref.get('key'):
                  raise SystemExit(f'unsupported env source for {name}')
              secrets.append(f"{name}={ref['name']}:{ref['key']}")
          missing = required - found
          if missing:
              raise SystemExit('missing DB vars: ' + ','.join(sorted(missing)))
          json.dump(plain, open('/tmp/sync-env.json','w',encoding='utf-8'))
          with open(output_path,'a',encoding='utf-8') as out:
              out.write('secrets=' + ','.join(secrets) + '\n')
          PY
          echo "service_account=${service_account}" >>"${GITHUB_OUTPUT}"

      - name: Deploy private sync service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(run deploy "${SYNC_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --image="${SYNC_IMAGE}" \
            --service-account="${{ steps.prod.outputs.service_account }}" \
            --env-vars-file=/tmp/sync-env.json \
            --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=1800 \
            --no-cpu-throttling --cpu-boost --no-allow-unauthenticated --quiet)
          if [[ -n "${{ steps.prod.outputs.secrets }}" ]]; then
            args+=(--set-secrets="${{ steps.prod.outputs.secrets }}")
          fi
          gcloud "${args[@]}"
          actual_url="$(gcloud run services describe "${SYNC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          test -n "${actual_url}"
          echo "url=${actual_url}" >>"${GITHUB_OUTPUT}"

      - name: Mint sync service ID token
        id: invoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: github-cloud-run-deployer@csforge-508510.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Fetch and verify sync result
        shell: bash
        env:
          SYNC_RESULT_TOKEN: ${{ steps.token.outputs.value }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          SYNC_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for _ in $(seq 1 700); do
            code="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUD_RUN_ID_TOKEN}" \
              --header "X-Sync-Token: ${SYNC_RESULT_TOKEN}" \
              "${SYNC_URL}/result" || true)"
            if [[ "${code}" == "200" ]]; then
              break
            fi
            if [[ "${code}" != "202" && "${code}" != "000" ]]; then
              cat /tmp/result.json || true
              exit 1
            fi
            sleep 3
          done
          test "${code}" = "200"
          jq . /tmp/result.json
          jq -e '.state == "DONE" and .contentBaseSha == "7737f6b90e5e949a084926dab654b87912ded923"' /tmp/result.json >/dev/null
          jq -e '.exactJarContentVerified == true and .flywayEnabled == false and .applyEndpointInvoked == true' /tmp/result.json >/dev/null
          jq -e '.firstApply.success == true and .firstApply.totals.created == 0 and .firstApply.totals.errors == 0 and .firstApply.totals.failed == 0' /tmp/result.json >/dev/null
          jq -e '.postStatus.state == "READY" and .postStatus.readyBatches == 12' /tmp/result.json >/dev/null
          jq -e '.secondApply.success == true and .secondApply.totals.updated == 0 and .secondApply.totals.unchanged == 3380' /tmp/result.json >/dev/null
          jq -e '.historyPreserved == true and .representativeContentVerified == true and .idempotencyVerified == true' /tmp/result.json >/dev/null

      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-network-http-canonical-sync-evidence
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary sync service
        if: always()
        run: gcloud run services delete "${SYNC_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
