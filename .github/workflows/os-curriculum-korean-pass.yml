name: OS curriculum Korean-first pass

on:
  push:
    branches: [codex/content-operating-systems-quality]
    paths: ['.github/workflows/os-curriculum-korean-pass.yml']

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - name: Rewrite curriculum prose exactly
        shell: bash
        run: |
          git config user.name 'guseoh'
          git config user.email '81723538+guseoh@users.noreply.github.com'
          python3 - <<'PY'
