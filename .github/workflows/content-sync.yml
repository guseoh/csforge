name: Production content synchronization
on:
  workflow_run:
    workflows: [Repository Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Audit is read-only; initialization requires exact reconciliation
        type: choice
        options: [AUDIT, RECOVERY_CHECK, INITIALIZE, APPLY, QUESTION_PLAN, QUESTION_APPLY]
        default: AUDIT
      scope:
        type: choice
        options: [JAVA_CONCEPTS, JAVA_QUESTIONS, ALL_TOPICS, ALL_CONCEPTS]
        default: JAVA_CONCEPTS
      question_source_digest:
        type: string
        required: false
      question_preview_digest:
        type: string
        required: false
      question_selection_digest:
        type: string
        required: false
      question_selected:
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: csforge-production-release
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.mode == 'AUDIT' || inputs.mode == 'RECOVERY_CHECK' || inputs.mode == 'INITIALIZE' || inputs.mode == 'QUESTION_PLAN')) ||
      (vars.CSFORGE_CONTENT_SYNC_ENABLED == 'true' &&
       (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-latest
    environment: production-content-sync
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SYNC_MODE: ${{ inputs.mode || 'APPLY' }}
      SYNC_SCOPE: ${{ inputs.scope || 'JAVA_CONCEPTS' }}
      GCP_PROJECT_ID: csforge-508510
      GCP_REGION: asia-southeast1
      SYNC_JOB: ${{ vars.CSFORGE_CONTENT_SYNC_JOB }}
      QUESTION_SOURCE_DIGEST: ${{ inputs.question_source_digest }}
      QUESTION_PREVIEW_DIGEST: ${{ inputs.question_preview_digest }}
      QUESTION_SELECTION_DIGEST: ${{ inputs.question_selection_digest }}
      QUESTION_SELECTED: ${{ inputs.question_selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # AUDIT still executes an image with production DB access; it requires the same code trust.
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "${{ github.ref }}" = refs/heads/main
          test -n "$SYNC_JOB"
      - name: Inspect OIDC subject metadata
        if: env.SYNC_MODE == 'RECOVERY_CHECK'
        run: python3 infra/content-sync/oidc_subject.py
      - name: Verify live Neon recovery history
        if: env.SYNC_MODE != 'AUDIT' && env.SYNC_MODE != 'QUESTION_PLAN'
        run: python3 infra/content-sync/verify_recovery.py
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: blue-rice-17834735
          NEON_BRANCH_ID: br-billowing-fog-b3myvics
          NEON_DATABASE: neondb
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: env.SYNC_MODE != 'RECOVERY_CHECK'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/1003183509924/locations/global/workloadIdentityPools/github/providers/csforge
          service_account: ${{ vars.CSFORGE_CONTENT_SYNC_EXECUTOR }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: env.SYNC_MODE != 'RECOVERY_CHECK'
      - name: Verify deployment identity and execute
        if: env.SYNC_MODE != 'RECOVERY_CHECK'
        shell: bash
        run: bash infra/content-sync/execute.sh
      - name: Synchronize all topics
        if: github.event_name == 'workflow_run' && vars.CSFORGE_ALL_CONCEPT_SYNC_ENABLED == 'true'
        shell: bash
        env:
          SYNC_MODE: APPLY
          SYNC_SCOPE: ALL_TOPICS
        run: bash infra/content-sync/execute.sh
      - name: Synchronize all concepts
        if: github.event_name == 'workflow_run' && vars.CSFORGE_ALL_CONCEPT_SYNC_ENABLED == 'true'
        shell: bash
        env:
          SYNC_MODE: APPLY
          SYNC_SCOPE: ALL_CONCEPTS
        run: bash infra/content-sync/execute.sh
