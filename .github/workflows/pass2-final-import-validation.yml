name: Fix and validate Pass 2 canonical import

on:
  push:
    branches:
      - content/patch-risk-review-java

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/risk-based-deep-review
          fetch-depth: 0

      - name: Guard expected review head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a34fc6b62ddba3164889c75a171c6f5eeb061f78"

      - name: Normalize shared Reference metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'content/operating-systems/io/mmap.md': [
                  (
                      'recommendation: "process virtual address space에 mapping을 생성하고 protection을 지정하는 Linux mmap semantics를 확인한다."',
                      'recommendation: "Linux mmap의 lazy population과 MAP_POPULATE 같은 explicit prefault 선택지를 구분한다."'
                  ),
              ],
              'content/operating-systems/process/process-address-space.md': [
                  (
                      'recommendation: "process virtual address space에 mapping을 생성하고 protection을 지정하는 Linux mmap semantics를 확인한다."',
                      'recommendation: "Linux mmap의 lazy population과 MAP_POPULATE 같은 explicit prefault 선택지를 구분한다."'
                  ),
              ],
              'content/operating-systems/process/parent-child.md': [
                  (
                      'recommendation: "process 생성과 주소 공간을 확인한다."',
                      'recommendation: "Linux fork가 분리된 address space를 copy-on-write page로 구현하는 경계를 확인한다."'
                  ),
              ],
              'content/operating-systems/process/process-create.md': [
                  (
                      'recommendation: "process 생성과 주소 공간을 확인한다."',
                      'recommendation: "Linux fork가 분리된 address space를 copy-on-write page로 구현하는 경계를 확인한다."'
                  ),
              ],
              'content/operating-systems/threads/java-virtual-thread-boundary.md': [
                  (
                      '    title: "Synchronize Virtual Threads without Pinning"\n    referenceType: OFFICIAL\n    language: en\n    depth: section\n    recommendation: "JDK 24부터 synchronized 영역에서 발생하던 carrier pinning 제약이 어떻게 제거되었는지 확인한다."\n    displayOrder: 2',
                      '    title: "JEP 491: Synchronize Virtual Threads without Pinning"\n    referenceType: OFFICIAL\n    language: en\n    displayOrder: 2'
                  ),
              ],
              'content/backend-engineering/retry/deadline.md': [
                  (
                      "  title: 'gRPC Guide: Deadlines'",
                      "  title: 'gRPC Documentation: Deadlines'"
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  assert count == 1, f'{name}: expected one replacement, found {count}'
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- content/operating-systems content/backend-engineering

      - name: Commit canonical metadata normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            content/operating-systems/io/mmap.md \
            content/operating-systems/process/parent-child.md \
            content/operating-systems/process/process-address-space.md \
            content/operating-systems/process/process-create.md \
            content/operating-systems/threads/java-virtual-thread-boundary.md \
            content/backend-engineering/retry/deadline.md
          git commit -m "content: normalize shared reference metadata"
          git push origin HEAD:content/risk-based-deep-review

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore proven fifteen-area validation test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/validate-fifteen-areas
          mkdir -p backend/src/test/java/com/guseoh/csforge/importcontent
          git show dd9f9ff541a47b94b98f2c432361f1762c6ea28e:backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java \
            > backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java
          test -s backend/src/test/java/com/guseoh/csforge/importcontent/CanonicalFifteenAreaImportValidationTest.java

      - name: Run parser regression
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test --tests com.guseoh.csforge.importcontent.ContentImportParserTest

      - name: Run canonical fifteen-area import validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test --tests com.guseoh.csforge.importcontent.CanonicalFifteenAreaImportValidationTest --info | tee pass2-import-validation.log
          echo 'PASS2_FINAL_IMPORT_VALIDATION status=PASS'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-final-import-validation-fixed
          path: |
            backend/pass2-import-validation.log
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
          if-no-files-found: warn
