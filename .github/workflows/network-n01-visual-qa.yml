name: Network Pilot N01 TCP handshake visual QA

on:
  pull_request:
    paths:
      - 'frontend/src/components/visualization/StepDiagram.tsx'
      - 'frontend/src/components/visualization/TcpHandshakeEditorial*'
      - 'frontend/src/components/visualization/tcp-handshake-editorial.css'
      - 'frontend/src/network-handshake-preview.tsx'
      - 'frontend/network-handshake-preview.html'
      - 'frontend/scripts/network-n01-browser-qa.mjs'
      - '.github/workflows/network-n01-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-handshake-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Typecheck, existing tests and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Capture all TCP states at both themes and desktop widths
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/network-pilot-n01
          (npm run dev -- --host 127.0.0.1 --port 5173 > ../artifacts/network-pilot-n01/vite.log 2>&1) &
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:5173/network-handshake-preview.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/network-n01-browser-qa.mjs
      - name: Upload visual proof and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-n01-qa-${{ github.sha }}
          path: artifacts/network-pilot-n01/
          if-no-files-found: warn
          retention-days: 14
