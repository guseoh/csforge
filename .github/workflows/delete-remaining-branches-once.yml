name: One-time remaining branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-remaining-branches-once.yml

permissions:
  contents: write

jobs:
  delete-remaining-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete remaining stale branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "cloud/provider-deployment"
            "content/backend-final-quality-polish"
            "content/curriculum-wave-a-core-cs"
            "content/java-learning-notes-v2"
            "content/patch-risk-review-java"
            "content/reference-scan-scratch"
            "content/validate-fifteen-areas"
            "content/validate-risk-review-stage3"
            "feat/versioned-local-release"
            "fix/cloud-oauth-error-redirect"
            "fix/wrong-note-cloud-ai-copy-final"
            "fix/wrong-note-cloud-ai-copy-pr"
            "ops/delete-remaining-stale-branches"
            "validation/java-question-v2-batch-05"
            "validation/java-question-v2-batch-06"
            "validation/java-question-v2-polish"
            "validation/network-http-question-v2-descriptive"
            "validation/network-http-question-v2-mc"
            "validation/network-http-question-v2-mc-main"
            "validation/network-http-question-v2-scenario"
            "validation/question-v2-final"
            "validation/versioned-local-release-a"
          )

          failures=()
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              echo "Refusing to delete main." >&2
              exit 2
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              if ! git push origin --delete "${branch}"; then
                failures+=("${branch}")
              fi
            else
              echo "Already absent: ${branch}"
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf 'Failed to delete: %s\n' "${failures[*]}" >&2
            exit 3
          fi

          echo "All remaining stale branches deleted."

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-remaining-branches-once.yml
          git commit -m "chore: remove final one-time branch cleanup workflow"
          git push origin HEAD:main
