name: OS quality ChatGPT audit

on:
  push:
    branches:
      - codex/content-operating-systems-quality

permissions:
  contents: read

jobs:
  audit-korean-first-language:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0

      - name: Audit learner-facing English tokens
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          root = Path("content/operating-systems")
          samples = collections.defaultdict(list)
          counts = collections.Counter()
          locations = []

          token_re = re.compile(r"(?<![A-Za-z0-9_])[A-Za-z][A-Za-z0-9_-]*(?![A-Za-z0-9_])")
          url_re = re.compile(r"https?://\S+")
          inline_code_re = re.compile(r"`[^`]*`")
          fence_re = re.compile(r"```.*?```", re.S)

          def add_text(path, label, text):
              if not isinstance(text, str) or not text.strip():
                  return
              clean = url_re.sub(" ", text)
              clean = fence_re.sub(" ", clean)
              clean = inline_code_re.sub(" ", clean)
              tokens = [m.group(0).lower() for m in token_re.finditer(clean)]
              for token in tokens:
                  counts[token] += 1
                  if len(samples[token]) < 12:
                      snippet = re.sub(r"\s+", " ", text).strip()
                      if len(snippet) > 180:
                          snippet = snippet[:177] + "..."
                      samples[token].append((str(path), label, snippet))

          # Topic manifest and all question learner-facing fields.
          for path in sorted(root.rglob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if path.name == "topics.json":
                  for item in data:
                      add_text(path, item.get("contentKey", "topic") + ":title", item.get("title"))
                      add_text(path, item.get("contentKey", "topic") + ":description", item.get("description"))
                  continue
              if path.name != "questions.json":
                  continue
              for q in data:
                  key = q.get("contentKey", "question")
                  add_text(path, key + ":prompt", q.get("promptMarkdown"))
                  add_text(path, key + ":modelAnswer", q.get("modelAnswer"))
                  add_text(path, key + ":explanation", q.get("explanationMarkdown"))
                  for answer in q.get("acceptedAnswers", []) or []:
                      add_text(path, key + ":acceptedAnswer", answer)
                  for c in q.get("choices", []) or []:
                      ck = c.get("key", "?")
                      add_text(path, f"{key}:choice:{ck}", c.get("content"))
                      add_text(path, f"{key}:rationale:{ck}", c.get("rationaleMarkdown"))

          # Concepts: title/summary in frontmatter + prose body, excluding code fences and inline code.
          for path in sorted(root.rglob("*.md")):
              text = path.read_text(encoding="utf-8")
              body = text
              if text.startswith("---"):
                  parts = text.split("---", 2)
                  if len(parts) == 3:
                      fm, body = parts[1], parts[2]
                      for line in fm.splitlines():
                          stripped = line.strip()
                          if stripped.startswith("title:"):
                              add_text(path, "frontmatter:title", stripped.split(":", 1)[1].strip().strip('"'))
                          elif stripped.startswith("summary:"):
                              add_text(path, "frontmatter:summary", stripped.split(":", 1)[1].strip().strip('"'))
              body = fence_re.sub(" ", body)
              body = inline_code_re.sub(" ", body)
              for i, line in enumerate(body.splitlines(), 1):
                  if line.strip():
                      add_text(path, f"body:{i}", line)

          # Curriculum learner-facing fields only. Avoid keys/slugs/contentKey noise.
          curriculum = Path("content/curriculum/operating-systems.yaml")
          if curriculum.exists():
              for i, line in enumerate(curriculum.read_text(encoding="utf-8").splitlines(), 1):
                  m = re.match(r"\s*(title|description|scope|boundary|learningObjective|learningObjectiveKo|objective|visualization|visualizationNote|note):\s*(.*)$", line)
                  if m:
                      add_text(curriculum, f"{m.group(1)}:{i}", m.group(2).strip().strip('"'))

          print("=== TOP ENGLISH TOKENS IN LEARNER-FACING OS CONTENT ===")
          for token, count in counts.most_common(180):
              print(f"{count:4d} {token}")

          review_terms = [
              "state","resource","application","lifecycle","permission","failure","result","context",
              "process","thread","task","scheduler","runnable","blocked","waiting","ready","owner","waiter",
              "allocation","reclamation","protection","mapping","memory","page","frame","file","descriptor",
              "directory","path","device","driver","queue","completion","readiness","service","server","worker",
              "workload","throughput","latency","fairness","priority","progress","backend","hardware","software",
              "kernel","user","system","operation","event","request","response","object","identity","reference",
              "shared","private","mutable","immutable","runtime","layer","boundary","mechanism","policy"
          ]
          print("\n=== REVIEW TERM SAMPLES ===")
          for token in review_terms:
              if counts[token] == 0:
                  continue
              print(f"\n## {token} ({counts[token]})")
              for path, label, snippet in samples[token]:
                  print(f"- {path} | {label} | {snippet}")
          PY
