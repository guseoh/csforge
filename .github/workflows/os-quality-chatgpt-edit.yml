name: OS quality ChatGPT cleanup

on:
  push:
    branches:
      - codex/content-operating-systems-quality

permissions:
  contents: write

jobs:
  revert-unsafe-bulk-pass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0

      - name: Revert blind terminology replacement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-commit 198c171a2054d437da57bae6f14efe21aa48b664
          git rm .github/workflows/os-quality-chatgpt-edit.yml

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('content/operating-systems')
          topics = json.loads((root / 'topics.json').read_text(encoding='utf-8'))
          concepts = list(root.rglob('*.md'))
          questions = []
          by_key = {}
          for path in root.rglob('questions.json'):
              data = json.loads(path.read_text(encoding='utf-8'))
              questions.extend(data)
              by_key.update({q['contentKey']: q for q in data})

          assert (len(topics), len(concepts), len(questions)) == (12, 97, 331)

          medium_keys = [
              'operating-systems.core.kernel-boundary.os-resource-manager.q3',
              'operating-systems.core.kernel-boundary.privilege-protection.q4',
              'operating-systems.core.kernel-boundary.system-call-flow.q4',
              'operating-systems.core.scheduling.timer-interrupt-preemption.q3',
              'operating-systems.core.scheduling.round-robin.q3',
              'operating-systems.core.race-critical-section.critical-section.q3',
              'operating-systems.core.race-critical-section.spin-vs-block.q3',
              'operating-systems.core.deadlock.deadlock-avoidance.q3',
              'operating-systems.core.deadlock.starvation.q3',
              'operating-systems.core.filesystem.file-descriptor.q3',
              'operating-systems.core.filesystem.open-file-table.q3',
              'operating-systems.core.io.device-io-kernel-path.q3',
              'operating-systems.core.threads.thread-count-workload.q3',
          ]
          for key in medium_keys:
              assert by_key[key]['difficulty'] == 'MEDIUM', (key, by_key[key]['difficulty'])
          assert by_key['operating-systems.core.scheduling.multicore-affinity.q3']['difficulty'] == 'HARD'

          print('inventory: 12 Topics / 97 Concepts / 331 Questions')
          print('difficulty recalibration preserved: 13 MEDIUM, multicore-affinity.q3 HARD')
          PY

          git diff --check
          git add -A
          git commit -m "revert unsafe OS terminology bulk replacement"
          git push origin HEAD:codex/content-operating-systems-quality
