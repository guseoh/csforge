              D:{content:'상대 경로는 마지막 경로 요소만 보고 중간 디렉터리는 해석하지 않는다',rationaleMarkdown:'경로 해석은 마지막 파일 이름만 보는 것이 아니라 디렉터리 계층의 각 경로 요소를 차례로 처리한다. 중간 요소가 마지막 이름을 포함하는 디렉터리를 결정한다.'}
            },
            explanationMarkdown:'상대 경로는 파일 시스템 루트가 아니라 cwd 또는 명시한 디렉터리 파일 디스크립터 같은 **탐색 시작 맥락**에 의존한다. 따라서 문자열이 같아도 시작 디렉터리가 바뀌면 최종 객체가 달라질 수 있다.'
          });
          set('operating-systems.core.filesystem.directory-path.q2', {
