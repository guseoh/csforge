name: OS filesystem manual pass

on:
  push:
    branches: [codex/content-operating-systems-quality]
    paths: ['.github/workflows/os-filesystem-manual-pass.yml']

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-operating-systems-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite filesystem questions 18-33
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'content/operating-systems/filesystem/questions.json';
          const qs = JSON.parse(fs.readFileSync(path, 'utf8'));
          const immutable = q => ({kind:q.kind,contentKey:q.contentKey,questionType:q.questionType,difficulty:q.difficulty,status:q.status,conceptKeys:q.conceptKeys,acceptedAnswers:q.acceptedAnswers,correctChoiceKey:q.correctChoiceKey,choiceShape:q.choices?.map(c=>({key:c.key,displayOrder:c.displayOrder}))});
          const before = qs.map(immutable);
          const byKey = new Map(qs.map(q => [q.contentKey, q]));
          function set(key, patch) {
            const q = byKey.get(key); if (!q) throw new Error(`missing ${key}`);
            for (const [k,v] of Object.entries(patch)) {
              if (k === 'choices') {
                for (const [ck, cv] of Object.entries(v)) {
                  const c = q.choices.find(x => x.key === ck); if (!c) throw new Error(`missing ${key}.${ck}`);
                  if (cv.content !== undefined) c.content = cv.content;
                  if (cv.rationaleMarkdown !== undefined) c.rationaleMarkdown = cv.rationaleMarkdown;
                }
              } else q[k] = v;
            }
          }

          set('operating-systems.core.filesystem.filesystem-block.q1', {
            promptMarkdown:'파일 시스템 블록과 가상 메모리 페이지의 관계를 가장 정확히 설명한 것은?',
            choices:{
              A:{content:'크기가 같을 수도 있지만 영속 저장 공간 할당과 가상 주소 변환이라는 책임은 서로 다르다',rationaleMarkdown:'파일 시스템 블록은 영속 저장 장치에서 파일 데이터를 할당하고 배치하는 단위이고, 가상 메모리 페이지는 가상 주소 변환과 메모리 상주를 다루는 단위다. 크기가 같도록 정할 수는 있어도 두 자료 구조의 책임은 별개다.'},
              B:{content:'크기가 같다면 페이지 테이블이 파일 시스템 블록의 디스크 위치까지 직접 결정하므로 같은 단위다',rationaleMarkdown:'페이지 테이블은 가상 페이지를 물리 프레임으로 변환하며, 저장 장치의 파일 시스템 블록 위치를 정하지 않는다. 두 단위의 크기가 같더라도 가상 메모리와 파일 시스템의 메타데이터 층위가 합쳐지지 않는다.'},
              C:{content:'파일 시스템 블록은 가상 주소 변환 단위이고 페이지는 저장 공간 할당 단위다',rationaleMarkdown:'이 설명은 두 단위의 역할을 뒤바꾼다. 가상 메모리 페이지는 주소 변환과 상주에 쓰이고, 파일 시스템 블록은 영속 파일 데이터를 배치하는 단위다.'},
              D:{content:'파일 시스템 블록과 가상 메모리 페이지는 항상 같은 크기여야 파일 기반 매핑이 가능하다',rationaleMarkdown:'파일 기반 매핑은 커널이 파일 내용과 가상 메모리를 연결하는 기능이다. 파일 시스템 블록 크기와 페이지 크기가 반드시 같아야 하는 것은 아니며 커널이 서로 다른 단위와 오프셋을 처리할 수 있다.'}
            },
            explanationMarkdown:'파일 시스템 블록은 **영속 데이터의 할당·배치 단위**이고, 가상 메모리 페이지는 **주소 변환·상주 단위**다. 크기가 같을 수는 있어도 책임과 메타데이터 계층이 다르며 두 크기가 반드시 같아야 하는 것도 아니다.'
          });
          set('operating-systems.core.filesystem.filesystem-block.q2', {
            promptMarkdown:'블록 크기가 4096바이트일 때 파일 오프셋 9000은 몇 번째 0-based 논리 블록에 있고, 그 블록 내부 오프셋은 몇 바이트인가?',
            explanationMarkdown:'`9000 / 4096`의 몫은 2이고 나머지는 808이다. 따라서 **0-based 논리 블록 2, 블록 내부 오프셋 808바이트**다.'
          });
          set('operating-systems.core.filesystem.filesystem-block.q3', {
            promptMarkdown:'파일 시스템 블록이 4KiB라는 이유만으로 4KiB 파일 쓰기가 전원 손실에도 원자적이라고 결론낼 수 없는 이유를 설명하라.',
            modelAnswer:'파일 시스템의 할당 단위와 장치의 원자적 쓰기·영속성 단위는 서로 다른 계층의 계약이다. 파일 시스템, 블록 계층, 저장 장치가 제공하는 쓰기 순서와 원자성 보장을 별도로 확인해야 한다.',
            explanationMarkdown:'4KiB 파일 시스템 블록은 할당과 탐색 단위에 대한 정보다. **전원 손실 시 원자성은 파일 시스템, 블록 계층, 저장 장치가 제공하는 별도 계약**이므로 크기가 같다는 사실만으로 추론할 수 없다.'
          });

          set('operating-systems.core.filesystem.allocation.q1', {
            promptMarkdown:'연속 할당(contiguous allocation)을 사용하는 파일에서 논리 블록 위치를 찾을 때 얻는 대표적인 이점은?',
            choices:{
              A:{content:'할당 메타데이터가 필요 없어 장애 후에도 매핑을 복구할 필요가 없다',rationaleMarkdown:'연속 할당은 위치 계산을 단순하게 하지만 extent의 시작과 길이 같은 메타데이터는 여전히 필요하다. 장애 복구에서도 할당 메타데이터와 파일 내용의 일관성을 유지해야 한다.'},
              B:{content:'파일이 커질 때 주변 빈 공간과 관계없이 항상 같은 영역에서 확장할 수 있다',rationaleMarkdown:'연속 영역은 인접 공간이 남아 있거나 파일 시스템이 데이터를 옮길 수 있을 때만 제자리에서 확장할 수 있다. 주변 공간 배치와 무관하게 항상 확장된다고 보장할 수 없다.'},
              C:{content:'시작 위치와 논리 오프셋으로 순차·임의 접근 시 블록 위치를 계산하기 쉽다',rationaleMarkdown:'시작 블록과 논리 오프셋이 있으면 파일의 블록 위치를 쉽게 계산할 수 있어 순차 접근과 직접 접근이 단순하다. 대신 인접 영역이 이미 사용 중이면 확장이 어렵고 외부 단편화가 생길 수 있다.'},
              D:{content:'디렉터리 경로 탐색이 없어져 모든 파일 이름이 전역적으로 유일해진다',rationaleMarkdown:'할당 방식은 데이터 블록의 위치에 영향을 주지만 경로명과 이름 공간 규칙을 결정하지 않는다. 디렉터리 탐색과 이름 관리를 위한 메타데이터는 별도로 필요하다.'}
            },
            explanationMarkdown:'연속 할당은 시작 위치와 논리 블록 오프셋으로 위치를 계산하기 쉬워 탐색과 지역성 측면에서 단순하다. 대신 뒤쪽 공간이 없을 때 성장하기 어렵고 **외부 단편화(external fragmentation)** 문제가 생길 수 있다.'
          });
          set('operating-systems.core.filesystem.allocation.q2', {
            promptMarkdown:'연결 할당(linked allocation)과 인덱스 할당(indexed allocation)의 임의 접근 절충을 설명하라.',
            modelAnswer:'연결 할당은 흩어진 블록을 유연하게 이어 쓸 수 있지만 먼 오프셋까지 포인터를 따라가야 할 수 있다. 인덱스 방식은 별도 인덱스 메타데이터로 블록 위치를 빠르게 찾을 수 있지만 인덱스 공간과 추가 메타데이터 접근 비용이 필요하다.',
            explanationMarkdown:'연결 방식은 빈 블록을 유연하게 사용할 수 있지만 N번째 블록을 찾기 위해 연결을 따라가야 할 수 있다. 인덱스 방식은 **블록 위치를 직접 찾기 위한 메타데이터 비용을 지불하고 임의 위치 탐색을 개선**한다.'
          });
          set('operating-systems.core.filesystem.allocation.q3', {
            promptMarkdown:'빈 공간 비트맵에서는 어떤 블록을 사용 가능으로 표시했지만 inode 매핑은 여전히 그 블록을 참조하는 상태로 장애 후 복구됐다. 어떤 위험이 있는가?',
            modelAnswer:'할당기가 같은 블록을 다른 파일에 다시 할당할 수 있어 두 파일이 동일한 블록을 참조하는 손상 위험이 생긴다. 빈 공간 메타데이터와 inode 갱신이 장애 후에도 서로 일관되도록 보장해야 한다.',
            explanationMarkdown:'빈 공간 메타데이터와 inode 매핑이 서로 모순되면 할당기는 사용 중인 블록을 비어 있다고 믿을 수 있다. 그 블록을 다른 파일에 재할당하면 **서로 다른 파일이 같은 저장 블록을 소유하는 손상(corruption)**으로 이어질 수 있다.'
          });

          set('operating-systems.core.filesystem.page-cache.q1', {
            promptMarkdown:'차가운 캐시(cold cache) 상태에서 같은 파일 구간을 두 번 읽었고 두 번째 읽기가 빨랐다. 가장 타당한 설명은?',
            choices:{
              A:{content:'`read()`가 성공하면 전원 손실 뒤에도 데이터가 영속적이라는 뜻이므로 속도가 빨라진다',rationaleMarkdown:'`read()` 성공은 프로세스가 데이터를 받았다는 뜻이지 데이터의 영속성이나 기록 완료를 뜻하지 않는다. 읽기 성능이 빨라진 이유와 영속성은 다른 문제다.'},
              B:{content:'두 번째 읽기부터는 경로명이 파일 내용을 대신 저장하므로 캐시가 필요 없어졌다',rationaleMarkdown:'경로명은 객체를 찾는 이름일 뿐 파일 내용을 저장하거나 캐시를 대신하지 않는다. 커널이 파일 페이지를 메모리에 유지하면 같은 영역을 반복해서 읽을 때 더 빨라질 수 있다.'},
              C:{content:'페이지 캐시는 프로세스마다 완전히 분리되므로 같은 파일을 읽은 다른 프로세스에는 재사용될 수 없다',rationaleMarkdown:'페이지 캐시는 일반적으로 파일 데이터를 보관하는 커널 캐시이므로 파일 시스템과 매핑 조건이 맞으면 여러 프로세스가 같은 캐시된 파일 페이지를 활용할 수 있다.'},
              D:{content:'첫 번째 읽기로 가져온 데이터가 페이지 캐시에 남아 두 번째 저장 장치 읽기를 피했을 수 있다',rationaleMarkdown:'첫 번째 읽기가 커널 페이지 캐시에 해당 파일 페이지를 채웠다면 같은 영역의 후속 읽기는 저장 장치 접근을 줄일 수 있다. 성능 측정에서는 차가운 캐시와 따뜻한 캐시를 구분해야 한다.'}
            },
            explanationMarkdown:'첫 번째 읽기가 저장 장치에서 가져온 파일 페이지가 커널 페이지 캐시에 남아 있으면 이후 같은 영역은 메모리에서 제공될 수 있다. 따라서 벤치마크에서는 **차가운 캐시와 따뜻한 캐시(warm cache)를 구분**해야 한다.'
          });
          set('operating-systems.core.filesystem.page-cache.q2', {
            promptMarkdown:'버퍼링된 쓰기가 페이지 캐시의 더티 페이지에 반영된 상태와 영속 저장 장치에 기록이 끝난 상태를 구분하라.',
            modelAnswer:'더티 페이지는 커널 메모리에 최신 데이터가 있어 같은 시스템에서 다시 읽을 수 있을 수 있지만, 아직 저장 장치로 쓰기 반영(write-back)이 끝나지 않았을 수 있다. 장애 후 보존 여부는 별도의 영속성 경계다.',
            explanationMarkdown:'더티 페이지는 최신 바이트가 커널 메모리에 있다는 뜻이지 영구 저장됐다는 뜻은 아니다. **현재 시스템에서 보이는 상태와 장애 후에도 보존되는 상태를 분리**해 `write-back`이나 `fsync()` 전에는 전원 손실에 대한 영속성을 별도로 판단해야 한다.'
          });
          set('operating-systems.core.filesystem.page-cache.q3', {
            promptMarkdown:'대규모 일회성 스캔 직후 대화형 파일 읽기의 지연 시간과 major fault가 증가했다. 페이지 캐시 관점에서 가능한 원인과 검증 방법을 설명하라.',
            modelAnswer:'대규모 스캔이 기존의 자주 사용되던 파일 페이지를 캐시에서 밀어냈을 수 있다. 스캔 전후의 페이지 상주 상태, 저장 장치 읽기, 메모리 회수, fault 수와 지연 시간을 함께 비교하고 스캔의 묶음 크기나 동시성을 조절한다.',
            explanationMarkdown:'큰 순차 스캔이 물리 메모리를 차지하면서 기존 대화형 작업 집합을 회수시켰다면 이후 요청이 다시 저장 장치 I/O를 유발할 수 있다. **스캔 전후의 상주 상태·메모리 회수·읽기 I/O·fault·꼬리 지연 시간(tail latency)을 시간축으로 함께 비교**해야 가설을 검증할 수 있다.'
          });

          set('operating-systems.core.filesystem.buffering.q1', {
            promptMarkdown:'`BufferedWriter.flush()`의 의미를 가장 정확하게 설명한 것은?',
            choices:{
              A:{content:'`flush()`가 성공하면 해당 파일의 디렉터리 엔트리와 `rename()` 메타데이터도 영속화된다',rationaleMarkdown:'언어 라이브러리의 `flush()`만으로 `rename()` 같은 디렉터리 엔트리 변경이 영속성을 얻지는 않는다. 파일 데이터와 메타데이터를 장애 후에도 보존하려면 플랫폼 계약에 따른 더 아래 계층의 동기화가 필요하다.'},
              B:{content:'커널 더티 페이지와 장치 캐시를 모두 비워 영속 저장 장치에 반드시 기록하는 동작이다',rationaleMarkdown:'`BufferedWriter.flush()`는 라이브러리가 보유한 문자 또는 바이트 버퍼를 다음 계층으로 넘긴다. 커널 페이지 캐시와 장치 캐시까지 모두 비워 영속 저장을 완료한다는 보장은 없다.'},
              C:{content:'사용자 공간 라이브러리 버퍼의 데이터를 다음 스트림으로 전달하는 동작이며 전원 손실에 대한 영속성까지 직접 보장하지는 않는다',rationaleMarkdown:'`BufferedWriter.flush()`는 사용자 공간 버퍼의 내용을 다음 스트림으로 보내 이후 계층이 처리할 수 있게 한다. 전원 손실 뒤에도 데이터가 남는다는 보장까지 제공하지는 않는다.'},
              D:{content:'버퍼를 폐기해 이후 쓰기가 항상 실패하도록 만드는 동작이다',rationaleMarkdown:'`flush()`는 버퍼에 쌓인 출력을 다음 계층으로 보낼 뿐 writer를 닫거나 사용 불능으로 만들지 않는다. 스트림을 닫거나 오류가 발생하지 않는 한 이후에도 계속 쓸 수 있다.'}
            },
