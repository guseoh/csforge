name: Search Validation

on:
  push:
    branches:
      - feat/search
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend compile and tests
        working-directory: backend
        run: |
          chmod +x gradlew
          set +e
          ./gradlew test build --stacktrace --info
          rc=$?
          echo '--- Spring test failure excerpts ---'
          grep -R -n -C 6 'NoSuchBeanDefinitionException\|UnsatisfiedDependencyException' build/test-results/test build/reports/tests/test 2>/dev/null | head -n 240 || true
          exit $rc
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Compose validation
        run: docker compose config --quiet
