# Render placeholders after verifying the existing production target and service account.
# Provisioning/IAM changes are deliberately outside automatic content application.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: csforge-content-sync
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: REPLACE_WITH_EXISTING_VERIFIED_RUNTIME_ACCOUNT
          maxRetries: 0
          timeoutSeconds: '600'
          containers:
            - image: REPLACE_WITH_VERIFIED_IMAGE_DIGEST
              command: [java]
              args:
                - -Dloader.main=com.guseoh.csforgesync.ContentSyncJob
                - -cp
                - /app/app.jar
                - org.springframework.boot.loader.launch.PropertiesLauncher
              resources:
                limits:
                  cpu: '1'
                  memory: 1Gi
              env:
                - name: SYNC_APPLY_ENABLED
                  value: 'false'
                - name: SYNC_QUESTIONS_ENABLED
                  value: 'false'
                - name: SYNC_EXPECTED_DB_HOST
                  value: REPLACE_WITH_VERIFIED_HOST
                - name: SYNC_EXPECTED_DB_NAME
                  value: neondb
                - name: DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_WITH_DB_URL_SECRET
                      key: latest
                - name: DB_USERNAME
                  value: csforge_content_sync
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: csforge-content-sync-db-password
                      key: latest
