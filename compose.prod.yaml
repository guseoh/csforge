name: csforge-prod

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: csforge-frontend:prod

    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16.4

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csforge}
      POSTGRES_USER: ${POSTGRES_USER:-csforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-csforge} -d ${POSTGRES_DB:-csforge}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 60s

    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0

    command:
      - /bin/sh
      - -ec
      - |
          until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
            echo "Waiting for Kafka at kafka:9092..."
            sleep 5
          done

          until /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --create \
              --if-not-exists \
              --topic csforge.search-index.v1 \
              --partitions 1 \
              --replication-factor 1 && \
            /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka:9092 \
              --create \
              --if-not-exists \
              --topic csforge.search-index.v1.DLT \
              --partitions 1 \
              --replication-factor 1; do
            echo "Kafka topic bootstrap failed; retrying in 5s..."
            sleep 5
          done

          echo "Kafka topic bootstrap completed."

    restart: on-failure

  elasticsearch:
    build:
      context: ./infra/elasticsearch
      dockerfile: Dockerfile

    image: csforge-elasticsearch:prod

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: csforge-backend:prod

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-csforge}
      DB_USERNAME: ${POSTGRES_USER:-csforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      CSFORGE_AI_ENABLED: "false"
      SPRING_AI_MODEL_CHAT: "none"
      ELASTICSEARCH_HEALTH_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      CSFORGE_SEARCH_OUTBOX_RELAY_ENABLED: "true"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  elasticsearch-data:
