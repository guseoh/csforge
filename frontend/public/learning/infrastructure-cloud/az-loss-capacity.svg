<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="az-loss-capacity-title az-loss-capacity-desc"><title id="az-loss-capacity-title">장애 영역 손실과 남은 처리 용량</title><desc id="az-loss-capacity-desc">정상 A B 각각 2개 App이 각 100/s 처리. A 손실 후 B의 2개만 남아 상한 200/s, 유입 220/s이면 20/s 초과.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="32" class="h" text-anchor="middle">AZ A 장애 전후 · App당 처리 용량 100건/s</text><text x="230" y="77" class="h" text-anchor="middle">정상</text><text x="730" y="77" class="h" text-anchor="middle">AZ A 손실</text><line x1="480" y1="50" x2="480" y2="370" class="d"/><rect x="35" y="100" width="190" height="155" class="r"/><rect x="235" y="100" width="190" height="155" class="r"/><text x="130" y="128" class="m" text-anchor="middle">AZ A</text><text x="330" y="128" class="m" text-anchor="middle">AZ B</text><rect x="55" y="145" width="150" height="42" class="r"/><text x="130" y="172" class="m" text-anchor="middle">A1 100</text><rect x="55" y="198" width="150" height="42" class="r"/><text x="130" y="225" class="m" text-anchor="middle">A2 100</text><rect x="255" y="145" width="150" height="42" class="r"/><text x="330" y="172" class="m" text-anchor="middle">B1 100</text><rect x="255" y="198" width="150" height="42" class="r"/><text x="330" y="225" class="m" text-anchor="middle">B2 100</text><text x="230" y="294" class="h" text-anchor="middle">총 상한 400/s</text><text x="230" y="330" class="s" text-anchor="middle">모든 의존성 정상 가정</text><rect x="535" y="100" width="190" height="155" class="a"/><rect x="735" y="100" width="190" height="155" class="r"/><text x="630" y="128" class="m" text-anchor="middle">AZ A 중단</text><text x="830" y="128" class="m" text-anchor="middle">AZ B</text><rect x="555" y="145" width="150" height="42" class="r"/><text x="630" y="172" class="m" text-anchor="middle">A1 ×</text><rect x="555" y="198" width="150" height="42" class="r"/><text x="630" y="225" class="m" text-anchor="middle">A2 ×</text><rect x="755" y="145" width="150" height="42" class="r"/><text x="830" y="172" class="m" text-anchor="middle">B1 100</text><rect x="755" y="198" width="150" height="42" class="r"/><text x="830" y="225" class="m" text-anchor="middle">B2 100</text><text x="730" y="294" class="h" text-anchor="middle">남은 상한 200/s</text><text x="730" y="330" class="s" text-anchor="middle">유입 220/s → 20/s 초과</text><text x="480" y="398" class="s" text-anchor="middle">LB 전환 성공 ≠ DB 쓰기 가능 · DB 승격과 연결 복구 별도</text></svg>
