<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="secret-rotation-overlap-title secret-rotation-overlap-desc"><title id="secret-rotation-overlap-title">Secret 교체 · 공존과 폐기 시점</title><desc id="secret-rotation-overlap-desc">이전 credential과 새 credential의 공존을 허용하는 시스템에서 발급, 새 값 읽기, 새 연결 확인 뒤 이전 값을 폐기한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="400"/><text x="480" y="32" class="h" text-anchor="middle">두 자격 증명의 공존을 허용하는 교체 예</text><text x="35" y="108" class="m" text-anchor="start">이전 credential</text><rect x="260" y="78" width="500" height="50" class="a"/><text x="510" y="109" class="s" text-anchor="middle">유효 · 기존 연결/새 인증 가능</text><text x="35" y="205" class="m" text-anchor="start">새 credential</text><rect x="400" y="175" width="490" height="50" class="a"/><text x="645" y="206" class="s" text-anchor="middle">발급 · 배포 · 새 연결 확인</text><line x1="400" y1="65" x2="400" y2="283" class="d"/><text x="400" y="302" class="s" text-anchor="middle">발급</text><line x1="560" y1="65" x2="560" y2="283" class="d"/><text x="560" y="302" class="s" text-anchor="middle">새 값 읽기</text><line x1="760" y1="65" x2="760" y2="283" class="d"/><text x="760" y="302" class="s" text-anchor="middle">이전 값 폐기</text><text x="480" y="345" class="h" text-anchor="middle">실제 인증 성공을 확인한 뒤 이전 자격 증명을 폐기</text><text x="480" y="378" class="s" text-anchor="middle">동시 유효가 불가능한 시스템은 별도 전환·복구 계획 필요</text></svg>
