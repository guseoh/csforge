<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="dns-cache-cutover-title dns-cache-cutover-desc"><title id="dns-cache-cutover-title">DNS 변경과 TTL 공존 구간</title><desc id="dns-cache-cutover-desc">authoritative 레코드 변경 뒤 기존 resolver A의 TTL이 남아 old를 사용하고 B는 새 조회로 new를 사용한다. 기존 경로를 충분히 유지해야 한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="32" class="h" text-anchor="middle">DNS 전환 · 기존 캐시는 즉시 변경되지 않음</text><text x="35" y="110" class="m" text-anchor="start">authoritative</text><rect x="235" y="80" width="245" height="55" class="r"/><text x="357.5" y="113.5" class="m" text-anchor="middle">old endpoint</text><rect x="480" y="80" width="420" height="55" class="a"/><text x="690" y="113.5" class="m" text-anchor="middle">new endpoint</text><text x="35" y="200" class="m" text-anchor="start">Resolver A</text><rect x="235" y="170" width="450" height="55" class="a"/><text x="460" y="203.5" class="m" text-anchor="middle">old · 남은 TTL</text><rect x="685" y="170" width="215" height="55" class="r"/><text x="792.5" y="203.5" class="m" text-anchor="middle">new</text><text x="35" y="290" class="m" text-anchor="start">Resolver B</text><rect x="235" y="260" width="245" height="55" class="r"/><text x="357.5" y="293.5" class="m" text-anchor="middle">old</text><rect x="480" y="260" width="420" height="55" class="r"/><text x="690" y="293.5" class="m" text-anchor="middle">new</text><line x1="480" y1="65" x2="480" y2="330" class="d"/><text x="480" y="350" class="s" text-anchor="middle">레코드 변경</text><line x1="685" y1="145" x2="685" y2="330" class="d"/><text x="685" y="350" class="s" text-anchor="middle">A 캐시 만료</text><text x="480" y="395" class="s" text-anchor="middle">이전·새 endpoint 모두 실제 TLS 검증 및 트래픽 처리 가능 상태 유지</text></svg>
