<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="network-route-policy-boundaries-title network-route-policy-boundaries-desc"><title id="network-route-policy-boundaries-title">네트워크 접근 · 경로와 허용 규칙</title><desc id="network-route-policy-boundaries-desc">Internet에서 공개 LB를 통해 private App과 DB에 연결하는 예. App egress는 NAT 또는 endpoint 등 별도 경로. AWS 보안 그룹은 EC2 metadata 트래픽을 필터하지 않는다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="445"/><text x="480" y="32" class="h" text-anchor="middle">AWS VPC 경로 예 · 접근 허용은 별도 판단</text><rect x="50" y="88" width="175" height="48" class="r"/><text x="137.5" y="118" class="m" text-anchor="middle">Internet</text><rect x="285" y="58" width="630" height="294" class="r"/><text x="310" y="83" class="s" text-anchor="start">VPC</text><rect x="315" y="105" width="225" height="50" class="a"/><text x="427.5" y="136" class="m" text-anchor="middle">공개 LB</text><rect x="655" y="105" width="230" height="50" class="r"/><text x="770" y="136" class="m" text-anchor="middle">App (private)</text><rect x="655" y="258" width="230" height="50" class="r"/><text x="770" y="289" class="m" text-anchor="middle">DB (private)</text><line x1="225" y1="112" x2="315" y2="130" class="strong" marker-end="url(#arr)"/><line x1="540" y1="130" x2="655" y2="130" class="strong" marker-end="url(#arr)"/><text x="597" y="117" class="s" text-anchor="middle">App 포트</text><line x1="770" y1="155" x2="770" y2="258" class="strong" marker-end="url(#arr)"/><text x="785" y="207" class="s" text-anchor="start">DB 포트</text><path d="M655 145 H590 V230 H535" class="d" marker-end="url(#arr)"/><rect x="315" y="205" width="220" height="48" class="r"/><text x="425" y="235" class="m" text-anchor="middle">NAT / endpoint</text><text x="425" y="279" class="s" text-anchor="middle">필요한 외부 의존성</text><text x="480" y="385" class="h" text-anchor="middle">경로·주소·보안 규칙이 모두 맞아야 도달 가능</text><text x="480" y="418" class="s" text-anchor="middle">SG는 EC2 metadata 트래픽을 필터하지 않음 · 별도 제어 및 URL 검증</text></svg>
