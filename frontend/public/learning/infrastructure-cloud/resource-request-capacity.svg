<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="resource-request-capacity-title resource-request-capacity-desc"><title id="resource-request-capacity-title">스케줄링 요청과 실행 제한</title><desc id="resource-request-capacity-desc">노드 allocatable CPU4 메모리8, A 1/2 B2/4 요청을 빼면 CPU1 메모리2가 남는다. CPU 제한과 메모리 OOM 및 노드 압박 축출은 별도.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="32" class="h" text-anchor="middle">노드 allocatable: 4 CPU / 8 GiB · 다른 예약 없음</text><text x="35" y="122" class="m" text-anchor="start">CPU</text><rect x="235" y="90" width="162.5" height="54" class="a"/><text x="316.25" y="123" class="m" text-anchor="middle">A: 1 CPU</text><rect x="397.5" y="90" width="325" height="54" class="r"/><text x="560" y="123" class="m" text-anchor="middle">B: 2 CPU</text><rect x="722.5" y="90" width="162.5" height="54" class="r"/><text x="803.75" y="123" class="m" text-anchor="middle">남은 1 CPU</text><text x="560" y="172" class="s" text-anchor="middle">Pod C는 남은 자원 범위에 들어야 함</text><text x="35" y="247" class="m" text-anchor="start">메모리</text><rect x="235" y="215" width="162.5" height="54" class="a"/><text x="316.25" y="248" class="m" text-anchor="middle">A: 2 GiB</text><rect x="397.5" y="215" width="325" height="54" class="r"/><text x="560" y="248" class="m" text-anchor="middle">B: 4 GiB</text><rect x="722.5" y="215" width="162.5" height="54" class="r"/><text x="803.75" y="248" class="m" text-anchor="middle">남은 2 GiB</text><text x="560" y="297" class="s" text-anchor="middle">Pod C는 남은 자원 범위에 들어야 함</text><text x="480" y="369" class="h" text-anchor="middle">실행 시 제한: CPU는 throttling · 메모리는 OOM 종료 가능</text><text x="480" y="402" class="s" text-anchor="middle">request는 배치 기준이지 사용 상한이 아님 · 노드 압박에 따른 축출은 별도</text></svg>
