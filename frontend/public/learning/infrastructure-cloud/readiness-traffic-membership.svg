<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="readiness-traffic-membership-title readiness-traffic-membership-desc"><title id="readiness-traffic-membership-title">상태 확인과 트래픽 대상</title><desc id="readiness-traffic-membership-desc">Pod A C readiness 성공, B 실패. 모든 Pod liveness 성공. 일반 Service 트래픽은 A C에 전달하며 B는 readiness 때문에 제외된다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="435"/><text x="480" y="32" class="h" text-anchor="middle">프로세스가 살아 있어도 트래픽 대상이 아닐 수 있음</text><text x="35" y="103" class="m" text-anchor="start">Pod</text><rect x="245" y="72" width="200" height="52" class="r"/><text x="345" y="104" class="m" text-anchor="middle">Pod A</text><rect x="463" y="72" width="200" height="52" class="a"/><text x="563" y="104" class="m" text-anchor="middle">Pod B</text><rect x="681" y="72" width="200" height="52" class="r"/><text x="781" y="104" class="m" text-anchor="middle">Pod C</text><text x="35" y="180" class="m" text-anchor="start">readiness</text><text x="345" y="180" class="m" text-anchor="middle">성공</text><text x="563" y="180" class="m" text-anchor="middle">실패</text><text x="781" y="180" class="m" text-anchor="middle">성공</text><text x="35" y="245" class="m" text-anchor="start">liveness</text><text x="345" y="245" class="m" text-anchor="middle">성공</text><text x="563" y="245" class="m" text-anchor="middle">성공</text><text x="781" y="245" class="m" text-anchor="middle">성공</text><rect x="305" y="312" width="520" height="52" class="a"/><text x="565" y="344" class="m" text-anchor="middle">Service → A, C로 일반 트래픽</text><path d="M420 312 V282 H238 V98 H245" class="strong" marker-end="url(#arr)"/><path d="M710 312 V282 H925 V98 H881" class="strong" marker-end="url(#arr)"/><text x="563" y="292" class="s" text-anchor="middle">B 제외</text><text x="480" y="410" class="s" text-anchor="middle">readiness 실패 ≠ 컨테이너 재시작 · liveness 실패 기준은 별도</text></svg>
