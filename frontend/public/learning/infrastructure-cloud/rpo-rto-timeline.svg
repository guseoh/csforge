class="s" text-anchor="middle">작업 시작</text><text x="915" y="105" class="s" text-anchor="end">정상화</text><rect x="90" y="210" width="165" height="44" class="a"/><text x="172" y="239" class="m" text-anchor="middle">15분</text><text x="172" y="278" class="s" text-anchor="middle">데이터 손실 범위</text><rect x="255" y="300" width="660" height="48" class="a"/><text x="585" y="330" class="m" text-anchor="middle">서비스 중단 60분</text><rect x="310" y="366" width="605" height="45" class="r"/><text x="612" y="394" class="m" text-anchor="middle">복구 작업 55분</text><text x="480" y="450" class="s" text-anchor="middle">실제 손실·중단을 목표 RPO/RTO와 비교 · 목표와 실측은 다름</text></svg>
