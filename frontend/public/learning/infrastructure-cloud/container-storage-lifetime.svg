<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="container-storage-lifetime-title container-storage-lifetime-desc"><title id="container-storage-lifetime-title">실행 단위와 저장 상태 수명</title><desc id="container-storage-lifetime-desc">동일 Docker 컨테이너 재시작은 기존 writable layer를 유지한다. 새 컨테이너는 새 layer를 쓰고 동일 named volume을 재연결할 수 있다. Kubernetes emptyDir는 Pod 수명에 속한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="460"/><text x="480" y="32" class="h" text-anchor="middle">동일 이미지 · 실행 인스턴스와 저장소 수명</text><text x="240" y="80" class="h" text-anchor="middle">동일 Docker 컨테이너 재시작</text><rect x="95" y="108" width="290" height="46" class="r"/><text x="240" y="137" class="m" text-anchor="middle">Container A</text><rect x="95" y="165" width="290" height="46" class="a"/><text x="240" y="194" class="m" text-anchor="middle">기존 쓰기 계층</text><rect x="95" y="218" width="290" height="46" class="r"/><text x="240" y="247" class="m" text-anchor="middle">이미지 (읽기 전용)</text><text x="240" y="294" class="s" text-anchor="middle">유지</text><rect x="95" y="316" width="290" height="48" class="r"/><text x="240" y="346" class="m" text-anchor="middle">동일 named volume</text><line x1="385" y1="131" x2="435" y2="131" class="l"/><path d="M435 131 V340 H385" class="d" marker-end="url(#arr)"/><text x="720" y="80" class="h" text-anchor="middle">Docker 컨테이너 재생성</text><rect x="575" y="108" width="290" height="46" class="r"/><text x="720" y="137" class="m" text-anchor="middle">Container B</text><rect x="575" y="165" width="290" height="46" class="a"/><text x="720" y="194" class="m" text-anchor="middle">새 쓰기 계층</text><rect x="575" y="218" width="290" height="46" class="r"/><text x="720" y="247" class="m" text-anchor="middle">이미지 (읽기 전용)</text><text x="720" y="294" class="s" text-anchor="middle">기존 A 데이터 미승계</text><rect x="575" y="316" width="290" height="48" class="r"/><text x="720" y="346" class="m" text-anchor="middle">동일 named volume</text><line x1="865" y1="131" x2="915" y2="131" class="l"/><path d="M915 131 V340 H865" class="d" marker-end="url(#arr)"/><line x1="480" y1="60" x2="480" y2="375" class="d"/><text x="480" y="410" class="s" text-anchor="middle">볼륨을 삭제하지 않고 동일 볼륨을 다시 연결하는 경우</text><text x="480" y="439" class="s" text-anchor="middle">Kubernetes: 컨테이너 재시작 시 Pod의 emptyDir 유지 · Pod 제거 시 삭제</text></svg>
