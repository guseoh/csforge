<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="rolling-ready-slots-title rolling-ready-slots-desc"><title id="rolling-ready-slots-title">Rolling update · 준비된 인스턴스 교체</title><desc id="rolling-ready-slots-desc">세 서비스 슬롯이 v1에서 v2로 한 번에 하나씩 교체되는 준비 완료 상태의 예. 실제 중간 단계는 surge/unavailable 설정에 의존.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="475"/><text x="480" y="32" class="h" text-anchor="middle">Rolling update · 3개 서비스 슬롯의 상태 변화</text><text x="40" y="99" class="m" text-anchor="start">T0</text><rect x="150" y="70" width="180" height="48" class="r"/><text x="240" y="100" class="m" text-anchor="middle">v1 ready</text><rect x="350" y="70" width="180" height="48" class="r"/><text x="440" y="100" class="m" text-anchor="middle">v1 ready</text><rect x="550" y="70" width="180" height="48" class="r"/><text x="640" y="100" class="m" text-anchor="middle">v1 ready</text><text x="870" y="100" class="s" text-anchor="middle">이전</text><text x="40" y="182" class="m" text-anchor="start">T1</text><rect x="150" y="153" width="180" height="48" class="r"/><text x="240" y="183" class="m" text-anchor="middle">v1 ready</text><rect x="350" y="153" width="180" height="48" class="r"/><text x="440" y="183" class="m" text-anchor="middle">v1 ready</text><rect x="550" y="153" width="180" height="48" class="a"/><text x="640" y="183" class="m" text-anchor="middle">v2 ready</text><text x="870" y="183" class="s" text-anchor="middle">공존</text><text x="40" y="265" class="m" text-anchor="start">T2</text><rect x="150" y="236" width="180" height="48" class="r"/><text x="240" y="266" class="m" text-anchor="middle">v1 ready</text><rect x="350" y="236" width="180" height="48" class="a"/><text x="440" y="266" class="m" text-anchor="middle">v2 ready</text><rect x="550" y="236" width="180" height="48" class="a"/><text x="640" y="266" class="m" text-anchor="middle">v2 ready</text><text x="870" y="266" class="s" text-anchor="middle">공존</text><text x="40" y="348" class="m" text-anchor="start">T3</text><rect x="150" y="319" width="180" height="48" class="a"/><text x="240" y="349" class="m" text-anchor="middle">v2 ready</text><rect x="350" y="319" width="180" height="48" class="a"/><text x="440" y="349" class="m" text-anchor="middle">v2 ready</text><rect x="550" y="319" width="180" height="48" class="a"/><text x="640" y="349" class="m" text-anchor="middle">v2 ready</text><text x="870" y="349" class="s" text-anchor="middle">신규</text><text x="480" y="427" class="s" text-anchor="middle">새 인스턴스 준비 확인 → 이전 인스턴스 drain · 공존 스키마 필요</text><text x="480" y="452" class="s" text-anchor="middle">실제 rolling은 surge/unavailable 설정에 따라 중간 인스턴스 수가 달라짐</text></svg>
