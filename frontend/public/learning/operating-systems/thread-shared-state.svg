<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">스레드 공유 상태 — 접근 경로</title><desc id="os-desc">두 스레드의 개별 스택과 실행 문맥이 하나의 공유 힙 상태를 읽고 쓰는 구조.</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dedede"/></marker>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#8f8f8f;stroke-width:1.5}.outlined{fill:none;stroke:#d6d6d6;stroke-width:1.6}.soft{fill:#303030;stroke:#a8a8a8;stroke-width:1.5}.label{fill:#f5f5f5;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.muted{fill:#d1d1d1;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:400}.arrow{fill:none;stroke:#dedede;stroke-width:2.2;marker-end:url(#end)}.plain{fill:none;stroke:#b7b7b7;stroke-width:1.8}.dash{fill:none;stroke:#bcbcbc;stroke-width:1.6;stroke-dasharray:7 6}.sep{stroke:#777;stroke-width:1}
</style></defs><rect class="bg" width="1020" height="480"/>
<text class="label" x="48" y="49" font-size="25" text-anchor="start">스레드 공유 상태 — 접근 경로</text>
<rect class="panel" x="60" y="124" width="270" height="102"/><text class="label" x="76" y="154" font-size="18" text-anchor="start">스레드 A</text><text class="muted" x="76" y="180" font-size="15" text-anchor="start">PC·레지스터·스택 A</text><rect class="panel" x="691" y="124" width="270" height="102"/><text class="label" x="707" y="154" font-size="18" text-anchor="start">스레드 B</text><text class="muted" x="707" y="180" font-size="15" text-anchor="start">PC·레지스터·스택 B</text><rect class="panel" x="330" y="308" width="360" height="94"/><text class="label" x="346" y="338" font-size="18" text-anchor="start">공유 힙 객체</text><text class="muted" x="346" y="364" font-size="15" text-anchor="start">counter = 0 (가변 상태)</text><path class="arrow" d="M193 226V272H423V308"/><path class="arrow" d="M828 226V272H588V308"/><text class="label" x="195" y="267" font-size="15" text-anchor="start">읽기/쓰기</text><text class="label" x="770" y="267" font-size="15" text-anchor="start">읽기/쓰기</text><rect class="panel" x="340" y="122" width="337" height="102"/><text class="label" x="356" y="152" font-size="18" text-anchor="start">같은 프로세스의 자원</text><text class="muted" x="356" y="178" font-size="15" text-anchor="start">코드·힙·열린 파일 상태 공유</text><text class="muted" x="48" y="446" font-size="15" text-anchor="start">공유가 곧 안전한 접근을 뜻하지 않습니다. 읽기-수정-쓰기는 동기화 없이 경쟁할 수 있습니다.</text>
</svg>