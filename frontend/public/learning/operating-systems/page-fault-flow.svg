<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" role="img" aria-labelledby="page-fault-title page-fault-desc">
<title id="page-fault-title">페이지 폴트 원인별 분기</title><desc id="page-fault-desc">사용자 메모리 접근 폴트에서 OS의 유효한 영역 및 요청 권한을 검사한다. 허용된 접근이면 demand zero, file/swap, COW 등 복구 경로를 처리한다. 허용되지 않으면 오류 처리한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="head"/></marker><style>.bg{fill:#fff}.title{fill:#181818;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#424242;font:19px system-ui,sans-serif}.note{fill:#444;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#888;stroke-width:1.5}.hi{fill:#e2e2e2;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.head{fill:#555}.dash{stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#383838;stroke:#eee}.line,.edge{stroke:#bbb}.head{fill:#bbb}}</style></defs><rect class="bg" width="960" height="494"/>
<text x="28" y="42" class="title" text-anchor="start">페이지 폴트: 권한 위반과 복구 가능한 폴트</text>
<rect x="28" y="80" width="904" height="57" class="hi"/>
<text x="480" y="115" class="label" text-anchor="middle">CPU 접근 폴트 → 커널이 가상 영역 및 접근 종류 확인</text>
<path class="edge" d="M480 137V163"/>
<rect x="240" y="171" width="480" height="55" class="panel"/>
<text x="480" y="206" class="label" text-anchor="middle">OS의 매핑 정책상 허용된 접근인가?</text>
<path class="edge" d="M240 198H106V252"/>
<text x="108" y="239" class="small" text-anchor="middle">아니오</text>
<rect x="28" y="260" width="220" height="74" class="panel"/>
<text x="138" y="290" class="label" text-anchor="middle">잘못된 주소·권한</text>
<text x="138" y="317" class="small" text-anchor="middle">예: SIGSEGV</text>
<path class="edge" d="M480 226V252"/>
<text x="501" y="245" class="small" text-anchor="start">예</text>
<rect x="290" y="260" width="642" height="110" class="panel"/>
<text x="310" y="289" class="label" text-anchor="start">복구 가능한 경우</text>
<text x="310" y="320" class="small" text-anchor="start">익명 첫 접근 · 파일/스왑 내용 준비 · private COW 쓰기</text>
<text x="310" y="349" class="small" text-anchor="start">COW: PTE 쓰기 제한이 있어도 OS의 매핑 정책은 쓰기를 허용</text>
<path class="edge" d="M611 370V390"/>
<rect x="290" y="398" width="642" height="52" class="hi"/>
<text x="611" y="431" class="label" text-anchor="middle">필요한 매핑 준비 → 성공 시 명령 재시도</text>
<text x="28" y="479" class="note" text-anchor="start">복구 실패(메모리 부족·파일 I/O 오류 등)도 가능하며 폴트가 항상 디스크 읽기는 아닙니다.</text>
</svg>
