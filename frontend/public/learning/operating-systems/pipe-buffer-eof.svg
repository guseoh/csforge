<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Pipe: Buffer, Backpressure, EOF</text><rect x="70" y="135" width="170" height="90" rx="14" fill="#1f2937" stroke="#60a5fa"/><text x="108" y="188" fill="#dbeafe" font-size="19" font-family="sans-serif">Producer</text><rect x="365" y="115" width="230" height="130" rx="14" fill="#1f2937" stroke="#f59e0b"/><text x="420" y="155" fill="#fef3c7" font-size="19" font-family="sans-serif">Kernel pipe buffer</text><text x="405" y="202" fill="#f9fafb" font-size="17" font-family="sans-serif">bounded byte stream</text><rect x="720" y="135" width="170" height="90" rx="14" fill="#1f2937" stroke="#34d399"/><text x="758" y="188" fill="#d1fae5" font-size="19" font-family="sans-serif">Consumer</text><path d="M240 180 L365 180" stroke="#93c5fd" stroke-width="4"/><path d="M595 180 L720 180" stroke="#6ee7b7" stroke-width="4"/><text x="260" y="160" fill="#9ca3af" font-size="15" font-family="sans-serif">write</text><text x="625" y="160" fill="#9ca3af" font-size="15" font-family="sans-serif">read</text><text x="70" y="310" fill="#f9fafb" font-size="17" font-family="sans-serif">buffer full → writer may block / EAGAIN</text><text x="70" y="350" fill="#d1d5db" font-size="17" font-family="sans-serif">all write-end references closed + buffer drained → reader can observe EOF</text></svg>