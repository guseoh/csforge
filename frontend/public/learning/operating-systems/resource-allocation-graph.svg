<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Resource allocation graph</title>
  <desc id="desc">P에서 R로 향하는 request edge와 R에서 P로 향하는 allocation edge로 P1, P2, R1, R2의 deadlock cycle을 표현한다.</desc>
  <defs>
    <marker id="reqArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <marker id="allocArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4cc090"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 18px Inter,Arial,sans-serif}.small{fill:#b8a9c6;font:500 14px Inter,Arial,sans-serif}.p{fill:#21192e;stroke:#6d478f;stroke-width:2}.r{fill:#18352e;stroke:#4cc090;stroke-width:2}.req{stroke:#a56df4;stroke-width:3;fill:none;marker-end:url(#reqArrow)}.alloc{stroke:#4cc090;stroke-width:3;fill:none;marker-end:url(#allocArrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/>
  <text class="title" x="48" y="55">Resource-Allocation Graph</text>
  <text class="small" x="48" y="82">보라색 P→R은 request, 초록색 R→P는 allocation이다.</text>
  <rect class="r" x="120" y="180" width="170" height="90" rx="12"/><text class="label" x="190" y="223">R1</text><text class="small" x="160" y="247">1 instance</text>
  <rect class="p" x="390" y="180" width="170" height="90" rx="44"/><text class="label" x="460" y="232">P1</text>
  <rect class="r" x="660" y="180" width="170" height="90" rx="12"/><text class="label" x="730" y="223">R2</text><text class="small" x="700" y="247">1 instance</text>
  <rect class="p" x="870" y="325" width="170" height="90" rx="44"/><text class="label" x="940" y="377">P2</text>
  <path class="alloc" d="M290 225H390"/><text class="small" x="312" y="208">allocated</text>
  <path class="req" d="M560 225H660"/><text class="small" x="584" y="208">request</text>
  <path class="alloc" d="M830 250 C900 270 940 300 955 325"/><text class="small" x="845" y="290">allocated</text>
  <path class="req" d="M870 370 C650 455 325 445 205 270"/><text class="small" x="480" y="438">request R1</text>
  <rect x="95" y="350" width="360" height="80" rx="12" fill="#21192e" stroke="#534663"/>
  <text class="small" x="120" y="380">single instance: cycle ⇒ deadlock</text>
  <text class="small" x="120" y="405">multi instance: cycle만으로 확정하지 말고 수량까지 계산</text>
</svg>