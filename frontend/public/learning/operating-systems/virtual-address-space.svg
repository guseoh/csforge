<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Virtual address spaces map to physical frames</title>
  <desc id="desc">서로 다른 process가 같은 virtual address를 사용해도 서로 다른 physical frame으로 mapping될 수 있는 구조</desc>
  <rect width="960" height="400" rx="24" fill="#111827"/>
  <text x="48" y="52" fill="#f9fafb" font-size="28" font-family="Arial, sans-serif" font-weight="700">Virtual Address Space</text>
  <rect x="60" y="100" width="250" height="210" rx="18" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <text x="185" y="135" text-anchor="middle" fill="#f9fafb" font-size="20" font-family="Arial, sans-serif">Process A</text>
  <rect x="100" y="170" width="170" height="70" rx="12" fill="#111827" stroke="#6b7280"/><text x="185" y="202" text-anchor="middle" fill="#f9fafb" font-size="16" font-family="Arial, sans-serif">VA 0x400000</text><text x="185" y="225" text-anchor="middle" fill="#9ca3af" font-size="14" font-family="Arial, sans-serif">virtual page P</text>
  <rect x="650" y="100" width="250" height="210" rx="18" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <text x="775" y="135" text-anchor="middle" fill="#f9fafb" font-size="20" font-family="Arial, sans-serif">Process B</text>
  <rect x="690" y="170" width="170" height="70" rx="12" fill="#111827" stroke="#6b7280"/><text x="775" y="202" text-anchor="middle" fill="#f9fafb" font-size="16" font-family="Arial, sans-serif">VA 0x400000</text><text x="775" y="225" text-anchor="middle" fill="#9ca3af" font-size="14" font-family="Arial, sans-serif">virtual page P</text>
  <rect x="385" y="95" width="190" height="220" rx="18" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <text x="480" y="130" text-anchor="middle" fill="#f9fafb" font-size="20" font-family="Arial, sans-serif">Physical Memory</text>
  <rect x="420" y="165" width="120" height="55" rx="10" fill="#111827" stroke="#6b7280"/><text x="480" y="198" text-anchor="middle" fill="#f9fafb" font-size="16" font-family="Arial, sans-serif">Frame 12</text>
  <rect x="420" y="235" width="120" height="55" rx="10" fill="#111827" stroke="#6b7280"/><text x="480" y="268" text-anchor="middle" fill="#f9fafb" font-size="16" font-family="Arial, sans-serif">Frame 87</text>
  <line x1="270" y1="205" x2="420" y2="192" stroke="#e5e7eb" stroke-width="3"/><polygon points="420,192 405,184 407,200" fill="#e5e7eb"/>
  <line x1="690" y1="205" x2="540" y2="262" stroke="#e5e7eb" stroke-width="3"/><polygon points="540,262 550,249 556,264" fill="#e5e7eb"/>
  <text x="480" y="355" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="Arial, sans-serif">같은 virtual address 숫자 ≠ 같은 physical byte</text>
</svg>