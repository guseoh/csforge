<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><rect width="960" height="410" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Shared Memory Mapping</text><rect x="70" y="100" width="240" height="200" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="130" y="140" fill="#dbeafe" font-size="20" font-family="sans-serif">Process A</text><text x="105" y="195" fill="#f9fafb" font-size="17" font-family="monospace">VA 0x7000</text><rect x="650" y="100" width="240" height="200" rx="16" fill="#1f2937" stroke="#34d399"/><text x="710" y="140" fill="#d1fae5" font-size="20" font-family="sans-serif">Process B</text><text x="686" y="195" fill="#f9fafb" font-size="17" font-family="monospace">VA 0xA000</text><rect x="375" y="135" width="210" height="130" rx="16" fill="#1f2937" stroke="#f59e0b"/><text x="407" y="177" fill="#fef3c7" font-size="19" font-family="sans-serif">Shared backing</text><text x="414" y="218" fill="#f9fafb" font-size="16" font-family="sans-serif">same underlying data</text><path d="M310 200 L375 200" stroke="#93c5fd" stroke-width="4"/><path d="M585 200 L650 200" stroke="#6ee7b7" stroke-width="4"/><text x="70" y="350" fill="#d1d5db" font-size="17" font-family="sans-serif">Virtual addresses may differ. Sharing bytes does not provide mutual exclusion, ordering, or crash recovery.</text></svg>