<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" role="img" aria-labelledby="fcfs-sjf-title fcfs-sjf-desc">
<title id="fcfs-sjf-title">FCFS와 SJF의 대기 시간</title><desc id="fcfs-sjf-desc">동시 도착, 단일 논리 CPU, 비선점 및 전환비용 0 가정. A 100ms B C 각각 10ms. 동일 축에 FCFS와 SJF 실행 구간을 비례 길이로 표시.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="head"/></marker><style>.bg{fill:#fff}.title{fill:#181818;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#424242;font:19px system-ui,sans-serif}.note{fill:#444;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#888;stroke-width:1.5}.hi{fill:#e2e2e2;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.head{fill:#555}.dash{stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#383838;stroke:#eee}.line,.edge{stroke:#bbb}.head{fill:#bbb}}</style></defs><rect class="bg" width="960" height="422"/>
<text x="28" y="42" class="title" text-anchor="start">FCFS와 SJF: 같은 작업, 달라지는 대기 시간</text>
<text x="28" y="79" class="small" text-anchor="start">A=100 ms · B=10 ms · C=10 ms · 모두 t=0에 준비 · 비선점</text>
<text x="150" y="117" class="small" text-anchor="middle">0</text>
<text x="211" y="117" class="small" text-anchor="middle">10</text>
<text x="272" y="117" class="small" text-anchor="middle">20</text>
<text x="760" y="117" class="small" text-anchor="middle">100</text>
<text x="821" y="117" class="small" text-anchor="middle">110</text>
<text x="882" y="117" class="small" text-anchor="middle">120</text>
<path class="line" d="M150 125H882"/>
<text x="28" y="176" class="label" text-anchor="start">FCFS</text>
<text x="28" y="291" class="label" text-anchor="start">SJF</text>
<rect x="150" y="140" width="610" height="55" class="hi"/>
<text x="455" y="175" class="label" text-anchor="middle">A</text>
<rect x="760" y="140" width="61" height="55" class="panel"/>
<text x="790.5" y="175" class="label" text-anchor="middle">B</text>
<rect x="821" y="140" width="61" height="55" class="panel"/>
<text x="851.5" y="175" class="label" text-anchor="middle">C</text>
<rect x="150" y="255" width="61" height="55" class="panel"/>
<text x="180.5" y="290" class="label" text-anchor="middle">B</text>
<rect x="211" y="255" width="61" height="55" class="panel"/>
<text x="241.5" y="290" class="label" text-anchor="middle">C</text>
<rect x="272" y="255" width="610" height="55" class="hi"/>
<text x="577" y="290" class="label" text-anchor="middle">A</text>
<text x="150" y="229" class="small" text-anchor="start">대기 A=0, B=100, C=110 → 평균 70 ms</text>
<text x="150" y="344" class="small" text-anchor="start">대기 B=0, C=10, A=20 → 평균 10 ms</text>
<text x="28" y="394" class="note" text-anchor="start">동일 CPU 실행 시간 120 ms. 짧은 작업의 대기 시간을 줄이는 순서가 다릅니다.</text>
</svg>
