<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">File Descriptor → Open File State</text><rect x="60" y="95" width="230" height="230" rx="16" fill="#1f2937" stroke="#6b7280"/><text x="90" y="130" fill="#e5e7eb" font-size="18" font-family="sans-serif">Process descriptor table</text><text x="100" y="180" fill="#f9fafb" font-size="22" font-family="monospace">fd 3 ───────────┐</text><text x="100" y="230" fill="#f9fafb" font-size="22" font-family="monospace">fd 7 ───────┐   │</text><rect x="380" y="120" width="240" height="150" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="415" y="158" fill="#dbeafe" font-size="18" font-family="sans-serif">Open file description</text><text x="420" y="198" fill="#f9fafb" font-size="18" font-family="monospace">offset = 100</text><text x="420" y="230" fill="#f9fafb" font-size="18" font-family="monospace">status flags</text><path d="M290 176 C335 176 340 176 380 176" stroke="#93c5fd" stroke-width="4" fill="none"/><path d="M290 226 C335 226 340 198 380 198" stroke="#93c5fd" stroke-width="4" fill="none"/><rect x="705" y="145" width="190" height="100" rx="16" fill="#1f2937" stroke="#34d399"/><text x="760" y="182" fill="#d1fae5" font-size="18" font-family="sans-serif">File / inode</text><text x="738" y="217" fill="#f9fafb" font-size="16" font-family="sans-serif">shared content</text><path d="M620 195 L705 195" stroke="#6ee7b7" stroke-width="4"/><text x="58" y="372" fill="#9ca3af" font-size="16" font-family="sans-serif">dup()/fork() can create different fd entries that refer to the same open-file description.</text></svg>