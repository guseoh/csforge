<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 465" role="img" aria-labelledby="title desc">
<title id="title">파일 디스크립터와 열린 파일 상태</title>
<desc id="desc">같은 프로세스의 fd 3과 dup으로 생성한 fd 7은 서로 다른 파일 디스크립터 항목이지만 하나의 열린 파일 설명을 참조하여 현재 파일 오프셋을 공유한다.</desc>
<defs><marker id="end" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e5e5e5"/></marker>
<style>.bg{fill:#171717}.box{fill:#292929;stroke:#b2b2b2;stroke-width:1.6}.inner{fill:#343434;stroke:#d4d4d4;stroke-width:1.4}.title{fill:#f5f5f5;font:600 25px Arial,"Noto Sans KR",sans-serif}.label{fill:#f0f0f0;font:600 18px Arial,"Noto Sans KR",sans-serif}.small{fill:#d1d1d1;font:400 16px Arial,"Noto Sans KR",sans-serif}.arrow{fill:none;stroke:#e5e5e5;stroke-width:2.2;marker-end:url(#end)}</style></defs>
<rect class="bg" width="1020" height="465"/>
<text class="title" x="42" y="48">파일 디스크립터 → 열린 파일 설명 → 파일</text>
<rect class="box" x="48" y="108" width="264" height="220"/>
<text class="label" x="68" y="144">프로세스의 FD 테이블</text>
<rect class="inner" x="78" y="172" width="188" height="57"/><text class="label" x="96" y="209">fd 3</text>
<rect class="inner" x="78" y="246" width="188" height="57"/><text class="label" x="96" y="283">fd 7 (dup)</text>
<rect class="box" x="414" y="150" width="268" height="155"/>
<text class="label" x="435" y="187">열린 파일 설명</text>
<text class="small" x="435" y="227">현재 오프셋 = 100</text>
<text class="small" x="435" y="260">파일 상태 플래그</text>
<path class="arrow" d="M266 200H353V192H414"/>
<path class="arrow" d="M266 274H353V260H414"/>
<rect class="box" x="780" y="168" width="194" height="125"/>
<text class="label" x="800" y="206">아이노드 / 파일</text>
<text class="small" x="800" y="241">메타데이터</text>
<text class="small" x="800" y="269">데이터 블록</text>
<path class="arrow" d="M682 224H780"/>
<text class="small" x="48" y="381">두 fd는 별도 항목이지만 같은 열린 파일 설명을 가리키므로 파일 오프셋을 공유합니다.</text>
<text class="small" x="48" y="415">예: fd 3으로 4바이트를 읽어 오프셋이 104가 되면 fd 7도 이후 위치 104를 관측합니다.</text>
</svg>