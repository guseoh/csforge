<svg role="img" aria-labelledby="os-a11y-title os-a11y-desc" xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><title id="os-a11y-title">epoll 관심 목록과 준비 이벤트</title><desc id="os-a11y-desc">관심 파일 디스크립터 집합과 실제 준비 완료 이벤트 집합의 차이</desc><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">epoll: 관심 목록과 준비 이벤트</text><rect x="70" y="105" width="300" height="235" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="132" y="145" fill="#dbeafe" font-size="20" font-family="sans-serif">관심 목록</text><text x="110" y="195" fill="#f9fafb" font-size="18" font-family="monospace">fd 10: 읽기 감시</text><text x="110" y="235" fill="#f9fafb" font-size="18" font-family="monospace">fd 11: 읽기 감시</text><text x="110" y="275" fill="#f9fafb" font-size="18" font-family="monospace">fd 12: 쓰기 감시</text><text x="90" y="315" fill="#9ca3af" font-size="14" font-family="sans-serif">지속적으로 등록된 관심 대상</text><rect x="590" y="125" width="280" height="195" rx="16" fill="#1f2937" stroke="#34d399"/><text x="660" y="165" fill="#d1fae5" font-size="20" font-family="sans-serif">준비 이벤트</text><text x="620" y="215" fill="#f9fafb" font-size="18" font-family="monospace">fd 11: 읽기 가능</text><text x="620" y="255" fill="#f9fafb" font-size="18" font-family="monospace">fd 12: 쓰기 가능</text><path d="M370 225 C450 225 505 205 590 205" stroke="#6ee7b7" stroke-width="4" fill="none"/><text x="400" y="198" fill="#9ca3af" font-size="15" font-family="sans-serif">준비 상태 변화</text><path d="M730 320 L730 375 L465 375" stroke="#fbbf24" stroke-width="4" fill="none"/><text x="130" y="405" fill="#d1d5db" font-size="16" font-family="sans-serif">epoll_wait()는 준비 이벤트를 알립니다. 실제 read/write는 애플리케이션이 수행합니다.</text></svg>