<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">epoll: Interest List vs Ready List</text><rect x="70" y="105" width="300" height="235" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="132" y="145" fill="#dbeafe" font-size="20" font-family="sans-serif">Interest list</text><text x="110" y="195" fill="#f9fafb" font-size="18" font-family="monospace">fd 10 : READ</text><text x="110" y="235" fill="#f9fafb" font-size="18" font-family="monospace">fd 11 : READ</text><text x="110" y="275" fill="#f9fafb" font-size="18" font-family="monospace">fd 12 : WRITE</text><text x="110" y="315" fill="#9ca3af" font-size="16" font-family="sans-serif">persistent registered set</text><rect x="590" y="125" width="280" height="195" rx="16" fill="#1f2937" stroke="#34d399"/><text x="660" y="165" fill="#d1fae5" font-size="20" font-family="sans-serif">Ready list</text><text x="645" y="215" fill="#f9fafb" font-size="18" font-family="monospace">fd 11 : readable</text><text x="645" y="255" fill="#f9fafb" font-size="18" font-family="monospace">fd 12 : writable</text><path d="M370 225 C450 225 505 205 590 205" stroke="#6ee7b7" stroke-width="4" fill="none"/><text x="400" y="198" fill="#9ca3af" font-size="15" font-family="sans-serif">readiness changes</text><path d="M730 320 L730 375 L465 375" stroke="#fbbf24" stroke-width="4" fill="none"/><text x="470" y="405" fill="#d1d5db" font-size="16" font-family="sans-serif">epoll_wait() returns ready events; application still performs non-blocking read/write.</text></svg>