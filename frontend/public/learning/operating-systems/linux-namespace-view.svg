<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Linux Namespace Views</text><rect x="70" y="105" width="350" height="220" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="165" y="145" fill="#dbeafe" font-size="20" font-family="sans-serif">Namespace A</text><text x="105" y="195" fill="#f9fafb" font-size="17" font-family="sans-serif">PID view: 1, 7, 12</text><text x="105" y="235" fill="#f9fafb" font-size="17" font-family="sans-serif">mount view: /app</text><text x="105" y="275" fill="#f9fafb" font-size="17" font-family="sans-serif">network: eth0-A / lo-A</text><rect x="540" y="105" width="350" height="220" rx="16" fill="#1f2937" stroke="#34d399"/><text x="635" y="145" fill="#d1fae5" font-size="20" font-family="sans-serif">Namespace B</text><text x="575" y="195" fill="#f9fafb" font-size="17" font-family="sans-serif">PID view: 1, 4</text><text x="575" y="235" fill="#f9fafb" font-size="17" font-family="sans-serif">mount view: /worker</text><text x="575" y="275" fill="#f9fafb" font-size="17" font-family="sans-serif">network: eth0-B / lo-B</text><text x="70" y="370" fill="#d1d5db" font-size="17" font-family="sans-serif">Both views can exist on the same host kernel. Namespace changes visibility/naming; cgroup controls resource accounting/limits.</text></svg>