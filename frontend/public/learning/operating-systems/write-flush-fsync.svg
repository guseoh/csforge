<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">write → flush → fsync</text><rect x="55" y="135" width="185" height="105" rx="16" fill="#1f2937" stroke="#6b7280"/><text x="92" y="176" fill="#f9fafb" font-size="18" font-family="sans-serif">User buffer</text><text x="88" y="210" fill="#9ca3af" font-size="15" font-family="sans-serif">BufferedWriter</text><rect x="290" y="135" width="185" height="105" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="333" y="176" fill="#dbeafe" font-size="18" font-family="sans-serif">Kernel state</text><text x="315" y="210" fill="#9ca3af" font-size="15" font-family="sans-serif">page cache / dirty</text><rect x="525" y="135" width="185" height="105" rx="16" fill="#1f2937" stroke="#f59e0b"/><text x="562" y="176" fill="#fef3c7" font-size="18" font-family="sans-serif">Filesystem</text><text x="550" y="210" fill="#9ca3af" font-size="15" font-family="sans-serif">data + metadata</text><rect x="760" y="135" width="145" height="105" rx="16" fill="#1f2937" stroke="#34d399"/><text x="793" y="176" fill="#d1fae5" font-size="18" font-family="sans-serif">Storage</text><text x="783" y="210" fill="#9ca3af" font-size="15" font-family="sans-serif">persistence</text><path d="M240 187 L290 187" stroke="#9ca3af" stroke-width="4"/><path d="M475 187 L525 187" stroke="#93c5fd" stroke-width="4"/><path d="M710 187 L760 187" stroke="#fbbf24" stroke-width="4"/><text x="242" y="115" fill="#e5e7eb" font-size="15" font-family="sans-serif">flush</text><text x="483" y="115" fill="#e5e7eb" font-size="15" font-family="sans-serif">write-back</text><text x="713" y="115" fill="#e5e7eb" font-size="15" font-family="sans-serif">fsync boundary</text><text x="55" y="320" fill="#f9fafb" font-size="18" font-family="sans-serif">Important:</text><text x="145" y="320" fill="#d1d5db" font-size="17" font-family="sans-serif">successful return at an earlier layer does not imply every later layer is durable.</text><text x="55" y="360" fill="#9ca3af" font-size="16" font-family="sans-serif">A durable rename may also require the containing directory's metadata contract to be satisfied.</text></svg>