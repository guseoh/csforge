<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Directory Entry, Inode, Data Blocks</text><rect x="70" y="105" width="250" height="180" rx="16" fill="#1f2937" stroke="#6b7280"/><text x="105" y="145" fill="#e5e7eb" font-size="20" font-family="sans-serif">Directory entries</text><text x="105" y="195" fill="#f9fafb" font-size="19" font-family="monospace">a.txt → inode 42</text><text x="105" y="235" fill="#f9fafb" font-size="19" font-family="monospace">b.txt → inode 42</text><rect x="390" y="105" width="230" height="180" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="462" y="145" fill="#dbeafe" font-size="20" font-family="sans-serif">inode 42</text><text x="425" y="188" fill="#f9fafb" font-size="17" font-family="sans-serif">owner / mode / size</text><text x="425" y="224" fill="#f9fafb" font-size="17" font-family="sans-serif">link count / mapping</text><rect x="700" y="125" width="190" height="140" rx="16" fill="#1f2937" stroke="#34d399"/><text x="748" y="166" fill="#d1fae5" font-size="19" font-family="sans-serif">Data blocks</text><text x="738" y="210" fill="#f9fafb" font-size="18" font-family="monospace">B7  B9  B20</text><path d="M320 195 L390 195" stroke="#93c5fd" stroke-width="4"/><path d="M620 195 L700 195" stroke="#6ee7b7" stroke-width="4"/><text x="70" y="350" fill="#9ca3af" font-size="17" font-family="sans-serif">Two hard-link names can resolve to one inode; pathname removal and object lifetime are different events.</text></svg>