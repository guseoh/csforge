<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">임계 구역 — 잠금 소유와 대기</title><desc id="os-desc">동일한 공유 상태를 변경하는 스레드 A와 B 중 하나만 임계 구역에 들어가는 잠금 예시.</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dedede"/></marker>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#8f8f8f;stroke-width:1.5}.outlined{fill:none;stroke:#d6d6d6;stroke-width:1.6}.soft{fill:#303030;stroke:#a8a8a8;stroke-width:1.5}.label{fill:#f5f5f5;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.muted{fill:#d1d1d1;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:400}.arrow{fill:none;stroke:#dedede;stroke-width:2.2;marker-end:url(#end)}.plain{fill:none;stroke:#b7b7b7;stroke-width:1.8}.dash{fill:none;stroke:#bcbcbc;stroke-width:1.6;stroke-dasharray:7 6}.sep{stroke:#777;stroke-width:1}
</style></defs><rect class="bg" width="1020" height="480"/>
<text class="label" x="48" y="49" font-size="25" text-anchor="start">임계 구역 — 잠금 소유와 대기</text>
<text class="label" x="53" y="108" font-size="19" text-anchor="start">스레드 A</text><text class="label" x="565" y="108" font-size="19" text-anchor="start">스레드 B</text><rect class="panel" x="53" y="144" width="405" height="72"/><text class="label" x="69" y="174" font-size="18" text-anchor="start">1. lock 획득</text><text class="muted" x="69" y="200" font-size="15" text-anchor="start">A가 임계 구역 소유</text><rect class="panel" x="565" y="144" width="404" height="72"/><text class="label" x="581" y="174" font-size="18" text-anchor="start">2. lock 요청</text><text class="muted" x="581" y="200" font-size="15" text-anchor="start">B는 획득 전 대기</text><rect class="panel" x="53" y="257" width="405" height="90"/><text class="label" x="69" y="287" font-size="18" text-anchor="start">3. 공유 상태 수정</text><text class="muted" x="69" y="313" font-size="15" text-anchor="start">counter: 0 → 1, unlock</text><rect class="panel" x="565" y="371" width="404" height="68"/><text class="label" x="581" y="401" font-size="18" text-anchor="start">4. lock 획득 후 수정</text><text class="muted" x="581" y="427" font-size="15" text-anchor="start">counter: 1 → 2</text><path class="arrow" d="M257 216V257"/><path class="arrow" d="M765 216V371"/><path class="dash" d="M458 305H517V403H565"/><text class="muted" x="512" y="244" font-size="17" text-anchor="middle">동시에 수정하지 않음</text><text class="muted" x="48" y="460" font-size="15" text-anchor="start">예시는 mutex의 소유권과 순서를 보여줍니다. 스케줄러의 실제 실행 순서는 고정하지 않습니다.</text>
</svg>