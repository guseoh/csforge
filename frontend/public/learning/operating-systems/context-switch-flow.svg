<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="title desc">
<title id="title">문맥 전환 — 실행 문맥 저장과 복원</title><desc id="desc">실행 중인 A의 레지스터 상태를 저장하고 실행 가능한 B를 선택해 B의 문맥을 복원하는 순서. 단순 모드 전환은 별개의 사건.</desc>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ededed"/></marker>
<style>.bg{fill:#171717}.box{fill:#262626;stroke:#999;stroke-width:1.6}.linebox{fill:none;stroke:#bbb;stroke-width:1.7}.shade{fill:#363636;stroke:#ededed;stroke-width:1.6}.label{fill:#f7f7f7;font:600 18px Arial,"Noto Sans KR",sans-serif}.sub{fill:#d6d6d6;font-family:Arial,"Noto Sans KR",sans-serif}.arrow{stroke:#ededed;stroke-width:2.1;fill:none;marker-end:url(#arrowhead)}.plain{stroke:#acacac;stroke-width:1.6;fill:none}.dashed{stroke:#aaa;stroke-width:1.5;stroke-dasharray:7 5;fill:none}.divider{stroke:#8d8d8d;stroke-width:1.3}</style></defs>
<rect class="bg" width="1000" height="466"/><text class="label" x="42" y="49" font-size="25" text-anchor="start">문맥 전환 — 실행 문맥 저장과 복원</text><text class="label" x="50" y="105" font-size="19" text-anchor="start">CPU에서 A 실행</text><text class="label" x="50" y="235" font-size="19" text-anchor="start">커널의 전환 과정</text><text class="label" x="50" y="367" font-size="19" text-anchor="start">CPU에서 B 실행</text><rect class="box" x="268" y="77" width="250" height="79"/><text class="label" x="282" y="108" font-size="18" text-anchor="start">A 실행 중</text><text class="sub" x="282" y="135" font-size="15" text-anchor="start">PC · SP · 레지스터 A</text><rect class="box" x="268" y="203" width="250" height="88"/><text class="label" x="282" y="234" font-size="18" text-anchor="start">A 문맥 저장</text><text class="sub" x="282" y="261" font-size="15" text-anchor="start">A의 재개 지점 보존</text><rect class="box" x="578" y="203" width="250" height="88"/><text class="label" x="592" y="234" font-size="18" text-anchor="start">스케줄러가 B 선택</text><text class="sub" x="592" y="261" font-size="15" text-anchor="start">B는 실행 가능 상태</text><rect class="box" x="578" y="338" width="250" height="78"/><text class="label" x="592" y="369" font-size="18" text-anchor="start">B 문맥 복원</text><text class="sub" x="592" y="396" font-size="15" text-anchor="start">CPU에서 B 실행</text><path class="arrow" d="M394 156V203"/><path class="arrow" d="M518 247L578 247"/><path class="arrow" d="M702 291V338"/><text class="sub" x="49" y="438" font-size="15" text-anchor="start">참고: 사용자 ↔ 커널 모드 변경만으로 다른 태스크로 전환되지는 않습니다.</text></svg>