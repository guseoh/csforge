<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Context switch flow</title>
  <desc id="desc">Task A의 실행 상태를 저장하고 scheduler가 Task B를 선택한 뒤 Task B의 실행 상태를 복원하는 흐름</desc>
  <rect width="960" height="360" rx="24" fill="#111827"/>
  <text x="48" y="52" fill="#f9fafb" font-size="28" font-family="Arial, sans-serif" font-weight="700">Context Switch</text>
  <rect x="50" y="105" width="180" height="110" rx="16" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" fill="#f9fafb" font-size="22" font-family="Arial, sans-serif">Task A</text>
  <text x="140" y="180" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">running</text>
  <rect x="300" y="90" width="360" height="150" rx="18" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <text x="480" y="126" text-anchor="middle" fill="#f9fafb" font-size="20" font-family="Arial, sans-serif" font-weight="700">Kernel / Scheduler</text>
  <text x="480" y="161" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">1. A register / PC / SP 저장</text>
  <text x="480" y="190" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">2. 다음 runnable task 선택</text>
  <text x="480" y="219" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">3. B execution context 복원</text>
  <rect x="730" y="105" width="180" height="110" rx="16" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <text x="820" y="150" text-anchor="middle" fill="#f9fafb" font-size="22" font-family="Arial, sans-serif">Task B</text>
  <text x="820" y="180" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">running</text>
  <line x1="230" y1="160" x2="300" y2="160" stroke="#e5e7eb" stroke-width="3"/>
  <polygon points="300,160 286,152 286,168" fill="#e5e7eb"/>
  <line x1="660" y1="160" x2="730" y2="160" stroke="#e5e7eb" stroke-width="3"/>
  <polygon points="730,160 716,152 716,168" fill="#e5e7eb"/>
  <text x="480" y="296" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="Arial, sans-serif">Mode switch가 발생해도 다른 task를 선택하지 않으면 context switch가 아닐 수 있다.</text>
</svg>