<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Round Robin quantum flow</title>
  <desc id="desc">A B C 세 task가 quantum 단위로 순환 실행되는 흐름</desc>
  <rect width="960" height="360" rx="24" fill="#111827"/>
  <text x="48" y="52" fill="#f9fafb" font-size="28" font-family="Arial, sans-serif" font-weight="700">Round Robin — quantum = 10 ms</text>
  <line x1="70" y1="180" x2="890" y2="180" stroke="#6b7280" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="80" y="120" width="150" height="80" rx="12" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <text x="155" y="155" fill="#f9fafb">A</text><text x="155" y="183" fill="#d1d5db">0–10 ms</text>
    <rect x="245" y="120" width="150" height="80" rx="12" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <text x="320" y="155" fill="#f9fafb">B</text><text x="320" y="183" fill="#d1d5db">10–20 ms</text>
    <rect x="410" y="120" width="150" height="80" rx="12" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <text x="485" y="155" fill="#f9fafb">C</text><text x="485" y="183" fill="#d1d5db">20–30 ms</text>
    <rect x="575" y="120" width="150" height="80" rx="12" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <text x="650" y="155" fill="#f9fafb">A</text><text x="650" y="183" fill="#d1d5db">30–40 ms</text>
    <rect x="740" y="120" width="130" height="80" rx="12" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
    <text x="805" y="155" fill="#f9fafb">…</text><text x="805" y="183" fill="#d1d5db">repeat</text>
  </g>
  <text x="480" y="260" text-anchor="middle" fill="#d1d5db" font-size="17" font-family="Arial, sans-serif">unfinished task → runnable queue 뒤로</text>
  <text x="480" y="300" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="Arial, sans-serif">작은 quantum: 빠른 turn-taking / 많은 switch · 큰 quantum: 적은 switch / FCFS에 가까워짐</text>
</svg>