<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">mmap: Mapping vs Residency</text><rect x="60" y="110" width="240" height="190" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="105" y="150" fill="#dbeafe" font-size="19" font-family="sans-serif">Process virtual range</text><text x="100" y="205" fill="#f9fafb" font-size="18" font-family="monospace">page A : resident</text><text x="100" y="245" fill="#f9fafb" font-size="18" font-family="monospace">page B : not resident</text><rect x="380" y="130" width="200" height="150" rx="16" fill="#1f2937" stroke="#f59e0b"/><text x="435" y="172" fill="#fef3c7" font-size="19" font-family="sans-serif">Page cache</text><text x="420" y="222" fill="#f9fafb" font-size="17" font-family="sans-serif">resident file pages</text><rect x="680" y="130" width="210" height="150" rx="16" fill="#1f2937" stroke="#34d399"/><text x="745" y="172" fill="#d1fae5" font-size="19" font-family="sans-serif">File backing</text><text x="717" y="222" fill="#f9fafb" font-size="17" font-family="sans-serif">persistent file data</text><path d="M300 240 C340 240 350 230 380 230" stroke="#fbbf24" stroke-width="4" fill="none"/><text x="305" y="214" fill="#fef3c7" font-size="14" font-family="sans-serif">first touch fault</text><path d="M580 205 L680 205" stroke="#6ee7b7" stroke-width="4"/><text x="60" y="360" fill="#d1d5db" font-size="17" font-family="sans-serif">Creating the mapping does not require every file page to be resident; access can fault pages in lazily.</text></svg>