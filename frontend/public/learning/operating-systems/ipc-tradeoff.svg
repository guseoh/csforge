<svg role="img" aria-labelledby="os-a11y-title os-a11y-desc" xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><title id="os-a11y-title">IPC 방식별 절충</title><desc id="os-a11y-desc">파이프와 공유 메모리 및 소켓의 복사 비용과 동기화 경계를 비교한 도식</desc><rect width="960" height="440" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">IPC 방식 선택과 절충</text><text x="70" y="102" fill="#d1d5db" font-size="17" font-family="sans-serif">복사 비용뿐 아니라 메시지 경계와 동기화 책임을 비교합니다.</text><rect x="70" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#60a5fa"/><text x="130" y="175" fill="#dbeafe" font-size="18" font-family="sans-serif">파이프 / 큐</text><text x="85" y="210" fill="#aab5c3" font-size="13" font-family="sans-serif">커널 버퍼 · 용량 제한</text><rect x="285" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#f59e0b"/><text x="320" y="175" fill="#fef3c7" font-size="18" font-family="sans-serif">공유 메모리</text><text x="302" y="210" fill="#aab5c3" font-size="13" font-family="sans-serif">복사 절감 · 동기화 부담</text><rect x="500" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#34d399"/><text x="534" y="175" fill="#d1fae5" font-size="18" font-family="sans-serif">Unix 소켓</text><text x="515" y="210" fill="#aab5c3" font-size="13" font-family="sans-serif">로컬 통신 · 메시지 경계</text><rect x="715" y="135" width="180" height="105" rx="14" fill="#1f2937" stroke="#a78bfa"/><text x="747" y="175" fill="#ede9fe" font-size="17" font-family="sans-serif">네트워크 소켓</text><text x="730" y="210" fill="#aab5c3" font-size="13" font-family="sans-serif">원격 통신 · 실패/재시도</text><text x="70" y="305" fill="#f9fafb" font-size="18" font-family="sans-serif">비교:</text><text x="170" y="305" fill="#d1d5db" font-size="16" font-family="sans-serif">복사 · 메시지 경계 · 동기화 · 역압 · 격리 · 장애 복구</text><text x="70" y="360" fill="#d1d5db" font-size="16" font-family="sans-serif">공유 메모리: 동기화와 프로세스 수명 관리를 직접 설계합니다.</text><text x="70" y="396" fill="#d1d5db" font-size="16" font-family="sans-serif">파이프·큐·소켓: 메시지 단위와 버퍼 한도, 실패 경계를 확인합니다.</text></svg>