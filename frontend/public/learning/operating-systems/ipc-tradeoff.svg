<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><rect width="960" height="440" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">IPC Trade-off</text><text x="70" y="102" fill="#d1d5db" font-size="17" font-family="sans-serif">Choose the boundary, not only the fastest data path.</text><rect x="70" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#60a5fa"/><text x="130" y="175" fill="#dbeafe" font-size="18" font-family="sans-serif">Pipe / Queue</text><text x="100" y="210" fill="#9ca3af" font-size="14" font-family="sans-serif">kernel buffer + capacity</text><rect x="285" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#f59e0b"/><text x="320" y="175" fill="#fef3c7" font-size="18" font-family="sans-serif">Shared Memory</text><text x="307" y="210" fill="#9ca3af" font-size="14" font-family="sans-serif">low-copy + sync burden</text><rect x="500" y="135" width="190" height="105" rx="14" fill="#1f2937" stroke="#34d399"/><text x="534" y="175" fill="#d1fae5" font-size="18" font-family="sans-serif">Unix Socket</text><text x="528" y="210" fill="#9ca3af" font-size="14" font-family="sans-serif">local endpoint + framing</text><rect x="715" y="135" width="180" height="105" rx="14" fill="#1f2937" stroke="#a78bfa"/><text x="747" y="175" fill="#ede9fe" font-size="18" font-family="sans-serif">Network Socket</text><text x="742" y="210" fill="#9ca3af" font-size="14" font-family="sans-serif">remote + failure/retry</text><text x="70" y="305" fill="#f9fafb" font-size="18" font-family="sans-serif">Compare:</text><text x="160" y="305" fill="#d1d5db" font-size="17" font-family="sans-serif">copy cost · message boundary · synchronization · backpressure · isolation · crash recovery</text><path d="M100 350 L860 350" stroke="#4b5563" stroke-width="4"/><text x="92" y="388" fill="#93c5fd" font-size="16" font-family="sans-serif">simpler isolation boundary</text><text x="715" y="388" fill="#fbbf24" font-size="16" font-family="sans-serif">more direct shared state</text></svg>