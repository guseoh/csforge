<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Thrashing loop</title>
  <desc id="desc">Working set이 memory budget보다 커 page fault, eviction, page-in이 반복되고 useful work가 줄어드는 악순환</desc>
  <rect width="960" height="400" rx="24" fill="#111827"/>
  <text x="48" y="52" fill="#f9fafb" font-size="28" font-family="Arial, sans-serif" font-weight="700">Thrashing Loop</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="365" y="82" width="230" height="70" rx="14" fill="#1f2937" stroke="#9ca3af"/><text x="480" y="112" fill="#f9fafb" font-size="17">working set &gt; memory budget</text><text x="480" y="136" fill="#d1d5db" font-size="14">active pages fit하지 않음</text>
    <rect x="650" y="175" width="210" height="70" rx="14" fill="#1f2937" stroke="#9ca3af"/><text x="755" y="205" fill="#f9fafb" font-size="17">fault / page-in</text><text x="755" y="229" fill="#d1d5db" font-size="14">I/O·reclaim 증가</text>
    <rect x="365" y="275" width="230" height="70" rx="14" fill="#1f2937" stroke="#9ca3af"/><text x="480" y="305" fill="#f9fafb" font-size="17">active page eviction</text><text x="480" y="329" fill="#d1d5db" font-size="14">곧 다시 필요해짐</text>
    <rect x="100" y="175" width="210" height="70" rx="14" fill="#1f2937" stroke="#9ca3af"/><text x="205" y="205" fill="#f9fafb" font-size="17">useful work 감소</text><text x="205" y="229" fill="#d1d5db" font-size="14">CPU waits / throughput↓</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="3" fill="#e5e7eb">
    <line x1="595" y1="117" x2="680" y2="175"/><polygon points="680,175 664,171 673,158"/>
    <line x1="755" y1="245" x2="580" y2="292"/><polygon points="580,292 591,280 595,295"/>
    <line x1="365" y1="310" x2="285" y2="245"/><polygon points="285,245 301,249 292,262"/>
    <line x1="205" y1="175" x2="365" y2="120"/><polygon points="365,120 354,132 350,116"/>
  </g>
  <text x="480" y="380" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="Arial, sans-serif">단순 page fault 존재가 아니라 fault/reclaim/I/O가 useful execution을 압도하는 상태</text>
</svg>