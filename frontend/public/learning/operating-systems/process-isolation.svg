<svg role="img" aria-labelledby="os-a11y-title os-a11y-desc" xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><title id="os-a11y-title">프로세스 격리</title><desc id="os-a11y-desc">서로 다른 가상 주소 공간과 권한·파일 디스크립터를 가진 두 프로세스 사이의 명시적 IPC</desc><rect width="960" height="410" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Process Isolation and Explicit IPC</text><rect x="70" y="105" width="300" height="205" rx="16" fill="#1f2937" stroke="#60a5fa"/><text x="160" y="145" fill="#dbeafe" font-size="20" font-family="sans-serif">Process A</text><text x="105" y="195" fill="#f9fafb" font-size="17" font-family="sans-serif">virtual address space A</text><text x="105" y="235" fill="#f9fafb" font-size="17" font-family="sans-serif">fd / credentials A</text><rect x="590" y="105" width="300" height="205" rx="16" fill="#1f2937" stroke="#34d399"/><text x="680" y="145" fill="#d1fae5" font-size="20" font-family="sans-serif">Process B</text><text x="625" y="195" fill="#f9fafb" font-size="17" font-family="sans-serif">virtual address space B</text><text x="625" y="235" fill="#f9fafb" font-size="17" font-family="sans-serif">fd / credentials B</text><path d="M370 210 L590 210" stroke="#fbbf24" stroke-width="4"/><text x="435" y="192" fill="#fef3c7" font-size="16" font-family="sans-serif">explicit IPC</text><text x="70" y="360" fill="#d1d5db" font-size="17" font-family="sans-serif">주소 공간은 분리되지만 공유 커널 객체와 명시적인 IPC로 통신할 수 있습니다.</text>
