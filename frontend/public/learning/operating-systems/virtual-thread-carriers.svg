<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">가상 스레드·운반자·OS 스레드</title><desc id="os-desc">JDK가 가상 스레드를 운반자 플랫폼 스레드에 탑재하며 지원되는 블로킹에서 분리할 수 있는 층위.</desc>
