<text class="label" x="56" y="109" font-size="19" text-anchor="start">JDK 관리: 가상 스레드</text><rect class="panel" x="56" y="131" width="210" height="74"/><text class="label" x="72" y="161" font-size="18" text-anchor="start">VT A</text><text class="muted" x="72" y="187" font-size="15" text-anchor="start">실행 가능</text><rect class="panel" x="288" y="131" width="210" height="74"/><text class="label" x="304" y="161" font-size="18" text-anchor="start">VT B</text><text class="muted" x="304" y="187" font-size="15" text-anchor="start">대기 · 분리</text><rect class="panel" x="520" y="131" width="210" height="74"/><text class="label" x="536" y="161" font-size="18" text-anchor="start">VT C</text><text class="muted" x="536" y="187" font-size="15" text-anchor="start">실행 가능</text><rect class="panel" x="92" y="270" width="335" height="76"/><text class="label" x="108" y="300" font-size="18" text-anchor="start">운반자 1 · 플랫폼 스레드</text><text class="muted" x="108" y="326" font-size="15" text-anchor="start">OS 스레드에 대응</text><rect class="panel" x="535" y="270" width="335" height="76"/><text class="label" x="551" y="300" font-size="18" text-anchor="start">운반자 2 · 플랫폼 스레드</text><text class="muted" x="551" y="326" font-size="15" text-anchor="start">OS 스레드에 대응</text><path class="arrow" d="M158 205V235H259V270"/><path class="arrow" d="M625 205V245H700V270"/><path class="dash" d="M391 205V241"/><text class="muted" x="407" y="239" font-size="15" text-anchor="start">unmount 가능</text><path class="arrow" d="M259 346V386H478"/><path class="arrow" d="M700 346V386H478"/><text class="label" x="496" y="395" font-size="18" text-anchor="start">OS 스케줄러 → CPU</text><text class="muted" x="48" y="445" font-size="15" text-anchor="start">Java 25: 일반적인 synchronized 블록만으로 pinning된다고 설명하면 안 됩니다(JEP 491).</text>

