<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Banker safe sequence example</title>
  <desc id="desc">Available 3에서 P2, P1, P3 순으로 완료하며 Work가 3, 5, 8, 10으로 증가하는 safe sequence를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#b8a9c6;font:500 14px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.done{fill:#18352e;stroke:#4cc090;stroke-width:2}.line{stroke:#a56df4;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/>
  <text class="title" x="48" y="55">Safe sequence: P2 → P1 → P3</text>
  <text class="small" x="48" y="82">Need ≤ Work인 process를 완료했다고 가정하고 Allocation을 Work에 돌려준다.</text>
  <rect class="box" x="70" y="170" width="190" height="105" rx="14"/><text class="label" x="112" y="210">Available / Work</text><text class="label" x="145" y="245">3</text>
  <path class="line" d="M260 222H340"/>
  <rect class="done" x="340" y="145" width="210" height="155" rx="14"/><text class="label" x="405" y="185">P2 완료</text><text class="small" x="385" y="220">Need 2 ≤ Work 3</text><text class="small" x="385" y="248">Allocation 2 반환</text><text class="label" x="415" y="280">Work 5</text>
  <path class="line" d="M550 222H625"/>
  <rect class="done" x="625" y="145" width="210" height="155" rx="14"/><text class="label" x="690" y="185">P1 완료</text><text class="small" x="670" y="220">Need 4 ≤ Work 5</text><text class="small" x="670" y="248">Allocation 3 반환</text><text class="label" x="700" y="280">Work 8</text>
  <path class="line" d="M835 222H900"/>
  <rect class="done" x="900" y="145" width="150" height="155" rx="14"/><text class="label" x="940" y="185">P3</text><text class="small" x="922" y="220">Need 3 ≤ 8</text><text class="small" x="918" y="248">완료 가능</text><text class="label" x="930" y="280">Work 10</text>
  <text class="small" x="70" y="365">P1부터는 시작할 수 없다(Need 4 > Available 3). 하지만 P2 또는 P3부터 완료할 수 있으므로 safe state다.</text>
  <text class="small" x="70" y="398">Safe sequence는 실제 scheduler 순서를 고정하는 것이 아니라 모든 process가 끝날 수 있는 순서가 존재함을 보이는 증명이다.</text>
</svg>