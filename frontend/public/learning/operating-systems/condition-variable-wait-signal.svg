<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 548" role="img" aria-labelledby="title desc">
<title id="title">조건 변수 — 깨우기와 조건 재확인</title><desc id="desc">소비자가 뮤텍스를 쥔 상태에서 조건을 검사하고 wait로 원자적 해제·대기하며 생산자는 조건 변경 후 signal; 소비자는 재획득 후 while 검사.</desc>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ededed"/></marker>
<style>.bg{fill:#171717}.box{fill:#262626;stroke:#999;stroke-width:1.6}.linebox{fill:none;stroke:#bbb;stroke-width:1.7}.shade{fill:#363636;stroke:#ededed;stroke-width:1.6}.label{fill:#f7f7f7;font:600 18px Arial,"Noto Sans KR",sans-serif}.sub{fill:#d6d6d6;font-family:Arial,"Noto Sans KR",sans-serif}.arrow{stroke:#ededed;stroke-width:2.1;fill:none;marker-end:url(#arrowhead)}.plain{stroke:#acacac;stroke-width:1.6;fill:none}.dashed{stroke:#aaa;stroke-width:1.5;stroke-dasharray:7 5;fill:none}.divider{stroke:#8d8d8d;stroke-width:1.3}</style></defs>
<rect class="bg" width="1040" height="548"/><text class="label" x="42" y="49" font-size="25" text-anchor="start">조건 변수 — 깨우기와 조건 재확인</text><text class="label" x="55" y="110" font-size="19" text-anchor="start">소비자(Consumer)</text><text class="label" x="560" y="110" font-size="19" text-anchor="start">생산자(Producer)</text><rect class="box" x="55" y="132" width="409" height="78"/><text class="label" x="69" y="163" font-size="18" text-anchor="start">① lock → 조건 검사</text><text class="sub" x="69" y="190" font-size="15" text-anchor="start">queue.empty == true</text><rect class="box" x="55" y="254" width="409" height="91"/><text class="label" x="69" y="285" font-size="18" text-anchor="start">② wait(cond, mutex)</text><text class="sub" x="69" y="312" font-size="15" text-anchor="start">원자적으로 잠금 해제 + 대기</text><rect class="box" x="560" y="254" width="398" height="91"/><text class="label" x="574" y="285" font-size="18" text-anchor="start">③ lock → 항목 추가</text><text class="sub" x="574" y="312" font-size="15" text-anchor="start">predicate 참 → signal → unlock</text><rect class="box" x="55" y="387" width="409" height="88"/><text class="label" x="69" y="418" font-size="18" text-anchor="start">④ 깨움 → lock 재획득</text><text class="sub" x="69" y="445" font-size="15" text-anchor="start">while 조건을 다시 검사</text><path class="arrow" d="M259 210V254"/><path class="arrow" d="M464 297H560"/><path class="dashed" d="M560 325H510V430H464"/><text class="sub" x="580" y="171" font-size="16" text-anchor="start">signal 자체는 자원을 예약하지 않음</text><text class="sub" x="578" y="200" font-size="16" text-anchor="start">깨어나도 lock 획득을 기다릴 수 있음</text><text class="sub" x="560" y="467" font-size="15" text-anchor="start">거짓 깨움·경쟁을 대비해 while 사용</text><text class="sub" x="56" y="520" font-size="16" text-anchor="start">조건 검사·잠금 해제·대기 등록을 분리하면 신호를 놓치는 경쟁이 생길 수 있습니다.</text></svg>