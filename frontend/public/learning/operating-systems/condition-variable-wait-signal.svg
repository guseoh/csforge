<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Condition variable wait and signal flow</title>
  <desc id="desc">consumer가 predicate를 확인하고 mutex를 놓으며 대기한 뒤 producer signal 후 mutex를 다시 획득하고 조건을 재검사하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.active{fill:#18352e;stroke:#4cc090;stroke-width:2}.wait{fill:#3a2c19;stroke:#d5a84d;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/>
  <text class="title" x="48" y="54">Condition Variable — wakeup은 조건 보장이 아니라 재검사 기회다</text>
  <text class="small" x="48" y="82">wait는 mutex release와 대기 진입을 연결하고, 돌아오기 전에 mutex를 다시 획득한다</text>
  <text class="label" x="95" y="128">Consumer</text><text class="label" x="730" y="128">Producer</text>
  <rect class="box" x="48" y="155" width="255" height="64" rx="11"/><text class="small" x="82" y="184">lock → queue empty 확인</text><text class="small" x="82" y="204">predicate = false</text>
  <path class="line" d="M176 219V270"/>
  <rect class="wait" x="48" y="270" width="255" height="74" rx="11"/><text class="small" x="74" y="300">wait(cond, mutex)</text><text class="small" x="74" y="322">mutex release + wait 등록</text>
  <path class="line" d="M303 307H655"/>
  <rect class="active" x="655" y="155" width="355" height="110" rx="12"/><text class="small" x="694" y="184">lock(mutex)</text><text class="small" x="694" y="208">item 추가 → predicate = true</text><text class="small" x="694" y="232">signal(cond) → unlock</text>
  <path class="line" d="M832 265V307H655"/>
  <path class="line" d="M655 307H420V393"/>
  <rect class="active" x="48" y="365" width="372" height="78" rx="11"/><text class="small" x="79" y="395">wake → mutex 재획득</text><text class="small" x="79" y="419">while에서 predicate 다시 확인</text>
  <text class="small" x="475" y="403">signal이 item을 예약해 주는 것은 아니다.</text>
  <text class="small" x="48" y="472">mutex를 따로 unlock한 뒤 나중에 sleep하면 그 사이의 signal을 놓치는 lost wakeup race가 생길 수 있다.</text>
</svg>