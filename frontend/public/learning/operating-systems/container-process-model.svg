<svg role="img" aria-labelledby="os-a11y-title os-a11y-desc" xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><title id="os-a11y-title">컨테이너 프로세스 모델</title><desc id="os-a11y-desc">컨테이너 안의 프로세스 트리와 네임스페이스·cgroup·호스트 커널의 관계</desc><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">컨테이너 프로세스 모델</text><rect x="70" y="100" width="820" height="255" rx="18" fill="#1f2937" stroke="#6b7280"/><text x="105" y="140" fill="#e5e7eb" font-size="19" font-family="sans-serif">호스트 커널</text><rect x="115" y="175" width="300" height="135" rx="14" fill="#111827" stroke="#60a5fa"/><text x="180" y="212" fill="#dbeafe" font-size="19" font-family="sans-serif">컨테이너 프로세스 트리</text><text x="143" y="252" fill="#f9fafb" font-size="16" font-family="monospace">PID 1 → 작업자 → 자식</text><text x="155" y="285" fill="#9ca3af" font-size="14" font-family="sans-serif">네임스페이스·rootfs 관점</text><rect x="545" y="175" width="300" height="135" rx="14" fill="#111827" stroke="#34d399"/><text x="628" y="212" fill="#d1fae5" font-size="19" font-family="sans-serif">cgroup 자원 제어</text><text x="585" y="252" fill="#f9fafb" font-size="17" font-family="sans-serif">CPU · 메모리 · I/O</text><text x="585" y="285" fill="#9ca3af" font-size="14" font-family="sans-serif">사용량 · 할당량 · 상한</text><text x="70" y="396" fill="#d1d5db" font-size="17" font-family="sans-serif">이미지는 실행에 필요한 파일을 제공하며, 컨테이너는 별도 커널이 아닌 호스트의 프로세스입니다.</text></svg>