<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Container Process Model</text><rect x="70" y="100" width="820" height="255" rx="18" fill="#1f2937" stroke="#6b7280"/><text x="105" y="140" fill="#e5e7eb" font-size="19" font-family="sans-serif">Host kernel</text><rect x="115" y="175" width="300" height="135" rx="14" fill="#111827" stroke="#60a5fa"/><text x="180" y="212" fill="#dbeafe" font-size="19" font-family="sans-serif">Container process tree</text><text x="155" y="252" fill="#f9fafb" font-size="17" font-family="monospace">PID 1 → worker → child</text><text x="155" y="285" fill="#9ca3af" font-size="14" font-family="sans-serif">namespace / rootfs view</text><rect x="545" y="175" width="300" height="135" rx="14" fill="#111827" stroke="#34d399"/><text x="628" y="212" fill="#d1fae5" font-size="19" font-family="sans-serif">cgroup controls</text><text x="585" y="252" fill="#f9fafb" font-size="17" font-family="sans-serif">CPU · memory · I/O</text><text x="585" y="285" fill="#9ca3af" font-size="14" font-family="sans-serif">accounting / quota / limits</text><text x="70" y="400" fill="#d1d5db" font-size="17" font-family="sans-serif">Image supplies filesystem/runtime inputs; the running container is processes on the host kernel, not a separate guest kernel.</text></svg>