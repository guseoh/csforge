<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">시스템 콜 — 요청과 권한 경계</title><desc id="os-desc">사용자 코드의 read 요청이 보호된 커널 진입을 거쳐 파일 상태로 처리된 후 결과를 돌려줌.</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dedede"/></marker>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#8f8f8f;stroke-width:1.5}.outlined{fill:none;stroke:#d6d6d6;stroke-width:1.6}.soft{fill:#303030;stroke:#a8a8a8;stroke-width:1.5}.label{fill:#f5f5f5;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.muted{fill:#d1d1d1;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:400}.arrow{fill:none;stroke:#dedede;stroke-width:2.2;marker-end:url(#end)}.plain{fill:none;stroke:#b7b7b7;stroke-width:1.8}.dash{fill:none;stroke:#bcbcbc;stroke-width:1.6;stroke-dasharray:7 6}.sep{stroke:#777;stroke-width:1}
</style></defs><rect class="bg" width="1020" height="480"/>
<text class="label" x="48" y="49" font-size="25" text-anchor="start">시스템 콜 — 요청과 권한 경계</text>
<rect class="panel" x="70" y="107" width="325" height="92"/><text class="label" x="86" y="137" font-size="18" text-anchor="start">사용자 프로그램</text><text class="muted" x="86" y="163" font-size="15" text-anchor="start">read(fd, buf, n) 요청</text><rect class="panel" x="620" y="107" width="325" height="92"/><text class="label" x="636" y="137" font-size="18" text-anchor="start">사용자 주소 공간</text><text class="muted" x="636" y="163" font-size="15" text-anchor="start">커널 메모리를 직접 수정 불가</text><path class="arrow" d="M230 199V246H390V292"/><rect class="panel" x="290" y="293" width="450" height="90"/><text class="label" x="306" y="323" font-size="18" text-anchor="start">보호된 커널 진입</text><text class="muted" x="306" y="349" font-size="15" text-anchor="start">시스템 콜 번호·인자 검사</text><path class="plain" d="M740 334H852V245"/><rect class="panel" x="70" y="303" width="190" height="66"/><text class="label" x="86" y="333" font-size="18" text-anchor="start">파일 상태 조회</text><text class="muted" x="86" y="359" font-size="15" text-anchor="start">fd 유효성 확인</text><rect class="panel" x="770" y="303" width="170" height="66"/><text class="label" x="786" y="333" font-size="18" text-anchor="start">결과 또는 오류</text><text class="muted" x="786" y="359" font-size="15" text-anchor="start">반환값 전달</text><path class="arrow" d="M740 342L770 342"/><path class="plain" d="M770 367V412H230V199"/><text class="muted" x="505" y="267" font-size="17" text-anchor="middle">사용자 / 커널 경계</text><text class="muted" x="48" y="456" font-size="15" text-anchor="start">라이브러리 래퍼 유무는 API·환경에 따라 다릅니다. 핵심은 권한 검사와 명시적 커널 진입입니다.</text>
</svg>