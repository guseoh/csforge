<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" role="img" aria-labelledby="title desc">
<title id="title">페이지 테이블 — 매핑과 접근 권한</title><desc id="desc">4 KiB 페이지에서 가상 주소 0x3100의 VPN 3과 offset 0x100을 PFN 9와 결합하여 물리 주소 0x9100을 얻는 예시.</desc>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ededed"/></marker>
<style>.bg{fill:#171717}.box{fill:#262626;stroke:#999;stroke-width:1.6}.linebox{fill:none;stroke:#bbb;stroke-width:1.7}.shade{fill:#363636;stroke:#ededed;stroke-width:1.6}.label{fill:#f7f7f7;font:600 18px Arial,"Noto Sans KR",sans-serif}.sub{fill:#d6d6d6;font-family:Arial,"Noto Sans KR",sans-serif}.arrow{stroke:#ededed;stroke-width:2.1;fill:none;marker-end:url(#arrowhead)}.plain{stroke:#acacac;stroke-width:1.6;fill:none}.dashed{stroke:#aaa;stroke-width:1.5;stroke-dasharray:7 5;fill:none}.divider{stroke:#8d8d8d;stroke-width:1.3}</style></defs>
<rect class="bg" width="1000" height="462"/><text class="label" x="42" y="49" font-size="25" text-anchor="start">페이지 테이블 — 매핑과 접근 권한</text><rect class="box" x="50" y="124" width="270" height="102"/><text class="label" x="64" y="155" font-size="18" text-anchor="start">가상 주소 0x3100</text><text class="sub" x="64" y="182" font-size="15" text-anchor="start">VPN 3 | offset 0x100</text><rect class="box" x="374" y="104" width="270" height="147"/><text class="label" x="388" y="135" font-size="18" text-anchor="start">페이지 테이블 항목</text><text class="sub" x="388" y="162" font-size="15" text-anchor="start">VPN 3 → PFN 9</text><text class="sub" x="389" y="210" font-size="16" text-anchor="start">상주·접근 권한 검사</text><rect class="box" x="698" y="124" width="270" height="102"/><text class="label" x="712" y="155" font-size="18" text-anchor="start">물리 주소 0x9100</text><text class="sub" x="712" y="182" font-size="15" text-anchor="start">PFN 9 | offset 0x100</text><path class="arrow" d="M320 177L374 177"/><path class="arrow" d="M644 177L698 177"/><rect class="linebox" x="78" y="297" width="844" height="79"/><text class="label" x="98" y="327" font-size="17" text-anchor="start">가정: 페이지 크기 = 0x1000 (4096B)</text><text class="label" x="98" y="357" font-size="17" text-anchor="start">0x3100 = 3 × 0x1000 + 0x100  →  9 × 0x1000 + 0x100 = 0x9100</text><text class="sub" x="53" y="421" font-size="15" text-anchor="start">매핑 부재 또는 권한 위반은 페이지 폴트 등 예외 처리가 필요합니다. 비트 명칭은 아키텍처별로 다릅니다.</text></svg>