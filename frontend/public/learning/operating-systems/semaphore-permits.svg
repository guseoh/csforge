<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461" role="img" aria-labelledby="title desc">
<title id="title">카운팅 세마포어 — 허가와 대기</title><desc id="desc">허가 세 개를 T1 T2 T3가 획득한 뒤 T4는 기다리고, T2의 반환으로 T4가 허가를 획득할 수 있게 되는 예시.</desc>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ededed"/></marker>
<style>.bg{fill:#171717}.box{fill:#262626;stroke:#999;stroke-width:1.6}.linebox{fill:none;stroke:#bbb;stroke-width:1.7}.shade{fill:#363636;stroke:#ededed;stroke-width:1.6}.label{fill:#f7f7f7;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.sub{fill:#d6d6d6;font-family:Arial,"Noto Sans KR",sans-serif}.arrow{stroke:#ededed;stroke-width:2.1;fill:none;marker-end:url(#arrowhead)}.plain{stroke:#acacac;stroke-width:1.6;fill:none}.dashed{stroke:#aaa;stroke-width:1.5;stroke-dasharray:7 5;fill:none}.divider{stroke:#8d8d8d;stroke-width:1.3}</style></defs>
<rect class="bg" width="1040" height="461"/><text class="label" x="42" y="49" font-size="25" text-anchor="start">카운팅 세마포어 — 허가와 대기</text><rect class="box" x="47" y="130" width="221" height="151"/><text class="label" x="61" y="161" font-size="18" text-anchor="start">초기 상태</text><text class="sub" x="61" y="188" font-size="15" text-anchor="start">사용 가능: 3</text><text class="sub" x="65" y="254" font-size="17" text-anchor="start">보유: 없음</text><rect class="box" x="291" y="130" width="221" height="151"/><text class="label" x="305" y="161" font-size="18" text-anchor="start">T1·T2·T3 획득</text><text class="sub" x="305" y="188" font-size="15" text-anchor="start">사용 가능: 0</text><text class="sub" x="307" y="254" font-size="16" text-anchor="start">보유: T1, T2, T3</text><rect class="box" x="535" y="130" width="221" height="151"/><text class="label" x="549" y="161" font-size="18" text-anchor="start">T4 획득 시도</text><text class="sub" x="549" y="188" font-size="15" text-anchor="start">허가가 없어 대기</text><text class="sub" x="552" y="254" font-size="16" text-anchor="start">사용 가능: 0</text><rect class="box" x="779" y="130" width="221" height="151"/><text class="label" x="793" y="161" font-size="18" text-anchor="start">T2 반환 이후</text><text class="sub" x="793" y="188" font-size="15" text-anchor="start">T4가 획득 가능</text><text class="sub" x="793" y="254" font-size="15" text-anchor="start">예: 보유 T1, T3, T4</text><path class="arrow" d="M268 206L291 206"/><path class="arrow" d="M512 206L535 206"/><path class="arrow" d="M756 206L779 206"/><text class="label" x="52" y="344" font-size="19" text-anchor="start">상태 변화 예시</text><text class="sub" x="52" y="380" font-size="17" text-anchor="start">3 → 2 → 1 → 0  |  T4 대기  |  T2 post → 대기 중인 T4에 허가 전달 가능</text><text class="sub" x="52" y="425" font-size="15" text-anchor="start">실제 T4의 실행 시점과 허가 인계 방식은 구현·스케줄링에 의존합니다.</text>
<style id="os-prefers-light"><![CDATA[
@media (prefers-color-scheme: light){
.bg{fill:#f9fafb}.box{fill:#edf0f4;stroke:#999;stroke-width:1.6}.linebox{fill:none;stroke:#bbb;stroke-width:1.7}.shade{fill:#e1e6eb;stroke:#354155;stroke-width:1.6}.label{fill:#202632;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.sub{fill:#405067;font-family:Arial,"Noto Sans KR",sans-serif}.arrow{stroke:#354155;stroke-width:2.1;fill:none;marker-end:url(#arrowhead)}.plain{stroke:#596075;stroke-width:1.6;fill:none}.dashed{stroke:#aaa;stroke-width:1.5;stroke-dasharray:7 5;fill:none}.divider{stroke:#596075;stroke-width:1.3}
[fill="#ededed"]{fill:#354155}
[stroke="#ededed"]{stroke:#354155}
}
]]></style>
</svg>