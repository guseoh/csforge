<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Semaphore permit flow</title>
  <desc id="desc">세 개의 permit가 task acquire로 소모되고 네 번째 task가 기다리다가 release 이후 진행하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.active{fill:#18352e;stroke:#4cc090;stroke-width:2}.wait{fill:#3a2c19;stroke:#d5a84d;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="440" rx="20"/>
  <text class="title" x="48" y="54">Semaphore — permit 3개를 공유하는 흐름</text>
  <text class="small" x="48" y="82">permit가 0이면 다음 acquire는 release/post가 일어날 때까지 진행하지 못한다</text>
  <rect class="box" x="48" y="145" width="190" height="82" rx="13"/><text class="label" x="88" y="181">초기 permit = 3</text><text class="small" x="84" y="205">available: ● ● ●</text>
  <path class="line" d="M238 186H300"/>
  <rect class="active" x="300" y="125" width="165" height="58" rx="11"/><text class="small" x="336" y="159">T1 acquire → 2</text>
  <rect class="active" x="300" y="198" width="165" height="58" rx="11"/><text class="small" x="336" y="232">T2 acquire → 1</text>
  <rect class="active" x="300" y="271" width="165" height="58" rx="11"/><text class="small" x="336" y="305">T3 acquire → 0</text>
  <path class="line" d="M465 300H545"/>
  <rect class="wait" x="545" y="260" width="185" height="78" rx="12"/><text class="label" x="593" y="292">T4 acquire</text><text class="small" x="594" y="316">permit 0 → wait</text>
  <path class="line" d="M730 299H802"/>
  <rect class="active" x="802" y="260" width="220" height="78" rx="12"/><text class="label" x="846" y="292">T2 release</text><text class="small" x="839" y="316">permit 반환 → T4 진행</text>
  <text class="small" x="48" y="394">Semaphore count는 실제 resource capacity와 함께 관리되어야 한다. 누락된 release는 permit leak, 과다 release는 capacity invariant 붕괴로 이어질 수 있다.</text>
</svg>