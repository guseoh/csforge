<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Unix-Domain Socket Lifecycle</text><rect x="70" y="125" width="200" height="95" rx="14" fill="#1f2937" stroke="#60a5fa"/><text x="115" y="180" fill="#dbeafe" font-size="19" font-family="sans-serif">Client process</text><rect x="380" y="105" width="210" height="135" rx="14" fill="#1f2937" stroke="#f59e0b"/><text x="424" y="150" fill="#fef3c7" font-size="19" font-family="sans-serif">AF_UNIX endpoint</text><text x="418" y="190" fill="#f9fafb" font-size="16" font-family="sans-serif">path / local namespace</text><rect x="700" y="125" width="190" height="95" rx="14" fill="#1f2937" stroke="#34d399"/><text x="743" y="180" fill="#d1fae5" font-size="19" font-family="sans-serif">Server process</text><path d="M270 173 L380 173" stroke="#93c5fd" stroke-width="4"/><path d="M590 173 L700 173" stroke="#6ee7b7" stroke-width="4"/><text x="297" y="153" fill="#9ca3af" font-size="14" font-family="sans-serif">connect</text><text x="612" y="153" fill="#9ca3af" font-size="14" font-family="sans-serif">accept</text><text x="70" y="310" fill="#f9fafb" font-size="17" font-family="sans-serif">SOCK_STREAM → byte stream framing still required</text><text x="70" y="350" fill="#d1d5db" font-size="17" font-family="sans-serif">Local endpoint permissions, peer credentials, close and stale-path cleanup are part of lifecycle.</text></svg>