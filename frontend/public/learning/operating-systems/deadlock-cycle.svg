<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Deadlock dependency cycle</title>
  <desc id="desc">T1이 L1을 보유하고 L2를 기다리며 T2가 L2를 보유하고 L1을 기다려 cycle이 만들어진다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 18px Inter,Arial,sans-serif}.small{fill:#b8a9c6;font:500 14px Inter,Arial,sans-serif}.thread{fill:#21192e;stroke:#6d478f;stroke-width:2}.lock{fill:#18352e;stroke:#4cc090;stroke-width:2}.edge{stroke:#a56df4;stroke-width:3;fill:none;marker-end:url(#arrow)}.hold{stroke:#4cc090;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/>
  <text class="title" x="48" y="55">Deadlock: 서로의 release를 기다리는 cycle</text>
  <text class="small" x="48" y="82">request edge와 hold relation이 한 바퀴 닫히면 참여자 스스로 progress할 수 없다.</text>
  <rect class="thread" x="90" y="185" width="190" height="88" rx="14"/><text class="label" x="168" y="225">T1</text><text class="small" x="128" y="250">holds L1 · waits L2</text>
  <rect class="lock" x="455" y="115" width="190" height="88" rx="14"/><text class="label" x="530" y="155">L2</text><text class="small" x="492" y="180">owned by T2</text>
  <rect class="thread" x="820" y="185" width="190" height="88" rx="14"/><text class="label" x="898" y="225">T2</text><text class="small" x="858" y="250">holds L2 · waits L1</text>
  <rect class="lock" x="455" y="325" width="190" height="88" rx="14"/><text class="label" x="530" y="365">L1</text><text class="small" x="492" y="390">owned by T1</text>
  <path class="edge" d="M280 208 C350 160 390 150 455 155"/><text class="small" x="325" y="145">T1 requests</text>
  <path class="hold" d="M645 160 C720 160 760 180 820 208"/><text class="small" x="690" y="145">L2 → T2</text>
  <path class="edge" d="M820 250 C750 300 710 350 645 366"/><text class="small" x="700" y="335">T2 requests</text>
  <path class="hold" d="M455 367 C380 360 330 300 280 250"/><text class="small" x="320" y="340">L1 → T1</text>
  <text class="small" x="48" y="460">핵심: 긴 대기가 아니라 dependency가 cycle로 닫혀 각 participant가 상대의 progress를 필요로 한다.</text>
</svg>