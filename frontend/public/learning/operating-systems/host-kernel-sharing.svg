<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="50" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Container vs VM Kernel Boundary</text><text x="80" y="100" fill="#bfdbfe" font-size="20" font-family="sans-serif" font-weight="700">Containers</text><rect x="70" y="125" width="330" height="95" rx="14" fill="#1f2937" stroke="#60a5fa"/><text x="115" y="165" fill="#f9fafb" font-size="17" font-family="sans-serif">Process A · Process B</text><text x="112" y="195" fill="#9ca3af" font-size="14" font-family="sans-serif">namespaces / cgroups / capabilities</text><rect x="70" y="255" width="330" height="80" rx="14" fill="#1f2937" stroke="#f59e0b"/><text x="155" y="304" fill="#fef3c7" font-size="19" font-family="sans-serif">Shared host kernel</text><text x="560" y="100" fill="#bbf7d0" font-size="20" font-family="sans-serif" font-weight="700">Virtual Machine</text><rect x="535" y="125" width="350" height="95" rx="14" fill="#1f2937" stroke="#34d399"/><text x="586" y="165" fill="#f9fafb" font-size="17" font-family="sans-serif">Guest processes + guest kernel</text><text x="586" y="195" fill="#9ca3af" font-size="14" font-family="sans-serif">separate guest OS boundary</text><rect x="535" y="255" width="350" height="80" rx="14" fill="#1f2937" stroke="#a78bfa"/><text x="635" y="304" fill="#ede9fe" font-size="19" font-family="sans-serif">Hypervisor / host</text><text x="70" y="390" fill="#d1d5db" font-size="16" font-family="sans-serif">Containers are lightweight but share the host kernel attack surface; VMs add a guest-kernel/hypervisor boundary with additional cost.</text></svg>