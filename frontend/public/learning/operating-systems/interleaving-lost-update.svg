<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">실행 교차 — 증가 연산의 갱신 손실</title><desc id="os-desc">초깃값 0을 두 스레드가 각각 읽고 1을 기록하여 갱신 하나가 사라지는 가능한 스케줄.</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dedede"/></marker>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#8f8f8f;stroke-width:1.5}.outlined{fill:none;stroke:#d6d6d6;stroke-width:1.6}.soft{fill:#303030;stroke:#a8a8a8;stroke-width:1.5}.label{fill:#f5f5f5;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.muted{fill:#d1d1d1;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:400}.arrow{fill:none;stroke:#dedede;stroke-width:2.2;marker-end:url(#end)}.plain{fill:none;stroke:#b7b7b7;stroke-width:1.8}.dash{fill:none;stroke:#bcbcbc;stroke-width:1.6;stroke-dasharray:7 6}.sep{stroke:#777;stroke-width:1}
</style></defs><rect class="bg" width="1020" height="480"/>
<text class="label" x="48" y="49" font-size="25" text-anchor="start">실행 교차 — 증가 연산의 갱신 손실</text>
<text class="label" x="65" y="114" font-size="18" text-anchor="start">시간</text><text class="label" x="289" y="114" font-size="19" text-anchor="start">스레드 A</text><text class="label" x="690" y="114" font-size="19" text-anchor="start">스레드 B</text><path class="plain" d="M144 128V374"/><text class="label" x="83" y="151" font-size="16" text-anchor="start">1</text><rect class="soft" x="232" y="128" width="280" height="36"/><text class="label" x="248" y="158" font-size="18" text-anchor="start">읽기: 0</text><text class="label" x="83" y="191" font-size="16" text-anchor="start">2</text><rect class="soft" x="640" y="168" width="280" height="36"/><text class="label" x="656" y="198" font-size="18" text-anchor="start">읽기: 0</text><text class="label" x="83" y="231" font-size="16" text-anchor="start">3</text><rect class="soft" x="232" y="208" width="280" height="36"/><text class="label" x="248" y="238" font-size="18" text-anchor="start">계산: 1</text><text class="label" x="83" y="271" font-size="16" text-anchor="start">4</text><rect class="soft" x="640" y="248" width="280" height="36"/><text class="label" x="656" y="278" font-size="18" text-anchor="start">계산: 1</text><text class="label" x="83" y="311" font-size="16" text-anchor="start">5</text><rect class="soft" x="232" y="288" width="280" height="36"/><text class="label" x="248" y="318" font-size="18" text-anchor="start">쓰기: 1</text><text class="label" x="83" y="351" font-size="16" text-anchor="start">6</text><rect class="soft" x="640" y="328" width="280" height="36"/><text class="label" x="656" y="358" font-size="18" text-anchor="start">쓰기: 1</text><rect class="outlined" x="530" y="405" width="430" height="43"/><text class="label" x="745" y="434" font-size="19" text-anchor="middle">기대 2  ≠  실제 최종값 1</text><text class="muted" x="48" y="467" font-size="15" text-anchor="start">이것은 한 가지 가능한 실행 순서입니다. 모든 실행이 같은 결과를 내는 것은 아닙니다.</text>
</svg>