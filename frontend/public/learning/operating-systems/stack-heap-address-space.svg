<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Process virtual address space regions</title>
  <desc id="desc">Process virtual address space 안에 code, file mappings, heap, thread stacks가 서로 다른 영역과 lifetime을 갖는 개념도</desc>
  <rect width="960" height="430" rx="24" fill="#111827"/>
  <text x="48" y="52" fill="#f9fafb" font-size="28" font-family="Arial, sans-serif" font-weight="700">Process Virtual Address Space</text>
  <rect x="280" y="82" width="400" height="300" rx="18" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="330" y="112" width="300" height="45" rx="9" fill="#111827" stroke="#6b7280"/><text x="480" y="140" fill="#f9fafb" font-size="17">executable / shared libraries</text>
    <rect x="330" y="170" width="300" height="45" rx="9" fill="#111827" stroke="#6b7280"/><text x="480" y="198" fill="#f9fafb" font-size="17">file mappings / native mappings</text>
    <rect x="330" y="228" width="300" height="55" rx="9" fill="#111827" stroke="#6b7280"/><text x="480" y="253" fill="#f9fafb" font-size="17">dynamic heap region(s)</text><text x="480" y="274" fill="#9ca3af" font-size="13">lifetime: dynamic allocation</text>
    <rect x="330" y="296" width="142" height="55" rx="9" fill="#111827" stroke="#6b7280"/><text x="401" y="320" fill="#f9fafb" font-size="16">Thread A stack</text><text x="401" y="341" fill="#9ca3af" font-size="13">call state</text>
    <rect x="488" y="296" width="142" height="55" rx="9" fill="#111827" stroke="#6b7280"/><text x="559" y="320" fill="#f9fafb" font-size="16">Thread B stack</text><text x="559" y="341" fill="#9ca3af" font-size="13">call state</text>
  </g>
  <text x="190" y="245" text-anchor="middle" fill="#d1d5db" font-size="16" font-family="Arial, sans-serif">layout / growth direction</text>
  <text x="190" y="270" text-anchor="middle" fill="#9ca3af" font-size="14" font-family="Arial, sans-serif">ABI·OS·runtime dependent</text>
  <line x1="240" y1="255" x2="280" y2="255" stroke="#e5e7eb" stroke-width="3"/><polygon points="280,255 267,247 267,263" fill="#e5e7eb"/>
  <text x="480" y="410" text-anchor="middle" fill="#9ca3af" font-size="16" font-family="Arial, sans-serif">그림의 위/아래 방향보다 region의 책임·lifetime·failure mode를 구분하는 것이 핵심이다.</text>
</svg>