<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><title>블록 할당 방식 비교</title><desc>연속 할당은 인접한 데이터 블록, 연결 할당은 포인터를 통해 연결된 흩어진 데이터 블록, 인덱스 할당은 인덱스 엔트리 0·1·2가 물리 블록 B7·B20·B9를 각각 가리킨다.</desc><rect width="960" height="430" rx="24" fill="#111827"/><text x="48" y="52" fill="#f9fafb" font-size="24" font-family="sans-serif" font-weight="700">Block Allocation Trade-offs</text><text x="70" y="105" fill="#bfdbfe" font-size="19" font-family="sans-serif">Contiguous</text><rect x="70" y="125" width="82" height="58" rx="8" fill="#2563eb"/><rect x="158" y="125" width="82" height="58" rx="8" fill="#2563eb"/><rect x="246" y="125" width="82" height="58" rx="8" fill="#2563eb"/><text x="365" y="160" fill="#e5e7eb" font-size="17" font-family="sans-serif">fast position calculation, hard growth / fragmentation</text><text x="70" y="235" fill="#bbf7d0" font-size="19" font-family="sans-serif">Linked</text><rect x="70" y="255" width="82" height="58" rx="8" fill="#059669"/><rect x="210" y="255" width="82" height="58" rx="8" fill="#059669"/><rect x="350" y="255" width="82" height="58" rx="8" fill="#059669"/><path d="M152 284 L210 284" stroke="#6ee7b7" stroke-width="4"/><path d="M292 284 L350 284" stroke="#6ee7b7" stroke-width="4"/><text x="475" y="290" fill="#e5e7eb" font-size="17" font-family="sans-serif">flexible placement, pointer-chain random lookup</text><text x="70" y="370" fill="#fde68a" font-size="19" font-family="sans-serif">Indexed</text><rect x="170" y="340" width="100" height="62" rx="8" fill="#92400e" stroke="#fbbf24" stroke-width="2"/><text x="183" y="357" fill="#fff7ed" font-size="14" font-family="sans-serif">entry[0]</text><text x="183" y="376" fill="#fff7ed" font-size="14" font-family="sans-serif">entry[1]</text><text x="183" y="395" fill="#fff7ed" font-size="14" font-family="sans-serif">entry[2]</text><path d="M270 353 L390 331 M270 372 L390 366 M270 391 L390 401" fill="none" stroke="#fbbf24" stroke-width="3"/><rect x="390" y="316" width="76" height="30" rx="5" fill="#d97706"/><rect x="390" y="351" width="76" height="30" rx="5" fill="#d97706"/><rect x="390" y="386" width="76" height="30" rx="5" fill="#d97706"/><text x="412" y="337" fill="#fff7ed" font-size="15" font-family="sans-serif">B7</text><text x="407" y="372" fill="#fff7ed" font-size="15" font-family="sans-serif">B20</text><text x="412" y="407" fill="#fff7ed" font-size="15" font-family="sans-serif">B9</text><text x="495" y="370" fill="#e5e7eb" font-size="16" font-family="sans-serif">direct lookup via index</text><text x="495" y="393" fill="#e5e7eb" font-size="16" font-family="sans-serif">extra metadata space</text></svg>