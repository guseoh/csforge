<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" role="img" aria-labelledby="os-title os-desc">
<title id="os-title">스레드 풀 — 작업 수용과 한계</title><desc id="os-desc">최대 작업자 2명·대기열 용량 2인 예시. 포화 후 신규 작업은 정책에 따라 거절 또는 역압.</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dedede"/></marker>
<style>
.bg{fill:#171717}.panel{fill:#242424;stroke:#8f8f8f;stroke-width:1.5}.outlined{fill:none;stroke:#d6d6d6;stroke-width:1.6}.soft{fill:#303030;stroke:#a8a8a8;stroke-width:1.5}.label{fill:#f5f5f5;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:600}.muted{fill:#d1d1d1;font-family:Arial,"Noto Sans KR",sans-serif;font-weight:400}.arrow{fill:none;stroke:#dedede;stroke-width:2.2;marker-end:url(#end)}.plain{fill:none;stroke:#b7b7b7;stroke-width:1.8}.dash{fill:none;stroke:#bcbcbc;stroke-width:1.6;stroke-dasharray:7 6}.sep{stroke:#777;stroke-width:1}
</style></defs><rect class="bg" width="1020" height="480"/>
<text class="label" x="48" y="49" font-size="25" text-anchor="start">스레드 풀 — 작업 수용과 한계</text>
<rect class="panel" x="44" y="159" width="187" height="92"/><text class="label" x="60" y="189" font-size="18" text-anchor="start">작업 도착</text><text class="muted" x="60" y="215" font-size="15" text-anchor="start">요청 A·B·C·D·E</text><rect class="panel" x="277" y="159" width="218" height="92"/><text class="label" x="293" y="189" font-size="18" text-anchor="start">대기열 (최대 2)</text><text class="muted" x="293" y="215" font-size="15" text-anchor="start">C · D 대기</text><rect class="panel" x="552" y="105" width="213" height="90"/><text class="label" x="568" y="135" font-size="18" text-anchor="start">작업자 1</text><text class="muted" x="568" y="161" font-size="15" text-anchor="start">A 실행</text><rect class="panel" x="552" y="223" width="213" height="90"/><text class="label" x="568" y="253" font-size="18" text-anchor="start">작업자 2</text><text class="muted" x="568" y="279" font-size="15" text-anchor="start">B 실행</text><path class="arrow" d="M231 205H277"/><path class="arrow" d="M495 204H522V150H552"/><path class="arrow" d="M522 204V265H552"/><rect class="panel" x="784" y="345" width="190" height="83"/><text class="label" x="800" y="375" font-size="18" text-anchor="start">포화 시 정책</text><text class="muted" x="800" y="401" font-size="15" text-anchor="start">E: 거절 / 기다림</text><path class="dash" d="M385 251V380H784"/><text class="muted" x="807" y="304" font-size="15" text-anchor="start">예: 모든 작업자가 사용 중</text><text class="muted" x="48" y="462" font-size="15" text-anchor="start">풀·큐가 반드시 유한한 것은 아닙니다. 그림은 제한을 명시한 하나의 설정 사례입니다.</text>
</svg>