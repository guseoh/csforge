<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="cow-title cow-desc">
<title id="cow-title">fork 후 쓰기 시 복사</title><desc id="cow-desc">부모와 자식의 쓰기 가능한 private 익명 페이지를 읽기 전용 PTE로 공유한 뒤 자식이 쓰면 복사 및 새 PTE를 통해 독립된 값을 저장한다. 부모의 기존 프레임은 같은 위치에 유지한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="head"/></marker><style>.bg{fill:#fff}.title{fill:#181818;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#424242;font:19px system-ui,sans-serif}.note{fill:#444;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#888;stroke-width:1.5}.hi{fill:#e2e2e2;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.head{fill:#555}.dash{stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#383838;stroke:#eee}.line,.edge{stroke:#bbb}.head{fill:#bbb}}</style></defs><rect class="bg" width="960" height="480"/>
<text x="30" y="43" class="title" text-anchor="start">쓰기 시 복사: 같은 가상 주소, 다른 물리 프레임</text>
<text x="30" y="80" class="small" text-anchor="start">Linux fork · private 익명 페이지 · 부모는 기존 값을 계속 읽음</text>
<text x="30" y="126" class="label" text-anchor="start">① fork 직후</text>
<text x="500" y="126" class="label" text-anchor="start">② 자식이 값 20을 쓴 뒤</text>
<path class="line" d="M480 110V411"/>
<rect x="30" y="152" width="182" height="72" class="panel"/>
<text x="121" y="180" class="label" text-anchor="middle">부모 VA 0x1000</text>
<text x="121" y="208" class="small" text-anchor="middle">PTE: 읽기 전용</text>
<rect x="265" y="152" width="182" height="72" class="panel"/>
<text x="356" y="180" class="label" text-anchor="middle">자식 VA 0x1000</text>
<text x="356" y="208" class="small" text-anchor="middle">PTE: 읽기 전용</text>
<rect x="30" y="310" width="182" height="83" class="panel"/>
<text x="121" y="342" class="label" text-anchor="middle">Frame F</text>
<text x="121" y="372" class="small" text-anchor="middle">값 = 10</text>
<path class="edge" d="M121 224V304"/>
<path class="edge" d="M356 224V265H175V304"/>
<text x="356" y="295" class="small" text-anchor="middle">같은 F 공유</text>
<rect x="500" y="152" width="182" height="72" class="panel"/>
<text x="591" y="180" class="label" text-anchor="middle">부모 VA 0x1000</text>
<text x="591" y="208" class="small" text-anchor="middle">PTE: 읽기 전용</text>
<rect x="735" y="152" width="182" height="72" class="hi"/>
<text x="826" y="180" class="label" text-anchor="middle">자식 VA 0x1000</text>
<text x="826" y="208" class="small" text-anchor="middle">PTE: 쓰기 허용</text>
<rect x="500" y="310" width="182" height="83" class="panel"/>
<text x="591" y="342" class="label" text-anchor="middle">Frame F</text>
<text x="591" y="372" class="small" text-anchor="middle">값 = 10</text>
<path class="edge" d="M591 224V304"/>
<rect x="735" y="310" width="182" height="83" class="hi"/>
<text x="826" y="342" class="label" text-anchor="middle">Frame F2</text>
<text x="826" y="372" class="small" text-anchor="middle">값 = 20</text>
<path class="edge" d="M826 224V304"/>
<text x="826" y="277" class="small" text-anchor="middle">복사 후 쓰기</text>
<text x="30" y="443" class="note" text-anchor="start">자식의 쓰기 폴트 → 커널이 private 매핑 분리 → 명령 재시도</text>
<text x="30" y="468" class="note" text-anchor="start">실제 구현은 단독 소유가 확인되면 복사 없이 쓰기 권한만 복원할 수도 있음</text>
</svg>
