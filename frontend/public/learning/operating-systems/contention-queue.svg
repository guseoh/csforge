<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Lock contention queue</title>
  <desc id="desc">여러 요청이 같은 lock을 기다리며 queue를 만들고 owner의 hold time이 길수록 대기가 늘어나는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.wait{fill:#3a2c19;stroke:#d5a84d;stroke-width:2}.owner{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.done{fill:#18352e;stroke:#4cc090;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="440" rx="20"/>
  <text class="title" x="48" y="54">Contention — 하나의 serialization point에 queue가 쌓이는 과정</text>
  <text class="small" x="48" y="82">arrival rate와 hold time이 커지면 waiter의 acquisition latency와 tail latency가 함께 늘어난다</text>
  <rect class="wait" x="50" y="165" width="130" height="68" rx="11"/><text class="label" x="92" y="205">W4</text>
  <rect class="wait" x="198" y="165" width="130" height="68" rx="11"/><text class="label" x="240" y="205">W3</text>
  <rect class="wait" x="346" y="165" width="130" height="68" rx="11"/><text class="label" x="388" y="205">W2</text>
  <rect class="wait" x="494" y="165" width="130" height="68" rx="11"/><text class="label" x="536" y="205">W1</text>
  <path class="line" d="M624 199H690"/>
  <rect class="owner" x="690" y="145" width="230" height="108" rx="13"/><text class="label" x="744" y="187">LOCK OWNER</text><text class="small" x="747" y="215">critical section</text><text class="small" x="760" y="236">hold time</text>
  <path class="line" d="M920 199H980"/>
  <rect class="done" x="980" y="165" width="80" height="68" rx="11"/><text class="small" x="998" y="204">done</text>
  <text class="small" x="50" y="300">hold time ↑  →  단위 시간당 직렬 구간 처리 여유 ↓  →  wait queue와 acquisition latency ↑</text>
  <text class="small" x="50" y="335">spin waiter는 CPU cycle을, blocking waiter는 sleep/wakeup·scheduling 비용을 사용할 수 있다.</text>
  <text class="small" x="50" y="370">explicit lock이 없어도 같은 atomic/cache line을 여러 CPU가 갱신하면 coherence contention이 남을 수 있다.</text>
  <text class="small" x="50" y="405">측정 대상: hold time · waiter 수 · acquisition latency · blocked/spinning time · throughput · p95/p99 latency</text>
</svg>