<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="method-security-proxy-boundary-title method-security-proxy-boundary-desc"><title id="method-security-proxy-boundary-title">메서드 보안의 프록시 경계</title><desc id="method-security-proxy-boundary-desc">외부 프록시 경유는 인가 평가, self-invocation은 우회 가능.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="32" class="h" text-anchor="middle">메서드 보안 · 활성화 및 프록시 경유 조건</text><text x="235" y="78" class="h" text-anchor="middle">외부 호출</text><text x="725" y="78" class="h" text-anchor="middle">자기 호출</text><rect x="35" y="100" width="400" height="52" class="r"/><text x="235" y="132" class="m" text-anchor="middle">호출자</text><rect x="525" y="100" width="400" height="52" class="r"/><text x="725" y="132" class="m" text-anchor="middle">대상 객체 내부 메서드</text><line x1="235" y1="152" x2="235" y2="190" class="l" marker-end="url(#arr)"/><rect x="35" y="190" width="400" height="52" class="a"/><text x="235" y="222" class="m" text-anchor="middle">인가 프록시 / 인터셉터</text><line x1="235" y1="242" x2="235" y2="280" class="l" marker-end="url(#arr)"/><rect x="35" y="280" width="400" height="52" class="r"/><text x="235" y="312" class="m" text-anchor="middle">허용 시 대상 메서드</text><line x1="725" y1="152" x2="725" y2="280" class="d" marker-end="url(#arr)"/><text x="725" y="222" class="s" text-anchor="middle">프록시 우회</text><rect x="525" y="280" width="400" height="52" class="a"/><text x="725" y="312" class="m" text-anchor="middle">this.method()</text><line x1="480" y1="55" x2="480" y2="350" class="d"/><text x="480" y="382" class="s" text-anchor="middle">@EnableMethodSecurity + Spring 관리 빈의 실제 프록시 호출</text></svg>
