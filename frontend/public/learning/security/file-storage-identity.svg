<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="file-storage-identity-title file-storage-identity-desc"><title id="file-storage-identity-title">파일 이름과 저장 위치 분리</title><desc id="file-storage-identity-desc">표시용 이름과 서버 생성 저장 키를 분리하여 허용 저장 위치로 저장한다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="32" class="h" text-anchor="middle">사용자 표시 이름과 실제 저장 위치는 분리</text><rect x="45" y="80" width="270" height="52" class="r"/><text x="180" y="112" class="m" text-anchor="middle">originalName</text><text x="180" y="161" class="s" text-anchor="middle">화면 표시용 메타데이터</text><rect x="405" y="80" width="510" height="52" class="a"/><text x="660" y="112" class="m" text-anchor="middle">서버가 생성한 storageKey</text><line x1="660" y1="132" x2="660" y2="190" class="strong" marker-end="url(#arr)"/><rect x="405" y="190" width="510" height="150" class="r"/><text x="430" y="220" class="s" text-anchor="start">허용된 저장 루트</text><rect x="445" y="245" width="430" height="52" class="a"/><text x="660" y="277" class="m" text-anchor="middle">서버가 결정한 저장 객체</text><text x="180" y="230" class="s" text-anchor="middle">경로로 직접 사용하지 않음</text><text x="480" y="385" class="s" text-anchor="middle">경로 포함 여부 · 심볼릭 링크 · 파일 내용 · 다운로드 인가 별도 검증</text></svg>
