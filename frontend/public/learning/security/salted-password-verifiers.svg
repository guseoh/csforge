<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="salted-password-verifiers-title salted-password-verifiers-desc"><title id="salted-password-verifiers-title">솔트와 비밀번호 검증 값</title><desc id="salted-password-verifiers-desc">같은 비밀번호 무솔트 동일 해시, 개별 솔트 사용 시 별도의 검증자 A B.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="375"/><text x="480" y="32" class="h" text-anchor="middle">같은 비밀번호 · 각 검증 값은 독립된 솔트 사용</text><text x="35" y="93" class="m" text-anchor="start">솔트 없음</text><rect x="250" y="65" width="210" height="48" class="r"/><text x="355" y="95" class="m" text-anchor="middle">동일 입력</text><line x1="460" y1="89" x2="525" y2="89" class="l" marker-end="url(#arr)"/><rect x="525" y="65" width="370" height="48" class="r"/><text x="710" y="95" class="m" text-anchor="middle">동일 해시 H</text><text x="35" y="181" class="m" text-anchor="start">개별 솔트</text><rect x="250" y="153" width="210" height="48" class="r"/><text x="355" y="183" class="m" text-anchor="middle">입력 + salt A</text><line x1="460" y1="177" x2="525" y2="177" class="l" marker-end="url(#arr)"/><rect x="525" y="153" width="370" height="48" class="a"/><text x="710" y="183" class="m" text-anchor="middle">검증자 A</text><rect x="250" y="221" width="210" height="48" class="r"/><text x="355" y="251" class="m" text-anchor="middle">입력 + salt B</text><line x1="460" y1="245" x2="525" y2="245" class="l" marker-end="url(#arr)"/><rect x="525" y="221" width="370" height="48" class="a"/><text x="710" y="251" class="m" text-anchor="middle">검증자 B</text><text x="480" y="322" class="s" text-anchor="middle">저장 형식에 솔트와 알고리즘·비용 정보 포함 가능</text><text x="480" y="352" class="s" text-anchor="middle">솔트는 비밀 키가 아님 · 전용 비밀번호 해시 비용도 필요</text></svg>
