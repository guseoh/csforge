<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="ssrf-destination-validation-title ssrf-destination-validation-desc"><title id="ssrf-destination-validation-title">서버 요청의 목적지 검증 경계</title><desc id="ssrf-destination-validation-desc">사용자 URL을 실제 목적지 정책으로 검증하고 금지 목적지를 차단.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="480" y="32" class="h" text-anchor="middle">SSRF 방어 · 실제 연결 목적지 검증</text><rect x="35" y="75" width="235" height="52" class="r"/><text x="152.5" y="107" class="m" text-anchor="middle">사용자 URL</text><line x1="270" y1="101" x2="330" y2="101" class="l" marker-end="url(#arr)"/><rect x="330" y="75" width="280" height="52" class="r"/><text x="470" y="107" class="m" text-anchor="middle">서버 요청 기능</text><line x1="610" y1="101" x2="670" y2="101" class="l" marker-end="url(#arr)"/><rect x="670" y="75" width="255" height="52" class="a"/><text x="797.5" y="107" class="m" text-anchor="middle">목적지 정책</text><path d="M797 127 V166 H245 V192" class="l" marker-end="url(#arr)"/><path d="M797 127 V166 H725 V192" class="l" marker-end="url(#arr)"/><rect x="45" y="192" width="400" height="56" class="r"/><text x="245" y="226" class="m" text-anchor="middle">허용 목적지</text><rect x="525" y="192" width="400" height="56" class="a"/><text x="725" y="226" class="m" text-anchor="middle">금지 내부/메타데이터</text><text x="245" y="285" class="s" text-anchor="middle">DNS 결과·실제 연결 일치</text><text x="725" y="285" class="s" text-anchor="middle">연결 차단</text><text x="480" y="341" class="s" text-anchor="middle">리다이렉트 새 목적지도 재검증 · 플랫폼 송신 정책으로 이중 방어</text></svg>
