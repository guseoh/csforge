<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="session-id-lookup-title session-id-lookup-desc"><title id="session-id-lookup-title">세션 ID 발급과 요청 인증 상태 복원</title><desc id="session-id-lookup-desc">로그인 후 서버 세션 생성, 쿠키 발급, 다음 요청 쿠키로 세션 조회 인증 복원 인가 후 응답.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="500"/><text x="480" y="29" class="h" text-anchor="middle">세션 쿠키는 서버 인증 상태의 식별자</text><text x="135" y="64" class="h" text-anchor="middle">브라우저</text><line x1="135" y1="80" x2="135" y2="440" class="d"/><text x="480" y="64" class="h" text-anchor="middle">서버</text><line x1="480" y1="80" x2="480" y2="440" class="d"/><text x="830" y="64" class="h" text-anchor="middle">세션 저장소</text><line x1="830" y1="80" x2="830" y2="440" class="d"/><line x1="135" y1="116" x2="480" y2="116" class="l" marker-end="url(#arr)"/><text x="307.5" y="107" class="s" text-anchor="middle">로그인 요청</text><line x1="480" y1="164" x2="830" y2="164" class="strong" marker-end="url(#arr)"/><text x="655" y="155" class="s" text-anchor="middle">검증 성공 후 세션 S123 저장</text><line x1="480" y1="212" x2="135" y2="212" class="d" marker-end="url(#arr)"/><text x="307.5" y="203" class="s" text-anchor="middle">Set-Cookie: JSESSIONID=S123</text><line x1="35" y1="240" x2="925" y2="240" class="l"/><line x1="135" y1="282" x2="480" y2="282" class="l" marker-end="url(#arr)"/><text x="307.5" y="273" class="s" text-anchor="middle">Cookie: JSESSIONID=S123</text><line x1="480" y1="326" x2="830" y2="326" class="l" marker-end="url(#arr)"/><text x="655" y="317" class="s" text-anchor="middle">S123 조회</text><line x1="830" y1="370" x2="480" y2="370" class="d" marker-end="url(#arr)"/><text x="655" y="361" class="s" text-anchor="middle">Authentication 복원</text><line x1="480" y1="414" x2="135" y2="414" class="d" marker-end="url(#arr)"/><text x="307.5" y="405" class="s" text-anchor="middle">인가 후 응답</text><text x="480" y="475" class="s" text-anchor="middle">쿠키 자체에 사용자 권한 전체를 저장한다고 가정하지 않음</text></svg>
