<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="security-exception-routing-title security-exception-routing-desc"><title id="security-exception-routing-title">인증·인가 예외의 응답 변환</title><desc id="security-exception-routing-desc">AuthenticationException은 EntryPoint. AccessDeniedException은 익명/remember-me 등 상태에 따라 EntryPoint 또는 AccessDeniedHandler.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="455"/><text x="480" y="32" class="h" text-anchor="middle">하위 호출에서 발생한 인증·인가 예외</text><rect x="275" y="70" width="410" height="50" class="r"/><text x="480" y="101" class="m" text-anchor="middle">ExceptionTranslationFilter</text><path d="M480 120 V145 H235 V170" class="l" marker-end="url(#arr)"/><path d="M480 120 V145 H725 V170" class="l" marker-end="url(#arr)"/><rect x="35" y="170" width="400" height="50" class="r"/><text x="235" y="201" class="m" text-anchor="middle">AuthenticationException</text><rect x="525" y="170" width="400" height="50" class="r"/><text x="725" y="201" class="m" text-anchor="middle">AccessDeniedException</text><line x1="235" y1="220" x2="235" y2="300" class="l" marker-end="url(#arr)"/><path d="M725 220 V246 H550 V300" class="l" marker-end="url(#arr)"/><path d="M725 220 V246 H800 V300" class="l" marker-end="url(#arr)"/><text x="550" y="270" class="s" text-anchor="middle">추가 인증 필요</text><text x="800" y="270" class="s" text-anchor="middle">충분히 인증됨</text><rect x="35" y="300" width="400" height="52" class="a"/><text x="235" y="332" class="m" text-anchor="middle">AuthenticationEntryPoint</text><rect x="450" y="300" width="200" height="52" class="a"/><text x="550" y="332" class="m" text-anchor="middle">EntryPoint</text><rect x="675" y="300" width="250" height="52" class="a"/><text x="800" y="332" class="m" text-anchor="middle">AccessDeniedHandler</text><text x="235" y="385" class="s" text-anchor="middle">401 / 로그인 이동 등</text><text x="800" y="385" class="s" text-anchor="middle">일반적으로 403</text><text x="480" y="429" class="s" text-anchor="middle">모든 인증 필터의 실패가 이 필터에서 처리되는 것은 아님</text></svg>
