<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="jws-jwt-signing-boundary-title jws-jwt-signing-boundary-desc"><title id="jws-jwt-signing-boundary-title">JWT 구조와 서명 입력</title><desc id="jws-jwt-signing-boundary-desc">compact JWS header.payload.signature/MAC, 앞 두 부분은 인코딩된 서명 입력.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="480" y="32" class="h" text-anchor="middle">일반적인 compact JWS JWT의 구조</text><rect x="35" y="80" width="250" height="55" class="r"/><text x="160" y="113.5" class="m" text-anchor="middle">header</text><text x="300" y="115" class="h" text-anchor="middle">.</text><rect x="315" y="80" width="310" height="55" class="r"/><text x="470" y="113.5" class="m" text-anchor="middle">payload</text><text x="640" y="115" class="h" text-anchor="middle">.</text><rect x="655" y="80" width="270" height="55" class="a"/><text x="790" y="113.5" class="m" text-anchor="middle">signature / MAC</text><text x="160" y="170" class="s" text-anchor="middle">alg, typ 등</text><text x="470" y="170" class="s" text-anchor="middle">iss, sub, aud, exp 등</text><text x="790" y="170" class="s" text-anchor="middle">무결성 검증 자료</text><path d="M35 198 V217 H625 V198" class="l"/><text x="330" y="247" class="m" text-anchor="middle">서명 입력: 인코딩된 header.payload</text><text x="480" y="305" class="s" text-anchor="middle">header·payload는 Base64URL 인코딩 · 암호화되지 않음</text><text x="480" y="342" class="s" text-anchor="middle">신뢰 키·허용 알고리즘·서명과 클레임 조건을 모두 검사</text></svg>
