<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="title desc">
  <title id="title">비밀번호 저장 방식 비교: 평문·양방향 암호화·고속 해시 vs 전용 느린 해시</title>
  <desc id="desc">DB 유출을 가정할 때 평문, AES 암호화, 단순 SHA-256의 위험과 솔트+Argon2id/bcrypt 단방향 검증자 방식의 방어 원리를 비교하는 도식</desc>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#f1f5f9; --bd:#cbd5e1; --tx:#0f172a; --sub:#475569; --green-bg:#ecfdf5; --green-bd:#10b981; --green-tx:#047857; --amber-bg:#fffbeb; --amber-bd:#f59e0b; --amber-tx:#b45309; --red-bg:#fef2f2; --red-bd:#ef4444; --red-tx:#b91c1c; --blue-bg:#eff6ff; --blue-bd:#3b82f6; --blue-tx:#1d4ed8; --arr:#64748b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --muted:#0b1220; --bd:#334155; --tx:#f1f5f9; --sub:#94a3b8; --green-bg:#064e3b; --green-bd:#34d399; --green-tx:#6ee7b7; --amber-bg:#451a03; --amber-bd:#fbbf24; --amber-tx:#fcd34d; --red-bg:#450a0a; --red-bd:#f87171; --red-tx:#fca5a5; --blue-bg:#172554; --blue-bd:#60a5fa; --blue-tx:#93c5fd; --arr:#94a3b8; } }
    text { font-family: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--tx); }
    .h2 { font-size:13.5px; font-weight:700; }
    .b { font-size:12px; fill:var(--tx); }
    .s { font-size:11px; fill:var(--sub); }
    .k { font-size:11.5px; font-weight:700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--arr)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="420" rx="14" fill="var(--bg)"/>
  <text x="28" y="34" class="h1">비밀번호 저장: 원문 보관이 아닌 단방향 검증자(Verifier) 설계</text>
  <text x="28" y="54" class="s">DB 백업 유출을 전제로, 오프라인 추측 비용을 극대화하고 원문 복구 경로를 없애야 한다.</text>

  <!-- 3 Bad vs Good Cards -->
  <rect x="28" y="74" width="246" height="172" rx="10" fill="var(--red-bg)" stroke="var(--red-bd)" stroke-width="1.4"/>
  <text x="44" y="100" class="h2" fill="var(--red-tx)">✗ 평문 · 양방향 암호화</text>
  <text x="44" y="128" class="b">• 평문 저장 / AES 암호화</text>
  <text x="44" y="150" class="b">• DB + 키 유출 시 즉시</text>
  <text x="44" y="168" class="b">  전체 원문 비밀번호 복원</text>
  <text x="44" y="196" class="s">로그인 검증엔 원문 복호가</text>
  <text x="44" y="212" class="s">전혀 필요하지 않다</text>

  <rect x="297" y="74" width="246" height="172" rx="10" fill="var(--amber-bg)" stroke="var(--amber-bd)" stroke-width="1.4"/>
  <text x="313" y="100" class="h2" fill="var(--amber-tx)">✗ 일반 고속 해시 (SHA-256)</text>
  <text x="313" y="128" class="b">• 초당 수십억 회 계산 가능</text>
  <text x="313" y="150" class="b">• GPU/ASIC 오프라인 추측에</text>
  <text x="313" y="168" class="b">  수 분 만에 대량 크래킹</text>
  <text x="313" y="196" class="s">무결성 체크섬용이지</text>
  <text x="313" y="212" class="s">비밀번호 저장용이 아니다</text>

  <rect x="566" y="74" width="246" height="172" rx="10" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.6"/>
  <text x="582" y="100" class="h2" fill="var(--green-tx)">✓ 전용 느린 해시 + 고유 솔트</text>
  <text x="582" y="128" class="b">• Argon2id / scrypt / bcrypt</text>
  <text x="582" y="150" class="b">• 계정별 고유 랜덤 솔트 포함</text>
  <text x="582" y="172" class="b">• 메모리·연산 비용 조절 가능</text>
  <text x="582" y="200" class="k" fill="var(--green-tx)">→ 레인보우 테이블·GPU 방어</text>
  <text x="582" y="220" class="s">재설정 = 단기 토큰으로 새로 설정</text>

  <!-- Bottom Verification Flow -->
  <rect x="28" y="266" width="784" height="130" rx="10" fill="var(--card)" stroke="var(--blue-bd)" stroke-width="1.4"/>
  <text x="46" y="292" class="h2" fill="var(--blue-tx)">가입 저장 및 로그인 검증 흐름 (PasswordEncoder.matches)</text>

  <rect x="46" y="308" width="212" height="68" rx="8" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="60" y="330" class="k" fill="var(--tx)">1. 입력 비밀번호 (원문)</text>
  <text x="60" y="350" class="s">로그인 요청 시 일시 수신</text>
  <text x="60" y="366" class="s">(로그·세션에 절대 저장 금지)</text>

  <rect x="298" y="308" width="240" height="68" rx="8" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.2"/>
  <text x="312" y="330" class="k" fill="var(--blue-tx)">2. 동일 솔트·파라미터 재해시</text>
  <text x="312" y="350" class="s">저장된 해시 문자열에서 알고리즘·</text>
  <text x="312" y="366" class="s">솔트·비용을 읽어 입력을 다시 해시</text>

  <rect x="578" y="308" width="216" height="68" rx="8" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.2"/>
  <text x="592" y="330" class="k" fill="var(--green-tx)">3. 상수 시간 비교 (복호화 없음)</text>
  <text x="592" y="350" class="s">저장 검증자와 일치 여부만 판정</text>
  <text x="592" y="366" class="s">완료 후 원문 credentials 소거</text>

  <line x1="258" y1="342" x2="294" y2="342" stroke="var(--arr)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="538" y1="342" x2="574" y2="342" stroke="var(--arr)" stroke-width="2" marker-end="url(#arr)"/>
</svg>
