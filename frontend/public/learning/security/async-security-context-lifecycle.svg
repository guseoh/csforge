<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="async-security-context-lifecycle-title async-security-context-lifecycle-desc"><title id="async-security-context-lifecycle-title">비동기 인증 문맥 전달</title><desc id="async-security-context-lifecycle-desc">제출 시 캡처, 작업 스레드 설정, 실행, finally 정리 또는 복원.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="480" y="32" class="h" text-anchor="middle">Executor · 제출 문맥과 작업 스레드의 수명</text><text x="35" y="100" class="m" text-anchor="start">요청 스레드</text><rect x="240" y="70" width="300" height="48" class="a"/><text x="390" y="100" class="m" text-anchor="middle">Context: 회원 42</text><line x1="540" y1="94" x2="635" y2="94" class="l" marker-end="url(#arr)"/><rect x="635" y="70" width="280" height="48" class="r"/><text x="775" y="100" class="m" text-anchor="middle">submit 시 캡처</text><path d="M775 118 V155 H342 V195" class="d" marker-end="url(#arr)"/><text x="35" y="222" class="m" text-anchor="start">작업 스레드</text><rect x="240" y="195" width="205" height="48" class="a"/><text x="342.5" y="225" class="m" text-anchor="middle">문맥 설정</text><line x1="445" y1="219" x2="485" y2="219" class="l" marker-end="url(#arr)"/><rect x="485" y="195" width="195" height="48" class="r"/><text x="582.5" y="225" class="m" text-anchor="middle">작업 실행</text><line x1="680" y1="219" x2="720" y2="219" class="l" marker-end="url(#arr)"/><rect x="720" y="195" width="195" height="48" class="a"/><text x="817.5" y="225" class="m" text-anchor="middle">finally 정리</text><text x="480" y="305" class="s" text-anchor="middle">기존 작업 문맥 복원/정리는 래퍼 계약에 따름</text><text x="480" y="338" class="s" text-anchor="middle">장시간 대기 후 민감 작업은 실행 시점에 권한 재평가</text></svg>
