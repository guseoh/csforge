<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="logging-redaction-propagation-title logging-redaction-propagation-desc"><title id="logging-redaction-propagation-title">로그 수집 전 민감값 제거</title><desc id="logging-redaction-propagation-desc">요청 오류에서 허용 필드를 선택한 뒤 중앙 검색 알림 보관소로 구조화 로그를 전파한다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="32" class="h" text-anchor="middle">로그 전파 경계 · 수집 전에 민감값 제거</text><rect x="35" y="80" width="250" height="54" class="r"/><text x="160" y="113" class="m" text-anchor="middle">요청 / 오류 정보</text><line x1="285" y1="107" x2="340" y2="107" class="strong" marker-end="url(#arr)"/><rect x="340" y="80" width="280" height="54" class="a"/><text x="480" y="113" class="m" text-anchor="middle">허용 필드 선택</text><line x1="620" y1="107" x2="675" y2="107" class="strong" marker-end="url(#arr)"/><rect x="675" y="80" width="250" height="54" class="r"/><text x="800" y="113" class="m" text-anchor="middle">구조화 로그</text><text x="480" y="172" class="s" text-anchor="middle">토큰·비밀번호·세션 원문 제외</text><path d="M800 134 V210 H160 V240" class="l" marker-end="url(#arr)"/><path d="M800 210 H480 V240" class="l" marker-end="url(#arr)"/><line x1="800" y1="210" x2="800" y2="240" class="l" marker-end="url(#arr)"/><rect x="35" y="240" width="250" height="52" class="r"/><text x="160" y="272" class="m" text-anchor="middle">중앙 검색</text><rect x="355" y="240" width="250" height="52" class="r"/><text x="480" y="272" class="m" text-anchor="middle">알림</text><rect x="675" y="240" width="250" height="52" class="r"/><text x="800" y="272" class="m" text-anchor="middle">보관소</text><text x="480" y="350" class="s" text-anchor="middle">원문을 기록하면 복제·보존 경로 전체에 전파될 수 있음</text><text x="480" y="380" class="s" text-anchor="middle">redaction 테스트 · 접근 제한 · 보존/삭제 정책</text></svg>
