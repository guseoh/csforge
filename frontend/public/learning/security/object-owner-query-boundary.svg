<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 423" role="img" aria-labelledby="object-owner-query-boundary-title object-owner-query-boundary-desc"><title id="object-owner-query-boundary-title">객체 수준 인가 · 소유권 조회 조건</title><desc id="object-owner-query-boundary-desc">같은 요청 회원42 주문1002 owner77, id만 조회 시 노출 위험, owner 조건 포함하면 결과 없음.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="423"/><text x="480" y="32" class="h" text-anchor="middle">요청 주체 42 · 객체 1002의 소유자는 77</text><text x="230" y="75" class="h" text-anchor="middle">ID만으로 조회</text><rect x="35" y="105" width="400" height="52" class="r"/><text x="235" y="137" class="m" text-anchor="middle">GET /orders/1002</text><line x1="235" y1="157" x2="235" y2="195" class="l" marker-end="url(#arr)"/><rect x="35" y="195" width="400" height="52" class="a"/><text x="235" y="227" class="m" text-anchor="middle">id=1002</text><line x1="235" y1="247" x2="235" y2="290" class="l" marker-end="url(#arr)"/><rect x="35" y="290" width="400" height="52" class="a"/><text x="235" y="322" class="m" text-anchor="middle">owner=77 → 노출 위험</text><text x="730" y="75" class="h" text-anchor="middle">소유권 포함 조회</text><rect x="535" y="105" width="400" height="52" class="r"/><text x="735" y="137" class="m" text-anchor="middle">GET /orders/1002</text><line x1="735" y1="157" x2="735" y2="195" class="l" marker-end="url(#arr)"/><rect x="535" y="195" width="400" height="52" class="a"/><text x="735" y="227" class="m" text-anchor="middle">id=1002 AND owner=42</text><line x1="735" y1="247" x2="735" y2="290" class="l" marker-end="url(#arr)"/><rect x="535" y="290" width="400" height="52" class="a"/><text x="735" y="322" class="m" text-anchor="middle">조회 결과 없음 → 거부</text><line x1="480" y1="55" x2="480" y2="365" class="d"/><text x="480" y="399" class="s" text-anchor="middle">UUID로 바꾸는 것만으로 객체별 권한 검사가 대체되지 않음</text></svg>
