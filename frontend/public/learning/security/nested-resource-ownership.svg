<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="nested-resource-ownership-title nested-resource-ownership-desc"><title id="nested-resource-ownership-title">중첩 리소스의 소유권과 소속 관계</title><desc id="nested-resource-ownership-desc">principal42의 주문900에 item17이 속하는지, 작업 정책을 함께 검사한다. 다른 주문 item18을 조합하면 거부.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="32" class="h" text-anchor="middle">중첩 리소스 요청 · 두 관계를 함께 검사</text><rect x="35" y="70" width="260" height="55" class="a"/><text x="165" y="103.5" class="m" text-anchor="middle">principal: 42</text><line x1="295" y1="97" x2="350" y2="97" class="strong" marker-end="url(#arr)"/><rect x="350" y="70" width="250" height="55" class="r"/><text x="475" y="103.5" class="m" text-anchor="middle">Order 900</text><line x1="600" y1="97" x2="655" y2="97" class="strong" marker-end="url(#arr)"/><rect x="655" y="70" width="270" height="55" class="r"/><text x="790" y="103.5" class="m" text-anchor="middle">Item 17</text><text x="350" y="165" class="s" text-anchor="start">owner=42 ?</text><text x="655" y="165" class="s" text-anchor="start">order_id=900 ?</text><text x="480" y="218" class="h" text-anchor="middle">두 관계 모두 충족 + 작업별 정책 확인</text><rect x="35" y="263" width="430" height="52" class="a"/><text x="250" y="295" class="m" text-anchor="middle">Item 17 ∈ Order 900</text><rect x="495" y="263" width="430" height="52" class="r"/><text x="710" y="295" class="m" text-anchor="middle">Item 18 ∈ 다른 Order</text><text x="250" y="350" class="s" text-anchor="middle">정책에 따라 허용</text><text x="710" y="350" class="s" text-anchor="middle">조합된 요청 거부</text><text x="480" y="405" class="s" text-anchor="middle">두 ID가 각각 존재한다는 사실만으로 관계가 보장되지 않음</text></svg>
