<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="site-origin-cookie-scope-title site-origin-cookie-scope-desc"><title id="site-origin-cookie-scope-title">쿠키 SameSite와 Origin 비교</title><desc id="site-origin-cookie-scope-desc">같은 등록 가능 도메인 및 scheme이면 다른 host 또는 port도 같은 site일 수 있으나 origin은 다르다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="32" class="h" text-anchor="middle">site와 origin은 서로 다른 비교 기준</text><text x="480" y="65" class="m" text-anchor="middle">기준: https://app.example.com:443</text><text x="35" y="119" class="m" text-anchor="start">요청 대상</text><text x="620" y="119" class="h" text-anchor="middle">site</text><text x="835" y="119" class="h" text-anchor="middle">origin</text><line x1="35" y1="132" x2="925" y2="132" class="l"/><text x="35" y="165" class="m" text-anchor="start">https://api.example.com:443</text><text x="620" y="165" class="m" text-anchor="middle">같음</text><text x="835" y="165" class="m" text-anchor="middle">다름</text><line x1="35" y1="183" x2="925" y2="183" class="l"/><text x="35" y="227" class="m" text-anchor="start">https://app.example.com:8443</text><text x="620" y="227" class="m" text-anchor="middle">같음</text><text x="835" y="227" class="m" text-anchor="middle">다름</text><line x1="35" y1="245" x2="925" y2="245" class="l"/><text x="35" y="289" class="m" text-anchor="start">http://app.example.com:80</text><text x="620" y="289" class="m" text-anchor="middle">다름</text><text x="835" y="289" class="m" text-anchor="middle">다름</text><line x1="35" y1="307" x2="925" y2="307" class="l"/><text x="480" y="365" class="h" text-anchor="middle">SameSite 통과 ≠ Domain/Path/Secure 조건 통과</text><text x="480" y="395" class="s" text-anchor="middle">응답 읽기는 SOP/CORS · 리소스 권한은 서버가 별도 확인</text></svg>
