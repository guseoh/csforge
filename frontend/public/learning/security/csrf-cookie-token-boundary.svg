<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" role="img" aria-labelledby="csrf-cookie-token-boundary-title csrf-cookie-token-boundary-desc"><title id="csrf-cookie-token-boundary-title">CSRF · 쿠키 전송과 토큰 검증</title><desc id="csrf-cookie-token-boundary-desc">외부 페이지가 피해자 브라우저에서 대상 서버 요청을 유도하고 쿠키 전송 가능. 토큰 검증 없으면 상태 변경 가능, 불일치 시 거부.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="428"/><text x="480" y="32" class="h" text-anchor="middle">자동 첨부되는 쿠키와 서버의 CSRF 검증</text><rect x="40" y="80" width="235" height="52" class="r"/><text x="157.5" y="112" class="m" text-anchor="middle">외부 페이지</text><line x1="275" y1="106" x2="335" y2="106" class="l" marker-end="url(#arr)"/><rect x="335" y="80" width="255" height="52" class="r"/><text x="462.5" y="112" class="m" text-anchor="middle">피해자 브라우저</text><line x1="590" y1="106" x2="665" y2="106" class="strong" marker-end="url(#arr)"/><rect x="665" y="80" width="255" height="52" class="r"/><text x="792.5" y="112" class="m" text-anchor="middle">대상 서버</text><text x="627" y="83" class="s" text-anchor="middle">요청</text><text x="480" y="166" class="s" text-anchor="middle">브라우저가 세션 쿠키를 보낼 수 있는 조건을 가정</text><text x="35" y="241" class="m" text-anchor="start">검증 없음</text><rect x="250" y="210" width="665" height="52" class="a"/><text x="582.5" y="242" class="m" text-anchor="middle">세션 유효 → 상태 변경 가능</text><text x="35" y="331" class="m" text-anchor="start">검증 적용</text><rect x="250" y="300" width="665" height="52" class="a"/><text x="582.5" y="332" class="m" text-anchor="middle">세션 유효 + CSRF 토큰 불일치 → 거부</text><text x="480" y="404" class="s" text-anchor="middle">SameSite 등 쿠키 전송 제한과 서버 토큰 검증은 별도 방어</text></svg>
