<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="authorization-code-trust-boundaries-title authorization-code-trust-boundaries-desc"><title id="authorization-code-trust-boundaries-title">OAuth 인가 코드와 OIDC의 전체 경계</title><desc id="authorization-code-trust-boundaries-desc">브라우저 authorize 로그인 동의 code callback, Client AS 토큰 교환, RS API 접근.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="650"/><text x="480" y="32" class="h" text-anchor="middle">인가 코드 · 브라우저 경유와 토큰 교환의 차이</text><text x="105" y="66" class="h" text-anchor="middle">브라우저</text><line x1="105" y1="82" x2="105" y2="555" class="d"/><text x="360" y="66" class="h" text-anchor="middle">Client</text><line x1="360" y1="82" x2="360" y2="555" class="d"/><text x="625" y="66" class="h" text-anchor="middle">AS</text><line x1="625" y1="82" x2="625" y2="555" class="d"/><text x="865" y="66" class="h" text-anchor="middle">RS</text><line x1="865" y1="82" x2="865" y2="555" class="d"/><line x1="105" y1="112" x2="360" y2="112" class="l" marker-end="url(#arr)"/><text x="232.5" y="103" class="s" text-anchor="middle">연결 시작</text><line x1="360" y1="161" x2="105" y2="161" class="d" marker-end="url(#arr)"/><text x="232.5" y="152" class="s" text-anchor="middle">authorize로 이동</text><line x1="105" y1="213" x2="625" y2="213" class="strong" marker-end="url(#arr)"/><text x="365" y="204" class="s" text-anchor="middle">인가 요청 · challenge · 로그인/동의</text><line x1="625" y1="266" x2="105" y2="266" class="d" marker-end="url(#arr)"/><text x="365" y="257" class="s" text-anchor="middle">redirect_uri?code=…</text><line x1="105" y1="315" x2="360" y2="315" class="l" marker-end="url(#arr)"/><text x="232.5" y="306" class="s" text-anchor="middle">callback · 상관 검증</text><line x1="360" y1="368" x2="625" y2="368" class="strong" marker-end="url(#arr)"/><text x="492.5" y="359" class="s" text-anchor="middle">code + verifier · token 요청</text><line x1="625" y1="421" x2="360" y2="421" class="d" marker-end="url(#arr)"/><text x="492.5" y="412" class="s" text-anchor="middle">access token (+ ID token)</text><line x1="360" y1="480" x2="865" y2="480" class="strong" marker-end="url(#arr)"/><text x="612.5" y="471" class="s" text-anchor="middle">access token으로 API 호출</text><line x1="865" y1="530" x2="360" y2="530" class="d" marker-end="url(#arr)"/><text x="612.5" y="521" class="s" text-anchor="middle">리소스 응답</text><text x="480" y="595" class="s" text-anchor="middle">AS: code·client·redirect URI·PKCE binding 검사</text><text x="480" y="625" class="s" text-anchor="middle">ID token: Client의 인증 결과 검증용 · access token: RS 접근용</text></svg>
