<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="context-thread-reuse-title context-thread-reuse-desc"><title id="context-thread-reuse-title">SecurityContext와 스레드 재사용</title><desc id="context-thread-reuse-desc">A 처리 뒤 clear하고 B의 문맥 설정. 누락 시 잔존 위험.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="355"/><text x="480" y="32" class="h" text-anchor="middle">Thread-7 · 요청별 인증 문맥 수명</text><text x="35" y="100" class="m" text-anchor="start">정상</text><rect x="200" y="70" width="240" height="55" class="a"/><text x="320" y="103.5" class="m" text-anchor="middle">A: 회원 42</text><rect x="440" y="70" width="150" height="55" class="r"/><text x="515" y="103.5" class="m" text-anchor="middle">clear</text><rect x="590" y="70" width="335" height="55" class="a"/><text x="757.5" y="103.5" class="m" text-anchor="middle">B: 회원 77</text><text x="320" y="150" class="s" text-anchor="middle">설정 / 처리</text><text x="515" y="150" class="s" text-anchor="middle">finally</text><text x="758" y="150" class="s" text-anchor="middle">별도 문맥 설정</text><text x="35" y="245" class="m" text-anchor="start">정리 누락</text><rect x="200" y="215" width="240" height="55" class="r"/><text x="320" y="248.5" class="m" text-anchor="middle">A: 회원 42</text><rect x="440" y="215" width="150" height="55" class="a"/><text x="515" y="248.5" class="m" text-anchor="middle">누락</text><rect x="590" y="215" width="335" height="55" class="a"/><text x="757.5" y="248.5" class="m" text-anchor="middle">이전 문맥 잔존 위험</text><text x="480" y="332" class="s" text-anchor="middle">기본 ThreadLocal 모델 · 세션 저장과 스레드 정리는 별개</text></svg>
