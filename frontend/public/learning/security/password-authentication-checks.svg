<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="password-authentication-checks-title password-authentication-checks-desc"><title id="password-authentication-checks-title">비밀번호 인증의 검증 경계</title><desc id="password-authentication-checks-desc">인증 전 토큰, 사용자 조회 계정 검사 비밀번호 비교 추가 필수 검사 이후 인증 완료 결과, 성공 처리자 context 설정.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="540"/><text x="480" y="32" class="h" text-anchor="middle">비밀번호 인증 · 일치 여부와 최종 성공은 별개</text><rect x="45" y="75" width="235" height="55" class="r"/><text x="162.5" y="108.5" class="m" text-anchor="middle">인증 전 토큰</text><line x1="280" y1="102" x2="345" y2="102" class="strong" marker-end="url(#arr)"/><rect x="345" y="60" width="570" height="248" class="r"/><text x="630" y="91" class="h" text-anchor="middle">DaoAuthenticationProvider</text><rect x="370" y="110" width="240" height="44" class="r"/><text x="490" y="138" class="m" text-anchor="middle">사용자 조회</text><rect x="650" y="110" width="240" height="44" class="r"/><text x="770" y="138" class="m" text-anchor="middle">계정 상태 검사</text><line x1="610" y1="132" x2="650" y2="132" class="l" marker-end="url(#arr)"/><rect x="370" y="185" width="240" height="44" class="r"/><text x="490" y="213" class="m" text-anchor="middle">matches(raw, hash)</text><rect x="650" y="185" width="240" height="44" class="r"/><text x="770" y="213" class="m" text-anchor="middle">추가 필수 검사</text><path d="M770 154 V169 H490 V185" class="l" marker-end="url(#arr)"/><line x1="610" y1="207" x2="650" y2="207" class="l" marker-end="url(#arr)"/><text x="630" y="273" class="s" text-anchor="middle">어느 필수 검사든 실패 → 인증 실패</text><path d="M770 229 V321 H625 V345" class="strong" marker-end="url(#arr)"/><rect x="430" y="345" width="390" height="50" class="a"/><text x="625" y="376" class="m" text-anchor="middle">인증 완료 Authentication</text><line x1="625" y1="395" x2="625" y2="433" class="l" marker-end="url(#arr)"/><rect x="430" y="433" width="390" height="48" class="r"/><text x="625" y="463" class="m" text-anchor="middle">성공 처리자가 Context 설정</text><text x="480" y="518" class="s" text-anchor="middle">필터 종류·설정에 따라 처리 순서와 저장 방식은 달라질 수 있음</text></svg>
