<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="title desc">
  <title id="title">비밀번호 Work Factor 균형과 오프라인·온라인 방어 역할 분리</title>
  <desc id="desc">Work Factor가 너무 낮을 때의 오프라인 크래킹 위험과 너무 높을 때의 로그인 CPU/메모리 고갈 위험을 비교하고 Rate Limiting과 점진적 재해시 전략을 보여주는 도식</desc>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#f1f5f9; --bd:#cbd5e1; --tx:#0f172a; --sub:#475569; --blue-bg:#eff6ff; --blue-bd:#3b82f6; --blue-tx:#1d4ed8; --green-bg:#ecfdf5; --green-bd:#10b981; --green-tx:#047857; --amber-bg:#fffbeb; --amber-bd:#f59e0b; --amber-tx:#b45309; --red-bg:#fef2f2; --red-bd:#ef4444; --red-tx:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --muted:#0b1220; --bd:#334155; --tx:#f1f5f9; --sub:#94a3b8; --blue-bg:#172554; --blue-bd:#60a5fa; --blue-tx:#93c5fd; --green-bg:#064e3b; --green-bd:#34d399; --green-tx:#6ee7b7; --amber-bg:#451a03; --amber-bd:#fbbf24; --amber-tx:#fcd34d; --red-bg:#450a0a; --red-bd:#f87171; --red-tx:#fca5a5; } }
    text { font-family: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--tx); }
    .h2 { font-size:13.5px; font-weight:700; }
    .b { font-size:12px; fill:var(--tx); }
    .s { font-size:11px; fill:var(--sub); }
    .k { font-size:11.5px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="840" height="410" rx="14" fill="var(--bg)"/>
  <text x="28" y="34" class="h1">비밀번호 검증 비용(Work Factor) 균형 &amp; 오프라인/온라인 방어 분리</text>
  <text x="28" y="54" class="s">운영 하드웨어 실측으로 적정 비용을 정하고, 시간 경과에 따라 로그인 시 점진적으로 상향한다.</text>

  <!-- 3 Spectrum Cards -->
  <rect x="28" y="74" width="246" height="176" rx="10" fill="var(--red-bg)" stroke="var(--red-bd)" stroke-width="1.4"/>
  <text x="44" y="100" class="h2" fill="var(--red-tx)">너무 낮음 (예: &lt; 5 ms)</text>
  <text x="44" y="128" class="b">• 정상 로그인은 매우 빠름</text>
  <text x="44" y="150" class="b">• 그러나 DB 유출 시 GPU가</text>
  <text x="44" y="168" class="b">  초당 대량 후보 추측 가능</text>
  <text x="44" y="200" class="k" fill="var(--red-tx)">✗ 오프라인 추측 방어력 취약</text>
  <text x="44" y="220" class="s">약한 비밀번호가 단시간에 노출</text>

  <rect x="297" y="74" width="246" height="176" rx="10" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.8"/>
  <text x="313" y="100" class="h2" fill="var(--green-tx)">✓ 적정 균형 (운영 실측)</text>
  <text x="313" y="128" class="b">• Argon2id (메모리+반복 조절)</text>
  <text x="313" y="150" class="b">• 피크 로그인 TPS 감당 범위</text>
  <text x="313" y="172" class="b">• 오프라인 추측 비용 극대화</text>
  <text x="313" y="200" class="k" fill="var(--green-tx)">→ 하드웨어 발전에 맞춰 주기 상향</text>
  <text x="313" y="220" class="s">로그인 성공 시 투명하게 재해시</text>

  <rect x="566" y="74" width="246" height="176" rx="10" fill="var(--amber-bg)" stroke="var(--amber-bd)" stroke-width="1.4"/>
  <text x="582" y="100" class="h2" fill="var(--amber-tx)">지나치게 높음 (예: 수 초)</text>
  <text x="582" y="128" class="b">• 정상 사용자 로그인 지연 악화</text>
  <text x="582" y="150" class="b">• CPU·메모리 점유 폭증으로</text>
  <text x="582" y="168" class="b">  소수 동시 요청에도 서버 마비</text>
  <text x="582" y="200" class="k" fill="var(--amber-tx)">✗ 인증 엔드포인트 자원 고갈(DoS)</text>
  <text x="582" y="220" class="s">로그인 폭주 시 정상 서비스 영향</text>

  <!-- Bottom 2 Boxes: Offline vs Online -->
  <rect x="28" y="270" width="382" height="116" rx="10" fill="var(--card)" stroke="var(--blue-bd)" stroke-width="1.4"/>
  <text x="46" y="296" class="h2" fill="var(--blue-tx)">오프라인 추측 방어 = Work Factor + 솔트</text>
  <text x="46" y="320" class="b">• DB가 유출된 뒤 공격자 장비에서 시도하는 무차별 대입</text>
  <text x="46" y="342" class="b">• Argon2id의 Memory-Hard + 반복 횟수로 GPU 효율 억제</text>
  <text x="46" y="366" class="s">※ 서버 Rate Limiter는 오프라인 공격을 막을 수 없다</text>

  <rect x="430" y="270" width="382" height="116" rx="10" fill="var(--card)" stroke="var(--green-bd)" stroke-width="1.4"/>
  <text x="448" y="296" class="h2" fill="var(--green-tx)">온라인 공격 방어 = Rate Limit + MFA</text>
  <text x="448" y="320" class="b">• 로그인 API에 대량 요청을 보내는 크리덴셜 스터핑/DoS</text>
  <text x="448" y="342" class="b">• IP + 계정 복합 Rate Limiting, 점진 지연, MFA로 차단</text>
  <text x="448" y="366" class="s">※ Work Factor만으로 온라인 로그인 폭주 DoS를 못 막는다</text>
</svg>
