<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="jwt-revocation-window-title jwt-revocation-window-desc"><title id="jwt-revocation-window-title">JWT 만료와 권한 변경 사이의 시간</title><desc id="jwt-revocation-window-desc">10:00 발급 10:05 정지 10:15 만료. 별도 폐기 확인 없으면 만료 전 수락 가능.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="375"/><text x="480" y="32" class="h" text-anchor="middle">JWT · 권한 변경과 만료 시점의 차이</text><line x1="90" y1="155" x2="900" y2="155" class="l" marker-end="url(#arr)"/><rect x="90" y="75" width="810" height="52" class="a"/><text x="495" y="108" class="m" text-anchor="middle">발급 토큰 · exp=10:15</text><line x1="90" y1="143" x2="90" y2="167" class="l"/><text x="90" y="185" class="m" text-anchor="middle">10:00</text><line x1="360" y1="143" x2="360" y2="167" class="l"/><text x="360" y="185" class="m" text-anchor="middle">10:05</text><line x1="900" y1="143" x2="900" y2="167" class="l"/><text x="900" y="185" class="m" text-anchor="middle">10:15</text><text x="360" y="222" class="h" text-anchor="middle">계정 정지</text><rect x="360" y="250" width="540" height="52" class="r"/><text x="630" y="283" class="s" text-anchor="middle">별도 검사 없으면 수락 가능</text><text x="480" y="350" class="s" text-anchor="middle">만료·발급자·대상 검증과 실시간 권한 확인은 별도</text></svg>
