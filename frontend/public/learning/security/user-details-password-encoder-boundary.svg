<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="title desc">
  <title id="title">DaoAuthenticationProvider와 UserDetailsService·PasswordEncoder 협력 경계</title>
  <desc id="desc">로그인 요청 시 DaoAuthenticationProvider가 UserDetailsService로 저장된 인증 정보를 조회하고 DelegatingPasswordEncoder로 단방향 해시를 검증하는 협력 도식</desc>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#f1f5f9; --bd:#cbd5e1; --tx:#0f172a; --sub:#475569; --blue-bg:#eff6ff; --blue-bd:#3b82f6; --blue-tx:#1d4ed8; --purple-bg:#f5f3ff; --purple-bd:#8b5cf6; --purple-tx:#6d28d9; --green-bg:#ecfdf5; --green-bd:#10b981; --green-tx:#047857; --amber-bg:#fffbeb; --amber-bd:#f59e0b; --amber-tx:#b45309; --arr:#64748b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --muted:#0b1220; --bd:#334155; --tx:#f1f5f9; --sub:#94a3b8; --blue-bg:#172554; --blue-bd:#60a5fa; --blue-tx:#93c5fd; --purple-bg:#2e1065; --purple-bd:#a78bfa; --purple-tx:#c4b5fd; --green-bg:#064e3b; --green-bd:#34d399; --green-tx:#6ee7b7; --amber-bg:#451a03; --amber-bd:#fbbf24; --amber-tx:#fcd34d; --arr:#94a3b8; } }
    text { font-family: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--tx); }
    .h2 { font-size:13.5px; font-weight:700; }
    .b { font-size:12px; fill:var(--tx); }
    .s { font-size:11px; fill:var(--sub); }
    .k { font-size:11.5px; font-weight:700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--arr)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="410" rx="14" fill="var(--bg)"/>
  <text x="28" y="34" class="h1">UserDetailsService(조회) vs PasswordEncoder(검증) 협력 경계</text>
  <text x="28" y="54" class="s">DaoAuthenticationProvider가 사용자 조회와 단방향 해시 비교를 분리해 저장소와 알고리즘을 독립 교체할 수 있게 한다.</text>

  <!-- Step 1 -->
  <rect x="28" y="80" width="184" height="156" rx="10" fill="var(--card)" stroke="var(--blue-bd)" stroke-width="1.5"/>
  <rect x="28" y="80" width="184" height="32" rx="10" fill="var(--blue-bg)"/>
  <text x="42" y="101" class="h2" fill="var(--blue-tx)">1. 미인증 토큰</text>
  <text x="42" y="132" class="b">• username (email)</text>
  <text x="42" y="154" class="b">• rawPassword</text>
  <text x="42" y="178" class="s">authenticated = false</text>
  <text x="42" y="206" class="k" fill="var(--blue-tx)">→ ProviderManager 전달</text>

  <!-- Step 2 -->
  <rect x="248" y="80" width="248" height="156" rx="10" fill="var(--card)" stroke="var(--purple-bd)" stroke-width="1.6"/>
  <rect x="248" y="80" width="248" height="32" rx="10" fill="var(--purple-bg)"/>
  <text x="262" y="101" class="h2" fill="var(--purple-tx)">2. DaoAuthenticationProvider</text>
  <text x="262" y="132" class="b">① UserDetailsService 조회 호출</text>
  <text x="262" y="154" class="b">② 계정 잠금·활성 상태 확인</text>
  <text x="262" y="176" class="b">③ PasswordEncoder.matches() 호출</text>
  <text x="262" y="198" class="b">④ 성공 시 credentials 소거</text>
  <text x="262" y="220" class="s">authenticated = true 토큰 반환</text>

  <!-- Step 3: Two Collaborators stacked on Right -->
  <rect x="532" y="80" width="280" height="72" rx="10" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.4"/>
  <text x="546" y="103" class="k" fill="var(--green-tx)">UserDetailsService (조회 전용)</text>
  <text x="546" y="123" class="b">loadUserByUsername() → 저장 해시·권한 반환</text>
  <text x="546" y="140" class="s">도메인 Member 대신 인증 전용 Principal 권장</text>

  <rect x="532" y="164" width="280" height="72" rx="10" fill="var(--amber-bg)" stroke="var(--amber-bd)" stroke-width="1.4"/>
  <text x="546" y="187" class="k" fill="var(--amber-tx)">DelegatingPasswordEncoder (검증)</text>
  <text x="546" y="207" class="b">matches(raw, "{bcrypt}..." / "{argon2}...")</text>
  <text x="546" y="224" class="s">접두사 기반 검증 + 로그인 시 무중단 업그레이드</text>

  <!-- Arrows -->
  <line x1="212" y1="158" x2="244" y2="158" stroke="var(--arr)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="496" y1="122" x2="528" y2="122" stroke="var(--arr)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="496" y1="196" x2="528" y2="196" stroke="var(--arr)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom Box -->
  <rect x="28" y="262" width="784" height="122" rx="10" fill="var(--card)" stroke="var(--bd)" stroke-width="1.4"/>
  <text x="46" y="288" class="h2" fill="var(--tx)">실무 설계 체크포인트: 왜 도메인 Member 엔티티를 UserDetails와 분리하는가?</text>
  <text x="46" y="314" class="b">• JPA Entity에 UserDetails를 직접 구현하면 지연 로딩(Lazy), 직렬화, 비밀번호 필드 노출, 프레임워크 의존성이 도메인에 침투한다.</text>
  <text x="46" y="336" class="b">• 인증에 필요한 최소 정보(memberId, email, encodedPassword, authorities)만 담은 불변 LoginPrincipal 레코드로 경계를 나눈다.</text>
  <text x="46" y="362" class="s">• 해시 알고리즘 전환 시 DelegatingPasswordEncoder + UserDetailsPasswordService로 기존 사용자 로그인 성공 시 점진 재해시한다.</text>
</svg>
