<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="session-fixation-rotation-title session-fixation-rotation-desc"><title id="session-fixation-rotation-title">세션 고정 방어 · 로그인 시 ID 교체</title><desc id="session-fixation-rotation-desc">공격자가 X를 안다는 가정에서 로그인 이후 X 유지 시 재사용 위험, Y로 교체하면 X로 새 인증 세션 접근 불가.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="415"/><text x="480" y="32" class="h" text-anchor="middle">로그인 전 ID X · 로그인 뒤 식별자 비교</text><text x="230" y="75" class="h" text-anchor="middle">ID 유지 (위험)</text><rect x="50" y="100" width="360" height="50" class="r"/><text x="230" y="131" class="m" text-anchor="middle">로그인 전 X</text><line x1="230" y1="150" x2="230" y2="190" class="l" marker-end="url(#arr)"/><rect x="50" y="190" width="360" height="50" class="a"/><text x="230" y="221" class="m" text-anchor="middle">로그인 성공 → X</text><line x1="230" y1="240" x2="230" y2="280" class="l" marker-end="url(#arr)"/><rect x="50" y="280" width="360" height="50" class="a"/><text x="230" y="311" class="m" text-anchor="middle">이전 X: 인증 세션 재사용</text><text x="730" y="75" class="h" text-anchor="middle">ID 교체</text><rect x="550" y="100" width="360" height="50" class="r"/><text x="730" y="131" class="m" text-anchor="middle">로그인 전 X</text><line x1="730" y1="150" x2="730" y2="190" class="l" marker-end="url(#arr)"/><rect x="550" y="190" width="360" height="50" class="a"/><text x="730" y="221" class="m" text-anchor="middle">로그인 성공 → Y</text><line x1="730" y1="240" x2="730" y2="280" class="l" marker-end="url(#arr)"/><rect x="550" y="280" width="360" height="50" class="r"/><text x="730" y="311" class="m" text-anchor="middle">이전 X: 인증 세션 아님</text><line x1="480" y1="55" x2="480" y2="352" class="d"/><text x="480" y="391" class="s" text-anchor="middle">로그인 상태 변경 시 기존 ID를 무효화하고 새 ID 사용</text></svg>
