<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="authentication-before-after-title authentication-before-after-desc"><title id="authentication-before-after-title">Authentication의 검증 전후 상태</title><desc id="authentication-before-after-desc">인증 전후 principal credentials authorities authenticated 비교.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="32" class="h" text-anchor="middle">UsernamePasswordAuthenticationToken · 전후 상태</text><text x="350" y="82" class="h" text-anchor="middle">인증 전</text><text x="740" y="82" class="h" text-anchor="middle">검증 성공 후</text><text x="35" y="135" class="m" text-anchor="start">principal</text><rect x="235" y="105" width="260" height="50" class="r"/><text x="365" y="136" class="m" text-anchor="middle">제출한 사용자 이름</text><rect x="550" y="105" width="375" height="50" class="r"/><text x="737.5" y="136" class="m" text-anchor="middle">검증된 UserDetails</text><text x="35" y="200" class="m" text-anchor="start">credentials</text><rect x="235" y="170" width="260" height="50" class="r"/><text x="365" y="201" class="m" text-anchor="middle">제출된 비밀번호</text><rect x="550" y="170" width="375" height="50" class="r"/><text x="737.5" y="201" class="m" text-anchor="middle">제거될 수 있음</text><text x="35" y="265" class="m" text-anchor="start">authorities</text><rect x="235" y="235" width="260" height="50" class="r"/><text x="365" y="266" class="m" text-anchor="middle">신뢰하지 않음</text><rect x="550" y="235" width="375" height="50" class="r"/><text x="737.5" y="266" class="m" text-anchor="middle">검증된 권한 목록</text><text x="35" y="330" class="m" text-anchor="start">authenticated</text><rect x="235" y="300" width="260" height="50" class="r"/><text x="365" y="331" class="m" text-anchor="middle">false</text><rect x="550" y="300" width="375" height="50" class="a"/><text x="737.5" y="331" class="m" text-anchor="middle">true</text><text x="480" y="395" class="s" text-anchor="middle">필수 검증 완료 후 인증 객체 반환 · 임의로 true 설정 금지</text></svg>
