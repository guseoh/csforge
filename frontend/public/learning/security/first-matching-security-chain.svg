<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="first-matching-security-chain-title first-matching-security-chain-desc"><title id="first-matching-security-chain-title">보안 체인의 첫 일치와 미일치</title><desc id="first-matching-security-chain-desc">일반 API 체인 A가 먼저 일치하면 admin B 미적용. outside는 두 체인 모두 미일치.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="415"/><text x="480" y="32" class="h" text-anchor="middle">FilterChainProxy · 첫 일치 체인 선택</text><text x="340" y="85" class="m" text-anchor="middle">/api/admin/report</text><text x="755" y="85" class="m" text-anchor="middle">/outside</text><text x="35" y="130" class="m" text-anchor="start">A: /api/**</text><rect x="230" y="145" width="280" height="48" class="a"/><text x="370" y="175" class="m" text-anchor="middle">일치 → A 선택</text><rect x="615" y="145" width="280" height="48" class="r"/><text x="755" y="175" class="m" text-anchor="middle">불일치</text><text x="35" y="237" class="m" text-anchor="start">B: /api/admin/**</text><rect x="230" y="250" width="280" height="48" class="r"/><text x="370" y="280" class="m" text-anchor="middle">실행하지 않음</text><rect x="615" y="250" width="280" height="48" class="r"/><text x="755" y="280" class="m" text-anchor="middle">불일치</text><text x="370" y="338" class="s" text-anchor="middle">B 규칙 미적용</text><text x="755" y="338" class="s" text-anchor="middle">catch-all 없으면 보호 밖</text><text x="480" y="389" class="s" text-anchor="middle">securityMatcher: 체인 선택 · anyRequest: 선택된 체인 내부</text></svg>
