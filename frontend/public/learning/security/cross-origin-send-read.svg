<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="cross-origin-send-read-title cross-origin-send-read-desc"><title id="cross-origin-send-read-title">동일 출처 정책 · 전송과 읽기 분리</title><desc id="cross-origin-send-read-desc">교차 출처 요청 전송 가능 상황에서 응답을 브라우저가 받고도 스크립트에 노출하지 않을 수 있다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="355"/><text x="480" y="32" class="h" text-anchor="middle">교차 출처 · 요청 전송과 응답 노출은 별개</text><rect x="35" y="85" width="250" height="60" class="r"/><text x="160" y="121" class="m" text-anchor="middle">브라우저 스크립트</text><rect x="360" y="85" width="245" height="60" class="a"/><text x="482.5" y="121" class="m" text-anchor="middle">브라우저 정책</text><rect x="680" y="85" width="245" height="60" class="r"/><text x="802.5" y="121" class="m" text-anchor="middle">API 서버</text><line x1="285" y1="115" x2="360" y2="115" class="l" marker-end="url(#arr)"/><line x1="605" y1="115" x2="680" y2="115" class="l" marker-end="url(#arr)"/><text x="480" y="180" class="s" text-anchor="middle">요청 유형에 따라 전송 가능 · 서버는 인증/인가 검사</text><line x1="680" y1="240" x2="605" y2="240" class="d" marker-end="url(#arr)"/><line x1="605" y1="240" x2="360" y2="240" class="d"/><text x="482" y="222" class="s" text-anchor="middle">응답 수신</text><path d="M360 240 H285" class="strong"/><text x="285" y="247" class="h" text-anchor="middle">×</text><text x="480" y="295" class="h" text-anchor="middle">CORS 허용 조건 불충족 → 스크립트에 응답 미노출</text><text x="480" y="330" class="s" text-anchor="middle">응답 읽기가 막혀도 서버 상태 변경은 이미 발생할 수 있음</text></svg>
