<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="cors-preflight-two-gates-title cors-preflight-two-gates-desc"><title id="cors-preflight-two-gates-title">CORS · 사전 요청과 응답 노출</title><desc id="cors-preflight-two-gates-desc">OPTIONS에서 Origin POST content-type 허용 검사, 허용 뒤 실제 POST 응답에서 다시 CORS 검사.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="500"/><text x="480" y="30" class="h" text-anchor="middle">교차 출처 JSON POST · preflight와 실제 응답 검사</text><text x="155" y="64" class="h" text-anchor="middle">브라우저</text><line x1="155" y1="80" x2="155" y2="445" class="d"/><text x="805" y="64" class="h" text-anchor="middle">API</text><line x1="805" y1="80" x2="805" y2="445" class="d"/><line x1="155" y1="119" x2="805" y2="119" class="strong" marker-end="url(#arr)"/><text x="480" y="110" class="s" text-anchor="middle">OPTIONS · Origin / Request-Method: POST</text><text x="480" y="141" class="s" text-anchor="middle">Request-Headers: content-type · 자격 증명 없음</text><line x1="805" y1="195" x2="155" y2="195" class="d" marker-end="url(#arr)"/><text x="480" y="186" class="s" text-anchor="middle">Allow-Origin / Allow-Methods / Allow-Headers</text><text x="480" y="221" class="s" text-anchor="middle">실패하면 실제 POST 미전송</text><line x1="155" y1="273" x2="805" y2="273" class="strong" marker-end="url(#arr)"/><text x="480" y="264" class="s" text-anchor="middle">허용 시 POST · Content-Type: application/json</text><line x1="805" y1="339" x2="155" y2="339" class="d" marker-end="url(#arr)"/><text x="480" y="330" class="s" text-anchor="middle">실제 응답 + CORS 응답 헤더</text><text x="480" y="382" class="m" text-anchor="middle">응답 헤더 조건 충족 → 스크립트에 노출</text><text x="480" y="418" class="s" text-anchor="middle">실제 응답 검사 실패 → POST는 이미 실행되었을 수 있음</text><text x="480" y="476" class="s" text-anchor="middle">credentials 포함 요청은 명시적 origin·Allow-Credentials 등 별도 조건</text></svg>
