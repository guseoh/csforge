<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="servlet-filter-nested-boundary-title servlet-filter-nested-boundary-desc"><title id="servlet-filter-nested-boundary-title">서블릿 필터의 요청·응답 경계</title><desc id="servlet-filter-nested-boundary-desc">요청은 필터1 필터2 DispatcherServlet Controller 순서, 응답은 역방향.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="390"/><text x="480" y="32" class="h" text-anchor="middle">Servlet Filter · 요청과 응답의 중첩 호출</text><rect x="35" y="65" width="890" height="260" class="r"/><text x="60" y="93" class="s" text-anchor="start">Servlet container</text><rect x="55" y="125" width="165" height="52" class="a"/><text x="137.5" y="157" class="m" text-anchor="middle">Filter 1</text><line x1="220" y1="151" x2="260" y2="151" class="strong" marker-end="url(#arr)"/><rect x="260" y="125" width="165" height="52" class="a"/><text x="342.5" y="157" class="m" text-anchor="middle">Filter 2</text><line x1="425" y1="151" x2="465" y2="151" class="strong" marker-end="url(#arr)"/><rect x="465" y="125" width="210" height="52" class="r"/><text x="570" y="157" class="m" text-anchor="middle">DispatcherServlet</text><line x1="675" y1="151" x2="715" y2="151" class="strong" marker-end="url(#arr)"/><rect x="715" y="125" width="170" height="52" class="r"/><text x="800" y="157" class="m" text-anchor="middle">Controller</text><path d="M800 177 V250 H137 V177" class="d" marker-end="url(#arr)"/><text x="480" y="240" class="s" text-anchor="middle">chain.doFilter 반환 · 필터의 after 실행</text><text x="480" y="300" class="s" text-anchor="middle">중간 필터에서 호출 중단 → MVC에 도달하지 않음</text><text x="480" y="365" class="s" text-anchor="middle">HandlerInterceptor는 DispatcherServlet 내부의 MVC 경계</text></svg>
