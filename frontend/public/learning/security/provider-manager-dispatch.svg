<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="provider-manager-dispatch-title provider-manager-dispatch-desc"><title id="provider-manager-dispatch-title">인증 관리자와 제공자 선택</title><desc id="provider-manager-dispatch-desc">지원하는 제공자에 authenticate 위임. 지원 여부는 성공 보장이 아니고 null 실패 등 결과 가능.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="470"/><text x="480" y="32" class="h" text-anchor="middle">ProviderManager · 토큰 타입에 따른 위임</text><rect x="35" y="75" width="330" height="52" class="r"/><text x="200" y="107" class="m" text-anchor="middle">UsernamePasswordToken</text><line x1="365" y1="101" x2="425" y2="101" class="l" marker-end="url(#arr)"/><rect x="425" y="75" width="500" height="52" class="r"/><text x="675" y="107" class="m" text-anchor="middle">ProviderManager</text><rect x="35" y="174" width="420" height="52" class="a"/><text x="245" y="206" class="m" text-anchor="middle">DaoAuthenticationProvider</text><rect x="505" y="174" width="420" height="52" class="r"/><text x="715" y="206" class="m" text-anchor="middle">다른 타입 Provider</text><text x="245" y="255" class="m" text-anchor="middle">supports = true</text><text x="715" y="255" class="s" text-anchor="middle">supports = false → 건너뜀</text><line x1="245" y1="270" x2="245" y2="310" class="l" marker-end="url(#arr)"/><rect x="35" y="310" width="420" height="52" class="a"/><text x="245" y="342" class="m" text-anchor="middle">authenticate(token)</text><text x="245" y="395" class="s" text-anchor="middle">성공 결과 / 실패 / null</text><text x="480" y="447" class="s" text-anchor="middle">supports가 true여도 성공 보장은 없음 · 예외·parent 설정에 따라 다음 판단</text></svg>
