<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="trust-boundary-validation-title trust-boundary-validation-desc"><title id="trust-boundary-validation-title">신뢰 경계와 다층 검증</title><desc id="trust-boundary-validation-desc">브라우저 입력을 서버 HTTP DTO 검증, 도메인 정책, DB 제약으로 나누어 확인.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="395"/><text x="480" y="32" class="h" text-anchor="middle">신뢰 경계는 데이터의 통제권이 바뀌는 지점</text><rect x="35" y="100" width="200" height="52" class="r"/><text x="135" y="132" class="m" text-anchor="middle">브라우저</text><line x1="235" y1="126" x2="320" y2="126" class="strong" marker-end="url(#arr)"/><rect x="320" y="70" width="605" height="260" class="r"/><text x="620" y="100" class="h" text-anchor="middle">서버의 검증 책임</text><rect x="345" y="130" width="245" height="52" class="a"/><text x="467.5" y="162" class="m" text-anchor="middle">HTTP / DTO</text><rect x="650" y="130" width="245" height="52" class="a"/><text x="772.5" y="162" class="m" text-anchor="middle">도메인 / 정책</text><line x1="590" y1="156" x2="650" y2="156" class="l" marker-end="url(#arr)"/><text x="468" y="210" class="s" text-anchor="middle">형식·길이·허용값</text><text x="773" y="210" class="s" text-anchor="middle">소유권·불변식</text><rect x="650" y="250" width="245" height="52" class="a"/><text x="772.5" y="282" class="m" text-anchor="middle">DB 제약</text><line x1="773" y1="182" x2="773" y2="250" class="l" marker-end="url(#arr)"/><text x="468" y="276" class="s" text-anchor="middle">외부 입력 ≠ 신뢰</text><text x="480" y="372" class="s" text-anchor="middle">외부 서비스의 응답도 별도 신뢰 경계를 넘음</text></svg>
