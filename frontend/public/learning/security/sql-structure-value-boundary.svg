<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="sql-structure-value-boundary-title sql-structure-value-boundary-desc"><title id="sql-structure-value-boundary-title">SQL 구조와 값의 분리</title><desc id="sql-structure-value-boundary-desc">문자열 조합에서는 입력이 SQL 문법에 섞일 수 있고 매개변수 바인딩은 값을 별도로 전달하여 구조를 고정한다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="32" class="h" text-anchor="middle">SQL 문법과 사용자 값의 경계를 유지</text><text x="235" y="80" class="h" text-anchor="middle">문자열 조합</text><text x="725" y="80" class="h" text-anchor="middle">매개변수 바인딩</text><rect x="35" y="100" width="400" height="58" class="a"/><text x="235" y="135" class="m" text-anchor="middle">쿼리 문장 + 입력</text><rect x="525" y="100" width="400" height="58" class="r"/><text x="725" y="135" class="m" text-anchor="middle">WHERE email = :email</text><line x1="235" y1="158" x2="235" y2="220" class="l" marker-end="url(#arr)"/><line x1="725" y1="158" x2="725" y2="220" class="l" marker-end="url(#arr)"/><rect x="35" y="220" width="400" height="55" class="a"/><text x="235" y="253.5" class="m" text-anchor="middle">입력이 문법에 섞임</text><rect x="525" y="220" width="400" height="55" class="a"/><text x="725" y="253.5" class="m" text-anchor="middle">값은 별도 매개변수</text><text x="235" y="325" class="s" text-anchor="middle">쿼리 구조 변경 위험</text><text x="725" y="325" class="s" text-anchor="middle">쿼리 구조 고정</text><line x1="480" y1="60" x2="480" y2="345" class="d"/><text x="480" y="383" class="s" text-anchor="middle">테이블·열·정렬식처럼 구조를 선택할 때는 서버 허용 목록 사용</text></svg>
