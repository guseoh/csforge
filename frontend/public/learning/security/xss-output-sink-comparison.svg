<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="xss-output-sink-comparison-title xss-output-sink-comparison-desc"><title id="xss-output-sink-comparison-title">XSS · 데이터와 실행 문맥</title><desc id="xss-output-sink-comparison-desc">동일 불신 문자열 innerHTML에 전달하면 HTML 해석으로 코드 실행 위험, textContent는 문자 표시.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="435"/><text x="480" y="32" class="h" text-anchor="middle">같은 사용자 입력 · 출력 지점에 따라 해석이 달라짐</text><rect x="305" y="70" width="350" height="52" class="r"/><text x="480" y="102" class="m" text-anchor="middle">신뢰할 수 없는 문자열</text><path d="M480 122 V150 H235 V175" class="l" marker-end="url(#arr)"/><path d="M480 122 V150 H725 V175" class="l" marker-end="url(#arr)"/><rect x="35" y="175" width="400" height="55" class="a"/><text x="235" y="208.5" class="m" text-anchor="middle">innerHTML (HTML 해석)</text><rect x="525" y="175" width="400" height="55" class="a"/><text x="725" y="208.5" class="m" text-anchor="middle">textContent (텍스트)</text><line x1="235" y1="230" x2="235" y2="275" class="l" marker-end="url(#arr)"/><line x1="725" y1="230" x2="725" y2="275" class="l" marker-end="url(#arr)"/><rect x="35" y="275" width="400" height="55" class="r"/><text x="235" y="308.5" class="m" text-anchor="middle">코드 실행 위험</text><rect x="525" y="275" width="400" height="55" class="r"/><text x="725" y="308.5" class="m" text-anchor="middle">문자 그대로 표시</text><text x="480" y="382" class="s" text-anchor="middle">HTML·속성·URL·JS 문맥의 방어는 각각 다름</text><text x="480" y="411" class="s" text-anchor="middle">CSP는 추가 방어 · HttpOnly만으로 XSS 피해를 막지 못함</text></svg>
