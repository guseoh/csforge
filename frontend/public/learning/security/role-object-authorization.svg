<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="role-object-authorization-title role-object-authorization-desc"><title id="role-object-authorization-title">인증과 리소스별 인가</title><desc id="role-object-authorization-desc">회원42가 주문A 소유자42와 주문B 소유자77에 접근. 동일 역할이라도 B 거부, A 추가 정책 평가.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="32" class="h" text-anchor="middle">같은 USER 역할 · 객체별 소유권 결과는 다름</text><rect x="45" y="70" width="260" height="52" class="a"/><text x="175" y="102" class="m" text-anchor="middle">인증 주체: 회원 42</text><text x="560" y="103" class="s" text-anchor="middle">주문 조회/취소 요청</text><line x1="305" y1="96" x2="815" y2="96" class="l" marker-end="url(#arr)"/><text x="35" y="174" class="m" text-anchor="start">리소스</text><text x="350" y="174" class="h" text-anchor="middle">주문 A</text><text x="735" y="174" class="h" text-anchor="middle">주문 B</text><rect x="220" y="190" width="260" height="48" class="r"/><text x="350" y="220" class="m" text-anchor="middle">owner = 42</text><rect x="605" y="190" width="260" height="48" class="r"/><text x="735" y="220" class="m" text-anchor="middle">owner = 77</text><text x="350" y="277" class="m" text-anchor="middle">소유권 ✓</text><text x="735" y="277" class="m" text-anchor="middle">소유권 ×</text><rect x="220" y="305" width="260" height="52" class="a"/><text x="350" y="337" class="m" text-anchor="middle">추가 정책 평가</text><rect x="605" y="305" width="260" height="52" class="a"/><text x="735" y="337" class="m" text-anchor="middle">거부</text><text x="480" y="402" class="s" text-anchor="middle">역할 허용과 소유권·업무 상태 검사는 서로 다른 조건</text></svg>
