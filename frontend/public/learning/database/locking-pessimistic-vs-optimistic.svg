<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="pessimistic-lock-title pessimistic-lock-desc"><title id="pessimistic-lock-title">비관적 잠금(SELECT FOR UPDATE) 대기 타임라인과 외부 I/O 위험</title><desc id="pessimistic-lock-desc">왼쪽은 짧은 트랜잭션에서 T1이 행 잠금을 잡고 빠르게 커밋해 T2 대기가 짧다. 오른쪽은 잠금을 잡은 채 5초 외부 API를 호출해 T2 대기와 커넥션 풀 점유가 길어지는 위험을 보여준다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 22px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="235" y="38" class="h" text-anchor="middle">짧은 잠금 보유 (권장)</text><text x="725" y="38" class="h" text-anchor="middle">잠금 중 외부 I/O (위험)</text><line x1="480" y1="54" x2="480" y2="380" class="d"/><text x="42" y="96" class="m">T1</text><rect x="82" y="70" width="136" height="48" rx="5" class="a"/><text x="150" y="100" class="m" text-anchor="middle">FOR UPDATE</text><rect x="228" y="70" width="110" height="48" rx="5" class="r"/><text x="283" y="100" class="m" text-anchor="middle">UPDATE</text><rect x="348" y="70" width="98" height="48" rx="5" class="a"/><text x="397" y="100" class="m" text-anchor="middle">COMMIT</text><text x="42" y="216" class="m">T2</text><rect x="130" y="190" width="136" height="48" rx="5" class="r"/><text x="198" y="220" class="m" text-anchor="middle">FOR UPDATE</text><line x1="266" y1="214" x2="388" y2="214" class="d" marker-end="url(#arrow)"/><text x="327" y="204" class="s" text-anchor="middle">짧은 대기</text><line x1="397" y1="118" x2="397" y2="186" class="strong" marker-end="url(#arrow)"/><rect x="342" y="264" width="112" height="48" rx="5" class="a"/><text x="398" y="294" class="t" text-anchor="middle">잠금 획득</text><line x1="398" y1="238" x2="398" y2="260" class="l" marker-end="url(#arrow)"/><text x="240" y="352" class="s" text-anchor="middle">행 잠금과 DB 커넥션 점유 시간 최소화</text><text x="510" y="96" class="m">T1</text><rect x="546" y="70" width="124" height="48" rx="5" class="a"/><text x="608" y="100" class="m" text-anchor="middle">FOR UPDATE</text><rect x="678" y="70" width="160" height="48" rx="5" class="a"/><text x="758" y="92" class="t" text-anchor="middle">외부 API 5초</text><text x="758" y="112" class="s" text-anchor="middle">잠금+커넥션 유지</text><rect x="846" y="70" width="84" height="48" rx="5" class="r"/><text x="888" y="100" class="m" text-anchor="middle">COMMIT</text><text x="510" y="216" class="m">T2</text><rect x="566" y="190" width="124" height="48" rx="5" class="r"/><text x="628" y="220" class="m" text-anchor="middle">FOR UPDATE</text><line x1="690" y1="214" x2="880" y2="214" class="strong" marker-end="url(#arrow)"/><text x="785" y="202" class="t" text-anchor="middle">5초 이상 블로킹 대기</text><rect x="514" y="264" width="414" height="58" rx="5" class="r"/><text x="721" y="290" class="t" text-anchor="middle">대기 큐 누적 · 커넥션 풀 고갈 위험</text><text x="721" y="312" class="s" text-anchor="middle">충돌이 드물면 낙관적 락·조건부 UPDATE 우선 검토</text><text x="480" y="410" class="s" text-anchor="middle">일반 SELECT는 MVCC로 대기하지 않지만, 동일 행 UPDATE·FOR UPDATE는 커밋까지 직렬화된다</text></svg>
