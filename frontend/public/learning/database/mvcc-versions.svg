<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" role="img" aria-labelledby="mvcc-versions-title mvcc-versions-desc"><title id="mvcc-versions-title">MVCC: 하나의 행과 두 튜플 버전</title><desc id="mvcc-versions-desc">PostgreSQL UPDATE T20이 새 행 버전을 만든다는 단순화된 예시. xmin/xmax와 커밋 상태, 스냅샷을 구분한다.</desc><defs><marker id="arrow-mvcc-versions" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-mvcc-versions)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="505"/><text class="title" x="42" y="48">MVCC: 하나의 행과 두 튜플 버전</text><path class="edge" d="M521 191L584 191"/><rect class="panel" x="68" y="125" width="450" height="132" rx="4"/><text class="label" x="293" y="160" text-anchor="middle">OLD price = 10,000</text><text class="small" x="293" y="188" text-anchor="middle">xmin=T10 · xmax=T20</text><rect class="hi" x="590" y="125" width="443" height="132" rx="4"/><text class="label" x="811.5" y="160" text-anchor="middle">NEW price = 12,000</text><text class="small" x="811.5" y="188" text-anchor="middle">xmin=T20 · xmax=없음</text><rect class="panel" x="68" y="321" width="450" height="80" rx="4"/><text class="label" x="293" y="356" text-anchor="middle">T20 이전 스냅샷</text><text class="small" x="293" y="384" text-anchor="middle">OLD를 볼 수 있음</text><rect class="panel" x="590" y="321" width="443" height="80" rx="4"/><text class="label" x="811.5" y="356" text-anchor="middle">T20 커밋 이후 새 스냅샷</text><text class="small" x="811.5" y="384" text-anchor="middle">NEW를 볼 수 있음</text><text class="note" x="550" y="291" text-anchor="middle">T20: UPDATE 후 COMMIT</text><text class="note" x="550" y="455" text-anchor="middle">가시성은 xmin/xmax 숫자만으로 결정하지 않습니다.</text></svg>