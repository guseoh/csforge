<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="query-keyset-title query-keyset-desc"><title id="query-keyset-title">Keyset 페이지네이션: 복합 커서 다음</title><desc id="query-keyset-desc">created_at이 모두 10:00으로 같은 행의 id 내림차순 예시. 첫 페이지의 마지막 튜플 (10:00, 800)보다 작은 튜플을 다음 페이지에서 조회해 800을 중복하지 않는다.</desc><defs><marker id="arrow-query-keyset" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-query-keyset)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="485"/><text class="title" x="42" y="48">Keyset 페이지네이션: 복합 커서 다음</text><path d="M535 180L560 180" class="edge"/><path d="M557 301L557 222" class="edge"/><rect class="panel" x="36" y="131" width="500" height="85" rx="4"/><text class="label" x="286" y="167" text-anchor="middle">첫 페이지 · DESC</text><text class="small" x="286" y="197" text-anchor="middle">803 · 802 · 801 · 800</text><rect class="accent" x="563" y="131" width="500" height="85" rx="4"/><text class="label" x="813" y="167" text-anchor="middle">다음 페이지 · DESC</text><text class="small" x="813" y="197" text-anchor="middle">799 · 798 · 797 · 796</text><rect class="panel" x="335" y="308" width="437" height="92" rx="4"/><text class="label" x="553.5" y="344" text-anchor="middle">cursor = (10:00, 800)</text><text class="small" x="553.5" y="374" text-anchor="middle">WHERE (created_at,id) &lt; cursor</text><text class="note" x="550" y="432" text-anchor="middle">예시 행은 created_at=10:00이며 id가 동률을 해소합니다.</text><text class="note" x="550" y="463" text-anchor="middle">실제 API에서는 두 정렬 키 모두 커서에 유지해야 합니다.</text></svg>