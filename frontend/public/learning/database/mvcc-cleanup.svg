<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" role="img" aria-labelledby="mvcc-cleanup-title mvcc-cleanup-desc"><title id="mvcc-cleanup-title">VACUUM: 오래된 스냅샷과 버전 회수</title><desc id="mvcc-cleanup-desc">PostgreSQL 16. 오래된 스냅샷에서 아직 필요한 행 버전은 일반 VACUUM이 제거할 수 없다. 오래된 스냅샷이 끝난 뒤 안전한 버전은 이후 VACUUM 작업에서 재사용 가능한 공간으로 바뀔 수 있다.</desc><defs><marker id="arrow-mvcc-cleanup" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-mvcc-cleanup)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="505"/><text class="title" x="42" y="48">VACUUM: 오래된 스냅샷과 버전 회수</text><path d="M368 185L382 185" class="edge"/><path d="M719 185L735 185" class="edge"/><path d="M903 243L706 322" class="edge"/><rect class="panel" x="35" y="135" width="329" height="104" rx="4"/><text class="label" x="199.5" y="171" text-anchor="middle">T1: 오래된 스냅샷</text><text class="small" x="199.5" y="201" text-anchor="middle">version A를 볼 수 있음</text><rect class="panel" x="387" y="135" width="329" height="104" rx="4"/><text class="label" x="551.5" y="171" text-anchor="middle">T2: UPDATE 반복</text><text class="small" x="551.5" y="201" text-anchor="middle">version B, C 생성</text><rect class="accent" x="739" y="135" width="329" height="104" rx="4"/><text class="label" x="903.5" y="171" text-anchor="middle">VACUUM</text><text class="small" x="903.5" y="201" text-anchor="middle">A 제거 보류</text><rect class="panel" x="401" y="309" width="304" height="80" rx="4"/><text class="label" x="553" y="345" text-anchor="middle">T1 종료 이후</text><text class="small" x="553" y="375" text-anchor="middle">A가 더는 필요 없다면 회수 가능</text><text class="note" x="550" y="426" text-anchor="middle">일반 VACUUM은 주로 파일 안의 재사용 공간을 확보합니다.</text><text class="note" x="550" y="466" text-anchor="middle">T1이 종료됐다고 즉시 정리가 실행되는 것은 아닙니다.</text></svg>