<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="checkpoint-recovery-title checkpoint-recovery-desc"><title id="checkpoint-recovery-title">체크포인트 Redo Point와 장애 복구 WAL 재적용 범위</title><desc id="checkpoint-recovery-desc">체크포인트가 dirty 페이지를 데이터 파일에 반영해 redo point를 전진시키면, 장애 발생 시 redo point 이전 WAL은 건너뛰고 그 이후 WAL 레코드만 재적용해 일관 상태를 복구한다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="480" y="38" class="h" text-anchor="middle">체크포인트 Redo Point와 장애 복구(Crash Recovery) 범위</text><line x1="36" y1="176" x2="924" y2="176" class="strong" marker-end="url(#arrow)"/><text x="920" y="164" class="s" text-anchor="end">LSN →</text><rect x="36" y="96" width="248" height="60" rx="5" class="r"/><text x="160" y="122" class="t" text-anchor="middle">이전 WAL 구간</text><text x="160" y="144" class="s" text-anchor="middle">데이터 파일 반영 완료 (생략)</text><line x1="340" y1="78" x2="340" y2="246" class="strong"/><rect x="302" y="92" width="154" height="64" rx="6" class="a"/><text x="379" y="120" class="m" text-anchor="middle">Redo Point</text><text x="379" y="143" class="s" text-anchor="middle">체크포인트 기준점</text><rect x="476" y="96" width="102" height="60" rx="5" class="r"/><text x="527" y="132" class="m" text-anchor="middle">WAL A</text><rect x="594" y="96" width="102" height="60" rx="5" class="r"/><text x="645" y="132" class="m" text-anchor="middle">WAL B</text><rect x="712" y="96" width="102" height="60" rx="5" class="r"/><text x="763" y="132" class="m" text-anchor="middle">WAL C</text><line x1="840" y1="88" x2="840" y2="246" class="d"/><text x="840" y="78" class="t" text-anchor="middle">장애 (Crash)</text><rect x="340" y="198" width="500" height="44" rx="5" class="a"/><text x="590" y="226" class="t" text-anchor="middle">재기동 시 Redo Point → Crash 구간 WAL만 재적용(Replay)</text><rect x="56" y="284" width="404" height="90" rx="6" class="r"/><text x="258" y="314" class="t" text-anchor="middle">너무 잦은 체크포인트</text><text x="258" y="340" class="s" text-anchor="middle">복구 구간은 짧지만 dirty write I/O와</text><text x="258" y="362" class="s" text-anchor="middle">full_page_writes WAL 급증</text><rect x="500" y="284" width="404" height="90" rx="6" class="r"/><text x="702" y="314" class="t" text-anchor="middle">너무 드문 체크포인트</text><text x="702" y="340" class="s" text-anchor="middle">평소 쓰기 부담은 줄지만 pg_wal 증가 및</text><text x="702" y="362" class="s" text-anchor="middle">장애 후 WAL 재적용 복구 시간 증가</text><text x="480" y="414" class="s" text-anchor="middle">체크포인트는 프로세스 장애 복구용이며 디스크 유실·실수 복원용 백업(PITR)을 대체하지 않는다</text></svg>
