<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="isolation-anomalies-title isolation-anomalies-desc"><title id="isolation-anomalies-title">읽기 이상 현상: 트랜잭션 사이의 변화</title><desc id="isolation-anomalies-desc">SQL 읽기 이상 현상 세 가지 예시. PostgreSQL READ COMMITTED는 dirty read를 허용하지 않는다.</desc><defs><marker id="arrow-isolation-anomalies" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-isolation-anomalies)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="510"/><text class="title" x="42" y="48">읽기 이상 현상: 트랜잭션 사이의 변화</text><rect class="panel" x="25" y="110" width="338" height="80" rx="4"/><text class="label" x="194" y="145" text-anchor="middle">Dirty read</text><text class="small" x="194" y="173" text-anchor="middle">미커밋 값 읽기</text><rect class="panel" x="381" y="110" width="338" height="80" rx="4"/><text class="label" x="550" y="145" text-anchor="middle">Non-repeatable read</text><text class="small" x="550" y="173" text-anchor="middle">같은 행 결과 변화</text><rect class="panel" x="737" y="110" width="338" height="80" rx="4"/><text class="label" x="906" y="145" text-anchor="middle">Phantom read</text><text class="small" x="906" y="173" text-anchor="middle">조건에 맞는 행 집합 변화</text><text class="small" x="42" y="228" text-anchor="start">T2: UPDATE → 200</text><text class="small" x="42" y="266" text-anchor="start">T1: 미커밋 200 읽음</text><text class="small" x="42" y="305" text-anchor="start">T2: ROLLBACK</text><text class="label" x="42" y="366" text-anchor="start">PostgreSQL RC에서는 불가</text><text class="small" x="396" y="228" text-anchor="start">T1: SELECT → 100</text><text class="small" x="396" y="266" text-anchor="start">T2: UPDATE/COMMIT 200</text><text class="small" x="396" y="305" text-anchor="start">T1: SELECT → 200</text><text class="label" x="396" y="366" text-anchor="start">PostgreSQL RC에서 가능</text><text class="small" x="749" y="228" text-anchor="start">T1: 조건 조회 → 2행</text><text class="small" x="749" y="266" text-anchor="start">T2: INSERT/COMMIT</text><text class="small" x="749" y="305" text-anchor="start">T1: 조건 조회 → 3행</text><text class="label" x="749" y="366" text-anchor="start">PostgreSQL RC에서 가능</text><text class="note" x="550" y="457" text-anchor="middle">PostgreSQL REPEATABLE READ는 phantom read도 방지합니다.</text></svg>