<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="sql-window-frame-title sql-window-frame-desc">
<title id="sql-window-frame-title">윈도 누적합: RANGE와 ROWS</title><desc id="sql-window-frame-desc">회원 7의 주문 101과 102는 같은 시각이다. 기본 RANGE frame은 첫 행부터 같은 정렬 값의 동료 행까지 포함하여 두 누적합 모두 3000이다. created_at,id 정렬 및 ROWS frame은 101의 누적합 1000, 102의 누적합 3000이다.</desc>
<defs><marker id="sql-window-frame-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker><style>
.bg{fill:#fff}.title{fill:#191919;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#404040;font:19px system-ui,sans-serif}.note{fill:#404040;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#858585;stroke-width:1.5}.hi{fill:#e6e6e6;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#sql-window-frame-arrow)}.dash{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#363636;stroke:#eee}.line,.edge{stroke:#bbb}}
</style></defs><rect class="bg" width="960" height="445"/><text class="title" x="28" y="43" text-anchor="start">윈도 누적합: 같은 시각의 주문을 어떻게 셀까?</text><text class="small" x="28" y="78" text-anchor="start">PARTITION BY member_id = 7 · 첫 행(id 101)의 frame을 회색으로 표시</text><text class="label" x="28" y="113" text-anchor="start">기본 RANGE</text><text class="small" x="28" y="141" text-anchor="start">ORDER BY created_at</text><rect class="panel" x="28" y="156" width="434" height="190" rx="2"/><rect class="hi" x="29" y="202" width="432" height="88" rx="0"/><text class="label" x="42" y="185" text-anchor="start">id</text><text class="label" x="128" y="185" text-anchor="start">시각</text><text class="label" x="276" y="185" text-anchor="end">금액</text><text class="label" x="414" y="185" text-anchor="end">누적합</text><path class="line" d="M28 201H462 M28 245H462 M28 289H462"/><text class="small" x="42" y="230" text-anchor="start">101</text><text class="small" x="128" y="230" text-anchor="start">10:00</text><text class="small" x="276" y="230" text-anchor="end">1,000</text><text class="label" x="414" y="230" text-anchor="end">3,000</text><text class="small" x="42" y="274" text-anchor="start">102</text><text class="small" x="128" y="274" text-anchor="start">10:00</text><text class="small" x="276" y="274" text-anchor="end">2,000</text><text class="label" x="414" y="274" text-anchor="end">3,000</text><text class="small" x="42" y="318" text-anchor="start">103</text><text class="small" x="128" y="318" text-anchor="start">10:01</text><text class="small" x="276" y="318" text-anchor="end">500</text><text class="label" x="414" y="318" text-anchor="end">3,500</text><text class="label" x="498" y="113" text-anchor="start">명시적 ROWS</text><text class="small" x="498" y="141" text-anchor="start">ORDER BY created_at, id</text><rect class="panel" x="498" y="156" width="434" height="190" rx="2"/><rect class="hi" x="499" y="202" width="432" height="44" rx="0"/><text class="label" x="512" y="185" text-anchor="start">id</text><text class="label" x="598" y="185" text-anchor="start">시각</text><text class="label" x="746" y="185" text-anchor="end">금액</text><text class="label" x="884" y="185" text-anchor="end">누적합</text><path class="line" d="M498 201H932 M498 245H932 M498 289H932"/><text class="small" x="512" y="230" text-anchor="start">101</text><text class="small" x="598" y="230" text-anchor="start">10:00</text><text class="small" x="746" y="230" text-anchor="end">1,000</text><text class="label" x="884" y="230" text-anchor="end">1,000</text><text class="small" x="512" y="274" text-anchor="start">102</text><text class="small" x="598" y="274" text-anchor="start">10:00</text><text class="small" x="746" y="274" text-anchor="end">2,000</text><text class="label" x="884" y="274" text-anchor="end">3,000</text><text class="small" x="512" y="318" text-anchor="start">103</text><text class="small" x="598" y="318" text-anchor="start">10:01</text><text class="small" x="746" y="318" text-anchor="end">500</text><text class="label" x="884" y="318" text-anchor="end">3,500</text><text class="label" x="28" y="383" text-anchor="start">동일 정렬 값의 동료 행까지 포함</text><text class="label" x="498" y="383" text-anchor="start">고유 순서로 현재 행까지 포함</text><text class="note" x="28" y="426" text-anchor="start">고유한 ORDER BY라면 기본 RANGE도 이 예시의 ROWS 결과와 같아집니다.</text></svg>
