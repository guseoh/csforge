<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="sql-select-order-title sql-select-order-desc"><title id="sql-select-order-title">SQL SELECT 논리 처리 순서와 alias·집계 사용 시점</title><desc id="sql-select-order-desc">FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY 순으로 논리 단계가 진행되므로 WHERE에서는 집계 함수나 SELECT alias를 쓸 수 없고 HAVING과 ORDER BY에서 사용한다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18.5px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">SELECT 논리 처리 순서 (작성 순서 ≠ 의미 평가 순서)</text><rect x="36" y="70" width="268" height="90" rx="6" class="r"/><text x="170" y="104" class="m" text-anchor="middle">1. FROM / JOIN</text><text x="170" y="134" class="s" text-anchor="middle">입력 테이블 결합 · 기본 행 집합</text><line x1="304" y1="115" x2="342" y2="115" class="strong" marker-end="url(#arrow)"/><rect x="346" y="70" width="268" height="90" rx="6" class="a"/><text x="480" y="104" class="m" text-anchor="middle">2. WHERE</text><text x="480" y="134" class="s" text-anchor="middle">개별 행 필터 (집계 · alias 불가)</text><line x1="614" y1="115" x2="652" y2="115" class="strong" marker-end="url(#arrow)"/><rect x="656" y="70" width="268" height="90" rx="6" class="r"/><text x="790" y="104" class="m" text-anchor="middle">3. GROUP BY</text><text x="790" y="134" class="s" text-anchor="middle">키 기준 행 묶음(그룹) 형성</text><path d="M 790 160 L 790 186 L 170 186 L 170 212" class="strong" marker-end="url(#arrow)"/><rect x="36" y="216" width="268" height="90" rx="6" class="a"/><text x="170" y="250" class="m" text-anchor="middle">4. HAVING</text><text x="170" y="280" class="s" text-anchor="middle">그룹 집계(AVG/COUNT) 필터</text><line x1="304" y1="261" x2="342" y2="261" class="strong" marker-end="url(#arrow)"/><rect x="346" y="216" width="268" height="90" rx="6" class="a"/><text x="480" y="250" class="m" text-anchor="middle">5. SELECT</text><text x="480" y="280" class="s" text-anchor="middle">출력 식 평가 · alias 생성 지점</text><line x1="614" y1="261" x2="652" y2="261" class="strong" marker-end="url(#arrow)"/><rect x="656" y="216" width="268" height="90" rx="6" class="r"/><text x="790" y="250" class="m" text-anchor="middle">6. ORDER BY / LIMIT</text><text x="790" y="280" class="s" text-anchor="middle">alias 정렬 가능 · 최종 출력 제한</text><rect x="120" y="336" width="720" height="44" rx="6" class="r"/><text x="480" y="364" class="s" text-anchor="middle">논리 순서 = 결과 의미 모델 · 물리 실행 계획(EXPLAIN)은 옵티마이저가 의미를 유지하며 최적화</text><text x="480" y="408" class="s" text-anchor="middle">WHERE AVG(salary) &gt; 5000 (오류) → HAVING AVG(salary) &gt; 5000 (정상)</text></svg>
