<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="optimizer-cost-title optimizer-cost-desc"><title id="optimizer-cost-title">PostgreSQL 비용 기반 옵티마이저 실행 계획 선택 과정</title><desc id="optimizer-cost-desc">통계 정보로 조건 선택도를 추정한 뒤 Sequential Scan과 Index Scan 같은 후보 계획의 I/O와 CPU 비용을 비교해 예상 비용이 낮은 계획을 선택한다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18.5px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">옵티마이저의 통계 기반 비용 추정과 계획 선택</text><rect x="36" y="72" width="236" height="256" rx="6" class="r"/><text x="154" y="106" class="t" text-anchor="middle">pg_statistic 통계</text><rect x="56" y="126" width="196" height="40" rx="4" class="bg" stroke="var(--line)" stroke-width="1.4"/><text x="154" y="152" class="s" text-anchor="middle">테이블 페이지 · 행 수</text><rect x="56" y="176" width="196" height="40" rx="4" class="bg" stroke="var(--line)" stroke-width="1.4"/><text x="154" y="202" class="s" text-anchor="middle">고유 값 수 (n_distinct)</text><rect x="56" y="226" width="196" height="40" rx="4" class="bg" stroke="var(--line)" stroke-width="1.4"/><text x="154" y="252" class="s" text-anchor="middle">최빈값 (MCV) · NULL 비율</text><rect x="56" y="276" width="196" height="40" rx="4" class="bg" stroke="var(--line)" stroke-width="1.4"/><text x="154" y="302" class="s" text-anchor="middle">값 분포 히스토그램</text><line x1="272" y1="200" x2="314" y2="200" class="strong" marker-end="url(#arrow)"/><rect x="318" y="142" width="214" height="116" rx="6" class="a"/><text x="425" y="178" class="t" text-anchor="middle">선택도 · 행 수 추정</text><text x="425" y="208" class="m" text-anchor="middle">estimated rows</text><text x="425" y="236" class="s" text-anchor="middle">통계 오류 → 계획 오판</text><path d="M 532 180 L 560 180 L 560 120 L 584 120" class="l" marker-end="url(#arrow)"/><path d="M 532 220 L 560 220 L 560 278 L 584 278" class="strong" marker-end="url(#arrow)"/><rect x="588" y="72" width="336" height="106" rx="6" class="r"/><text x="756" y="104" class="m" text-anchor="middle">후보 1: Sequential Scan</text><text x="756" y="132" class="s" text-anchor="middle">cost=0.00..2840.00 (순차 I/O 전체 스캔)</text><text x="756" y="158" class="s" text-anchor="middle">결과 비율이 크면 오히려 유리</text><rect x="588" y="216" width="336" height="112" rx="6" class="a"/><text x="756" y="248" class="m" text-anchor="middle">후보 2: Index Scan (선택)</text><text x="756" y="276" class="s" text-anchor="middle">cost=0.43..128.17 rows=20</text><text x="756" y="304" class="s" text-anchor="middle">소수 행 탐색 시 낮은 비용으로 채택</text><text x="480" y="394" class="s" text-anchor="middle">cost 숫자는 밀리초가 아니라 비교 단위이며, 성능 분석은 예상 행 수와 실제 행 수 차이에서 시작한다</text></svg>
