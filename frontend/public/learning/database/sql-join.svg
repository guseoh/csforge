<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 495" role="img" aria-labelledby="sql-join-title sql-join-desc"><title id="sql-join-title">LEFT JOIN: ON과 WHERE의 결과 비교</title><desc id="sql-join-desc">회원 1은 PAID 주문 101이 있고 회원 2는 주문이 없다. 주문 상태 조건을 WHERE에 두면 회원 2가 제거되고, ON에 두면 회원 2는 NULL 주문 열과 함께 유지된다.</desc><defs><marker id="arrow-sql-join" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-sql-join)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="495"/><text class="title" x="42" y="48">LEFT JOIN: ON과 WHERE의 결과 비교</text><path d="M287 207L287 235" class="edge"/><path d="M813 207L813 235" class="edge"/><rect class="panel" x="37" y="120" width="499" height="83" rx="4"/><text class="label" x="286.5" y="156" text-anchor="middle">조건을 WHERE에 둔 경우</text><text class="small" x="286.5" y="186" text-anchor="middle">JOIN 이후 WHERE o.status='PAID'</text><rect class="panel" x="563" y="120" width="499" height="83" rx="4"/><text class="label" x="812.5" y="156" text-anchor="middle">조건을 ON에 둔 경우</text><text class="small" x="812.5" y="186" text-anchor="middle">LEFT JOIN ... AND status='PAID'</text><rect class="panel" x="55" y="241" width="460" height="90" rx="4"/><text class="label" x="285" y="277" text-anchor="middle">남는 행</text><text class="small" x="285" y="307" text-anchor="middle">(member=1, order=101)</text><rect class="accent" x="583" y="241" width="460" height="90" rx="4"/><text class="label" x="813" y="277" text-anchor="middle">남는 행</text><text class="small" x="813" y="307" text-anchor="middle">(1,101) · (2,NULL)</text><text class="note" x="550" y="402" text-anchor="middle">ON은 오른쪽 매칭 조건, WHERE는 최종 결과 행의 필터입니다.</text><text class="note" x="550" y="450" text-anchor="middle">WHERE에서 NULL = 'PAID'는 TRUE가 아니므로 회원 2가 사라집니다.</text></svg>