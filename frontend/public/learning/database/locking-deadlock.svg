<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 465" role="img" aria-labelledby="locking-deadlock-title locking-deadlock-desc"><title id="locking-deadlock-title">교착 상태: 잠금 대기의 순환</title><desc id="locking-deadlock-desc">T1은 A 잠금을 보유하고 B를 기다리며, T2는 B 잠금을 보유하고 A를 기다린다. PostgreSQL은 한 트랜잭션을 중단한다.</desc><defs><marker id="arrow-locking-deadlock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-locking-deadlock)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="465"/><text class="title" x="42" y="48">교착 상태: 잠금 대기의 순환</text><path class="edge" d="M440 190L656 190"/><path class="edge" d="M655 251L441 251"/><rect class="panel" x="91" y="170" width="345" height="99" rx="4"/><text class="label" x="263.5" y="205" text-anchor="middle">T1</text><text class="small" x="263.5" y="233" text-anchor="middle">A 보유 · B 기다림</text><rect class="panel" x="660" y="170" width="345" height="99" rx="4"/><text class="label" x="832.5" y="205" text-anchor="middle">T2</text><text class="small" x="832.5" y="233" text-anchor="middle">B 보유 · A 기다림</text><text class="note" x="545" y="140" text-anchor="middle">T1 → T2 대기</text><text class="note" x="546" y="324" text-anchor="middle">T2 → T1 대기</text><text class="note" x="550" y="403" text-anchor="middle">PostgreSQL은 교착 상태를 감지해 어느 한쪽을 중단합니다.</text></svg>