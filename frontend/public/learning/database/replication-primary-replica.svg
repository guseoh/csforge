<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="replication-primary-replica-title replication-primary-replica-desc"><title id="replication-primary-replica-title">비동기 복제: 커밋과 재생 시점</title><desc id="replication-primary-replica-desc">PostgreSQL 16 기본 비동기 Streaming Replication. WAL을 수신해도 replay 전이면 standby의 SELECT는 이전 값을 볼 수 있다.</desc><defs><marker id="arrow-replication-primary-replica" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-replication-primary-replica)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="490"/><text class="title" x="42" y="48">비동기 복제: 커밋과 재생 시점</text><path class="edge" d="M422 177L592 279"/><path class="edge" d="M734 333L780 333"/><rect class="panel" x="145" y="130" width="272" height="90" rx="4"/><text class="label" x="281" y="165" text-anchor="middle">Primary: COMMIT</text><text class="small" x="281" y="193" text-anchor="middle">price = 200</text><rect class="panel" x="475" y="287" width="255" height="90" rx="4"/><text class="label" x="602.5" y="322" text-anchor="middle">Standby: WAL 수신</text><text class="small" x="602.5" y="350" text-anchor="middle">아직 replay 전</text><rect class="hi" x="787" y="287" width="265" height="90" rx="4"/><text class="label" x="919.5" y="322" text-anchor="middle">Standby: WAL replay</text><text class="small" x="919.5" y="350" text-anchor="middle">price = 200 반영</text><text class="small" x="50" y="100" text-anchor="start">시간 →</text><text class="small" x="50" y="262" text-anchor="start">Primary</text><text class="small" x="50" y="384" text-anchor="start">Standby</text><text class="note" x="550" y="437" text-anchor="middle">replay 전 standby 읽기는 이전 커밋 값(price=100)을 볼 수 있습니다.</text></svg>