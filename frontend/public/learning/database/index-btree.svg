<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="index-btree-title index-btree-desc"><title id="index-btree-title">PostgreSQL B-tree 페이지 탐색</title><desc id="index-btree-desc">내부 페이지는 하위 페이지를 가리키고 리프 페이지는 정렬된 인덱스 엔트리를 가진다. 범위 20 이상 40 미만의 예시.</desc><defs><marker id="arrow-index-btree" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-index-btree)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="500"/><text class="title" x="42" y="48">PostgreSQL B-tree 페이지 탐색</text><path class="edge" d="M470 195L201 267"/><path class="edge" d="M547 195L549 267"/><path class="edge" d="M630 195L897 267"/><path class="edge" d="M355 328L388 328"/><path class="edge" d="M703 328L736 328"/><rect class="panel" x="410" y="110" width="270" height="85" rx="4"/><text class="label" x="545" y="145" text-anchor="middle">내부 페이지</text><text class="small" x="545" y="173" text-anchor="middle">분리 키: 20 | 40</text><rect class="panel" x="48" y="274" width="306" height="100" rx="4"/><text class="label" x="201" y="309" text-anchor="middle">리프 페이지 A</text><text class="small" x="201" y="337" text-anchor="middle">5 · 10 · 15</text><rect class="hi" x="396" y="274" width="306" height="100" rx="4"/><text class="label" x="549" y="309" text-anchor="middle">리프 페이지 B</text><text class="small" x="549" y="337" text-anchor="middle">20 · 25 · 30 · 35</text><rect class="panel" x="744" y="274" width="306" height="100" rx="4"/><text class="label" x="897" y="309" text-anchor="middle">리프 페이지 C</text><text class="small" x="897" y="337" text-anchor="middle">40 · 45 · 50</text><text class="small" x="42" y="84" text-anchor="start">WHERE key &gt;= 20 AND key &lt; 40</text><text class="note" x="550" y="426" text-anchor="middle">리프에는 힙 튜플을 찾는 TID 등이 있습니다.</text><text class="note" x="550" y="458" text-anchor="middle">구조·키는 개념적 예시이며 실제 페이지 크기·분할은 다릅니다.</text></svg>