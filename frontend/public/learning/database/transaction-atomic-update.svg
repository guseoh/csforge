<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 489" role="img" aria-labelledby="transaction-atomic-update-title transaction-atomic-update-desc">
<title id="transaction-atomic-update-title">조건부 UPDATE: 잠금 대기와 재평가</title><desc id="transaction-atomic-update-desc">PostgreSQL 16 READ COMMITTED에서 sku 하나의 quantity가 1인 예시. A가 UPDATE하여 0을 만들고 B는 같은 행의 잠금 때문에 기다린다. A가 커밋한 후 B는 최신 버전에 조건을 재평가하여 0행 갱신한다.</desc>
<defs><marker id="transaction-atomic-update-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker><style>
.bg{fill:#fff}.title{fill:#191919;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#404040;font:19px system-ui,sans-serif}.note{fill:#404040;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#858585;stroke-width:1.5}.hi{fill:#e6e6e6;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#transaction-atomic-update-arrow)}.dash{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#363636;stroke:#eee}.line,.edge{stroke:#bbb}}
</style></defs><rect class="bg" width="960" height="489"/><text class="title" x="28" y="43" text-anchor="start">조건부 UPDATE: 같은 재고 행에 대한 두 요청</text><text class="small" x="28" y="79" text-anchor="start">READ COMMITTED · 초기 quantity = 1 · A가 먼저 행 잠금 획득</text><text class="label" x="295" y="119" text-anchor="middle">요청 A</text><text class="label" x="721" y="119" text-anchor="middle">요청 B</text><path class="line dash" d="M295 129V410 M721 129V410"/><text class="note" x="28" y="165" text-anchor="start">시간 ↓</text><rect class="hi" x="132" y="137" width="326" height="62" rx="2"/><text class="label" x="295" y="164" text-anchor="middle">UPDATE 1 → 0</text><text class="small" x="295" y="189" text-anchor="middle">1행 갱신 · 미커밋</text><rect class="panel" x="558" y="211" width="326" height="60" rx="2"/><text class="label" x="721" y="238" text-anchor="middle">UPDATE 시도</text><text class="small" x="721" y="261" text-anchor="middle">A의 행 잠금 때문에 대기</text><rect class="panel" x="132" y="277" width="326" height="54" rx="2"/><text class="label" x="295" y="311" text-anchor="middle">COMMIT · 잠금 해제</text><path class="edge" d="M458 304H721V340"/><rect class="hi" x="558" y="348" width="326" height="70" rx="2"/><text class="label" x="721" y="375" text-anchor="middle">최신 행 quantity = 0</text><text class="small" x="721" y="400" text-anchor="middle">조건 불충족 → 0행 갱신</text><text class="note" x="28" y="451" text-anchor="start">UPDATE inventory SET quantity = quantity - 1 WHERE sku_id = ? AND quantity &gt; 0</text><text class="note" x="28" y="478" text-anchor="start">0행은 대상 부재일 수도 있으므로 서비스의 실패 계약을 명시합니다.</text></svg>
