<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 495" role="img" aria-labelledby="transaction-atomic-update-title transaction-atomic-update-desc"><title id="transaction-atomic-update-title">조건부 UPDATE: 두 요청의 재고 경합</title><desc id="transaction-atomic-update-desc">PostgreSQL 16 READ COMMITTED에서 quantity=1인 같은 행을 두 UPDATE가 처리하는 예시. 요청 A가 1행 갱신해 커밋하면 기다린 B는 최신 버전의 quantity&gt;0을 재검사해 0행 갱신할 수 있다.</desc><defs><marker id="arrow-transaction-atomic-update" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-transaction-atomic-update)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="495"/><text class="title" x="42" y="48">조건부 UPDATE: 두 요청의 재고 경합</text><path d="M250 215L250 271" class="edge"/><path d="M768 215L768 271" class="edge"/><rect class="panel" x="35" y="116" width="482" height="94" rx="4"/><text class="label" x="276" y="152" text-anchor="middle">초기 상태: quantity = 1</text><text class="small" x="276" y="182" text-anchor="middle">요청 A와 B가 동시에 시작</text><rect class="accent" x="70" y="278" width="426" height="91" rx="4"/><text class="label" x="283" y="314" text-anchor="middle">요청 A: UPDATE</text><text class="small" x="283" y="344" text-anchor="middle">1 → 0 · 1행 변경</text><rect class="panel" x="600" y="278" width="426" height="91" rx="4"/><text class="label" x="813" y="314" text-anchor="middle">요청 B: UPDATE</text><text class="small" x="813" y="344" text-anchor="middle">A 대기 후 조건 재평가 · 0행 변경</text><text class="note" x="550" y="414" text-anchor="middle">UPDATE ... SET quantity=quantity-1 WHERE quantity&gt;0</text><text class="note" x="550" y="456" text-anchor="middle">0행은 재고 부족뿐 아니라 대상 행 부재를 뜻할 수도 있습니다.</text></svg>