<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 515" role="img" aria-labelledby="optimizer-explain-title optimizer-explain-desc"><title id="optimizer-explain-title">EXPLAIN: 실행 계획 트리와 loops</title><desc id="optimizer-explain-desc">PostgreSQL EXPLAIN ANALYZE 예시. Inner Scan의 actual rows 1000은 20회 실행 각각의 평균이며 총 약 20000행이 공급될 수 있다.</desc><defs><marker id="arrow-optimizer-explain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-optimizer-explain)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="515"/><text class="title" x="42" y="48">EXPLAIN: 실행 계획 트리와 loops</text><path class="edge" d="M452 194L278 271"/><path class="edge" d="M650 194L832 271"/><rect class="hi" x="357" y="95" width="389" height="95" rx="4"/><text class="label" x="551.5" y="130" text-anchor="middle">Nested Loop</text><text class="small" x="551.5" y="158" text-anchor="middle">actual rows=20000 · loops=1</text><rect class="panel" x="58" y="278" width="410" height="100" rx="4"/><text class="label" x="263" y="313" text-anchor="middle">Outer: Member Scan</text><text class="small" x="263" y="341" text-anchor="middle">actual rows=20 · loops=1</text><rect class="panel" x="622" y="278" width="420" height="100" rx="4"/><text class="label" x="832" y="313" text-anchor="middle">Inner: Orders Index Scan</text><text class="small" x="832" y="341" text-anchor="middle">actual rows=1000 · loops=20</text><text class="note" x="550" y="430" text-anchor="middle">Inner: 1,000행/회 × 20회 = 약 20,000행</text><text class="note" x="550" y="476" text-anchor="middle">실제 계획은 예시이며 cost는 시간(ms)이 아닙니다.</text></svg>