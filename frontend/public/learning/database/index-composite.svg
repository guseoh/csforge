<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="index-composite-title index-composite-desc"><title id="index-composite-title">복합 B-tree: 키의 사전식 정렬</title><desc id="index-composite-desc">PostgreSQL 16의 member_id, status, created_at DESC 키 예시. 선두 조건으로 연속 구간을 찾는다.</desc><defs><marker id="arrow-index-composite" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-index-composite)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="610"/><text class="title" x="42" y="48">복합 B-tree: 키의 사전식 정렬</text><rect class="panel" x="43" y="110" width="510" height="70" rx="4"/><text class="label" x="298" y="145" text-anchor="middle">(41, CANCELLED, 09-01)</text><text class="small" x="298" y="173" text-anchor="middle">키 1</text><rect class="panel" x="43" y="185" width="510" height="70" rx="4"/><text class="label" x="298" y="220" text-anchor="middle">(41, PAID, 09-03)</text><text class="small" x="298" y="248" text-anchor="middle">키 2</text><rect class="panel" x="43" y="260" width="510" height="70" rx="4"/><text class="label" x="298" y="295" text-anchor="middle">(42, CANCELLED, 09-05)</text><text class="small" x="298" y="323" text-anchor="middle">키 3</text><rect class="hi" x="43" y="335" width="510" height="70" rx="4"/><text class="label" x="298" y="370" text-anchor="middle">(42, PAID, 09-07)</text><text class="small" x="298" y="398" text-anchor="middle">검색 구간</text><rect class="hi" x="43" y="412" width="510" height="70" rx="4"/><text class="label" x="298" y="447" text-anchor="middle">(42, PAID, 09-06)</text><text class="small" x="298" y="475" text-anchor="middle">검색 구간</text><text class="small" x="49" y="88" text-anchor="start">INDEX (member_id, status, created_at DESC)</text><text class="small" x="574" y="183" text-anchor="start">WHERE member_id = 42</text><text class="small" x="574" y="213" text-anchor="start">AND status = 'PAID'</text><text class="small" x="574" y="263" text-anchor="start">선두 동등 조건으로 구간 축소</text><text class="note" x="550" y="555" text-anchor="middle">예시 키의 정렬 관계이며 실제 인덱스 페이지 배치를 뜻하지 않습니다.</text></svg>