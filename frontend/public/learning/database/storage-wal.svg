<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="storage-wal-title storage-wal-desc">
<title id="storage-wal-title">WAL: 두 가지 내구성 경계</title><desc id="storage-wal-desc">PostgreSQL 16 일반 영구 테이블, fsync on, synchronous_commit on, 로컬 커밋 예시. 변경 WAL이 데이터 페이지 기록보다 먼저 내구화되어야 한다. 성공 응답은 커밋 레코드 내구화를 기다린다. 데이터 페이지 쓰기와 커밋 응답은 서로 고정된 순서가 아니다.</desc>
<defs><marker id="storage-wal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker><style>
.bg{fill:#fff}.title{fill:#191919;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#404040;font:19px system-ui,sans-serif}.note{fill:#404040;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#858585;stroke-width:1.5}.hi{fill:#e6e6e6;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#storage-wal-arrow)}.dash{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#363636;stroke:#eee}.line,.edge{stroke:#bbb}}
</style></defs><rect class="bg" width="960" height="465"/><text class="title" x="28" y="43" text-anchor="start">WAL: 데이터 페이지 기록과 커밋 응답의 조건</text><text class="small" x="28" y="80" text-anchor="start">PostgreSQL 16 · fsync=on · synchronous_commit=on · 로컬 커밋</text><rect class="panel" x="28" y="107" width="904" height="59" rx="2"/><text class="label" x="480" y="143" text-anchor="middle">UPDATE: 버퍼 페이지 변경 + 변경 WAL 생성</text><path class="edge" d="M240 166V205"/><path class="edge" d="M720 166V205"/><text class="note" x="28" y="201" text-anchor="start">데이터 페이지 기록 경로</text><text class="note" x="508" y="201" text-anchor="start">커밋 성공 응답 경로</text><rect class="hi" x="28" y="214" width="424" height="60" rx="2"/><text class="label" x="240" y="250" text-anchor="middle">페이지에 필요한 WAL flush</text><rect class="hi" x="508" y="214" width="424" height="60" rx="2"/><text class="label" x="720" y="250" text-anchor="middle">COMMIT 레코드까지 WAL flush</text><path class="edge" d="M240 274V307"/><path class="edge" d="M720 274V307"/><rect class="panel" x="28" y="315" width="424" height="60" rx="2"/><text class="label" x="240" y="351" text-anchor="middle">dirty 데이터 페이지 기록 가능</text><rect class="panel" x="508" y="315" width="424" height="60" rx="2"/><text class="label" x="720" y="351" text-anchor="middle">클라이언트에 성공 반환</text><text class="note" x="28" y="414" text-anchor="start">두 경로 사이의 완료 순서는 고정되어 있지 않습니다.</text><text class="note" x="28" y="443" text-anchor="start">데이터 페이지가 아직 기록되지 않아도 내구화된 WAL로 REDO할 수 있습니다.</text></svg>
