<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="storage-wal-title storage-wal-desc"><title id="storage-wal-title">WAL: 복구 기록이 데이터 파일보다 먼저</title><desc id="storage-wal-desc">PostgreSQL 16, synchronous_commit=on 로컬 커밋 예시. WAL flush는 데이터 파일의 dirty page flush에 앞서야 한다.</desc><defs><marker id="arrow-storage-wal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-storage-wal)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="485"/><text class="title" x="42" y="48">WAL: 복구 기록이 데이터 파일보다 먼저</text><path class="edge" d="M264 223L293 223"/><path class="edge" d="M534 223L564 223"/><path class="edge" d="M806 223L834 223"/><rect class="panel" x="30" y="176" width="230" height="90" rx="4"/><text class="label" x="145" y="211" text-anchor="middle">UPDATE</text><text class="small" x="145" y="239" text-anchor="middle">버퍼 페이지 변경</text><rect class="panel" x="300" y="176" width="230" height="90" rx="4"/><text class="label" x="415" y="211" text-anchor="middle">WAL 생성</text><text class="small" x="415" y="239" text-anchor="middle">복구 기록</text><rect class="hi" x="572" y="176" width="230" height="90" rx="4"/><text class="label" x="687" y="211" text-anchor="middle">WAL flush</text><text class="small" x="687" y="239" text-anchor="middle">영구 저장</text><rect class="panel" x="842" y="176" width="230" height="90" rx="4"/><text class="label" x="957" y="211" text-anchor="middle">COMMIT 응답</text><text class="small" x="957" y="239" text-anchor="middle">성공 반환</text><text class="small" x="52" y="111" text-anchor="start">예시 조건: synchronous_commit = on / 로컬 커밋</text><text class="note" x="550" y="345" text-anchor="middle">데이터 파일 flush는 COMMIT 응답 이후에 실행될 수 있습니다.</text><text class="note" x="550" y="404" text-anchor="middle">장애 시 내구화된 WAL을 REDO하여 복원합니다.</text></svg>