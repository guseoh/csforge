<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="index-partial-title index-partial-desc"><title id="index-partial-title">PostgreSQL 부분 인덱스(Partial Index) 범위와 쿼리 매칭</title><desc id="index-partial-desc">전체 1억 행 중 PAID와 CANCELLED 행은 인덱스에서 제외되고 WHERE status='PENDING' 조건을 만족하는 5만 행만 작은 부분 인덱스에 포함된다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.t{font:600 19px system-ui,sans-serif;fill:var(--fg)}.s{font:400 16px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="38" class="h" text-anchor="middle">부분 인덱스: 관심 행만 인덱싱해 크기와 쓰기 비용 절감</text><rect x="36" y="68" width="380" height="270" rx="6" class="r"/><text x="226" y="100" class="t" text-anchor="middle">orders 전체 테이블 (1억 행)</text><rect x="58" y="120" width="336" height="58" rx="5" class="r"/><text x="76" y="146" class="m">status = 'PAID'</text><text x="376" y="146" class="s" text-anchor="end">99,900,000행</text><text x="76" y="168" class="s">인덱스 대상 아님 (갱신 비용 없음)</text><rect x="58" y="192" width="336" height="58" rx="5" class="r"/><text x="76" y="218" class="m">status = 'CANCELLED'</text><text x="376" y="218" class="s" text-anchor="end">50,000행</text><text x="76" y="240" class="s">인덱스 대상 아님</text><rect x="58" y="264" width="336" height="58" rx="5" class="a"/><text x="76" y="290" class="m">status = 'PENDING'</text><text x="376" y="290" class="t" text-anchor="end">50,000행</text><text x="76" y="312" class="s">조건 일치 → 부분 인덱스 엔트리 생성</text><line x1="394" y1="293" x2="500" y2="293" class="strong" marker-end="url(#arrow)"/><rect x="506" y="68" width="418" height="122" rx="6" class="r"/><text x="715" y="100" class="t" text-anchor="middle">쿼리 조건 매칭 여부</text><text x="528" y="132" class="m">WHERE status = 'PENDING'</text><text x="904" y="132" class="t" text-anchor="end">사용 가능</text><text x="528" y="166" class="m">WHERE member_id = 42</text><text x="904" y="166" class="s" text-anchor="end">조건 미함의</text><line x1="715" y1="190" x2="715" y2="226" class="strong" marker-end="url(#arrow)"/><rect x="506" y="232" width="418" height="106" rx="6" class="a"/><text x="715" y="264" class="m" text-anchor="middle">idx_orders_pending_created</text><text x="715" y="292" class="s" text-anchor="middle">ON orders(created_at, id) WHERE status = 'PENDING'</text><text x="715" y="320" class="s" text-anchor="middle">5만 행만 유지 → 작은 B-tree · 빠른 캐시 적중</text><text x="480" y="392" class="s" text-anchor="middle">옵티마이저가 쿼리 WHERE 절이 인덱스 조건을 함의한다고 판단할 수 있어야 선택된다</text></svg>
