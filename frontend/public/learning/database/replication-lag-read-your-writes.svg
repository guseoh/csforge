<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="replication-lag-title replication-lag-desc"><title id="replication-lag-title">비동기 복제 지연(Replication Lag)과 쓰기 직후 읽기 불일치</title><desc id="replication-lag-desc">Primary에서 로컬 WAL flush 후 커밋 응답이 반환된 뒤 Standby로 WAL이 전송·flush·replay되는 사이 지연 구간에 GET 요청이 Standby로 라우팅되면 이전 상태를 읽게 된다.</desc><style>:root{--bg:#fff;--fg:#191d22;--muted:#4c5560;--line:#8b949e;--soft:#e1e6ea;--panel:#f6f7f9}@media(prefers-color-scheme:dark){:root{--bg:#151719;--fg:#f4f4f5;--muted:#d0d4d9;--line:#88919b;--soft:#303941;--panel:#22272c}}.bg{fill:var(--bg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--panel);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.6}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">WAL 복제 단계별 지연과 쓰기 직후 읽기(Read-After-Write)</text><rect x="36" y="70" width="276" height="122" rx="6" class="a"/><text x="174" y="102" class="m" text-anchor="middle">Primary (쓰기)</text><text x="174" y="132" class="s" text-anchor="middle">1. CANCELLED 변경 · WAL flush</text><text x="174" y="160" class="t" text-anchor="middle">2. 클라이언트 커밋 성공 응답</text><line x1="312" y1="131" x2="366" y2="131" class="strong" marker-end="url(#arrow)"/><text x="339" y="118" class="s" text-anchor="middle">WAL</text><rect x="370" y="70" width="554" height="122" rx="6" class="r"/><text x="647" y="100" class="m" text-anchor="middle">Standby Replica 파이프라인 (비동기)</text><rect x="392" y="118" width="148" height="56" rx="5" class="bg" stroke="var(--line)" stroke-width="1.6"/><text x="466" y="143" class="m" text-anchor="middle">receive/write</text><text x="466" y="164" class="s" text-anchor="middle">네트워크 수신</text><line x1="540" y1="146" x2="570" y2="146" class="l" marker-end="url(#arrow)"/><rect x="574" y="118" width="140" height="56" rx="5" class="bg" stroke="var(--line)" stroke-width="1.6"/><text x="644" y="143" class="m" text-anchor="middle">flush</text><text x="644" y="164" class="s" text-anchor="middle">디스크 기록</text><line x1="714" y1="146" x2="744" y2="146" class="l" marker-end="url(#arrow)"/><rect x="748" y="118" width="156" height="56" rx="5" class="a"/><text x="826" y="143" class="m" text-anchor="middle">replay 완료</text><text x="826" y="164" class="s" text-anchor="middle">새 스냅샷 가시</text><rect x="36" y="238" width="440" height="114" rx="6" class="a"/><text x="256" y="270" class="t" text-anchor="middle">replay 전 즉시 GET /orders/42 → Replica</text><text x="256" y="300" class="m" text-anchor="middle">반환: PAID (이전 상태 노출)</text><text x="256" y="328" class="s" text-anchor="middle">사용자는 취소가 반영되지 않았다고 오해</text><rect x="504" y="238" width="420" height="114" rx="6" class="r"/><text x="714" y="270" class="t" text-anchor="middle">백엔드 완화 전략</text><text x="714" y="300" class="s" text-anchor="middle">• 쓰기 직후 짧은 구간 Primary 라우팅</text><text x="714" y="328" class="s" text-anchor="middle">• 커밋 LSN 도달 대기 또는 지연 임계치 폴백</text><text x="480" y="396" class="s" text-anchor="middle">복제 지연은 sent / write / flush / replay 위치 차이를 단계별로 관측해 병목을 좁힌다</text></svg>
