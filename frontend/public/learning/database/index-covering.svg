<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" role="img" aria-labelledby="index-covering-title index-covering-desc">
<title id="index-covering-title">Index-only scan: 인덱스 값과 가시성 확인</title><desc id="index-covering-desc">PostgreSQL 16 B-tree INCLUDE 예시. 인덱스에 필요한 컬럼이 있어도 visibility map에서 힙 페이지가 all-visible인지 확인한다. 설정된 페이지는 힙 접근 없이 반환하고 설정되지 않은 페이지는 힙에서 가시성을 검사한다.</desc>
<defs><marker id="index-covering-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker><style>
.bg{fill:#fff}.title{fill:#191919;font:700 26px system-ui,sans-serif}.label{fill:#202020;font:600 21px system-ui,sans-serif}.small{fill:#404040;font:19px system-ui,sans-serif}.note{fill:#404040;font:18px system-ui,sans-serif}.panel{fill:#fafafa;stroke:#858585;stroke-width:1.5}.hi{fill:#e6e6e6;stroke:#333;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:1.5}.edge{fill:none;stroke:#555;stroke-width:2;marker-end:url(#index-covering-arrow)}.dash{stroke-dasharray:7 5}
@media(prefers-color-scheme:dark){.bg{fill:#171717}.title,.label{fill:#f4f4f4}.small,.note{fill:#d4d4d4}.panel{fill:#242424;stroke:#999}.hi{fill:#363636;stroke:#eee}.line,.edge{stroke:#bbb}}
</style></defs><rect class="bg" width="960" height="466"/><text class="title" x="28" y="43" text-anchor="start">Index-only scan: 값과 가시성은 별개</text><text class="small" x="28" y="80" text-anchor="start">INDEX (member_id, created_at) INCLUDE (status, total_amount)</text><rect class="panel" x="28" y="102" width="904" height="75" rx="2"/><text class="label" x="48" y="132" text-anchor="start">탐색 키: member_id, created_at</text><text class="small" x="48" y="159" text-anchor="start">반환 값: status, total_amount  |  TID: (페이지, 슬롯)</text><path class="edge" d="M240 177V210"/><path class="edge" d="M720 177V210"/><rect class="hi" x="28" y="218" width="424" height="65" rx="2"/><rect class="panel" x="508" y="218" width="424" height="65" rx="2"/><text class="label" x="240" y="245" text-anchor="middle">페이지 7 · all-visible = 1</text><text class="small" x="240" y="270" text-anchor="middle">Visibility Map</text><text class="label" x="720" y="245" text-anchor="middle">페이지 8 · all-visible = 0</text><text class="small" x="720" y="270" text-anchor="middle">Visibility Map</text><path class="edge" d="M240 283V363"/><path class="edge" d="M720 283V310"/><rect class="panel" x="508" y="316" width="424" height="43" rx="2"/><text class="small" x="720" y="344" text-anchor="middle">힙에서 스냅샷 가시성 확인</text><path class="edge" d="M720 359V371"/><rect class="hi" x="28" y="371" width="424" height="48" rx="2"/><rect class="panel" x="508" y="371" width="424" height="48" rx="2"/><text class="label" x="240" y="401" text-anchor="middle">인덱스 값 반환 · 힙 접근 없음</text><text class="label" x="720" y="401" text-anchor="middle">보이는 행만 반환 · 힙 접근</text><text class="note" x="28" y="450" text-anchor="start">전제: B-tree가 필요한 컬럼을 모두 보유하고 Index Only Scan이 선택됨</text></svg>
