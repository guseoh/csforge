<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="locking-row-lock-title locking-row-lock-desc"><title id="locking-row-lock-title">행 잠금: 일반 SELECT와 잠금 읽기 구분</title><desc id="locking-row-lock-desc">PostgreSQL 16 READ COMMITTED 예시. T1이 특정 행을 UPDATE하고 잠금을 보유하는 동안 같은 행의 T2 SELECT FOR UPDATE는 기다리고 일반 T3 SELECT는 이전 커밋 버전을 읽을 수 있다.</desc><defs><marker id="arrow-locking-row-lock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-locking-row-lock)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="485"/><text class="title" x="42" y="48">행 잠금: 일반 SELECT와 잠금 읽기 구분</text><path d="M362 192L376 192" class="edge"/><rect class="panel" x="24" y="139" width="333" height="102" rx="4"/><text class="label" x="190.5" y="175" text-anchor="middle">T1: UPDATE id=10</text><text class="small" x="190.5" y="205" text-anchor="middle">잠금 보유 · 미커밋</text><rect class="accent" x="382" y="139" width="333" height="102" rx="4"/><text class="label" x="548.5" y="175" text-anchor="middle">T2: SELECT FOR UPDATE</text><text class="small" x="548.5" y="205" text-anchor="middle">T1 종료까지 대기</text><rect class="panel" x="740" y="139" width="333" height="102" rx="4"/><text class="label" x="906.5" y="175" text-anchor="middle">T3: 일반 SELECT</text><text class="small" x="906.5" y="205" text-anchor="middle">이전 커밋 버전 읽기</text><text class="note" x="550" y="309" text-anchor="middle">T1 COMMIT 이후 T2는 잠금을 얻고 갱신된 행을 확인할 수 있습니다.</text><text class="note" x="550" y="364" text-anchor="middle">T3의 SELECT는 T1 COMMIT 전에 시작했다고 가정합니다.</text><text class="note" x="550" y="411" text-anchor="middle">FOR UPDATE의 행 잠금과 일반 MVCC SELECT는 목적이 다릅니다.</text></svg>