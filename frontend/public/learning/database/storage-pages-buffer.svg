<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="storage-pages-buffer-title storage-pages-buffer-desc"><title id="storage-pages-buffer-title">데이터 페이지와 공유 버퍼</title><desc id="storage-pages-buffer-desc">PostgreSQL에서 페이지가 shared_buffers에 캐시되고, 변경된 페이지가 dirty가 되는 흐름. 관련 WAL flush가 데이터 페이지 기록보다 먼저 일어난다.</desc><defs><marker id="arrow-storage-pages-buffer" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-storage-pages-buffer)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="460"/><text class="title" x="42" y="48">데이터 페이지와 공유 버퍼</text><path class="edge" d="M350 211L393 211"/><path class="edge" d="M707 211L752 211"/><rect class="panel" x="40" y="160" width="304" height="105" rx="4"/><text class="label" x="192" y="195" text-anchor="middle">데이터 파일</text><text class="small" x="192" y="223" text-anchor="middle">테이블 · 인덱스 페이지</text><rect class="panel" x="398" y="160" width="304" height="105" rx="4"/><text class="label" x="550" y="195" text-anchor="middle">shared_buffers</text><text class="small" x="550" y="223" text-anchor="middle">읽어 온 페이지</text><rect class="hi" x="756" y="160" width="304" height="105" rx="4"/><text class="label" x="908" y="195" text-anchor="middle">dirty buffer</text><text class="small" x="908" y="223" text-anchor="middle">UPDATE 뒤 변경됨</text><text class="note" x="550" y="340" text-anchor="middle">dirty 데이터 페이지 디스크 기록보다 WAL flush가 먼저입니다.</text><text class="note" x="550" y="397" text-anchor="middle">shared read는 물리 디스크 접근 횟수와 같지 않습니다.</text></svg>