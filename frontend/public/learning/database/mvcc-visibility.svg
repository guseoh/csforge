<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="mvcc-visibility-title mvcc-visibility-desc"><title id="mvcc-visibility-title">스냅샷 유지 기간: RC vs RR</title><desc id="mvcc-visibility-desc">PostgreSQL 16에서 두 SELECT 사이에 T2가 커밋하는 경우. RC는 새 스냅샷을, RR은 첫 쿼리의 스냅샷을 유지한다.</desc><defs><marker id="arrow-mvcc-visibility" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-mvcc-visibility)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="510"/><text class="title" x="42" y="48">스냅샷 유지 기간: RC vs RR</text><path class="edge" d="M277 270L299 270"/><path class="edge" d="M796 270L818 270"/><rect class="panel" x="38" y="110" width="500" height="70" rx="4"/><text class="label" x="288" y="145" text-anchor="middle">READ COMMITTED</text><text class="small" x="288" y="173" text-anchor="middle">문장마다 스냅샷</text><rect class="panel" x="562" y="110" width="500" height="70" rx="4"/><text class="label" x="812" y="145" text-anchor="middle">REPEATABLE READ</text><text class="small" x="812" y="173" text-anchor="middle">첫 쿼리 스냅샷 유지</text><rect class="panel" x="57" y="225" width="218" height="88" rx="4"/><text class="label" x="166" y="260" text-anchor="middle">SELECT #1</text><text class="small" x="166" y="288" text-anchor="middle">100 · S1</text><rect class="hi" x="304" y="225" width="218" height="88" rx="4"/><text class="label" x="413" y="260" text-anchor="middle">SELECT #2</text><text class="small" x="413" y="288" text-anchor="middle">200 · S2</text><rect class="panel" x="578" y="225" width="216" height="88" rx="4"/><text class="label" x="686" y="260" text-anchor="middle">SELECT #1</text><text class="small" x="686" y="288" text-anchor="middle">100 · S1</text><rect class="hi" x="823" y="225" width="217" height="88" rx="4"/><text class="label" x="931.5" y="260" text-anchor="middle">SELECT #2</text><text class="small" x="931.5" y="288" text-anchor="middle">100 · S1</text><text class="note" x="550" y="372" text-anchor="middle">공통: 두 SELECT 사이에 T2가 UPDATE 100→200 후 COMMIT</text><text class="note" x="550" y="429" text-anchor="middle">RR 기준점은 BEGIN 자체가 아닌 첫 비제어 SQL 문 시점입니다.</text></svg>