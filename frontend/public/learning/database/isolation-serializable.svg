<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="isolation-serializable-title isolation-serializable-desc"><title id="isolation-serializable-title">SERIALIZABLE: 쓰기 편향을 중단</title><desc id="isolation-serializable-desc">PostgreSQL 16 SSI 예시. 두 트랜잭션이 당직자 수 2명을 읽고 각각 한 명을 해제하면 직렬화 불가능한 결과가 될 수 있어 하나가 serialization_failure로 중단된다.</desc><defs><marker id="arrow-isolation-serializable" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.accent{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-isolation-serializable)}@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.accent{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}</style></defs><rect class="bg" width="1100" height="485"/><text class="title" x="42" y="48">SERIALIZABLE: 쓰기 편향을 중단</text><path d="M295 237L456 290" class="edge"/><path d="M810 237L646 290" class="edge"/><rect class="panel" x="53" y="136" width="470" height="95" rx="4"/><text class="label" x="288" y="172" text-anchor="middle">T1: 당직 2명 확인</text><text class="small" x="288" y="202" text-anchor="middle">A 해제 시도</text><rect class="panel" x="576" y="136" width="470" height="95" rx="4"/><text class="label" x="811" y="172" text-anchor="middle">T2: 당직 2명 확인</text><text class="small" x="811" y="202" text-anchor="middle">B 해제 시도</text><rect class="accent" x="308" y="295" width="483" height="90" rx="4"/><text class="label" x="549.5" y="331" text-anchor="middle">SSI 충돌 감지</text><text class="small" x="549.5" y="361" text-anchor="middle">한 트랜잭션 abort · 전체 재시도</text><text class="note" x="550" y="99" text-anchor="middle">같은 읽기 상태에서 서로 다른 행을 UPDATE</text><text class="note" x="550" y="424" text-anchor="middle">PostgreSQL은 최종 당직 0명으로 이어지는 직렬화 불가능한 실행을 막습니다.</text></svg>