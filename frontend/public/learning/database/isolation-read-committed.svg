<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="isolation-read-committed-title isolation-read-committed-desc"><title id="isolation-read-committed-title">READ COMMITTED: 문장별 스냅샷</title><desc id="isolation-read-committed-desc">PostgreSQL 16에서 T1의 SELECT 1은 가격 100, T2 커밋 후 SELECT 2는 가격 200을 볼 수 있다.</desc><defs><marker id="arrow-isolation-read-committed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#707782"/></marker><style>
.bg{fill:#fff}.title{fill:#191d22;font:700 27px system-ui,sans-serif}.label{fill:#20262d;font:600 19px system-ui,sans-serif}.small{fill:#4c5560;font:15px system-ui,sans-serif}.note{fill:#343d47;font:500 16px system-ui,sans-serif}.panel{fill:#f6f7f9;stroke:#8b949e;stroke-width:1.6}.hi{fill:#e1e6ea;stroke:#374450;stroke-width:2}.edge{fill:none;stroke:#596573;stroke-width:2.5;marker-end:url(#arrow-isolation-read-committed)}
@media(prefers-color-scheme:dark){.bg{fill:#151719}.title,.label{fill:#f4f4f5}.small,.note{fill:#d0d4d9}.panel{fill:#22272c;stroke:#88919b}.hi{fill:#303941;stroke:#f4f5f6}.edge{stroke:#cbd2d9}}
</style></defs><rect class="bg" width="1100" height="470"/><text class="title" x="42" y="48">READ COMMITTED: 문장별 스냅샷</text><path class="edge" d="M410 198L750 198"/><path class="edge" d="M581 268L581 252"/><rect class="panel" x="155" y="152" width="252" height="97" rx="4"/><text class="label" x="281" y="187" text-anchor="middle">T1: SELECT #1</text><text class="small" x="281" y="215" text-anchor="middle">S1 → price 100</text><rect class="panel" x="457" y="274" width="248" height="96" rx="4"/><text class="label" x="581" y="309" text-anchor="middle">T2: UPDATE/COMMIT</text><text class="small" x="581" y="337" text-anchor="middle">price 100 → 200</text><rect class="hi" x="755" y="152" width="302" height="97" rx="4"/><text class="label" x="906" y="187" text-anchor="middle">T1: SELECT #2</text><text class="small" x="906" y="215" text-anchor="middle">S2 → price 200</text><text class="small" x="49" y="88" text-anchor="start">시간 순서 →</text><text class="note" x="550" y="424" text-anchor="middle">두 SELECT는 같은 T1 안에 있지만 스냅샷은 서로 다릅니다.</text></svg>