<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="nested-span-overlap-title nested-span-overlap-desc"><title id="nested-span-overlap-title">부모·자식 Span 중첩과 병렬 구간</title><desc id="nested-span-overlap-desc">부모200ms, 자식 DB25~175ms=150ms, 병렬 자식100~170ms=70ms. 전체는200ms로 단순 합계420ms 아님.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="480" y="32" class="h" text-anchor="middle">Span 포함 관계 · 시간을 단순 합산하면 안 되는 이유</text><text x="35" y="105" class="m" text-anchor="start">HTTP parent</text><rect x="230" y="75" width="640" height="50" class="a"/><text x="550" y="105" class="m" text-anchor="middle">200 ms</text><text x="35" y="187" class="m" text-anchor="start">DB child</text><rect x="310" y="157" width="480" height="50" class="r"/><text x="550" y="187" class="m" text-anchor="middle">150 ms</text><text x="35" y="269" class="m" text-anchor="start">병렬 child</text><rect x="550" y="239" width="224" height="50" class="r"/><text x="662" y="269" class="m" text-anchor="middle">70 ms</text><line x1="230" y1="300" x2="230" y2="311" class="l"/><text x="230" y="332" class="s" text-anchor="middle">0</text><line x1="310" y1="300" x2="310" y2="311" class="l"/><text x="310" y="332" class="s" text-anchor="middle">25</text><line x1="550" y1="300" x2="550" y2="311" class="l"/><text x="550" y="332" class="s" text-anchor="middle">100</text><line x1="774" y1="300" x2="774" y2="311" class="l"/><text x="774" y="346" class="s" text-anchor="middle">170</text><line x1="790" y1="300" x2="790" y2="311" class="l"/><text x="790" y="332" class="s" text-anchor="middle">175</text><line x1="870" y1="300" x2="870" y2="311" class="l"/><text x="870" y="332" class="s" text-anchor="middle">200</text><text x="480" y="385" class="h" text-anchor="middle">전체 200ms · 자식들의 겹침과 부모 포함 관계를 확인</text><text x="480" y="418" class="s" text-anchor="middle">Trace 1건은 서비스 p99 전체의 분포를 대표하지 않음</text></svg>
