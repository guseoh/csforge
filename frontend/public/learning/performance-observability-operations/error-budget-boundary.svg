<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="error-budget-boundary-title error-budget-boundary-desc"><title id="error-budget-boundary-title">SLO 오류 예산 · 남음·소진·초과</title><desc id="error-budget-boundary-desc">유효 요청100000, SLO99.9% 허용 실패100. 실패60 예산40, 실패100 경계, 실패101 성공률99.899% 위반.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="465"/><text x="480" y="32" class="h" text-anchor="middle">30일 · 100,000 유효 요청 · SLO 99.9% 가정</text><text x="480" y="75" class="m" text-anchor="middle">허용 실패 = 100,000 × 0.001 = 100건</text><text x="35" y="151" class="m" text-anchor="start">실패 60건</text><rect x="245" y="119" width="650" height="55" class="r"/><rect x="245" y="119" width="390" height="55" class="a"/><text x="440" y="152" class="m" text-anchor="middle">사용 60</text><text x="765" y="152" class="m" text-anchor="middle">남은 40</text><text x="35" y="250" class="m" text-anchor="start">실패 100건</text><rect x="245" y="218" width="650" height="55" class="a"/><text x="570" y="251" class="m" text-anchor="middle">예산 소진 · 99.9% 경계</text><text x="35" y="349" class="m" text-anchor="start">실패 101건</text><rect x="245" y="317" width="650" height="55" class="a"/><line x1="895" y1="344" x2="925" y2="344" class="strong" marker-end="url(#arr)"/><text x="570" y="350" class="m" text-anchor="middle">100 + 초과 1건</text><text x="480" y="411" class="h" text-anchor="middle">101건 실패 → 99.899% · SLO 위반</text><text x="480" y="444" class="s" text-anchor="middle">기간 종료 또는 고정된 분모의 예 · 진행 중에는 유효 요청 수가 변함</text></svg>
