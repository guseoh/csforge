<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="incident-parallel-workstreams-title incident-parallel-workstreams-desc"><title id="incident-parallel-workstreams-title">장애 대응 · 조정·실행·근거 보존</title><desc id="incident-parallel-workstreams-desc">탐지 선언 완화 복구 확인 후속 개선. 지휘 상황 공유, 실행 완화와 복구 검증, 증거 보존 및 사후 분석은 겹칠 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="435"/><text x="480" y="32" class="h" text-anchor="middle">장애 대응 · 사용자 영향과 원인 분석의 시간축</text><line x1="195" y1="75" x2="915" y2="75" class="l" marker-end="url(#arr)"/><text x="140" y="81" class="s" text-anchor="middle">시간</text><line x1="195" y1="62" x2="195" y2="375" class="d"/><text x="195" y="112" class="s" text-anchor="middle">탐지</text><line x1="340" y1="62" x2="340" y2="375" class="d"/><text x="340" y="112" class="s" text-anchor="middle">선언</text><line x1="535" y1="62" x2="535" y2="375" class="d"/><text x="535" y="112" class="s" text-anchor="middle">완화</text><line x1="705" y1="62" x2="705" y2="375" class="d"/><text x="705" y="112" class="s" text-anchor="middle">복구 확인</text><line x1="890" y1="62" x2="890" y2="375" class="d"/><text x="890" y="112" class="s" text-anchor="middle">후속 개선</text><text x="35" y="181" class="m" text-anchor="start">조정</text><rect x="340" y="150" width="365" height="50" class="a"/><text x="522" y="181" class="m" text-anchor="middle">지휘 · 상황 공유</text><text x="35" y="255" class="m" text-anchor="start">실행</text><rect x="340" y="225" width="195" height="50" class="r"/><text x="437" y="256" class="m" text-anchor="middle">안전 조치</text><rect x="535" y="225" width="170" height="50" class="a"/><text x="620" y="256" class="m" text-anchor="middle">복구 검증</text><text x="35" y="327" class="m" text-anchor="start">증거</text><rect x="195" y="297" width="695" height="50" class="r"/><text x="542" y="328" class="m" text-anchor="middle">관측 · 타임라인 · 가설 검증 및 사후 분석</text><text x="480" y="412" class="s" text-anchor="middle">완화가 근본 원인 확정을 기다릴 필요는 없음 · 복구 후 조치 검증</text></svg>
