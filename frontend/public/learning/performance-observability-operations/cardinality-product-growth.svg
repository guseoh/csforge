<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="cardinality-product-growth-title cardinality-product-growth-desc"><title id="cardinality-product-growth-title">레이블 조합 · 시계열 수의 증가</title><desc id="cardinality-product-growth-desc">route100, status5, region4, version3의 최대 조합 100,500,2000,6000. 관측 실제 조합은 더 적을 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="495"/><text x="480" y="32" class="h" text-anchor="middle">레이블 조합의 곱 · 최대 시계열 수</text><text x="35" y="105" class="m" text-anchor="start">route 100</text><rect x="260" y="77" width="9.666666666666666" height="45" class="a"/><text x="281.6666666666667" y="106" class="s" text-anchor="start">100</text><text x="35" y="189" class="m" text-anchor="start">× status 5</text><rect x="260" y="161" width="48.33333333333333" height="45" class="a"/><text x="320.3333333333333" y="190" class="s" text-anchor="start">500</text><text x="35" y="273" class="m" text-anchor="start">× region 4</text><rect x="260" y="245" width="193.33333333333331" height="45" class="a"/><text x="465.3333333333333" y="274" class="s" text-anchor="start">2,000</text><text x="35" y="357" class="m" text-anchor="start">× version 3</text><rect x="260" y="329" width="580" height="45" class="a"/><text x="852" y="358" class="s" text-anchor="start">6,000</text><text x="480" y="443" class="s" text-anchor="middle">조합이 모두 관측된다는 상한 예 · 인스턴스·히스토그램 버킷 등은 추가 비용</text><text x="480" y="472" class="s" text-anchor="middle">사용자 ID·요청 ID는 필요한 로그/Trace로 분리</text></svg>
