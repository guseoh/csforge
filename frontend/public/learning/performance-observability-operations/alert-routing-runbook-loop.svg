<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="alert-runbook-title alert-runbook-desc"><title id="alert-runbook-title">증상 기반 알림 라우팅과 런북 대응 흐름</title><desc id="alert-runbook-desc">SLO 오류 예산 빠른 소진 같은 사용자 영향 신호는 담당자 즉시 호출과 런북 완화 절차로 연결하고, CPU·디스크 추세 같은 원인 후보는 작업 티켓과 용량 계획으로 분리한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.8}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="38" class="h" text-anchor="middle">신호 성격에 따른 알림 라우팅과 런북(Runbook) 연결</text><rect x="36" y="76" width="268" height="96" rx="6" class="a"/><text x="170" y="110" class="t" text-anchor="middle">사용자 영향 · 증상 신호</text><text x="170" y="138" class="s" text-anchor="middle">SLO 오류 예산 빠른 소진</text><text x="170" y="160" class="s" text-anchor="middle">오류율 급증 · p99 임계 초과</text><line x1="304" y1="124" x2="352" y2="124" class="strong" marker-end="url(#arrow)"/><rect x="356" y="76" width="218" height="96" rx="6" class="a"/><text x="465" y="110" class="t" text-anchor="middle">즉시 호출 (Page)</text><text x="465" y="138" class="s" text-anchor="middle">평가 창 + 복구 조건 적용</text><text x="465" y="160" class="s" text-anchor="middle">중복 묶음 · 연쇄 억제</text><line x1="574" y1="124" x2="622" y2="124" class="strong" marker-end="url(#arrow)"/><rect x="626" y="76" width="298" height="96" rx="6" class="r"/><text x="775" y="110" class="t" text-anchor="middle">런북 (Runbook) 실행</text><text x="775" y="138" class="s" text-anchor="middle">영향 범위 질의 → 안전한 완화</text><text x="775" y="160" class="s" text-anchor="middle">(롤백·트래픽 축소·기능 차단)</text><line x1="36" y1="206" x2="924" y2="206" class="d"/><rect x="36" y="236" width="268" height="96" rx="6" class="r"/><text x="170" y="270" class="t" text-anchor="middle">자원 추세 · 원인 후보</text><text x="170" y="298" class="s" text-anchor="middle">단기 CPU 스파이크</text><text x="170" y="320" class="s" text-anchor="middle">디스크·커넥션 점진적 증가</text><line x1="304" y1="284" x2="352" y2="284" class="l" marker-end="url(#arrow)"/><rect x="356" y="236" width="218" height="96" rx="6" class="r"/><text x="465" y="270" class="t" text-anchor="middle">티켓 · 대시보드</text><text x="465" y="298" class="s" text-anchor="middle">비긴급 업무 시간 처리</text><text x="465" y="320" class="s" text-anchor="middle">알림 피로(Fatigue) 방지</text><line x1="574" y1="284" x2="622" y2="284" class="l" marker-end="url(#arrow)"/><rect x="626" y="236" width="298" height="96" rx="6" class="r"/><text x="775" y="270" class="t" text-anchor="middle">용량 계획 · 원인 개선</text><text x="775" y="298" class="s" text-anchor="middle">쿼리 튜닝 · 풀·인스턴스 증설</text><text x="775" y="320" class="s" text-anchor="middle">장애 훈련 후 런북 최신화</text><text x="480" y="388" class="s" text-anchor="middle">모든 경고를 즉시 호출하면 실제 장애가 묻히므로 증상(Page)과 추세(Ticket)의 경로를 분리한다</text></svg>
