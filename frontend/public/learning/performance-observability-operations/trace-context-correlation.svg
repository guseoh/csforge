<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="trace-context-correlation-title trace-context-correlation-desc"><title id="trace-context-correlation-title">추적 문맥 · 서비스 경계와 관측 신호</title><desc id="trace-context-correlation-desc">Service A trace T1 span S1을 전달, B가 동일 trace에 새 span S2 parent S1을 생성. metrics 집계, trace와 logs 상관관계.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="32" class="h" text-anchor="middle">같은 Trace ID · 서로 다른 Span ID</text><rect x="45" y="65" width="365" height="155" class="r"/><text x="227" y="96" class="h" text-anchor="middle">Service A</text><text x="227" y="132" class="m" text-anchor="middle">trace T1 / span S1</text><text x="227" y="169" class="s" text-anchor="middle">resource: service.name=A</text><rect x="550" y="65" width="365" height="155" class="r"/><text x="732" y="96" class="h" text-anchor="middle">Service B</text><text x="732" y="132" class="m" text-anchor="middle">trace T1 / span S2</text><text x="732" y="169" class="m" text-anchor="middle">parent: S1</text><line x1="410" y1="120" x2="550" y2="120" class="strong" marker-end="url(#arr)"/><text x="480" y="104" class="s" text-anchor="middle">HTTP</text><text x="480" y="245" class="s" text-anchor="middle">traceparent로 전달한 문맥: T1 / S1 (축약 표기)</text><rect x="45" y="280" width="365" height="72" class="r"/><text x="227" y="308" class="h" text-anchor="middle">Metrics</text><text x="227" y="335" class="s" text-anchor="middle">경로별 오류율 · 전체 추세</text><rect x="550" y="280" width="365" height="72" class="r"/><text x="732" y="308" class="h" text-anchor="middle">Logs</text><text x="732" y="335" class="s" text-anchor="middle">trace T1 · 사건 상세</text><text x="480" y="397" class="s" text-anchor="middle">추적 문맥 전파 ≠ 모든 리소스/Span 속성 전파</text></svg>
