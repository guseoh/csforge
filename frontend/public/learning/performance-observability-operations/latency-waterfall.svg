<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="latency-waterfall-title latency-waterfall-desc"><title id="latency-waterfall-title">요청 지연 분해 · 연결 풀 대기와 SQL 실행</title><desc id="latency-waterfall-desc">client 280ms server250ms, server 순차 구간 준비15, pool170, SQL12, mapping18, 외부35. 미계측 차이30ms.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="445"/><text x="480" y="32" class="h" text-anchor="middle">한 요청의 지연 시간 · 실제 길이에 비례하는 구간</text><text x="35" y="101" class="m" text-anchor="start">클라이언트</text><rect x="230" y="72" width="672" height="46" class="a"/><text x="566" y="101" class="m" text-anchor="middle">280 ms</text><text x="35" y="166" class="m" text-anchor="start">서버</text><rect x="266" y="137" width="600" height="46" class="r"/><text x="566" y="166" class="m" text-anchor="middle">250 ms</text><text x="35" y="231" class="m" text-anchor="start">내부 순차 구간</text><rect x="266" y="202" width="36" height="50" class="r"/><line x1="284" y1="252" x2="284" y2="273" class="l"/><text x="284" y="292" class="s" text-anchor="middle">준비 15</text><rect x="302" y="202" width="408" height="50" class="a"/><text x="506" y="232" class="m" text-anchor="middle">풀 대기 170 ms</text><rect x="710" y="202" width="28.799999999999997" height="50" class="r"/><line x1="724.4" y1="252" x2="724.4" y2="273" class="l"/><text x="724.4" y="292" class="s" text-anchor="middle">SQL 12</text><rect x="738.8" y="202" width="43.199999999999996" height="50" class="r"/><line x1="760.4" y1="252" x2="760.4" y2="311" class="l"/><text x="760.4" y="330" class="s" text-anchor="middle">매핑 18</text><rect x="782" y="202" width="84" height="50" class="r"/><line x1="824" y1="252" x2="824" y2="273" class="l"/><text x="824" y="292" class="s" text-anchor="middle">외부 35</text><text x="480" y="382" class="m" text-anchor="middle">15 + 170 + 12 + 18 + 35 = 250 ms · 미계측 구간 합계 30 ms</text><text x="480" y="420" class="s" text-anchor="middle">앞뒤 15ms 배치는 예시이며 실제 미계측 구간의 원인은 측정해야 알 수 있음</text></svg>
