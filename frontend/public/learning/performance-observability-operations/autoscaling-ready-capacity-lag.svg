<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="autoscaling-ready-capacity-lag-title autoscaling-ready-capacity-lag-desc"><title id="autoscaling-ready-capacity-lag-title">자동 확장 · 수요와 준비된 처리 용량</title><desc id="autoscaling-ready-capacity-lag-desc">수요가 급증한 뒤 관측 결정 Pod 시작 및 준비까지 기존 처리 용량이 유지되어 부족 구간 발생. 준비 완료 이후 용량 증가.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="480"/><text x="480" y="32" class="h" text-anchor="middle">자동 확장 · 수요 증가와 실제 준비 용량 사이의 지연</text><line x1="155" y1="350" x2="155" y2="80" class="l" marker-end="url(#arr)"/><line x1="155" y1="350" x2="915" y2="350" class="l" marker-end="url(#arr)"/><text x="95" y="80" class="s" text-anchor="middle">처리량</text><text x="905" y="380" class="s" text-anchor="middle">시간</text><path d="M155 295 H300 V135 H890" class="strong"/><path d="M155 275 H690 V110 H890" class="d"/><text x="850" y="127" class="s" text-anchor="middle">수요</text><text x="850" y="100" class="s" text-anchor="middle">준비 용량</text><rect x="300" y="135" width="390" height="140" class="r"/><text x="495" y="185" class="h" text-anchor="middle">용량 부족 구간</text><text x="495" y="219" class="s" text-anchor="middle">대기·거절·지연 증가 가능</text><line x1="300" y1="70" x2="300" y2="350" class="d"/><text x="300" y="380" class="s" text-anchor="middle">급증</text><line x1="410" y1="70" x2="410" y2="350" class="d"/><text x="410" y="405" class="s" text-anchor="middle">메트릭 관측</text><line x1="520" y1="70" x2="520" y2="350" class="d"/><text x="520" y="380" class="s" text-anchor="middle">확장 결정</text><line x1="690" y1="70" x2="690" y2="350" class="d"/><text x="690" y="405" class="s" text-anchor="middle">Pod 준비</text><text x="480" y="454" class="s" text-anchor="middle">새 인스턴스 생성 ≠ 준비 완료 · 하위 DB/API 용량도 확인</text></svg>
