<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="same-mean-different-tail-title same-mean-different-tail-desc"><title id="same-mean-different-tail-title">평균은 같아도 꼬리는 다르다</title><desc id="same-mean-different-tail-desc">A 100건 모두100ms, B 90건50ms 10건550ms. 평균 둘 다100, nearest-rank A p50 p95 p99 100, B p50 50 p95 p99 550.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="490"/><text x="480" y="32" class="h" text-anchor="middle">같은 평균 100ms · 다른 꼬리 지연 (100개 표본씩)</text><text x="230" y="77" class="h" text-anchor="middle">A: 일정한 응답</text><line x1="55" y1="300" x2="425" y2="300" class="l" marker-end="url(#arr)"/><line x1="55" y1="300" x2="55" y2="108" class="l" marker-end="url(#arr)"/><rect x="104" y="120" width="28" height="180" class="a"/><text x="118" y="110" class="s" text-anchor="middle">100건</text><text x="55" y="326" class="s" text-anchor="middle">0</text><text x="118" y="326" class="s" text-anchor="middle">100</text><text x="244" y="326" class="s" text-anchor="middle">300</text><text x="401.5" y="326" class="s" text-anchor="middle">550</text><text x="230" y="351" class="s" text-anchor="middle">지연 시간 (ms)</text><text x="230" y="389" class="s" text-anchor="middle">p50 = p95 = p99 = 100ms</text><text x="730" y="77" class="h" text-anchor="middle">B: 일부 느린 응답</text><line x1="555" y1="300" x2="925" y2="300" class="l" marker-end="url(#arr)"/><line x1="555" y1="300" x2="555" y2="108" class="l" marker-end="url(#arr)"/><rect x="572.5" y="138" width="28" height="162" class="a"/><text x="586.5" y="128" class="s" text-anchor="middle">90건</text><rect x="887.5" y="282" width="28" height="18" class="a"/><text x="901.5" y="272" class="s" text-anchor="middle">10건</text><text x="555" y="326" class="s" text-anchor="middle">0</text><text x="618" y="326" class="s" text-anchor="middle">100</text><text x="744" y="326" class="s" text-anchor="middle">300</text><text x="901.5" y="326" class="s" text-anchor="middle">550</text><text x="730" y="351" class="s" text-anchor="middle">지연 시간 (ms)</text><text x="730" y="389" class="s" text-anchor="middle">p50 = 50 · p95 = p99 = 550ms</text><line x1="480" y1="60" x2="480" y2="405" class="d"/><text x="480" y="437" class="m" text-anchor="middle">A: 100×100 / 100 = 100 · B: (90×50 + 10×550) / 100 = 100</text><text x="480" y="466" class="s" text-anchor="middle">nearest-rank 백분위수 · 집계 히스토그램은 버킷 해상도에 따라 근사</text></svg>
