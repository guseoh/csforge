<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="prof-jmh-load-title prof-jmh-load-desc"><title id="prof-jmh-load-title">프로파일러·JMH·부하 테스트의 질문 범위 비교</title><desc id="prof-jmh-load-desc">프로파일러와 JFR은 실행 중 CPU·할당·락 병목 위치를, JMH는 격리된 코드 조각 비용을, 부하 테스트는 목표 트래픽에서 서비스 전체 p99·처리량·포화를 검증한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18.5px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.8}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">질문 범위에 따른 성능 실험 도구 선택</text><rect x="36" y="70" width="276" height="270" rx="6" class="r"/><text x="174" y="106" class="t" text-anchor="middle">1. 프로파일러 · JFR</text><text x="174" y="136" class="m" text-anchor="middle">"어디서 시간이 쓰이나?"</text><line x1="60" y1="154" x2="288" y2="154" class="l"/><text x="174" y="186" class="s" text-anchor="middle">• CPU · 객체 할당 · 락 · GC</text><text x="174" y="216" class="s" text-anchor="middle">• 실행 중 프로세스 이벤트 기록</text><text x="174" y="246" class="s" text-anchor="middle">• 원인 코드 경로 특정</text><rect x="58" y="274" width="232" height="46" rx="5" class="a"/><text x="174" y="303" class="s" text-anchor="middle">한계: 전체 처리 용량 증명 불가</text><rect x="342" y="70" width="276" height="270" rx="6" class="r"/><text x="480" y="106" class="t" text-anchor="middle">2. JMH 마이크로벤치마크</text><text x="480" y="136" class="m" text-anchor="middle">"코드 조각 자체가 빠른가?"</text><line x1="366" y1="154" x2="594" y2="154" class="l"/><text x="480" y="186" class="s" text-anchor="middle">• 워밍업 · fork · Blackhole</text><text x="480" y="216" class="s" text-anchor="middle">• JIT 최적화 왜곡 통제</text><text x="480" y="246" class="s" text-anchor="middle">• 작은 알고리즘·파서 비교</text><rect x="364" y="274" width="232" height="46" rx="5" class="a"/><text x="480" y="303" class="s" text-anchor="middle">한계: DB·네트워크·풀 I/O 제외</text><rect x="648" y="70" width="276" height="270" rx="6" class="a"/><text x="786" y="106" class="t" text-anchor="middle">3. 부하 테스트 (k6 등)</text><text x="786" y="136" class="m" text-anchor="middle">"목표 부하를 견디나?"</text><line x1="672" y1="154" x2="900" y2="154" class="l"/><text x="786" y="186" class="s" text-anchor="middle">• p95/p99 · RPS · 오류율</text><text x="786" y="216" class="s" text-anchor="middle">• 캐시·데이터·워밍업 조건 고정</text><text x="786" y="246" class="s" text-anchor="middle">• 변경 전후 동일 부하 비교</text><rect x="670" y="274" width="232" height="46" rx="5" class="r"/><text x="786" y="303" class="s" text-anchor="middle">한계: 내부 코드 원인은 JFR 보완</text><text x="480" y="394" class="s" text-anchor="middle">부하 테스트로 증상·용량을 측정하고, 프로파일러(JFR)로 원인을 좁힌 뒤, 동일 부하로 개선을 재검증한다</text></svg>
