<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="merged-quantile-distribution-title merged-quantile-distribution-desc"><title id="merged-quantile-distribution-title">인스턴스별 백분위수 평균과 전체 분포 비교</title><desc id="merged-quantile-distribution-desc">A 100건 10ms, B 900건 100ms. p95 평균55ms는 전체 p95가 아니다. 전체 1000건 중 950번째는100ms다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="480" y="32" class="h" text-anchor="middle">p95의 평균 55ms ≠ 전체 p95 100ms</text><text x="35" y="100" class="m" text-anchor="start">A: 100건</text><rect x="250" y="68" width="65" height="48" class="a"/><text x="282" y="98" class="s" text-anchor="middle">100</text><text x="350" y="98" class="s" text-anchor="start">모두 10ms · p95=10</text><text x="35" y="175" class="m" text-anchor="start">B: 900건</text><rect x="250" y="143" width="585" height="48" class="a"/><text x="542" y="173" class="m" text-anchor="middle">900건 모두 100ms · p95=100</text><text x="35" y="270" class="m" text-anchor="start">전체 1,000건</text><rect x="250" y="238" width="65" height="48" class="r"/><rect x="315" y="238" width="585" height="48" class="a"/><text x="282" y="268" class="s" text-anchor="middle">100</text><text x="607" y="268" class="m" text-anchor="middle">900건</text><line x1="867.5" y1="222" x2="867.5" y2="296" class="strong"/><text x="867" y="214" class="s" text-anchor="middle">950번째</text><text x="282" y="313" class="s" text-anchor="middle">10ms</text><text x="607" y="313" class="s" text-anchor="middle">100ms</text><text x="480" y="361" class="h" text-anchor="middle">정렬된 원시 표본을 합쳐 nearest-rank로 다시 계산</text><text x="480" y="399" class="s" text-anchor="middle">히스토그램은 같은 버킷 경계를 사용해 관측 수를 합산한 뒤 추정</text></svg>
