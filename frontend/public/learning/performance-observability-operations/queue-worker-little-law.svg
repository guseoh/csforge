<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="queue-worker-little-law-title queue-worker-little-law-desc"><title id="queue-worker-little-law-title">대기열과 작업자 · Little의 법칙</title><desc id="queue-worker-little-law-desc">순간 대기열6건 실행3건을 표현. 별도의 안정 구간 예시 평균 L120, 처리율40/s, 평균 체류3초.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="455"/><text x="480" y="32" class="h" text-anchor="middle">제한된 작업자 · 처리 중 작업과 대기 중 작업</text><text x="35" y="92" class="m" text-anchor="start">유입</text><line x1="95" y1="84" x2="180" y2="84" class="l" marker-end="url(#arr)"/><rect x="180" y="60" width="64" height="48" class="r"/><text x="212" y="90" class="m" text-anchor="middle">Q1</text><rect x="250" y="60" width="64" height="48" class="r"/><text x="282" y="90" class="m" text-anchor="middle">Q2</text><rect x="320" y="60" width="64" height="48" class="r"/><text x="352" y="90" class="m" text-anchor="middle">Q3</text><rect x="390" y="60" width="64" height="48" class="r"/><text x="422" y="90" class="m" text-anchor="middle">Q4</text><rect x="460" y="60" width="64" height="48" class="r"/><text x="492" y="90" class="m" text-anchor="middle">Q5</text><rect x="530" y="60" width="64" height="48" class="a"/><text x="562" y="90" class="m" text-anchor="middle">Q6</text><text x="387" y="138" class="s" text-anchor="middle">대기열: 6건</text><line x1="600" y1="84" x2="690" y2="84" class="l" marker-end="url(#arr)"/><rect x="690" y="45" width="225" height="168" class="r"/><text x="802" y="74" class="h" text-anchor="middle">작업자 3개</text><rect x="715" y="85" width="175" height="34" class="a"/><text x="802.5" y="108" class="m" text-anchor="middle">실행 1</text><rect x="715" y="124" width="175" height="34" class="a"/><text x="802.5" y="147" class="m" text-anchor="middle">실행 2</text><rect x="715" y="163" width="175" height="34" class="a"/><text x="802.5" y="186" class="m" text-anchor="middle">실행 3</text><text x="480" y="255" class="h" text-anchor="middle">유입 > 완료 → 대기열 증가 · 한 요청의 시간 = 대기 + 실행</text><rect x="45" y="293" width="870" height="96" class="r"/><text x="480" y="325" class="m" text-anchor="middle">안정 구간 예: L = 120건, λ = 40건/s</text><text x="480" y="365" class="h" text-anchor="middle">W = L / λ = 3초</text><text x="480" y="430" class="s" text-anchor="middle">같은 관측 경계 · 장기적으로 유입과 완료가 균형인 조건에서 적용</text></svg>
