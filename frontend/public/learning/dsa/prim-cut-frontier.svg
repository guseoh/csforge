<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="prim-cut-frontier-title prim-cut-frontier-desc"><title id="prim-cut-frontier-title">Prim · 현재 컷의 최소 간선</title><desc id="prim-cut-frontier-desc">무방향 연결 그래프 A-B=1,A-C=4,B-C=2,B-D=5,C-D=3. A,B 포함 상태에서 최소 frontier B-C=2 선택.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="32" class="h" text-anchor="middle">현재 T = {A, B} · 컷을 가로지르는 간선</text><rect x="80" y="55" width="400" height="230" class="d"/><line x1="210" y1="155" x2="345" y2="155" class="a"/><line x1="209.79444666585061" y1="151.80071655924507" x2="625.2055533341494" y2="98.19928344075493" class="l"/><line x1="394.44506035193524" y1="149.76177278172815" x2="625.5549396480648" y2="100.23822721827183" class="a"/><line x1="393.8007140321316" y1="162.65022951032802" x2="626.1992859678684" y2="237.34977048967198" class="l"/><line x1="650" y1="120" x2="650" y2="220" class="l"/><circle cx="185" cy="155" r="25" class="l"/><text x="185" y="162" class="m" text-anchor="middle">A</text><circle cx="370" cy="155" r="25" class="l"/><text x="370" y="162" class="m" text-anchor="middle">B</text><circle cx="650" cy="95" r="25" class="l"/><text x="650" y="102" class="m" text-anchor="middle">C</text><circle cx="650" cy="245" r="25" class="l"/><text x="650" y="252" class="m" text-anchor="middle">D</text><text x="278" y="140" class="m" text-anchor="middle">1</text><text x="380" y="101" class="m" text-anchor="middle">4</text><text x="535" y="110" class="m" text-anchor="middle">2</text><text x="525" y="218" class="m" text-anchor="middle">5</text><text x="670" y="175" class="m" text-anchor="start">3</text><text x="270" y="265" class="s" text-anchor="middle">T 내부</text><text x="800" y="150" class="s" text-anchor="middle">T 외부</text><text x="480" y="325" class="t" text-anchor="middle">후보 4, 2, 5 중 2 선택 → C 추가</text></svg>
