<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="interval-exchange-proof-title interval-exchange-proof-desc"><title id="interval-exchange-proof-title">교환 논증 · 첫 구간만 교체해도 가능한 해</title><desc id="interval-exchange-proof-desc">반열린 구간 최적해 o=[2,5), 다음 [5,7),[8,10). g=[1,4)로 바꾸어도 뒤 구간들이 유지되어 개수는 동일.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="30" class="h" text-anchor="middle">반열린 구간 · 종료 시각이 빠른 g로 교체</text><text x="145" y="80" class="m" text-anchor="middle">OPT</text><rect x="344" y="50" width="186" height="45" class="a"/><text x="437" y="79.5" class="m" text-anchor="middle">o</text><rect x="530" y="50" width="124" height="45" class="l"/><text x="592" y="79.5" class="m" text-anchor="middle">2</text><rect x="716" y="50" width="124" height="45" class="l"/><text x="778" y="79.5" class="m" text-anchor="middle">3</text><text x="145" y="170" class="m" text-anchor="middle">OPT′</text><rect x="282" y="140" width="186" height="45" class="a"/><text x="375" y="169.5" class="m" text-anchor="middle">g</text><rect x="530" y="140" width="124" height="45" class="l"/><text x="592" y="169.5" class="m" text-anchor="middle">2</text><rect x="716" y="140" width="124" height="45" class="l"/><text x="778" y="169.5" class="m" text-anchor="middle">3</text><text x="220" y="235" class="s" text-anchor="middle">0</text><text x="282" y="235" class="s" text-anchor="middle">1</text><text x="344" y="235" class="s" text-anchor="middle">2</text><text x="406" y="235" class="s" text-anchor="middle">3</text><text x="468" y="235" class="s" text-anchor="middle">4</text><text x="530" y="235" class="s" text-anchor="middle">5</text><text x="592" y="235" class="s" text-anchor="middle">6</text><text x="654" y="235" class="s" text-anchor="middle">7</text><text x="716" y="235" class="s" text-anchor="middle">8</text><text x="778" y="235" class="s" text-anchor="middle">9</text><text x="840" y="235" class="s" text-anchor="middle">10</text><line x1="220" y1="210" x2="840" y2="210" class="l"/><text x="480" y="270" class="s" text-anchor="middle">선택 개수 3 유지 · 뒤 두 구간의 위치도 동일</text></svg>
