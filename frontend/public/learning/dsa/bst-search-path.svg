<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="bst-search-path-title bst-search-path-desc"><title id="bst-search-path-title">BST · 키 10의 탐색 경로</title><desc id="bst-search-path-desc">서로 다른 키를 저장한 BST에서 8, 12, 10만 방문한다. 8의 왼쪽과 12의 오른쪽을 제외한다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="32" class="h" text-anchor="middle">목표 키 = 10</text><line x1="458.1512045408975" y1="99.93127066322842" x2="281.8487954591025" y2="180.06872933677158" class="l"/><line x1="501.8487954591025" y1="99.93127066322842" x2="678.1512045408975" y2="180.06872933677158" class="a"/><line x1="242.24143823849735" y1="206.1441470559115" x2="167.75856176150265" y2="273.8558529440885" class="l"/><line x1="276.0551535589388" y1="207.83905950993199" x2="333.9448464410612" y2="272.160940490068" class="l"/><line x1="683.0294372515228" y1="206.97056274847714" x2="616.9705627484772" y2="273.02943725152284" class="a"/><line x1="717.7585617615026" y1="206.1441470559115" x2="792.2414382384974" y2="273.8558529440885" class="l"/><circle cx="480" cy="90" r="24" class="a"/><text x="480" y="97" class="m" text-anchor="middle">8</text><circle cx="260" cy="190" r="24" class="l"/><text x="260" y="197" class="m" text-anchor="middle">3</text><circle cx="700" cy="190" r="24" class="a"/><text x="700" y="197" class="m" text-anchor="middle">12</text><circle cx="150" cy="290" r="24" class="l"/><tex