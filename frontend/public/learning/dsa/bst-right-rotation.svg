"/><line x1="785.2654252756419" y1="198.94445321703182" x2="744.7345747243581" y2="251.05554678296818" class="l"/><line x1="814.7345747243581" y1="198.94445321703182" x2="855.2654252756419" y2="251.05554678296818" class="l"/><circle cx="700" cy="95" r="24" class="a"/><text x="700" y="102" class="m" text-anchor="middle">x</text><circle cx="600" cy="180" r="24" class="l"/><text x="600" y="187" class="m" text-anchor="middle">A</text><circle cx="800" cy="180" r="24" class="a"/><text x="800" y="187" class="m" text-anchor="middle">y</text><circle cx="730" cy="270" r="24" class="l"/><text x="730" y="277" class="m" text-anchor="middle">B</text><circle cx="870" cy="270" r="24" class="l"/><text x="870" y="277" class="m" text-anchor="middle">C</text><line x1="410" y1="180" x2="550" y2="180" class="a"/><path d="M 541.1300507722071 184.61779175541483 L 550 180 L 541.1300507722071 175.38220824458517" class="a"/><text x="480" y="150" class="s" text-anchor="middle">우회전</text><text x="480" y="330" class="t" text-anchor="middle">중위 순회: A → x → B → y → C (전후 동일)</text></svg>
