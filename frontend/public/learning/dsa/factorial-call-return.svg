<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="factorial-call-return-title factorial-call-return-desc"><title id="factorial-call-return-title">재귀 · 호출 상태와 반환값</title><desc id="factorial-call-return-desc">factorial(4), (3), (2), (1)을 내려가고 1,2,6,24 순서로 반환한다. 각 호출의 n이 별도로 보존된다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="275" y="30" class="h" text-anchor="middle">호출</text><text x="690" y="30" class="h" text-anchor="middle">반환</text><rect x="150" y="48" width="250" height="45" class="l"/><text x="275" y="77.5" class="m" text-anchor="middle">factorial(4)</text><line x1="275" y1="95" x2="275" y2="110" class="l"/><path d="M 269.7263190753538 100.3465918192059 L 275 110 L 280.2736809246462 100.3465918192059" class="l"/><rect x="560" y="48" width="260" height="45" class="l"/><text x="690" y="77.5" class="m" text-anchor="middle">4 × 6 = 24</text><line x1="690" y1="111" x2="690" y2="95" class="l"/><path d="M 695.2736809246462 104.6534081807941 L 690 95 L 684.7263190753538 104.6534081807941" class="l"/><rect x="150" y="113" width="250" height="45" class="l"/><text x="275" y="142.5" class="m" text-anchor="middle">factorial(3)</text><line x1="275" y1="160" x2="275" y2="175" class="l"/><path d="M 269.7263190753538 165.3465918192059 L 275 175 L 280.2736809246462 165.3465918192059" class="l"/><rect x="560" y="113" width="260" height="45" class="l"/><text x="690" y="142.5" class="m" text-anchor="middle">3 × 2 = 6</text><line x1="690" y1="176" x2="690" y2="160" class="l"/><path d="M 695.2736809246462 169.6534081807941 L 690 160 L 684.7263190753538 169.6534081807941" class="l"/><rect x="150" y="178" width="250" height="45" class="l"/><text x="275" y="207.5" class="m" text-anchor="middle">factorial(2)</text><line x1="275" y1="225" x2="275" y2="240" class="l"/><path d="M 269.7263190753538 230.3465918192059 L 275 240 L 280.2736809246462 230.3465918192059" class="l"/><rect x="560" y="178" width="260" height="45" class="l"/><text x="690" y="207.5" class="m" text-anchor="middle">2 × 1 = 2</text><line x1="690" y1="241" x2="690" y2="225" class="l"/><path d="M 695.2736809246462 234.6534081807941 L 690 225 L 684.7263190753538 234.6534081807941" class="l"/><rect x="150" y="243" width="250" height="45" class="l"/><text x="275" y="272.5" class="m" text-anchor="middle">factorial(1)</text><rect x="560" y="243" width="260" height="45" class="l"/><text x="690" y="272.5" class="m" text-anchor="middle">기저: 1</text><line x1="410" y1="265" x2="550" y2="265" class="l"/><path d="M 540.3465918192059 270.2736809246462 L 550 265 L 540.3465918192059 259.7263190753538" class="l"/><text x="480" y="317" class="s" text-anchor="middle">각 호출은 자신의 n을 보존 · factorial(1) = 1 가정</text></svg>
