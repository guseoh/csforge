<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="bfs-parent-path-title bfs-parent-path-desc"><title id="bfs-parent-path-title">BFS · 거리와 부모를 이용한 경로 복원</title><desc id="bfs-parent-path-desc">A-B,A-C,B-D,C-D 무방향 그래프. B를 먼저 발견하면 D의 부모 B. 거리 A0 B1 C1 D2, 복원 D→B→A.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="250" y="32" class="h" text-anchor="middle">최초 발견 거리</text><line x1="230.83941605839416" y1="98.05839416058394" x2="164.16058394160584" y2="153.94160583941607" class="a"/><line x1="269.16058394160586" y1="98.05839416058394" x2="335.83941605839414" y2="153.94160583941607" class="l"/><line x1="163.98141505913242" y1="186.2697843363992" x2="231.01858494086758" y2="243.7302156636008" class="a"/><line x1="336.0185849408676" y1="186.2697843363992" x2="268.9814150591324" y2="243.7302156636008" class="l"/><circle cx="250" cy="82" r="25" class="a"/><text x="250" y="89" class="m" text-anchor="middle">A</text><circle cx="145" cy="170" r="25" class="a"/><text x="145" y="177" class="m" text-anchor="middle">B</text><circle cx="355" cy="170" r="25" class="l"/><text x="355" y="177" class="m" text-anchor="middle">C</text><circle cx="250" cy="260" r="25" class="a"/><text x="250" y="267" class="m" text-anchor="middle">D</text><text x="75" y="90" class="s" text-anchor="middle">0</text><text x="75" y="177" class="s" text-anchor="middle">1</text><text x="75" y="267" cl