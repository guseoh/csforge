<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="directed-back-edge-title directed-back-edge-desc"><title id="directed-back-edge-title">방향 그래프 · 현재 경로와 완료 정점의 차이</title><desc id="directed-back-edge-desc">왼쪽 A→B→C→A는 현재 경로로 향하는 간선으로 사이클. 오른쪽 A→B,A→C,C→B에서 B를 먼저 완료하면 C→B는 사이클이 아니다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="240" y="32" class="h" text-anchor="middle">현재 경로로 되돌아감</text><line x1="222.98872251581804" y1="103.31983729065749" x2="127.01127748418195" y2="206.6801627093425" class="l"/><path d="M 129.46959853033457 196.98703846408273 L 127.01127748418195 206.6801627093425 L 136.49599681850643 203.5115511602423" class="l"/><line x1="135" y1="225" x2="345" y2="225" class="l"/><path d="M 336.22417438109625 229.79425538604204 L 345 225 L 336.22417438109625 220.20574461395796" class="l"/><line x1="352.98872251581804" y1="206.6801627093425" x2="257.01127748418196" y2="103.31983729065749" class="a"/><path d="M 266.49599681850646 106.4884488397577 L 257.01127748418196 103.31983729065749 L 259.46959853033457 113.01296153591727" class="a"/><circle cx="240" cy="85" r="25" class="a"/><text x="240" y="92" class="m" text-anchor="middle">A</text><circle cx="110" cy="225" r="25" class="a"/><text x="110" y="232" class="m" text-anchor="middle">B</text><circle cx="370" cy="225" r="25" class="a"/><text x="370" y="232" class="m" text-anchor="middle">C</text><text x="240" y="300" class="s" text-anchor="middle">A → B → C → A : 사이클</text><text x="720" y="32" class="h" text-anchor="middle">이미 완료된 정점으로 향함</text><line x1="702.988722515818" y1="103.31983729065749" x2="607.011277484182" y2="206.6801627093425" class="l"/><path d="M 609.4695985303346 196.98703846408273 L 607.011277484182 206.6801627093425 L 616.4959968185065 203.5115511602423" class="l"/><line x1="737.011277484182" y1="103.31983729065747" x2="832.988722515818" y2="206.6801627093425" class="l"/><path d="M 823.5040031814935 203.5115511602423 L 832.988722515818 206.6801627093425 L 830.5304014696654 196.98703846408273" class="l"/><line x1="825" y1="225" x2="615" y2="225" class="d"/><path d="M 623.7758256189037 220.20574461395796 L 615 225 L 623.7758256189037 229.79425538604204" class="d"/><circle cx="720" cy="85" r="25" class="a"/><text x="720" y="92" class="m" text-anchor="middle">A</text><circle cx="590" cy="225" r="25" class="l"/><text x="590" y="232" class="m" text-anchor="middle">B</text><circle cx="850" cy="225" r="25" class="a"/><text x="850" y="232" class="m" text-anchor="middle">C</text><text x="590" y="270" class="s" text-anchor="middle">완료</text><text x="850" y="270" class="s" text-anchor="middle">진행 중</text><text x="720" y="300" class="s" text-anchor="middle">C → B만으로는 사이클 아님</text></svg>
