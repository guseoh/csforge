<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="graph-edge-semantics-title graph-edge-semantics-desc"><title id="graph-edge-semantics-title">그래프 · 간선의 방향과 가중치</title><desc id="graph-edge-semantics-desc">무방향 A-B, 방향 A→B, 가중 방향 A→B 비용 5를 비교한다. 각 그래프의 C는 고립 정점.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="170" y="32" class="h" text-anchor="middle">무방향</text><line x1="105" y1="100" x2="235" y2="100" class="l"/><circle cx="80" cy="100" r="25" class="l"/><text x="80" y="107" class="m" text-anchor="middle">A</text><circle cx="260" cy="100" r="25" class="l"/><text x="260" y="107" class="m" text-anchor="middle">B</text><circle cx="170" cy="185" r="25" class="l"/><text x="170" y="192" class="m" text-anchor="middle">C</text><text x="170" y="240" class="s" text-anchor="middle">양방향 이동</text><text x="480" y="32" class="h" text-anchor="middle">방향</text><line x1="415" y1="100" x2="545" y2="100" class="l"/><path d="M 536.2241743810963 104.79425538604202 L 545 100 L 536.2241743810963 95.20574461395798" class="l"/><circle cx="390" cy="100" r="25" class="l"/><text x="390" y="107" class="m" text-anchor="middle">A</text><circle cx="570" cy="100" r="25" class="l"/><text x="570" y="107" class="m" text-anchor="middle">B</text><circle cx="480" cy="185" r="25" class="l"/><text x="480" y="192" class="m" text-anchor="middle">C</text><text x="480" y="240" class="s" text-anchor="middle">A → B만</text><text x="790" y="32" class="h" text-anchor="middle">가중 방향</text><line x1="725" y1="100" x2="855" y2="100" class="l"/><path d="M 846.2241743810963 104.79425538604202 L 855 100 L 846.2241743810963 95.20574461395798" class="l"/><circle cx="700" cy="100" r="25" class="l"/><text x="700" y="107" class="m" text-anchor="middle">A</text><circle cx="880" cy="100" r="25" class="l"/><text x="880" y="107" class="m" text-anchor="middle">B</text><circle cx="790" cy="185" r="25" class="l"/><text x="790" y="192" class="m" text-anchor="middle">C</text><text x="790" y="85" class="m" text-anchor="middle">5</text><text x="790" y="240" class="s" text-anchor="middle">A → B 비용 5</text></svg>
