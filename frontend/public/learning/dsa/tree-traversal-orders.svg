<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="tree-traversal-orders-title tree-traversal-orders-desc"><title id="tree-traversal-orders-title">이진 트리 순회 · 방문 시점만 바뀐다</title><desc id="tree-traversal-orders-desc">루트 A, 자식 B/C, B의 자식 D/E인 트리에서 preorder, inorder, postorder, level order의 결과를 비교한다.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><rect x="445" y="104" width="70" height="52" rx="7" class="p"/><text x="480" y="137" class="m" text-anchor="middle">A</text><rect x="265" y="204" width="70" height="52" rx="7" class="p"/><text x="300" y="237" class="m" text-anchor="middle">B</text><rect x="625" y="204" width="70" height="52" rx="7" class="p"/><text x="660" y="237" class="m" text-anchor="middle">C</text><rect x="175" y="304" width="70" height="52" rx="7" class="p"/><text x="210" y="337" class="m" text-anchor="middle">D</text><rect x="355" y="304" width="70" height="52" rx="7" class="p"/><text x="390" y="337" class="m" text-anchor="middle">E</text><line x1="480" y1="156" x2="300" y2="204" class="l"/><line x1="480" y1="156" x2="660" y2="204" class="l"/><line x1="300" y1="256" x2="210" y2="304" class="l"/><line x1="300" y1="256" x2="390" y2="304" class="l"/><text x="30" y="400" class="m" text-anchor="start">Preorder  A B D E C</text><text x="510" y="400" class="m" text-anchor="start">Inorder  D B E A C</text><text x="30" y="432" class="m" text-anchor="start">Postorder  D E B C A</text><text x="510" y="432" class="m" text-anchor="start">Level order  A B C D E</text></svg>
