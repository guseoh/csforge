<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="dijkstra-relaxation-title dijkstra-relaxation-desc"><title id="dijkstra-relaxation-title">다익스트라 · 잠정 거리와 확정 순서</title><desc id="dijkstra-relaxation-desc">방향 간선 A→B=5, A→C=2, C→B=1, B→D=2, C→D=6. A에서 시작하여 A,C,B,D 순서로 확정하며 최종 거리는 0,3,2,5이다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:7 5}</style><text x="220" y="32" class="h" text-anchor="middle">음수 없는 방향 그래프</text><line x1="65" y1="170" x2="170" y2="90" class="l"/><path d="M 165.74314239200172 99.04871058799137 L 170 90 L 160.1459796662699 91.70243451046835" class="l"/><text x="103" y="110" class="m" text-anchor="middle">5</text><line x1="65" y1="200" x2="170" y2="270" class="l"/><path d="M 160.05826614139738 268.9220724121193 L 170 270 L 165.1812461271091 261.23760243355173" class="l"/><text x="100" y="256" class="m" text-anchor="middle">2</text><line x1="200" y1="245" x2="200" y2="115" class="l"/><path d="M 204.61779175541483 123.86994922779284 L 200 115 L 195.38220824458517 123.86994922779284" class="l"/><text x="217" y="180" class="m" text-anchor="start">1</text><line x1="222" y1="90" x2="365" y2="166" class="l"/><path d="M 355.00036161909975 165.91495735642286 L 365 166 L 359.3346737516209 157.75960689654755" class="l"/><text x="300" y="110" class="m" text-anchor="middle">2</text><line x1="222" y1="270" x2="365" y2="205" class="l"/><path d="M 358.83595139078244 212.87429392029554 L 365 205 L 355.0142397416617 204.46652829222984" class="l"/><text x="300" y="260" class="m" text-anchor="middle">6</text><circle cx="45" cy="185" r="24" class="a"/><text x="45" y="192" class="m" text-anchor="middle">A</text><circle cx="200" cy="85" r="24" class="l"/><text x="200" y="92" class="m" text-anchor="middle">B</text><circle cx="200" cy="275" r="24" class="l"/><text x="200" y="282" class="m" text-anchor="middle">C</text><circle cx="385" cy="185" r="24" class="l"/><text x="385" y="192" class="m" text-anchor="middle">D</text><text x="700" y="32" class="h" text-anchor="middle">dist[A, B, C, D]</text><text x="565" y="66" class="s" text-anchor="middle">A</text><text x="650" y="66" class="s" text-anchor="middle">B</text><text x="735" y="66" class="s" text-anchor="middle">C</text><text x="820" y="66" class="s" text-anchor="middle">D</text><text x="510" y="101" class="s" text-anchor="end">초기</text><rect x="523" y="76" width="85" height="45" class="l"/><text x="565.5" y="105.5" class="m" text-anchor="middle">0</text><rect x="608" y="76" width="85" height="45" class="l"/><text x="650.5" y="105.5" class="m" text-anchor="middle">∞</text><rect x="693" y="76" width="85" height="45" class="l"/><text x="735.5" y="105.5" class="m" text-anchor="middle">∞</text><rect x="778" y="76" width="85" height="45" class="l"/><text x="820.5" y="105.5" class="m" text-anchor="middle">∞</text><text x="510" y="153" class="s" text-anchor="end">A 확정</text><rect x="523" y="128" width="85" height="45" class="a"/><text x="565.5" y="157.5" class="m" text-anchor="middle">0</text><rect x="608" y="128" width="85" height="45" class="l"/><text x="650.5" y="157.5" class="m" text-anchor="middle">5</text><rect x="693" y="128" width="85" height="45" class="l"/><text x="735.5" y="157.5" class="m" text-anchor="middle">2</text><rect x="778" y="128" width="85" height="45" class="l"/><text x="820.5" y="157.5" class="m" text-anchor="middle">∞</text><text x="510" y="205" class="s" text-anchor="end">C 확정</text><rect x="523" y="180" width="85" height="45" class="a"/><text x="565.5" y="209.5" class="m" text-anchor="middle">0</text><rect x="608" y="180" width="85" height="45" class="l"/><text x="650.5" y="209.5" class="m" text-anchor="middle">3</text><rect x="693" y="180" width="85" height="45" class="a"/><text x="735.5" y="209.5" class="m" text-anchor="middle">2</text><rect x="778" y="180" width="85" height="45" class="l"/><text x="820.5" y="209.5" class="m" text-anchor="middle">8</text><text x="510" y="257" class="s" text-anchor="end">B 확정</text><rect x="523" y="232" width="85" height="45" class="a"/><text x="565.5" y="261.5" class="m" text-anchor="middle">0</text><rect x="608" y="232" width="85" height="45" class="a"/><text x="650.5" y="261.5" class="m" text-anchor="middle">3</text><rect x="693" y="232" width="85" height="45" class="a"/><text x="735.5" y="261.5" class="m" text-anchor="middle">2</text><rect x="778" y="232" width="85" height="45" class="l"/><text x="820.5" y="261.5" class="m" text-anchor="middle">5</text><text x="510" y="309" class="s" text-anchor="end">D 확정</text><rect x="523" y="284" width="85" height="45" class="a"/><text x="565.5" y="313.5" class="m" text-anchor="middle">0</text><rect x="608" y="284" width="85" height="45" class="a"/><text x="650.5" y="313.5" class="m" text-anchor="middle">3</text><rect x="693" y="284" width="85" height="45" class="a"/><text x="735.5" y="313.5" class="m" text-anchor="middle">2</text><rect x="778" y="284" width="85" height="45" class="a"/><text x="820.5" y="313.5" class="m" text-anchor="middle">5</text><text x="480" y="350" class="s" text-anchor="middle">굵은 칸: 거리 확정 · B는 5 → 3, D는 8 → 5로 완화</text></svg>
