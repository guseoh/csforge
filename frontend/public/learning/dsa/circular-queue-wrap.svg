<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="circular-queue-wrap-title circular-queue-wrap-desc"><title id="circular-queue-wrap-title">원형 큐 · 물리 배열과 논리 FIFO 순서</title><desc id="circular-queue-wrap-desc">capacity 5, front 3, size 4. 인덱스 3부터 4,0,1 순서로 읽는다. 다음 enqueue 위치 rear는 2.</desc><style>.canvas{fill:#fff}.h{font:700 27px system-ui,sans-serif;fill:#4a4a4a}.b{font:700 22px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 19px system-ui,sans-serif;fill:#4a4a4a}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#4a4a4a}.p{fill:none;stroke:#4a4a4a;stroke-width:2}.v{fill:none;stroke:#4a4a4a;stroke-width:3.5}.n{fill:none;stroke:#4a4a4a;stroke-width:2.5}.l{stroke:#4a4a4a;stroke-width:2;fill:none}.d{stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#4a4a4a}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.h{fill:#c8c8c8}.b{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.p{stroke:#c8c8c8}.v{stroke:#c8c8c8}.n{stroke:#c8c8c8}.l{stroke:#c8c8c8}.d{stroke:#c8c8c8}.arrow{fill:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="30" y="38" class="b" text-anchor="start">물리 배열 · capacity=5 · size=4</text><rect x="70" y="118" width="170" height="68" rx="5" class="p"/><text x="155" y="160" class="m" text-anchor="middle">D</text><text x="155" y="105" class="s" text-anchor="middle">0</text><rect x="240" y="118" width="170" height="68" rx="5" class="p"/><text x="325" y="160" class="m" text-anchor="middle">E</text><text x="325" y="105" class="s" text-anchor="middle">1</text><rect x="410" y="118" width="170" height="68" rx="5" class="p"/><text x="495" y="160" class="m" text-anchor="middle">_</text><text x="495" y="105" class="s" text-anchor="middle">2</text><rect x="580" y="118" width="170" height="68" rx="5" class="v"/><text x="665" y="160" class="m" text-anchor="middle">B</text><text x="665" y="105" class="s" text-anchor="middle">3</text><rect x="750" y="118" width="170" height="68" rx="5" class="p"/><text x="835" y="160" class="m" text-anchor="middle">C</text><text x="835" y="105" class="s" text-anchor="middle">4</text><line x1="665" y1="60" x2="665" y2="84" class="l"/><polygon class="arrow" points="665,84 660,75 670,75"/><text x="665" y="52" class="s" text-anchor="middle">front=3</text><line x1="495" y1="204" x2="495" y2="187" class="l"/><polygon class="arrow" points="495,187 490,196 500,196"/><text x="495" y="228" class="s" text-anchor="middle">rear=2 · 다음 enqueue</text><text x="30" y="286" class="b" text-anchor="start">논리 FIFO 순서</text><text x="260" y="286" class="m" text-anchor="start">B  →  C  →  D  →  E</text><text x="30" y="326" class="s" text-anchor="start">다음 인덱스 = (현재 인덱스 + 1) % capacity</text></svg>
