<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="interval-earliest-finish-title interval-earliest-finish-desc"><title id="interval-earliest-finish-title">구간 스케줄링 · 가장 빨리 끝나는 선택</title><desc id="interval-earliest-finish-desc">반열린 구간 A=[1,10), B=[2,3), C=[3,4), D=[4,5). B,C,D 선택으로 3개, A 선택은 1개.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="32" class="h" text-anchor="middle">목표: 겹치지 않는 구간의 개수 최대화</text><text x="145" y="80" class="m" text-anchor="middle">A</text><rect x="282" y="54" width="558" height="39" class="l"/><text x="561" y="80.5" class="m" text-anchor="middle">A</text><text x="145" y="129" class="m" text-anchor="middle">B</text><rect x="344" y="103" width="62" height="39" class="a"/><text x="375" y="129.5" class="m" text-anchor="middle">B</text><text x="145" y="178" class="m" text-anchor="middle">C</text><rect x="406" y="152" width="62" height="39" class="a"/><text x="437" y="178.5" class="m" text-anchor="middle">C</text><text x="145" y="227" class="m" text-anchor="middle">D</text><rect x="468" y="201" width="62" height="39" class="a"/><text x="499" y="227.5" class="m" text-anchor="middle">D</text><line x1="220" y1="253" x2="840" y2="253" class="l"/><text x="220" y="278" class="s" text-anchor="middle">0</text><text x="282" y="278" class="s" text-anchor="middle">1</text><text x="344" y="278" class="s" text-anchor="middle">2</text><text x="406" y="278" class="s" text-anchor="middle">3</text><text x="468" y="278" class="s" text-anchor="middle">4</text><text x="530" y="278" class="s" text-anchor="middle">5</text><text x="592" y="278" class="s" text-anchor="middle">6</text><text x="654" y="278" class="s" text-anchor="middle">7</text><text x="716" y="278" class="s" text-anchor="middle">8</text><text x="778" y="278" class="s" text-anchor="middle">9</text><text x="840" y="278" class="s" text-anchor="middle">10</text><text x="760" y="165" class="t" text-anchor="middle">B → C → D : 3개</text></svg>
