<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="chaining-bucket-lookup-title chaining-bucket-lookup-desc"><title id="chaining-bucket-lookup-title">분리 연결법 · 버킷 내부 키 비교</title><desc id="chaining-bucket-lookup-desc">버킷 0에 K1, 1에 K2,K7,K9, 2는 비어 있다. K9 조회는 버킷 1을 찾고 내부 키를 비교한다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="120" y="33" class="h" text-anchor="middle">버킷</text><text x="580" y="33" class="h" text-anchor="middle">버킷 내부 연결 리스트 예시</text><rect x="80" y="60" width="85" height="50" class="l"/><text x="122.5" y="92" class="m" text-anchor="middle">0</text><rect x="80" y="135" width="85" height="50" class="a"/><text x="122.5" y="167" class="m" text-anchor="middle">1</text><rect x="80" y="210" width="85" height="50" class="l"/><text x="122.5" y="242" class="m" text-anchor="middle">2</text><line x1="165" y1="85" x2="295" y2="85" class="l"/><path d="M 285.3465918192059 90.27368092464623 L 295 85 L 285.3465918192059 79.72631907535377" class="l"/><rect x="305" y="60" width="90" height="50" class="l"/><text x="350" y="92" class="m" text-anchor="middle">K1</text><line x1="165" y1="160" x2="295" y2="160" class="a"/><path d="M 285.3465918192059 165.27368092464624 L 295 160 L 285.3465918192059 154.72631907535376" class="a"/><rect x="305" y="135" width="90" height="50" class="l"/><text x="350" y="167" class="m" text-anchor="middle">K2</text><line x1="395" y1="160" x2="485" y2="160" class="l"/><path d="M 475.3465918192059 165.27368092464624 L 485 160 L 475.3465918192059 154.72631907535376" class="l"/><rect x="495" y="135" width="90" height="50" class="l"/><text x="540" y="167" class="m" text-anchor="middle">K7</text><line x1="585" y1="160" x2="675" y2="160" class="l"/><path d="M 665.3465918192059 165.27368092464624 L 675 160 L 665.3465918192059 154.72631907535376" class="l"/><rect x="685" y="135" width="90" height="50" class="a"/><text x="730" y="167" class="m" text-anchor="middle">K9</text><line x1="165" y1="235" x2="295" y2="235" class="l"/><path d="M 285.3465918192059 240.27368092464624 L 295 235 L 285.3465918192059 229.72631907535376" class="l"/><text x="350" y="242" class="s" text-anchor="middle">비어 있음</text><text x="595" y="275" class="s" text-anchor="middle">조회 K9: 버킷 1 → K2 → K7 → K9</text></svg>
