<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="bfs-queue-layers-title bfs-queue-layers-desc"><title id="bfs-queue-layers-title">BFS · 거리 계층과 FIFO 큐</title><desc id="bfs-queue-layers-desc">무방향 그래프 A-B,A-C,B-D,C-D에서 A부터 탐색한다. B를 먼저 발견한다고 가정한다. D는 B에서 큐에 넣고 C에서는 중복 삽입하지 않는다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:7 5}</style><text x="220" y="36" class="h" text-anchor="middle">거리 계층</text><line x1="220" y1="86" x2="130" y2="162" class="l"/><line x1="220" y1="86" x2="310" y2="162" class="l"/><line x1="130" y1="162" x2="220" y2="252" class="l"/><line x1="310" y1="162" x2="220" y2="252" class="l"/><circle cx="220" cy="70" r="24" class="a"/><text x="220" y="77" class="m" text-anchor="middle">A</text><circle cx="130" cy="170" r="24" class="l"/><text x="130" y="177" class="m" text-anchor="middle">B</text><circle cx="310" cy="170" r="24" class="l"/><text x="310" y="177" class="m" text-anchor="middle">C</text><circle cx="220" cy="260" r="24" class="l"/><text x="220" y="267" class="m" text-anchor="middle">D</text><text x="55" y="77" class="s" text-anchor="middle">0</text><text x="55" y="177" class="s" text-anchor="middle">1</text><text x="55" y="267" class="s" text-anchor="middle">2</text><text x="710" y="36" class="h" text-anchor="middle">큐 (왼쪽이 앞)</text><text x="590" y="75" class="s" text-anchor="end">초기</text><rect x="620" y="49" width="75" height="45" class="l"/><text x="657.5" y="78.5" class="m" text-anchor="middle">A</text><text x="590" y="128" class="s" text-anchor="end">A 처리</text><rect x="620" y="102" width="75" height="45" class="l"/><text x="657.5" y="131.5" class="m" text-anchor="middle">B</text><rect x="695" y="102" width="75" height="45" class="l"/><text x="732.5" y="131.5" class="m" text-anchor="middle">C</text><text x="590" y="181" class="s" text-anchor="end">B 처리</text><rect x="620" y="155" width="75" height="45" class="l"/><text x="657.5" y="184.5" class="m" text-anchor="middle">C</text><rect x="695" y="155" width="75" height="45" class="l"/><text x="732.5" y="184.5" class="m" text-anchor="middle">D</text><text x="590" y="234" class="s" text-anchor="end">C 처리</text><rect x="620" y="208" width="75" height="45" class="l"/><text x="657.5" y="237.5" class="m" text-anchor="middle">D</text><text x="590" y="287" class="s" text-anchor="end">D 처리</text><rect x="620" y="261" width="160" height="45" class="l"/><text x="700" y="290.5" class="m" text-anchor="middle">비어 있음</text></svg>
