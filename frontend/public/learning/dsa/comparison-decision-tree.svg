<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="comparison-decision-tree-title comparison-decision-tree-desc"><title id="comparison-decision-tree-title">비교 정렬 · 세 원소의 여섯 가능한 순서</title><desc id="comparison-decision-tree-desc">서로 다른 a,b,c의 정렬을 비교 결정 트리로 표현한다. 6가지 순서, 최악 비교 3회.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="480" y="30" class="h" text-anchor="middle">a &lt; b ?</text><line x1="480" y1="43" x2="245" y2="105" class="l"/><line x1="480" y1="43" x2="715" y2="105" class="l"/><text x="350" y="72" class="s" text-anchor="middle">참</text><text x="610" y="72" class="s" text-anchor="middle">거짓</text><text x="245" y="125" class="m" text-anchor="middle">b &lt; c ?</text><text x="715" y="125" class="m" text-anchor="middle">a &lt; c ?</text><line x1="245" y1="139" x2="115" y2="205" class="l"/><line x1="245" y1="139" x2="365" y2="205" class="l"/><line x1="715" y1="139" x2="595" y2="205" class="l"/><line x1="715" y1="139" x2="845" y2="205" class="l"/><text x="115" y="228" class="m" text-anchor="middle">abc</text><text x="365" y="228" class="m" text-anchor="middle">a &lt; c ?</text><text x="595" y="228" class="m" text-anchor="middle">bac</text><text x="845" y="228" class="m" text-anchor="middle">b &lt; c ?</text><line x1="365" y1="242" x2="285" y2="295" class="l"/><line x1="365" y1="242" x2="445" y2="295" class="l"/><line x1="845" y1="242" x2="765" y2="295" class="l"/><line x1="845" y1="242" x2="925" y2="295" class="l"/><text x="285" y="322" class="m" text-anchor="middle">acb</text><text x="445" y="322" class="m" text-anchor="middle">cab</text><text x="765" y="322" class="m" text-anchor="middle">bca</text><text x="925" y="322" class="m" text-anchor="middle">cba</text><text x="480" y="350" class="s" text-anchor="middle">각 분기: 왼쪽 참, 오른쪽 거짓 · 리프 6개 ≥ 3!</text></svg>
