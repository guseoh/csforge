<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="min-heap-array-index-title min-heap-array-index-desc"><title id="min-heap-array-index-title">최소 힙 · 트리와 배열의 인덱스 대응</title><desc id="min-heap-array-index-desc">최소 힙 배열 [2,5,4,9,7,8]은 레벨 순서로 저장된다. 인덱스 1의 부모 0과 자식 3,4가 대응한다. 배열 전체가 정렬된 것은 아니다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5}.r{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:5 4}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}.r{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><line x1="458.53374741600203" y1="80.733126291999" x2="301.46625258399797" y2="159.26687370800101" class="l"/><line x1="501.46625258399797" y1="80.73312629199899" x2="658.533747416002" y2="159.26687370800101" class="l"/><line x1="263.02943725152284" y1="186.97056274847714" x2="196.97056274847714" y2="253.02943725152286" class="l"/><line x1="296.97056274847716" y1="186.97056274847714" x2="363.02943725152284" y2="253.02943725152286" class="l"/><line x1="663.0294372515228" y1="186.97056274847714" x2="596.9705627484772" y2="253.02943725152286" class="l"/><circle cx="480" cy="70" r="24" class="r" data-index="0" data-value="2"/><text x="480" y="77" class="m" text-anchor="middle">2</text><circle cx="280" cy="170" r="24" class="a" data-index="1" data-value="5"/><text x="280" y="177" class="m" text-anchor="middle">5</text><circle cx="680" cy="170" r="24" class="l" data-index="2" data-value="4"/><text x="680" y="177" class="m" text-anchor="middle">4</text><circle cx="180" cy="270" r="24" class="r" data-index="3" data-value="9"/><text x="180" y="277" class="m" text-anchor="middle">9</text><circle cx="380" cy="270" r="24" class="r" data-index="4" data-value="7"/><text x="380" y="277" class="m" text-anchor="middle">7</text><circle cx="580" cy="270" r="24" class="l" data-index="5" data-value="8"/><text x="580" y="277" class="m" text-anchor="middle">8</text><text x="480" y="117" class="s" text-anchor="middle">i=0</text><text x="280" y="217" class="s" text-anchor="middle">i=1</text><text x="680" y="217" class="s" text-anchor="middle">i=2</text><text x="180" y="317" class="s" text-anchor="middle">i=3</text><text x="380" y="317" class="s" text-anchor="middle">i=4</text><text x="580" y="317" class="s" text-anchor="middle">i=5</text><rect x="240" y="360" width="80" height="45" class="r" data-array-index="0" data-value="2"/><text x="280" y="389.5" class="m" text-anchor="middle">2</text><text x="280" y="351" class="s" text-anchor="middle">0</text><rect x="320" y="360" width="80" height="45" class="a" data-array-index="1" data-value="5"/><text x="360" y="389.5" class="m" text-anchor="middle">5</text><text x="360" y="351" class="s" text-anchor="middle">1</text><rect x="400" y="360" width="80" height="45" class="l" data-array-index="2" data-value="4"/><text x="440" y="389.5" class="m" text-anchor="middle">4</text><text x="440" y="351" class="s" text-anchor="middle">2</text><rect x="480" y="360" width="80" height="45" class="r" data-array-index="3" data-value="9"/><text x="520" y="389.5" class="m" text-anchor="middle">9</text><text x="520" y="351" class="s" text-anchor="middle">3</text><rect x="560" y="360" width="80" height="45" class="r" data-array-index="4" data-value="7"/><text x="600" y="389.5" class="m" text-anchor="middle">7</text><text x="600" y="351" class="s" text-anchor="middle">4</text><rect x="640" y="360" width="80" height="45" class="l" data-array-index="5" data-value="8"/><text x="680" y="389.5" class="m" text-anchor="middle">8</text><text x="680" y="351" class="s" text-anchor="middle">5</text><text x="480" y="440" class="t" text-anchor="middle">i=1: 부모 ⌊(1−1)/2⌋=0 · 왼쪽 2×1+1=3 · 오른쪽 2×1+2=4</text><text x="480" y="478" class="s" text-anchor="middle">굵은 선: 선택 인덱스 1 · 점선: 부모와 자식 · 5 ≤ 9, 7</text></svg>
