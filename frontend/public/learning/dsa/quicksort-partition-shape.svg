<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="quicksort-partition-shape-title quicksort-partition-shape-desc"><title id="quicksort-partition-shape-title">퀵 정렬 · 분할 완료는 정렬 완료가 아니다</title><desc id="quicksort-partition-shape-desc">[7,2,5,1,6]을 피벗 5로 나누면 가능한 분할 결과 [2,1,5,7,6]. 양쪽 내부는 아직 정렬되지 않았다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="480" y="35" class="h" text-anchor="middle">입력 · 피벗 5</text><rect x="305" y="65" width="70" height="44" class="l"/><text x="340" y="94" class="m" text-anchor="middle">7</text><rect x="375" y="65" width="70" height="44" class="l"/><text x="410" y="94" class="m" text-anchor="middle">2</text><rect x="445" y="65" width="70" height="44" class="a"/><text x="480" y="94" class="m" text-anchor="middle">5</text><rect x="515" y="65" width="70" height="44" class="l"/><text x="550" y="94" class="m" text-anchor="middle">1</text><rect x="585" y="65" width="70" height="44" class="l"/><text x="620" y="94" class="m" text-anchor="middle">6</text><line x1="480" y1="112" x2="480" y2="150" class="l"/><path d="M 474.7263190753538 140.3465918192059 L 480 150 L 485.2736809246462 140.3465918192059" class="l"/><rect x="305" y="158" width="70" height="44" class="l"/><text x="340" y="187" class="m" text-anchor="middle">2</text><rect x="375" y="158" width="70" height="44" class="l"/><text x="410" y="187" class="m" text-anchor="middle">1</text><rect x="445" y="158" width="70" height="44" class="a"/><text x="480" y="187" class="m" text-anchor="middle">5</text><rect x="515" y="158" width="70" height="44" class="l"/><text x="550" y="187" class="m" text-anchor="middle">7</text><rect x="585" y="158" width="70" height="44" class="l"/><text x="620" y="187" class="m" text-anchor="middle">6</text><text x="375" y="235" class="t" text-anchor="middle">5보다 작음</text><text x="585" y="235" class="t" text-anchor="middle">5보다 큼</text><text x="480" y="270" class="s" text-anchor="middle">양쪽 내부는 재귀로 정렬 · 서로 다른 값 예시</text></svg>
