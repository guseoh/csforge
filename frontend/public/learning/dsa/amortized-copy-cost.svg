<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="amortized-copy-cost-title amortized-copy-cost-desc"><title id="amortized-copy-cost-title">동적 배열 · 복사 비용의 누적</title><desc id="amortized-copy-cost-desc">초기 용량 1, 2배 확장, append 8회. 2,3,5번째 삽입에 기존 원소 1,2,4개를 복사한다. 전체 복사는 7개.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="480" y="32" class="h" text-anchor="middle">append 8회 · 기존 원소 복사 횟수</text><line x1="125" y1="270" x2="190" y2="270" class="l"/><rect x="135" y="270" width="45" height="0" class="a"/><text x="157" y="255" class="m" text-anchor="middle">0</text><text x="157" y="302" class="s" text-anchor="middle">1</text><line x1="225" y1="270" x2="290" y2="270" class="l"/><rect x="235" y="227" width="45" height="43" class="a"/><text x="257" y="212" class="m" text-anchor="middle">1</text><text x="257" y="302" class="s" text-anchor="middle">2</text><line x1="325" y1="270" x2="390" y2="270" class="l"/><rect x="335" y="184" width="45" height="86" class="a"/><text x="357" y="169" class="m" text-anchor="middle">2</text><text x="357" y="302" class="s" text-anchor="middle">3</text><line x1="425" y1="270" x2="490" y2="270" class="l"/><rect x="435" y="270" width="45" height="0" class="a"/><text x="457" y="255" class="m" text-anchor="middle">0</text><text x="457" y="302" class="s" text-anchor="middle">4</text><line x1="525" y1="270" x2="590" y2="270" class="l"/><rect x="535" y="98" width="45" height="172" class="a"/><text x="557" y="83" class="m" text-anchor="middle">4</text><text x="557" y="302" class="s" text-anchor="middle">5</text><line x1="625" y1="270" x2="690" y2="270" class="l"/><rect x="635" y="270" width="45" height="0" class="a"/><text x="657" y="255" class="m" text-anchor="middle">0</text><text x="657" y="302" class="s" text-anchor="middle">6</text><line x1="725" y1="270" x2="790" y2="270" class="l"/><rect x="735" y="270" width="45" height="0" class="a"/><text x="757" y="255" class="m" text-anchor="middle">0</text><text x="757" y="302" class="s" text-anchor="middle">7</text><line x1="825" y1="270" x2="890" y2="270" class="l"/><rect x="835" y="270" width="45" height="0" class="a"/><text x="857" y="255" class="m" text-anchor="middle">0</text><text x="857" y="302" class="s" text-anchor="middle">8</text><text x="480" y="340" class="t" text-anchor="middle">복사 1 + 2 + 4 = 7회 · 신규 쓰기 8회</text></svg>
