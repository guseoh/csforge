<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="dsu-path-compression-title dsu-path-compression-desc"><title id="dsu-path-compression-title">Union–Find · 경로 압축 전후</title><desc id="dsu-path-compression-desc">A를 루트로 하는 B→A,C→B,D→C에서 find(D) 실행 후 B,C,D가 직접 A를 가리킨다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#767676"/></marker></defs><text x="235" y="37" class="h" text-anchor="middle">find(D) 전</text><text x="725" y="37" class="h" text-anchor="middle">find(D) 후</text><text x="100" y="127" class="s" text-anchor="middle">루트</text><text x="590" y="127" class="s" text-anchor="middle">루트</text><path d="M165 165 H126" class="l" marker-end="url(#arrow)"/><path d="M255 165 H216" class="l" marker-end="url(#arrow)"/><path d="M345 165 H306" class="l" marker-end="url(#arrow)"/><path d="M655 165 H616" class="l" marker-end="url(#arrow)"/><path d="M770 140 Q680 10 606 140" class="a" marker-end="url(#arrow)"/><path d="M860 190 Q725 330 606 190" class="a" marker-end="url(#arrow)"/><circle cx="100" cy="165" r="25" class="l"/><text x="100" y="172" class="m" text-anchor="middle">A</text><circle cx="190" cy="165" r="25" class="l"/><text x="190" y="172" class="m" text-anchor="middle">B</text><circle cx="280" cy="165" r="25" class="l"/><text x="280" y="172" class="m" text-anchor="middle">C</text><circle cx="370" cy="165" r="25" class="l"/><text x="370" y="172" class="m" text-anchor="middle">D</text><circle cx="590" cy="165" r="25" class="l"/><text x="590" y="172" class="m" text-anchor="middle">A</text><circle cx="680" cy="165" r="25" class="l"/><text x="680" y="172" class="m" text-anchor="middle">B</text><circle cx="770" cy="165" r="25" class="l"/><text x="770" y="172" class="m" text-anchor="middle">C</text><circle cx="860" cy="165" r="25" class="l"/><text x="860" y="172" class="m" text-anchor="middle">D</text><line x1="480" y1="55" x2="480" y2="300" class="d"/><text x="235" y="260" class="s" text-anchor="middle">D → C → B → A</text><text x="725" y="300" class="s" text-anchor="middle">B → A 유지 · C, D → A로 변경</text><text x="480" y="350" class="s" text-anchor="middle">굵은 화살표: 변경된 parent · 대표 루트와 집합 구성원은 그대로</text></svg>
