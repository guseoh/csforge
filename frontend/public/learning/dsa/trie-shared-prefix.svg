<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="trie-shared-prefix-title trie-shared-prefix-desc"><title id="trie-shared-prefix-title">Trie · 공유 접두사와 종료 표시</title><desc id="trie-shared-prefix-desc">app,apple,apt를 저장한다. root-a-p 공유, p와 t로 분기. app,apple,apt에 종료 표시.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><line x1="95" y1="140" x2="160" y2="140" class="l"/><line x1="210" y1="140" x2="275" y2="140" class="l"/><line x1="322.03699925071953" y1="128.19446468711453" x2="417.96300074928047" y2="76.80553531288547" class="l"/><line x1="321.70607855311147" y1="152.40347345892084" x2="418.29392144688853" y2="207.59652654107916" class="l"/><line x1="465" y1="65" x2="555" y2="65" class="l"/><line x1="605" y1="65" x2="695" y2="65" class="l"/><circle cx="70" cy="140" r="25" class="l"/><text x="70" y="147" class="m" text-anchor="middle">∅</text><circle cx="185" cy="140" r="25" class="l"/><text x="185" y="147" class="m" text-anchor="middle">a</text><circle cx="300" cy="140" r="25" class="l"/><text x="300" y="147" class="m" text-anchor="middle">p</text><circle cx="440" cy="65" r="25" class="a"/><text x="440" y="72" class="m" text-anchor="middle">p</text><circle cx="440" cy="220" r="25" class="a"/><text x="440" y="227" class="m" text-anchor="middle">t</text><circle cx="580" cy="65" r="25" class="l"/><text x="580" y="72" class="m" text-anchor="middle">l</text><circle cx="720" cy="65" r="25" class="a"/><text x="720" y="72" class="m" text-anchor="middle">e</text><text x="70" y="185" class="s" text-anchor="middle">루트</text><text x="440" y="112" class="m" text-anchor="middle">app</text><text x="720" y="112" class="m" text-anchor="middle">apple</text><text x="440" y="267" class="m" text-anchor="middle">apt</text><text x="480" y="315" class="s" text-anchor="middle">굵은 원: 문자열 종료 표시 · app 삭제 시 p의 표시만 해제</text></svg>
