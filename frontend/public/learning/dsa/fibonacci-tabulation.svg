<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="fibonacci-tabulation-title fibonacci-tabulation-desc"><title id="fibonacci-tabulation-title">DP · 의존 상태가 먼저 계산되는 순서</title><desc id="fibonacci-tabulation-desc">피보나치 dp[0]=0, dp[1]=1에서 dp[2]=1, dp[3]=2, dp[4]=3, dp[5]=5 순으로 계산한다. dp[4]는 dp[2]와 dp[3]에 의존한다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="35" class="h" text-anchor="middle">기저 상태부터 왼쪽에서 오른쪽으로</text><rect x="210" y="95" width="90" height="45" class="l"/><text x="255" y="124.5" class="m" text-anchor="middle">0</text><text x="255" y="86" class="s" text-anchor="middle">0</text><rect x="300" y="95" width="90" height="45" class="l"/><text x="345" y="124.5" class="m" text-anchor="middle">1</text><text x="345" y="86" class="s" text-anchor="middle">1</text><rect x="390" y="95" width="90" height="45" class="a"/><text x="435" y="124.5" class="m" text-anchor="middle">1</text><text x="435" y="86" class="s" text-anchor="middle">2</text><rect x="480" y="95" width="90" height="45" class="a"/><text x="525" y="124.5" class="m" text-anchor="middle">2</text><text x="525" y="86" class="s" text-anchor="middle">3</text><rect x="570" y="95" width="90" height="45" class="a"/><text x="615" y="124.5" class="m" text-anchor="middle">3</text><text x="615" y="86" class="s" text-anchor="middle">4</text><rect x="660" y="95" width="90" height="45" class="l"/><text x="705" y="124.5" class="m" text-anchor="middle">5</text><text x="705" y="86" class="s" text-anchor="middle">5</text><line x1="435" y1="151" x2="590" y2="207" class="l"/><path d="M 580.0887164367939 208.3290816866247 L 590 207 L 583.2269082776037 199.64301498438346" class="l"/><line x1="525" y1="151" x2="590" y2="207" class="l"/><path d="M 580.265975023838 204.70898324679743 L 590 207 L 586.2941237383026 197.71202491750827" class="l"/><text x="590" y="237" class="m" text-anchor="middle">dp[4] = 1 + 2 = 3</text><text x="255" y="180" class="s" text-anchor="middle">기저</text><text x="345" y="180" class="s" text-anchor="middle">기저</text></svg>
