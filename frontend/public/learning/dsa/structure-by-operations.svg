<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="structure-by-operations-title structure-by-operations-desc"><title id="structure-by-operations-title">자료구조 · 필요한 연산에 따른 후보</title><desc id="structure-by-operations-desc">정확 일치 조회는 해시, 범위·정렬 순회는 균형 트리, 최솟값·최댓값 반복 추출은 힙, 접두사 탐색은 트라이가 후보.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="275" y="32" class="h" text-anchor="middle">주요 연산</text><text x="720" y="32" class="h" text-anchor="middle">후보 자료구조</text><text x="280" y="83" class="t" text-anchor="middle">정확 일치 조회</text><line x1="470" y1="77" x2="550" y2="77" class="l"/><path d="M 541.2241743810963 81.79425538604202 L 550 77 L 541.2241743810963 72.20574461395798" class="l"/><text x="720" y="83" class="t" text-anchor="middle">해시 테이블</text><text x="280" y="137" class="t" text-anchor="middle">정렬 순회 · 범위 질의</text><line x1="470" y1="131" x2="550" y2="131" class="l"/><path d="M 541.2241743810963 135.79425538604204 L 550 131 L 541.2241743810963 126.20574461395798" class="l"/><text x="720" y="137" class="t" text-anchor="middle">균형 탐색 트리</text><text x="280" y="191" class="t" text-anchor="middle">최소·최대 반복 추출</text><line x1="470" y1="185" x2="550" y2="185" class="l"/><path d="M 541.2241743810963 189.79425538604204 L 550 185 L 541.2241743810963 180.20574461395796" class="l"/><text x="720" y="191" class="t" text-anchor="middle">힙 기반 우선순위 큐</text><text x="280" y="245" class="t" text-anchor="middle">문자열 접두사 조회</text><line x1="470" y1="239" x2="550" y2="239" class="l"/><path d="M 541.2241743810963 243.79425538604204 L 550 239 L 541.2241743810963 234.20574461395796" class="l"/><text x="720" y="245" class="t" text-anchor="middle">트라이</text><text x="480" y="285" class="s" text-anchor="middle">최종 선택은 갱신 비용 · 메모리 · 필요한 보장까지 비교</text></svg>
