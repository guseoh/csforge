<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="dp-state-shapes-title dp-state-shapes-desc"><title id="dp-state-shapes-title">DP · 상태 축의 차이</title><desc id="dp-state-shapes-desc">선형은 i, 격자는 r,c, 배낭은 i,w, 구간은 l,r을 상태 축으로 사용한다. 대표적인 상태 모양이며 전이는 문제별로 다르다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="220" y="35" class="h" text-anchor="middle">선형 dp[i]</text><rect x="75" y="65" width="70" height="44" class="l"/><text x="110" y="94" class="m" text-anchor="middle">0</text><rect x="145" y="65" width="70" height="44" class="l"/><text x="180" y="94" class="m" text-anchor="middle">1</text><rect x="215" y="65" width="70" height="44" class="a"/><text x="250" y="94" class="m" text-anchor="middle">2</text><rect x="285" y="65" width="70" height="44" class="l"/><text x="320" y="94" class="m" text-anchor="middle">3</text><text x="720" y="35" class="h" text-anchor="middle">격자 dp[r][c]</text><rect x="620" y="60" width="65" height="50" class="l"/><text x="652.5" y="92" class="m" text-anchor="middle">0,0</text><rect x="685" y="60" width="65" height="50" class="l"/><text x="717.5" y="92" class="m" text-anchor="middle">0,1</text><rect x="750" y="60" width="65" height="50" class="l"/><text x="782.5" y="92" class="m" text-anchor="middle">0,2</text><rect x="620" y="110" width="65" height="50" class="l"/><text x="652.5" y="142" class="m" text-anchor="middle">1,0</text><rect x="685" y="110" width="65" height="50" class="a"/><text x="717.5" y="142" class="m" text-anchor="middle">1,1</text><rect x="750" y="110" width="65" height="50" class="l"/><text x="782.5" y="142" class="m" text-anchor="middle">1,2</text><text x="220" y="210" class="h" text-anchor="middle">배낭 dp[i][w]</text><rect x="110" y="230" width="65" height="50" class="l"/><text x="142.5" y="262" class="m" text-anchor="middle">0,0</text><rect x="175" y="230" width="65" height="50" class="l"/><text x="207.5" y="262" class="m" text-anchor="middle">0,1</text><rect x="240" y="230" width="65" height="50" class="l"/><text x="272.5" y="262" class="m" text-anchor="middle">0,2</text><rect x="110" y="280" width="65" height="50" class="l"/><text x="142.5" y="312" class="m" text-anchor="middle">1,0</text><rect x="175" y="280" width="65" height="50" class="l"/><text x="207.5" y="312" class="m" text-anchor="middle">1,1</text><rect x="240" y="280" width="65" height="50" class="a"/><text x="272.5" y="312" class="m" text-anchor="middle">1,2</text><text x="720" y="210" class="h" text-anchor="middle">구간 dp[l][r]</text><rect x="580" y="250" width="70" height="44" class="l"/><text x="615" y="279" class="m" text-anchor="middle">a</text><rect x="650" y="250" width="70" height="44" class="a"/><text x="685" y="279" class="m" text-anchor="middle">b</text><rect x="720" y="250" width="70" height="44" class="a"/><text x="755" y="279" class="m" text-anchor="middle">c</text><rect x="790" y="250" width="70" height="44" class="a"/><text x="825" y="279" class="m" text-anchor="middle">d</text><line x1="650" y1="305" x2="860" y2="305" class="a"/><text x="755" y="337" class="m" text-anchor="middle">l=1, r=3</text><text x="220" y="350" class="s" text-anchor="middle">물건 수 i · 용량 w</text></svg>
