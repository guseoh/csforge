<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="tree-depth-height-title tree-depth-height-desc"><title id="tree-depth-height-title">트리 · 깊이, 높이, 부분 트리</title><desc id="tree-depth-height-desc">루트 A, 자식 B,C, B의 자식 D,E. A의 높이 2, B의 높이 1, 깊이는 각각 0,1,2층.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><line x1="448.8795231111443" y1="73.37630202960862" x2="341.1204768888557" y2="141.6236979703914" class="l"/><line x1="491.1204768888557" y1="73.37630202960862" x2="598.8795231111443" y2="141.6236979703914" class="l"/><line x1="302.8063838022304" y1="173.14881709764566" x2="247.1936161977696" y2="231.85118290235434" class="l"/><line x1="337.1936161977696" y1="173.14881709764566" x2="392.8063838022304" y2="231.85118290235434" class="l"/><circle cx="470" cy="60" r="25" class="a"/><text x="470" y="67" class="m" text-anchor="middle">A</text><circle cx="320" cy="155" r="25" class="l"/><text x="320" y="162" class="m" text-anchor="middle">B</text><circle cx="620" cy="155" r="25" class="l"/><text x="620" y="162" class="m" text-anchor="middle">C</text><circle cx="230" cy="250" r="25" class="l"/><text x="230" y="257" class="m" text-anchor="middle">D</text><circle cx="410" cy="250" r="25" class="l"/><text x="410" y="257" class="m" text-anchor="middle">E</text><rect x="177" y="115" width="285" height="180" class="d"/><text x="320" y="320" class="s" text-anchor="middle">B의 부분 트