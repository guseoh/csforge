<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="bucket-mapping-modulo-title bucket-mapping-modulo-desc"><title id="bucket-mapping-modulo-title">해시 값과 현재 용량으로 위치 결정</title><desc id="bucket-mapping-modulo-desc">해시 값 13과 21은 용량 8에서 모두 인덱스 5, 용량 16에서는 13과 5에 매핑된다.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="35" class="h" text-anchor="middle">같은 해시 값 · 달라진 용량</text><text x="120" y="99" class="m" text-anchor="middle">h = 13</text><text x="120" y="209" class="m" text-anchor="middle">h = 21</text><line x1="190" y1="94" x2="310" y2="94" class="l"/><path d="M 300.3465918192059 99.27368092464623 L 310 94 L 300.3465918192059 88.72631907535377" class="l"/><line x1="190" y1="204" x2="310" y2="204" class="l"/><path d="M 300.3465918192059 209.27368092464624 L 310 204 L 300.3465918192059 198.72631907535376" class="l"/><rect x="320" y="69" width="180" height="50" class="l"/><text x="410" y="101" class="m" text-anchor="middle">13 mod 8 = 5</text><rect x="320" y="179" width="180" height="50" class="l"/><text x="410" y="211" class="m" text-anchor="middle">21 mod 8 = 5</text><rect x="650" y="69" width="240" height="50" class="l"/><text x="770" y="101" class="m" text-anchor="middle">13 mod 16 = 13</text><rect x="650" y="179" width="240" height="50" class="l"/><text x="770" y="211" class="m" text-anchor="middle">21 mod 16 = 5</text><line x1="500" y1="94" x2="640" y2="94" class="l"/><path d="M 630.3465918192059 99.27368092464623 L 640 94 L 630.3465918192059 88.72631907535377" class="l"/><line x1="500" y1="204" x2="640" y2="204" class="l"/><path d="M 630.3465918192059 209.27368092464624 L 640 204 L 630.3465918192059 198.72631907535376" class="l"/><text x="410" y="265" class="t" text-anchor="middle">용량 8 · 충돌</text><text x="770" y="265" class="t" text-anchor="middle">용량 16 · 분리</text></svg>
