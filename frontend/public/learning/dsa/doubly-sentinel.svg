<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="doubly-sentinel-title doubly-sentinel-desc"><title id="doubly-sentinel-title">이중 연결 리스트 · 센티널의 빈 상태와 양끝 변경</title><desc id="doubly-sentinel-desc">head와 tail은 데이터가 아닌 고정 경계 노드다. 빈 상태 head↔tail, 삽입 head↔A↔tail, 삭제 후 다시 head↔tail.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><text x="170" y="88" class="b" text-anchor="middle">비어 있음</text><rect x="36" y="148" width="78" height="52" rx="7" class="v"/><text x="75" y="181" class="m" text-anchor="middle">head</text><rect x="256" y="148" width="78" height="52" rx="7" class="v"/><text x="295" y="181" class="m" text-anchor="middle">tail</text><line x1="114" y1="160" x2="256" y2="160" class="l"/><polygon class="arrow" points="256,160 247,155 247,165"/><line x1="256" y1="188" x2="114" y2="188" class="l"/><polygon class="arrow" points="114,188 123,193 123,183"/><text x="480" y="88" class="b" text-anchor="middle">A 삽입</text><rect x="346" y="148" width="78" height="52" rx="7" class="v"/><text x="385" y="181" class="m" text-anchor="middle">head</text><rect x="566" y="148" width="78" height="52" rx="7" class="v"/><text x="605" y="181" class="m" text-anchor="middle">tail</text><rect x="456" y="148" width="78" height="52" rx="7" class="p"/><text x="495" y="181" class="m" text-anchor="middle">A</text><line x1="424" y1="160" x2="452" y2="160" class="l"/><polygon class="arrow" points="452,160 443,155 443,165"/><line x1="452" y1="188" x2="424" y2="188" class="l"/><polygon class="arrow" points="424,188 433,193 433,183"/><line x1="538" y1="160" x2="566" y2="160" class="l"/><polygon class="arrow" points="566,160 557,155 557,165"/><line x1="566" y1="188" x2="538" y2="188" class="l"/><polygon class="arrow" points="538,188 547,193 547,183"/><text x="790" y="88" class="b" text-anchor="middle">A 삭제</text><rect x="656" y="148" width="78" height="52" rx="7" class="v"/><text x="695" y="181" class="m" text-anchor="middle">head</text><rect x="876" y="148" width="78" height="52" rx="7" class="v"/><text x="915" y="181" class="m" text-anchor="middle">tail</text><line x1="734" y1="160" x2="876" y2="160" class="l"/><polygon class="arrow" points="876,160 867,155 867,165"/><line x1="876" y1="188" x2="734" y2="188" class="l"/><polygon class="arrow" points="734,188 743,193 743,183"/><text x="30" y="270" class="m" text-anchor="start">head.next = tail · tail.prev = head</text><text x="30" y="316" class="s" text-anchor="start">첫 삽입과 마지막 삭제도 같은 이웃 link 갱신으로 처리합니다.</text></svg>
