<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="preprocessing-break-even-title preprocessing-break-even-desc"><title id="preprocessing-break-even-title">전처리 · 초기 비용과 반복 질의의 손익분기</title><desc id="preprocessing-break-even-desc">선형 탐색 100ms/회, 전처리 800ms, 이후 5ms/회. 갱신 없음. 8회 800 대 840, 9회 900 대 845로 전처리가 유리해진다.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="480" y="32" class="h" text-anchor="middle">총 비용(ms) · 데이터 갱신 없음</text><line x1="100" y1="270" x2="860" y2="270" class="l"/><line x1="100" y1="270" x2="100" y2="60" class="l"/><line x1="95" y1="270" x2="105" y2="270" class="l"/><text x="83" y="276" class="s" text-anchor="end">0</text><line x1="95" y1="206" x2="105" y2="206" class="l"/><text x="83" y="212" class="s" text-anchor="end">400</text><line x1="95" y1="142" x2="105" y2="142" class="l"/><text x="83" y="148" class="s" text-anchor="end">800</text><line x1="95" y1="78" x2="105" y2="78" class="l"/><text x="83" y="84" class="s" text-anchor="end">1200</text><text x="100" y="298" class="s" text-anchor="middle">0</text><text x="340" y="298" class="s" text-anchor="middle">4</text><text x="580" y="298" class="s" text-anchor="middle">8</text><text x="820" y="298" class="s" text-anchor="middle">12</text><line x1="100" y1="270" x2="820" y2="78" class="a"/><line x1="100" y1="142" x2="820" y2="132" class="d"/><text x="690" y="86" class="m" text-anchor="middle">100Q</text><text x="670" y="157" class="m" text-anchor="middle">800 + 5Q</text><circle cx="605.26" cy="135.26" r="6" fill="#767676"/><text x="610" y="195" class="s" text-anchor="middle">교차점 Q≈8.42</text><text x="480" y="332" class="s" text-anchor="middle">질의 횟수 Q · 정수 횟수 기준 9회부터 전처리 유리</text></svg>
