<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="hash-resize-rehash-title hash-resize-rehash-desc"><title id="hash-resize-rehash-title">해시 테이블 확장 · 용량이 바뀌면 위치도 다시 계산</title><desc id="hash-resize-rehash-desc">분리 연결법의 예시. h(k)=k, 기존 용량 8에서는 10과 18이 bucket 2, 25는 bucket 1. 용량 16에서는 10이 10, 18이 2, 25가 9로 이동한다.</desc><style>.canvas{fill:#fff}.h{font:700 27px system-ui,sans-serif;fill:#4a4a4a}.b{font:700 22px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 19px system-ui,sans-serif;fill:#4a4a4a}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#4a4a4a}.p{fill:none;stroke:#4a4a4a;stroke-width:2}.v{fill:none;stroke:#4a4a4a;stroke-width:3.5}.n{fill:none;stroke:#4a4a4a;stroke-width:2.5}.l{stroke:#4a4a4a;stroke-width:2;fill:none}.d{stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#4a4a4a}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.h{fill:#c8c8c8}.b{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.p{stroke:#c8c8c8}.v{stroke:#c8c8c8}.n{stroke:#c8c8c8}.l{stroke:#c8c8c8}.d{stroke:#c8c8c8}.arrow{fill:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="38" y="34" class="b">기존 용량 8 · index = h(k) mod 8</text><text x="85" y="61" class="s" text-anchor="middle">0</text><rect x="38" y="70" width="94" height="44" class="p"/><text x="85" y="99" class="m" text-anchor="middle">·</text><text x="195" y="61" class="s" text-anchor="middle">1</text><rect x="148" y="70" width="94" height="44" class="v"/><text x="195" y="99" class="m" text-anchor="middle">25</text><text x="305" y="61" class="s" text-anchor="middle">2</text><rect x="258" y="70" width="94" height="44" class="v"/><text x="305" y="99" class="m" text-anchor="middle">10 → 18</text><text x="415" y="61" class="s" text-anchor="middle">3</text><rect x="368" y="70" width="94" height="44" class="p"/><text x="415" y="99" class="m" text-anchor="middle">·</text><text x="525" y="61" class="s" text-anchor="middle">4</text><rect x="478" y="70" width="94" height="44" class="p"/><text x="525" y="99" class="m" text-anchor="middle">·</text><text x="635" y="61" class="s" text-anchor="middle">5</text><rect x="588" y="70" width="94" height="44" class="p"/><text x="635" y="99" class="m" text-anchor="middle">·</text><text x="745" y="61" class="s" text-anchor="middle">6</text><rect x="698" y="70" width="94" height="44" class="p"/><text x="745" y="99" class="m" text-anchor="middle">·</text><text x="855" y="61" class="s" text-anchor="middle">7</text><rect x="808" y="70" width="94" height="44" class="p"/><text x="855" y="99" class="m" text-anchor="middle">·</text><text x="38" y="151" class="s">같은 해시 값으로 새 인덱스 계산 (h(k) = k)</text><text x="185" y="190" class="m" text-anchor="middle">25 mod 16 = 9</text><text x="480" y="190" class="m" text-anchor="middle">10 mod 16 = 10</text><text x="775" y="190" class="m" text-anchor="middle">18 mod 16 = 2</text><path d="M480 205 V232 l-5 -9 m5 9 l5 -9" class="l"/><text x="38" y="265" class="b">새 용량 16 · index = h(k) mod 16</text><text x="85" y="291" class="s" text-anchor="middle">0</text><rect x="38" y="300" width="94" height="44" class="p"/><text x="85" y="329" class="m" text-anchor="middle">·</text><text x="195" y="291" class="s" text-anchor="middle">1</text><rect x="148" y="300" width="94" height="44" class="p"/><text x="195" y="329" class="m" text-anchor="middle">·</text><text x="305" y="291" class="s" text-anchor="middle">2</text><rect x="258" y="300" width="94" height="44" class="v"/><text x="305" y="329" class="m" text-anchor="middle">18</text><text x="415" y="291" class="s" text-anchor="middle">3</text><rect x="368" y="300" width="94" height="44" class="p"/><text x="415" y="329" class="m" text-anchor="middle">·</text><text x="525" y="291" class="s" text-anchor="middle">4</text><rect x="478" y="300" width="94" height="44" class="p"/><text x="525" y="329" class="m" text-anchor="middle">·</text><text x="635" y="291" class="s" text-anchor="middle">5</text><rect x="588" y="300" width="94" 