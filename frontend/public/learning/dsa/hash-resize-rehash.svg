<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="hash-resize-rehash-title hash-resize-rehash-desc"><title id="hash-resize-rehash-title">해시 테이블 확장 · 용량이 바뀌면 위치도 다시 계산</title><desc id="hash-resize-rehash-desc">분리 연결법의 예시. h(k)=k, 기존 용량 8에서는 10과 18이 bucket 2, 25는 bucket 1. 용량 16에서는 10이 10, 18이 2, 25가 9로 이동한다.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><text x="30" y="82" class="b" text-anchor="start">기존 용량 8 · index = h(k) mod 8</text><text x="85" y="119" class="s" text-anchor="middle">0</text><rect x="38" y="132" width="94" height="66" rx="5" class="p"/><text x="85" y="171" class="m" text-anchor="middle">·</text><text x="190" y="119" class="s" text-anchor="middle">1</text><rect x="143" y="132" width="94" height="66" rx="5" class="v"/><text x="190" y="171" class="m" text-anchor="middle">25</text><text x="295" y="119" class="s" text-anchor="middle">2</text><rect x="248" y="132" width="94" height="66" rx="5" class="v"/><text x="295" y="171" class="m" text-anchor="middle">10 → 18</text><text x="400" y="119" class="s" text-anchor="middle">3</text><rect x="353" y="132" width="94" height="66" rx="5" class="p"/><text x="400" y="171" class="m" text-anchor="middle">·</text><text x="505" y="119" class="s" text-anchor="middle">4</text><rect x="458" y="132" width="94" height="66" rx="5" class="p"/><text x="505" y="171" class="m" text-anchor="middle">·</text><text x="610" y="119" class="s" text-anchor="middle">5</text><rect x="563" y="132" width="94" height="66" rx="5" class="p"/><text x="610" y="171" class="m" text-anchor="middle">·</text><text x="715" y="119" class="s" text-anchor="middle">6</text><rect x="668" y="132" width="94" height="66" rx="5" class="p"/><text x="715" y="171" class="m" text-anchor="middle">·</text><text x="820" y="119" class="s" text-anchor="middle">7</text><rect x="773" y="132" width="94" height="66" rx="5" class="p"/><text x="820" y="171" class="m" text-anchor="middle">·</text><line x1="480" y1="222" x2="480" y2="260" class="l"/><polygon class="arrow" points="480,260 485,251 475,251"/><text x="510" y="244" class="s" text-anchor="start">재배치</text><text x="30" y="297" class="b" text-anchor="start">새 용량 16 · index = h(k) mod 16</text><text x="85" y="329" class="s" text-anchor="middle">0</text><rect x="38" y="339" width="94" height="42" rx="5" class="p"/><text x="85" y="368" class="s" text-anchor="middle">·</text><text x="190" y="329" class="s" text-anchor="middle">2</text><rect x="143" y="339" width="94" height="42" rx="5" class="v"/><text x="190" y="368" class="s" text-anchor="middle">18</text><text x="295" y="329" class="s" text-anchor="middle">4</text><rect x="248" y="339" width="94" height="42" rx="5" class="p"/><text x="295" y="368" class="s" text-anchor="middle">·</text><text x="400" y="329" class="s" text-anchor="middle">6</text><rect x="353" y="339" width="94" height="42" rx="5" class="p"/><text x="400" y="368" class="s" text-anchor="middle">·</text><text x="505" y="329" class="s" text-anchor="middle">8</text><rect x="458" y="339" width="94" height="42" rx="5" class="v"/><text x="505" y="368" class="s" text-anchor="middle">25</text><text x="610" y="329" class="s" text-anchor="middle">10</text><rect x="563" y="339" width="94" height="42" rx="5" class="v"/><text x="610" y="368" class="s" text-anchor="middle">10</text><text x="715" y="329" class="s" text-anchor="middle">12</text><rect x="668" y="339" width="94" height="42" rx="5" class="p"/><text x="715" y="368" class="s" text-anchor="middle">·</text><text x="820" y="329" class="s