<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="singly-linked-insert-title singly-linked-insert-desc"><title id="singly-linked-insert-title">단일 연결 리스트 · B 뒤에 X 삽입</title><desc id="singly-linked-insert-desc">기존 B.next가 C를 가리킨다. 먼저 X.next를 C로 연결하고, 이어 B.next를 X로 바꾼다.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><text x="30" y="82" class="b" text-anchor="start">삽입 전</text><rect x="68" y="118" width="104" height="54" rx="7" class="p"/><text x="120" y="152" class="m" text-anchor="middle">A</text><rect x="308" y="118" width="104" height="54" rx="7" class="p"/><text x="360" y="152" class="m" text-anchor="middle">B</text><rect x="648" y="118" width="104" height="54" rx="7" class="p"/><text x="700" y="152" class="m" text-anchor="middle">C</text><line x1="172" y1="145" x2="307" y2="145" class="l"/><polygon class="arrow" points="307,145 298,140 298,150"/><line x1="412" y1="145" x2="647" y2="145" class="l"/><polygon class="arrow" points="647,145 638,140 638,150"/><text x="360" y="190" class="s" text-anchor="middle">B.next = C</text><text x="30" y="230" class="b" text-anchor="start">삽입 후</text><rect x="68" y="251" width="104" height="54" rx="7" class="p"/><text x="120" y="285" class="m" text-anchor="middle">A</text><rect x="308" y="251" width="104" height="54" rx="7" class="p"/><text x="360" y="285" class="m" text-anchor="middle">B</text><rect x="488" y="251" width="104" height="54" rx="7" class="p"/><text x="540" y="285" class="m" text-anchor="middle">X</text><rect x="708" y="251" width="104" height="54" rx="7" class="p"/><text x="760" y="285" class="m" text-anchor="middle">C</text><line x1="172" y1="278" x2="307" y2="278" class="l"/><polygon class="arrow" points="307,278 298,273 298,283"/><line x1="412" y1="278" x2="487" y2="278" class="l"/><polygon class="arrow" points="487,278 478,273 478,283"/><line x1="592" y1="278" x2="707" y2="278" class="l"/><polygon class="arrow" points="707,278 698,273 698,283"/><text x="30" y="333" class="m" text-anchor="start">1) X.next = B.next   2) B.next = X</text></svg>
