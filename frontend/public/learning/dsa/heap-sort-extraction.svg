r="middle">9</text><text x="275" y="195" class="s" text-anchor="end">sift-down 완료</text><rect x="305" y="168" width="85" height="44" class="l"/><text x="347.5" y="197" class="m" text-anchor="middle">7</text><rect x="390" y="168" width="85" height="44" class="l"/><text x="432.5" y="197" class="m" text-anchor="middle">4</text><rect x="475" y="168" width="85" height="44" class="l"/><text x="517.5" y="197" class="m" text-anchor="middle">6</text><rect x="560" y="168" width="85" height="44" class="l"/><text x="602.5" y="197" class="m" text-anchor="middle">2</text><rect x="645" y="168" width="85" height="44" class="a"/><text x="687.5" y="197" class="m" text-anchor="middle">9</text><text x="275" y="260" class="s" text-anchor="end">다음 추출·복구</text><rect x="305" y="233" width="85" height="44" class="l"/><text x="347.5" y="262" class="m" text-anchor="middle">6</text><rect x="390" y="233" width="85" height="44" class="l"/><text x="432.5" y="262" class="m" text-anchor="middle">4</text><rect x="475" y="233" width="85" height="44" class="l"/><text x="517.5" y="262" class="m" text-anchor="middle">2</text><rect x="560" y="233" width="85" height="44" class="a"/><text x="602.5" y="262" class="m" text-anchor="middle">7</text><rect x="645" y="233" width="85" height="44" class="a"/><text x="687.5" y="262" class="m" text-anchor="middle">9</text><text x="480" y="315" class="s" text-anchor="middle">굵은 칸: 최종 위치 확정 · 나머지는 최대 힙 복구 대상</text></svg>
