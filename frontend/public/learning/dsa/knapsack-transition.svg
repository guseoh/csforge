<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="knapsack-transition-title knapsack-transition-desc"><title id="knapsack-transition-title">0/1 배낭 · 선택과 미선택의 전이</title><desc id="knapsack-transition-desc">용량 5, 물건 무게 2 가치 4. 이전 행 dp[i-1][5]=7, dp[i-1][3]=5라면 현재 dp[i][5]=max(7,5+4)=9.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="32" class="h" text-anchor="middle">현재 용량 5 · 물건 무게 2, 가치 4</text><rect x="100" y="65" width="320" height="55" class="l"/><text x="260" y="99.5" class="m" text-anchor="middle">dp[i-1][5] = 7</text><rect x="540" y="65" width="320" height="55" class="l"/><text x="700" y="99.5" class="m" text-anchor="middle">dp[i-1][3] = 5</text><text x="260" y="150" class="t" text-anchor="middle">선택 안 함: 7</text><text x="700" y="150" class="t" text-anchor="middle">선택: 5 + 4 = 9</text><line x1="260" y1="160" x2="405" y2="210" class="l"/><path d="M 395.1406889791212 211.671522118782 L 405 210 L 398.26645415772833 202.60680310082128" class="l"/><line x1="700" y1="160" x2="555" y2="210" class="a"/><path d="M 561.7335458422717 202.60680310082128 L 555 210 L 564.8593110208789 211.671522118782" class="a"/><rect x="335" y="215" width="290" height="50" class="a"/><text x="480" y="247" class="m" text-anchor="middle">dp[i][5] = 9</text></svg>
