<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="lower-bound-interval-title lower-bound-interval-desc"><title id="lower-bound-interval-title">Lower bound · 미확인 원소와 정답 경계</title><desc id="lower-bound-interval-desc">정렬 배열 [1,2,2,2,5,8]에서 목표 2. [0,6)에서 mid=3 참이므로 right=3, mid=1 참이므로 right=1, mid=0 거짓이므로 left=1. 경계 1.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 23px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="35" class="h" text-anchor="middle">목표: 처음으로 2 이상인 위치</text><rect x="270" y="80" width="70" height="45" class="l"/><text x="305" y="109.5" class="m" text-anchor="middle">1</text><text x="305" y="71" class="s" text-anchor="middle">0</text><rect x="340" y="80" width="70" height="45" class="a"/><text x="375" y="109.5" class="m" text-anchor="middle">2</text><text x="375" y="71" class="s" text-anchor="middle">1</text><rect x="410" y="80" width="70" height="45" class="l"/><text x="445" y="109.5" class="m" text-anchor="middle">2</text><text x="445" y="71" class="s" text-anchor="middle">2</text><rect x="480" y="80" width="70" height="45" class="l"/><text x="515" y="109.5" class="m" text-anchor="middle">2</text><text x="515" y="71" class="s" text-anchor="middle">3</text><rect x="550" y="80" width="70" height="45" class="l"/><text x="585" y="109.5" class="m" text-anchor="middle">5</text><text x="585" y="71" class="s" text-anchor="middle">4</text><rect x="620" y="80" width="70" height="45" class="l"/><text x="655" y="109.5" class="m" text-anchor="middle">8</text><text x="655" y="71" class="s" text-anchor="middle">5</text><text x="240" y="167" class="s" text-anchor="end">초기 [0,6)</text><line x1="270" y1="160" x2="690" y2="160" class="d"/><line x1="270" y1="160" x2="690" y2="160" class="a"/><line x1="270" y1="151" x2="270" y2="169" class="a"/><line x1="690" y1="151" x2="690" y2="169" class="a"/><text x="240" y="217" class="s" text-anchor="end">mid 3 → 참</text><line x1="270" y1="210" x2="690" y2="210" class="d"/><line x1="270" y1="210" x2="480" y2="210" class="a"/><line x1="270" y1="201" x2="270" y2="219" class="a"/><line x1="480" y1="201" x2="480" y2="219" class="a"/><text x="240" y="267" class="s" text-anchor="end">mid 1 → 참</text><line x1="270" y1="260" x2="690" y2="260" class="d"/><line x1="270" y1="260" x2="340" y2="260" class="a"/><line x1="270" y1="251" x2="270" y2="269" class="a"/><line x1="340" y1="251" x2="340" y2="269" class="a"/><text x="240" y="317" class="s" text-anchor="end">mid 0 → 거짓</text><line x1="270" y1="310" x2="690" y2="310" class="d"/><circle cx="340" cy="310" r="6" fill="#767676"/><line x1="340" y1="301" x2="340" y2="319" class="a"/><line x1="340" y1="301" x2="340" y2="319" class="a"/><text x="740" y="310" class="h" text-anchor="start">결과 1</text></svg>
