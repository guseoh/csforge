<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="fibonacci-overlap-title fibonacci-overlap-desc"><title id="fibonacci-overlap-title">피보나치 · 반복되는 부분 문제</title><desc id="fibonacci-overlap-desc">fib(5)에서 fib(4),fib(3)을 호출하고 fib(4)에서 fib(3),fib(2)를 호출한다. fib(3)이 두 번 등장.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="480" y="32" class="h" text-anchor="middle">서로 다른 호출 경로 · 같은 fib(3) 상태</text><line x1="457.3937838313502" y1="100.67515763519573" x2="322.6062161686498" y2="164.32484236480428" class="l"/><line x1="502.6062161686498" y1="100.67515763519573" x2="637.3937838313502" y2="164.32484236480428" class="l"/><line x1="281.8511829023543" y1="192.1936161977696" x2="223.14881709764566" y2="247.8063838022304" class="l"/><line x1="318.1488170976457" y1="192.1936161977696" x2="376.8511829023543" y2="247.8063838022304" class="l"/><circle cx="480" cy="90" r="25" class="l"/><text x="480" y="97" class="m" text-anchor="middle">5</text><circle cx="300" cy="175" r="25" class="l"/><text x="300" y="182" class="m" text-anchor="middle">4</text><circle cx="660" cy="175" r="25" class="a"/><text x="660" y="182" class="m" text-anchor="middle">3</text><circle cx="205" cy="265" r="25" class="a"/><text x="205" y="272" class="m" text-anchor="middle">3</text><circle cx="395" cy="265" r="25" class="l"/><text x="395" y="272" class="m" text-anchor="middle">2</text><text x="690" y=