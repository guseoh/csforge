<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="monotonic-deque-window-title monotonic-deque-window-desc"><title id="monotonic-deque-window-title">슬라이딩 윈도 최댓값 · 만료와 dominance</title><desc id="monotonic-deque-window-desc">크기 3인 윈도에서 [0,2]의 deque는 [0:5,2:4]. [1,3]으로 이동하면 0이 만료되어 [2:4,3:2]. [2,4]에서는 새 값 6 때문에 뒤의 3과 2가 제거되어 [4:6]만 남는다.</desc><style>.canvas{fill:#fff}.h{font:700 27px system-ui,sans-serif;fill:#4a4a4a}.b{font:700 22px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 19px system-ui,sans-serif;fill:#4a4a4a}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#4a4a4a}.p{fill:none;stroke:#4a4a4a;stroke-width:2}.v{fill:none;stroke:#4a4a4a;stroke-width:3.5}.n{fill:none;stroke:#4a4a4a;stroke-width:2.5}.l{stroke:#4a4a4a;stroke-width:2;fill:none}.d{stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#4a4a4a}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.h{fill:#c8c8c8}.b{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.p{stroke:#c8c8c8}.v{stroke:#c8c8c8}.n{stroke:#c8c8c8}.l{stroke:#c8c8c8}.d{stroke:#c8c8c8}.arrow{fill:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="30" y="32" class="b">윈도 크기 3 · 입력 (인덱스 : 값)</text><rect x="30" y="50" width="118" height="42" class="p"/><text x="89" y="78" class="m" text-anchor="middle">0 : 5</text><rect x="162" y="50" width="118" height="42" class="p"/><text x="221" y="78" class="m" text-anchor="middle">1 : 3</text><rect x="294" y="50" width="118" height="42" class="p"/><text x="353" y="78" class="m" text-anchor="middle">2 : 4</text><rect x="426" y="50" width="118" height="42" class="p"/><text x="485" y="78" class="m" text-anchor="middle">3 : 2</text><rect x="558" y="50" width="118" height="42" class="p"/><text x="617" y="78" class="m" text-anchor="middle">4 : 6</text><text x="300" y="120" class="s">deque 앞 → 뒤 · 굵은 칸: 현재 최댓값</text><text x="30" y="162" class="b">[0,2]</text><rect x="300" y="135" width="118" height="42" class="v"/><text x="359" y="163" class="m" text-anchor="middle">0 : 5</text><rect x="432" y="135" width="118" height="42" class="p"/><text x="491" y="163" class="m" text-anchor="middle">2 : 4</text><text x="30" y="200" class="s">최댓값 5 · 인덱스 1은 이미 뒤에서 제거됨</text><text x="30" y="257" class="b">[1,3]</text><rect x="300" y="230" width="118" height="42" class="v"/><text x="359" y="258" class="m" text-anchor="middle">2 : 4</text><rect x="432" y="230" width="118" height="42" class="p"/><text x="491" y="258" class="m" text-anchor="middle">3 : 2</text><text x="30" y="295" class="s">앞의 0은 윈도 밖으로 만료 · 새 인덱스 3 추가</text><text x="30" y="352" class="b">[2,4]</text><rect x="300" y="325" width="118" height="42" class="v"/><text x="359" y="353" class="m" text-anchor="middle">4 : 6</text><text x="30" y="390" class="s">1은 이미 후보가 아님 · 뒤에서 3, 2 제거 후 4 추가 · 최댓값 6</text></svg>
