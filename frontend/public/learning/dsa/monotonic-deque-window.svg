<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="monotonic-deque-window-title monotonic-deque-window-desc"><title id="monotonic-deque-window-title">슬라이딩 윈도 최댓값 · 만료와 dominance</title><desc id="monotonic-deque-window-desc">이전 window [1,3]의 후보 deque는 index 2 value 4, index 3 value 2. 새 index 4 value 6을 넣으면 뒤의 두 후보가 더 이상 최댓값이 될 수 없어 제거되고 6만 남는다.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><text x="30" y="82" class="b" text-anchor="start">입력 값과 인덱스</text><rect x="55" y="105" width="150" height="56" rx="5" class="p"/><text x="130" y="140" class="m" text-anchor="middle">0 : 5</text><rect x="225" y="105" width="150" height="56" rx="5" class="p"/><text x="300" y="140" class="m" text-anchor="middle">1 : 3</text><rect x="395" y="105" width="150" height="56" rx="5" class="p"/><text x="470" y="140" class="m" text-anchor="middle">2 : 4</text><rect x="565" y="105" width="150" height="56" rx="5" class="p"/><text x="640" y="140" class="m" text-anchor="middle">3 : 2</text><rect x="735" y="105" width="150" height="56" rx="5" class="p"/><text x="810" y="140" class="m" text-anchor="middle">4 : 6</text><text x="30" y="218" class="b" text-anchor="start">새 값 6을 읽기 전 · window [1,3]</text><rect x="197" y="241" width="126" height="58" rx="7" class="p"/><text x="260" y="277" class="m" text-anchor="middle">2 : 4</text><rect x="407" y="241" width="126" height="58" rx="7" class="p"/><text x="470" y="277" class="m" text-anchor="middle">3 : 2</text><text x="690" y="276" class="s" text-anchor="start">front → back</text><line x1="535" y1="270" x2="650" y2="270" class="l"/><polygon class="arrow" points="650,270 641,265 641,275"/><text x="30" y="345" class="s" text-anchor="start">index 3의 2 제거 → index 2의 4 제거 → index 4의 6 추가</text><text x="30" y="382" class="m" text-anchor="start">새 window [2,4] · deque [4 : 6] · 최댓값 = 6</text></svg>
