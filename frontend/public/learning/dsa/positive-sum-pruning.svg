<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="positive-sum-pruning-title positive-sum-pruning-desc"><title id="positive-sum-pruning-title">가지치기 · 양수 후보에서 초과한 합</title><desc id="positive-sum-pruning-desc">목표 7, 현재 합 4, 후보 +2,+5. 6은 더 탐색 가능하지만 9는 양수만 추가하므로 목표 7에 도달 불가.</desc><style>.canvas{fill:#fff}.t{font:500 24px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 20px system-ui,sans-serif;fill:#4a4a4a}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#4a4a4a}.h{font:700 26px system-ui,sans-serif;fill:#4a4a4a}.l{fill:none;stroke:#4a4a4a;stroke-width:2}.a{fill:none;stroke:#4a4a4a;stroke-width:4}.d{fill:none;stroke:#4a4a4a;stroke-width:2;stroke-dasharray:6 5}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.t{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.h{fill:#c8c8c8}.l{stroke:#c8c8c8}.a{stroke:#c8c8c8}.d{stroke:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><line x1="457.437974055408" y1="75.76823965537345" x2="282.562025944592" y2="159.23176034462654" class="l"/><line x1="502.562025944592" y1="75.76823965537346" x2="677.437974055408" y2="159.23176034462654" class="l"/><line x1="260" y1="195" x2="260" y2="230" class="l"/><circle cx="480" cy="65" r="25" class="l"/><text x="480" y="72" class="m" text-anchor="middle">4</text><circle cx="260" cy="170" r="25" class="l"/><text x="260" y="177" class="m" text-anchor="middle">6</text><circle cx="700" cy="170" r="25" class="a"/><text x="700" y="177" class="m" text-anchor="middle">9</text><circle cx="260" cy="255" r="25" class="l"/><text x="260" y="262" class="m" text-anchor="middle">7</text><text x="340" y="105" class="m" text-anchor="middle">+2</text><text x="620" y="105" class="m" text-anchor="middle">+5</text><text x="305" y="215" class="m" text-anchor="middle">+1</text><text x="770" y="175" class="t" text-anchor="start">7 초과</text><line x1="680" y1="215" x2="720" y2="255" class="d"/><line x1="720" y1="215" x2="680" y2="255" class="d"/><text x="700" y="28