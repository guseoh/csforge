<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dynamic-array-resize-title dynamic-array-resize-desc"><title id="dynamic-array-resize-title">동적 배열 확장 · 기존 배열에서 새 배열로 복사</title><desc id="dynamic-array-resize-desc">용량 4가 가득 찬 배열을 용량 8로 확장한다. 기존 원소 4개를 복사하며 복사 중 두 배열의 저장 공간이 겹친다.</desc><style>.h{font:700 27px system-ui,sans-serif;fill:#767676}.b{font:700 22px system-ui,sans-serif;fill:#767676}.s{font:400 19px system-ui,sans-serif;fill:#767676}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#767676}.p{fill:none;stroke:#767676;stroke-width:2}.v{fill:none;stroke:#767676;stroke-width:3.5}.n{fill:none;stroke:#767676;stroke-width:2.5}.l{stroke:#767676;stroke-width:2;fill:none}.d{stroke:#767676;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#767676}</style><text x="30" y="86" class="b" text-anchor="start">기존 배열 · size=4 · capacity=4</text><rect x="50" y="108" width="92" height="58" rx="5" class="p"/><text x="96" y="145" class="m" text-anchor="middle">A</text><rect x="142" y="108" width="92" height="58" rx="5" class="p"/><text x="188" y="145" class="m" text-anchor="middle">B</text><rect x="234" y="108" width="92" height="58" rx="5" class="p"/><text x="280" y="145" class="m" text-anchor="middle">C</text><rect x="326" y="108" width="92" height="58" rx="5" class="p"/><text x="372" y="145" class="m" text-anchor="middle">D</text><line x1="480" y1="190" x2="480" y2="226" class="l"/><polygon class="arrow" points="480,226 485,217 475,217"/><text x="510" y="210" class="s" text-anchor="start">기존 원소 복사</text><text x="30" y="270" class="b" text-anchor="start">새 배열 · size=4 · capacity=8</text><rect x="50" y="290" width="92" height="58" rx="5" class="v"/><text x="96" y="327" class="m" text-anchor="middle">A</text><rect x="142" y="290" width="92" height="58" rx="5" class="v"/><text x="188" y="327" class="m" text-anchor="middle">B</text><rect x="234" y="290" width="92" height="58" rx="5" class="v"/><text x="280" y="327" class="m" text-anchor="middle">C</text><rect x="326" y="290" width="92" height="58" rx="5" class="v"/><text x="372" y="327" class="m" text-anchor="middle">D</text><rect x="418" y="290" width="92" height="58" rx="5" class="p"/><text x="464" y="327" class="m" text-anchor="middle">·</text><rect x="510" y="290" width="92" height="58" rx="5" class="p"/><text x="556" y="327" class="m" text-anchor="middle">·</text><rect x="602" y="290" width="92" height="58" rx="5" class="p"/><text x="648" y="327" class="m" text-anchor="middle">·</text><rect x="694" y="290" width="92" height="58" rx="5" class="p"/><text x="740" y="327" class="m" text-anchor="middle">·</text><text x="30" y="357" class="s" text-anchor="start">확장 중에는 기존 배열과 새 배열의 메모리가 동시에 필요합니다.</text></svg>
