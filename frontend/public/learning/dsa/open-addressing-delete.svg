<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="open-addressing-delete-title open-addressing-delete-desc"><title id="open-addressing-delete-title">선형 탐사 삭제 · EMPTY와 DELETED의 차이</title><desc id="open-addressing-delete-desc">A가 슬롯 3, B가 충돌 후 슬롯 4에 저장되어 있다. A 삭제 후 슬롯 3을 DELETED로 남기면 B 검색은 계속된다. EMPTY라면 그 자리에서 검색이 종료되어 B를 놓친다.</desc><style>.canvas{fill:#fff}.h{font:700 27px system-ui,sans-serif;fill:#4a4a4a}.b{font:700 22px system-ui,sans-serif;fill:#4a4a4a}.s{font:400 19px system-ui,sans-serif;fill:#4a4a4a}.m{font:700 20px ui-monospace,Consolas,monospace;fill:#4a4a4a}.p{fill:none;stroke:#4a4a4a;stroke-width:2}.v{fill:none;stroke:#4a4a4a;stroke-width:3.5}.n{fill:none;stroke:#4a4a4a;stroke-width:2.5}.l{stroke:#4a4a4a;stroke-width:2;fill:none}.d{stroke:#4a4a4a;stroke-width:2;stroke-dasharray:7 5;fill:none}.arrow{fill:#4a4a4a}@media(prefers-color-scheme:dark){.canvas{fill:#171717}.h{fill:#c8c8c8}.b{fill:#c8c8c8}.s{fill:#c8c8c8}.m{fill:#c8c8c8}.p{stroke:#c8c8c8}.v{stroke:#c8c8c8}.n{stroke:#c8c8c8}.l{stroke:#c8c8c8}.d{stroke:#c8c8c8}.arrow{fill:#c8c8c8}}</style><rect class="canvas" width="100%" height="100%"/><text x="30" y="82" class="b" text-anchor="start">삭제 전</text><rect x="45" y="105" width="145" height="58" rx="5" class="p"/><text x="117" y="141" class="m" text-anchor="middle">EMPTY</text><text x="117" y="98" class="s" text-anchor="middle">0</text><rect x="190" y="105" width="145" height="58" rx="5" class="p"/><text x="262" y="141" class="m" text-anchor="middle">EMPTY</text><text x="262" y="98" class="s" text-anchor="middle">1</text><rect x="335" y="105" width="145" height="58" rx="5" class="p"/><text x="407" y="141" class="m" text-anchor="middle">EMPTY</text><text x="407" y="98" class="s" text-anchor="middle">2</text><rect x="480" y="105" width="145" height="58" rx="5" class="v"/><text x="552" y="141" class="m" text-anchor="middle">A</text><text x="552" y="98" class="s" text-anchor="middle">3</text><rect x="625" y="105" width="145" height="58" rx="5" class="v"/><text x="697" y="141" class="m" text-anchor="middle">B</text><text x="697" y="98" class="s" text-anchor="middle">4</text><rect x="770" y="105" width="145" height="58" rx="5" class="p"/><text x="842" y="141" class="m" text-anchor="middle">EMPTY</text><text x="842" y="98" class="s" text-anchor="middle">5</text><text x="30" y="212" class="b" text-anchor="start">A 삭제 후 · 슬롯 3은 DELETED</text><rect x="45" y="235" width="145" height="58" rx="5" class="p"/><text x="117" y="271" class="m" text-anchor="middle">EMPTY</text><rect x="190" y="235" width="145" height="58" rx="5" class="p"/><text x="262" y="271" class="m" text-anchor="middle">EMPTY</text><rect x="335" y="235" width="145" height="58" rx="5" class="p"/><text x="407" y="271" class="m" text-anchor="middle">EMPTY</text><rect x="480" y="235" width="145" height="58" rx="5" class="v"/><text x="552" y="271" class="m" text-anchor="middle">DELETED</text><rect x="625" y="235" width="145" height="58" rx="5" class="v"/><text x="697" y="271" class="m" text-anchor="middle">B</text><rect x="770" y="235" width="145" height="58" rx="5" class="p"/><text x="842" y="271" class="m" text-anchor="middle">EMPTY</text><line x1="552" y1="315" x2="697" y2="315" class="l"/><polygon class="arrow" points="697,315 688,310 688,320"/><text x="30" y="350" class="s" text-anchor="start">B 검색: 시작 슬롯 3(DELETED)은 통과 → 슬롯 4에서 B 발견</text></svg>
