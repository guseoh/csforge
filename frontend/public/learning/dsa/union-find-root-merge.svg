<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="union-find-root-merge-title union-find-root-merge-desc"><title id="union-find-root-merge-title">Union–Find · 두 집합의 루트 연결</title><desc id="union-find-root-merge-desc">처음 A,B가 루트 A, C,D가 루트 C. union(B,D)에서 C를 A 아래 연결하는 예. 이후 네 원소의 루트는 A.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><text x="240" y="32" class="h" text-anchor="middle">합치기 전</text><line x1="110" y1="175" x2="110" y2="110" class="l"/><path d="M 114.79425538604202 118.77582561890372 L 110 110 L 105.20574461395798 118.77582561890372" class="l"/><line x1="355" y1="175" x2="355" y2="110" class="l"/><path d="M 359.79425538604204 118.77582561890372 L 355 110 L 350.20574461395796 118.77582561890372" class="l"/><circle cx="110" cy="85" r="25" class="l"/><text x="110" y="92" class="m" text-anchor="middle">A</text><circle cx="110" cy="200" r="25" class="l"/><text x="110" y="207" class="m" text-anchor="middle">B</text><circle cx="355" cy="85" r="25" class="l"/><text x="355" y="92" class="m" text-anchor="middle">C</text><circle cx="355" cy="200" r="25" class="l"/><text x="355" y="207" class="m" text-anchor="middle">D</text><text x="720" y="32" class="h" text-anchor="middle">union(B, D) 이후</text><line x1="620" y1="150" x2="700" y2="90" class="l"/><path d="M 695.8558927365023 99.10089968017586 L 700 90 L 690.1027862732518 91.43009106250861" class="l"/><line x1="820" y1="150" x2="740" y2="90" class="a"/><path d="M 749.8972137267482 91.43009106250861 L 740 90 L 744.1441072634977 99.10089968017586" class="a"/><line x1="840" y1="225" x2="840" y2="190" class="l"/><path d="M 844.794255386042 198.77582561890372 L 840 190 L 835.205744613958 198.77582561890372" class="l"/><circle cx="720" cy="75" r="25" class="a"/><text x="720" y="82" class="m" text-anchor="middle">A</text><circle cx="600" cy="165" r="25" class="l"/><text x="600" y="172" class="m" text-anchor="middle">B</text><circle cx="840" cy="165" r="25" class="a"/><text x="840" y="172" class="m" text-anchor="middle">C</text><circle cx="840" cy="250" r="25" class="l"/><text x="840" y="257" class="m" text-anchor="middle">D</text><line x1="410" y1="150" x2="530" y2="150" class="a"/><path d="M 521.2241743810963 154.79425538604204 L 530 150 L 521.2241743810963 145.20574461395796" class="a"/><text x="240" y="270" class="s" text-anchor="middle">find(B)=A · find(D)=C</text><text x="720" y="295" class="s" text-anchor="middle">find(B)=find(D)=A</text></svg>
