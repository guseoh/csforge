<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="union-find-root-merge-title union-find-root-merge-desc"><title id="union-find-root-merge-title">Union–Find · 두 집합의 루트 연결</title><desc id="union-find-root-merge-desc">처음 A,B가 루트 A, C,D가 루트 C. union(B,D)에서 C를 A 아래 연결하는 예. 이후 네 원소의 루트는 A.</desc><style>.t{font:500 24px system-ui,sans-serif;fill:#767676}.s{font:400 20px system-ui,sans-serif;fill:#767676}.m{font:600 22px ui-monospace,Consolas,monospace;fill:#767676}.h{font:700 26px system-ui,sans-serif;fill:#767676}.l{fill:none;stroke:#767676;stroke-width:2}.a{fill:none;stroke:#767676;stroke-width:4}.d{fill:none;stroke:#767676;stroke-width:2;stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#767676"/></marker></defs><text x="225" y="37" class="h" text-anchor="middle">합치기 전</text><text x="725" y="37" class="h" text-anchor="middle">union(B, D) 후</text><line x1="100" y1="190" x2="100" y2="116" class="l" marker-end="url(#arrow)"/><line x1="350" y1="190" x2="350" y2="116" class="l" marker-end="url(#arrow)"/><circle cx="100" cy="90" r="25" class="l"/><text x="100" y="97" class="m" text-anchor="middle">A</text><circle cx="100" cy="215" r="25" class="l"/><text x="100" y="222" class="m" text-anchor="middle">B</text><circle cx="350" cy="90" r="25" class="l"/><text x="350" y="97" class="m" text-anchor="middle">C</text><circle cx="350" cy="215" r="25" class="l"/><text x="350" y="222" class="m" text-anchor="middle">D</text><line x1="600" y1="190" x2="600" y2="116" class="l" marker-end="url(#arrow)"/><line x1="850" y1="190" x2="850" y2="116" class="l" marker-end="url(#arrow)"/><line x1="825" y1="90" x2="626" y2="90" class="a" marker-end="url(#arrow)"/><circle cx="600" cy="90" r="25" class="l"/><text x="600" y="97" class="m" text-anchor="middle">A</text><circle cx="600" cy="215" r="25" class="l"/><text x="600" y="222" class="m" text-anchor="middle">B</text><circle cx="850" cy="90" r="25" class="l"/><text x="850" y="97" class="m" text-anchor="middle">C</text><circle cx="850" cy="215" r="25" class="l"/><text x="850" y="222" class="m" text-anchor="middle">D</text><line x1="480" y1="58" x2="480" y2="285" class="d"/><text x="225" y="280" class="s" text-anchor="middle">find(B)=A · find(D)=C</text><text x="725" y="280" class="s" text-anchor="middle">find(B)=find(D)=A</text><text x="480" y="329" class="s" text-anchor="middle">굵은 화살표: C의 parent만 A로 변경 · 나머지 포인터는 유지</text></svg>
