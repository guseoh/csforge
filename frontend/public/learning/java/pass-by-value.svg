<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Java pass-by-value</title><desc id="desc">호출자 변수의 참조 값이 매개변수로 복사되고 매개변수 재대입은 호출자 변수를 바꾸지 않는 흐름.</desc><defs><style>.h{font:700 25px system-ui,sans-serif;fill:#172033}.t{font:500 18px system-ui,sans-serif;fill:#33415c}.box{fill:#eef3ff;stroke:#536da8;stroke-width:2}.obj{fill:#fff4df;stroke:#bb7c2e;stroke-width:2}.new{fill:#e9f8ef;stroke:#3c8b62;stroke-width:2}.a{stroke:#526887;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526887"/></marker></defs><text x="46" y="45" class="h">1. 호출 전</text><rect x="48" y="75" width="205" height="74" rx="12" class="box"/><text x="81" y="107" class="t">Member member</text><text x="104" y="135" class="t">참조 값 A</text><rect x="650" y="65" width="250" height="94" rx="14" class="obj"/><text x="702" y="104" class="h">Member 객체 A</text><text x="728" y="136" class="t">name = "kim"</text><path d="M253 112 H650" class="a"/><text x="46" y="220" class="h">2. 메서드 호출 — 참조 값 A를 복사</text><rect x="48" y="250" width="205" height="74" rx="12" class="box"/><text x="81" y="282" class="t">Member member</text><text x="104" y="310" class="t">참조 값 A</text><rect x="342" y="250" width="205" height="74" rx="12" class="box"/><text x="385" y="282" class="t">Member value</text><text x="398" y="310" class="t">참조 값 A</text><rect x="650" y="240" width="250" height="94" rx="14" class="obj"/><text x="702" y="279" class="h">Member 객체 A</text><text x="728" y="311" class="t">name = "kim"</text><path d="M253 287 C400 360 560 350 650 292" class="a"/><path d="M547 287 H650" class="a"/><text x="46" y="397" class="h">3. value = new Member() 이후</text><rect x="48" y="418" width="205" height="60" rx="12" class="box"/><text x="78" y="454" class="t">member · 참조 A</text><rect x="342" y="418" width="205" height="60" rx="12" class="box"/><text x="377" y="454" class="t">value · 참조 B</text><rect x="650" y="388" width="116" height="76" rx="12" class="obj"/><text x="681" y="432" class="t">객체 A</text><rect x="800" y="388" width="116" height="76" rx="12" class="new"/><text x="831" y="432" class="t">객체 B</text><path d="M253 448 H650" class="a"/><path d="M547 448 C650 485 730 470 800 432" class="a"/></svg>