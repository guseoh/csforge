<svg xmlns="http://www.w3.org/2000/svg" width="560" height="920" viewBox="0 0 560 920" role="img" aria-labelledby="title desc">
  <title id="title">Java pass-by-value</title><desc id="desc">호출 전 member는 A를 가리킨다. 호출 시 참조 값 A가 value로 복사되어 두 변수가 A를 공유한다. value 재대입 후 member는 A, value는 B를 가리킨다.</desc>
  <defs><style>.h{font:700 24px system-ui,sans-serif;fill:#172033}.t{font:500 20px system-ui,sans-serif;fill:#33415c}.box{fill:#eef3ff;stroke:#536da8;stroke-width:2}.obj{fill:#fff4df;stroke:#bb7c2e;stroke-width:2}.new{fill:#e9f8ef;stroke:#3c8b62;stroke-width:2}.a{stroke:#526887;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526887"/></marker></defs>
  <rect width="560" height="920" fill="#fbfafc"/>
  <text x="28" y="42" class="h">1. 호출 전</text>
  <rect x="28" y="70" width="220" height="84" rx="12" class="box"/><text x="48" y="104" class="t">Member member</text><text x="65" y="134" class="t">참조 값 A</text>
  <rect x="330" y="70" width="200" height="84" rx="12" class="obj"/><text x="350" y="104" class="t">Member 객체 A</text><text x="352" y="134" class="t">name = "kim"</text><path d="M248 112H330" class="a"/>
  <text x="28" y="236" class="h">2. 호출 · 참조 값 A를 복사</text>
  <rect x="28" y="266" width="220" height="84" rx="12" class="box"/><text x="48" y="300" class="t">Member member</text><text x="65" y="330" class="t">참조 값 A</text>
  <rect x="28" y="390" width="220" height="84" rx="12" class="box"/><text x="48" y="424" class="t">Member value</text><text x="65" y="454" class="t">참조 값 A</text>
  <rect x="330" y="328" width="200" height="84" rx="12" class="obj"/><text x="350" y="362" class="t">Member 객체 A</text><text x="352" y="392" class="t">name = "kim"</text>
  <path d="M248 308H280V348H330" class="a"/><path d="M248 432H300V390H330" class="a"/>
  <text x="28" y="564" class="h">3. value = new Member() 이후</text>
  <rect x="28" y="602" width="220" height="78" rx="12" class="box"/><text x="45" y="646" class="t">member · 참조 A</text>
  <rect x="330" y="602" width="200" height="78" rx="12" class="obj"/><text x="390" y="646" class="t">객체 A</text><path d="M248 641H330" class="a"/>
  <rect x="28" y="772" width="220" height="78" rx="12" class="box"/><text x="45" y="816" class="t">value · 참조 B</text>
  <rect x="330" y="772" width="200" height="78" rx="12" class="new"/><text x="390" y="816" class="t">객체 B</text><path d="M248 811H330" class="a"/>
  <text x="28" y="895" class="t">매개변수 재대입은 호출자 변수를 바꾸지 않는다.</text>
</svg>
