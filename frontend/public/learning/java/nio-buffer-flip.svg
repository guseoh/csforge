<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
  <title id="title">NIO Buffer의 쓰기와 읽기 전환</title>
  <desc id="desc">용량 4인 같은 네 칸의 A, B, C와 빈 칸은 flip 전후 그대로다. position은 3에서 0으로, limit은 4에서 3으로 바뀌어 앞 세 칸만 읽는다.</desc>
  <rect width="480" height="430" rx="14" fill="#fbfafc"/>
  <g font-family="sans-serif" fill="#292132">
    <text x="34" y="38" font-size="21" font-weight="700">Buffer · 공간은 그대로, 커서만 전환</text>
    <text x="34" y="82" font-size="18" font-weight="700">쓰기 · A, B, C 기록 후</text>
    <text x="34" y="258" font-size="18" font-weight="700">읽기 · 앞의 세 칸만 읽기 가능</text>
  </g>
  <g stroke="#7a5ac7" stroke-width="2">
    <rect x="34" y="100" width="92" height="48" fill="#eee8ff"/><rect x="126" y="100" width="92" height="48" fill="#eee8ff"/><rect x="218" y="100" width="92" height="48" fill="#eee8ff"/><rect x="310" y="100" width="92" height="48" fill="#fbfafc"/>
  </g>
  <g stroke="#35734e" stroke-width="2">
    <rect x="34" y="276" width="92" height="48" fill="#dff4e9"/><rect x="126" y="276" width="92" height="48" fill="#dff4e9"/><rect x="218" y="276" width="92" height="48" fill="#dff4e9"/><rect x="310" y="276" width="92" height="48" fill="#fbfafc"/>
  </g>
  <g font-family="monospace" font-size="22" text-anchor="middle" fill="#39275d">
    <text x="80" y="131">A</text><text x="172" y="131">B</text><text x="264" y="131">C</text><text x="356" y="131">_</text>
    <text x="80" y="307">A</text><text x="172" y="307">B</text><text x="264" y="307">C</text><text x="356" y="307">_</text>
  </g>
  <g font-family="monospace" font-size="17" fill="#51445e">
    <text x="34" y="177">position=3 · limit=capacity=4</text>
    <text x="34" y="355">position=0 · limit=3 · capacity=4</text>
  </g>
  <path d="M218 190v39m-8-10 8 10 8-10" stroke="#7556ad" stroke-width="2" fill="none"/>
  <text x="240" y="216" font-family="monospace" font-size="18" fill="#51445e">flip()</text>
  <path d="M34 269v-8M310 269v-8" stroke="#245b40" stroke-width="3"/>
  <g font-family="sans-serif" font-size="16" fill="#51445e">
    <text x="34" y="392">clear()도 바이트를 지우지 않고</text>
    <text x="34" y="413">다시 쓸 수 있는 범위를 준비한다.</text>
  </g>
</svg>
