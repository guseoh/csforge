<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">ArrayList와 LinkedList의 저장 구조 비교</title>
  <desc id="desc">ArrayList는 연속된 칸에서 index로 접근하고 LinkedList는 노드의 next 연결을 따라간다.</desc>
  <rect width="760" height="250" rx="14" fill="#fbfafc"/>
  <text x="34" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="#292132">ArrayList · 배열 기반</text>
  <text x="34" y="72" font-family="sans-serif" font-size="14" fill="#665c70">index → 위치 계산</text>
  <g stroke="#7a5ac7" stroke-width="2">
    <rect x="34" y="96" width="116" height="52" fill="#eee8ff"/><rect x="150" y="96" width="116" height="52" fill="#eee8ff"/><rect x="266" y="96" width="116" height="52" fill="#eee8ff"/><rect x="382" y="96" width="116" height="52" fill="#eee8ff"/>
  </g>
  <g font-family="monospace" font-size="15" text-anchor="middle" fill="#39275d"><text x="92" y="128">[0] A</text><text x="208" y="128">[1] B</text><text x="324" y="128">[2] C</text><text x="440" y="128">[3] D</text></g>
  <text x="34" y="185" font-family="sans-serif" font-size="14" fill="#665c70">중간 삽입 → 뒤 요소를 이동</text>
  <text x="450" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="#292132">LinkedList · 노드 연결</text>
  <text x="450" y="72" font-family="sans-serif" font-size="14" fill="#665c70">index → 노드를 따라 이동</text>
  <g stroke="#7a5ac7" stroke-width="2" fill="#f4efff">
    <rect x="450" y="96" width="92" height="52" rx="8"/><rect x="584" y="96" width="92" height="52" rx="8"/><rect x="718" y="96" width="8" height="52" rx="4"/>
    <path d="M542 122h34m-7-6 7 6-7 6M676 122h34m-7-6 7 6-7 6" fill="none"/>
  </g>
  <g font-family="monospace" font-size="15" text-anchor="middle" fill="#39275d"><text x="496" y="126">A | next</text><text x="630" y="126">B | next</text></g>
  <text x="450" y="185" font-family="sans-serif" font-size="14" fill="#665c70">위치를 찾은 뒤 연결만 변경</text>
</svg>
