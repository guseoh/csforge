<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Strategy 패턴의 정책 교체 구조</title><desc id="desc">PriceCalculator가 DiscountPolicy 계약에만 의존하고 RateDiscountPolicy와 FixedDiscountPolicy 구현을 바깥에서 선택해 전달하는 구조.</desc><defs><style>.h{font:700 25px system-ui,sans-serif;fill:#172033}.t{font:500 18px system-ui,sans-serif;fill:#33415c}.s{font:600 16px system-ui,sans-serif;fill:#52627a}.box{fill:#eef3ff;stroke:#536da8;stroke-width:2}.contract{fill:#fff4df;stroke:#bb7c2e;stroke-width:2}.impl{fill:#e9f8ef;stroke:#3c8b62;stroke-width:2}.a{stroke:#526887;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#7788a3;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#m2)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526887"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7788a3"/></marker></defs><text x="44" y="48" class="h">Strategy — 안정된 흐름과 교체 가능한 정책</text><rect x="55" y="105" width="235" height="105" rx="14" class="box"/><text x="92" y="145" class="h">PriceCalculator</text><text x="84" y="178" class="t">calculate(price)</text><rect x="365" y="105" width="230" height="105" rx="14" class="contract"/><text x="405" y="145" class="h">DiscountPolicy</text><text x="405" y="178" class="t">discount(price)</text><path d="M290 157 H365" class="a"/><text x="304" y="138" class="s">의존</text><rect x="665" y="70" width="240" height="100" rx="14" class="impl"/><text x="686" y="111" class="h">RateDiscountPolicy</text><text x="716" y="143" class="t">비율 할인 규칙</text><rect x="665" y="235" width="240" height="100" rx="14" class="impl"/><text x="680" y="276" class="h">FixedDiscountPolicy</text><text x="716" y="308" class="t">정액 할인 규칙</text><path d="M665 120 C620 120 620 140 595 140" class="dash"/><path d="M665 285 C620 285 620 185 595 175" class="dash"/><text x="623" y="55" class="s">계약 구현</text><rect x="180" y="355" width="595" height="100" rx="14" class="box"/><text x="221" y="394" class="h">조립하는 코드가 구현을 선택한다</text><text x="221" y="428" class="t">new PriceCalculator(new RateDiscountPolicy(...))</text><path d="M478 355 V225" class="a"/><text x="493" y="310" class="s">생성 시 주입</text></svg>