<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">JDK dynamic proxy invocation flow</title>
  <desc id="desc">Caller가 interface proxy를 호출하고 InvocationHandler가 공통 로직을 수행한 뒤 target을 호출하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.accent{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.target{fill:#18352e;stroke:#4cc090;stroke-width:2}.line{stroke:#a56df4;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1100" height="430" rx="20"/>
  <text class="title" x="48" y="55">호출이 proxy를 지나야 interception이 일어난다</text>
  <rect class="box" x="55" y="135" width="185" height="92" rx="14"/>
  <text class="label" x="111" y="174">Caller</text><text class="small" x="89" y="201">Greeter reference</text>
  <rect class="accent" x="315" y="120" width="220" height="122" rx="14"/>
  <text class="label" x="365" y="163">JDK Proxy</text><text class="small" x="351" y="191">interface implementation</text><text class="small" x="363" y="214">runtime-generated</text>
  <rect class="accent" x="610" y="120" width="230" height="122" rx="14"/>
  <text class="label" x="640" y="163">InvocationHandler</text><text class="small" x="658" y="191">before / policy</text><text class="small" x="666" y="214">delegate call</text>
  <rect class="target" x="900" y="135" width="155" height="92" rx="14"/>
  <text class="label" x="946" y="174">Target</text><text class="small" x="925" y="201">real implementation</text>
  <path class="line" d="M240 181H315"/><text class="small" x="250" y="164">interface call</text>
  <path class="line" d="M535 181H610"/><text class="small" x="545" y="164">invoke(...)</text>
  <path class="line" d="M840 181H900"/><text class="small" x="849" y="164">reflect/delegate</text>
  <path class="line" d="M977 243V310H725"/><text class="small" x="790" y="332">result / exception returns through handler</text>
  <text class="small" x="55" y="385">target을 직접 호출하면 이 proxy/handler 경로를 통과하지 않는다.</text>
</svg>
