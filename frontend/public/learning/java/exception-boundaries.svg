<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Exception propagation and catch boundaries</title>
  <desc id="desc">낮은 계층의 예외가 application service를 거쳐 API boundary에서 의미 있는 응답으로 변환되는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>
      .bg{fill:#17131f}.title{fill:#f5efff;font:700 26px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 18px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.source{fill:#2b2020;stroke:#d67879;stroke-width:2}.service{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.boundary{fill:#19342f;stroke:#4cc090;stroke-width:2}.line{stroke:#a56df4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/>
  <text class="title" x="48" y="56">Catch at the boundary with responsibility</text>
  <text class="small" x="48" y="84">예외를 가까운 곳이 아니라 복구·변환·외부 응답을 책임지는 지점에서 처리한다.</text>
  <rect class="source" x="48" y="145" width="260" height="190" rx="16"/>
  <text class="label" x="78" y="188">Repository</text>
  <text class="small" x="78" y="220">낮은 수준의 실패</text>
  <text class="small" x="78" y="250">SQLException</text>
  <text class="small" x="78" y="280">TimeoutException</text>
  <path class="line" d="M310 240H404"/>
  <rect class="service" x="404" y="145" width="292" height="190" rx="16"/>
  <text class="label" x="434" y="188">Application Service</text>
  <text class="small" x="434" y="220">복구 또는 의미 변환</text>
  <text class="small" x="434" y="250">fallback 실행</text>
  <text class="small" x="434" y="280">원인(cause) 보존</text>
  <path class="line" d="M698 240H792"/>
  <rect class="boundary" x="792" y="145" width="260" height="190" rx="16"/>
  <text class="label" x="822" y="188">API Boundary</text>
  <text class="small" x="822" y="220">외부 계약으로 변환</text>
  <text class="small" x="822" y="250">HTTP status</text>
  <text class="small" x="822" y="280">안전한 error body</text>
  <text class="small" x="48" y="410">catch는 책임이 있을 때만 사용하고, 할 일이 없다면 예외를 호출 스택 위로 전파한다.</text>
</svg>
