<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Java NIO Selector readiness 흐름</title>
  <desc id="desc">여러 non-blocking channel이 관심 operation과 함께 Selector에 등록되고, selection 결과 ready key만 application loop에서 실제 read/write로 처리되는 흐름을 보여 준다. readiness는 전체 메시지 완료를 의미하지 않는다.</desc>
  <rect width="900" height="430" rx="16" fill="#fbfafc"/>
  <text x="40" y="42" font-family="sans-serif" font-size="20" font-weight="700" fill="#292132">Selector는 여러 Channel의 readiness를 한 loop에서 관찰한다</text>

  <g font-family="sans-serif" font-size="14" fill="#302943">
    <rect x="48" y="90" width="190" height="58" rx="10" fill="#f3effb" stroke="#8d78b8"/><text x="143" y="115" text-anchor="middle" font-weight="700">Channel A</text><text x="143" y="136" text-anchor="middle">interest: OP_READ</text>
    <rect x="48" y="177" width="190" height="58" rx="10" fill="#f3effb" stroke="#8d78b8"/><text x="143" y="202" text-anchor="middle" font-weight="700">Channel B</text><text x="143" y="223" text-anchor="middle">interest: OP_WRITE</text>
    <rect x="48" y="264" width="190" height="58" rx="10" fill="#f3effb" stroke="#8d78b8"/><text x="143" y="289" text-anchor="middle" font-weight="700">Channel C</text><text x="143" y="310" text-anchor="middle">interest: OP_READ</text>
  </g>

  <g stroke="#7e6aa6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M240 119 C300 119 310 170 355 170"/>
    <path d="M240 206 L355 206"/>
    <path d="M240 293 C300 293 310 242 355 242"/>
  </g>
  <text x="287" y="188" font-family="sans-serif" font-size="12" fill="#65577f">register</text>

  <rect x="356" y="132" width="206" height="150" rx="14" fill="#eef7ff" stroke="#678bb0" stroke-width="2"/>
  <text x="459" y="163" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#304f6d">Selector</text>
  <text x="459" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#496985">select()</text>
  <rect x="385" y="207" width="148" height="48" rx="8" fill="#ffffff" stroke="#94aec7"/>
  <text x="459" y="227" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#496985">selected-key set</text>
  <text x="459" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#304f6d">현재 ready인 key</text>

  <path d="M564 207 L650 207" stroke="#678bb0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="607" y="193" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#496985">ready key</text>

  <rect x="652" y="104" width="200" height="207" rx="14" fill="#f7f5f0" stroke="#a28f68" stroke-width="2"/>
  <text x="752" y="137" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#604f32">Application loop</text>
  <text x="752" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6e603f">1. key 상태 확인</text>
  <text x="752" y="197" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6e603f">2. 실제 read / write</text>
  <text x="752" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6e603f">3. partial 결과 처리</text>
  <text x="752" y="251" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6e603f">4. key lifecycle 정리</text>
  <text x="752" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a5a4b">read-ready ≠ message complete</text>

  <rect x="206" y="354" width="488" height="47" rx="9" fill="#fff1ed" stroke="#c77b67"/>
  <text x="450" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a4e40">Readiness는 지금 I/O를 시도할 수 있다는 힌트다.</text>
  <text x="450" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a4e40">한 번의 read로 application message 전체가 완성된다는 보장은 없다.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7e6aa6"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#678bb0"/></marker>
  </defs>
</svg>
