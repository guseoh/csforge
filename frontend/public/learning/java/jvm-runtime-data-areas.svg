<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1070" viewBox="0 0 600 1070" role="img" aria-labelledby="title desc">
  <title id="title">JVM Runtime Data Areas</title><desc id="desc">Thread A와 B의 스택과 프레임은 독립적이다. A의 현재 frame은 왼쪽 바깥 경로로 Order를, B의 현재 frame은 오른쪽 바깥 경로로 User를 참조한다. Heap과 Method Area는 공유 영역이다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd94f5"/></marker><style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 26px Inter,Arial,sans-serif}.label{fill:#eee4fa;font:600 22px Inter,Arial,sans-serif}.small{fill:#c8b6dc;font:500 20px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#9069ae;stroke-width:2}.shared{fill:#2a1d3c;stroke:#bd94f5;stroke-width:2}.thread{fill:#1d1727;stroke:#80648f;stroke-width:2}.frame{fill:#34244a;stroke:#b58cde;stroke-width:2}.line{stroke:#bd94f5;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="600" height="1070" rx="20"/><text class="title" x="30" y="42">JVM Runtime Data Areas</text><text class="small" x="30" y="73">스택은 thread별, 객체·클래스 영역은 공유</text>
  <rect class="thread" x="30" y="100" width="390" height="290" rx="16"/><text class="label" x="58" y="137">Thread A · JVM Stack</text>
  <rect class="frame" x="60" y="160" width="330" height="50" rx="8"/><text class="small" x="80" y="192">frame: method C · 현재</text>
  <rect class="box" x="60" y="222" width="330" height="50" rx="8"/><text class="small" x="80" y="254">frame: method B</text>
  <rect class="box" x="60" y="284" width="330" height="50" rx="8"/><text class="small" x="80" y="316">frame: method A</text><text class="small" x="58" y="366">local variables · operand stack</text>
  <rect class="thread" x="30" y="430" width="390" height="230" rx="16"/><text class="label" x="58" y="468">Thread B · JVM Stack</text>
  <rect class="frame" x="60" y="492" width="330" height="50" rx="8"/><text class="small" x="80" y="524">frame: handle() · 현재</text>
  <rect class="box" x="60" y="554" width="330" height="50" rx="8"/><text class="small" x="80" y="586">frame: main()</text><text class="small" x="58" y="640">스택·프레임은 다른 thread와 독립</text>
  <rect class="shared" x="30" y="730" width="540" height="155" rx="16"/><text class="label" x="60" y="770">Heap · 공유</text>
  <rect class="box" x="60" y="795" width="200" height="60" rx="8"/><text class="label" x="120" y="833">Order</text>
  <rect class="box" x="300" y="795" width="200" height="60" rx="8"/><text class="label" x="360" y="833">User</text>
  <path class="line" d="M60 185H15V825H60"/><path class="line" d="M390 517H585V825H500"/>
  <text class="small" x="445" y="700">references</text>
  <rect class="shared" x="30" y="916" width="540" height="96" rx="16"/><text class="label" x="60" y="950">Method Area · 공유</text><text class="small" x="60" y="986">class metadata · runtime constant pool</text>
  <text class="small" x="30" y="1047">JVMS 추상 모델 ≠ HotSpot의 실제 물리 배치</text>
</svg>
