<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">Stream pipeline의 지연 실행</title>
  <desc id="desc">source에서 시작한 원소가 filter와 map을 거쳐 terminal operation에서 실행된다.</desc>
  <style>:root{--surface:#fff;--text:#202020;--muted:#525252;--node:#f2f2f2;--contrast:#e0e0e0;--line:#626262}@media(prefers-color-scheme:dark){:root{--surface:#171717;--text:#eee;--muted:#c4c4c4;--node:#292929;--contrast:#383838;--line:#aaa}}</style>
  <rect width="760" height="210" rx="14" fill="var(--surface)"/>
  <text x="34" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="var(--text)">중간 연산은 선을 그리고, terminal 연산이 흐르게 한다</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="34" y="86" width="136" height="54" rx="9" fill="var(--node)" stroke="var(--line)" stroke-width="2"/><text x="102" y="119" fill="var(--text)">Source</text>
    <rect x="226" y="86" width="136" height="54" rx="9" fill="var(--node)" stroke="var(--line)" stroke-width="2"/><text x="294" y="119" fill="var(--text)">filter</text>
    <rect x="418" y="86" width="136" height="54" rx="9" fill="var(--node)" stroke="var(--line)" stroke-width="2"/><text x="486" y="119" fill="var(--text)">map</text>
    <rect x="610" y="86" width="116" height="54" rx="9" fill="var(--contrast)" stroke="var(--line)" stroke-width="2"/><text x="668" y="119" fill="var(--text)">collect</text>
  </g>
  <g stroke="var(--line)" stroke-width="2" fill="none"><path d="M170 113h48m-8-7 8 7-8 7M362 113h48m-8-7 8 7-8 7M554 113h48m-8-7 8 7-8 7"/></g>
  <text x="34" y="178" font-family="sans-serif" font-size="14" fill="var(--muted)">filter·map은 pipeline만 구성한다 · collect가 호출될 때 source 원소가 실제로 처리된다</text>
</svg>
