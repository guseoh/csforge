<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">Stream pipeline의 지연 실행</title>
  <desc id="desc">source에서 시작한 원소가 filter와 map을 거쳐 terminal operation에서 실행된다.</desc>
  <rect width="760" height="210" rx="14" fill="#fbfafc"/>
  <text x="34" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="#292132">중간 연산은 선을 그리고, terminal 연산이 흐르게 한다</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="34" y="86" width="136" height="54" rx="9" fill="#eee8ff" stroke="#7a5ac7" stroke-width="2"/><text x="102" y="119" fill="#39275d">Source</text>
    <rect x="226" y="86" width="136" height="54" rx="9" fill="#f4efff" stroke="#9c84d6" stroke-width="2"/><text x="294" y="119" fill="#39275d">filter</text>
    <rect x="418" y="86" width="136" height="54" rx="9" fill="#f4efff" stroke="#9c84d6" stroke-width="2"/><text x="486" y="119" fill="#39275d">map</text>
    <rect x="610" y="86" width="116" height="54" rx="9" fill="#dff4e9" stroke="#4b9b71" stroke-width="2"/><text x="668" y="119" fill="#245b40">collect</text>
  </g>
  <g stroke="#7659bd" stroke-width="2" fill="none"><path d="M170 113h48m-8-7 8 7-8 7M362 113h48m-8-7 8 7-8 7M554 113h48m-8-7 8 7-8 7"/></g>
  <text x="34" y="178" font-family="sans-serif" font-size="14" fill="#665c70">filter·map은 pipeline만 구성한다 · collect가 호출될 때 source 원소가 실제로 처리된다</text>
</svg>
