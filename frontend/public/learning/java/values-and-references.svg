<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">원시 값과 참조 값</title><desc id="desc">원시 타입 변수는 값을 직접 복사하고 참조 타입 변수는 같은 객체를 가리키는 참조 값을 복사하는 차이를 보여준다.</desc><defs><style>.t{font:600 24px system-ui,sans-serif;fill:#172033}.s{font:500 18px system-ui,sans-serif;fill:#33415c}.b{fill:#eef3ff;stroke:#536da8;stroke-width:2}.o{fill:#fff4df;stroke:#bb7c2e;stroke-width:2}.a{stroke:#526887;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526887"/></marker></defs><text x="48" y="46" class="t">원시 값 복사</text><rect x="48" y="80" width="170" height="78" rx="12" class="b"/><text x="83" y="112" class="s">int a</text><text x="92" y="141" class="t">10</text><path d="M240 119 H330" class="a"/><rect x="350" y="80" width="170" height="78" rx="12" class="b"/><text x="386" y="112" class="s">int b</text><text x="394" y="141" class="t">10</text><text x="48" y="198" class="s">b를 바꿔도 a의 값은 그대로다.</text><text x="48" y="262" class="t">참조 값 복사</text><rect x="48" y="296" width="170" height="78" rx="12" class="b"/><text x="71" y="328" class="s">Member first</text><text x="84" y="357" class="s">참조 값</text><rect x="350" y="296" width="170" height="78" rx="12" class="b"/><text x="365" y="328" class="s">Member second</text><text x="386" y="357" class="s">참조 값</text><rect x="680" y="280" width="220" height="108" rx="14" class="o"/><text x="724" y="322" class="t">Member 객체</text><text x="724" y="356" class="s">name = "lee"</text><path d="M218 335 C390 420 560 380 680 338" class="a"/><path d="M520 335 H680" class="a"/></svg>