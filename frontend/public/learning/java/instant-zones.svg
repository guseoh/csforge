<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">하나의 Instant와 여러 지역 시간</title>
  <desc id="desc">하나의 절대 시점을 UTC, 서울, 뉴욕의 서로 다른 local time으로 표현한다.</desc>
  <rect width="760" height="240" rx="14" fill="#fbfafc"/>
  <text x="34" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="#292132">같은 순간을 지역 시간으로 표현하기</text>
  <circle cx="380" cy="112" r="35" fill="#eee8ff" stroke="#7a5ac7" stroke-width="3"/><text x="380" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#39275d">Instant</text><text x="380" y="126" text-anchor="middle" font-family="monospace" font-size="11" fill="#39275d">12:00Z</text>
  <g stroke="#8b70ca" stroke-width="2" fill="none"><path d="M344 96 190 72m226 24 154-24m-190 52L190 164m226-36 154 36"/></g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle"><rect x="102" y="48" width="176" height="46" rx="8" fill="#f4efff" stroke="#9c84d6"/><text x="190" y="77" fill="#39275d">UTC 12:00</text><rect x="482" y="48" width="176" height="46" rx="8" fill="#f4efff" stroke="#9c84d6"/><text x="570" y="77" fill="#39275d">서울 21:00</text><rect x="102" y="142" width="176" height="46" rx="8" fill="#f4efff" stroke="#9c84d6"/><text x="190" y="171" fill="#39275d">뉴욕 07:00</text><rect x="482" y="142" width="176" height="46" rx="8" fill="#f4efff" stroke="#9c84d6"/><text x="570" y="171" fill="#39275d">LocalDateTime</text></g>
  <text x="34" y="219" font-family="sans-serif" font-size="13" fill="#665c70">Instant는 순서를 보존하고, ZoneId를 적용한 표현은 지역 규칙에 따라 달라진다</text>
</svg>
