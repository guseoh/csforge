<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">GC Reachability와 Root</title>
  <desc id="desc">GC root에서 도달 가능한 객체와 참조 경로가 끊긴 객체의 비교</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker>
    <style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 26px Inter,Arial,sans-serif}.label{fill:#e5d9f3;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.root{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.live{fill:#18352e;stroke:#4cc090;stroke-width:2}.dead{fill:#25212b;stroke:#64596f;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}.deadline{stroke:#64596f;stroke-width:2;fill:none;stroke-dasharray:7 7}</style>
  </defs>
  <rect class="bg" width="1100" height="500" rx="20"/><text class="title" x="48" y="55">GC Reachability</text><text class="small" x="48" y="82">root에서 strong reference를 따라갈 수 있는지가 핵심 기준이다</text>
  <rect class="root" x="48" y="145" width="185" height="82" rx="14"/><text class="label" x="79" y="180">GC Roots</text><text class="small" x="79" y="204">thread · static · runtime</text>
  <rect class="live" x="320" y="115" width="170" height="76" rx="14"/><text class="label" x="373" y="158">Cache</text><text class="small" x="350" y="180">reachable</text>
  <rect class="live" x="575" y="85" width="170" height="76" rx="14"/><text class="label" x="625" y="128">User A</text><text class="small" x="620" y="150">reachable</text>
  <rect class="live" x="825" y="85" width="170" height="76" rx="14"/><text class="label" x="865" y="128">Address A</text><text class="small" x="875" y="150">reachable</text>
  <path class="line" d="M233 178H320"/><path class="line" d="M490 150L575 125"/><path class="line" d="M745 123H825"/>
  <rect class="dead" x="320" y="300" width="170" height="76" rx="14"/><text class="label" x="368" y="343">Session C</text><text class="small" x="359" y="365">unreachable</text>
  <rect class="dead" x="575" y="300" width="170" height="76" rx="14"/><text class="label" x="632" y="343">Payload</text><text class="small" x="614" y="365">reclaim candidate</text>
  <path class="deadline" d="M233 207C275 250 300 313 320 337"/><path class="deadline" d="M490 338H575"/>
  <text class="small" x="48" y="438">unreachable은 즉시 삭제가 아니라, 다음 collector cycle에서 회수할 수 있는 상태다.</text>
</svg>
