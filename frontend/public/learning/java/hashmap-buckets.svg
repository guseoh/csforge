<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title desc">
  <title id="title">HashMap hash bucket lookup</title><desc id="desc">get 조회는 key의 hash로 bucket을 찾고 후보 key를 equals로 확인한다. 같은 key이면 value를 반환하고 다르면 다음 entry를 확인한다. 매핑 교체는 put 동작이다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd94f5"/></marker><style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 26px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 22px Inter,Arial,sans-serif}.small{fill:#c8b6dc;font:500 20px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#9069ae;stroke-width:2}.active{fill:#2a1d3c;stroke:#bd94f5;stroke-width:2}.node{fill:#18352e;stroke:#61d4a2;stroke-width:2}.line{stroke:#bd94f5;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="560" height="680" rx="20"/><text class="title" x="30" y="43">HashMap · get 조회 흐름</text><text class="small" x="30" y="77">hash로 후보를 찾고 key equality를 확인</text>
  <rect class="box" x="30" y="112" width="180" height="68" rx="12"/><text class="label" x="92" y="154">key</text><path class="line" d="M210 146H300"/>
  <rect class="active" x="300" y="112" width="220" height="68" rx="12"/><text class="label" x="350" y="142">hash(key)</text><text class="small" x="343" y="168">hash → index</text><path class="line" d="M410 180V215H120V250"/>
  <rect class="active" x="30" y="250" width="180" height="68" rx="12"/><text class="label" x="60" y="292">bucket[3]</text><path class="line" d="M210 284H280"/>
  <rect class="node" x="280" y="250" width="240" height="68" rx="12"/><text class="small" x="305" y="291">entry: "kim" → 1</text><path class="line" d="M400 318V354"/>
  <rect class="node" x="280" y="354" width="240" height="68" rx="12"/><text class="small" x="305" y="395">entry: "lee" → 2</text><text class="small" x="30" y="365">충돌 후보</text>
  <path class="line" d="M120 318V470"/><rect class="box" x="30" y="470" width="180" height="68" rx="12"/><text class="label" x="62" y="512">equals()</text><path class="line" d="M210 504H260"/>
  <text class="small" x="270" y="493">같은 key → value 반환</text><text class="small" x="270" y="527">다르면 다음 entry</text>
  <text class="small" x="30" y="600">get은 매핑을 교체하지 않는다.</text><text class="small" x="30" y="634">가변 key 변경은 조회 경로를 바꿀 수 있다.</text>
</svg>
