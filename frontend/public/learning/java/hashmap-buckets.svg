<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">HashMap hash bucket lookup</title>
  <desc id="desc">key의 hash에서 bucket을 찾고 collision이 있으면 equals로 같은 key를 확인하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker><style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.active{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.node{fill:#18352e;stroke:#4cc090;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1100" height="430" rx="20"/><text class="title" x="48" y="53">HashMap 조회 흐름</text><text class="small" x="48" y="80">hash만으로 끝나지 않고 bucket 안에서 key equality를 확인한다</text>
  <rect class="box" x="48" y="150" width="160" height="76" rx="13"/><text class="label" x="93" y="196">key</text><path class="line" d="M208 188H282"/>
  <rect class="active" x="282" y="150" width="190" height="76" rx="13"/><text class="label" x="329" y="181">hash(key)</text><text class="small" x="324" y="204">hash → index</text><path class="line" d="M472 188H546"/>
  <rect class="active" x="546" y="150" width="180" height="76" rx="13"/><text class="label" x="591" y="181">bucket[3]</text><text class="small" x="580" y="204">collision 후보</text><path class="line" d="M726 188H795"/>
  <rect class="node" x="795" y="112" width="220" height="62" rx="11"/><text class="small" x="820" y="149">entry: "kim" → 1</text><rect class="node" x="795" y="195" width="220" height="62" rx="11"/><text class="small" x="820" y="232">entry: "lee" → 2</text>
  <path class="line" d="M885 174V195"/><rect class="box" x="546" y="290" width="180" height="62" rx="11"/><text class="label" x="597" y="328">equals()</text><path class="line" d="M726 321H795"/><text class="small" x="795" y="322">같은 key면 교체, 아니면 다음 entry</text>
  <text class="small" x="48" y="390">mutable key를 저장 후 변경하면 hash/equality 경로가 달라져 entry를 찾지 못할 수 있다.</text>
</svg>
