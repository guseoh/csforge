<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Java 배열 공변성과 런타임 저장 검사</title><desc id="desc">Object 배열 타입 변수로 String 배열을 가리킨 뒤 Integer 저장 시 컴파일은 통과하지만 실제 배열 타입 검사에서 ArrayStoreException이 발생하는 흐름.</desc><defs><style>.h{font:700 25px system-ui,sans-serif;fill:#172033}.t{font:500 18px system-ui,sans-serif;fill:#33415c}.b{fill:#eef3ff;stroke:#536da8;stroke-width:2}.o{fill:#fff4df;stroke:#bb7c2e;stroke-width:2}.e{fill:#fff0f2;stroke:#b24b5d;stroke-width:2}.a{stroke:#526887;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526887"/></marker></defs><text x="45" y="45" class="h">컴파일 시점</text><rect x="45" y="78" width="250" height="90" rx="13" class="b"/><text x="82" y="116" class="t">Object[] values</text><text x="72" y="147" class="t">선언 타입: Object[]</text><rect x="382" y="78" width="250" height="90" rx="13" class="b"/><text x="414" y="116" class="t">values[0] = 1</text><text x="405" y="147" class="t">Integer는 Object → 허용</text><path d="M295 123 H382" class="a"/><text x="45" y="245" class="h">실행 시점</text><rect x="45" y="278" width="250" height="95" rx="13" class="o"/><text x="78" y="318" class="t">실제 배열 객체</text><text x="92" y="351" class="h">String[]</text><rect x="382" y="278" width="250" height="95" rx="13" class="b"/><text x="422" y="318" class="t">Integer 저장 시도</text><text x="415" y="351" class="t">실제 component 검사</text><rect x="700" y="278" width="230" height="95" rx="13" class="e"/><text x="720" y="318" class="h">저장 불가</text><text x="718" y="351" class="t">ArrayStoreException</text><path d="M295 325 H382" class="a"/><path d="M632 325 H700" class="a"/><text x="45" y="435" class="t">핵심: 변수의 선언 타입과 실제 배열 객체의 component type을 따로 추적한다.</text></svg>