<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">공유 counter의 lost update</title>
  <desc id="desc">두 thread가 같은 값을 읽은 뒤 각각 1을 저장해 한 번의 증가가 사라진다.</desc>
  <rect width="760" height="270" rx="14" fill="#fbfafc"/>
  <text x="34" y="40" font-family="sans-serif" font-size="18" font-weight="700" fill="#292132">counter++는 한 줄이어도 세 단계다</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle"><rect x="80" y="70" width="170" height="42" rx="8" fill="#eee8ff" stroke="#7a5ac7" stroke-width="2"/><text x="165" y="97" fill="#39275d">Thread A: read 0</text><rect x="510" y="70" width="170" height="42" rx="8" fill="#eee8ff" stroke="#7a5ac7" stroke-width="2"/><text x="595" y="97" fill="#39275d">Thread B: read 0</text><rect x="80" y="144" width="170" height="42" rx="8" fill="#f4efff" stroke="#9c84d6" stroke-width="2"/><text x="165" y="171" fill="#39275d">compute 0 + 1</text><rect x="510" y="144" width="170" height="42" rx="8" fill="#f4efff" stroke="#9c84d6" stroke-width="2"/><text x="595" y="171" fill="#39275d">compute 0 + 1</text><rect x="295" y="212" width="170" height="42" rx="8" fill="#ffe9e9" stroke="#c76c76" stroke-width="2"/><text x="380" y="239" fill="#7d3038">둘 다 write 1 → lost update</text></g>
  <g stroke="#8b70ca" stroke-width="2" fill="none"><path d="M165 112v24m0-8-6 8 6 8 6-8M595 112v24m0-8-6 8 6 8 6-8M250 165h40m-8-7 8 7-8 7M510 165h-40m8-7-8 7 8 7M250 186l45 30m-9-2 9 2-2-9M510 186l-45 30m9-2-9 2 2-9"/></g>
</svg>
