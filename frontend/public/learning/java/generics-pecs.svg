<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">PECS Producer Extends Consumer Super</title>
  <desc id="desc">extends는 값을 읽는 방향, super는 값을 넣는 방향을 표현하는 비교 diagram</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56df4"/></marker><style>.bg{fill:#17131f}.title{fill:#f5efff;font:700 25px Inter,Arial,sans-serif}.label{fill:#f0e8fa;font:650 17px Inter,Arial,sans-serif}.small{fill:#a797b5;font:500 14px Inter,Arial,sans-serif}.producer{fill:#18352e;stroke:#4cc090;stroke-width:2}.consumer{fill:#2a1d3c;stroke:#a56df4;stroke-width:2}.box{fill:#21192e;stroke:#6d478f;stroke-width:2}.line{stroke:#a56df4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1100" height="430" rx="20"/><text class="title" x="48" y="53">PECS = Producer Extends · Consumer Super</text>
  <rect class="producer" x="48" y="112" width="450" height="230" rx="16"/><text class="label" x="78" y="155">Producer · ? extends Number</text><text class="small" x="78" y="185">List&lt;Integer&gt; 또는 List&lt;Double&gt;를 받을 수 있음</text><rect class="box" x="78" y="220" width="180" height="63" rx="10"/><text class="small" x="111" y="258">List&lt;? extends Number&gt;</text><path class="line" d="M258 252H430"/><text class="label" x="347" y="234">읽기</text><text class="small" x="319" y="280">Number로 안전하게 꺼냄</text>
  <rect class="consumer" x="602" y="112" width="450" height="230" rx="16"/><text class="label" x="632" y="155">Consumer · ? super Integer</text><text class="small" x="632" y="185">List&lt;Integer&gt;, List&lt;Number&gt;, List&lt;Object&gt;에 넣을 수 있음</text><path class="line" d="M622 252H794"/><text class="label" x="671" y="234">쓰기</text><rect class="box" x="794" y="220" width="210" height="63" rx="10"/><text class="small" x="826" y="258">List&lt;? super Integer&gt;</text>
  <text class="small" x="48" y="387">API가 데이터를 어느 방향으로 사용하는지 먼저 그리면 wildcard 경계가 자연스럽게 결정된다.</text>
</svg>
