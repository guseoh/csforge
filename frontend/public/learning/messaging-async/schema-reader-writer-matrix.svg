<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="schema-reader-writer-matrix-title schema-reader-writer-matrix-desc"><title id="schema-reader-writer-matrix-title">스키마 읽기·쓰기 호환성 매트릭스</title><desc id="schema-reader-writer-matrix-desc">이전 v1 reader가 신규 v2 데이터 읽기 가능은 FORWARD. 신규 v2 reader가 이전 v1 데이터 읽기 가능은 BACKWARD. FULL은 둘 다. 전이 정책은 이전 여러 버전 검사.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="475"/><text x="480" y="32" class="h" text-anchor="middle">스키마 호환성 · 누가 어떤 버전을 읽을 수 있는가</text><text x="480" y="66" class="s" text-anchor="middle">Confluent Schema Registry 용어</text><text x="555" y="112" class="h" text-anchor="middle">데이터를 기록한 스키마</text><text x="390" y="153" class="m" text-anchor="middle">v1 (이전)</text><text x="730" y="153" class="m" text-anchor="middle">v2 (신규)</text><text x="35" y="224" class="m" text-anchor="start">v1 reader</text><text x="35" y="339" class="m" text-anchor="start">v2 reader</text><rect x="230" y="170" width="320" height="95" class="r"/><text x="390" y="210" class="m" text-anchor="middle">같은 버전</text><text x="390" y="240" class="s" text-anchor="middle">기본 읽기</text><rect x="570" y="170" width="320" height="95" class="a"/><text x="730" y="210" class="h" text-anchor="middle">FORWARD</text><text x="730" y="240" class="s" text-anchor="middle">이전 reader → 신규 데이터</text><rect x="230" y="285" width="320" height="95" class="a"/><text x="390" y="325" class="h" text-anchor="middle">BACKWARD</text><text x="390" y="355" class="s" text-anchor="middle">신규 reader → 이전 데이터</text><rect x="570" y="285" width="320" height="95" class="r"/><text x="730" y="325" class="m" text-anchor="middle">같은 버전</text><text x="730" y="355" class="s" text-anchor="middle">기본 읽기</text><text x="480" y="424" class="s" text-anchor="middle">FULL = 양방향 호환 · TRANSITIVE = 여러 이전 버전까지 검사</text><text x="480" y="453" class="s" text-anchor="middle">형식 호환 검사와 실제 업무 의미·애플리케이션 처리 성공은 별개</text></svg>
