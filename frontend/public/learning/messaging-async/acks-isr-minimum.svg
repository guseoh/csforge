<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="acks-isr-minimum-title acks-isr-minimum-desc"><title id="acks-isr-minimum-title">Producer ACK · ISR과 최소 복제 조건</title><desc id="acks-isr-minimum-desc">복제본 A B C의 RF3, min ISR2, acks all에서 ISR3은 세 복제본 확인, ISR2는 두 복제본 확인, ISR1은 최소 조건 미달로 성공 불가. ELR 미사용 일반 조건.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="475"/><text x="480" y="32" class="h" text-anchor="middle">RF=3 · acks=all · min.insync.replicas=2 · ELR 미사용</text><text x="45" y="92" class="m" text-anchor="start">현재 ISR</text><text x="305" y="92" class="m" text-anchor="middle">리더 A</text><text x="475" y="92" class="m" text-anchor="middle">복제본 B</text><text x="645" y="92" class="m" text-anchor="middle">복제본 C</text><text x="855" y="92" class="m" text-anchor="middle">확인 조건</text><text x="45" y="152" class="m" text-anchor="start">ISR 3</text><rect x="230" y="120" width="150" height="53" class="a"/><text x="305" y="152.5" class="m" text-anchor="middle">ISR 포함</text><rect x="400" y="120" width="150" height="53" class="a"/><text x="475" y="152.5" class="m" text-anchor="middle">ISR 포함</text><rect x="570" y="120" width="150" height="53" class="a"/><text x="645" y="152.5" class="m" text-anchor="middle">ISR 포함</text><text x="855" y="145" class="m" text-anchor="middle">3개 확인</text><text x="855" y="168" class="s" text-anchor="middle">성공 가능</text><text x="45" y="247" class="m" text-anchor="start">ISR 2</text><rect x="230" y="215" width="150" height="53" class="a"/><text x="305" y="247.5" class="m" text-anchor="middle">ISR 포함</text><rect x="400" y="215" width="150" height="53" class="a"/><text x="475" y="247.5" class="m" text-anchor="middle">ISR 포함</text><rect x="570" y="215" width="150" height="53" class="r"/><text x="645" y="247.5" class="m" text-anchor="middle">ISR 제외</text><text x="855" y="240" class="m" text-anchor="middle">2개 확인</text><text x="855" y="263" class="s" text-anchor="middle">성공 가능</text><text x="45" y="342" class="m" text-anchor="start">ISR 1</text><rect x="230" y="310" width="150" height="53" class="a"/><text x="305" y="342.5" class="m" text-anchor="middle">ISR 포함</text><rect x="400" y="310" width="150" height="53" class="r"/><text x="475" y="342.5" class="m" text-anchor="middle">ISR 제외</text><rect x="570" y="310" width="150" height="53" class="r"/><text x="645" y="342.5" class="m" text-anchor="middle">ISR 제외</text><text x="855" y="335" class="m" text-anchor="middle">최소값 미달</text><text x="855" y="358" class="s" text-anchor="middle">성공 불가</text><text x="480" y="424" class="s" text-anchor="middle">굵은 칸: 현재 ISR 구성원 · 구성 복제본 수는 세 경우 모두 3</text><text x="480" y="452" class="s" text-anchor="middle">ack 성공은 Consumer 업무 완료와 다름 · ISR 변화와 전송 오류는 별도</text></svg>
