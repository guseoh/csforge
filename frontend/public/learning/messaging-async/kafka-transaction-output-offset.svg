<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="kafka-transaction-output-offset-title kafka-transaction-output-offset-desc"><title id="kafka-transaction-output-offset-title">Kafka 트랜잭션 · 출력과 오프셋의 원자적 확정</title><desc id="kafka-transaction-output-offset-desc">M42 처리 후 Kafka transaction 안에 출력 레코드와 소비 위치43을 함께 기록. commit 또는 abort로 묶이며 다운스트림 read_committed가 중단 출력을 제외. 외부 자원은 별도.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="390"/><text x="480" y="32" class="h" text-anchor="middle">Kafka consume → process → produce · 트랜잭션 경계</text><rect x="40" y="115" width="210" height="54" class="r"/><text x="145" y="148" class="m" text-anchor="middle">Input P0 : M42</text><line x1="250" y1="142" x2="315" y2="142" class="strong" marker-end="url(#arrow)"/><rect x="315" y="70" width="600" height="230" class="a"/><text x="615" y="103" class="h" text-anchor="middle">Kafka 트랜잭션</text><rect x="350" y="125" width="245" height="52" class="r"/><text x="472.5" y="157" class="m" text-anchor="middle">output record</text><rect x="635" y="125" width="245" height="52" class="r"/><text x="757.5" y="157" class="m" text-anchor="middle">offset = 43</text><text x="615" y="215" class="m" text-anchor="middle">함께 commit / abort</text><text x="615" y="250" class="s" text-anchor="middle">다운스트림 read_committed</text><text x="480" y="340" class="s" text-anchor="middle">외부 PostgreSQL / 결제 / 이메일은 이 트랜잭션에 참여하지 않음</text><text x="480" y="368" class="s" text-anchor="middle">외부 효과의 멱등성·결과 대사는 별도 계약</text></svg>
