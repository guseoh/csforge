<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="retry-blocking-vs-isolation-title retry-blocking-vs-isolation-desc"><title id="retry-blocking-vs-isolation-title">재시도 · 선두 차단과 실패 격리</title><desc id="retry-blocking-vs-isolation-desc">M2 실패 시 제자리 재시도로 M3 M4 대기. 격리 경로에서 M2를 별도 내구성 저장소로 전달한 후 원본 위치를 확정하면 M3 M4 진행 가능, 순서 역전 위험.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="450"/><text x="480" y="32" class="h" text-anchor="middle">같은 파티션의 M2 실패 · 뒤 레코드 처리 비교</text><text x="35" y="90" class="h" text-anchor="start">제자리 재시도</text><rect x="260" y="65" width="155" height="50" class="r"/><text x="337.5" y="96" class="m" text-anchor="middle">M1 완료</text><rect x="425" y="65" width="155" height="50" class="a"/><text x="502.5" y="96" class="m" text-anchor="middle">M2 실패</text><rect x="590" y="65" width="155" height="50" class="r"/><text x="667.5" y="96" class="m" text-anchor="middle">M3 대기</text><rect x="755" y="65" width="155" height="50" class="r"/><text x="832.5" y="96" class="m" text-anchor="middle">M4 대기</text><path d="M445 115 V158 H560 V115" class="strong" marker-end="url(#arrow)"/><text x="502" y="181" class="s" text-anchor="middle">제한된 retry</text><line x1="40" y1="205" x2="920" y2="205" class="d"/><text x="35" y="255" class="h" text-anchor="start">격리 경로</text><rect x="260" y="230" width="155" height="50" class="r"/><text x="337.5" y="261" class="m" text-anchor="middle">M1 완료</text><rect x="425" y="230" width="155" height="50" class="a"/><text x="502.5" y="261" class="m" text-anchor="middle">M2 실패</text><rect x="590" y="230" width="155" height="50" class="r"/><text x="667.5" y="261" class="m" text-anchor="middle">M3 진행</text><rect x="755" y="230" width="155" height="50" class="r"/><text x="832.5" y="261" class="m" text-anchor="middle">M4 진행</text><line x1="502" y1="280" x2="502" y2="328" class="strong" marker-end="url(#arrow)"/><rect x="385" y="328" width="235" height="52" class="a"/><text x="502.5" y="360" class="m" text-anchor="middle">DLQ / retry topic</text><text x="675" y="357" class="s" text-anchor="start">내구성 있게 저장 후</text><text x="675" y="381" class="s" text-anchor="start">원본 위치 확정</text><text x="480" y="425" class="s" text-anchor="middle">원본 순서를 유지해야 하는 업무는 후속 적용을 차단하거나 버전 검사</text></svg>
