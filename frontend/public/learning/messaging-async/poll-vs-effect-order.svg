<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="poll-vs-effect-order-title poll-vs-effect-order-desc"><title id="poll-vs-effect-order-title">파티션 읽기 순서와 업무 완료 순서</title><desc id="poll-vs-effect-order-desc">offset42 Placed를 먼저 읽어 Worker A, 43 Paid를 Worker B로 병렬 위임. B가 먼저 완료하면 업무 적용 순서가 역전될 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="470"/><text x="480" y="32" class="h" text-anchor="middle">같은 파티션 · 읽는 순서와 실제 완료 순서</text><text x="35" y="96" class="m" text-anchor="start">로그</text><rect x="215" y="70" width="220" height="50" class="a"/><text x="325" y="101" class="m" text-anchor="middle">42 : Placed</text><rect x="445" y="70" width="220" height="50" class="r"/><text x="555" y="101" class="m" text-anchor="middle">43 : Paid</text><line x1="665" y1="95" x2="850" y2="95" class="l" marker-end="url(#arrow)"/><text x="780" y="81" class="s" text-anchor="middle">offset</text><text x="35" y="192" class="m" text-anchor="start">Worker A</text><text x="35" y="282" class="m" text-anchor="start">Worker B</text><line x1="215" y1="165" x2="870" y2="165" class="l"/><line x1="215" y1="255" x2="870" y2="255" class="l"/><rect x="260" y="165" width="535" height="44" class="a"/><text x="527" y="193" class="m" text-anchor="middle">Placed 처리 (느림)</text><rect x="340" y="255" width="200" height="44" class="r"/><text x="440" y="283" class="m" text-anchor="middle">Paid 처리</text><line x1="540" y1="240" x2="540" y2="335" class="d"/><line x1="795" y1="150" x2="795" y2="335" class="d"/><text x="540" y="361" class="m" text-anchor="middle">Paid 완료</text><text x="795" y="361" class="m" text-anchor="middle">Placed 완료</text><line x1="540" y1="383" x2="795" y2="383" class="strong" marker-end="url(#arrow)"/><text x="667" y="408" class="h" text-anchor="middle">완료 순서 역전</text><text x="480" y="448" class="s" text-anchor="middle">순차 적용·키별 직렬 처리·버전/순번 검증 중 필요한 계약 선택</text></svg>
