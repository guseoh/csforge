<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="cmd-vs-evt-title cmd-vs-evt-desc"><title id="cmd-vs-evt-title">명령(Command)과 이벤트(Event)의 의도와 결합 방향 비교</title><desc id="cmd-vs-evt-desc">명령(ChargeOrder)은 특정 수신자에게 작업 수행을 요구하는 1:1 의도 결합이고, 이벤트(OrderPlaced)는 이미 발생한 사실을 브로커에 발행해 다수 컨슈머가 독립 구독하는 구조다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15.5px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:2.8}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:2.8}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">명령(Command)과 이벤트(Event)의 의도 · 결합 비교</text><rect x="36" y="68" width="888" height="122" rx="6" class="r"/><text x="58" y="96" class="t">명령 (Command) — "특정 작업을 수행해 줘"</text><rect x="58" y="114" width="210" height="58" rx="5" class="r"/><text x="163" y="149" class="m" text-anchor="middle">Order Service</text><line x1="268" y1="143" x2="364" y2="143" class="strong" marker-end="url(#arrow)"/><rect x="368" y="114" width="210" height="58" rx="5" class="a"/><text x="473" y="139" class="m" text-anchor="middle">ChargeOrder</text><text x="473" y="162" class="s" text-anchor="middle">단일 대상 · 실행 기대</text><line x1="578" y1="143" x2="674" y2="143" class="strong" marker-end="url(#arrow)"/><rect x="678" y="114" width="224" height="58" rx="5" class="r"/><text x="790" y="149" class="m" text-anchor="middle">Payment Consumer</text><rect x="36" y="210" width="888" height="156" rx="6" class="r"/><text x="58" y="238" class="t">이벤트 (Event) — "이미 확정된 사실이 발생했어"</text><rect x="58" y="276" width="210" height="58" rx="5" class="r"/><text x="163" y="311" class="m" text-anchor="middle">Order Service</text><line x1="268" y1="305" x2="364" y2="305" class="strong" marker-end="url(#arrow)"/><rect x="368" y="276" width="210" height="58" rx="5" class="a"/><text x="473" y="301" class="m" text-anchor="middle">OrderPlaced</text><text x="473" y="324" class="s" text-anchor="middle">불변 사실 · 다수 구독</text><path d="M 578 290 L 626 290 L 626 254 L 674 254" class="l" marker-end="url(#arrow)"/><line x1="578" y1="305" x2="674" y2="305" class="l" marker-end="url(#arrow)"/><path d="M 578 320 L 626 320 L 626 348 L 674 348" class="l" marker-end="url(#arrow)"/><rect x="678" y="236" width="224" height="36" rx="5" class="r"/><text x="790" y="260" class="s" text-anchor="middle">Search Index Consumer</text><rect x="678" y="287" width="224" height="36" rx="5" class="r"/><text x="790" y="311" class="s" text-anchor="middle">Analytics Consumer</text><rect x="678" y="330" width="224" height="36" rx="5" class="r"/><text x="790" y="354" class="s" text-anchor="middle">Notification Consumer</text><text x="480" y="402" class="s" text-anchor="middle">비동기 분리 시 응답 시점과 후처리 완료 시점이 분리되므로 즉시 일관성이 필요한 규칙은 동기 경계에 둔다</text></svg>
