<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="partition-log-assignment-title partition-log-assignment-desc"><title id="partition-log-assignment-title">Kafka 파티션 로그와 Consumer Group 할당</title><desc id="partition-log-assignment-desc">P0 로그 e1 e4 e7, P1 e2 e5, P2 e3 e6. 각 파티션의 예시 오프셋 0부터 증가. 같은 일반 consumer group에서 A B C가 각각 P0 P1 P2 담당, D 미할당.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="520"/><text x="480" y="32" class="h" text-anchor="middle">토픽: order-events · 파티션별 독립 로그</text><text x="450" y="72" class="s" text-anchor="middle">오프셋 증가 방향</text><line x1="250" y1="83" x2="665" y2="83" class="l" marker-end="url(#arrow)"/><text x="45" y="144" class="m" text-anchor="start">P0</text><rect x="145" y="110" width="130" height="55" class="a"/><text x="210" y="143.5" class="m" text-anchor="middle">e1</text><text x="210" y="101" class="s" text-anchor="middle">0</text><rect x="280" y="110" width="130" height="55" class="a"/><text x="345" y="143.5" class="m" text-anchor="middle">e4</text><text x="345" y="101" class="s" text-anchor="middle">1</text><rect x="415" y="110" width="130" height="55" class="a"/><text x="480" y="143.5" class="m" text-anchor="middle">e7</text><text x="480" y="101" class="s" text-anchor="middle">2</text><line x1="575" y1="137" x2="700" y2="137" class="l" marker-end="url(#arrow)"/><rect x="700" y="110" width="210" height="55" class="r"/><text x="805" y="143.5" class="m" text-anchor="middle">Consumer A</text><text x="45" y="234" class="m" text-anchor="start">P1</text><rect x="145" y="200" width="130" height="55" class="r"/><text x="210" y="233.5" class="m" text-anchor="middle">e2</text><text x="210" y="191" class="s" text-anchor="middle">0</text><rect x="280" y="200" width="130" height="55" class="r"/><text x="345" y="233.5" class="m" text-anchor="middle">e5</text><text x="345" y="191" class="s" text-anchor="middle">1</text><line x1="575" y1="227" x2="700" y2="227" class="l" marker-end="url(#arrow)"/><rect x="700" y="200" width="210" height="55" class="r"/><text x="805" y="233.5" class="m" text-anchor="middle">Consumer B</text><text x="45" y="324" class="m" text-anchor="start">P2</text><rect x="145" y="290" width="130" height="55" class="r"/><text x="210" y="323.5" class="m" text-anchor="middle">e3</text><text x="210" y="281" class="s" text-anchor="middle">0</text><rect x="280" y="290" width="130" height="55" class="r"/><text x="345" y="323.5" class="m" text-anchor="middle">e6</text><text x="345" y="281" class="s" text-anchor="middle">1</text><line x1="575" y1="317" x2="700" y2="317" class="l" marker-end="url(#arrow)"/><rect x="700" y="290" width="210" height="55" class="r"/><text x="805" y="323.5" class="m" text-anchor="middle">Consumer C</text><rect x="700" y="390" width="210" height="47" class="r"/><text x="805" y="419.5" class="m" text-anchor="middle">Consumer D</text><text x="650" y="419" class="s" text-anchor="end">미할당</text><text x="480" y="474" class="s" text-anchor="middle">같은 그룹 · 한 파티션을 한 구성원이 담당 · 파티션 간 전역 순서 없음</text><text x="480" y="500" class="s" text-anchor="middle">같은 키의 파티션은 파티셔닝 규칙·파티션 수에 따라 달라질 수 있음</text></svg>
