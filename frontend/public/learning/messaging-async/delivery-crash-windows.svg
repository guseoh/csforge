<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="delivery-crash-windows-title delivery-crash-windows-desc"><title id="delivery-crash-windows-title">전달 보장 · 커밋 순서에 따른 유실과 중복</title><desc id="delivery-crash-windows-desc">M42 처리 전 offset43을 확정하고 장애가 발생하면 43부터 재개하여 M42 효과 누락 가능. DB commit 뒤 offset42가 남은 상태에서 장애라면 42부터 재개하여 중복 가능.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="490"/><text x="480" y="32" class="h" text-anchor="middle">같은 레코드 M42 · 장애 지점에 따른 복구 차이</text><text x="235" y="77" class="h" text-anchor="middle">위치 먼저 확정</text><text x="725" y="77" class="h" text-anchor="middle">업무 먼저 커밋</text><line x1="480" y1="55" x2="480" y2="420" class="d"/><rect x="50" y="106" width="370" height="50" class="r"/><text x="235" y="137" class="m" text-anchor="middle">M42 읽음</text><line x1="235" y1="156" x2="235" y2="190" class="l" marker-end="url(#arrow)"/><rect x="50" y="190" width="370" height="50" class="a"/><text x="235" y="221" class="m" text-anchor="middle">offset = 43 확정</text><line x1="235" y1="240" x2="235" y2="265" class="d"/><text x="235" y="287" class="m" text-anchor="middle">× 프로세스 종료</text><text x="235" y="316" class="s" text-anchor="middle">업무 DB 미실행</text><rect x="50" y="342" width="370" height="48" class="r"/><text x="235" y="372" class="m" text-anchor="middle">43부터 재개</text><text x="235" y="425" class="s" text-anchor="middle">M42 업무 효과 누락 가능</text><rect x="540" y="106" width="370" height="50" class="r"/><text x="725" y="137" class="m" text-anchor="middle">M42 읽음</text><line x1="725" y1="156" x2="725" y2="190" class="l" marker-end="url(#arrow)"/><rect x="540" y="190" width="370" height="50" class="a"/><text x="725" y="221" class="m" text-anchor="middle">업무 DB commit</text><line x1="725" y1="240" x2="725" y2="265" class="d"/><text x="725" y="287" class="m" text-anchor="middle">× 프로세스 종료</text><text x="725" y="316" class="s" text-anchor="middle">offset = 42 유지</text><rect x="540" y="342" width="370" height="48" class="r"/><text x="725" y="372" class="m" text-anchor="middle">42부터 재개</text><text x="725" y="425" class="s" text-anchor="middle">M42 업무 효과 중복 가능</text><text x="480" y="466" class="s" text-anchor="middle">로컬 DB 효과와 처리 기록의 원자성 + 안전한 offset 확정이 필요</text></svg>
