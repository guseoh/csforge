<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="outbox-relay-idempotency-title outbox-relay-idempotency-desc"><title id="outbox-relay-idempotency-title">Outbox · 내구성 있는 전달 의도와 중복 처리</title><desc id="outbox-relay-idempotency-desc">PostgreSQL T1에서 orders와 outbox e42 함께 commit. relay가 Kafka 발행 후 완료 기록 이전 장애 시 e42를 다시 발행할 수 있다. 소비자 T2에서 processed_message와 업무 변경을 원자적으로 처리하고 이후 offset 확정.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="480"/><text x="480" y="32" class="h" text-anchor="middle">로컬 트랜잭션과 비동기 발행의 경계</text><rect x="40" y="70" width="365" height="160" class="a"/><text x="222" y="100" class="h" text-anchor="middle">PostgreSQL T1</text><rect x="65" y="115" width="315" height="43" class="r"/><text x="222.5" y="142.5" class="m" text-anchor="middle">orders 변경</text><rect x="65" y="172" width="315" height="43" class="r"/><text x="222.5" y="199.5" class="m" text-anchor="middle">outbox : e42</text><text x="222" y="255" class="m" text-anchor="middle">함께 COMMIT</text><line x1="405" y1="150" x2="480" y2="150" class="strong" marker-end="url(#arrow)"/><text x="443" y="135" class="s" text-anchor="middle">이후</text><rect x="480" y="125" width="155" height="50" class="r"/><text x="557.5" y="156" class="m" text-anchor="middle">Relay</text><line x1="635" y1="150" x2="705" y2="150" class="l" marker-end="url(#arrow)"/><rect x="705" y="125" width="210" height="50" class="r"/><text x="810" y="156" class="m" text-anchor="middle">Kafka : e42</text><path d="M810 175 V222 H557 V175" class="d" marker-end="url(#arrow)"/><text x="680" y="247" class="s" text-anchor="middle">발행 완료 기록 전 장애 → 재발행 가능</text><line x1="810" y1="175" x2="810" y2="285" class="l" marker-end="url(#arrow)"/><rect x="485" y="285" width="430" height="128" class="a"/><text x="700" y="312" class="h" text-anchor="middle">Consumer DB T2</text><text x="700" y="346" class="m" text-anchor="middle">processed_message : e42</text><text x="700" y="379" class="s" text-anchor="middle">신규 ID만 업무 변경 · 같은 TX</text><text x="700" y="401" class="s" text-anchor="middle">COMMIT 후 offset 확정</text><text x="480" y="458" class="s" text-anchor="middle">업무 변경·발행 의도 원자성 ≠ 브로커·외부 효과의 exactly-once</text></svg>
