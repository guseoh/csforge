<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="offset-position-commit-title offset-position-commit-desc"><title id="offset-position-commit-title">레코드 오프셋 · 현재 위치 · 확정 위치</title><desc id="offset-position-commit-desc">연속 오프셋 40~46에서 확정 위치 42, poll이 42~44를 가져와 position 45. 업무 완료가 42까지만이면 안전한 확정 위치 43. 43,44 미완료에서 45 확정은 건너뛸 위험.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="435"/><text x="480" y="32" class="h" text-anchor="middle">P0 · poll로 42~44를 가져온 직후</text><rect x="95" y="115" width="105" height="60" class="r"/><text x="147.5" y="151" class="m" text-anchor="middle">40</text><rect x="205" y="115" width="105" height="60" class="r"/><text x="257.5" y="151" class="m" text-anchor="middle">41</text><rect x="315" y="115" width="105" height="60" class="a"/><text x="367.5" y="151" class="m" text-anchor="middle">42</text><rect x="425" y="115" width="105" height="60" class="a"/><text x="477.5" y="151" class="m" text-anchor="middle">43</text><rect x="535" y="115" width="105" height="60" class="a"/><text x="587.5" y="151" class="m" text-anchor="middle">44</text><rect x="645" y="115" width="105" height="60" class="r"/><text x="697.5" y="151" class="m" text-anchor="middle">45</text><rect x="755" y="115" width="105" height="60" class="r"/><text x="807.5" y="151" class="m" text-anchor="middle">46</text><text x="205" y="98" class="s" text-anchor="middle">이전 완료</text><text x="530" y="98" class="s" text-anchor="middle">poll로 받은 레코드</text><line x1="315" y1="225" x2="315" y2="175" class="strong" marker-end="url(#arrow)"/><text x="315" y="251" class="m" text-anchor="middle">committed = 42</text><line x1="645" y1="70" x2="645" y2="115" class="strong" marker-end="url(#arrow)"/><text x="645" y="60" class="m" text-anchor="middle">position = 45</text><text x="480" y="292" class="m" text-anchor="middle">42만 업무 완료했다면 안전한 commit = 43</text><line x1="425" y1="317" x2="425" y2="175" class="d" marker-end="url(#arrow)"/><text x="425" y="344" class="s" text-anchor="middle">43부터 재개</text><text x="480" y="390" class="s" text-anchor="middle">아직 완료하지 않은 43·44를 건너뛰어 45를 commit하면 유실 위험</text><text x="480" y="417" class="s" text-anchor="middle">연속 오프셋의 예 · 실제 로그에는 빈 구간이 있을 수 있음</text></svg>
