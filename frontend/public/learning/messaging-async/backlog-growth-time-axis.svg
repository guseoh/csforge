<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="backlog-growth-time-axis-title backlog-growth-time-axis-desc"><title id="backlog-growth-time-axis-title">처리율 차이와 적체 증가</title><desc id="backlog-growth-time-axis-desc">초기 적체 0, 유입 10000/s 완료6000/s이면 매초 4000건 증가, 5분120만 10분240만. 단순 메시지 수 모델.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="510"/><text x="480" y="32" class="h" text-anchor="middle">생산 10,000/s · 완료 6,000/s · 초기 적체 0</text><text x="480" y="66" class="s" text-anchor="middle">10분간 처리율이 일정한 단순 모델</text><line x1="120" y1="380" x2="120" y2="110" class="l" marker-end="url(#arrow)"/><line x1="120" y1="380" x2="870" y2="380" class="l" marker-end="url(#arrow)"/><text x="60" y="104" class="s" text-anchor="middle">적체</text><text x="890" y="405" class="s" text-anchor="middle">시간</text><line x1="120" y1="380" x2="840" y2="380" class="d"/><text x="105" y="386" class="s" text-anchor="end">0</text><line x1="120" y1="260" x2="840" y2="260" class="d"/><text x="105" y="266" class="s" text-anchor="end">120만</text><line x1="120" y1="140" x2="840" y2="140" class="d"/><text x="105" y="146" class="s" text-anchor="end">240만</text><text x="120" y="410" class="s" text-anchor="middle">0분</text><text x="480" y="410" class="s" text-anchor="middle">5분</text><text x="840" y="410" class="s" text-anchor="middle">10분</text><path d="M120 380 L840 140" class="strong"/><text x="500" y="218" class="h" text-anchor="middle">매초 +4,000건</text><text x="840" y="125" class="m" text-anchor="end">2,400,000</text><text x="480" y="458" class="s" text-anchor="middle">처리율 차이가 계속 양수이면 저장 공간이 충분해도 대기 시간이 증가</text><text x="480" y="485" class="s" text-anchor="middle">실제 offset lag는 위치 차이이며 로그 공백·트랜잭션 등으로 정확한 건수와 다를 수 있음</text></svg>
