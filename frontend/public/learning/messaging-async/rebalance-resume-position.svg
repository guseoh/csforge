<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="rebalance-resume-position-title rebalance-resume-position-desc"><title id="rebalance-resume-position-title">리밸런싱 · 파티션 담당자와 재개 위치</title><desc id="rebalance-resume-position-desc">P0는 A 담당 유지, P1은 B에서 C로 변경된 예. P1의 확정 위치42에서 C가 재개하므로 B의 미확정 업무 효과가 반복될 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="415"/><text x="480" y="32" class="h" text-anchor="middle">같은 Consumer Group · P1 담당 교체</text><text x="230" y="77" class="h" text-anchor="middle">이전 할당</text><text x="730" y="77" class="h" text-anchor="middle">재할당 이후</text><line x1="480" y1="55" x2="480" y2="340" class="d"/><rect x="35" y="110" width="140" height="50" class="r"/><text x="105" y="141" class="m" text-anchor="middle">P0</text><rect x="35" y="210" width="140" height="50" class="r"/><text x="105" y="241" class="m" text-anchor="middle">P1</text><rect x="255" y="110" width="180" height="50" class="r"/><text x="345" y="141" class="m" text-anchor="middle">Consumer A</text><rect x="255" y="210" width="180" height="50" class="r"/><text x="345" y="241" class="m" text-anchor="middle">Consumer B</text><line x1="175" y1="135" x2="255" y2="135" class="l" marker-end="url(#arrow)"/><line x1="175" y1="235" x2="255" y2="235" class="l" marker-end="url(#arrow)"/><text x="105" y="284" class="s" text-anchor="middle">commit = 42</text><text x="345" y="284" class="s" text-anchor="middle">M42 처리 중</text><rect x="535" y="110" width="140" height="50" class="r"/><text x="605" y="141" class="m" text-anchor="middle">P0</text><rect x="535" y="210" width="140" height="50" class="a"/><text x="605" y="241" class="m" text-anchor="middle">P1</text><rect x="755" y="110" width="180" height="50" class="r"/><text x="845" y="141" class="m" text-anchor="middle">Consumer A</text><rect x="755" y="210" width="180" height="50" class="a"/><text x="845" y="241" class="m" text-anchor="middle">Consumer C</text><line x1="675" y1="135" x2="755" y2="135" class="l" marker-end="url(#arrow)"/><line x1="675" y1="235" x2="755" y2="235" class="strong" marker-end="url(#arrow)"/><text x="605" y="284" class="s" text-anchor="middle">commit = 42</text><text x="845" y="284" class="s" text-anchor="middle">42부터 재개</text><text x="480" y="365" class="s" text-anchor="middle">P1의 미확정 업무 효과는 새 담당자가 다시 처리할 수 있음</text><text x="480" y="393" class="s" text-anchor="middle">유효한 확정 위치와 로그 보존을 가정 · 실제 할당 방식은 그룹 프로토콜에 따름</text></svg>
