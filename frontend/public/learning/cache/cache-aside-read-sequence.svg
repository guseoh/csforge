<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="cache-aside-read-sequence-title cache-aside-read-sequence-desc"><title id="cache-aside-read-sequence-title">Cache-Aside · 미스와 히트</title><desc id="cache-aside-read-sequence-desc">첫 조회에서 Redis miss, PostgreSQL v1 반환, Redis SET TTL 후 반환. 다음 조회에서 Redis hit, DB 호출 없이 값 반환.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="570"/><text x="130" y="38" class="h" text-anchor="middle">Application</text><line x1="130" y1="55" x2="130" y2="510" class="d"/><text x="480" y="38" class="h" text-anchor="middle">Redis</text><line x1="480" y1="55" x2="480" y2="510" class="d"/><text x="830" y="38" class="h" text-anchor="middle">PostgreSQL</text><line x1="830" y1="55" x2="830" y2="510" class="d"/><text x="25" y="72" class="h" text-anchor="start">미스</text><line x1="130" y1="105" x2="480" y2="105" class="l" marker-end="url(#arrow)"/><text x="305" y="96" class="s" text-anchor="middle">GET k</text><line x1="480" y1="150" x2="130" y2="150" class="d" marker-end="url(#arrow)"/><text x="305" y="141" class="s" text-anchor="middle">없음</text><line x1="130" y1="195" x2="830" y2="195" class="l" marker-end="url(#arrow)"/><text x="480" y="186" class="s" text-anchor="middle">SELECT k</text><line x1="830" y1="240" x2="130" y2="240" class="d" marker-end="url(#arrow)"/><text x="480" y="231" class="s" text-anchor="middle">v1</text><line x1="130" y1="285" x2="480" y2="285" class="strong" marker-end="url(#arrow)"/><text x="305" y="276" class="s" text-anchor="middle">SET k=v1 + TTL</text><text x="130" y="320" class="m" text-anchor="middle">v1 반환</text><line x1="35" y1="345" x2="925" y2="345" class="l"/><text x="25" y="380" class="h" text-anchor="start">히트</text><line x1="130" y1="415" x2="480" y2="415" class="l" marker-end="url(#arrow)"/><text x="305" y="406" class="s" text-anchor="middle">GET k</text><line x1="480" y1="460" x2="130" y2="460" class="d" marker-end="url(#arrow)"/><text x="305" y="451" class="s" text-anchor="middle">v1</text><text x="130" y="495" class="m" text-anchor="middle">v1 반환</text><text x="830" y="450" class="s" text-anchor="middle">DB 호출 없음</text><text x="480" y="547" class="s" text-anchor="middle">히트는 키 존재를 뜻하며 원본과 값이 같은지는 별도 문제</text></svg>
