<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="key-namespace-version-rollout-title key-namespace-version-rollout-desc"><title id="key-namespace-version-rollout-title">캐시 키 구조와 순차 배포 버전 분리</title><desc id="key-namespace-version-rollout-desc">테넌트, 서비스, 엔티티, 스키마 버전, 식별자로 구성된 캐시 키 구조와 순차 배포 중 App v1이 concept:v1:42를, App v2가 concept:v2:42를 독립적으로 읽어 역직렬화 충돌 없이 전환하는 흐름을 보여 준다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.h{font:700 22px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15px system-ui,sans-serif;fill:var(--muted)}.m{font:600 17px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="470"/><text x="480" y="36" class="h" text-anchor="middle">캐시 키 네임스페이스 구조와 순차 배포 버전 분리</text><rect x="46" y="62" width="144" height="78" rx="6" class="r"/><text x="118" y="95" class="m" text-anchor="middle">tenant-a</text><text x="118" y="123" class="s" text-anchor="middle">테넌트 격리</text><text x="206" y="106" class="h" text-anchor="middle">:</text><rect x="222" y="62" width="144" height="78" rx="6" class="r"/><text x="294" y="95" class="m" text-anchor="middle">csforge</text><text x="294" y="123" class="s" text-anchor="middle">서비스 범위</text><text x="382" y="106" class="h" text-anchor="middle">:</text><rect x="398" y="62" width="150" height="78" rx="6" class="r"/><text x="473" y="95" class="m" text-anchor="middle">concept</text><text x="473" y="123" class="s" text-anchor="middle">엔티티 종류</text><text x="564" y="106" class="h" text-anchor="middle">:</text><rect x="580" y="62" width="144" height="78" rx="6" class="a"/><text x="652" y="95" class="m" text-anchor="middle">v2</text><text x="652" y="123" class="s" text-anchor="middle">스키마 버전</text><text x="740" y="106" class="h" text-anchor="middle">:</text><rect x="756" y="62" width="158" height="78" rx="6" class="r"/><text x="835" y="95" class="m" text-anchor="middle">42</text><text x="835" y="123" class="s" text-anchor="middle">엔티티 식별자</text><line x1="40" y1="166" x2="920" y2="166" class="d"/><text x="480" y="200" class="t" text-anchor="middle">순차 배포(Rolling Deployment) 중 스키마 변경 공존</text><rect x="40" y="222" width="192" height="72" rx="6" class="r"/><text x="136" y="253" class="t" text-anchor="middle">App v1 (이전)</text><text x="136" y="279" class="s" text-anchor="middle">level: int 스키마</text><line x1="232" y1="258" x2="314" y2="258" class="l" marker-end="url(#arrow)"/><text x="273" y="246" class="s" text-anchor="middle">GET</text><rect x="318" y="222" width="320" height="72" rx="6" class="r"/><text x="478" y="252" class="m" text-anchor="middle">concept:v1:42</text><text x="478" y="279" class="m" text-anchor="middle">{"level": 1}</text><line x1="638" y1="258" x2="704" y2="258" class="l" marker-end="url(#arrow)"/><rect x="708" y="222" width="212" height="72" rx="6" class="r"/><text x="814" y="253" class="t" text-anchor="middle">정상 역직렬화</text><text x="814" y="279" class="s" text-anchor="middle">기존 요청 영향 없음</text><rect x="40" y="318" width="192" height="72" rx="6" class="a"/><text x="136" y="349" class="t" text-anchor="middle">App v2 (신규)</text><text x="136" y="375" class="s" text-anchor="middle">level: enum 스키마</text><line x1="232" y1="354" x2="314" y2="354" class="strong" marker-end="url(#arrow)"/><text x="273" y="342" class="s" text-anchor="middle">MISS→SET</text><rect x="318" y="318" width="320" height="72" rx="6" class="a"/><text x="478" y="348" class="m" text-anchor="middle">concept:v2:42</text><text x="478" y="375" class="m" text-anchor="middle">{"level": "BEGINNER"}</text><line x1="638" y1="354" x2="704" y2="354" class="strong" marker-end="url(#arrow)"/><rect x="708" y="318" width="212" height="72" rx="6" class="a"/><text x="814" y="349" class="t" text-anchor="middle">충돌 없는 전환</text><text x="814" y="375" class="s" text-anchor="middle">원본 조회 후 새 형식</text><text x="480" y="438" class="s" text-anchor="middle">키에 네임스페이스·테넌트·버전을 포함하면 충돌과 배포 중 역직렬화 오류를 함께 줄인다</text></svg>