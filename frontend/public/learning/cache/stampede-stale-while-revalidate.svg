<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="stampede-stale-while-revalidate-title stampede-stale-while-revalidate-desc"><title id="stampede-stale-while-revalidate-title">만료 전 선제 갱신과 Stale-While-Revalidate 타임라인</title><desc id="stampede-stale-while-revalidate-desc">Soft TTL과 Hard TTL 사이 구간에 동시 요청이 도달하면 대부분 요청은 기존 캐시 값을 즉시 반환해 지연을 줄이고, 잠금을 획득한 1개 요청만 백그라운드에서 PostgreSQL을 조회해 지터가 적용된 TTL로 캐시를 갱신한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.h{font:700 22px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="470"/><text x="480" y="34" class="h" text-anchor="middle">만료 전 선제 갱신 (Stale-While-Revalidate) 흐름</text><rect x="50" y="76" width="320" height="58" class="r"/><text x="210" y="102" class="t" text-anchor="middle">정상 유효 구간 (Fresh)</text><text x="210" y="124" class="s" text-anchor="middle">캐시 값 즉시 반환</text><rect x="370" y="76" width="350" height="58" class="a"/><text x="545" y="102" class="t" text-anchor="middle">갱신 허용 구간 (Soft → Hard)</text><text x="545" y="124" class="s" text-anchor="middle">기존 값 반환 + 1건 비동기 갱신</text><rect x="720" y="76" width="190" height="58" fill="url(#hatch)" stroke="var(--line)" stroke-width="1.8"/><rect x="738" y="88" width="154" height="34" rx="4" class="bg"/><text x="815" y="111" class="t" text-anchor="middle">물리 만료 (Miss)</text><line x1="50" y1="134" x2="50" y2="152" class="l"/><text x="50" y="170" class="m" text-anchor="start">t = 0 (SET)</text><line x1="370" y1="134" x2="370" y2="152" class="strong"/><text x="370" y="170" class="m" text-anchor="middle">Soft TTL</text><line x1="720" y1="134" x2="720" y2="152" class="l"/><text x="720" y="170" class="m" text-anchor="middle">Hard TTL + 지터</text><line x1="40" y1="190" x2="920" y2="190" class="d"/><rect x="50" y="246" width="212" height="92" rx="6" class="r"/><text x="156" y="284" class="t" text-anchor="middle">동시 요청 1,000건</text><text x="156" y="312" class="s" text-anchor="middle">Soft TTL 구간 도달</text><path d="M 262 272 L 302 272 L 302 246 L 344 246" class="l" marker-end="url(#arrow)"/><path d="M 262 312 L 302 312 L 302 346 L 344 346" class="strong" marker-end="url(#arrow)"/><rect x="348" y="210" width="562" height="72" rx="6" class="r"/><text x="629" y="242" class="t" text-anchor="middle">999건 → 기존 캐시 값 즉시 반환</text><text x="629" y="268" class="s" text-anchor="middle">잠금 대기 없음 · 만료 순간 p99 지연 시간 급증 방지</text><rect x="348" y="306" width="236" height="80" rx="6" class="a"/><text x="466" y="340" class="t" text-anchor="middle">1건 (갱신 락 획득)</text><text x="466" y="366" class="m" text-anchor="middle">SET lock NX PX</text><line x1="584" y1="346" x2="628" y2="346" class="strong" marker-end="url(#arrow)"/><rect x="632" y="306" width="278" height="80" rx="6" class="a"/><text x="771" y="340" class="t" text-anchor="middle">백그라운드 원본 갱신</text><text x="771" y="366" class="s" text-anchor="middle">DB 조회 → 새 값 + 지터 TTL 저장</text><text x="480" y="438" class="s" text-anchor="middle">잠시 오래된 값을 허용할 수 있는 조회에 유리하며, 결제·권한 등 강한 최신성 경로에는 부적합하다</text></svg>