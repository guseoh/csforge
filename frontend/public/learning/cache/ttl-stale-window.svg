<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="ttl-stale-window-title ttl-stale-window-desc"><title id="ttl-stale-window-title">TTL · 항목 수명과 오래된 값의 구간</title><desc id="ttl-stale-window-desc">t0 캐시에 v1 저장, t20 DB v2 변경, t60 cache v1 논리 만료. 무효화와 갱신 및 재삽입 없으면 최대 40초 동안 오래된 값 반환 가능.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="410"/><text x="480" y="35" class="h" text-anchor="middle">TTL 60초 · 원본 변경은 t=20초</text><text x="45" y="106" class="m" text-anchor="start">원본 DB</text><text x="45" y="209" class="m" text-anchor="start">캐시</text><rect x="220" y="75" width="200" height="55" class="r"/><text x="320" y="109" class="m" text-anchor="middle">v1</text><rect x="420" y="75" width="500" height="55" class="a"/><text x="670" y="109" class="m" text-anchor="middle">v2</text><rect x="220" y="177" width="600" height="55" class="r"/><text x="320" y="211" class="m" text-anchor="middle">v1</text><rect x="420" y="177" width="400" height="55" fill="url(#hatch)" stroke="var(--fg)" stroke-width="2"/><text x="620" y="211" class="m" text-anchor="middle">v1 · 오래된 값</text><text x="870" y="211" class="m" text-anchor="middle">미스</text><line x1="220" y1="55" x2="220" y2="258" class="d"/><text x="220" y="283" class="s" text-anchor="middle">0초</text><line x1="420" y1="55" x2="420" y2="258" class="d"/><text x="420" y="283" class="s" text-anchor="middle">20초</text><line x1="820" y1="55" x2="820" y2="258" class="d"/><text x="820" y="283" class="s" text-anchor="middle">60초</text><line x1="420" y1="314" x2="820" y2="314" class="strong"/><line x1="420" y1="305" x2="420" y2="323" class="strong"/><line x1="820" y1="305" x2="820" y2="323" class="strong"/><text x="620" y="348" class="h" text-anchor="middle">최대 40초 오래된 값 반환 가능</text><text x="480" y="389" class="s" text-anchor="middle">재삽입·TTL 갱신·무효화가 없는 단일 항목 예시</text></svg>
