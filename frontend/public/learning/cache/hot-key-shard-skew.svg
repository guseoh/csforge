<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="hot-key-shard-skew-title hot-key-shard-skew-desc"><title id="hot-key-shard-skew-title">핫 키 · 적중률과 노드별 부하 편향</title><desc id="hot-key-shard-skew-desc">10000회 요청이 세 primary shard에 3400,3300,3300으로 분포하는 예와 9000,500,500으로 편향되는 예.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="435"/><text x="480" y="32" class="h" text-anchor="middle">같은 총 10,000 조회 · primary shard 3개 예시</text><text x="235" y="78" class="h" text-anchor="middle">균등 접근 예</text><text x="725" y="78" class="h" text-anchor="middle">접근 편향 예</text><line x1="480" y1="55" x2="480" y2="355" class="d"/><text x="35" y="147" class="m" text-anchor="start">A</text><rect x="80" y="120" width="112.2" height="45" class="r"/><text x="202.2" y="148" class="s" text-anchor="start">3400</text><text x="35" y="222" class="m" text-anchor="start">B</text><rect x="80" y="195" width="108.9" height="45" class="r"/><text x="198.9" y="223" class="s" text-anchor="start">3300</text><text x="35" y="297" class="m" text-anchor="start">C</text><rect x="80" y="270" width="108.9" height="45" class="r"/><text x="198.9" y="298" class="s" text-anchor="start">3300</text><text x="525" y="147" class="m" text-anchor="start">A</text><rect x="570" y="120" width="297" height="45" class="a"/><text x="877" y="148" class="s" text-anchor="start">9000</text><text x="525" y="222" class="m" text-anchor="start">B</text><rect x="570" y="195" width="16.5" height="45" class="r"/><text x="596.5" y="223" class="s" text-anchor="start">500</text><text x="525" y="297" class="m" text-anchor="start">C</text><rect x="570" y="270" width="16.5" height="45" class="r"/><text x="596.5" y="298" class="s" text-anchor="start">500</text><text x="235" y="370" class="s" text-anchor="middle">여러 키로 부하 분산</text><text x="725" y="370" class="s" text-anchor="middle">핫 키가 shard A에 집중</text><text x="480" y="414" class="s" text-anchor="middle">같은 key는 같은 hash slot으로 라우팅 · replica/L1은 별도 읽기 전략</text></svg>
