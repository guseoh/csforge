<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="late-fill-after-invalidation-title late-fill-after-invalidation-desc"><title id="late-fill-after-invalidation-title">무효화 뒤 늦은 조회 · v1이 다시 살아나는 이유</title><desc id="late-fill-after-invalidation-desc">조회자가 v1을 읽고 결과 전달이 늦어진 사이 작성자가 v2 커밋 후 캐시 삭제한다. 조회자가 늦게 v1 SET하면 DB v2와 캐시 v1이 공존한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="490"/><text x="110" y="38" class="h" text-anchor="middle">조회자 R</text><line x1="110" y1="55" x2="110" y2="430" class="d"/><text x="350" y="38" class="h" text-anchor="middle">작성자 W</text><line x1="350" y1="55" x2="350" y2="430" class="d"/><text x="610" y="38" class="h" text-anchor="middle">PostgreSQL</text><line x1="610" y1="55" x2="610" y2="430" class="d"/><text x="850" y="38" class="h" text-anchor="middle">Redis</text><line x1="850" y1="55" x2="850" y2="430" class="d"/><line x1="110" y1="91" x2="850" y2="91" class="l" marker-end="url(#arrow)"/><text x="480" y="82" class="s" text-anchor="middle">GET k → miss</text><line x1="110" y1="142" x2="610" y2="142" class="l" marker-end="url(#arrow)"/><text x="360" y="133" class="s" text-anchor="middle">v1 읽기 (이전 snapshot/결과)</text><line x1="350" y1="194" x2="610" y2="194" class="strong" marker-end="url(#arrow)"/><text x="480" y="185" class="s" text-anchor="middle">v2 UPDATE + COMMIT</text><line x1="350" y1="247" x2="850" y2="247" class="strong" marker-end="url(#arrow)"/><text x="600" y="238" class="s" text-anchor="middle">DEL k</text><line x1="610" y1="299" x2="110" y2="299" class="d" marker-end="url(#arrow)"/><text x="360" y="290" class="s" text-anchor="middle">늦게 도착한 v1</text><line x1="110" y1="355" x2="850" y2="355" class="strong" marker-end="url(#arrow)"/><text x="480" y="346" class="s" text-anchor="middle">SET k = v1</text><text x="610" y="411" class="m" text-anchor="middle">DB = v2</text><text x="850" y="411" class="m" text-anchor="middle">캐시 = v1</text><text x="480" y="466" class="h" text-anchor="middle">DEL 성공 뒤에도 오래된 값이 다시 들어오는 경쟁 상태</text></svg>
