<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="eviction-policy-candidates-title eviction-policy-candidates-desc"><title id="eviction-policy-candidates-title">Redis 퇴출 · 정책별 후보 집합</title><desc id="eviction-policy-candidates-desc">TTL 있는 A C, TTL 없는 B D가 있을 때 allkeys 계열은 모두 후보, volatile 계열은 A C만 후보, noeviction은 키 퇴출 없음.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="425"/><text x="480" y="32" class="h" text-anchor="middle">메모리 한계에서 새 값 저장 · 정책별 후보 집합</text><text x="35" y="100" class="m" text-anchor="start">현재 키</text><rect x="235" y="65" width="128" height="58" class="r"/><text x="299" y="100" class="m" text-anchor="middle">A</text><text x="299" y="145" class="s" text-anchor="middle">TTL 있음</text><rect x="383" y="65" width="128" height="58" class="r"/><text x="447" y="100" class="m" text-anchor="middle">B</text><text x="447" y="145" class="s" text-anchor="middle">TTL 없음</text><rect x="531" y="65" width="128" height="58" class="r"/><text x="595" y="100" class="m" text-anchor="middle">C</text><text x="595" y="145" class="s" text-anchor="middle">TTL 있음</text><rect x="679" y="65" width="128" height="58" class="r"/><text x="743" y="100" class="m" text-anchor="middle">D</text><text x="743" y="145" class="s" text-anchor="middle">TTL 없음</text><text x="35" y="190" class="m" text-anchor="start">allkeys-*</text><rect x="235" y="166" width="572" height="49" class="a"/><text x="521" y="197" class="m" text-anchor="middle">A · B · C · D 모두 후보</text><text x="35" y="268" class="m" text-anchor="start">volatile-*</text><rect x="235" y="244" width="128" height="49" class="a"/><text x="299" y="274.5" class="m" text-anchor="middle">A</text><rect x="531" y="244" width="128" height="49" class="a"/><text x="595" y="274.5" class="m" text-anchor="middle">C</text><text x="850" y="274" class="s" text-anchor="middle">TTL 있는 키만</text><text x="35" y="350" class="m" text-anchor="start">noeviction</text><text x="235" y="350" class="s" text-anchor="start">키 퇴출 없음 · 메모리를 늘리는 쓰기 거부 가능</text><text x="480" y="402" class="s" text-anchor="middle">후보 집합 예시 · 실제 퇴출 대상은 정책 및 샘플링에 따름</text></svg>
