<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="cache-timeout-budget-fail-policy-title cache-timeout-budget-fail-policy-desc"><title id="cache-timeout-budget-fail-policy-title">요청 시간 예산 배분과 데이터 정확성별 장애 정책</title><desc id="cache-timeout-budget-fail-policy-desc">왼쪽은 캐시 타임아웃이 전체 요청 제한 시간을 소진하는 잘못된 구성과 짧은 캐시 타임아웃 뒤에 제한된 DB 대체 예산을 남기는 구성을 비교한다. 오른쪽은 조회 캐시의 완화 정책과 권한·결제 캐시의 fail-closed 또는 원본 재검증 원칙을 구분한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.h{font:700 22px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><rect class="bg" width="960" height="470"/><text x="480" y="34" class="h" text-anchor="middle">요청 시간 예산 배분과 데이터 정확성별 장애 정책</text><line x1="485" y1="56" x2="485" y2="404" class="d"/><text x="245" y="76" class="t" text-anchor="middle">요청 시간 예산 (전체 SLA 500ms 예시)</text><text x="38" y="112" class="s">잘못된 설정: 긴 캐시 타임아웃</text><rect x="38" y="124" width="414" height="52" rx="4" class="a"/><text x="245" y="156" class="m" text-anchor="middle">Redis 대기 500ms+ (요청 예산 소진)</text><text x="38" y="200" class="s">대체 조회 전에 상위 요청 실패 · 스레드 풀 고갈</text><text x="38" y="246" class="s">권장 설정: 짧은 캐시 타임아웃 + 대체 예산 확보</text><rect x="38" y="258" width="94" height="52" rx="4" class="a"/><text x="85" y="290" class="m" text-anchor="middle">50ms</text><rect x="132" y="258" width="320" height="52" rx="4" class="r"/><text x="292" y="290" class="t" text-anchor="middle">남은 450ms: 제한된 대체</text><text x="85" y="332" class="s" text-anchor="middle">캐시 시도</text><text x="292" y="332" class="s" text-anchor="middle">동시성 제한 · CircuitBreaker</text><rect x="38" y="352" width="414" height="44" rx="6" class="r"/><text x="245" y="380" class="m" text-anchor="middle">cacheTimeout &lt;&lt; upstreamRequestTimeout</text><text x="720" y="76" class="t" text-anchor="middle">데이터 정확성별 장애 정책</text><rect x="515" y="96" width="408" height="140" rx="6" class="r"/><text x="719" y="128" class="t" text-anchor="middle">추천 목록 · 조회 캐시 (완화 허용)</text><text x="719" y="158" class="m" text-anchor="middle">Fail-Open / Degraded 검토</text><text x="538" y="190" class="s">• 동시성 상한 안에서 원본 DB 대체 조회</text><text x="538" y="216" class="s">• 허용 시 오래된 값 또는 기본 응답 반환</text><rect x="515" y="256" width="408" height="140" rx="6" class="a"/><text x="719" y="288" class="t" text-anchor="middle">권한 판정 · 결제 상태 (정확성 필수)</text><text x="719" y="318" class="m" text-anchor="middle">Fail-Closed 또는 원본 재검증</text><text x="538" y="350" class="s">• 캐시 장애를 권한 허용으로 해석 금지</text><text x="538" y="376" class="s">• 원본 확인 불가 시 명확한 실패(503) 반환</text><text x="480" y="440" class="s" text-anchor="middle">시간·동시성 한계와 정확성 경계를 분리해야 캐시 장애가 DB 과부하나 보안 우회로 번지지 않는다</text></svg>