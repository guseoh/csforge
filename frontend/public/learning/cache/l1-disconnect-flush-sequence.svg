<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" role="img" aria-labelledby="l1-disconnect-flush-sequence-title l1-disconnect-flush-sequence-desc"><title id="l1-disconnect-flush-sequence-title">L1 알림 연결 단절과 재연결 시 로컬 캐시 비우기</title><desc id="l1-disconnect-flush-sequence-desc">App A가 L1에 v1을 보관한 상태에서 Redis 무효화 알림 연결이 끊기면 DB v2 커밋과 L2 삭제 알림을 놓쳐 L1에 v1이 남는다. 재연결 시 기존 L1을 전부 비워 누락 알림 위험을 차단하며 L2 최신성은 별도로 관리해야 한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:600 18px system-ui,sans-serif;fill:var(--fg)}.h{font:700 22px system-ui,sans-serif;fill:var(--fg)}.s{font:400 15px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="545"/><text x="480" y="34" class="h" text-anchor="middle">L1 무효화 알림 단절과 재연결 시 로컬 캐시 비우기</text><rect x="65" y="54" width="200" height="44" rx="6" class="r"/><text x="165" y="82" class="t" text-anchor="middle">App A (L1 로컬)</text><rect x="365" y="54" width="230" height="44" rx="6" class="r"/><text x="480" y="82" class="t" text-anchor="middle">Redis (L2 · Tracking)</text><rect x="685" y="54" width="220" height="44" rx="6" class="r"/><text x="795" y="82" class="t" text-anchor="middle">PostgreSQL (원본)</text><line x1="165" y1="98" x2="165" y2="408" class="d"/><line x1="480" y1="98" x2="480" y2="474" class="d"/><line x1="795" y1="98" x2="795" y2="408" class="d"/><rect x="85" y="116" width="160" height="38" rx="6" class="r"/><text x="165" y="141" class="m" text-anchor="middle">L1: k = v1</text><rect x="400" y="116" width="160" height="38" rx="6" class="r"/><text x="480" y="141" class="m" text-anchor="middle">L2: k = v1</text><rect x="715" y="116" width="160" height="38" rx="6" class="r"/><text x="795" y="141" class="m" text-anchor="middle">DB: k = v1</text><line x1="165" y1="196" x2="480" y2="196" class="d"/><line x1="312" y1="186" x2="332" y2="206" class="strong"/><line x1="332" y1="186" x2="312" y2="206" class="strong"/><text x="322" y="178" class="s" text-anchor="middle">1. 알림 연결 단절 (Tracking 끊김)</text><line x1="795" y1="254" x2="486" y2="254" class="strong" marker-end="url(#arrow)"/><text x="640" y="242" class="s" text-anchor="middle">2. DB v2 COMMIT 후 L2 DEL</text><line x1="480" y1="312" x2="296" y2="312" class="d"/><line x1="288" y1="302" x2="306" y2="322" class="strong"/><line x1="306" y1="302" x2="288" y2="322" class="strong"/><text x="388" y="300" class="s" text-anchor="middle">3. 무효화 알림 유실</text><rect x="55" y="290" width="220" height="44" rx="6" class="a"/><text x="165" y="318" class="m" text-anchor="middle">L1 v1 잔류 (오래됨)</text><line x1="165" y1="376" x2="474" y2="376" class="strong" marker-end="url(#arrow)"/><text x="322" y="364" class="s" text-anchor="middle">4. 단절 감지 · Redis 재연결</text><rect x="40" y="408" width="250" height="66" rx="6" class="a"/><text x="165" y="436" class="t" text-anchor="middle">5. 기존 L1 전체 비우기</text><text x="165" y="460" class="s" text-anchor="middle">누락된 변경 알림 위험 차단</text><rect x="526" y="408" width="394" height="66" rx="6" class="r"/><text x="723" y="436" class="t" text-anchor="middle">L2 최신성은 별도 검증 경계</text><text x="723" y="460" class="s" text-anchor="middle">핵심 읽기는 DB 우회 또는 원본 버전 확인 필요</text><text x="480" y="520" class="s" text-anchor="middle">단절 중 누락된 Redis 알림은 재연결 시 재생되지 않으므로 L1 비우기와 감지 지연 제한이 필요하다</text></svg>