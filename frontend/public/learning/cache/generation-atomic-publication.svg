<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="generation-atomic-publication-title generation-atomic-publication-desc"><title id="generation-atomic-publication-title">세대 확인과 캐시 게시의 원자 경계</title><desc id="generation-atomic-publication-desc">DB가 v42로 변경되고 Redis 세대가 42로 전파된 이후, 늦게 도착한 v41은 원자 비교 후 거절된다. v42는 조건을 만족할 때 게시된다. 세대 전파 실패는 별도로 복구해야 한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="365"/><text x="480" y="31" class="h" text-anchor="middle">전파가 완료된 경우 · 세대 42</text><rect x="45" y="55" width="280" height="72" class="r"/><text x="185" y="85" class="m" text-anchor="middle">PostgreSQL</text><text x="185" y="111" class="s" text-anchor="middle">v42 COMMIT</text><line x1="325" y1="91" x2="475" y2="91" class="d" marker-end="url(#arrow)"/><text x="400" y="76" class="s" text-anchor="middle">별도 전파</text><rect x="475" y="55" width="440" height="72" class="a"/><text x="695" y="84" class="m" text-anchor="middle">Redis generation = 42</text><text x="695" y="111" class="s" text-anchor="middle">이전 캐시 항목 제거</text><rect x="475" y="160" width="440" height="140" class="a"/><text x="695" y="187" class="h" text-anchor="middle">Redis 원자적 확인 + 게시</text><text x="695" y="227" class="m" text-anchor="middle">41 ≠ 42  →  거절</text><text x="695" y="271" class="m" text-anchor="middle">42 = 42  →  게시 가능</text><rect x="45" y="203" width="280" height="42" class="r"/><text x="185" y="230" class="m" text-anchor="middle">늦은 조회: v41</text><rect x="45" y="253" width="280" height="42" class="r"/><text x="185" y="280" class="m" text-anchor="middle">새 조회: v42</text><line x1="325" y1="224" x2="475" y2="224" class="l" marker-end="url(#arrow)"/><line x1="325" y1="274" x2="475" y2="274" class="l" marker-end="url(#arrow)"/><text x="480" y="342" class="s" text-anchor="middle">DB commit과 Redis 세대 전파 자체는 원자적이지 않음</text></svg>
