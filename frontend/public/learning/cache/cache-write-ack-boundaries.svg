<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="cache-write-ack-boundaries-title cache-write-ack-boundaries-desc"><title id="cache-write-ack-boundaries-title">캐시 쓰기 전략 · 응답과 원본 반영 순서</title><desc id="cache-write-ack-boundaries-desc">Cache-Aside는 DB commit 후 무효화 시도와 응답, Write-Through는 캐시 계층이 원본 쓰기까지 처리한 뒤 성공 응답, Write-Behind는 기록 확보 뒤 응답하고 원본 반영을 나중에 수행한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="415"/><text x="480" y="32" class="h" text-anchor="middle">성공 응답의 기준과 원본 반영 시점</text><text x="25" y="99" class="m" text-anchor="start">Cache-Aside</text><rect x="240" y="70" width="195" height="49" class="r"/><text x="337.5" y="100.5" class="m" text-anchor="middle">DB commit</text><line x1="435" y1="94" x2="470" y2="94" class="l" marker-end="url(#arrow)"/><rect x="470" y="70" width="195" height="49" class="r"/><text x="567.5" y="100.5" class="m" text-anchor="middle">캐시 DEL</text><line x1="665" y1="94" x2="700" y2="94" class="l" marker-end="url(#arrow)"/><rect x="700" y="70" width="220" height="49" class="a"/><text x="810" y="100.5" class="m" text-anchor="middle">응답</text><text x="25" y="198" class="m" text-anchor="start">Write-Through</text><rect x="240" y="169" width="195" height="49" class="r"/><text x="337.5" y="199.5" class="m" text-anchor="middle">캐시 계층</text><line x1="435" y1="193" x2="470" y2="193" class="l" marker-end="url(#arrow)"/><rect x="470" y="169" width="195" height="49" class="r"/><text x="567.5" y="199.5" class="m" text-anchor="middle">원본 쓰기</text><line x1="665" y1="193" x2="700" y2="193" class="l" marker-end="url(#arrow)"/><rect x="700" y="169" width="220" height="49" class="a"/><text x="810" y="199.5" class="m" text-anchor="middle">응답</text><text x="25" y="297" class="m" text-anchor="start">Write-Behind</text><rect x="240" y="268" width="195" height="49" class="a"/><text x="337.5" y="298.5" class="m" text-anchor="middle">기록 확보</text><line x1="435" y1="292" x2="470" y2="292" class="l" marker-end="url(#arrow)"/><rect x="470" y="268" width="195" height="49" class="a"/><text x="567.5" y="298.5" class="m" text-anchor="middle">응답</text><line x1="665" y1="292" x2="700" y2="292" class="l" marker-end="url(#arrow)"/><rect x="700" y="268" width="220" height="49" class="r"/><text x="810" y="298.5" class="m" text-anchor="middle">나중에 DB</text><text x="680" y="342" class="s" text-anchor="middle">이 구간 장애: 원본 미반영 변경 복구 필요</text><text x="480" y="390" class="s" text-anchor="middle">동기 쓰기라도 캐시와 DB의 원자성을 자동 보장하지 않음</text></svg>
