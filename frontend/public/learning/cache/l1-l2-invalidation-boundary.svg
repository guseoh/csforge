<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="l1-l2-invalidation-boundary-title l1-l2-invalidation-boundary-desc"><title id="l1-l2-invalidation-boundary-title">L1·L2 · 독립 복사본의 무효화</title><desc id="l1-l2-invalidation-boundary-desc">변경 전 A B L1 Redis L2 DB 모두 v1. DB v2 commit 후 L2 삭제, B L1은 무효화 수신으로 삭제되었고 A L1은 v1이 남을 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="475"/><text x="480" y="32" class="h" text-anchor="middle">같은 키 · 서로 독립된 L1 복사본</text><text x="230" y="74" class="h" text-anchor="middle">변경 전</text><text x="730" y="74" class="h" text-anchor="middle">DB v2 commit · L2 삭제 후</text><line x1="480" y1="55" x2="480" y2="420" class="d"/><rect x="25" y="100" width="190" height="55" class="r"/><text x="120" y="133.5" class="m" text-anchor="middle">A: L1 v1</text><rect x="245" y="100" width="190" height="55" class="r"/><text x="340" y="133.5" class="m" text-anchor="middle">B: L1 v1</text><rect x="85" y="220" width="290" height="52" class="r"/><text x="230" y="252" class="m" text-anchor="middle">Redis L2: v1</text><rect x="85" y="325" width="290" height="52" class="r"/><text x="230" y="357" class="m" text-anchor="middle">DB: v1</text><path d="M120 155 V183 H175 V220" class="d" marker-end="url(#arrow)"/><path d="M340 155 V183 H285 V220" class="d" marker-end="url(#arrow)"/><line x1="230" y1="272" x2="230" y2="325" class="d" marker-end="url(#arrow)"/><text x="230" y="405" class="s" text-anchor="middle">원본과 복사본 모두 v1</text><rect x="525" y="100" width="190" height="55" class="a"/><text x="620" y="133.5" class="m" text-anchor="middle">A: L1 v1</text><rect x="745" y="100" width="190" height="55" class="r"/><text x="840" y="133.5" class="m" text-anchor="middle">B: L1 비어 있음</text><rect x="585" y="220" width="290" height="52" class="a"/><text x="730" y="252" class="m" text-anchor="middle">Redis L2: 없음</text><rect x="585" y="325" width="290" height="52" class="a"/><text x="730" y="357" class="m" text-anchor="middle">DB: v2</text><path d="M620 155 V183 H675 V220" class="d" marker-end="url(#arrow)"/><path d="M840 155 V183 H785 V220" class="d" marker-end="url(#arrow)"/><line x1="730" y1="272" x2="730" y2="325" class="d" marker-end="url(#arrow)"/><text x="730" y="405" class="s" text-anchor="middle">A만 오래된 값 반환 가능</text><text x="480" y="454" class="s" text-anchor="middle">점선: 미스 때 조회 경로 · B는 무효화 수신, A는 아직 미수신</text></svg>
