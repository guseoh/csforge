<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="bounded-cache-fallback-title bounded-cache-fallback-desc"><title id="bounded-cache-fallback-title">캐시 장애 · DB로 전파되는 부하 제한</title><desc id="bounded-cache-fallback-desc">정상 100회 조회에서 cache hit90 DB10, 장애 후 제한 없으면 DB100, 예시 예산20이면 DB20 나머지80은 정책에 따른 대체나 실패.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="420"/><text x="480" y="32" class="h" text-anchor="middle">조회 100건 · 정상 hit 90%인 가상 예</text><text x="35" y="90" class="h" text-anchor="start">정상</text><rect x="235" y="67" width="650" height="50" class="r"/><rect x="235" y="67" width="585" height="50" class="a"/><text x="528" y="99" class="m" text-anchor="middle">캐시 hit 90건</text><text x="852" y="99" class="s" text-anchor="middle">10</text><text x="885" y="144" class="s" text-anchor="end">DB 10건</text><text x="35" y="211" class="h" text-anchor="start">캐시 장애</text><rect x="235" y="183" width="650" height="50" class="a"/><text x="560" y="215" class="m" text-anchor="middle">제한 없는 fallback → DB 100건</text><text x="35" y="323" class="h" text-anchor="start">제한 적용</text><rect x="235" y="295" width="130" height="50" class="a"/><text x="300" y="326" class="m" text-anchor="middle">20건</text><rect x="365" y="295" width="520" height="50" fill="url(#hatch)" stroke="var(--line)"/><text x="625" y="326" class="m" text-anchor="middle">80건: 허용된 대체 / 빠른 실패</text><text x="480" y="389" class="s" text-anchor="middle">DB 대체 조회 예산 20건을 가정 · 정확성 요구에 따라 대체 여부 결정</text></svg>
