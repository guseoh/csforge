<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="stampede-single-flight-title stampede-single-flight-desc"><title id="stampede-single-flight-title">Cache Stampede · 동시 미스와 요청 병합</title><desc id="stampede-single-flight-desc">같은 키의 동시 미스 4개가 각각 DB 조회를 하는 경우 4회, 한 담당이 성공하는 single-flight 예에서는 1회 조회 후 나머지 요청이 결과를 공유.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect class="bg" width="960" height="440"/><text x="480" y="32" class="h" text-anchor="middle">같은 인기 키 만료 · 4개 동시 요청</text><text x="235" y="72" class="h" text-anchor="middle">중복 재생성</text><text x="725" y="72" class="h" text-anchor="middle">single-flight 예시</text><line x1="480" y1="55" x2="480" y2="340" class="d"/><rect x="35" y="100" width="110" height="42" class="r"/><text x="90" y="127" class="m" text-anchor="middle">A</text><line x1="145" y1="121" x2="325" y2="121" class="strong" marker-end="url(#arrow)"/><rect x="325" y="100" width="120" height="42" class="r"/><text x="385" y="127" class="m" text-anchor="middle">DB 조회</text><rect x="515" y="100" width="110" height="42" class="a"/><text x="570" y="127" class="m" text-anchor="middle">A</text><line x1="625" y1="121" x2="785" y2="121" class="strong" marker-end="url(#arrow)"/><rect x="785" y="100" width="135" height="42" class="a"/><text x="852.5" y="127" class="m" text-anchor="middle">DB 조회</text><rect x="35" y="160" width="110" height="42" class="r"/><text x="90" y="187" class="m" text-anchor="middle">B</text><line x1="145" y1="181" x2="325" y2="181" class="strong" marker-end="url(#arrow)"/><rect x="325" y="160" width="120" height="42" class="r"/><text x="385" y="187" class="m" text-anchor="middle">DB 조회</text><rect x="515" y="160" width="110" height="42" class="r"/><text x="570" y="187" class="m" text-anchor="middle">B</text><line x1="625" y1="181" x2="695" y2="181" class="d" marker-end="url(#arrow)"/><text x="708" y="187" class="s" text-anchor="start">대기</text><rect x="35" y="220" width="110" height="42" class="r"/><text x="90" y="247" class="m" text-anchor="middle">C</text><line x1="145" y1="241" x2="325" y2="241" class="strong" marker-end="url(#arrow)"/><rect x="325" y="220" width="120" height="42" class="r"/><text x="385" y="247" class="m" text-anchor="middle">DB 조회</text><rect x="515" y="220" width="110" height="42" class="r"/><text x="570" y="247" class="m" text-anchor="middle">C</text><line x1="625" y1="241" x2="695" y2="241" class="d" marker-end="url(#arrow)"/><text x="708" y="247" class="s" text-anchor="start">대기</text><rect x="35" y="280" width="110" height="42" class="r"/><text x="90" y="307" class="m" text-anchor="middle">D</text><line x1="145" y1="301" x2="325" y2="301" class="strong" marker-end="url(#arrow)"/><rect x="325" y="280" width="120" height="42" class="r"/><text x="385" y="307" class="m" text-anchor="middle">DB 조회</text><rect x="515" y="280" width="110" height="42" class="r"/><text x="570" y="307" class="m" text-anchor="middle">D</text><line x1="625" y1="301" x2="695" y2="301" class="d" marker-end="url(#arrow)"/><text x="708" y="307" class="s" text-anchor="start">대기</text><path d="M852 142 V325 H740" class="l" marker-end="url(#arrow)"/><text x="710" y="326" class="s" text-anchor="end">결과 공유</text><text x="235" y="380" class="h" text-anchor="middle">DB 조회 4회</text><text x="725" y="380" class="h" text-anchor="middle">DB 조회 1회 (담당 성공 시)</text><text x="480" y="417" class="s" text-anchor="middle">대기 시간·소유권 만료·장애 복구 정책이 별도로 필요</text></svg>
