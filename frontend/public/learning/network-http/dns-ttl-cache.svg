<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">DNS TTL과 권한 레코드 변경</title><desc id="desc">t=0에 TTL 60초로 저장하고 t=10에 권한 값이 바뀌어도 기존 캐시는 만료까지 재사용할 수 있다. t=60 이후 질의 시 새 값으로 갱신되는 예시.</desc>
<style>
svg{--bg:#fff;--fg:#222;--muted:#595959;--line:#858585;--surface:#f5f5f5;--selected:#e5e5e5}
@media(prefers-color-scheme:dark){svg{--bg:#181818;--fg:#ededed;--muted:#b5b5b5;--line:#a1a1a1;--surface:#242424;--selected:#393939}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg);font-size:17px}
.small{font-size:15px;fill:var(--muted)}.head{font-size:19px;font-weight:600}
.box,.selected,.missing{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.selected{fill:var(--selected);stroke:var(--fg);stroke-width:2}.missing{fill:var(--bg);stroke-dasharray:5 4}
.line{stroke:var(--line);stroke-width:1.5;fill:none}.bg{fill:var(--bg)}.tip{fill:var(--line)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="tip"/></marker></defs>
<rect width="900" height="345" class="bg"/>
<text x="450" y="30" class="head" text-anchor="middle">권한 DNS 변경과 리졸버의 기존 TTL</text><text x="16" y="86" class="txt" text-anchor="start">권한 DNS</text><rect x="160" y="64" width="100" height="44" class="box"/><text x="210" y="91" class="txt" text-anchor="middle">.10</text> <rect x="260" y="64" width="600" height="44" class="selected"/><text x="560" y="91" class="txt" text-anchor="middle">203.0.113.20</text><text x="16" y="164" class="txt" text-anchor="start">리졸버 캐시</text><rect x="160" y="142" width="600" height="44" class="selected"/><text x="460" y="169" class="txt" text-anchor="middle">203.0.113.10 · 최초 TTL 60초</text><rect x="760" y="142" width="100" height="44" class="missing"/><text x="810" y="169" class="txt" text-anchor="middle">만료</text><line x1="260" y1="108" x2="260" y2="140" class="line" stroke-dasharray="5 5"/><line x1="760" y1="186" x2="760" y2="230" class="line" stroke-dasharray="5 5"/><line x1="160" y1="232" x2="860" y2="232" class="line" marker-end="url(#arrow)"/><line x1="160" y1="224" x2="160" y2="240" class="line"/><text x="160" y="264" class="small" text-anchor="middle">0초</text><line x1="260" y1="224" x2="260" y2="240" class="line"/><text x="260" y="264" class="small" text-anchor="middle">10초</text><line x1="760" y1="224" x2="760" y2="240" class="line"/><text x="760" y="264" class="small" text-anchor="middle">60초</text><text x="330" y="211" class="small" text-anchor="middle">남은 TTL 약 50초 →</text><text x="760" y="294" class="small" text-anchor="middle">다음 질의 시 새 값 조회</text><text x="450" y="325" class="small" text-anchor="middle">일반 캐시 동작 예시 · 조기 제거·serve-stale 정책은 제외</text>
</svg>
