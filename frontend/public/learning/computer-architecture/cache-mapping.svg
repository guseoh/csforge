<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="cache-mapping-title cache-mapping-desc"><title id="cache-mapping-title">같은 set · 직접 사상과 2-way 연관</title><desc id="cache-mapping-desc">4개 line, direct 4set, 2-way 2set. 블록0과4는 양쪽에서 set0에 매핑. 초기 빈 캐시 A B A B 순 접근.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="410"/><text x="28" y="43" class="h" text-anchor="start">같은 set · 직접 사상과 2-way 연관</text><text x="28" y="80" class="s" text-anchor="start">같은 총 용량 4 line · A=block 0 · B=block 4</text>
<text x="28" y="119" class="b" text-anchor="start">직접 사상 (4 set × 1 way)</text>
<text x="500" y="119" class="b" text-anchor="start">2-way (2 set × 2 way)</text>
<text x="28" y="161" class="s" text-anchor="start">set 0</text><rect x="130" y="133" width="300" height="42" class="v"/><text x="280" y="162" class="s" text-anchor="middle">B</text>
<text x="28" y="206" class="s" text-anchor="start">set 1</text><rect x="130" y="178" width="300" height="42" class="p"/><text x="280" y="207" class="s" text-anchor="middle">비어 있음</text>
<text x="28" y="251" class="s" text-anchor="start">set 2</text><rect x="130" y="223" width="300" height="42" class="p"/><text x="280" y="252" class="s" text-anchor="middle">비어 있음</text>
<text x="28" y="296" class="s" text-anchor="start">set 3</text><rect x="130" y="268" width="300" height="42" class="p"/><text x="280" y="297" class="s" text-anchor="middle">비어 있음</text>
<text x="500" y="161" class="s" text-anchor="start">set 0</text><rect x="600" y="133" width="145" height="65" class="v"/><text x="672.5" y="173.5" class="s" text-anchor="middle">A</text><rect x="750" y="133" width="145" height="65" class="v"/><text x="822.5" y="173.5" class="s" text-anchor="middle">B</text>
<text x="500" y="236" class="s" text-anchor="start">set 1</text><rect x="600" y="208" width="145" height="65" class="p"/><text x="672.5" y="248.5" class="s" text-anchor="middle">비어 있음</text><rect x="750" y="208" width="145" height="65" class="p"/><text x="822.5" y="248.5" class="s" text-anchor="middle">비어 있음</text>
<text x="28" y="343" class="m" text-anchor="start">A → B → A → B</text>
