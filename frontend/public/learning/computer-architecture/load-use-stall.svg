<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 477" role="img" aria-labelledby="load-use-stall-title load-use-stall-desc"><title id="load-use-stall-title">ALU forwarding과 load-use stall</title><desc id="load-use-stall-desc">고전 5단계 in-order, MEM 1cycle, EX forwarding 가정. ALU 연산 결과는 다음 EX로, load-use는 ID 1cycle 대기.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="477"/><text x="28" y="43" class="h" text-anchor="start">ALU forwarding과 load-use stall</text><text x="28" y="82" class="s" text-anchor="start">고전적 5-stage · MEM 1 cycle · EX forwarding</text>
