<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="coherence-states-title coherence-states-desc"><title id="coherence-states-title">라인 X의 복사본 · 무효화와 최신 값</title><desc id="coherence-states-desc">write invalidate 단순 모델. 두 코어 공유10, A가 쓰기권 획득 후20, B 무효. B 다시 읽을 때 최신20 필요.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="385"/><text x="28" y="43" class="h" text-anchor="start">라인 X의 복사본 · 무효화와 최신 값</text><text x="28" y="80" class="s" text-anchor="start">하나의 물리 라인 X · 단순 write-invalidate 모델</text>
<text x="28" y="131" class="b" text-anchor="start">공유 읽기</text>
<rect x="270" y="102" width="270" height="59" class="p"/><text x="405" y="139.5" class="s" text-anchor="middle">A: 공유 10</text>
<rect x="660" y="102" width="270" height="59" class="p"/><text x="795" y="139.5" class="s" text-anchor="middle">B: 공유 10</text>
<text x="28" y="209" class="b" text-anchor="start">A가 쓰기 완료</text>
<rect x="270" y="180" width="270" height="59" class="v"/><text x="405" y="217.5" class="s" text-anchor="middle">A: 소유 20</text>
<rect x="660" y="180" width="270" height="59" class="z"/><text x="795" y="217.5" class="s" text-anchor="middle">B: 무효 (사용 금지)</text>
<path d="M540 209H652" class="e"/>
<text x="28" y="287" class="b" text-anchor="start">B가 다시 읽기</text>
<rect x="270" y="258" width="270" height="59" class="p"/><text x="405" y="295.5" class="s" text-anchor="middle">A: 값 20</text>
<rect x="660" y="258" width="270" height="59" class="p"/><text x="795" y="295.5" class="s" text-anchor="middle">B: 최신 20</text>
<path d="M540 287H652" class="e"/>
<text x="28" y="362" class="s" text-anchor="start">B의 재조회는 최신 데이터를 얻어야 합니다. 실제 프로토콜의 메시지·상태 전이는 생략합니다.</text></svg>
