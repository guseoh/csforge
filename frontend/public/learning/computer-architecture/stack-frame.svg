<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="stack-frame-title stack-frame-desc"><title id="stack-frame-title">RV64 함수 호출 · 스택 프레임의 수명</title><desc id="stack-frame-desc">S는 16바이트 정렬. S-32로 sp 이동, S-8에 ra, S-16에 s0 저장, helper 호출 후 복원 및 S 복구.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="410"/><text x="28" y="43" class="h" text-anchor="start">RV64 함수 호출 · 스택 프레임의 수명</text><text x="28" y="80" class="s" text-anchor="start">표준 정수 ABI · 낮은 주소가 아래쪽 · 32바이트 프레임</text>
<text x="173" y="120" class="b" text-anchor="middle">진입</text>
<text x="36" y="153" class="m" text-anchor="start">S</text>
<rect x="67" y="158" width="220" height="43" class="z"/><text x="177" y="187.5" class="s" text-anchor="middle"></text>
<rect x="67" y="201" width="220" height="43" class="z"/><text x="177" y="230.5" class="s" text-anchor="middle"></text>
<rect x="67" y="244" width="220" height="43" class="z"/><text x="177" y="273.5" class="s" text-anchor="middle"></text>
<rect x="67" y="287" width="220" height="43" class="z"/><text x="177" y="316.5" class="s" text-anchor="middle"></text>
<path d="M315 158H291" class="e"/>
<text x="173" y="365" class="m" text-anchor="middle">sp = S</text>
<text x="483" y="120" class="b" text-anchor="middle">helper 호출 전후</text>
<text x="346" y="153" class="m" text-anchor="start">S</text>
<rect x="377" y="158" width="220" height="43" class="v"/><text x="487" y="187.5" class="s" text-anchor="middle">ra (S−8)</text>
<rect x="377" y="201" width="220" height="43" class="v"/><text x="487" y="230.5" class="s" text-anchor="middle">s0 (S−16)</text>
<rect x="377" y="244" width="220" height="43" class="p"/><text x="487" y="273.5" class="s" text-anchor="middle">미사용</text>
<rect x="377" y="287" width="220" height="43" class="p"/><text x="487" y="316.5" class="s" text-anchor="middle">미사용</text>
<path d="M625 330H601" class="e"/>
<text x="483" y="365" class="m" text-anchor="middle">sp = S−32</text>
