<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" role="img" aria-labelledby="tlb-path-title tlb-path-desc"><title id="tlb-path-title">TLB miss와 page fault는 다르다</title><desc id="tlb-path-desc">하드웨어 관리 TLB 모델. 매핑 miss 시 page walker가 접근 가능한 매핑을 얻으면 TLB 채운 뒤 접근. 권한 위반 등 fault.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="476"/><text x="28" y="43" class="h">TLB hit/miss와 접근 권한은 별개</text><rect x="300" y="69" width="360" height="48" class="v"/><text x="480" y="100" class="s" text-anchor="middle">VPN + 접근 종류</text><path d="M480 117V142" class="e"/><rect x="320" y="149" width="320" height="46" class="p"/><text x="480" y="179" class="s" text-anchor="middle">TLB 조회</text><path d="M320 172H190V223" class="e"/><path d="M640 172H770V223" class="e"/><text x="190" y="214" class="s" text-anchor="middle">hit</text><text x="770" y="214" class="s" text-anchor="middle">miss</text><rect x="28" y="230" width="324" height="50" class="p"/><text x="190" y="262" class="s" text-anchor="middle">캐시된 변환 정보</text><rect x="608" y="230" width="324" height="50" class="p"/><text x="770" y="262" class="s" text-anchor="middle">walker · 매핑 탐색</text><path d="M190 280V313H474" class="e"/><path d="M770 280V313H486" class="e"/><rect x="290" y="320" width="380" height="46" class="v"/><text x="480" y="350" class="s" text-anchor="middle">유효 매핑·접근 권한 확인</text><path d="M290 343H180V393" class="e"/><path d="M670 343H780V393" class="e"/><text x="180" y="383" class="s" text-anchor="middle">허용</text><text x="780" y="383" class="s" text-anchor="middle">실패</text><rect x="28" y="400" width="380" height="49" class="v"/><text x="218" y="431.5" class="s" text-anchor="middle">PA 구성 · miss면 TLB 채움</text><rect x="552" y="400" width="380" height="49" class="p"/><text x="742" y="431.5" class="s" text-anchor="middle">아키텍처가 정의한 fault</text><text x="28" y="467" class="s">하드웨어 walker 모델. 실제 권한 검사·채움 시점은 구현에 따라 다릅니다.</text></svg>
