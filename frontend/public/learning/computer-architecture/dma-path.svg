<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="dma-path-title dma-path-desc"><title id="dma-path-title">DMA · 제어 경로와 데이터 경로</title><desc id="dma-path-desc">CPU가 버퍼 디스크립터 준비, 장치가 DMA로 메모리에 데이터 기록, 장치 완료 알림 또는 폴링, CPU가 완료 확인 및 필요한 동기화.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="374"/><text x="28" y="43" class="h" text-anchor="start">DMA · 제어 경로와 데이터 경로</text><text x="28" y="80" class="s" text-anchor="start">수신 DMA 예시 · 장치 주소 매핑과 플랫폼별 동기화는 별도 조건</text>
<rect x="28" y="119" width="230" height="74" class="p"/><text x="143" y="164" class="b" text-anchor="middle">CPU / driver</text>
<rect x="702" y="119" width="230" height="74" class="p"/><text x="817" y="164" class="b" text-anchor="middle">장치 / DMA</text>
<path d="M258 141H694" class="e"/>
<text x="476" y="131" class="s" text-anchor="middle">디스크립터 제출</text>
<path d="M702 177H266" class="e"/>
<text x="480" y="204" class="s" text-anchor="middle">완료 상태 확인 / 알림</text>
<rect x="365" y="258" width="230" height="70" class="v"/><text x="480" y="301" class="b" text-anchor="middle">메모리 버퍼</text>
<path d="M817 193V293H603" class="e"/>
<text x="748" y="282" class="s" text-anchor="middle">DMA 데이터 쓰기</text>
<path d="M143 193V293H357" class="e"/>
<text x="217" y="282" class="s" text-anchor="middle">완료 후 소비</text>
<text x="28" y="354" class="s" text-anchor="start">CPU가 데이터 블록의 각 바이트를 직접 복사하지 않습니다.</text></svg>
