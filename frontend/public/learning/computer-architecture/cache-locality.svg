<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="cache-locality-title cache-locality-desc"><title id="cache-locality-title">연속 접근과 큰 stride</title><desc id="cache-locality-desc">64B line, 4B element, 정렬된 배열, cold cache에서 4번 읽기. 순차 0 1 2 3은 한 라인, stride 0 16 32 48은 네 라인.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="a"/></marker><style>.bg{fill:#fff}.h{fill:#171717;font:700 27px system-ui,sans-serif}.b{fill:#222;font:600 23px system-ui,sans-serif}.s{fill:#444;font:20px system-ui,sans-serif}.m{fill:#222;font:600 23px monospace}.p{fill:#fafafa;stroke:#888;stroke-width:1.5}.v{fill:#e0e0e0;stroke:#333;stroke-width:2}.z{fill:none;stroke:#999;stroke-dasharray:5 5}.l,.e{fill:none;stroke:#666;stroke-width:2}.e{marker-end:url(#arrow)}.a{fill:#666}@media(prefers-color-scheme:dark){.bg{fill:#171717}.h,.b,.m{fill:#eee}.s{fill:#ccc}.p{fill:#242424;stroke:#aaa}.v{fill:#383838;stroke:#eee}.l,.e{stroke:#bbb}.a{fill:#bbb}}</style></defs><rect class="bg" width="960" height="350"/><text x="28" y="43" class="h" text-anchor="start">연속 접근과 큰 stride</text><text x="28" y="80" class="s" text-anchor="start">64B line · 원소 4B · 배열 시작 주소는 라인에 정렬</text>
<text x="28" y="141" class="b" text-anchor="start">연속 읽기</text>
<rect x="205" y="112" width="180" height="60" class="v"/><text x="295" y="138" class="m" text-anchor="middle">0–15</text><text x="295" y="162" class="s" text-anchor="middle">읽기: 0,1,2,3</text>
<rect x="387" y="112" width="180" height="60" class="p"/><text x="477" y="138" class="m" text-anchor="middle">16–31</text><text x="477" y="162" class="s" text-anchor="middle">접근 없음</text>
<rect x="569" y="112" width="180" height="60" class="p"/><text x="659" y="138" class="m" text-anchor="middle">32–47</text><text x="659" y="162" class="s" text-anchor="middle">접근 없음</text>
<rect x="751" y="112" width="180" height="60" class="p"/><text x="841" y="138" class="m" text-anchor="middle">48–63</text><text x="841" y="162" class="s" text-anchor="middle">접근 없음</text>
<text x="28" y="241" class="b" text-anchor="start">stride 16</text>
<rect x="205" y="212" width="180" height="60" class="v"/><text x="295" y="238" class="m" text-anchor="middle">0–15</text><text x="295" y="262" class="s" text-anchor="middle">읽기: 0</text>
<rect x="387" y="212" width="180" height="60" class="v"/><text x="477" y="238" class="m" text-anchor="middle">16–31</text><text x="477" y="262" class="s" text-anchor="middle">읽기: 16</text>
<rect x="569" y="212" width="180" height="60" class="v"/><text x="659" y="238" class="m" text-anchor="middle">32–47</text><text x="659" y="262" class="s" text-anchor="middle">읽기: 32</text>
<rect x="751" y="212" width="180" height="60" class="v"/><text x="841" y="238" class="m" text-anchor="middle">48–63</text><text x="841" y="262" class="s" text-anchor="middle">읽기: 48</text>
<text x="28" y="319" class="s" text-anchor="start">초기 빈 캐시·프리페치/교체 생략: 필요한 라인 1개 vs 4개</text></svg>
