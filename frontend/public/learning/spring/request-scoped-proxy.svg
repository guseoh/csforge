<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="request-scoped-proxy-title request-scoped-proxy-desc"><title id="request-scoped-proxy-title">Request scoped proxy · 호출 시 대상 선택</title><desc id="request-scoped-proxy-desc">하나의 AuditService와 proxy를 공유하지만 요청 A는 RequestContext A, 요청 B는 B로 위임된다. 요청 scope가 없으면 대상 조회에 실패할 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="380"/><rect x="50" y="50" width="860" height="115" rx="5" class="r"/><text x="75" y="78" class="s" text-anchor="start">애플리케이션 수명</text><rect x="100" y="95" width="300" height="50" rx="5" class="r"/><text x="250" y="127" class="m" text-anchor="middle">AuditService (singleton)</text><rect x="560" y="95" width="300" height="50" rx="5" class="a"/><text x="710" y="127" class="m" text-anchor="middle">RequestContext proxy</text><line x1="400" y1="120" x2="560" y2="120" class="strong" marker-end="url(#arrow)"/><rect x="60" y="220" width="400" height="110" rx="5" class="r"/><rect x="500" y="220" width="400" height="110" rx="5" class="r"/><text x="85" y="245" class="s" text-anchor="start">요청 A 활성</text><text x="525" y="245" class="s" text-anchor="start">요청 B 활성</text><rect x="100" y="260" width="320" height="50" rx="5" class="r"/><text x="260" y="292" class="m" text-anchor="middle">RequestContext #A</text><rect x="540" y="260" width="320" height="50" rx="5" class="r"/><text x="700" y="292" class="m" text-anchor="middle">RequestContext #B</text><path d="M660 145 V184 H260 V260" class="strong" marker-end="url(#arrow)"/><path d="M760 145 V260" class="strong" marker-end="url(#arrow)"/><text x="260" y="210" class="s" text-anchor="middle">A에서 호출</text><text x="780" y="210" class="s" text-anchor="middle">B에서 호출</text><text x="480" y="365" class="s" text-anchor="middle">동시에 두 대상으로 보내는 것이 아니라 호출 시 활성 scope 하나를 조회합니다.</text></svg>
