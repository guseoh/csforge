<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="object-graph-references-title object-graph-references-desc"><title id="object-graph-references-title">실행 중 객체 그래프 · 참조와 협력</title><desc id="object-graph-references-desc">OrderController는 OrderService를 참조하고 Service는 실제 Repository와 Gateway 구현 객체를 참조한다. 생성 순서가 아닌 참조 관계를 표시한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="310"/><rect x="45" y="110" width="240" height="60" rx="4" class="r"/><text x="165" y="147" class="m" text-anchor="middle">OrderController</text><rect x="365" y="110" width="230" height="60" rx="4" class="a"/><text x="480" y="147" class="m" text-anchor="middle">OrderService</text><rect x="675" y="50" width="245" height="60" rx="4" class="r"/><text x="797.5" y="87" class="m" text-anchor="middle">JpaOrderRepository</text><rect x="675" y="210" width="245" height="60" rx="4" class="r"/><text x="797.5" y="247" class="m" text-anchor="middle">PaymentGateway</text><line x1="285" y1="140" x2="365" y2="140" class="strong" marker-end="url(#arrow)"/><path d="M595 140 H635 V80 H675" class="l" marker-end="url(#arrow)"/><path d="M595 140 H635 V240 H675" class="l" marker-end="url(#arrow)"/><text x="325" y="125" class="s" text-anchor="middle">참조</text><text x="797" y="138" class="s" text-anchor="middle">저장 구현 객체</text><text x="797" y="293" class="s" text-anchor="middle">결제 협력 객체</text><text x="480" y="30" class="h" text-anchor="middle">실제 생성된 객체의 참조 관계</text></svg>
