<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="transaction-required-boundary-title transaction-required-boundary-desc"><title id="transaction-required-boundary-title">트랜잭션 프록시 · REQUIRED의 두 경로</title><desc id="transaction-required-boundary-desc">외부 호출을 intercept한 proxy가 기존 트랜잭션 존재 여부에 따라 새 T1을 시작하거나 T0에 참여한다. 신규 경계가 물리적 완료를 결정하고 참여 경계는 외부 트랜잭션 완료를 기다린다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="34" class="h" text-anchor="middle">외부 호출 → proxy / TransactionInterceptor</text><line x1="480" y1="48" x2="480" y2="80" class="strong" marker-end="url(#arrow)"/><rect x="345" y="80" width="270" height="52" rx="5" class="r"/><text x="480" y="113" class="m" text-anchor="middle">TransactionManager</text><path d="M480 132 V165 H245 V195" class="l" marker-end="url(#arrow)"/><path d="M480 132 V165 H715 V195" class="l" marker-end="url(#arrow)"/><text x="245" y="185" class="s" text-anchor="middle">기존 트랜잭션 없음</text><text x="715" y="185" class="s" text-anchor="middle">참여 가능한 T0 존재</text><rect x="45" y="195" width="400" height="145" rx="5" class="a"/><rect x="515" y="195" width="400" height="145" rx="5" class="r"/><text x="245" y="222" class="m" text-anchor="middle">새 T1 시작</text><text x="715" y="222" class="m" text-anchor="middle">기존 T0에 참여</text><rect x="90" y="242" width="310" height="50" rx="5" class="r"/><text x="245" y="274" class="m" text-anchor="middle">OrderService.place()</text><rect x="560" y="242" width="310" height="50" rx="5" class="r"/><text x="715" y="274" class="m" text-anchor="middle">OrderService.place()</text><text x="245" y="322" class="s" text-anchor="middle">신규 경계에서 완료 판단</text><text x="715" y="322" class="s" text-anchor="middle">외부 경계에서 물리적 완료</text><text x="480" y="375" class="s" text-anchor="middle">정상 반환·예외·rollback-only 상태에 따라 결과가 결정됩니다.</text><text x="480" y="397" class="s" text-anchor="middle">DB 격리와 잠금은 자원 트랜잭션의 책임입니다.</text></svg>
