<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="shutdown-drain-timeline-title shutdown-drain-timeline-desc"><title id="shutdown-drain-timeline-title">정상 종료 · 신규 요청 차단과 진행 중 작업</title><desc id="shutdown-drain-timeline-desc">종료 신호 이후 신규 요청 유입을 중단하고 이미 진행 중인 요청에 제한 시간 동안 완료 기회를 준다. 제한 시간이 초과되면 종료가 진행될 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="32" class="h" text-anchor="middle">정상 서비스 → 종료 처리 → 프로세스 종료</text><line x1="200" y1="80" x2="900" y2="80" class="l" marker-end="url(#arrow)"/><text x="130" y="86" class="s" text-anchor="middle">시간</text><line x1="385" y1="60" x2="385" y2="328" class="d"/><line x1="780" y1="60" x2="780" y2="328" class="d"/><text x="385" y="55" class="s" text-anchor="middle">종료 시작</text><text x="780" y="55" class="s" text-anchor="middle">제한 시간</text><text x="35" y="136" class="m" text-anchor="start">새 요청</text><rect x="200" y="107" width="185" height="38" rx="4" class="a"/><text x="292" y="133" class="s" text-anchor="middle">수락</text><line x1="385" y1="126" x2="780" y2="126" class="d"/><text x="580" y="115" class="s" text-anchor="middle">신규 유입 중단</text><text x="35" y="207" class="m" text-anchor="start">기존 요청 A</text><rect x="260" y="178" width="345" height="38" rx="4" class="r"/><text x="430" y="204" class="s" text-anchor="middle">처리 계속</text><text x="605" y="243" class="s" text-anchor="middle">완료</text><text x="35" y="282" class="m" text-anchor="start">기존 요청 B</text><rect x="310" y="253" width="470" height="38" rx="4" class="r"/><text x="545" y="279" class="s" text-anchor="middle">처리 계속</text><line x1="780" y1="272" x2="860" y2="272" class="d"/><text x="830" y="310" class="s" text-anchor="middle">중단 가능</text><text x="480" y="350" class="s" text-anchor="middle">종료 제한을 넘기면 요청이 반드시 완료되는 것은 아닙니다.</text><text x="480" y="375" class="s" text-anchor="middle">executor·DB pool 등 자원 종료는 수명주기와 별도 정책에 따릅니다.</text></svg>
