<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="http-body-conversion-boundary-title http-body-conversion-boundary-desc"><title id="http-body-conversion-boundary-title">HTTP 메시지 변환 · JSON 파싱과 검증의 분리</title><desc id="http-body-conversion-boundary-desc">요청 JSON을 converter가 객체로 변환한다. 형식 오류는 변환 실패이고 quantity 0은 객체 변환 후 Valid Min 검증에서 실패할 수 있다. 성공한 경우 Controller 실행.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="450"/><text x="480" y="32" class="h" text-anchor="middle">@RequestBody @Valid CreateOrderRequest · quantity는 int, @Min(1)</text><text x="160" y="83" class="s" text-anchor="middle">HTTP JSON 본문</text><text x="480" y="83" class="s" text-anchor="middle">메시지 변환</text><text x="800" y="83" class="s" text-anchor="middle">검증 / Controller</text><line x1="320" y1="62" x2="320" y2="385" class="d"/><line x1="640" y1="62" x2="640" y2="385" class="d"/><rect x="35" y="110" width="250" height="54" rx="4" class="r"/><text x="160" y="144" class="m" text-anchor="middle">{"quantity":"abc"}</text><rect x="355" y="110" width="250" height="54" rx="4" class="a"/><text x="480" y="144" class="m" text-anchor="middle">변환 실패</text><line x1="285" y1="137" x2="355" y2="137" class="l" marker-end="url(#arrow)"/><text x="800" y="144" class="s" text-anchor="middle">Controller 미호출</text><rect x="35" y="200" width="250" height="54" rx="4" class="r"/><text x="160" y="234" class="m" text-anchor="middle">{"quantity":0}</text><rect x="355" y="200" width="250" height="54" rx="4" class="r"/><text x="480" y="234" class="m" text-anchor="middle">DTO(quantity=0)</text><rect x="675" y="200" width="250" height="54" rx="4" class="a"/><text x="800" y="234" class="m" text-anchor="middle">@Min(1) 실패</text><line x1="285" y1="227" x2="355" y2="227" class="l" marker-end="url(#arrow)"/><line x1="605" y1="227" x2="675" y2="227" class="l" marker-end="url(#arrow)"/><rect x="35" y="290" width="250" height="54" rx="4" class="r"/><text x="160" y="324" class="m" text-anchor="middle">{"quantity":2}</text><rect x="355" y="290" width="250" height="54" rx="4" class="r"/><text x="480" y="324" class="m" text-anchor="middle">DTO(quantity=2)</text><rect x="675" y="290" width="250" height="54" rx="4" class="r"/><text x="800" y="324" class="m" text-anchor="middle">Controller 호출</text><line x1="285" y1="317" x2="355" y2="317" class="l" marker-end="url(#arrow)"/><line x1="605" y1="317" x2="675" y2="317" class="l" marker-end="url(#arrow)"/><text x="480" y="410" class="s" text-anchor="middle">Content-Type: application/json · 적합한 converter와 @Valid 적용을 가정</text><text x="480" y="435" class="s" text-anchor="middle">오류가 나면 정상 호출 경로를 벗어납니다 (일반적인 예).</text></svg>
