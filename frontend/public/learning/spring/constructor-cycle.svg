<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="constructor-cycle-title constructor-cycle-desc"><title id="constructor-cycle-title">생성자 주입 · 객체 그래프가 완성되지 않는 이유</title><desc id="constructor-cycle-desc">OrderService와 PaymentService가 서로 생성자 인자로 필요하다. CheckoutUseCase가 협력을 조정하는 대안은 순환이 없다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="230" y="35" class="h" text-anchor="middle">생성자 의존 순환</text><text x="730" y="35" class="h" text-anchor="middle">조정 책임을 분리한 예</text><line x1="480" y1="58" x2="480" y2="310" class="d"/><rect x="55" y="100" width="350" height="52" rx="5" class="a"/><text x="230" y="133" class="m" text-anchor="middle">OrderService</text><rect x="55" y="222" width="350" height="52" rx="5" class="a"/><text x="230" y="255" class="m" text-anchor="middle">PaymentService</text><line x1="160" y1="152" x2="160" y2="222" class="strong" marker-end="url(#arrow)"/><line x1="300" y1="222" x2="300" y2="152" class="strong" marker-end="url(#arrow)"/><text x="146" y="186" class="s" text-anchor="end">필요</text><text x="314" y="186" class="s" text-anchor="start">필요</text><text x="230" y="305" class="s" text-anchor="middle">두 객체 모두 생성 완료 불가</text><rect x="565" y="75" width="330" height="52" rx="5" class="a"/><text x="730" y="108" class="m" text-anchor="middle">CheckoutUseCase</text><rect x="515" y="220" width="125" height="52" rx="5" class="r"/><text x="577.5" y="253" class="m" text-anchor="middle">Order</text><rect x="650" y="220" width="140" height="52" rx="5" class="r"/><text x="720" y="253" class="m" text-anchor="middle">PaymentGateway</text><rect x="800" y="220" width="140" height="52" rx="5" class="r"/><text x="870" y="253" class="m" text-anchor="middle">OrderRepository</text><path d="M730 127 V167 H577 V220" class="l" marker-end="url(#arrow)"/><path d="M730 127 V220" class="l" marker-end="url(#arrow)"/><path d="M730 127 V167 H870 V220" class="l" marker-end="url(#arrow)"/><text x="730" y="305" class="s" text-anchor="middle">하위 객체는 조정 객체를 역참조하지 않음</text><text x="480" y="347" class="s" text-anchor="middle">생성자 순환은 설정 우회보다 의존 방향을 먼저 검토합니다.</text></svg>
