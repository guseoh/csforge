<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="binding-validation-title binding-validation-desc"><title id="binding-validation-title">HTTP 입력 바인딩과 Bean Validation 실패 단계</title><desc id="binding-validation-desc">원본 HTTP 입력은 파싱·메시지 변환, 데이터 바인딩·타입 변환, Bean Validation 3단계를 순서대로 통과하며 각 단계 실패는 Controller 진입 전 API 오류 변환 경계로 전달된다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 19px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 16px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="38" class="h" text-anchor="middle">입력 실패 3단계 파이프라인 (Controller 진입 전)</text><rect x="36" y="72" width="268" height="114" rx="6" class="r"/><text x="170" y="104" class="t" text-anchor="middle">1. 파싱 · 메시지 변환</text><text x="170" y="134" class="s" text-anchor="middle">깨진 JSON · 미지원 타입</text><text x="170" y="164" class="m" text-anchor="middle">HttpMessageNotReadable</text><line x1="304" y1="129" x2="342" y2="129" class="strong" marker-end="url(#arrow)"/><rect x="346" y="72" width="268" height="114" rx="6" class="r"/><text x="480" y="104" class="t" text-anchor="middle">2. 바인딩 · 타입 변환</text><text x="480" y="134" class="s" text-anchor="middle">page=abc → int 변환 실패</text><text x="480" y="164" class="m" text-anchor="middle">TypeMismatchException</text><line x1="614" y1="129" x2="652" y2="129" class="strong" marker-end="url(#arrow)"/><rect x="656" y="72" width="268" height="114" rx="6" class="a"/><text x="790" y="104" class="t" text-anchor="middle">3. Bean Validation</text><text x="790" y="134" class="s" text-anchor="middle">page=0 → @Min(1) 위반</text><text x="790" y="164" class="m" text-anchor="middle">MethodArgumentNotValid</text><line x1="170" y1="186" x2="170" y2="256" class="d" marker-end="url(#arrow)"/><line x1="480" y1="186" x2="480" y2="256" class="d" marker-end="url(#arrow)"/><line x1="790" y1="186" x2="790" y2="256" class="d" marker-end="url(#arrow)"/><text x="184" y="232" class="s">실패 시</text><text x="494" y="232" class="s">실패 시</text><text x="804" y="232" class="s">실패 시</text><rect x="96" y="260" width="768" height="86" rx="6" class="a"/><text x="480" y="294" class="t" text-anchor="middle">API 오류 변환기 (@RestControllerAdvice)</text><text x="480" y="325" class="s" text-anchor="middle">안정적인 외부 코드 · 수정 가능한 fieldErrors 제공 · 민감값(rejectedValue) 노출 차단</text><text x="480" y="394" class="s" text-anchor="middle">타입 변환에 실패하면 값 생성 자체가 안 되어 Bean Validation 단계에 도달하지 않는다</text></svg>
