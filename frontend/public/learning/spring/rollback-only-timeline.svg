<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="rollback-only-timeline-title rollback-only-timeline-desc"><title id="rollback-only-timeline-title">rollback-only · 예외를 잡아도 commit할 수 없는 이유</title><desc id="rollback-only-timeline-desc">외부 T1에 참여한 내부 REQUIRED proxy가 RuntimeException으로 rollback-only를 표시하는 예. 외부가 예외를 잡고 정상 반환해도 commit 시 전체 rollback 및 UnexpectedRollbackException이 발생할 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="360"/><text x="480" y="33" class="h" text-anchor="middle">외부 트랜잭션 T1 · 내부 REQUIRED 참여</text><rect x="50" y="65" width="860" height="210" rx="4" class="r"/><text x="75" y="93" class="m" text-anchor="start">T1</text><line x1="90" y1="132" x2="870" y2="132" class="strong"/><line x1="90" y1="122" x2="90" y2="142" class="strong"/><line x1="870" y1="122" x2="870" y2="142" class="strong"/><text x="90" y="162" class="s" text-anchor="middle">시작</text><text x="870" y="162" class="s" text-anchor="middle">완료</text><rect x="240" y="172" width="260" height="65" rx="4" class="a"/><text x="370" y="195" class="m" text-anchor="middle">내부 proxy 호출</text><text x="370" y="222" class="s" text-anchor="middle">RuntimeException</text><line x1="500" y1="205" x2="585" y2="205" class="strong" marker-end="url(#arrow)"/><text x="710" y="193" class="m" text-anchor="middle">rollback-only 표시</text><text x="710" y="220" class="s" text-anchor="middle">외부 catch · 정상 반환</text><text x="480" y="300" class="h" text-anchor="middle">외부 commit 요청 → 실제 rollback</text><text x="480" y="338" class="s" text-anchor="middle">UnexpectedRollbackException 가능 · 단순 catch 자체가 rollback을 뜻하지 않음</text></svg>
