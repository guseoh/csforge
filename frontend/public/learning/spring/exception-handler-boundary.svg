<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="exception-handler-title exception-handler-desc"><title id="exception-handler-title">트랜잭션 rollback 경계와 전역 HTTP 예외 변환 경계 분리</title><desc id="exception-handler-desc">Service에서 발생한 예외는 @Transactional 프록시 경계에서 먼저 rollback 여부가 결정된 뒤 Controller 밖으로 전파되어 @RestControllerAdvice가 HTTP 404, 409, 500 응답으로 번역한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 19px system-ui,sans-serif;fill:var(--fg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.s{font:400 16px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="200" y="38" class="h" text-anchor="middle">DB 트랜잭션 경계</text><text x="675" y="38" class="h" text-anchor="middle">HTTP 응답 변환 경계</text><line x1="398" y1="54" x2="398" y2="374" class="d"/><rect x="36" y="64" width="328" height="294" rx="8" class="r"/><rect x="64" y="96" width="272" height="78" rx="6" class="a"/><text x="200" y="130" class="m" text-anchor="middle">@Transactional Proxy</text><text x="200" y="156" class="s" text-anchor="middle">예외 규칙으로 rollback 확정</text><rect x="64" y="226" width="272" height="78" rx="6" class="r"/><text x="200" y="260" class="t" text-anchor="middle">Service / Domain</text><text x="200" y="286" class="s" text-anchor="middle">애플리케이션 · 도메인 예외 발생</text><line x1="200" y1="226" x2="200" y2="178" class="strong" marker-end="url(#arrow)"/><text x="214" y="206" class="s">예외 던짐</text><line x1="336" y1="135" x2="442" y2="135" class="strong" marker-end="url(#arrow)"/><text x="389" y="122" class="s" text-anchor="middle">전파</text><rect x="430" y="64" width="494" height="294" rx="8" class="r"/><rect x="444" y="96" width="218" height="78" rx="6" class="a"/><text x="553" y="130" class="m" text-anchor="middle">@RestControllerAdvice</text><text x="553" y="156" class="s" text-anchor="middle">프로토콜 계약 어댑터</text><path d="M 662 120 L 680 120 L 680 114 L 694 114" class="l" marker-end="url(#arrow)"/><path d="M 662 135 L 680 135 L 680 188 L 694 188" class="l" marker-end="url(#arrow)"/><path d="M 662 150 L 674 150 L 674 266 L 694 266" class="strong" marker-end="url(#arrow)"/><rect x="698" y="88" width="210" height="52" rx="6" class="r"/><text x="803" y="120" class="m" text-anchor="middle">NotFound → 404</text><rect x="698" y="162" width="210" height="52" rx="6" class="r"/><text x="803" y="194" class="m" text-anchor="middle">Conflict → 409</text><rect x="698" y="236" width="210" height="62" rx="6" class="a"/><text x="803" y="264" class="m" text-anchor="middle">Unexpected → 500</text><text x="803" y="286" class="s" text-anchor="middle">내부 스택 숨김 · 서버 로그</text><text x="553" y="256" class="s" text-anchor="middle">200 OK로 오류 은폐 금지</text><text x="553" y="282" class="s" text-anchor="middle">모든 예외 500 뭉개기 금지</text><text x="480" y="408" class="s" text-anchor="middle">@ExceptionHandler는 HTTP 응답 번역만 담당하며 DB rollback은 트랜잭션 프록시에서 이미 결정된다</text></svg>
