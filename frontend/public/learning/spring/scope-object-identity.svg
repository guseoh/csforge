<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="scope-object-identity-title scope-object-identity-desc"><title id="scope-object-identity-title">Bean scope · 조회 시점과 객체 정체성</title><desc id="scope-object-identity-desc">같은 컨테이너와 Bean 정의에서 singleton은 세 조회 모두 S1, prototype은 조회마다 P1 P2 P3, request는 요청 A의 두 조회가 R1, 요청 B의 조회가 R2이다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="32" class="h" text-anchor="middle">같은 Bean 정의를 세 번 조회한 경우</text><text x="347" y="78" class="s" text-anchor="middle">요청 A · 첫 조회</text><text x="547" y="78" class="s" text-anchor="middle">요청 A · 다음 조회</text><text x="747" y="78" class="s" text-anchor="middle">요청 B · 조회</text><text x="38" y="132" class="m" text-anchor="start">singleton</text><rect x="255" y="102" width="184" height="45" rx="4" class="a"/><text x="347" y="131.5" class="m" text-anchor="middle">S1</text><rect x="455" y="102" width="184" height="45" rx="4" class="r"/><text x="547" y="131.5" class="m" text-anchor="middle">S1</text><rect x="655" y="102" width="184" height="45" rx="4" class="r"/><text x="747" y="131.5" class="m" text-anchor="middle">S1</text><text x="255" y="170" class="s" text-anchor="start">모든 조회가 동일한 공유 객체</text><text x="38" y="230" class="m" text-anchor="start">prototype</text><rect x="255" y="200" width="184" height="45" rx="4" class="a"/><text x="347" y="229.5" class="m" text-anchor="middle">P1</text><rect x="455" y="200" width="184" height="45" rx="4" class="r"/><text x="547" y="229.5" class="m" text-anchor="middle">P2</text><rect x="655" y="200" width="184" height="45" rx="4" class="r"/><text x="747" y="229.5" class="m" text-anchor="middle">P3</text><text x="255" y="268" class="s" text-anchor="start">조회할 때마다 새 객체</text><text x="38" y="328" class="m" text-anchor="start">request</text><rect x="255" y="298" width="184" height="45" rx="4" class="a"/><text x="347" y="327.5" class="m" text-anchor="middle">R1</text><rect x="455" y="298" width="184" height="45" rx="4" class="r"/><text x="547" y="327.5" class="m" text-anchor="middle">R1</text><rect x="655" y="298" width="184" height="45" rx="4" class="r"/><text x="747" y="327.5" class="m" text-anchor="middle">R2</text><text x="255" y="366" class="s" text-anchor="start">같은 활성 요청 내 동일 객체 · 요청이 바뀌면 새 대상</text><text x="480" y="407" class="s" text-anchor="middle">같은 이름은 동일 객체를 의미합니다. 직접 주입 후 참조 재사용은 별개입니다.</text></svg>
