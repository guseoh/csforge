<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="test-vs-service-transaction-title test-vs-service-transaction-desc"><title id="test-vs-service-transaction-title">테스트 트랜잭션과 운영 서비스 트랜잭션</title><desc id="test-vs-service-transaction-desc">같은 스레드의 테스트 트랜잭션에 REQUIRED Service가 참여한다. 바깥 트랜잭션이 없는 운영에서는 서비스 proxy의 종료가 트랜잭션 완료 경계다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="480" y="33" class="h" text-anchor="middle">동일한 Service 호출 · 다른 트랜잭션 종료 시점</text><text x="35" y="83" class="h" text-anchor="start">테스트</text><rect x="155" y="55" width="720" height="108" rx="4" class="a"/><text x="515" y="83" class="m" text-anchor="middle">T_test (테스트가 소유)</text><rect x="285" y="98" width="250" height="46" rx="4" class="r"/><text x="410" y="127" class="s" text-anchor="middle">Service REQUIRED</text><text x="665" y="127" class="s" text-anchor="middle">반환 후 검증</text><text x="875" y="185" class="s" text-anchor="end">rollback</text><text x="35" y="249" class="h" text-anchor="start">운영</text><rect x="285" y="205" width="250" height="83" rx="4" class="a"/><text x="410" y="233" class="m" text-anchor="middle">T_service</text><text x="410" y="265" class="s" text-anchor="middle">Service 실행</text><text x="160" y="265" class="s" text-anchor="middle">Controller</text><text x="675" y="265" class="s" text-anchor="middle">응답 처리</text><line x1="220" y1="257" x2="285" y2="257" class="l" marker-end="url(#arrow)"/><line x1="535" y1="257" x2="610" y2="257" class="l" marker-end="url(#arrow)"/><text x="535" y="310" class="s" text-anchor="middle">flush / commit</text><text x="480" y="345" class="s" text-anchor="middle">동기 호출·외부 트랜잭션 없음(운영) · 예시에서는 OSIV 등 별도 관리 범위 제외</text></svg>
