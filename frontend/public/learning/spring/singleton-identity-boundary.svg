<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="singleton-identity-boundary-title singleton-identity-boundary-desc"><title id="singleton-identity-boundary-title">singleton · 같은 정의와 다른 컨테이너</title><desc id="singleton-identity-boundary-desc">컨텍스트 A의 두 소비자가 같은 OrderService 1을 참조한다. 독립 컨텍스트 B의 동일 클래스 Bean은 별도의 객체 2이다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="345"/><rect x="30" y="55" width="440" height="230" rx="4" class="r"/><rect x="490" y="55" width="440" height="230" rx="4" class="r"/><text x="250" y="82" class="h" text-anchor="middle">독립 컨텍스트 A</text><text x="710" y="82" class="h" text-anchor="middle">독립 컨텍스트 B</text><rect x="50" y="113" width="190" height="47" rx="4" class="r"/><text x="145" y="143.5" class="m" text-anchor="middle">Controller</text><rect x="260" y="113" width="190" height="47" rx="4" class="r"/><text x="355" y="143.5" class="m" text-anchor="middle">Scheduler</text><rect x="105" y="215" width="290" height="48" rx="4" class="a"/><text x="250" y="246" class="m" text-anchor="middle">OrderService #1</text><path d="M145 160 V190 H190 V215" class="strong" marker-end="url(#arrow)"/><path d="M355 160 V190 H310 V215" class="strong" marker-end="url(#arrow)"/><rect x="610" y="113" width="200" height="47" rx="4" class="r"/><text x="710" y="143.5" class="m" text-anchor="middle">Controller</text><rect x="565" y="215" width="290" height="48" rx="4" class="a"/><text x="710" y="246" class="m" text-anchor="middle">OrderService #2</text><line x1="710" y1="160" x2="710" y2="215" class="strong" marker-end="url(#arrow)"/><text x="480" y="320" class="s" text-anchor="middle">같은 컨테이너 · 같은 Bean 정의에 대한 공유 객체이지 JVM 전체의 한 객체가 아닙니다.</text></svg>
