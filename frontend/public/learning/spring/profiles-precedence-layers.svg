<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="profiles-precedence-title profiles-precedence-desc"><title id="profiles-precedence-title">Spring Boot 프로필과 설정 우선순위</title><desc id="profiles-precedence-desc">명령행 인자, OS 환경 변수, application-prod.yml, application.yml 순으로 같은 key를 탐색하며 가장 먼저 일치한 OS 환경 변수 SERVER_PORT=10080이 최종 Environment 값으로 선택된다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 20px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 17px system-ui,sans-serif;fill:var(--muted)}.m{font:600 18px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="305" y="38" class="h" text-anchor="middle">설정 소스 우선순위 (위 → 아래 탐색)</text><text x="775" y="38" class="h" text-anchor="middle">최종 실행 값</text><rect x="40" y="66" width="530" height="58" rx="6" class="r"/><text x="62" y="92" class="t">1. 명령행 인자</text><text x="62" y="114" class="s">--server.port=... (미지정)</text><text x="550" y="101" class="s" text-anchor="end">통과</text><rect x="40" y="142" width="530" height="58" rx="6" class="a"/><text x="62" y="168" class="t">2. OS 환경 변수</text><text x="62" y="190" class="m">SERVER_PORT=10080</text><text x="550" y="177" class="t" text-anchor="end">첫 일치</text><rect x="40" y="218" width="530" height="58" rx="6" class="r"/><text x="62" y="244" class="t">3. application-prod.yml</text><text x="62" y="266" class="m">server.port: 9090</text><text x="550" y="253" class="s" text-anchor="end">prod 후보</text><rect x="40" y="294" width="530" height="58" rx="6" class="r"/><text x="62" y="320" class="t">4. application.yml</text><text x="62" y="342" class="m">server.port: 8080</text><text x="550" y="329" class="s" text-anchor="end">기본 후보</text><line x1="570" y1="171" x2="632" y2="171" class="strong" marker-end="url(#arrow)"/><rect x="636" y="126" width="284" height="122" rx="6" class="a"/><text x="778" y="160" class="h" text-anchor="middle">Environment</text><text x="778" y="196" class="m" text-anchor="middle">server.port = 10080</text><text x="778" y="228" class="s" text-anchor="middle">상위 소스가 하위 값을 덮어씀</text><rect x="636" y="274" width="284" height="78" rx="6" class="r"/><text x="778" y="305" class="t" text-anchor="middle">프로필 = 후보 묶음 추가</text><text x="778" y="334" class="s" text-anchor="middle">우선순위 = 동일 key 최종 결정</text><text x="480" y="408" class="s" text-anchor="middle">운영 장애 추적은 설정 파일 내용이 아니라 활성 프로필과 상위 소스가 결합된 실행 값 기준</text></svg>
