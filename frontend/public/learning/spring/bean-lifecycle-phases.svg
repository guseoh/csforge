<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="bean-lifecycle-phases-title bean-lifecycle-phases-desc"><title id="bean-lifecycle-phases-title">Bean 생명주기 · 초기화와 종료의 경계</title><desc id="bean-lifecycle-phases-desc">일반 singleton의 생성 의존 설정 후 초기화 전 BPP에서 PostConstruct가 실행되고 InitializingBean과 custom init을 거쳐 초기화 후 BPP가 실행된다. 컨텍스트 종료 때 PreDestroy 등 파괴 콜백이 실행된다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="445"/><text x="480" y="33" class="h" text-anchor="middle">일반적인 singleton Bean · 대표 단계</text><text x="35" y="85" class="s" text-anchor="start">생성·초기화</text><rect x="35" y="100" width="170" height="60" rx="4" class="r"/><text x="120" y="137" class="m" text-anchor="middle">객체 생성</text><rect x="235" y="100" width="190" height="60" rx="4" class="r"/><text x="330" y="137" class="m" text-anchor="middle">의존성 설정</text><rect x="455" y="100" width="220" height="60" rx="4" class="a"/><text x="565" y="137" class="m" text-anchor="middle">초기화 전 BPP</text><rect x="705" y="100" width="220" height="60" rx="4" class="r"/><text x="815" y="137" class="m" text-anchor="middle">init 콜백</text><line x1="205" y1="130" x2="235" y2="130" class="l" marker-end="url(#arrow)"/><line x1="425" y1="130" x2="455" y2="130" class="l" marker-end="url(#arrow)"/><line x1="675" y1="130" x2="705" y2="130" class="l" marker-end="url(#arrow)"/><text x="565" y="185" class="s" text-anchor="middle">@PostConstruct 포함</text><text x="815" y="185" class="s" text-anchor="middle">afterPropertiesSet()</text><text x="815" y="208" class="s" text-anchor="middle">→ custom init</text><path d="M925 130 H940 V236 H345 V250" class="l" marker-end="url(#arrow)"/><rect x="220" y="250" width="250" height="55" rx="4" class="a"/><text x="345" y="284.5" class="m" text-anchor="middle">초기화 후 BPP</text><rect x="550" y="250" width="250" height="55" rx="4" class="r"/><text x="675" y="284.5" class="m" text-anchor="middle">사용 가능한 Bean</text><line x1="470" y1="277" x2="550" y2="277" class="l" marker-end="url(#arrow)"/><text x="345" y="328" class="s" text-anchor="middle">일반적인 AOP proxy 적용</text><path d="M675 305 V350 H480 V365" class="l" marker-end="url(#arrow)"/><rect x="200" y="365" width="560" height="50" rx="4" class="r"/><text x="480" y="397" class="m" text-anchor="middle">종료 시 @PreDestroy → destroy 콜백</text><text x="480" y="437" class="s" text-anchor="middle">prototype의 소멸은 일반적으로 컨테이너가 자동 관리하지 않음</text></svg>
