<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="entity-states-title entity-states-desc"><title id="entity-states-title">JPA Entity · 관리 상태와 merge 반환 객체</title><desc id="entity-states-desc">new entity가 persist로 managed가 되고 detach 등으로 detached가 된다. managed 객체 remove는 removed로 전환한다. detached D의 merge는 상태를 managed M에 복사하며 D 자체를 관리 대상으로 바꾸지 않는다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><rect x="55" y="85" width="215" height="55" rx="5" class="r"/><text x="162.5" y="119.5" class="m" text-anchor="middle">new / transient</text><rect x="375" y="85" width="215" height="55" rx="5" class="a"/><text x="482.5" y="119.5" class="m" text-anchor="middle">managed</text><rect x="695" y="85" width="215" height="55" rx="5" class="r"/><text x="802.5" y="119.5" class="m" text-anchor="middle">removed</text><line x1="270" y1="112" x2="375" y2="112" class="strong" marker-end="url(#arrow)"/><text x="322" y="98" class="s" text-anchor="middle">persist</text><line x1="590" y1="112" x2="695" y2="112" class="l" marker-end="url(#arrow)"/><text x="642" y="98" class="s" text-anchor="middle">remove</text><rect x="375" y="220" width="215" height="55" rx="5" class="r"/><text x="482.5" y="254.5" class="m" text-anchor="middle">detached</text><line x1="483" y1="140" x2="483" y2="220" class="l" marker-end="url(#arrow)"/><text x="495" y="182" class="s" text-anchor="start">detach / clear / close</text><rect x="45" y="307" width="870" height="97" rx="5" class="r"/><rect x="65" y="330" width="245" height="52" rx="5" class="r"/><text x="187.5" y="363" class="m" text-anchor="middle">detached D</text><rect x="650" y="330" width="245" height="52" rx="5" class="a"/><text x="772.5" y="363" class="m" text-anchor="middle">managed M</text><line x1="310" y1="356" x2="650" y2="356" class="strong" marker-end="url(#arrow)"/><text x="480" y="344" class="s" text-anchor="middle">merge(D): 상태 복사</text><text x="480" y="397" class="s" text-anchor="middle">반환값 M 사용 · D 자체가 managed로 바뀌지 않음</text></svg>
