<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="app-ctx-bootstrap-title app-ctx-bootstrap-desc"><title id="app-ctx-bootstrap-title">ApplicationContext 부트스트랩 및 Bean 초기화 순서</title><desc id="app-ctx-bootstrap-desc">BeanDefinition 등록, BeanFactoryPostProcessor, 인스턴스 생성과 의존성 주입, 초기화 전 BeanPostProcessor(@PostConstruct), 초기화 콜백, 초기화 후 BeanPostProcessor(AOP 프록시) 순으로 객체 그래프가 완성된다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 20px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 16px system-ui,sans-serif;fill:var(--muted)}.m{font:600 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="38" class="h" text-anchor="middle">ApplicationContext 시작 단계와 후처리기 경계</text><rect x="36" y="68" width="266" height="82" rx="6" class="r"/><text x="169" y="102" class="t" text-anchor="middle">1. BeanDefinition 등록</text><text x="169" y="130" class="s" text-anchor="middle">컴포넌트 스캔 · @Bean 메타정보</text><line x1="302" y1="109" x2="344" y2="109" class="l" marker-end="url(#arrow)"/><rect x="347" y="68" width="266" height="82" rx="6" class="r"/><text x="480" y="102" class="m" text-anchor="middle">2. BeanFactoryPostProcessor</text><text x="480" y="130" class="s" text-anchor="middle">Bean 정의 보정 · 설정 값 해석</text><line x1="613" y1="109" x2="655" y2="109" class="l" marker-end="url(#arrow)"/><rect x="658" y="68" width="266" height="82" rx="6" class="r"/><text x="791" y="102" class="t" text-anchor="middle">3. 인스턴스 생성 + DI</text><text x="791" y="130" class="s" text-anchor="middle">생성자 호출 · 협력 Bean 주입</text><path d="M 791 150 L 791 178 L 169 178 L 169 204" class="strong" marker-end="url(#arrow)"/><rect x="36" y="208" width="266" height="86" rx="6" class="r"/><text x="169" y="242" class="t" text-anchor="middle">4. BPP 초기화 전 처리</text><text x="169" y="272" class="s" text-anchor="middle">@PostConstruct 실행 지점</text><line x1="302" y1="251" x2="344" y2="251" class="strong" marker-end="url(#arrow)"/><rect x="347" y="208" width="266" height="86" rx="6" class="r"/><text x="480" y="242" class="t" text-anchor="middle">5. 초기화 콜백</text><text x="480" y="272" class="s" text-anchor="middle">afterPropertiesSet · initMethod</text><line x1="613" y1="251" x2="655" y2="251" class="strong" marker-end="url(#arrow)"/><rect x="658" y="208" width="266" height="86" rx="6" class="a"/><text x="791" y="242" class="t" text-anchor="middle">6. BPP 초기화 후 처리</text><text x="791" y="272" class="s" text-anchor="middle">AOP 프록시(@Transactional) 래핑</text><line x1="791" y1="294" x2="791" y2="332" class="strong" marker-end="url(#arrow)"/><rect x="160" y="336" width="640" height="46" rx="6" class="a"/><text x="480" y="366" class="t" text-anchor="middle">완성된 객체 그래프 · 애플리케이션 요청 처리 준비</text><text x="480" y="412" class="s" text-anchor="middle">초기화 전/후 후처리기는 서로 다른 지점이며 AOP 프록시는 보통 초기화 후 단계에서 감싼다</text></svg>
