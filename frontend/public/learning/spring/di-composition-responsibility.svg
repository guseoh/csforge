<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="di-composition-responsibility-title di-composition-responsibility-desc"><title id="di-composition-responsibility-title">IoC와 DI · 조립 책임의 이동</title><desc id="di-composition-responsibility-desc">직접 생성에서는 Service가 Repository 구현을 new한다. 생성자 주입에서는 외부 조립자가 구현 객체를 생성하고 Service에 전달한다. Service의 참조 대상은 그대로 Repository다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="235" y="35" class="h" text-anchor="middle">직접 생성</text><text x="725" y="35" class="h" text-anchor="middle">생성자 주입</text><line x1="480" y1="50" x2="480" y2="380" class="d"/><rect x="65" y="95" width="340" height="55" rx="4" class="a"/><text x="235" y="129.5" class="m" text-anchor="middle">OrderService</text><rect x="65" y="270" width="340" height="55" rx="4" class="r"/><text x="235" y="304.5" class="m" text-anchor="middle">JpaOrderRepository</text><line x1="235" y1="150" x2="235" y2="270" class="strong" marker-end="url(#arrow)"/><text x="250" y="200" class="s" text-anchor="start">new + 참조</text><rect x="555" y="65" width="340" height="48" rx="4" class="r"/><text x="725" y="96" class="m" text-anchor="middle">ApplicationContext</text><rect x="555" y="175" width="340" height="55" rx="4" class="a"/><text x="725" y="209.5" class="m" text-anchor="middle">OrderService</text><rect x="555" y="270" width="340" height="55" rx="4" class="r"/><text x="725" y="304.5" class="m" text-anchor="middle">JpaOrderRepository</text><path d="M640 113 V145 H625 V175" class="d" marker-end="url(#arrow)"/><path d="M805 113 H925 V298 H895" class="d" marker-end="url(#arrow)"/><text x="610" y="141" class="s" text-anchor="middle">생성·주입</text><line x1="725" y1="230" x2="725" y2="270" class="strong" marker-end="url(#arrow)"/><text x="742" y="254" class="s" text-anchor="start">참조</text><text x="235" y="365" class="s" text-anchor="middle">서비스가 구현 선택·생성도 담당</text><text x="725" y="365" class="s" text-anchor="middle">외부가 선택·생성·연결 담당</text><text x="480" y="408" class="s" text-anchor="middle">실선: 실행 중 참조 · 점선: 외부 조립 책임</text></svg>
