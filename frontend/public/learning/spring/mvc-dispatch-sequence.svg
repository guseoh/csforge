<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="mvc-dispatch-sequence-title mvc-dispatch-sequence-desc"><title id="mvc-dispatch-sequence-title">DispatcherServlet · 요청 위임과 반환값 처리</title><desc id="mvc-dispatch-sequence-desc">Filter를 통과한 요청에서 DispatcherServlet은 HandlerMapping으로 handler를 찾고 HandlerAdapter에 호출을 위임한다. REST 응답 본문 처리 예시이며 예외는 별도 경로에서 해결을 시도한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="475"/><text x="85" y="30" class="s" text-anchor="middle">요청 / Filter</text><line x1="85" y1="43" x2="85" y2="393" class="d"/><text x="260" y="30" class="s" text-anchor="middle">DispatcherServlet</text><line x1="260" y1="43" x2="260" y2="393" class="d"/><text x="445" y="30" class="s" text-anchor="middle">HandlerMapping</text><line x1="445" y1="43" x2="445" y2="393" class="d"/><text x="635" y="30" class="s" text-anchor="middle">HandlerAdapter</text><line x1="635" y1="43" x2="635" y2="393" class="d"/><text x="835" y="30" class="s" text-anchor="middle">Controller</text><line x1="835" y1="43" x2="835" y2="393" class="d"/><line x1="85" y1="78" x2="260" y2="78" class="l" marker-end="url(#arrow)"/><text x="172.5" y="70" class="s" text-anchor="middle">HTTP 요청</text><line x1="260" y1="130" x2="445" y2="130" class="l" marker-end="url(#arrow)"/><text x="352.5" y="122" class="s" text-anchor="middle">handler 조회</text><line x1="445" y1="173" x2="260" y2="173" class="d" marker-end="url(#arrow)"/><text x="352.5" y="165" class="s" text-anchor="middle">선택 결과</text><line x1="260" y1="220" x2="635" y2="220" class="l" marker-end="url(#arrow)"/><text x="447.5" y="212" class="s" text-anchor="middle">호출 위임</text><line x1="635" y1="270" x2="835" y2="270" class="l" marker-end="url(#arrow)"/><text x="735" y="262" class="s" text-anchor="middle">인자 해석 후 호출</text><line x1="835" y1="314" x2="635" y2="314" class="d" marker-end="url(#arrow)"/><text x="735" y="306" class="s" text-anchor="middle">반환값</text><text x="635" y="346" class="s" text-anchor="middle">응답 본문 변환</text><line x1="635" y1="380" x2="260" y2="380" class="d" marker-end="url(#arrow)"/><text x="447.5" y="372" class="s" text-anchor="middle">처리 완료</text><line x1="260" y1="410" x2="85" y2="410" class="d" marker-end="url(#arrow)"/><text x="172.5" y="402" class="s" text-anchor="middle">HTTP 응답</text><text x="480" y="455" class="s" text-anchor="middle">별도 예외 경로: DispatcherServlet → HandlerExceptionResolver (해결 가능한 경우)</text></svg>
