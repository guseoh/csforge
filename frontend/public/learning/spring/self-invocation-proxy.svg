<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="self-invocation-proxy-title self-invocation-proxy-desc"><title id="self-invocation-proxy-title">Self-invocation · 같은 객체 내부 호출과 외부 호출</title><desc id="self-invocation-proxy-desc">place()가 같은 target의 saveOrder()를 직접 호출하면 saveOrder advice는 새롭게 적용되지 않는다. 외부 Bean이 별도 ItemSaveService의 proxy를 호출하면 advice 경계를 통과한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="235" y="34" class="h" text-anchor="middle">같은 target 내부 호출</text><text x="725" y="34" class="h" text-anchor="middle">별도 Bean 경계로 분리</text><line x1="480" y1="50" x2="480" y2="390" class="d"/><rect x="65" y="65" width="340" height="48" rx="5" class="r"/><text x="235" y="96" class="m" text-anchor="middle">외부 호출자</text><rect x="555" y="65" width="340" height="48" rx="5" class="r"/><text x="725" y="96" class="m" text-anchor="middle">BatchService</text><line x1="235" y1="113" x2="235" y2="145" class="l" marker-end="url(#arrow)"/><line x1="725" y1="113" x2="725" y2="145" class="strong" marker-end="url(#arrow)"/><rect x="65" y="145" width="340" height="48" rx="5" class="r"/><text x="235" y="176" class="m" text-anchor="middle">OrderService proxy</text><rect x="555" y="145" width="340" height="48" rx="5" class="a"/><text x="725" y="176" class="m" text-anchor="middle">ItemSaveService proxy</text><line x1="235" y1="193" x2="235" y2="225" class="l" marker-end="url(#arrow)"/><line x1="725" y1="193" x2="725" y2="225" class="strong" marker-end="url(#arrow)"/><rect x="45" y="225" width="380" height="145" rx="5" class="r"/><rect x="535" y="225" width="380" height="145" rx="5" class="r"/><text x="235" y="250" class="s" text-anchor="middle">실제 OrderService</text><text x="725" y="250" class="s" text-anchor="middle">실제 ItemSaveService</text><rect x="70" y="270" width="135" height="48" rx="5" class="r"/><text x="137.5" y="301" class="m" text-anchor="middle">place()</text><rect x="265" y="270" width="135" height="48" rx="5" class="r"/><text x="332.5" y="301" class="m" text-anchor="middle">saveOrder()</text><line x1="205" y1="294" x2="265" y2="294" class="strong" marker-end="url(#arrow)"/><text x="235" y="267" class="s" text-anchor="middle">this</text><rect x="570" y="270" width="310" height="48" rx="5" class="r"/><text x="725" y="301" class="m" text-anchor="middle">saveOne()</text><text x="235" y="350" class="s" text-anchor="middle">proxy 재진입 없음</text><text x="725" y="350" class="s" text-anchor="middle">proxy advice 적용 가능</text><text x="480" y="410" class="s" text-anchor="middle">내부 annotation 미적용 ≠ 기존 트랜잭션이 반드시 없음</text></svg>
