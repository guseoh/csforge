<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="config-proxy-vs-lite-title config-proxy-vs-lite-desc"><title id="config-proxy-vs-lite-title">@Configuration 프록시 모드와 Lite 모드 비교</title><desc id="config-proxy-vs-lite-desc">proxyBeanMethods=true인 @Configuration은 @Bean 간 직접 호출을 CGLIB 프록시가 가로채 컨테이너 싱글톤을 반환한다. @Component 또는 proxyBeanMethods=false는 일반 Java 호출로 새 비관리 객체를 생성한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 20px system-ui,sans-serif;fill:var(--fg)}.h{font:700 23px system-ui,sans-serif;fill:var(--fg)}.s{font:400 17px system-ui,sans-serif;fill:var(--muted)}.m{font:600 18px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="450"/><text x="235" y="38" class="h" text-anchor="middle">@Configuration (Full 모드)</text><text x="725" y="38" class="h" text-anchor="middle">@Component / proxyBeanMethods=false</text><line x1="480" y1="54" x2="480" y2="392" class="d"/><rect x="55" y="64" width="360" height="50" rx="6" class="a"/><text x="235" y="96" class="m" text-anchor="middle">AppConfig CGLIB Proxy</text><rect x="545" y="64" width="360" height="50" rx="6" class="r"/><text x="725" y="96" class="m" text-anchor="middle">AppConfig 원본 클래스 (Lite)</text><line x1="235" y1="114" x2="235" y2="144" class="strong" marker-end="url(#arrow)"/><line x1="725" y1="114" x2="725" y2="144" class="l" marker-end="url(#arrow)"/><rect x="55" y="148" width="360" height="54" rx="6" class="r"/><text x="235" y="182" class="m" text-anchor="middle">orderService() → orderRepository()</text><rect x="545" y="148" width="360" height="54" rx="6" class="r"/><text x="725" y="182" class="m" text-anchor="middle">orderService() → orderRepository()</text><line x1="235" y1="202" x2="235" y2="234" class="strong" marker-end="url(#arrow)"/><line x1="725" y1="202" x2="725" y2="234" class="d" marker-end="url(#arrow)"/><rect x="55" y="238" width="360" height="52" rx="6" class="a"/><text x="235" y="271" class="t" text-anchor="middle">컨테이너 싱글톤 조회 가로채기</text><rect x="545" y="238" width="360" height="52" rx="6" class="r"/><text x="725" y="271" class="t" text-anchor="middle">일반 Java 호출 (가로채기 없음)</text><line x1="235" y1="290" x2="235" y2="322" class="strong" marker-end="url(#arrow)"/><line x1="650" y1="290" x2="625" y2="322" class="l" marker-end="url(#arrow)"/><line x1="800" y1="290" x2="825" y2="322" class="strong" marker-end="url(#arrow)"/><rect x="95" y="326" width="280" height="54" rx="6" class="a"/><text x="235" y="359" class="m" text-anchor="middle">OrderRepository #1 (공유)</text><rect x="530" y="326" width="180" height="54" rx="6" class="r"/><text x="620" y="359" class="m" text-anchor="middle">Bean #1</text><rect x="730" y="326" width="195" height="54" rx="6" class="a"/><text x="827.5" y="359" class="m" text-anchor="middle">새 객체 #2 (비관리)</text><text x="480" y="424" class="s" text-anchor="middle">Lite 모드에서 @Bean 의존성이 필요하면 메서드 직접 호출 대신 파라미터 주입을 사용한다</text></svg>
