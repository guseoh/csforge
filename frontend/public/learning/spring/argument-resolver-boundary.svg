<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="arg-resolver-title arg-resolver-desc"><title id="arg-resolver-title">HandlerMethodArgumentResolver 요청 인자 해석 경계</title><desc id="arg-resolver-desc">HandlerAdapter가 매개변수별 ArgumentResolver를 선택한다. PathVariable과 RequestParam은 WebDataBinder로, RequestBody는 HttpMessageConverter로, 커스텀 애노테이션은 전용 Resolver로 Java 인자를 완성한 뒤 Controller를 호출한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 19px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 16px system-ui,sans-serif;fill:var(--muted)}.m{font:600 15.5px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="420"/><text x="480" y="38" class="h" text-anchor="middle">Controller 호출 전 인자 해석 분기</text><rect x="28" y="162" width="160" height="84" rx="6" class="r"/><text x="108" y="198" class="m" text-anchor="middle">HandlerAdapter</text><text x="108" y="226" class="s" text-anchor="middle">호출 인자 준비</text><line x1="188" y1="204" x2="222" y2="204" class="strong" marker-end="url(#arrow)"/><rect x="226" y="162" width="178" height="84" rx="6" class="a"/><text x="315" y="196" class="t" text-anchor="middle">Resolver 선택</text><text x="315" y="224" class="m" text-anchor="middle">supportsParameter</text><path d="M 404 186 L 424 186 L 424 102 L 444 102" class="l" marker-end="url(#arrow)"/><line x1="404" y1="204" x2="444" y2="204" class="strong" marker-end="url(#arrow)"/><path d="M 404 222 L 424 222 L 424 306 L 444 306" class="l" marker-end="url(#arrow)"/><rect x="448" y="66" width="310" height="72" rx="6" class="r"/><text x="603" y="96" class="m" text-anchor="middle">@PathVariable · @RequestParam</text><text x="603" y="123" class="s" text-anchor="middle">문자열 추출 → WebDataBinder 타입 변환</text><rect x="448" y="168" width="310" height="72" rx="6" class="a"/><text x="603" y="198" class="m" text-anchor="middle">@RequestBody</text><text x="603" y="225" class="s" text-anchor="middle">HttpMessageConverter (JSON → 객체)</text><rect x="448" y="270" width="310" height="72" rx="6" class="r"/><text x="603" y="300" class="m" text-anchor="middle">@CurrentMemberId (Custom)</text><text x="603" y="327" class="s" text-anchor="middle">SecurityContext → 애플리케이션 식별자</text><path d="M 758 102 L 778 102 L 778 186 L 796 186" class="l" marker-end="url(#arrow)"/><line x1="758" y1="204" x2="796" y2="204" class="strong" marker-end="url(#arrow)"/><path d="M 758 306 L 778 306 L 778 222 L 796 222" class="l" marker-end="url(#arrow)"/><rect x="800" y="132" width="132" height="144" rx="6" class="a"/><text x="866" y="186" class="m" text-anchor="middle">Controller</text><text x="866" y="216" class="s" text-anchor="middle">모든 인자</text><text x="866" y="240" class="s" text-anchor="middle">완성 후 진입</text><text x="480" y="394" class="s" text-anchor="middle">인자 해석이나 타입 변환이 실패하면 Controller 메서드 본문은 호출되지 않는다</text></svg>
