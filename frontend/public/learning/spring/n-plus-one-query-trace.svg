<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="n-plus-one-query-trace-title n-plus-one-query-trace-desc"><title id="n-plus-one-query-trace-title">N+1 · 객체 탐색이 추가 SQL이 되는 순간</title><desc id="n-plus-one-query-trace-desc">세 주문이 서로 다른 회원을 참조하고 기존 영속성 컨텍스트와 캐시에 회원이 없다고 가정한다. lazy 로딩 시 목록 조회 1회와 회원 조회 3회, to-one fetch join 예시에서는 목록 쿼리 한 번.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="390"/><text x="245" y="30" class="h" text-anchor="middle">지연 로딩 · 1 + 3회</text><text x="715" y="30" class="h" text-anchor="middle">to-one fetch join 예 · 1회</text><line x1="480" y1="50" x2="480" y2="345" class="d"/><text x="55" y="80" class="s" text-anchor="start">애플리케이션</text><text x="395" y="80" class="s" text-anchor="middle">DB</text><line x1="105" y1="92" x2="105" y2="320" class="d"/><line x1="395" y1="92" x2="395" y2="320" class="d"/><text x="250" y="110" class="m" text-anchor="middle">SELECT orders</text><line x1="105" y1="123" x2="395" y2="123" class="l" marker-end="url(#arrow)"/><text x="250" y="150" class="s" text-anchor="middle">Order 1 → member A</text><line x1="105" y1="162" x2="395" y2="162" class="l" marker-end="url(#arrow)"/><text x="250" y="189" class="s" text-anchor="middle">Order 2 → member B</text><line x1="105" y1="201" x2="395" y2="201" class="l" marker-end="url(#arrow)"/><text x="250" y="228" class="s" text-anchor="middle">Order 3 → member C</text><line x1="105" y1="240" x2="395" y2="240" class="l" marker-end="url(#arrow)"/><text x="250" y="285" class="s" text-anchor="middle">각 회원 접근 시 SELECT</text><text x="535" y="80" class="s" text-anchor="start">애플리케이션</text><text x="865" y="80" class="s" text-anchor="middle">DB</text><line x1="575" y1="92" x2="575" y2="320" class="d"/><line x1="865" y1="92" x2="865" y2="320" class="d"/><text x="720" y="110" class="m" text-anchor="middle">SELECT ... JOIN ...</text><line x1="575" y1="123" x2="865" y2="123" class="strong" marker-end="url(#arrow)"/><line x1="865" y1="165" x2="575" y2="165" class="d" marker-end="url(#arrow)"/><text x="720" y="153" class="s" text-anchor="middle">주문 + 회원</text><text x="720" y="226" class="s" text-anchor="middle">Order 1 → A · 2 → B · 3 → C</text><text x="720" y="266" class="s" text-anchor="middle">이미 로딩된 회원 사용</text><text x="480" y="368" class="s" text-anchor="middle">서로 다른 회원 3명 · 기존 캐시 없음 · count 쿼리 및 다른 연관관계 제외</text></svg>
