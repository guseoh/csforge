<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="write-read-freshness-title write-read-freshness-desc"><title id="write-read-freshness-title">쓰기 모델과 읽기 모델의 최신성 경계</title><desc id="write-read-freshness-desc">canonical v2 변경 결과 즉시 반환, 비동기 projection v1으로 검색 이전값 반환 가능. 전파 후 v2.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="33" class="h" text-anchor="middle">쓰기 이후 조회 · 같은 요청의 최신성 요구가 다를 수 있음</text><rect x="45" y="75" width="220" height="52" class="r"/><text x="155" y="107" class="m" text-anchor="middle">Command</text><line x1="265" y1="101" x2="325" y2="101" class="l" marker-end="url(#arr)"/><rect x="325" y="75" width="300" height="52" class="a"/><text x="475" y="107" class="m" text-anchor="middle">Canonical v2</text><line x1="625" y1="101" x2="700" y2="101" class="strong" marker-end="url(#arr)"/><rect x="700" y="75" width="220" height="52" class="r"/><text x="810" y="107" class="m" text-anchor="middle">응답 v2</text><path d="M475 127 V220" class="d" marker-end="url(#arr)"/><text x="490" y="177" class="s" text-anchor="start">전파 지연</text><rect x="325" y="220" width="300" height="52" class="r"/><text x="475" y="252" class="m" text-anchor="middle">Projection v1</text><line x1="625" y1="246" x2="700" y2="246" class="l" marker-end="url(#arr)"/><rect x="700" y="220" width="220" height="52" class="r"/><text x="810" y="252" class="m" text-anchor="middle">검색 → v1</text><text x="475" y="309" class="m" text-anchor="middle">전파 완료 후 v2</text><text x="480" y="355" class="s" text-anchor="middle">검색의 허용 오래됨과 쓰기 직후 최신 읽기 계약을 별도로 정의</text><text x="480" y="385" class="s" text-anchor="middle">재구축 가능한 원본과 변경 이력 · catch-up/검증 계획 필요</text></svg>
