<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="bulkhead-shared-pool-title bulkhead-shared-pool-desc"><title id="bulkhead-shared-pool-title">공유 작업자 포화와 격벽</title><desc id="bulkhead-shared-pool-desc">6 worker 공유에서 느린 optional 작업이 모두 점유. 3/3 격벽에서는 핵심 작업자가 남음.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="33" class="h" text-anchor="middle">같은 6개 worker · 선택 기능 장애의 전파 범위</text><text x="230" y="78" class="h" text-anchor="middle">공유 pool</text><text x="35" y="127" class="m" text-anchor="start">공유</text><text x="35" y="215" class="m" text-anchor="start">공유</text><rect x="170" y="110" width="70" height="58" class="a"/><text x="205" y="145" class="m" text-anchor="middle">대기</text><rect x="250" y="110" width="70" height="58" class="a"/><text x="285" y="145" class="m" text-anchor="middle">대기</text><rect x="330" y="110" width="70" height="58" class="a"/><text x="365" y="145" class="m" text-anchor="middle">대기</text><rect x="170" y="190" width="70" height="58" class="a"/><text x="205" y="225" class="m" text-anchor="middle">대기</text><rect x="250" y="190" width="70" height="58" class="a"/><text x="285" y="225" class="m" text-anchor="middle">대기</text><rect x="330" y="190" width="70" height="58" class="a"/><text x="365" y="225" class="m" text-anchor="middle">대기</text><text x="230" y="293" class="s" text-anchor="middle">선택 작업 6개 점유</text><text x="230" y="327" class="m" text-anchor="middle">핵심 작업도 대기</text><text x="730" y="78" class="h" text-anchor="middle">격벽 적용</text><text x="535" y="127" class="m" text-anchor="start">핵심</text><text x="535" y="215" class="m" text-anchor="start">선택</text><rect x="670" y="110" width="70" height="58" class="r"/><text x="705" y="145" class="m" text-anchor="middle">가능</text><rect x="750" y="110" width="70" height="58" class="r"/><text x="785" y="145" class="m" text-anchor="middle">가능</text><rect x="830" y="110" width="70" height="58" class="r"/><text x="865" y="145" class="m" text-anchor="middle">가능</text><rect x="670" y="190" width="70" height="58" class="a"/><text x="705" y="225" class="m" text-anchor="middle">대기</text><rect x="750" y="190" width="70" height="58" class="a"/><text x="785" y="225" class="m" text-anchor="middle">대기</text><rect x="830" y="190" width="70" height="58" class="a"/><text x="865" y="225" class="m" text-anchor="middle">대기</text><text x="730" y="293" class="s" text-anchor="middle">핵심용 3개 예약</text><text x="730" y="327" class="m" text-anchor="middle">핵심 처리 가능</text><line x1="480" y1="55" x2="480" y2="350" class="d"/><text x="480" y="384" class="s" text-anchor="middle">예시의 worker 수는 같음 · 하위 DB/연결/쿼터도 분리 또는 보호 필요</text></svg>
