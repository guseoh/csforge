<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" role="img" aria-labelledby="sync-result-vs-durable-accept-title sync-result-vs-durable-accept-desc"><title id="sync-result-vs-durable-accept-title">동기 완료와 비동기 접수의 차이</title><desc id="sync-result-vs-durable-accept-desc">주문 생성 커밋 후201/주문ID와 작업 기록 커밋 후202/작업ID 비교. 접수 후 PENDING에서 COMPLETED 또는 FAILED.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="485"/><text x="480" y="33" class="h" text-anchor="middle">응답의 의미 · 주문 생성과 나중에 실행할 작업</text><text x="35" y="93" class="h" text-anchor="start">동기 확정</text><rect x="245" y="66" width="180" height="52" class="r"/><text x="335" y="98" class="m" text-anchor="middle">검증</text><line x1="425" y1="92" x2="465" y2="92" class="l" marker-end="url(#arr)"/><rect x="465" y="66" width="210" height="52" class="a"/><text x="570" y="98" class="m" text-anchor="middle">주문 COMMIT</text><line x1="675" y1="92" x2="715" y2="92" class="l" marker-end="url(#arr)"/><rect x="715" y="66" width="205" height="52" class="r"/><text x="817.5" y="98" class="m" text-anchor="middle">201 / 주문 ID</text><text x="35" y="205" class="h" text-anchor="start">비동기 접수</text><rect x="245" y="178" width="180" height="52" class="r"/><text x="335" y="210" class="m" text-anchor="middle">검증</text><line x1="425" y1="204" x2="465" y2="204" class="l" marker-end="url(#arr)"/><rect x="465" y="178" width="210" height="52" class="a"/><text x="570" y="210" class="m" text-anchor="middle">작업 기록 COMMIT</text><line x1="675" y1="204" x2="715" y2="204" class="l" marker-end="url(#arr)"/><rect x="715" y="178" width="205" height="52" class="r"/><text x="817.5" y="210" class="m" text-anchor="middle">202 / 작업 ID</text><path d="M570 230 V278 H300 V304" class="strong" marker-end="url(#arr)"/><rect x="200" y="304" width="200" height="48" class="r"/><text x="300" y="334" class="m" text-anchor="middle">PENDING</text><line x1="400" y1="328" x2="470" y2="328" class="l" marker-end="url(#arr)"/><rect x="470" y="304" width="200" height="48" class="a"/><text x="570" y="334" class="m" text-anchor="middle">COMPLETED</text><path d="M400 328 H435 V395 H470" class="d" marker-end="url(#arr)"/><rect x="470" y="371" width="200" height="48" class="r"/><text x="570" y="401" class="m" text-anchor="middle">FAILED</text><text x="480" y="461" class="s" text-anchor="middle">201은 주문 생성 완료 · 202는 접수 계약에 따른 추후 결과 확인</text></svg>
