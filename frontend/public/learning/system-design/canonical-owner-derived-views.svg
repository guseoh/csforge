<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="canonical-owner-derived-views-title canonical-owner-derived-views-desc"><title id="canonical-owner-derived-views-title">기준 데이터와 파생 읽기 상태</title><desc id="canonical-owner-derived-views-desc">Order module이 로컬 트랜잭션으로 orders v2를 소유. Search와 Cache에는 지연된 v1이 있을 수 있다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="380"/><text x="480" y="33" class="h" text-anchor="middle">주문 상태의 변경 권한은 canonical owner에 있음</text><rect x="35" y="95" width="205" height="54" class="r"/><text x="137.5" y="128" class="m" text-anchor="middle">변경 요청</text><line x1="240" y1="122" x2="305" y2="122" class="strong" marker-end="url(#arr)"/><rect x="305" y="65" width="365" height="170" class="a"/><text x="487" y="96" class="h" text-anchor="middle">Order module</text><rect x="335" y="118" width="305" height="45" class="r"/><text x="487.5" y="146.5" class="m" text-anchor="middle">불변식 검증</text><rect x="335" y="176" width="305" height="45" class="r"/><text x="487.5" y="204.5" class="m" text-anchor="middle">orders : v2</text><text x="487" y="263" class="s" text-anchor="middle">로컬 트랜잭션</text><path d="M670 198 H710 V109 H745" class="d" marker-end="url(#arr)"/><path d="M670 198 H745" class="d" marker-end="url(#arr)"/><rect x="745" y="83" width="180" height="52" class="r"/><text x="835" y="115" class="m" text-anchor="middle">Search v1</text><rect x="745" y="172" width="180" height="52" class="r"/><text x="835" y="204" class="m" text-anchor="middle">Cache v1</text><text x="835" y="261" class="s" text-anchor="middle">파생 상태</text><text x="480" y="320" class="s" text-anchor="middle">파생 뷰는 이전 버전일 수 있음 · 변경 요청은 소유자 계약으로</text><text x="480" y="355" class="s" text-anchor="middle">소유권은 논리적 경계이며 반드시 별도 DB를 요구하지 않음</text></svg>
