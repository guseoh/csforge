<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="request-capacity-worked-example-title request-capacity-worked-example-desc"><title id="request-capacity-worked-example-title">API 요청률에서 DB 부하와 저장량 추산</title><desc id="request-capacity-worked-example-desc">100만/day 평균11.574 QPS, peak10배115.741, 질의3회347.222/s. 2KB 모든 요청 쓰기 가정 2GB/day.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="445"/><text x="480" y="33" class="h" text-anchor="middle">하루 100만 요청 · peak 10배 · 요청당 DB 질의 3회</text><text x="35" y="100" class="m" text-anchor="start">평균 API</text><rect x="245" y="72" width="65" height="50" class="a"/><text x="325" y="104" class="m" text-anchor="start">11.57 QPS = 1,000,000 / 86,400</text><text x="35" y="186" class="m" text-anchor="start">최대 API</text><rect x="245" y="158" width="650" height="50" class="a"/><text x="570" y="190" class="m" text-anchor="middle">115.74 QPS (약 116)</text><text x="480" y="246" class="h" text-anchor="middle">peak API × 3 → 약 347.22 DB 질의/s</text><rect x="45" y="283" width="870" height="97" class="r"/><text x="480" y="315" class="s" text-anchor="middle">모든 요청이 2 KB를 저장한다고 가정</text><text x="480" y="351" class="m" text-anchor="middle">1,000,000 × 2 KB = 2 GB/day (십진 단위)</text><text x="480" y="418" class="s" text-anchor="middle">실제 쓰기 비율 · peak 지속 시간 · 보존 기간 · 인덱스/복제/백업 별도</text></svg>
