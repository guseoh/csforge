<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="module-vs-deployment-boundary-title module-vs-deployment-boundary-desc"><title id="module-vs-deployment-boundary-title">논리적 모듈과 물리적 서비스 경계</title><desc id="module-vs-deployment-boundary-desc">한 배포 내부 Learning Quiz 모듈과 소유 데이터, 분리 후 독립 배포 A B와 RPC 및 각 데이터 소유권.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="33" class="h" text-anchor="middle">논리적 경계가 같아도 배포·실패 경계는 달라진다</text><text x="230" y="77" class="h" text-anchor="middle">모듈형 모놀리스</text><text x="730" y="77" class="h" text-anchor="middle">서비스 분리</text><rect x="30" y="100" width="420" height="228" class="r"/><text x="240" y="127" class="s" text-anchor="middle">한 프로세스 / 배포 단위</text><rect x="65" y="145" width="155" height="50" class="r"/><text x="142.5" y="176" class="m" text-anchor="middle">Learning</text><rect x="260" y="145" width="155" height="50" class="r"/><text x="337.5" y="176" class="m" text-anchor="middle">Quiz</text><line x1="220" y1="170" x2="260" y2="170" class="strong" marker-end="url(#arr)"/><rect x="65" y="246" width="155" height="48" class="r"/><text x="142.5" y="276" class="m" text-anchor="middle">학습 데이터</text><rect x="260" y="246" width="155" height="48" class="r"/><text x="337.5" y="276" class="m" text-anchor="middle">퀴즈 데이터</text><line x1="142" y1="195" x2="142" y2="246" class="l" marker-end="url(#arr)"/><line x1="337" y1="195" x2="337" y2="246" class="l" marker-end="url(#arr)"/><rect x="530" y="100" width="180" height="228" class="r"/><rect x="740" y="100" width="180" height="228" class="r"/><text x="620" y="127" class="s" text-anchor="middle">배포 A</text><text x="830" y="127" class="s" text-anchor="middle">배포 B</text><rect x="545" y="145" width="150" height="50" class="r"/><text x="620" y="176" class="m" text-anchor="middle">Learning</text><rect x="755" y="145" width="150" height="50" class="r"/><text x="830" y="176" class="m" text-anchor="middle">Quiz</text><line x1="695" y1="170" x2="755" y2="170" class="strong" marker-end="url(#arr)"/><text x="725" y="214" class="s" text-anchor="middle">RPC</text><rect x="545" y="246" width="150" height="48" class="r"/><text x="620" y="276" class="m" text-anchor="middle">학습 데이터</text><rect x="755" y="246" width="150" height="48" class="r"/><text x="830" y="276" class="m" text-anchor="middle">퀴즈 데이터</text><line x1="620" y1="195" x2="620" y2="246" class="l" marker-end="url(#arr)"/><line x1="830" y1="195" x2="830" y2="246" class="l" marker-end="url(#arr)"/><line x1="480" y1="62" x2="480" y2="350" class="d"/><text x="480" y="377" class="s" text-anchor="middle">분리의 가치: 독립 배포·확장 가능성 / 비용: 네트워크·데이터 조정·운영</text></svg>
