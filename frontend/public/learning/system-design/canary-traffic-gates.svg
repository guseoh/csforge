<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="canary-traffic-gates-title canary-traffic-gates-desc"><title id="canary-traffic-gates-title">Canary · 트래픽 비율과 진행 조건</title><desc id="canary-traffic-gates-desc">예시 5% 새 버전부터 시작, 비교 검증 통과 후25% 확대, 악화 시 확대 중단 및 안전한 복귀 검토.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="33" class="h" text-anchor="middle">Canary · 트래픽 확대는 검증 결과에 따라 결정</text><text x="35" y="100" class="m" text-anchor="start">초기</text><rect x="230" y="72" width="670" height="48" class="r"/><rect x="866.5" y="72" width="33.5" height="48" class="a"/><text x="530" y="102" class="m" text-anchor="middle">control 95%</text><text x="900" y="60" class="s" text-anchor="end">5%</text><text x="35" y="196" class="m" text-anchor="start">검증 통과 예</text><rect x="230" y="166" width="670" height="48" class="r"/><rect x="732.5" y="166" width="167.5" height="48" class="a"/><text x="481" y="196" class="m" text-anchor="middle">control 75%</text><text x="816" y="196" class="s" text-anchor="middle">canary 25%</text><text x="35" y="292" class="m" text-anchor="start">악화 예</text><rect x="230" y="262" width="670" height="48" class="r"/><text x="565" y="292" class="m" text-anchor="middle">확대 중단 · 안전한 이전 경로 복귀 검토</text><text x="480" y="354" class="s" text-anchor="middle">비교 조건: 같은 요청 유형 · 충분한 표본 · 오류/지연/업무 정확성</text><text x="480" y="384" class="s" text-anchor="middle">코드 되돌리기 ≠ 데이터·메시지·외부 효과 되돌리기</text></svg>
