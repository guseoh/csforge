<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="overload-response-contracts-title overload-response-contracts-desc"><title id="overload-response-contracts-title">과부하 응답 계약 비교</title><desc id="overload-response-contracts-desc">미접수 거절은 작업을 받지 않음, 품질 축소 조회는 제한된 결과를 제공, 지연 접수는 내구성 기록과 최종 상태 조회 책임을 가진다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="33" class="h" text-anchor="middle">과부하 대응 · 응답이 약속하는 상태를 구분</text><text x="180" y="85" class="h" text-anchor="middle">미접수 거절</text><rect x="35" y="103" width="290" height="52" class="a"/><text x="180" y="136" class="m" text-anchor="middle">429 / 503 예</text><text x="180" y="194" class="s" text-anchor="middle">신규 작업 미접수</text><text x="180" y="234" class="s" text-anchor="middle">재시도 계약</text><text x="480" y="85" class="h" text-anchor="middle">품질 축소 조회</text><rect x="335" y="103" width="290" height="52" class="a"/><text x="480" y="136" class="m" text-anchor="middle">제한된 결과</text><text x="480" y="194" class="s" text-anchor="middle">이전 값 / 일부 생략 표시</text><text x="480" y="234" class="s" text-anchor="middle">완료된 조회</text><text x="780" y="85" class="h" text-anchor="middle">지연 접수</text><rect x="635" y="103" width="290" height="52" class="a"/><text x="780" y="136" class="m" text-anchor="middle">202 + 작업 ID 예</text><text x="780" y="194" class="s" text-anchor="middle">내구성 있는 접수 기록</text><text x="780" y="234" class="s" text-anchor="middle">최종 완료/실패 확인</text><text x="480" y="302" class="h" text-anchor="middle">작업을 버렸다면 처리 중이라고 약속하지 않음</text><text x="480" y="346" class="s" text-anchor="middle">상태 코드 자체는 실제 저장·업무 완료를 보장하지 않음</text></svg>
