<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="core-optional-degradation-title core-optional-degradation-desc"><title id="core-optional-degradation-title">핵심 흐름과 선택 기능의 장애 시 정책</title><desc id="core-optional-degradation-desc">정상 및 추천 의존성 장애에서 학습 저장과 문제풀이 유지 목표, 추천 생략 또는 대체 표시.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="480" y="33" class="h" text-anchor="middle">선택 기능 장애 · 핵심 상태의 정확성을 유지</text><text x="35" y="93" class="m" text-anchor="start">기능</text><text x="370" y="93" class="h" text-anchor="middle">정상</text><text x="745" y="93" class="h" text-anchor="middle">추천 의존성 장애</text><line x1="35" y1="110" x2="925" y2="110" class="l"/><text x="35" y="164" class="m" text-anchor="start">학습 결과 저장</text><rect x="235" y="135" width="270" height="48" class="r"/><text x="370" y="165" class="m" text-anchor="middle">정확한 성공/실패</text><rect x="575" y="135" width="340" height="48" class="r"/><text x="745" y="165" class="m" text-anchor="middle">정확한 성공/실패</text><text x="35" y="234" class="m" text-anchor="start">문제 풀이</text><rect x="235" y="205" width="270" height="48" class="r"/><text x="370" y="235" class="m" text-anchor="middle">정상 제공</text><rect x="575" y="205" width="340" height="48" class="r"/><text x="745" y="235" class="m" text-anchor="middle">정상 제공</text><text x="35" y="304" class="m" text-anchor="start">추천</text><rect x="235" y="275" width="270" height="48" class="r"/><text x="370" y="305" class="m" text-anchor="middle">실시간 추천</text><rect x="575" y="275" width="340" height="48" class="a"/><text x="745" y="305" class="m" text-anchor="middle">생략 / 대체 표시</text><text x="480" y="377" class="s" text-anchor="middle">선택 기능의 실패는 숨기지 않고 응답 의미·SLO 측정에 반영</text><text x="480" y="407" class="s" text-anchor="middle">핵심 저장 실패를 성공으로 위장하지 않음 · 권한 검증 우회 금지</text></svg>
