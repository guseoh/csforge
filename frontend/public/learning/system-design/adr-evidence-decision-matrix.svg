<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="adr-evidence-decision-matrix-title adr-evidence-decision-matrix-desc"><title id="adr-evidence-decision-matrix-title">ADR · 요구사항과 대안 판정</title><desc id="adr-evidence-decision-matrix-desc">가상 검색 요구 p99&lt;300ms, stale&lt;=5s. A 측정180ms, B 미측정 및 가정 최대30초 갱신 지연. 현재 A 유지, 조건 변경 시 재검토.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="448"/><text x="480" y="33" class="h" text-anchor="middle">ADR 예 · 측정 근거로 대안을 좁히기</text><text x="35" y="92" class="m" text-anchor="start">판정 조건</text><text x="350" y="92" class="h" text-anchor="middle">A: PostgreSQL 유지</text><text x="750" y="92" class="h" text-anchor="middle">B: 별도 Projection</text><line x1="35" y1="110" x2="925" y2="110" class="l"/><text x="35" y="145" class="m" text-anchor="start">p99 &lt; 300ms</text><text x="350" y="145" class="m" text-anchor="middle">180ms (측정)</text><text x="750" y="145" class="s" text-anchor="middle">미측정</text><line x1="35" y1="166" x2="925" y2="166" class="l"/><text x="35" y="211" class="m" text-anchor="start">오래됨 ≤ 5초</text><text x="350" y="211" class="m" text-anchor="middle">원본 읽기</text><text x="750" y="211" class="s" text-anchor="middle">최대 30초 (가정)</text><line x1="35" y1="232" x2="925" y2="232" class="l"/><text x="35" y="277" class="m" text-anchor="start">운영 비용</text><text x="350" y="277" class="m" text-anchor="middle">기존 구조</text><text x="750" y="277" class="s" text-anchor="middle">추가 동기화·복구</text><line x1="35" y1="298" x2="925" y2="298" class="l"/><rect x="65" y="330" width="390" height="56" class="a"/><text x="260" y="364" class="m" text-anchor="middle">현재 A 유지</text><line x1="455" y1="358" x2="505" y2="358" class="l" marker-end="url(#arr)"/><rect x="505" y="330" width="390" height="56" class="r"/><text x="700" y="364" class="m" text-anchor="middle">전제 변경 시 재측정</text><text x="480" y="425" class="s" text-anchor="middle">재검토 트리거 ≠ 자동 기술 도입 · 기존 ADR의 이력 보존</text></svg>
