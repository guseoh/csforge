<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" role="img" aria-labelledby="cap-partition-choices-title cap-partition-choices-desc"><title id="cap-partition-choices-title">CAP · 분할 중 일관성과 가용성 선택</title><desc id="cap-partition-choices-desc">분할 중 권한이 있는 구간만 쓰기 진행하고 나머지는 중단하는 C 선택 예, 양쪽에서 작업을 완료하고 충돌을 허용하는 A 선택 예.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="397"/><text x="480" y="33" class="h" text-anchor="middle">네트워크 분할 · 서로 통신할 수 없는 두 구간</text><text x="230" y="85" class="h" text-anchor="middle">C 유지 예</text><rect x="35" y="125" width="175" height="60" class="a"/><text x="122.5" y="161" class="m" text-anchor="middle">구간 A</text><rect x="250" y="125" width="175" height="60" class="r"/><text x="337.5" y="161" class="m" text-anchor="middle">구간 B</text><text x="230" y="162" class="h" text-anchor="middle">×</text><text x="122" y="221" class="s" text-anchor="middle">쓰기 진행</text><text x="337" y="221" class="s" text-anchor="middle">쓰기 거절/대기</text><text x="230" y="282" class="m" text-anchor="middle">권한 확인 불가 → 중단</text><text x="230" y="317" class="s" text-anchor="middle">강한 순서 유지 조건</text><text x="730" y="85" class="h" text-anchor="middle">A 유지 예</text><rect x="535" y="125" width="175" height="60" class="a"/><text x="622.5" y="161" class="m" text-anchor="middle">구간 A</text><rect x="750" y="125" width="175" height="60" class="a"/><text x="837.5" y="161" class="m" text-anchor="middle">구간 B</text><text x="730" y="162" class="h" text-anchor="middle">×</text><text x="622" y="221" class="s" text-anchor="middle">쓰기 진행</text><text x="837" y="221" class="s" text-anchor="middle">쓰기 진행</text><text x="730" y="282" class="m" text-anchor="middle">양쪽 요청 완료</text><text x="730" y="317" class="s" text-anchor="middle">충돌·이전 값 가능</text><line x1="480" y1="60" x2="480" y2="340" class="d"/><text x="480" y="373" class="s" text-anchor="middle">정상 노드의 유효한 읽기/쓰기 완료가 formal A · 오류만 반환하면 불충족</text></svg>
