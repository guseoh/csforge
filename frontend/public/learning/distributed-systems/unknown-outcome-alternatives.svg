<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="unknown-outcome-alternatives-title unknown-outcome-alternatives-desc"><title id="unknown-outcome-alternatives-title">부분 장애 · 동일 증상과 다른 결과</title><desc id="unknown-outcome-alternatives-desc">timeout은 요청 유실, 진행 중, 커밋 후 응답 유실 등에서 발생할 수 있다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="455"/><text x="480" y="34" class="h" text-anchor="middle">같은 클라이언트 timeout · 서버의 세 가지 가능한 상태</text><text x="40" y="116" class="m" text-anchor="start">요청 유실</text><rect x="240" y="85" width="275" height="52" class="r"/><text x="377.5" y="117" class="m" text-anchor="middle">서버 미수신</text><line x1="515" y1="111" x2="565" y2="111" class="d" marker-end="url(#arr)"/><rect x="565" y="85" width="340" height="52" class="r"/><text x="735" y="117" class="m" text-anchor="middle">변경 없음</text><text x="40" y="211" class="m" text-anchor="start">처리 지연</text><rect x="240" y="180" width="275" height="52" class="r"/><text x="377.5" y="212" class="m" text-anchor="middle">서버 처리 중</text><line x1="515" y1="206" x2="565" y2="206" class="d" marker-end="url(#arr)"/><rect x="565" y="180" width="340" height="52" class="r"/><text x="735" y="212" class="m" text-anchor="middle">결과 미확정</text><text x="40" y="306" class="m" text-anchor="start">응답 유실</text><rect x="240" y="275" width="275" height="52" class="a"/><text x="377.5" y="307" class="m" text-anchor="middle">DB commit 완료</text><line x1="515" y1="301" x2="565" y2="301" class="d" marker-end="url(#arr)"/><rect x="565" y="275" width="340" height="52" class="a"/><text x="735" y="307" class="m" text-anchor="middle">변경 있음</text><text x="480" y="403" class="h" text-anchor="middle">관측된 timeout만으로 어느 상태인지 결정할 수 없음</text><text x="480" y="433" class="s" text-anchor="middle">operation ID · 멱등 처리 · 상태 조회로 결과 확인</text></svg>
