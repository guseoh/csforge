<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="heartbeat-suspicion-timeline-title heartbeat-suspicion-timeline-desc"><title id="heartbeat-suspicion-timeline-title">장애 감지 · 종료와 지연의 구별 한계</title><desc id="heartbeat-suspicion-timeline-desc">마지막 수신 후 3초에 장애 의심, 실제 종료와 4초 지연 도착은 3초에는 구별되지 않는다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="410"/><text x="480" y="34" class="h" text-anchor="middle">마지막 heartbeat 이후 3초에 의심하는 예</text><text x="35" y="106" class="m" text-anchor="start">실제 종료</text><line x1="280" y1="100" x2="890" y2="100" class="l"/><circle cx="280" cy="100" r="8" class="a"/><text x="280" y="82" class="s" text-anchor="middle">수신</text><line x1="646" y1="65" x2="646" y2="140" class="d"/><text x="646" y="165" class="s" text-anchor="middle">3초: 의심</text><text x="768" y="82" class="s" text-anchor="middle">응답 없음</text><text x="35" y="226" class="m" text-anchor="start">지연된 heartbeat</text><line x1="280" y1="220" x2="890" y2="220" class="l"/><circle cx="280" cy="220" r="8" class="a"/><text x="280" y="202" class="s" text-anchor="middle">수신</text><line x1="646" y1="185" x2="646" y2="260" class="d"/><text x="646" y="285" class="s" text-anchor="middle">3초: 의심</text><circle cx="768" cy="220" r="8" class="a"/><text x="768" y="202" class="s" text-anchor="middle">4초: 도착</text><text x="480" y="385" class="s" text-anchor="middle">두 경우 모두 3초 시점의 관측은 동일 · 의심은 권한 증명이 아님</text></svg>
