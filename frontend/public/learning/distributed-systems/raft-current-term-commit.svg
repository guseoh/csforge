<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="raft-current-term-commit-title raft-current-term-commit-desc"><title id="raft-current-term-commit-title">Raft · 현재 term 커밋과 이전 로그</title><desc id="raft-current-term-commit-desc">현재 term8 리더 B와 A가 index11 term8 보유, C 미복제. 다수 복제로 index11 커밋, 앞선 term7 index10 간접 커밋.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="452"/><text x="480" y="34" class="h" text-anchor="middle">Raft · term 8 리더 B · 고정 3노드</text><text x="270" y="82" class="m" text-anchor="middle">index 10</text><text x="520" y="82" class="m" text-anchor="middle">index 11</text><text x="790" y="82" class="m" text-anchor="middle">상태</text><text x="30" y="130" class="m" text-anchor="start">A</text><rect x="165" y="100" width="210" height="48" class="r"/><text x="270" y="130" class="m" text-anchor="middle">term 7</text><rect x="415" y="100" width="210" height="48" class="a"/><text x="520" y="130" class="m" text-anchor="middle">term 8</text><text x="790" y="130" class="s" text-anchor="middle">복제 확인</text><text x="30" y="206" class="m" text-anchor="start">B (리더)</text><rect x="165" y="176" width="210" height="48" class="r"/><text x="270" y="206" class="m" text-anchor="middle">term 7</text><rect x="415" y="176" width="210" height="48" class="a"/><text x="520" y="206" class="m" text-anchor="middle">term 8</text><text x="790" y="206" class="s" text-anchor="middle">복제 확인</text><text x="30" y="282" class="m" text-anchor="start">C</text><rect x="165" y="252" width="210" height="48" class="r"/><text x="270" y="282" class="m" text-anchor="middle">term 7</text><rect x="415" y="252" width="210" height="48" class="r"/><text x="520" y="282" class="m" text-anchor="middle">없음</text><text x="790" y="282" class="s" text-anchor="middle">미복제</text><text x="480" y="365" class="h" text-anchor="middle">현재 term 8의 index 11이 다수(2/3)에 복제</text><text x="480" y="397" class="m" text-anchor="middle">index 11 커밋으로 앞선 index 10도 간접 커밋</text><text x="480" y="429" class="s" text-anchor="middle">이전 term 엔트리의 복제 수만으로 직접 커밋하지 않음</text></svg>
