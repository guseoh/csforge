<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="quorum-set-intersection-title quorum-set-intersection-desc"><title id="quorum-set-intersection-title">정족수의 교집합</title><desc id="quorum-set-intersection-desc">읽기 A B 쓰기 B C, 공통 B. 고정 N=3 R=W=2 조건.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="395"/><text x="480" y="34" class="h" text-anchor="middle">고정 복제본 N=3 · R=2 · W=2</text><ellipse cx="365" cy="180" rx="245" ry="100" class="r"/><ellipse cx="595" cy="180" rx="245" ry="100" class="d"/><text x="250" y="65" class="h" text-anchor="middle">읽기 R</text><text x="710" y="65" class="h" text-anchor="middle">쓰기 W</text><rect x="215" y="155" width="95" height="50" class="r"/><text x="262.5" y="186" class="m" text-anchor="middle">A</text><rect x="432" y="155" width="95" height="50" class="a"/><text x="479.5" y="186" class="m" text-anchor="middle">B</text><rect x="650" y="155" width="95" height="50" class="r"/><text x="697.5" y="186" class="m" text-anchor="middle">C</text><text x="480" y="308" class="m" text-anchor="middle">R + W = 4 > 3 → 최소 1개 교집합</text><text x="480" y="343" class="s" text-anchor="middle">겹친다는 사실 ≠ 최신값 선택 또는 선형화 가능성</text><text x="480" y="371" class="s" text-anchor="middle">sloppy quorum 등 복제본 집합이 달라지는 경우 이 단순 모델과 구분</text></svg>
