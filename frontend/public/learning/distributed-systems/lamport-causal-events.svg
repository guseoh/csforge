<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" role="img" aria-labelledby="lamport-causal-events-title lamport-causal-events-desc"><title id="lamport-causal-events-title">논리 시계 · 메시지와 인과 순서</title><desc id="lamport-causal-events-desc">A1=1 A2=2 send, B local counter4, B1 receive5 B2=6; C1=3 독립.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="438"/><text x="480" y="33" class="h" text-anchor="middle">Lamport 시계 · 인과 순서와 독립 사건</text><text x="230" y="68" class="m" text-anchor="middle">A 주문</text><line x1="230" y1="85" x2="230" y2="345" class="d"/><text x="480" y="68" class="m" text-anchor="middle">B 재고</text><line x1="480" y1="85" x2="480" y2="345" class="d"/><text x="750" y="68" class="m" text-anchor="middle">C 통계</text><line x1="750" y1="85" x2="750" y2="345" class="d"/><circle cx="230" cy="105" r="7" class="a"/><text x="246" y="111" class="s" text-anchor="start">A1: 1</text><circle cx="230" cy="175" r="7" class="a"/><text x="246" y="181" class="s" text-anchor="start">A2: 2</text><circle cx="480" cy="120" r="7" class="a"/><text x="496" y="126" class="s" text-anchor="start">로컬 4</text><circle cx="480" cy="240" r="7" class="a"/><text x="496" y="246" class="s" text-anchor="start">B1: 5</text><circle cx="480" cy="315" r="7" class="a"/><text x="496" y="321" class="s" text-anchor="start">B2: 6</text><circle cx="750" cy="200" r="7" class="a"/><text x="766" y="206" class="s" text-anchor="start">C1: 3</text><line x1="230" y1="112" x2="230" y2="168" class="strong" marker-end="url(#arr)"/><line x1="237" y1="178" x2="473" y2="237" class="strong" marker-end="url(#arr)"/><text x="357" y="193" class="s" text-anchor="middle">M: 2</text><line x1="480" y1="127" x2="480" y2="233" class="l" marker-end="url(#arr)"/><line x1="480" y1="247" x2="480" y2="308" class="strong" marker-end="url(#arr)"/><text x="480" y="379" class="m" text-anchor="middle">B1 = max(4, 2) + 1 = 5</text><text x="480" y="414" class="s" text-anchor="middle">A2 → B1 · C1은 독립: 2 &lt; 3만으로 인과관계 증명 불가</text></svg>
