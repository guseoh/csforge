<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="raft-election-majority-title raft-election-majority-desc"><title id="raft-election-majority-title">Raft term 변경과 선출 정족수</title><desc id="raft-election-majority-desc">3노드 중 이전 리더 A가 격리되고 B가 term8 후보로 자기 표와 C의 표를 얻어 과반으로 선출된다. A는 혼자 새 커밋을 만들 수 없다.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="390"/><text x="480" y="33" class="h" text-anchor="middle">고정 3노드 · term 7에서 term 8로 전환</text><text x="160" y="78" class="h" text-anchor="middle">격리 구간</text><text x="655" y="78" class="h" text-anchor="middle">통신 가능한 구간</text><rect x="60" y="110" width="200" height="55" class="r"/><text x="160" y="143.5" class="m" text-anchor="middle">A · term 7</text><rect x="405" y="110" width="200" height="55" class="a"/><text x="505" y="143.5" class="m" text-anchor="middle">B · term 8</text><rect x="705" y="110" width="200" height="55" class="r"/><text x="805" y="143.5" class="m" text-anchor="middle">C · term 8</text><line x1="330" y1="65" x2="330" y2="300" class="d"/><line x1="705" y1="137" x2="605" y2="137" class="strong" marker-end="url(#arr)"/><text x="655" y="119" class="s" text-anchor="middle">투표</text><text x="160" y="205" class="s" text-anchor="middle">이전 리더일 수 있음</text><text x="505" y="205" class="s" text-anchor="middle">자기 표 + C의 표</text><text x="505" y="241" class="h" text-anchor="middle">2/3 → term 8 선출</text><text x="160" y="265" class="s" text-anchor="middle">혼자 새 합의 커밋 불가</text><text x="480" y="333" class="s" text-anchor="middle">투표는 로그 최신성 조건 충족을 가정 · 외부 쓰기 권한은 별도 펜싱</text><text x="480" y="363" class="s" text-anchor="middle">리더 선출 성공이 개별 작업의 커밋 성공을 뜻하지 않음</text></svg>
