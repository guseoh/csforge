<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 433" role="img" aria-labelledby="saga-compensating-transactions-title saga-compensating-transactions-desc"><title id="saga-compensating-transactions-title">Saga · 실패 이후 보상 트랜잭션</title><desc id="saga-compensating-transactions-desc">주문 생성 재고 예약 결제 승인 이후 배송 실패, 결제 보상 재고 해제 주문 실패 상태. 보상 실패 가능.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="433"/><text x="480" y="33" class="h" text-anchor="middle">각 단계는 별도 로컬 커밋 · 실패 후 보상도 새 트랜잭션</text><rect x="35" y="90" width="205" height="55" class="r"/><text x="137.5" y="123.5" class="m" text-anchor="middle">주문 생성</text><line x1="240" y1="117" x2="265" y2="117" class="l" marker-end="url(#arr)"/><rect x="265" y="90" width="205" height="55" class="r"/><text x="367.5" y="123.5" class="m" text-anchor="middle">재고 예약</text><line x1="470" y1="117" x2="495" y2="117" class="l" marker-end="url(#arr)"/><rect x="495" y="90" width="205" height="55" class="r"/><text x="597.5" y="123.5" class="m" text-anchor="middle">결제 승인</text><line x1="700" y1="117" x2="725" y2="117" class="l" marker-end="url(#arr)"/><rect x="725" y="90" width="205" height="55" class="a"/><text x="827.5" y="123.5" class="m" text-anchor="middle">배송 실패</text><path d="M827 145 V220 H600" class="strong" marker-end="url(#arr)"/><rect x="395" y="194" width="205" height="52" class="a"/><text x="497.5" y="226" class="m" text-anchor="middle">결제 취소/환불</text><line x1="395" y1="220" x2="365" y2="220" class="strong" marker-end="url(#arr)"/><rect x="160" y="194" width="205" height="52" class="a"/><text x="262.5" y="226" class="m" text-anchor="middle">재고 예약 해제</text><path d="M262 246 V310 H520" class="strong" marker-end="url(#arr)"/><rect x="520" y="284" width="330" height="52" class="a"/><text x="685" y="316" class="m" text-anchor="middle">주문 실패 상태 확정</text><text x="480" y="378" class="s" text-anchor="middle">보상 실패 → COMPENSATING 유지 · 재시도/대사/수동 복구</text><text x="480" y="409" class="s" text-anchor="middle">이미 발생한 외부 효과는 물리적 rollback으로 사라지지 않음</text></svg>
