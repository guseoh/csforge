<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="remaining-deadline-budget-title remaining-deadline-budget-desc"><title id="remaining-deadline-budget-title">요청 기한 · 남은 시간 예산</title><desc id="remaining-deadline-budget-desc">2초 전체 예산에서 A가 800ms 소비 후 B에 최대1200ms 남음.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="320"/><text x="480" y="34" class="h" text-anchor="middle">전체 deadline 2,000 ms · 남은 예산만 전달</text><rect x="70" y="100" width="320" height="60" class="a"/><text x="230" y="136" class="m" text-anchor="middle">A: 800 ms 사용</text><rect x="390" y="100" width="480" height="60" class="r"/><text x="630" y="136" class="m" text-anchor="middle">B: 최대 1,200 ms</text><line x1="70" y1="80" x2="70" y2="186" class="d"/><text x="70" y="210" class="s" text-anchor="middle">0</text><line x1="390" y1="80" x2="390" y2="186" class="d"/><text x="390" y="210" class="s" text-anchor="middle">800</text><line x1="870" y1="80" x2="870" y2="186" class="d"/><text x="870" y="210" class="s" text-anchor="middle">2,000 ms</text><text x="480" y="262" class="h" text-anchor="middle">B에 다시 2초를 부여하면 상위 기한을 넘길 수 있음</text><text x="480" y="297" class="s" text-anchor="middle">전달 지연과 응답 여유까지 고려 · 취소는 실제 작업 종료와 별개</text></svg>
