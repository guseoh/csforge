<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="async-replica-staleness-title async-replica-staleness-desc"><title id="async-replica-staleness-title">비동기 복제와 최신성</title><desc id="async-replica-staleness-desc">주 노드 v2 커밋 성공 직후 복제본 v1, 이후 복제 적용 v2.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="350"/><text x="480" y="33" class="h" text-anchor="middle">비동기 복제 · 쓰기 성공 직후의 두 상태</text><text x="230" y="83" class="h" text-anchor="middle">주 노드 커밋 직후</text><rect x="30" y="120" width="190" height="55" class="a"/><text x="125" y="153.5" class="m" text-anchor="middle">Primary v2</text><rect x="240" y="120" width="190" height="55" class="r"/><text x="335" y="153.5" class="m" text-anchor="middle">Replica v1</text><line x1="220" y1="147" x2="240" y2="147" class="d" marker-end="url(#arr)"/><text x="335" y="210" class="s" text-anchor="middle">읽기 → v1 가능</text><text x="125" y="250" class="s" text-anchor="middle">성공 응답 완료</text><text x="730" y="83" class="h" text-anchor="middle">복제 적용 이후</text><rect x="530" y="120" width="190" height="55" class="a"/><text x="625" y="153.5" class="m" text-anchor="middle">Primary v2</text><rect x="740" y="120" width="190" height="55" class="a"/><text x="835" y="153.5" class="m" text-anchor="middle">Replica v2</text><line x1="720" y1="147" x2="740" y2="147" class="d" marker-end="url(#arr)"/><text x="835" y="210" class="s" text-anchor="middle">읽기 → v2</text><text x="625" y="250" class="s" text-anchor="middle">성공 응답 완료</text><line x1="480" y1="65" x2="480" y2="285" class="d"/><text x="480" y="325" class="s" text-anchor="middle">복제 확인·읽기 라우팅·장애 전환 조건이 실제 보장을 결정</text></svg>
