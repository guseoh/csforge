<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" role="img" aria-labelledby="fencing-stale-write-title fencing-stale-write-desc"><title id="fencing-stale-write-title">Lease 만료와 펜싱 토큰</title><desc id="fencing-stale-write-desc">A token41 pause 후 B token42로 저장소에 쓰기, 저장소 max42 기억, A 늦은 write41 거부.</desc><style>:root{--bg:#fff;--fg:#222;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#eee;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 24px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.7}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="475"/><text x="480" y="34" class="h" text-anchor="middle">Lease 만료 후 이전 소유자의 지연된 쓰기</text><text x="125" y="76" class="m" text-anchor="middle">Worker A</text><line x1="125" y1="92" x2="125" y2="390" class="d"/><text x="390" y="76" class="m" text-anchor="middle">Worker B</text><line x1="390" y1="92" x2="390" y2="390" class="d"/><text x="720" y="76" class="m" text-anchor="middle">보호 저장소</text><line x1="720" y1="92" x2="720" y2="390" class="d"/><text x="125" y="120" class="m" text-anchor="middle">token 41</text><rect x="62" y="135" width="126" height="145" class="r"/><text x="125" y="197" class="s" text-anchor="middle">일시 정지</text><text x="390" y="185" class="s" text-anchor="middle">token 42 획득</text><line x1="390" y1="218" x2="720" y2="218" class="strong" marker-end="url(#arr)"/><text x="555" y="206" class="m" text-anchor="middle">write(42)</text><text x="720" y="251" class="m" text-anchor="middle">max = 42</text><text x="125" y="303" class="s" text-anchor="middle">재개</text><line x1="125" y1="330" x2="720" y2="330" class="strong" marker-end="url(#arr)"/><text x="423" y="318" class="m" text-anchor="middle">늦은 write(41)</text><text x="720" y="366" class="m" text-anchor="middle">41 &lt; 42 → 거부</text><text x="480" y="424" class="s" text-anchor="middle">토큰 비교와 변경은 저장소에서 원자적으로 수행</text><text x="480" y="451" class="s" text-anchor="middle">42 관측 전에는 41이 받아들여질 수 있음 · 모든 만료 쓰기 차단과는 다름</text></svg>
