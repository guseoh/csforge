<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="response-loss-sequence-title response-loss-sequence-desc"><title id="response-loss-sequence-title">응답 유실 · 결과를 모르는 재시도</title><desc id="response-loss-sequence-desc">첫 POST가 서버에서 DB insert와 commit을 완료했지만 응답이 유실된다. 클라이언트는 timeout 후 재전송하며 중복 방지가 없으면 두 번째 INSERT가 실행될 수 있다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="430"/><text x="135" y="35" class="h" text-anchor="middle">Client</text><text x="480" y="35" class="h" text-anchor="middle">Server</text><text x="825" y="35" class="h" text-anchor="middle">DB</text><line x1="135" y1="50" x2="135" y2="376" class="d"/><line x1="480" y1="50" x2="480" y2="376" class="d"/><line x1="825" y1="50" x2="825" y2="376" class="d"/><line x1="135" y1="89" x2="480" y2="89" class="l" marker-end="url(#arrow)"/><text x="307" y="78" class="s" text-anchor="middle">POST /orders</text><line x1="480" y1="143" x2="825" y2="143" class="l" marker-end="url(#arrow)"/><text x="652" y="132" class="s" text-anchor="middle">INSERT + COMMIT</text><line x1="825" y1="192" x2="480" y2="192" class="d" marker-end="url(#arrow)"/><text x="652" y="181" class="s" text-anchor="middle">확정 성공</text><line x1="480" y1="238" x2="300" y2="238" class="d"/><line x1="290" y1="226" x2="310" y2="246" class="strong"/><line x1="290" y1="246" x2="310" y2="226" class="strong"/><text x="315" y="217" class="s" text-anchor="middle">응답 유실</text><text x="135" y="275" class="m" text-anchor="middle">timeout</text><line x1="135" y1="310" x2="480" y2="310" class="strong" marker-end="url(#arrow)"/><text x="307" y="299" class="s" text-anchor="middle">같은 논리 작업 재전송</text><line x1="480" y1="362" x2="825" y2="362" class="strong" marker-end="url(#arrow)"/><text x="652" y="351" class="s" text-anchor="middle">중복 INSERT 가능</text><text x="480" y="412" class="s" text-anchor="middle">timeout은 실패 확정이 아니라 처리 결과가 알려지지 않은 상태일 수 있음</text></svg>
