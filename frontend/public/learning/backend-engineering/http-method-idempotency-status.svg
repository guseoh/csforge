<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 메서드 안전성·멱등성과 실패 상태 코드 계약</title>
  <desc id="desc">GET, PUT, DELETE, POST의 Safe와 Idempotent 의미 계약 및 4xx/5xx 실패 상태 코드와 오류 코드 매핑을 보여주는 도식</desc>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#f1f5f9; --bd:#cbd5e1; --tx:#0f172a; --sub:#475569; --blue-bg:#eff6ff; --blue-bd:#3b82f6; --blue-tx:#1d4ed8; --green-bg:#ecfdf5; --green-bd:#10b981; --green-tx:#047857; --amber-bg:#fffbeb; --amber-bd:#f59e0b; --amber-tx:#b45309; --red-bg:#fef2f2; --red-bd:#ef4444; --red-tx:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --muted:#0b1220; --bd:#334155; --tx:#f1f5f9; --sub:#94a3b8; --blue-bg:#172554; --blue-bd:#60a5fa; --blue-tx:#93c5fd; --green-bg:#064e3b; --green-bd:#34d399; --green-tx:#6ee7b7; --amber-bg:#451a03; --amber-bd:#fbbf24; --amber-tx:#fcd34d; --red-bg:#450a0a; --red-bd:#f87171; --red-tx:#fca5a5; } }
    text { font-family: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--tx); }
    .h2 { font-size:14px; font-weight:700; }
    .b { font-size:12.5px; fill:var(--tx); }
    .s { font-size:11.5px; fill:var(--sub); }
    .k { font-size:12px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="840" height="430" rx="14" fill="var(--bg)"/>
  <text x="28" y="34" class="h1">HTTP 메서드 의미 계약 (Safe · Idempotent) &amp; 실패 상태 코드 매핑</text>
  <text x="28" y="54" class="s">클라이언트·프록시·SDK가 재시도·캐싱·오류 복구를 판단하는 공통 규약이다.</text>

  <!-- Left: Method Semantics -->
  <rect x="28" y="72" width="384" height="334" rx="10" fill="var(--card)" stroke="var(--bd)" stroke-width="1.4"/>
  <text x="46" y="98" class="h2" fill="var(--tx)">1. 메서드별 Safe / Idempotent 계약</text>

  <rect x="46" y="114" width="348" height="60" rx="8" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.3"/>
  <text x="60" y="136" class="k" fill="var(--green-tx)">GET  [Safe ✓]  [Idempotent ✓]</text>
  <text x="60" y="158" class="b">읽기 전용 조회 — 상태 변경 금지 (프리페치·캐시 안전)</text>

  <rect x="46" y="186" width="348" height="60" rx="8" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.3"/>
  <text x="60" y="208" class="k" fill="var(--blue-tx)">PUT / DELETE  [Safe ✗]  [Idempotent ✓]</text>
  <text x="60" y="230" class="b">같은 요청 반복 적용 시 효과 누적 없음 (204 → 404 허용)</text>

  <rect x="46" y="258" width="348" height="60" rx="8" fill="var(--amber-bg)" stroke="var(--amber-bd)" stroke-width="1.3"/>
  <text x="60" y="280" class="k" fill="var(--amber-tx)">POST  [Safe ✗]  [Idempotent ✗ (기본)]</text>
  <text x="60" y="302" class="b">생성·처리 요청 — 중복 방지가 필요하면 Idempotency-Key</text>

  <rect x="46" y="330" width="348" height="60" rx="8" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="60" y="352" class="k" fill="var(--tx)">성공 상태 의미 구분</text>
  <text x="60" y="373" class="s">200 OK(완료) · 201 Created · 202 Accepted(비동기 접수)</text>

  <!-- Right: Error Mapping -->
  <rect x="432" y="72" width="380" height="334" rx="10" fill="var(--card)" stroke="var(--bd)" stroke-width="1.4"/>
  <text x="450" y="98" class="h2" fill="var(--tx)">2. 실패 상태 코드 → 클라이언트 다음 행동</text>

  <rect x="450" y="114" width="344" height="44" rx="7" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="464" y="140" class="k" fill="var(--amber-tx)">400 Bad Request</text>
  <text x="596" y="140" class="b">입력 형식·검증 수정 필요</text>

  <rect x="450" y="166" width="344" height="44" rx="7" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="464" y="192" class="k" fill="var(--red-tx)">401 / 403</text>
  <text x="596" y="192" class="b">인증 갱신(401) / 권한 없음(403)</text>

  <rect x="450" y="218" width="344" height="44" rx="7" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="464" y="244" class="k" fill="var(--blue-tx)">404 Not Found</text>
  <text x="596" y="244" class="b">대상 리소스 없음</text>

  <rect x="450" y="270" width="344" height="44" rx="7" fill="var(--muted)" stroke="var(--bd)" stroke-width="1"/>
  <text x="464" y="296" class="k" fill="var(--amber-tx)">409 Conflict</text>
  <text x="596" y="296" class="b">현재 상태·버전과 충돌 (재조회)</text>

  <rect x="450" y="324" width="344" height="66" rx="8" fill="var(--red-bg)" stroke="var(--red-bd)" stroke-width="1.3"/>
  <text x="464" y="346" class="k" fill="var(--red-tx)">세부 원인은 안정적 오류 코드로 보완</text>
  <text x="464" y="368" class="s">HTTP 상태(범주) + JSON code("ORDER_VERSION_CONFLICT")</text>
  <text x="464" y="383" class="s">※ 업무 실패를 200 OK로 감싸면 관측성·계약이 깨짐</text>
</svg>
