<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="order-lifecycle-transitions-title order-lifecycle-transitions-desc"><title id="order-lifecycle-transitions-title">주문 생명주기 · 허용된 전이</title><desc id="order-lifecycle-transitions-desc">유효한 주문은 CREATED에서 pay로 PAID, ship으로 SHIPPING, complete로 COMPLETED. CREATED 또는 PAID에서는 cancel로 CANCELLED 전이 가능하다고 가정한 단순 모델.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="400"/><text x="480" y="32" class="h" text-anchor="middle">유효하게 생성된 주문만 상태 전이에 진입</text><rect x="50" y="80" width="185" height="52" rx="3" class="r"/><text x="142.5" y="113" class="m" text-anchor="middle">Order.place()</text><line x1="235" y1="106" x2="300" y2="106" class="l" marker-end="url(#arrow)"/><rect x="300" y="80" width="180" height="52" rx="3" class="a"/><text x="390" y="113" class="m" text-anchor="middle">CREATED</text><text x="142" y="152" class="s" text-anchor="middle">빈 items 거부</text><rect x="550" y="80" width="180" height="52" rx="3" class="r"/><text x="640" y="113" class="m" text-anchor="middle">PAID</text><line x1="480" y1="106" x2="550" y2="106" class="strong" marker-end="url(#arrow)"/><text x="515" y="93" class="s" text-anchor="middle">pay()</text><rect x="730" y="220" width="190" height="52" rx="3" class="r"/><text x="825" y="253" class="m" text-anchor="middle">SHIPPING</text><path d="M685 132 V191 H825 V220" class="strong" marker-end="url(#arrow)"/><text x="730" y="181" class="s" text-anchor="middle">ship()</text><rect x="730" y="320" width="190" height="52" rx="3" class="r"/><text x="825" y="353" class="m" text-anchor="middle">COMPLETED</text><line x1="825" y1="272" x2="825" y2="320" class="l" marker-end="url(#arrow)"/><text x="808" y="302" class="s" text-anchor="end">complete()</text><rect x="300" y="220" width="180" height="52" rx="3" class="r"/><text x="390" y="253" class="m" text-anchor="middle">CANCELLED</text><line x1="390" y1="132" x2="390" y2="220" class="l" marker-end="url(#arrow)"/><text x="405" y="183" class="s" text-anchor="start">cancel()</text><path d="M595 132 V246 H480" class="l" marker-end="url(#arrow)"/><text x="555" y="278" class="s" text-anchor="middle">cancel()</text><text x="240" y="337" class="s" text-anchor="middle">CREATED에서 ship() 호출: 거부</text><text x="240" y="369" class="s" text-anchor="middle">종료 상태는 이 예에서 추가 전이 없음</text></svg>
