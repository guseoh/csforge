<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="bulk-unit-boundaries-title bulk-unit-boundaries-desc"><title id="bulk-unit-boundaries-title">대량 처리 · 읽기·전송·커밋 단위</title><desc id="bulk-unit-boundaries-desc">예시로 읽기 버퍼 1000건, 100건씩 쓰기 전송 10묶음, 1000건당 하나의 DB 트랜잭션. 전송 단위마다 커밋하는 것은 아니다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="32" class="h" text-anchor="middle">한 트랜잭션에 1,000건 · 쓰기 전송은 100건씩</text><text x="40" y="82" class="m" text-anchor="start">읽기 버퍼</text><rect x="245" y="60" width="665" height="48" rx="3" class="a"/><text x="577" y="91" class="m" text-anchor="middle">1~1,000건</text><text x="40" y="164" class="m" text-anchor="start">쓰기 batch</text><rect x="245" y="139" width="66.5" height="48" rx="3" class="a"/><text x="278.25" y="169" class="s" text-anchor="middle">1</text><rect x="311.5" y="139" width="66.5" height="48" rx="3" class="r"/><text x="344.75" y="169" class="s" text-anchor="middle">2</text><rect x="378" y="139" width="66.5" height="48" rx="3" class="r"/><text x="411.25" y="169" class="s" text-anchor="middle">3</text><rect x="444.5" y="139" width="66.5" height="48" rx="3" class="r"/><text x="477.75" y="169" class="s" text-anchor="middle">4</text><rect x="511" y="139" width="66.5" height="48" rx="3" class="r"/><text x="544.25" y="169" class="s" text-anchor="middle">5</text><rect x="577.5" y="139" width="66.5" height="48" rx="3" class="r"/><text x="610.75" y="169" class="s" text-anchor="middle">6</text><rect x="644" y="139" width="66.5" height="48" rx="3" class="r"/><text x="677.25" y="169" class="s" text-anchor="middle">7</text><rect x="710.5" y="139" width="66.5" height="48" rx="3" class="r"/><text x="743.75" y="169" class="s" text-anchor="middle">8</text><rect x="777" y="139" width="66.5" height="48" rx="3" class="r"/><text x="810.25" y="169" class="s" text-anchor="middle">9</text><rect x="843.5" y="139" width="66.5" height="48" rx="3" class="r"/><text x="876.75" y="169" class="s" text-anchor="middle">10</text><text x="577" y="211" class="s" text-anchor="middle">각 칸 = 100건 · 전송 10묶음</text><text x="40" y="275" class="m" text-anchor="start">commit 단위</text><rect x="245" y="248" width="665" height="48" rx="3" class="a"/><text x="577" y="280" class="m" text-anchor="middle">T1 : 1~1,000건</text><line x1="910" y1="272" x2="937" y2="272" class="strong" marker-end="url(#arrow)"/><text x="577" y="327" class="s" text-anchor="middle">commit 1회 · 실패 시 이 트랜잭션 범위 rollback</text><text x="480" y="366" class="s" text-anchor="middle">읽기 버퍼, JDBC batch, commit 크기는 서로 다른 설정</text></svg>
