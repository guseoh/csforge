<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="circuit-breaker-states-title circuit-breaker-states-desc"><title id="circuit-breaker-states-title">Circuit Breaker · 호출 허용 상태</title><desc id="circuit-breaker-states-desc">CLOSED에서 설정된 표본 수와 실패 또는 느린 호출 비율 조건 충족 시 OPEN. 대기 시간 후 HALF_OPEN에서 제한된 시험 호출 결과를 평가해 CLOSED 또는 OPEN으로 전이.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="400"/><text x="480" y="32" class="h" text-anchor="middle">Resilience4j의 일반적인 3상태 모델</text><rect x="55" y="95" width="235" height="62" rx="3" class="a"/><text x="172.5" y="133" class="m" text-anchor="middle">CLOSED</text><rect x="665" y="95" width="235" height="62" rx="3" class="a"/><text x="782.5" y="133" class="m" text-anchor="middle">OPEN</text><rect x="362" y="268" width="236" height="62" rx="3" class="a"/><text x="480" y="306" class="m" text-anchor="middle">HALF_OPEN</text><line x1="290" y1="126" x2="665" y2="126" class="strong" marker-end="url(#arrow)"/><text x="480" y="82" class="s" text-anchor="middle">최소 표본 + 설정 임계치 충족</text><text x="172" y="191" class="s" text-anchor="middle">호출 허용</text><text x="782" y="191" class="s" text-anchor="middle">새 호출 거절</text><path d="M782 157 V299 H598" class="l" marker-end="url(#arrow)"/><text x="732" y="279" class="s" text-anchor="middle">대기 기간 경과</text><path d="M362 299 H172 V157" class="l" marker-end="url(#arrow)"/><text x="246" y="279" class="s" text-anchor="middle">회복 판정</text><path d="M598 283 H635 V210 H740 V157" class="strong" marker-end="url(#arrow)"/><text x="620" y="237" class="s" text-anchor="end">실패 지속</text><text x="480" y="357" class="s" text-anchor="middle">제한된 시험 호출 결과를 설정에 따라 평가</text><text x="480" y="386" class="s" text-anchor="middle">timeout·동시성 제한·fallback의 책임은 별도</text></svg>
