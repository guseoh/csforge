<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="dependency-contracts-title dependency-contracts-desc"><title id="dependency-contracts-title">계층 · 소스 의존성과 실행 호출의 구분</title><desc id="dependency-contracts-desc">API가 application을, application이 domain과 내부 Repository 계약을 참조한다. DB adapter도 내부 계약에 의존한다. 런타임에는 application에서 adapter로 호출한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="31" class="h" text-anchor="middle">소스 코드 의존 방향 (실선)</text><rect x="60" y="70" width="240" height="58" rx="3" class="r"/><text x="180" y="106" class="m" text-anchor="middle">API</text><rect x="360" y="70" width="240" height="58" rx="3" class="a"/><text x="480" y="106" class="m" text-anchor="middle">Application</text><rect x="660" y="70" width="240" height="58" rx="3" class="r"/><text x="780" y="106" class="m" text-anchor="middle">Domain</text><line x1="300" y1="99" x2="360" y2="99" class="strong" marker-end="url(#arrow)"/><line x1="600" y1="99" x2="660" y2="99" class="strong" marker-end="url(#arrow)"/><text x="180" y="154" class="s" text-anchor="middle">HTTP 입출력</text><text x="480" y="154" class="s" text-anchor="middle">유스케이스 조정</text><text x="780" y="154" class="s" text-anchor="middle">불변식·행동</text><rect x="360" y="210" width="240" height="58" rx="3" class="r"/><text x="480" y="246" class="m" text-anchor="middle">Repository 계약</text><rect x="660" y="210" width="240" height="58" rx="3" class="r"/><text x="780" y="246" class="m" text-anchor="middle">JPA Adapter</text><line x1="480" y1="128" x2="480" y2="210" class="l" marker-end="url(#arrow)"/><line x1="660" y1="239" x2="600" y2="239" class="strong" marker-end="url(#arrow)"/><text x="480" y="298" class="s" text-anchor="middle">내부에 필요한 계약</text><text x="780" y="298" class="s" text-anchor="middle">외부 기술 구현</text><path d="M600 108 H632 V191 H780 V210" class="d" marker-end="url(#arrow)"/><text x="720" y="185" class="s" text-anchor="middle">실행 시 호출</text><text x="480" y="355" class="s" text-anchor="middle">도메인에서 HTTP/구체 저장소 구현을 참조하지 않는 설계 예</text></svg>
