<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="expand-migrate-contract-title expand-migrate-contract-desc"><title id="expand-migrate-contract-title">Expand · Migrate · Contract의 호환 구간</title><desc id="expand-migrate-contract-desc">기존 name과 신규 first/last를 expand에서 공존시킨다. migrate에서 기존 writer와 신규 표현을 안전하게 동기화하고 전환 검증한다. 구버전과 rollback 필요성이 사라진 후 contract에서 기존 컬럼을 삭제한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="370"/><text x="480" y="33" class="h" text-anchor="middle">구버전과 신버전이 공존하는 스키마 변경</text><text x="30" y="100" class="m" text-anchor="start">스키마</text><text x="30" y="192" class="m" text-anchor="start">읽기 / 쓰기</text><text x="30" y="282" class="m" text-anchor="start">배포 상태</text><text x="340" y="66" class="h" text-anchor="middle">Expand</text><text x="570" y="66" class="h" text-anchor="middle">Migrate</text><text x="800" y="66" class="h" text-anchor="middle">Contract</text><rect x="230" y="80" width="220" height="70" rx="3" class="r"/><text x="340" y="109" class="m" text-anchor="middle">name 유지</text><text x="340" y="135" class="s" text-anchor="middle">+ first / last</text><rect x="460" y="80" width="220" height="70" rx="3" class="a"/><text x="570" y="109" class="m" text-anchor="middle">name 유지</text><text x="570" y="135" class="s" text-anchor="middle">first / last</text><rect x="690" y="80" width="220" height="70" rx="3" class="r"/><text x="800" y="109" class="m" text-anchor="middle">first / last</text><text x="800" y="135" class="s" text-anchor="middle">name 제거</text><rect x="230" y="172" width="220" height="65" rx="3" class="r"/><text x="340" y="199" class="s" text-anchor="middle">name 기준</text><text x="340" y="222" class="s" text-anchor="middle">신규 표현 추가</text><rect x="460" y="172" width="220" height="65" rx="3" class="a"/><text x="570" y="199" class="s" text-anchor="middle">backfill / catch-up</text><text x="570" y="222" class="s" text-anchor="middle">동등성 검증</text><rect x="690" y="172" width="220" height="65" rx="3" class="r"/><text x="800" y="199" class="s" text-anchor="middle">새 표현 기준</text><text x="800" y="222" class="s" text-anchor="middle">구 표현 미사용</text><rect x="230" y="258" width="450" height="53" rx="3" class="r"/><text x="455" y="292" class="s" text-anchor="middle">구버전 writer 공존 가능 · 기존 표현 유지</text><rect x="690" y="258" width="220" height="53" rx="3" class="a"/><text x="800" y="291" class="s" text-anchor="middle">구버전 제거 확인</text><text x="480" y="347" class="s" text-anchor="middle">전환 전 최신성·동등성 확인 · rollback 허용 기간 종료 후 제거</text></svg>
