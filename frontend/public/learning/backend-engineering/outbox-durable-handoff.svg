<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="outbox-durable-handoff-title outbox-durable-handoff-desc"><title id="outbox-durable-handoff-title">비동기 전달 · 업무 변경과 Outbox 기록</title><desc id="outbox-durable-handoff-desc">같은 로컬 트랜잭션에서 업무 row와 outbox row를 기록하고 commit. 이후 relay가 broker에 발행하고 consumer가 처리한다. 발행 성공 후 relay crash 등으로 중복 전달 가능.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="380"/><text x="480" y="33" class="h" text-anchor="middle">응답 전 확정할 업무와 나중에 수행할 작업을 분리</text><rect x="45" y="66" width="390" height="185" rx="3" class="a"/><text x="240" y="95" class="h" text-anchor="middle">로컬 DB 트랜잭션 T1</text><rect x="75" y="113" width="330" height="45" rx="3" class="r"/><text x="240" y="142.5" class="m" text-anchor="middle">business row</text><rect x="75" y="177" width="330" height="45" rx="3" class="r"/><text x="240" y="206.5" class="m" text-anchor="middle">outbox row</text><text x="240" y="240" class="m" text-anchor="middle">함께 COMMIT</text><line x1="435" y1="155" x2="520" y2="155" class="strong" marker-end="url(#arrow)"/><text x="477" y="120" class="s" text-anchor="middle">commit 후</text><rect x="520" y="128" width="160" height="54" rx="3" class="r"/><text x="600" y="162" class="m" text-anchor="middle">Relay</text><line x1="680" y1="155" x2="735" y2="155" class="l" marker-end="url(#arrow)"/><rect x="735" y="128" width="185" height="54" rx="3" class="r"/><text x="827.5" y="162" class="m" text-anchor="middle">Broker</text><line x1="827" y1="182" x2="827" y2="250" class="l" marker-end="url(#arrow)"/><rect x="735" y="250" width="185" height="54" rx="3" class="a"/><text x="827.5" y="284" class="m" text-anchor="middle">Consumer</text><path d="M600 128 V98 H827 V128" class="d" marker-end="url(#arrow)"/><text x="716" y="81" class="s" text-anchor="middle">relay 재발행 가능</text><text x="480" y="332" class="s" text-anchor="middle">consumer의 중복 방지·재시도·관측은 별도 계약</text><text x="480" y="362" class="s" text-anchor="middle">DB와 메시지 브로커를 하나의 로컬 트랜잭션으로 묶은 그림이 아님</text></svg>
