<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="batch-checkpoint-restart-title batch-checkpoint-restart-desc"><title id="batch-checkpoint-restart-title">배치 재시작 · 커밋된 범위와 재처리 범위</title><desc id="batch-checkpoint-restart-desc">1000건씩 커밋하며 1~2000건을 완료한 후 2001번째 실패로 3번째 chunk가 rollback된 모델. durable checkpoint가 실제 commit과 일치하면 2001부터 재개한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="33" class="h" text-anchor="middle">1,000건 단위 commit · 2,001번째 처리 중 실패한 예</text><text x="36" y="119" class="m" text-anchor="start">첫 실행</text><rect x="235" y="90" width="215" height="48" rx="3" class="a"/><text x="342.5" y="121" class="m" text-anchor="middle">1~1,000</text><rect x="455" y="90" width="215" height="48" rx="3" class="a"/><text x="562.5" y="121" class="m" text-anchor="middle">1,001~2,000</text><rect x="675" y="90" width="245" height="48" rx="3" class="r"/><text x="797.5" y="121" class="m" text-anchor="middle">2,001~3,000</text><text x="342" y="163" class="s" text-anchor="middle">COMMIT</text><text x="562" y="163" class="s" text-anchor="middle">COMMIT</text><text x="797" y="163" class="s" text-anchor="middle">실패 → rollback</text><line x1="670" y1="70" x2="670" y2="340" class="d"/><text x="658" y="195" class="m" text-anchor="end">durable checkpoint = 2000</text><text x="36" y="262" class="m" text-anchor="start">재시작</text><rect x="235" y="233" width="215" height="48" rx="3" class="r"/><text x="342.5" y="264" class="m" text-anchor="middle">완료 유지</text><rect x="455" y="233" width="215" height="48" rx="3" class="r"/><text x="562.5" y="264" class="m" text-anchor="middle">완료 유지</text><rect x="675" y="233" width="245" height="48" rx="3" class="a"/><text x="797.5" y="264" class="m" text-anchor="middle">다시 실행</text><text x="797" y="310" class="s" text-anchor="middle">2,001부터 재개</text><text x="480" y="363" class="s" text-anchor="middle">진행 기록과 업무 결과의 일치가 전제 · 외부 효과는 별도 중복 방지</text></svg>
