<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="retry-jitter-time-axis-title retry-jitter-time-axis-desc"><title id="retry-jitter-time-axis-title">Jitter · 재시도 시점의 분산</title><desc id="retry-jitter-time-axis-desc">4개 caller가 동시에 실패한다. 고정 간격 400ms에서는 모두 같은 때 재시도하고 예시 jitter에서는 271,388,147,423ms에 재시도한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="33" class="h" text-anchor="middle">같은 시각 실패한 4개 client · 다음 재시도 1회 비교</text><text x="35" y="80" class="h" text-anchor="start">동일 간격</text><text x="145" y="110" class="s" text-anchor="middle">A</text><line x1="180" y1="105" x2="830" y2="105" class="l"/><circle cx="700" cy="105" r="6" class="a"/><text x="712" y="110" class="s" text-anchor="start">400 ms</text><text x="145" y="134" class="s" text-anchor="middle">B</text><line x1="180" y1="129" x2="830" y2="129" class="l"/><circle cx="700" cy="129" r="6" class="a"/><text x="712" y="134" class="s" text-anchor="start">400 ms</text><text x="145" y="158" class="s" text-anchor="middle">C</text><line x1="180" y1="153" x2="830" y2="153" class="l"/><circle cx="700" cy="153" r="6" class="a"/><text x="712" y="158" class="s" text-anchor="start">400 ms</text><text x="145" y="182" class="s" text-anchor="middle">D</text><line x1="180" y1="177" x2="830" y2="177" class="l"/><circle cx="700" cy="177" r="6" class="a"/><text x="712" y="182" class="s" text-anchor="start">400 ms</text><text x="35" y="225" class="h" text-anchor="start">Jitter 적용</text><text x="145" y="255" class="s" text-anchor="middle">A</text><line x1="180" y1="250" x2="830" y2="250" class="l"/><circle cx="532.3" cy="250" r="6" class="a"/><text x="544.3" y="255" class="s" text-anchor="start">271 ms</text><text x="145" y="279" class="s" text-anchor="middle">B</text><line x1="180" y1="274" x2="830" y2="274" class="l"/><circle cx="684.4000000000001" cy="274" r="6" class="a"/><text x="696.4000000000001" y="279" class="s" text-anchor="start">388 ms</text><text x="145" y="303" class="s" text-anchor="middle">C</text><line x1="180" y1="298" x2="830" y2="298" class="l"/><circle cx="371.1" cy="298" r="6" class="a"/><text x="383.1" y="303" class="s" text-anchor="start">147 ms</text><text x="145" y="327" class="s" text-anchor="middle">D</text><line x1="180" y1="322" x2="830" y2="322" class="l"/><circle cx="729.9" cy="322" r="6" class="a"/><text x="741.9" y="327" class="s" text-anchor="start">423 ms</text><text x="480" y="378" class="s" text-anchor="middle">예시 지연 분포 · 정확한 jitter 공식과 상한은 정책에 따라 다름</text><text x="480" y="407" class="s" text-anchor="middle">재시도 횟수와 전체 deadline도 함께 제한</text></svg>
