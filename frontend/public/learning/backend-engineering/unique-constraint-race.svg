<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="unique-constraint-race-title unique-constraint-race-desc"><title id="unique-constraint-race-title">사전 검증과 UNIQUE · 경쟁을 닫는 경계</title><desc id="unique-constraint-race-desc">동일 이메일이 없는 상태에서 A와 B 모두 SELECT 결과 없음. A가 INSERT 후 commit하면 B의 동일 unique key INSERT는 실패한다. PostgreSQL 일반 unique constraint의 가능한 실행 순서.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="395"/><text x="480" y="32" class="h" text-anchor="middle">두 요청이 사전 조회에 모두 성공한 경우</text><text x="200" y="76" class="m" text-anchor="middle">요청 A / T1</text><text x="760" y="76" class="m" text-anchor="middle">요청 B / T2</text><line x1="200" y1="90" x2="200" y2="320" class="d"/><line x1="760" y1="90" x2="760" y2="320" class="d"/><rect x="65" y="105" width="270" height="45" rx="3" class="r"/><text x="200" y="134.5" class="m" text-anchor="middle">SELECT → 없음</text><rect x="625" y="105" width="270" height="45" rx="3" class="r"/><text x="760" y="134.5" class="m" text-anchor="middle">SELECT → 없음</text><rect x="65" y="180" width="270" height="45" rx="3" class="a"/><text x="200" y="209.5" class="m" text-anchor="middle">INSERT email</text><rect x="65" y="250" width="270" height="45" rx="3" class="a"/><text x="200" y="279.5" class="m" text-anchor="middle">COMMIT</text><line x1="200" y1="225" x2="200" y2="250" class="strong" marker-end="url(#arrow)"/><rect x="625" y="180" width="270" height="45" rx="3" class="r"/><text x="760" y="209.5" class="m" text-anchor="middle">INSERT email</text><text x="760" y="263" class="s" text-anchor="middle">경합 시 대기 가능</text><line x1="335" y1="272" x2="610" y2="307" class="d" marker-end="url(#arrow)"/><rect x="625" y="285" width="270" height="45" rx="3" class="a"/><text x="760" y="314.5" class="m" text-anchor="middle">UNIQUE 위반</text><text x="480" y="368" class="s" text-anchor="middle">사전 조회는 빠른 피드백 · DB 제약이 최종 중복 금지</text></svg>
