<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" role="img" aria-labelledby="title desc">
  <title id="title">외부 호출 Timeout 예산과 상위 Deadline 전파</title>
  <desc id="desc">전체 요청 Deadline 1000ms 안에서 DB 조회, 외부 호출, 재시도 여부를 남은 시간 예산으로 제어하고 Read Timeout 시 원격 커밋 불확실성을 보여주는 도식</desc>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#f1f5f9; --bd:#cbd5e1; --tx:#0f172a; --sub:#475569; --blue-bg:#eff6ff; --blue-bd:#3b82f6; --blue-tx:#1d4ed8; --amber-bg:#fffbeb; --amber-bd:#f59e0b; --amber-tx:#b45309; --green-bg:#ecfdf5; --green-bd:#10b981; --green-tx:#047857; --red-bg:#fef2f2; --red-bd:#ef4444; --red-tx:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --muted:#0b1220; --bd:#334155; --tx:#f1f5f9; --sub:#94a3b8; --blue-bg:#172554; --blue-bd:#60a5fa; --blue-tx:#93c5fd; --amber-bg:#451a03; --amber-bd:#fbbf24; --amber-tx:#fcd34d; --green-bg:#064e3b; --green-bd:#34d399; --green-tx:#6ee7b7; --red-bg:#450a0a; --red-bd:#f87171; --red-tx:#fca5a5; } }
    text { font-family: "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .h1 { font-size:17px; font-weight:700; fill:var(--tx); }
    .h2 { font-size:14px; font-weight:700; }
    .b { font-size:12px; fill:var(--tx); }
    .s { font-size:11.5px; fill:var(--sub); }
    .k { font-size:11.5px; font-weight:700; }
  </style>
  <rect x="0" y="0" width="840" height="430" rx="14" fill="var(--bg)"/>
  <text x="28" y="34" class="h1">외부 호출 Timeout 예산(Remaining Budget) &amp; Read-Timeout 불확실성</text>
  <text x="28" y="54" class="s">개별 호출 timeout 합이 상위 전체 deadline을 넘지 않게 제한하고, 응답 유실 시 중복 실행을 경계한다.</text>

  <!-- Timeline Box -->
  <rect x="28" y="72" width="784" height="176" rx="10" fill="var(--card)" stroke="var(--bd)" stroke-width="1.4"/>
  <text x="46" y="98" class="h2" fill="var(--tx)">1. 상위 요청 전체 Deadline = 1,000 ms 시간 예산 배분</text>

  <!-- Time Axis -->
  <line x1="46" y1="124" x2="794" y2="124" stroke="var(--bd)" stroke-width="2"/>
  <text x="46" y="118" class="s">0 ms</text>
  <text x="406" y="118" class="s">500 ms</text>
  <text x="794" y="118" text-anchor="end" class="k" fill="var(--red-tx)">1,000 ms (Deadline)</text>

  <!-- Segments -->
  <rect x="46" y="138" width="112" height="40" rx="6" fill="var(--blue-bg)" stroke="var(--blue-bd)" stroke-width="1.4"/>
  <text x="58" y="156" class="k" fill="var(--blue-tx)">DB 조회</text>
  <text x="58" y="171" class="s">150 ms</text>

  <rect x="164" y="138" width="320" height="40" rx="6" fill="var(--green-bg)" stroke="var(--green-bd)" stroke-width="1.4"/>
  <text x="178" y="156" class="k" fill="var(--green-tx)">외부 API 1차 시도 (connect + read)</text>
  <text x="178" y="171" class="s">남은 예산 850 ms 내 상한 450 ms</text>

  <rect x="490" y="138" width="210" height="40" rx="6" fill="var(--amber-bg)" stroke="var(--amber-bd)" stroke-width="1.4"/>
  <text x="504" y="156" class="k" fill="var(--amber-tx)">조건부 Retry (남은 예산 확인)</text>
  <text x="504" y="171" class="s">예산 충분 + 멱등 시에만 수행</text>

  <rect x="706" y="138" width="88" height="40" rx="6" fill="var(--muted)" stroke="var(--bd)" stroke-width="1.2"/>
  <text x="716" y="156" class="k" fill="var(--tx)">응답 생성</text>
  <text x="716" y="171" class="s">여유 버퍼</text>

  <text x="46" y="206" class="b">• 안티패턴: 하위 호출마다 800 ms × 3회 재시도 = 최대 2,400 ms → 사용자는 이미 떠났는데 스레드·커넥션만 점유</text>
  <text x="46" y="226" class="s">• 각 HTTP 클라이언트(Java HttpClient, RestClient 등)의 connect/read/request timeout 측정 구간을 반드시 확인한다.</text>

  <!-- Bottom 2 Cards -->
  <rect x="28" y="266" width="382" height="140" rx="10" fill="var(--red-bg)" stroke="var(--red-bd)" stroke-width="1.4"/>
  <text x="46" y="292" class="h2" fill="var(--red-tx)">2. 요청 전송 후 Read Timeout ≠ 원격 실패</text>
  <text x="46" y="316" class="b">• 결제 요청 전달 → PG 승인 커밋 완료 → 응답만 유실</text>
  <text x="46" y="338" class="b">• 클라이언트는 Timeout을 보지만 원격 상태는 이미 변경됨</text>
  <text x="46" y="362" class="k" fill="var(--red-tx)">→ 멱등 키 없는 무조건 재시도는 중복 결제 유발</text>
  <text x="46" y="384" class="s">Idempotency-Key · 상태 조회 API · 대사(Reconciliation) 필수</text>

  <rect x="430" y="266" width="382" height="140" rx="10" fill="var(--card)" stroke="var(--bd)" stroke-width="1.4"/>
  <text x="448" y="292" class="h2" fill="var(--tx)">3. Timeout을 무작정 늘리면 생기는 연쇄 장애</text>
  <text x="448" y="316" class="b">• 1초 → 30초로 늘리면 느린 요청 1건이 자원을 30배 점유</text>
  <text x="448" y="338" class="b">• 워커 스레드 풀·커넥션 풀 고갈로 정상 API까지 마비</text>
  <text x="448" y="362" class="k" fill="var(--green-tx)">→ Timeout의 목적은 성공 보장이 아닌 자원 점유 상한(Bound)</text>
  <text x="448" y="384" class="s">p99 지연 + 풀 사용량 + 재시도 비율을 함께 모니터링한다</text>
</svg>
