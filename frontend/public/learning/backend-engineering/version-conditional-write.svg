<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="version-conditional-write-title version-conditional-write-desc"><title id="version-conditional-write-title">낙관적 버전 · 같은 행의 조건부 갱신</title><desc id="version-conditional-write-desc">두 트랜잭션이 ID 42 version 7을 읽는다. T1이 먼저 성공하여 version 8로 commit하면 T2의 version=7 UPDATE는 영향을 받은 행 0개다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="365"/><text x="480" y="32" class="h" text-anchor="middle">Order #42 · version 7을 읽은 두 요청</text><rect x="50" y="75" width="330" height="55" rx="3" class="r"/><text x="215" y="109.5" class="m" text-anchor="middle">T1 : expected v7</text><rect x="580" y="75" width="330" height="55" rx="3" class="r"/><text x="745" y="109.5" class="m" text-anchor="middle">T2 : expected v7</text><rect x="350" y="177" width="260" height="56" rx="3" class="a"/><text x="480" y="212" class="m" text-anchor="middle">DB : v7 → v8</text><path d="M215 130 V205 H350" class="strong" marker-end="url(#arrow)"/><text x="190" y="171" class="s" text-anchor="middle">WHERE version=7</text><path d="M745 130 V205 H610" class="d" marker-end="url(#arrow)"/><text x="772" y="171" class="s" text-anchor="middle">WHERE version=7</text><text x="215" y="265" class="m" text-anchor="middle">1 row · commit</text><text x="745" y="265" class="m" text-anchor="middle">0 rows · 충돌</text><text x="480" y="310" class="s" text-anchor="middle">T1 커밋 후 T2의 조건을 평가한 경우</text><text x="480" y="343" class="s" text-anchor="middle">0 rows 자체는 predicate 불일치 · 삭제 등 다른 원인도 가능</text></svg>
