<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="idempotency-record-state-title idempotency-record-state-desc"><title id="idempotency-record-state-title">멱등성 키 · 동일성 확인과 결과 재사용</title><desc id="idempotency-record-state-desc">키와 scope를 기준으로 record를 확보하고 fingerprint를 비교한다. 동일 fingerprint의 완료 상태는 결과를 재사용하며 다른 fingerprint는 거절한다. PROCESSING과 실패는 별도 정책.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="32" class="h" text-anchor="middle">식별자 (scope, key) · fingerprint F1</text><rect x="55" y="80" width="230" height="54" rx="3" class="r"/><text x="170" y="114" class="m" text-anchor="middle">NOT_SEEN</text><rect x="365" y="80" width="230" height="54" rx="3" class="a"/><text x="480" y="114" class="m" text-anchor="middle">PROCESSING</text><rect x="675" y="80" width="230" height="54" rx="3" class="r"/><text x="790" y="114" class="m" text-anchor="middle">COMPLETED</text><line x1="285" y1="107" x2="365" y2="107" class="strong" marker-end="url(#arrow)"/><text x="325" y="93" class="s" text-anchor="middle">예약</text><line x1="595" y1="107" x2="675" y2="107" class="strong" marker-end="url(#arrow)"/><text x="635" y="93" class="s" text-anchor="middle">확정</text><text x="480" y="168" class="s" text-anchor="middle">실패·중단 시 재시도 / 복구 정책</text><line x1="480" y1="134" x2="480" y2="150" class="d" marker-end="url(#arrow)"/><rect x="55" y="202" width="850" height="156" rx="3" class="r"/><text x="80" y="232" class="h" text-anchor="start">다음 요청에서 record를 찾은 경우</text><text x="80" y="270" class="m" text-anchor="start">F1 = F1 · PROCESSING</text><text x="560" y="270" class="s" text-anchor="start">→ 대기·충돌 등 계약에 따름</text><text x="80" y="305" class="m" text-anchor="start">F1 = F1 · COMPLETED</text><text x="560" y="305" class="s" text-anchor="start">→ 저장된 결과 재사용</text><text x="80" y="340" class="m" text-anchor="start">F2 ≠ F1</text><text x="560" y="340" class="s" text-anchor="start">→ 동일 작업 아님 · 거절</text><text x="480" y="387" class="s" text-anchor="middle">로컬 효과와 결과 기록 사이의 실패는 원자 경계·복구 정책으로 처리</text></svg>
