<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="idempotency-reservation-race-title idempotency-reservation-race-desc"><title id="idempotency-reservation-race-title">멱등성 경쟁 · 부수 효과보다 먼저 소유권 예약</title><desc id="idempotency-reservation-race-desc">동일 key A와 B가 동시에 예약을 시도한다. A가 unique record를 확보하고 commit한 예에서 B는 충돌하여 상태와 fingerprint를 확인하며 부수 효과를 중복 실행하지 않는다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="230" y="33" class="h" text-anchor="middle">잘못된 순서</text><text x="730" y="33" class="h" text-anchor="middle">예약 우선</text><line x1="480" y1="54" x2="480" y2="355" class="d"/><text x="115" y="80" class="m" text-anchor="middle">A</text><text x="350" y="80" class="m" text-anchor="middle">B</text><text x="610" y="80" class="m" text-anchor="middle">A</text><text x="845" y="80" class="m" text-anchor="middle">B</text><rect x="40" y="100" width="150" height="45" rx="3" class="r"/><text x="115" y="129.5" class="m" text-anchor="middle">SELECT 없음</text><rect x="275" y="100" width="150" height="45" rx="3" class="r"/><text x="350" y="129.5" class="m" text-anchor="middle">SELECT 없음</text><rect x="40" y="185" width="150" height="45" rx="3" class="a"/><text x="115" y="214.5" class="m" text-anchor="middle">결제 실행</text><rect x="275" y="185" width="150" height="45" rx="3" class="a"/><text x="350" y="214.5" class="m" text-anchor="middle">결제 실행</text><line x1="115" y1="145" x2="115" y2="185" class="l" marker-end="url(#arrow)"/><line x1="350" y1="145" x2="350" y2="185" class="l" marker-end="url(#arrow)"/><text x="230" y="268" class="s" text-anchor="middle">뒤늦은 키 INSERT</text><text x="230" y="300" class="s" text-anchor="middle">이미 두 번 효과가 날 수 있음</text><rect x="525" y="100" width="170" height="45" rx="3" class="a"/><text x="610" y="129.5" class="m" text-anchor="middle">예약 INSERT</text><rect x="760" y="100" width="170" height="45" rx="3" class="r"/><text x="845" y="129.5" class="m" text-anchor="middle">예약 INSERT</text><line x1="610" y1="145" x2="610" y2="185" class="strong" marker-end="url(#arrow)"/><rect x="525" y="185" width="170" height="45" rx="3" class="r"/><text x="610" y="214.5" class="m" text-anchor="middle">예약 COMMIT</text><line x1="845" y1="145" x2="845" y2="185" class="d" marker-end="url(#arrow)"/><rect x="760" y="185" width="170" height="45" rx="3" class="r"/><text x="845" y="214.5" class="m" text-anchor="middle">충돌 / 대기</text><line x1="610" y1="230" x2="610" y2="270" class="strong" marker-end="url(#arrow)"/><rect x="525" y="270" width="170" height="45" rx="3" class="a"/><text x="610" y="299.5" class="m" text-anchor="middle">효과 실행</text><line x1="845" y1="230" x2="845" y2="270" class="l" marker-end="url(#arrow)"/><rect x="760" y="270" width="170" height="45" rx="3" class="r"/><text x="845" y="299.5" class="m" text-anchor="middle">상태 재조회</text><text x="730" y="342" class="s" text-anchor="middle">동일 키·동일 요청만 결과 재사용</text><text x="480" y="389" class="s" text-anchor="middle">예약 후 crash·lease·TTL·외부 결제 결과 불명은 별도 복구 계약 필요</text></svg>
