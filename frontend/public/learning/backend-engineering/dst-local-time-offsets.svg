<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="dst-local-time-offsets-title dst-local-time-offsets-desc"><title id="dst-local-time-offsets-title">DST · 지역 시각이 가리키는 절대 시점</title><desc id="dst-local-time-offsets-desc">America/New_York 2026-03-08 02:30은 gap으로 유효 offset 0개, 2026-11-01 01:30은 overlap으로 -04:00과 -05:00 두 offset이 가능하여 UTC 05:30,06:30 두 Instant에 대응.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="390"/><text x="480" y="33" class="h" text-anchor="middle">America/New_York · 2026년 전환일</text><text x="240" y="76" class="h" text-anchor="middle">봄: gap</text><text x="720" y="76" class="h" text-anchor="middle">가을: overlap</text><line x1="480" y1="55" x2="480" y2="340" class="d"/><rect x="55" y="100" width="370" height="50" rx="3" class="r"/><text x="240" y="132" class="m" text-anchor="middle">03-08 02:30</text><text x="240" y="182" class="m" text-anchor="middle">유효 offset 0개</text><text x="240" y="235" class="s" text-anchor="middle">존재하지 않는 지역 시각</text><text x="240" y="300" class="s" text-anchor="middle">거절 / 명시적 이동 정책</text><rect x="535" y="100" width="370" height="50" rx="3" class="r"/><text x="720" y="132" class="m" text-anchor="middle">11-01 01:30</text><path d="M720 150 V190 H630 V214" class="strong" marker-end="url(#arrow)"/><path d="M720 150 V190 H810 V214" class="strong" marker-end="url(#arrow)"/><rect x="545" y="214" width="170" height="46" rx="3" class="r"/><text x="630" y="244" class="m" text-anchor="middle">-04:00</text><rect x="725" y="214" width="170" height="46" rx="3" class="r"/><text x="810" y="244" class="m" text-anchor="middle">-05:00</text><line x1="630" y1="260" x2="630" y2="289" class="l" marker-end="url(#arrow)"/><line x1="810" y1="260" x2="810" y2="289" class="l" marker-end="url(#arrow)"/><text x="630" y="315" class="m" text-anchor="middle">05:30Z</text><text x="810" y="315" class="m" text-anchor="middle">06:30Z</text><text x="480" y="370" class="s" text-anchor="middle">업무 정책으로 유효 offset을 선택하고 확정 Instant를 보존</text></svg>
