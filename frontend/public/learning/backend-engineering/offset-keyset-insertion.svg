<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="offset-keyset-insertion-title offset-keyset-insertion-desc"><title id="offset-keyset-insertion-title">페이지 경계 · 앞쪽 삽입에 따른 OFFSET과 Keyset 차이</title><desc id="offset-keyset-insertion-desc">첫 페이지 10~6 반환 후 11 삽입. OFFSET 5는 6~2 반환, keyset id&lt;6은 5~1 반환. 정렬 키가 고정된 단순 예.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="385"/><text x="480" y="33" class="h" text-anchor="middle">내림차순 ID · 페이지 크기 5 · 중간에 ID 11 삽입</text><text x="35" y="110" class="m" text-anchor="start">첫 페이지</text><rect x="225" y="82" width="60" height="44" rx="3" class="a"/><text x="255" y="111" class="m" text-anchor="middle">10</text><rect x="288" y="82" width="60" height="44" rx="3" class="a"/><text x="318" y="111" class="m" text-anchor="middle">9</text><rect x="351" y="82" width="60" height="44" rx="3" class="a"/><text x="381" y="111" class="m" text-anchor="middle">8</text><rect x="414" y="82" width="60" height="44" rx="3" class="a"/><text x="444" y="111" class="m" text-anchor="middle">7</text><rect x="477" y="82" width="60" height="44" rx="3" class="a"/><text x="50