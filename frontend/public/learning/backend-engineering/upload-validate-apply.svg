<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="upload-validate-apply-title upload-validate-apply-desc"><title id="upload-validate-apply-title">파일 업로드 · 수신과 업무 적용의 분리</title><desc id="upload-validate-apply-desc">서버가 파일 수신·자원 한도·권한을 확인하고 임시 저장 후 파싱·검증한다. 검증 실패는 정리와 오류 응답으로 가며 업무 데이터에 적용하지 않는다. 성공한 경우에도 별도의 적용 단계를 거친다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="405"/><text x="480" y="32" class="h" text-anchor="middle">전송 성공과 업무 데이터 반영은 별개</text><rect x="45" y="80" width="240" height="55" rx="3" class="r"/><text x="165" y="114.5" class="m" text-anchor="middle">HTTP 업로드</text><rect x="360" y="80" width="240" height="55" rx="3" class="r"/><text x="480" y="114.5" class="m" text-anchor="middle">임시 저장</text><rect x="675" y="80" width="240" height="55" rx="3" class="a"/><text x="795" y="114.5" class="m" text-anchor="middle">파싱 / 검증</text><line x1="285" y1="107" x2="360" y2="107" class="l" marker-end="url(#arrow)"/><line x1="600" y1="107" x2="675" y2="107" class="l" marker-end="url(#arrow)"/><text x="165" y="161" class="s" text-anchor="middle">크기·part 수·권한</text><text x="480" y="161" class="s" text-anchor="middle">서버가 위치 결정</text><text x="795" y="161" class="s" text-anchor="middle">실제 내용 확인</text><path d="M795 135 V198 H675 V230" class="strong" marker-end="url(#arrow)"/><rect x="555" y="230" width="240" height="54" rx="3" class="r"/><text x="675" y="264" class="m" text-anchor="middle">검증 성공</text><line x1="555" y1="257" x2="365" y2="257" class="strong" marker-end="url(#arrow)"/><rect x="45" y="230" width="320" height="54" rx="3" class="a"/><text x="205" y="264" class="m" text-anchor="middle">업무 데이터 적용</text><path d="M795 135 V188 H900 V320 H795" class="d" marker-end="url(#arrow)"/><rect x="555" y="293" width="240" height="54" rx="3" class="r"/><text x="675" y="327" class="m" text-anchor="middle">거절 / 오류 보고</text><text x="390" y="317" class="s" text-anchor="middle">canonical 변경 없음</text><text x="675" y="373" class="s" text-anchor="middle">실패 시 임시 자원 정리</text><text x="165" y="373" class="s" text-anchor="middle">적용도 별도 권한·원자성 확인</text></svg>
