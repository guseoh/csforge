<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="local-transaction-effects-title local-transaction-effects-desc"><title id="local-transaction-effects-title">유스케이스 · 로컬 원자성과 외부 효과</title><desc id="local-transaction-effects-desc">동일 DB의 orders, inventory, coupon 쓰기는 같은 transaction manager가 관리하는 트랜잭션 안에서 commit/rollback한다. 외부 payment/email은 자동 rollback되지 않는다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="370"/><text x="480" y="33" class="h" text-anchor="middle">placeOrder() · 동일 DB, 동일 트랜잭션을 가정</text><rect x="55" y="70" width="540" height="235" rx="3" class="a"/><text x="80" y="99" class="h" text-anchor="start">로컬 트랜잭션 T1</text><rect x="100" y="125" width="450" height="44" rx="3" class="r"/><text x="325" y="154" class="m" text-anchor="middle">orders INSERT</text><rect x="100" y="185" width="450" height="44" rx="3" class="r"/><text x="325" y="214" class="m" text-anchor="middle">inventory UPDATE</text><rect x="100" y="245" width="450" height="44" rx="3" class="r"/><text x="325" y="274" class="m" text-anchor="middle">coupon UPDATE</text><text x="325" y="335" class="s" text-anchor="middle">함께 commit 또는 rollback</text><rect x="650" y="70" width="255" height="235" rx="3" class="r"/><text x="777" y="100" class="h" text-anchor="middle">외부 효과</text><rect x="670" y="135" width="215" height="52" rx="3" class="r"/><text x="777.5" y="168" class="m" text-anchor="middle">payment HTTP</text><rect x="670" y="220" width="215" height="52" rx="3" class="r"/><text x="777.5" y="253" class="m" text-anchor="middle">email send</text><line x1="595" y1="185" x2="650" y2="185" class="d"/><text x="777" y="335" class="s" text-anchor="middle">자동 rollback 아님</text><text x="480" y="359" class="s" text-anchor="middle">외부 성공 후 로컬 실패는 별도의 복구 설계 대상</text></svg>
