<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="deadline-budget-timeline-title deadline-budget-timeline-desc"><title id="deadline-budget-timeline-title">Deadline · 전체 시간 예산과 다음 시도</title><desc id="deadline-budget-timeline-desc">전체 2000ms에서 DB 300, 첫 시도 800, backoff 200, 둘째 시도 600, 응답 100을 사용한다. 두 번째 timeout은 남은 예산을 고려한 상한이며 세 번째 시도는 시작하지 않는다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="350"/><text x="480" y="33" class="h" text-anchor="middle">상위 deadline 2,000 ms · 최대 예산의 예</text><rect x="70" y="105" width="123" height="68" rx="3" class="r"/><text x="131.5" y="147" class="s" text-anchor="middle">DB 300</text><rect x="193" y="105" width="328" height="68" rx="3" class="a"/><text x="357" y="147" class="s" text-anchor="middle">시도 1: 800</text><rect x="521" y="105" width="82" height="68" rx="3" class="r"/><text x="562" y="147" class="s" text-anchor="middle">대기 200</text><rect x="603" y="105" width="246" height="68" rx="3" class="a"/><text x="726" y="147" class="s" text-anchor="middle">시도 2: 600</text><rect x="849" y="105" width="41" height="68" rx="3" class="r"/><text x="869.5" y="147" class="s" text-anchor="middle"></text><line x1="70" y1="173" x2="70" y2="184" class="l"/><text x="70" y="208" class="s" text-anchor="middle">0</text><line x1="193" y1="173" x2="193" y2="184" class="l"/><text x="193" y="208" class="s" text-anchor="middle">300</text><line x1="521" y1="173" x2="521" y2="184" class="l"/><text x="521" y="208" class="s" text-anchor="middle">1100</text><line x1="603" y1="173" x2="603" y2="184" class="l"/><text x="603" y="208" class="s" text-anchor="middle">1300</text><line x1="849" y1="173" x2="849" y2="184" class="l"/><text x="849" y="224" class="s" text-anchor="middle">1900</text><line x1="890" y1="173" x2="890" y2="184" class="l"/><text x="890" y="208" class="s" text-anchor="middle">2000</text><text x="480" y="252" class="m" text-anchor="middle">잔여 1,700 → 900 → 700 → 100 ms</text><path d="M869.5 105 V64 H690" class="d"/><text x="684" y="69" class="s" text-anchor="end">응답용 100 ms</text><text x="480" y="296" class="s" text-anchor="middle">두 번째 시도는 남은 예산에서 응답 여유를 뺀 600 ms 이하</text><text x="480" y="329" class="s" text-anchor="middle">세 번째 시도는 예산이 없어 시작하지 않음 · 원격 효과 취소는 별도 문제</text></svg>
