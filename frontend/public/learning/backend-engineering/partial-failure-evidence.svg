<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-labelledby="partial-failure-evidence-title partial-failure-evidence-desc"><title id="partial-failure-evidence-title">부분 실패 · 남은 상태에서 복구 경로 찾기</title><desc id="partial-failure-evidence-desc">DB commit 및 외부 결제 승인까지 성공하고 이벤트 발행에서 실패한 예. 이미 승인된 결제를 재호출하지 않고 durable 기록과 provider 결과를 대조한 뒤 누락 이벤트를 안전하게 재생한다.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="425"/><text x="480" y="33" class="h" text-anchor="middle">부분 실패 이후 이미 남은 효과를 확인</text><text x="55" y="106" class="m" text-anchor="start">입력 검증</text><rect x="245" y="78" width="235" height="42" rx="3" class="r"/><text x="362" y="106" class="s" text-anchor="middle">통과</text><text x="520" y="106" class="s" text-anchor="start"></text><text x="55" y="155" class="m" text-anchor="start">로컬 DB</text><rect x="245" y="127" width="235" height="42" rx="3" class="r"/><text x="362" y="155" class="s" text-anchor="middle">commit 성공</text><text x="520" y="155" class="s" text-anchor="start">주문 기록</text><text x="55" y="204" class="m" text-anchor="start">외부 결제</text><rect x="245" y="176" width="235" height="42" rx="3" class="r"/><text x="362" y="204" class="s" text-anchor="middle">승인 성공</text><text x="520" y="204" class="s" text-anchor="start">provider 거래 ID</text><text x="55" y="253" class="m" text-anchor="start">이벤트 발행</text><rect x="245" y="225" width="235" height="42" rx="3" class="a"/><text x="362" y="253" class="s" text-anchor="middle">실패</text><text x="520" y="253" class="s" text-anchor="start">미전달 상태</text><text x="55" y="302" class="m" text-anchor="start">HTTP 응답</text><rect x="245" y="274" width="235" height="42" rx="3" class="r"/><text x="362" y="302" class="s" text-anchor="middle">미전송</text><text x="520" y="302" class="s" text-anchor="start">호출자 결과 불명</text><text x="480" y="365" class="h" text-anchor="middle">결제를 다시 하는 대신 기존 결제·주문을 확인하고 누락 이벤트를 복구</text><text x="480" y="400" class="s" text-anchor="middle">조치 후 업무 불변식 확인 · 근거 부족이면 수동 복구</text></svg>
