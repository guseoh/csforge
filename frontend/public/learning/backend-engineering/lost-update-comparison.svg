<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="lost-update-comparison-title lost-update-comparison-desc"><title id="lost-update-comparison-title">갱신 손실 · 절대값 덮어쓰기와 DB 증감</title><desc id="lost-update-comparison-desc">초기 100. 두 요청이 100을 읽고 절대값 101을 쓰면 최종 101. PostgreSQL Read Committed에서 같은 row를 SET value=value+1로 두 번 성공시키면 최종 102.</desc><style>:root{--bg:#fff;--fg:#242424;--muted:#555;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#f0f0f0;--muted:#bbb;--line:#aaa;--soft:#333}}.bg{fill:var(--bg)}.t{font:500 22px system-ui,sans-serif;fill:var(--fg)}.h{font:700 25px system-ui,sans-serif;fill:var(--fg)}.s{font:400 18px system-ui,sans-serif;fill:var(--muted)}.m{font:600 20px ui-monospace,Consolas,monospace;fill:var(--fg)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.8}.a{fill:var(--soft);stroke:var(--fg);stroke-width:3}.l{fill:none;stroke:var(--line);stroke-width:2}.strong{fill:none;stroke:var(--fg);stroke-width:3}.d{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)"/></marker></defs><rect class="bg" width="960" height="440"/><text x="235" y="33" class="h" text-anchor="middle">읽기 → 계산 → 절대값 쓰기</text><text x="725" y="33" class="h" text-anchor="middle">DB에서 현재 값으로 증가</text><line x1="480" y1="55" x2="480" y2="390" class="d"/><text x="110" y="80" class="m" text-anchor="middle">T1</text><text x="360" y="80" class="m" text-anchor="middle">T2</text><text x="610" y="80" class="m" text-anchor="middle">T1</text><text x="850" y="80" class="m" text-anchor="middle">T2</text><rect x="35" y="105" width="150" height="44" rx="3" class="r"/><text x="110" y="134" class="m" text-anchor="middle">READ 100</text><rect x="285" y="105" width="150" height="44" rx="3" class="r"/><text x="360" y="134" class="m" text-anchor="middle">READ 100</text><rect x="35" y="180" width="150" height="44" rx="3" class="a"/><text x="110" y="209" class="m" text-anchor="middle">WRITE 101</text><rect x="285" y="250" width="150" height="44" rx="3" class="a"/><text x="360" y="279" class="m" text-anchor="middle">WRITE 101</text><line x1="110" y1="149" x2="110" y2="180" class="l" marker-end="url(#arrow)"/><path d="M360 149 V250" class="l" marker-end="url(#arrow)"/><text x="110" y="245" class="s" text-anchor="middle">commit</text><text x="360" y="320" class="s" text-anchor="middle">commit</text><text x="235" y="373" class="h" text-anchor="middle">최종 101 · 1회 증가 손실</text><rect x="535" y="105" width="150" height="44" rx="3" class="a"/><text x="610" y="134" class="m" text-anchor="middle">UPDATE +1</text><text x="610" y="178" class="m" text-anchor="middle">100 → 101</text><text x="610" y="218" class="s" text-anchor="middle">commit</text><rect x="775" y="105" width="150" height="44" rx="3" class="r"/><text x="850" y="134" class="m" text-anchor="middle">UPDATE +1</text><line x1="850" y1="149" x2="850" y2="235" class="d" marker-end="url(#arrow)"/><text x="838" y="200" class="s" text-anchor="end">대기 가능</text><rect x="775" y="235" width="150" height="44" rx="3" class="a"/><text x="850" y="264" class="m" text-anchor="middle">101 → 102</text><text x="850" y="316" class="s" text-anchor="middle">commit</text><text x="725" y="373" class="h" text-anchor="middle">최종 102</text><text x="480" y="424" class="s" text-anchor="middle">같은 row · 두 트랜잭션 모두 성공하는 예시 · PostgreSQL Read Committed</text></svg>
