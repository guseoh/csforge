<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="CSForge local-first computer science learning workspace" />
    <title>CSForge</title>
    <script>
      try {
        const preference = localStorage.getItem('csforge.theme.v1')
        if (preference === 'light' || preference === 'dark') document.documentElement.dataset.theme = preference
      } catch {
        // System preference remains available when storage is blocked.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
